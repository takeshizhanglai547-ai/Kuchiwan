<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUCHIWAN - Kunitachi 3D Projects</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px}
h1{font-size:clamp(32px,8vw,64px);letter-spacing:3px;margin-bottom:8px}
.sub{color:#888;font-size:14px;margin-bottom:40px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;max-width:800px;width:100%}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);
  border-radius:12px;padding:24px;transition:all 0.3s;text-decoration:none;color:#fff;
  display:block}
.card:hover{background:rgba(79,195,247,0.15);border-color:#4fc3f7;transform:translateY(-4px)}
.card h2{font-size:22px;margin-bottom:8px;color:#4fc3f7}
.card .desc{font-size:13px;color:#aaa;line-height:1.6;margin-bottom:12px}
.card .tag{display:inline-block;background:rgba(79,195,247,0.2);color:#4fc3f7;
  padding:2px 10px;border-radius:10px;font-size:11px;margin-right:6px}
.footer{margin-top:40px;font-size:12px;color:#666;text-align:center}
</style>
</head>
<body>
  <h1>KUCHIWAN</h1>
  <div class="sub">国立をテーマにしたインタラクティブ3Dプロジェクト</div>
  <div class="cards">
    <a href="kunitachi_3d.html" class="card">
      <h2>国立駅周辺 3D Explorer</h2>
      <div class="desc">
        Googleマップをベースに再現した国立駅周辺のリアル3D空間。<br>
        大学通り、桜並木、旧駅舎、一橋大学などを歩き回れます。
      </div>
      <span class="tag">PC / スマホ対応</span>
      <span class="tag">探索</span>
    </a>
    <a href="kuchiwan_game.html" class="card">
      <h2>KUCHIWAN メカシューター</h2>
      <div class="desc">
        AC風3Dメカ弾幕シューター。<br>
        ロックオン、ブースト、ミサイル攻撃でボスを撃破せよ。
      </div>
      <span class="tag">PC専用</span>
      <span class="tag">アクション</span>
    </a>
  </div>
  <div class="footer">
    Kuchiwan Project / Built with Three.js
  </div>
</body>
</html>
