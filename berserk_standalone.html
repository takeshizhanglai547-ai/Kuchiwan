  }
  /** 3本の鉤爪（原点 = 手、+x 方向へ伸びる） */
  function claws(c, len, fill, line) {
    for (let i = -1; i <= 1; i++) {
      c.save(); c.rotate(i * 0.34);
      c.beginPath();
      c.moveTo(0, -1.4); c.quadraticCurveTo(len * 0.62, -1.8, len, 1.6 + i * 0.4); c.quadraticCurveTo(len * 0.55, 0.8, 0, 1.4);
      c.closePath(); c.fillStyle = fill; c.fill();
      if (line) { c.strokeStyle = line; c.lineWidth = 0.8; c.stroke(); }
      c.restore();
    }
  }
  /** 武器の手元座標系で描く（リグ外の手に爪を付けるときなど） */
  function atHand(c, el, hd, fn) {
    c.save(); c.translate(hd.x, hd.y); c.rotate(Math.atan2(hd.y - el.y, hd.x - el.x)); fn(); c.restore();
  }
  /** 敵の矢（弩兵） */
  function boltDraw(c, sx, sy, p) {
    const f = p.face;
    c.strokeStyle = 'rgba(255,230,200,0.28)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(sx - f * 26, sy); c.lineTo(sx - f * 12, sy); c.stroke();
    c.strokeStyle = '#5e4a32'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(sx - f * 11, sy); c.lineTo(sx + f * 6, sy); c.stroke();
    c.fillStyle = '#c4c8d0'; c.beginPath(); c.moveTo(sx + f * 11, sy); c.lineTo(sx + f * 4, sy - 2.8); c.lineTo(sx + f * 4, sy + 2.8); c.closePath(); c.fill();
    c.fillStyle = '#20100e'; c.fillRect(sx - f * 12 - 1.5, sy - 2.6, 3, 5.2);
  }
  /** 霊気の粒（悪霊の消滅など） */
  function wispBurst(x, y, z, n, col) {
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, Math.PI * 2);
      BK.fx.add({ type: 'smoke', x: x + Math.cos(a) * 8, y: y + U.rand(-3, 3), z: z + Math.sin(a) * 10, vx: Math.cos(a) * U.rand(0.6, 2), vz: Math.sin(a) * U.rand(0.5, 1.6) + 0.7, drag: 0.94, life: U.randi(20, 34), size: U.rand(3, 6), col: col || 'rgba(190,235,250,0.32)' });
    }
  }

  // ================================================================
  //  悪霊 spirit ── 無念のうちに死んだ者たちの魂の塊。
  //  漂いながら近づき、飛びついて顔に張り付き生気を吸う。レバガチャで振りほどける。
  // ================================================================
  const SP = { body: '#9ccfdc', head: '#dcf3f6', dark: '#061216', hair: '#56727c' };
  function spiritFace(c, x, y, r, open) {
    c.beginPath();
    c.ellipse(x - r * 0.45, y - r * 0.3, r * 0.28, r * 0.42, 0.2, 0, Math.PI * 2);
    c.moveTo(x + r * 0.73, y - r * 0.3);
    c.ellipse(x + r * 0.45, y - r * 0.3, r * 0.28, r * 0.42, -0.2, 0, Math.PI * 2);
    c.moveTo(x + r * 0.3, y + r * 0.5);
    c.ellipse(x, y + r * 0.5, r * 0.3, r * (0.28 + 0.5 * open), 0, 0, Math.PI * 2);
    c.fill();
  }
  function drawSpirit(c, e) {
    const M = e.def.moves, t = e.animT + e.uid * 17, fl = flashing(e);
    let alpha = 0.88, sc = 1, open = 0.3 + Math.sin(t * 0.09) * 0.12, lean = 0, reach = 0.15 + Math.sin(t * 0.07) * 0.15, hot = 0, wrap = 0;
    if (e.entry === 'rise' && e.entering > 0) alpha *= 1 - e.entering / 44;
    if (e.state === 'vanish') { const k = Math.min(1, e.st / 34); alpha *= 1 - k; sc = 1 + k * 0.7; open = 1; reach = -0.4; }
    else if (e.move === M.lunge) {
      const f = e.mf;
      if (f < 18) { const k = f / 18; open = 0.3 + k * 0.8; lean = -k * 0.6; reach = -0.5 * k; hot = k; }
      else { open = 1.1; lean = 0.7; reach = 1.3; hot = 1; }
    } else if (e.move === M.wail) {
      const f = e.mf, k = f < 26 ? f / 26 : Math.max(0, 1 - (f - 26) / 22);
      open = 0.4 + k; sc = 1 + k * 0.2; lean = -k * 0.35; reach = -0.6 * k; hot = k * 0.7;
    } else if (e.state === 'hurt' || e.state === 'fall') { lean = -0.7; open = 1; reach = -0.7; }
    if (e.latched) { wrap = 1; open = 0.6 + Math.sin(t * 0.3) * 0.3; hot = 0.5 + Math.sin(t * 0.3) * 0.5; reach = 1; }
    const sx = BK.sx(e.x), sy = BK.sy(e.y, e.z);

  // ================================================================ 共通: 床の危険表示

  /** 範囲（x0..x1, y±d）: k=0..1 は発動までの進み具合 */
  function markZone(c, x0, x1, y, d, k, hot) {
    const a = Math.min(x0, x1), bx = Math.max(x0, x1);
    const sx0 = BK.sx(a), sx1 = BK.sx(bx), sy0 = BK.sy(y - d, 0), sy1 = BK.sy(y + d, 0);
    const pulse = 0.5 + 0.5 * Math.sin(BK.frame * (0.25 + k * 0.5));

  /** 落下地点の円: prog=0..1 で内側の輪が縮む。locked で赤く */

    const sx = BK.sx(x), sy = BK.sy(y, 0);

  /** 技の mark 定義から床の表示を描く */
  function drawMoveMark(c, e, b) {
    const m = e.move;

    const mk = m.mark, f = e.mf;
    if (f < mk.f[0] || f > mk.f[1]) return;
    const k = U.clamp((f - mk.f[0]) / Math.max(1, mk.hot - mk.f[0]), 0, 1);
    const hot = f >= mk.hot;

  /** ボスごとに1つ、床の表示を担当する無害な飛び道具（影と同じタイミングで描かれる） */

    const g = BK.game;

  /** 楕円範囲の攻撃（床の円表示と一致させるため box 判定ではなく楕円で判定） */

  // ================================================================ 共通: 状態・AI

  /** 体勢崩し: エンジンの吹っ飛び（'fall'）と同じ状態にする */

  /** 手下を呼ぶ（未定義の ID は亡者兵にする） */

  /** 毎フレームの共通処理（def.update）: 被弾の記録・形態変化・アーマー窓・画面内に留める */

    const b = st(e), cfg = e.def.ai;

    if (e.dead) return;
    // 被弾の記録 → 短時間に殴られ続けたら振り払い
    const hitNow = e.hp < b.hp;
    if (hitNow) {
      b.hitLog.push(BK.frame);
      b.hp = e.hp;
      while (b.hitLog.length && BK.frame - b.hitLog[0] > 150) b.hitLog.shift();
      if (b.hitLog.length >= (b.phase === 2 ? cfg.breakN2 : cfg.breakN)) { b.hitLog.length = 0; b.breakQ = true; }
    } else if (e.hp > b.hp) b.hp = e.hp;

    if (e.state === 'hurt' && b.prevState !== 'hurt' && b.capT <= 0) b.capT = e.hitstun + (b.phase === 2 ? 50 : 40);

    if (b.armorT > 0) { b.armorT--; arm = arm || 'move'; }

  /** 標準のボスAI（def.think）: 技を1つ決め、間合いと奥行きを合わせてから出す */
  function bossThink(e, game) {

    if (e.entering && e.walkIn()) return;

    const dx = h.x - e.x, dy = h.y - e.y, adx = Math.abs(dx), ady = Math.abs(dy);
    if (b.intro > 0) { b.intro--; e.vx = 0; e.vy = 0; e.state = 'idle'; return; }

      doMove(e, b, b.mv.phase, 30);
      return;
    }
    if (b.breakQ) {
      b.breakQ = false;
      if (adx < 190 && ady < 60 && !h.dead) { doMove(e, b, b.mv.breaker, 24); return; }
    }
    if (b.cd > 0) b.cd--;

    if (heroBusy) b.plan = null;

        tx = h.x + side * want;

      e.moveToward(tx, h.y, spd, spdY);

      return;

    if (--b.slotT <= 0) { b.slotT = U.randi(50, 120); b.slotY = U.rand(-24, 24); b.pref = U.rand(cfg.pref[0], cfg.pref[1]); }
    let tx = U.clamp(h.x + side * b.pref, lo, hi);
    const ty = U.clamp(h.y + (heroBusy ? b.slotY * 1.5 : b.slotY * 0.4), 6, BK.DEPTH - 6);
    if (Math.abs(e.x - tx) > 10 || Math.abs(e.y - ty) > 6) e.moveToward(tx, ty, spd * 0.7, spdY * 0.8);

  /** 振り向き（巨体は少し遅れて向きを変える） */

  }
  /** 重み付き抽選（同じ技の連発は重みを下げる） */

    const l = list.filter(x => x && x[0] > 0).map(x => [x[1] === b.last ? x[0] * 0.35 : x[0], x[1]]);
    return l.length ? U.weighted(l) : null;
  }

  // ================================================================ 共通: 死亡演出
  const DIE_T = 160;
  function dyingK(e) { return e.state === 'dying' ? U.clamp((e.st - 70) / 80, 0, 1) : 0; }
  function dyingSink(e) { return e.state === 'dying' ? Math.max(0, e.st - 70) * 0.12 : 0; }

    const k = dyingK(e);

  }
  function onBossDie(e) {

    e.superArmor = 0; b.plan = null;

  function updateDying(e, game, b) {
    const t = ++e.st, d = e.def;

    const W = d.dieW || 120, H = d.dieH || 180;
    // 断末魔: 血が噴き出す
    if (t < 64 && t % 7 === 1) {
      const x = e.x + U.rand(-W * 0.35, W * 0.35), z = e.z + U.rand(H * 0.25, H * 0.8);
      BK.fx.blood(x, e.y, z, U.chance(0.5) ? 1 : -1, 7, e.bloodCol);
      BK.fx.add({ type: 'burst', x, y: e.y, z, life: 7, size: 16, col: '#fff2d8' });
    }
    if (t === 2) BK.audio.sfx('roar', { pitch: 0.55, vol: 0.8 });
    if (t === 62) { BK.fx.shake(5, 18); BK.audio.sfx('thud', { pitch: 0.55 }); BK.fx.dust(e.x, e.y, 10); }
    // 灰と残り火（切れ目のあたりから立ち上る）

  function sbTorso(c, sp, col, sk) {

  // --- 蛇の下半身（とぐろ・尾・立ち上がる胴）
  function ringArc(c, r, front, P) {
    if (r.rx < 3) return;
    c.beginPath(); c.ellipse(r.x, r.y, r.rx, Math.max(1, r.ry), r.a || 0, front ? 0 : Math.PI, front ? Math.PI : TAU);
    c.lineCap = 'round';
    c.lineWidth = r.w + 3; c.strokeStyle = P.line; c.stroke();
    c.lineWidth = r.w; c.strokeStyle = front ? P.scale : P.scaleDk; c.stroke();
    if (!P._white) {
      c.setLineDash([2, 4]); c.lineWidth = r.w * 0.42; c.strokeStyle = 'rgba(0,0,0,0.26)'; c.stroke(); c.setLineDash([]);

        c.lineWidth = r.w * 0.32; c.strokeStyle = P.belly; c.stroke();
      } else {
        c.beginPath(); c.ellipse(r.x, r.y - r.w * 0.3, r.rx, Math.max(1, r.ry), r.a || 0, 1.12 * Math.PI, 1.88 * Math.PI);

  }
  function snakeTube(c, pts, w0, w1, P, dark) {
    tube(c, pts, w0, w1, dark ? P.scaleDk : P.scale, P.line, 1.6);
    if (P._white) return;
    const n = pts.length >> 1, bp = [];
    for (let i = 0; i < n; i++) {
      const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
      let tx = pts[i1 * 2] - pts[i0 * 2], ty = pts[i1 * 2 + 1] - pts[i0 * 2 + 1];
      const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;
      let nx = -ty, ny = tx; if (nx + ny < 0) { nx = -nx; ny = -ny; }
      const w = w0 + (w1 - w0) * i / Math.max(1, n - 1);
      bp.push(pts[i * 2] + nx * w * 0.24, pts[i * 2 + 1] + ny * w * 0.24);
    }
    tube(c, bp, w0 * 0.36, w1 * 0.36, P.belly, null);
    c.save(); c.setLineDash([2, 4]); c.lineWidth = Math.max(1, (w0 + w1) * 0.2); c.strokeStyle = 'rgba(0,0,0,0.26)';
    polyline(c, pts); c.stroke(); c.restore();
  }
  function sbTail(c, p, P, r1, t) {
    const s = U.clamp(p.tail || 0, 0, 1), up = U.clamp(p.tailUp || 0, 0, 1);
    const e1 = (1 - Math.cos(Math.PI * s)) / 2;
    const th = Math.PI * (1 - s * 0.85);
    const bx = r1.x + Math.cos(th) * r1.rx * 0.92, by = r1.y + Math.sin(th) * r1.ry;
    const rat = up > 0 ? Math.sin(t * 1.9) * 3.5 * up : 0;
    const tx = U.lerp(-132, 186, e1) + rat, ty = -7 + Math.sin(Math.PI * s) * 22 - up * 58;
    const cx = (bx + tx) / 2 - up * 26, cy = Math.max(by, ty) + 6 + 10 * Math.sin(Math.PI * s) - up * 4;
    const pts = qpts(bx, by, cx, cy, tx, ty, 10);
    snakeTube(c, pts, 18, 4, P);
    // 尾の先のがらがら（警告音の源）
    if (!P._white) {
      const n = pts.length;
      const ax = pts[n - 2], ay = pts[n - 1], dx0 = ax - pts[n - 4], dy0 = ay - pts[n - 3], dl = Math.hypot(dx0, dy0) || 1;
      c.fillStyle = P.rattle; c.strokeStyle = P.line; c.lineWidth = 0.8;

        c.beginPath(); c.ellipse(ax + dx0 / dl * (i * 3.2 + 1), ay + dy0 / dl * (i * 3.2 + 1), 2.6 - i * 0.4, 3.4 - i * 0.5, Math.atan2(dy0, dx0), 0, TAU);

  function sbSnake(c, e, p, P, hip, t) {
    const sth = U.clamp(p.stretch || 0, 0, 1), kk = 1 - sth;
    const ex = 1 - (p.coil || 0) * 0.12;
    const wv = e.state === 'walk' ? e.walkPh : t * 0.04;
    const rings = [
      { x: -14 - sth * 50 + Math.sin(wv) * 3, y: -26, rx: 70 * ex * kk, ry: 16 * kk, w: 26, a: 0.03 },
      { x: -8 - sth * 50 + Math.sin(wv + 1.3) * 3, y: -49 + sth * 22, rx: 56 * ex * kk, ry: 14 * kk, w: 24, a: -0.05 },
      { x: -3 - sth * 50 + Math.sin(wv + 2.6) * 3, y: -70 + sth * 44, rx: 40 * ex * kk, ry: 12 * kk, w: 22, a: 0.06 },
    ];
    const showRings = kk > 0.12;
    if (showRings) for (const r of rings) ringArc(c, r, false, P);
    let tailFront = false;
    const drawTail = sth < 0.5;
    // 尾（後ろ側にあるときは先に描く）
    const s = U.clamp(p.tail || 0, 0, 1);
    tailFront = Math.sin(Math.PI * (1 - s * 0.85)) > 0.05;
    if (drawTail && !tailFront) sbTail(c, p, P, rings[0], t);
    // 伸びた胴（噛みつき突進）: 地面を這って後ろへ長く伸びる
    if (sth > 0.04) {
      const L = 40 + sth * 230, pts = [];

      }
      snakeTube(c, pts, 22, 5, P);
    }

    const r3 = rings[2];

    snakeTube(c, qpts(bx, by, hip.x - 22 + Math.sin(wv) * 4, (by + hip.y) / 2 + 2, hip.x, hip.y + 8, 10), 27, 21, P);
    if (showRings) for (const r of rings) ringArc(c, r, true, P);
    if (drawTail && tailFront) sbTail(c, p, P, rings[0], t);
  }

  function zdWing(c, col, root, w, flap, far) {
    // 翼: w=0 たたむ / 1 広げる

    const wx = root.x + U.lerp(-10, -30, w), wy = root.y + U.lerp(-24, -40, w) + fl * 6;
    const tips = [
      [U.lerp(-14, -78, w), U.lerp(-34, -62, w) + fl * 12],
      [U.lerp(-22, -92, w), U.lerp(-10, -16, w) + fl * 10],
      [U.lerp(-24, -80, w), U.lerp(18, 24, w) + fl * 6],
      [U.lerp(-20, -48, w), U.lerp(40, 42, w) + fl * 2],

    const s = far ? 0.86 : 1, ox = far ? 10 : 0, oy = far ? -4 : 0;
    const P = t => [root.x + ox + t[0] * s, root.y + oy + t[1] * s];
    const W = [wx + ox, wy + oy];
    // 膜
    c.beginPath(); c.moveTo(root.x + ox, root.y + oy); c.lineTo(W[0], W[1]);
    let prev = W;
    for (let i = 0; i < tips.length; i++) {

      if (i === 0) c.lineTo(tp[0], tp[1]);

  /** 地を這う衝撃波（跳んでかわす） */

  /** 急降下の予告: 突進の軌道を地面に帯で示す */
  function drawLane(c, e, k, lock) {

    c.fillRect(lx, gy - 1.5, lw, 3);

  function rosineUpdate(e, game) {

    if (B.stunT > 0) B.stunT--;
    if (B.dmgT > 0 && --B.dmgT === 0) B.dmgN = 0;

  function rosineThink(e, game) {
    const B = rb(e), h = game.hero;
    B.t++;
    if (B.stunT > 0) {
      e.state = 'stun'; B.fly = false;
      if (!B.stunFx && e.z <= 0) { B.stunFx = true; BK.fx.dust(e.x, e.y, 12, 'rgba(190,180,200,0.5)'); BK.fx.shake(3, 8); }
      return;
    }
    if (!B.fly) {
      // 飛び立つ
      B.fly = true; B.tz = B.baseZ; B.hk = 0.06; B.cd = Math.max(B.cd, 36);
      BK.fx.dust(e.x, e.y, 8, 'rgba(200,190,210,0.4)'); BK.audio.sfx('jump', { pitch: 0.7 });
      scales(e.x, e.y, 30, 6, 20);
    }
    e.state = 'idle';
    if (!h || h.dead) { airDrag(e, 0.92); return; }
    B.hk = e.z < B.baseZ - 12 ? 0.06 : 0.08;
    const dx = h.x - e.x, adx = Math.abs(dx), ady = Math.abs(h.y - e.y);
    const side = U.sign(e.x - h.x) || 1;
    // 滞空中に殴られ続けたら、高く舞い上がって主人公の頭上を越え反対側へ逃れる
    if (B.evade > 0) {
      B.evade--; B.tz = 100; B.hk = 0.1;
      e.vx = U.approach(e.vx, U.clamp((B.evX - e.x) * 0.08, -4.2, 4.2), 0.3);
      e.vy = U.approach(e.vy, U.clamp((h.y - e.y) * 0.05, -1.2, 1.2), 0.1);
      e.face = U.sign(dx) || e.face;
      if (B.evade === 0) B.cd = Math.min(B.cd, 6);
      return;
    }
    if (B.dmgN >= 8 && e.z > 20) {
      B.dmgN = 0; B.evade = 54;
      let ex = h.x - side * 150;
      if (ex < BK.cam.x + 80 || ex > BK.cam.x + BK.W - 80) ex = h.x + side * 150;
      B.evX = scrX(ex, 80);
      BK.audio.sfx('spirit', { pitch: 2.1, vol: 0.7 }); scales(e.x, e.y, e.z + 60, 8, 24);
      return;
    }
    B.tz = B.baseZ + Math.sin(B.t * 0.045) * 7;
    if (B.t % 170 === 1) B.pref = U.rand(100, 170);
    steer(e, scrX(h.x + side * B.pref, 80), clampY(h.y + Math.sin(B.t * 0.023) * 22), 2.3, 1.3, 1.2);
    e.face = U.sign(dx) || e.face;
    B.sinceDive++;
    if (B.summonCd > 0) B.summonCd--;
    if (B.cd > 0) { B.cd--; return; }
    if (e.z < 20) return; // 上昇中
    const list = [];
    if (adx < 78 && ady < 14) list.push([4, RM.stab]);
    list.push([B.sinceDive > 300 ? 9 : 2.2, RM.dive]);
    if (adx > 50) list.push([2, RM.powder]);
    if (B.summonCd <= 0 && countAlive(game, 'moth') < 2) list.push([2.2, RM.summon]);
    list.push([adx < 130 ? 2.6 : 1.2, RM.scream]);
    startAtk(e, B, pick(list, B.last), B.rage ? U.randi(30, 50) : U.randi(46, 72));
  }

  function mb(e) {
    return e.bs || (e.bs = { t: 0, phase: 1, form: 'human', fly: false, tz: 0, hk: 0.08, cd: 40, grabCd: 0, summoned: false, streak: 0, streakT: 0, stunT: 0, intro: 0, formAt: -99, hard: false, farT: 0, pref: 120, step: 0, last: null, tx: 0, ty: 0, dvz: 0, evade: 0, evX: 0, next: null });

  /** 石版（+x 方向に x0〜x1、幅 wid）。archEnd: 丸い頭を x1 側に描く */
  function drawTablet(c, col, x0, x1, wid, archEnd, tint) {
    const w2 = wid / 2;
    c.beginPath();
    if (archEnd) { c.moveTo(x0, -w2); c.lineTo(x1 - w2, -w2); c.arc(x1 - w2, 0, w2, -Math.PI / 2, Math.PI / 2); c.lineTo(x0, w2); }
    else { c.moveTo(x1, -w2); c.lineTo(x0 + w2, -w2); c.arc(x0 + w2, 0, w2, -Math.PI / 2, Math.PI / 2, true); c.lineTo(x1, w2); }
    c.closePath();
    c.fillStyle = col('stone'); c.fill(); c.strokeStyle = col('line'); c.lineWidth = 1.3; c.stroke();
    if (tint) return;
    // 面取りの陰
    c.fillStyle = col('stoneDark'); c.globalAlpha = 0.55;
    c.fillRect(Math.min(x0, x1) + 2, w2 - 4, Math.abs(x1 - x0) - w2 - 2, 3);
    c.globalAlpha = 1;
    // 丸い頭の紋章（車輪十字）
    const ax = archEnd ? x1 - w2 : x0 + w2;
    c.strokeStyle = col('stoneDark'); c.lineWidth = 1.4;
    c.beginPath(); dot(c, ax, 0, w2 * 0.48); c.stroke();
    c.beginPath(); c.moveTo(ax - w2 * 0.48, 0); c.lineTo(ax + w2 * 0.48, 0); c.moveTo(ax, -w2 * 0.48); c.lineTo(ax, w2 * 0.48); c.stroke();
    // 刻まれた戒律の文字列
    c.lineWidth = 1.1; c.beginPath();
    const dir = archEnd ? -1 : 1, from = archEnd ? x1 - w2 * 1.7 : x0 + w2 * 1.7, to = archEnd ? x0 + 3 : x1 - 3;
    let row = 0;
    for (let x = from; dir > 0 ? x < to : x > to; x += dir * 4.2, row++) {
      const a = -w2 * 0.66, b = w2 * 0.66, gap = ((row * 7) % 5) - 2;
      c.moveTo(x, a); c.lineTo(x, gap - 1.5); c.moveTo(x, gap + 1.5); c.lineTo(x, b - (row % 3) * 2);
    }
    c.stroke();
    // ひびと明るい縁
    c.strokeStyle = 'rgba(20,14,10,0.6)'; c.lineWidth = 0.9;
    c.beginPath(); c.moveTo((x0 + x1) / 2, -w2); c.lineTo((x0 + x1) / 2 + 3, -w2 * 0.4); c.lineTo((x0 + x1) / 2 - 1, -w2 * 0.1); c.stroke();
    c.strokeStyle = col('stoneHi'); c.lineWidth = 1; c.globalAlpha = 0.7;
    c.beginPath(); c.moveTo(x0 + 1, -w2 + 1.5); c.lineTo(x1 - w2, -w2 + 1.5); c.stroke();
    c.globalAlpha = 1;
  }

  /** 羽根の翼（付け根 x,y、方向 ang[rad]、長さ L）。前縁は +y 側、羽根先は -y 側。
   *  翼端側ほど長い風切羽が垂れ、付け根側は短い（横から見た天使の翼） */
  const WING_TIPS = [[1.12, -0.12], [1.06, -0.44], [0.96, -0.7], [0.84, -0.86], [0.7, -0.84], [0.56, -0.74], [0.42, -0.62], [0.28, -0.5], [0.14, -0.36]];
  /** 天使の翼の色（スプライト用）: tint 指定時は被弾フラッシュの白 */
  const angelCol = tint => (tint ? (k => (k === 'line' ? 'rgba(0,0,0,0.3)' : tint)) : (k => MZC_ANGEL[k] || R.DEFAULT_COLORS[k] || '#f0f'));
  function featherWing(c, x, y, ang, L, far, tint) {
    if (L < 3) return;
    const L0 = far ? 56 : 63, W0 = L0 * 0.55;
    const sp = sprite('fw' + (far ? 'f' : 'n') + (tint || ''), L0 * 1.18 + 18, W0 * 1.5 + 18, 9, W0 * 1.02 + 10, MZ_RES, sc => featherWingPaint(sc, angelCol(tint), L0, far, tint));
    c.save(); c.translate(x, y); c.rotate(ang);
    if (L !== L0) c.scale(L / L0, L / L0);
    blit(c, sp);
    c.restore();
  }
  function featherWingPaint(c, col, L, far, tint) {
    const W = L * 0.55, line = col('line');
    const outline = () => {
      c.beginPath();
      c.moveTo(0, 4);
      c.quadraticCurveTo(L * 0.3, W * 0.34, L * 0.56, W * 0.2);    // 前縁（手首へ）
      c.quadraticCurveTo(L * 0.86, W * 0.06, L * 1.12, -W * 0.12);  // 初列風切の先端
      let px = L * 1.12, py = -W * 0.12;
      for (let i = 1; i < WING_TIPS.length; i++) {
        const nx = L * WING_TIPS[i][0], ny = W * WING_TIPS[i][1];
        // 羽根と羽根の間の切れ込み → 次の羽根先（尖らせる）
        const mx = (px + nx) / 2, my = (py + ny) / 2;
        const ix = mx + (L * 0.5 - mx) * 0.16, iy = my + (0 - my) * 0.16;
        c.quadraticCurveTo(px - (px - ix) * 0.2, py - (py - iy) * 0.7, ix, iy);
        c.quadraticCurveTo(nx + (ix - nx) * 0.1, ny + (iy - ny) * 0.5, nx, ny);
        px = nx; py = ny;
      }
      c.quadraticCurveTo(L * 0.04, -W * 0.3, 0, -4);
      c.closePath();
    };
    outline();
    c.fillStyle = far ? col('wingDark') : col('wing'); c.fill();
    c.strokeStyle = line; c.lineWidth = 1.2; c.stroke();
    if (!tint) {
      // 風切羽の軸
      c.strokeStyle = col('wingLine'); c.lineWidth = 0.9; c.beginPath();
      for (const [tx, ty] of WING_TIPS) { c.moveTo(L * tx * 0.62, W * 0.1); c.lineTo(L * tx * 0.98, W * ty * 0.92); }
      c.stroke();
      // 雨覆（前縁寄りの短い羽根の列）
      c.fillStyle = far ? col('wing') : '#ffffff';
      c.globalAlpha = far ? 0.22 : 0.55;
      c.beginPath(); c.moveTo(2, 2);
      c.quadraticCurveTo(L * 0.3, W * 0.3, L * 0.56, W * 0.18); c.quadraticCurveTo(L * 0.76, W * 0.08, L * 0.9, -W * 0.02);
      for (let i = 1; i <= 7; i++) {
        const k = i / 7, x2 = U.lerp(L * 0.9, L * 0.04, k), y2 = -W * (0.08 + Math.sin(k * Math.PI * 0.8) * 0.3);
        c.quadraticCurveTo(x2 + 5, y2 - 6, x2, y2);
      }
      c.closePath(); c.fill();
      c.globalAlpha = 1;
      // 金の前縁
      c.strokeStyle = col('gold'); c.lineWidth = 1.7;
      c.beginPath(); c.moveTo(1, 3.5); c.quadraticCurveTo(L * 0.3, W * 0.33, L * 0.56, W * 0.19); c.quadraticCurveTo(L * 0.86, W * 0.05, L * 1.1, -W * 0.11); c.stroke();
    }
  }
  /** 石版（スプライト）: 原点から +x 方向へ x0〜x0+42、丸い頭は +x 側 */
  function tabletAt(c, col, x0, tint) {

  function mzRobe(c, sp, col, sk, pose, opt) {

    for (let i = 1; i <= n; i++) c.lineTo(U.lerp(fr, bk, i / n), hem + (i % 2 ? 2.6 : -0.8));

      c.strokeStyle = col('trim'); c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(fr, hem - 2); for (let i = 1; i <= n; i++) c.lineTo(U.lerp(fr, bk, i / n), hem - 2 + (i % 2 ? 2.6 : -0.8)); c.stroke();

      c.strokeStyle = col('stoleDark'); c.lineWidth = 0.9;

      sfx: [[2, 'magic', { pitch: 0.45, vol: 0.8 }]],
      onFrame(e, f) {
        const B = mb(e);
        if (f === 0) B.tz = 30;
        airDrag(e, 0.88);
        if (f === 31 || (B.hard && f === 52)) {
          groundRing(e, { kind: 'holy', dmg: 13, spd: 4.2, life: 72 });
          BK.audio.sfx('magic', { pitch: 1.2 }); BK.audio.sfx('cannon', { pitch: 1.8, vol: 0.4 });
          BK.fx.flash('#fff2c0', 4); BK.fx.shake(3, 8);
          for (let i = 0; i < 5; i++) feather(e.x + U.rand(-30, 30), e.y, e.z + U.rand(60, 110));
        }
      },
    },
    // [第2形態] 石版の薙ぎ払い（近距離）: 石版を振りかぶる（18F）→ 振り下ろす
    swat: {
      angel: true, dur: 52, armor: true,
      kf: [[0, {}], [18, { aB: 176, eB: 8, aF: 50, eF: 50, lean: -12, head: -8 }], [23, { aB: 64, eB: 8, aF: 30, eF: 40, lean: 26, head: 8 }, 'snap'],
        [36, { aB: 60, eB: 10, aF: 30, eF: 40, lean: 24, head: 8 }], [52, {}]],
      hits: [{ f: [21, 25], x: [4, 118], z: [-40, 128], d: 18, dmg: 14, kb: 'heavy', push: 5, stop: 7, sfx: 'hitHeavy' }],
      sfx: [[3, 'growl', { pitch: 0.55, vol: 0.5 }], [19, 'swingHeavy', { pitch: 0.7 }]],
      onFrame(e, f) { const B = mb(e); if (f === 0) B.tz = 24; airDrag(e, 0.85); },
    },
    // 変身: 跪いて祈る → 天からの光 → 閃光とともに翼と光輪 → 咆哮して舞い上がる（無敵）
    transform: {
      dur: 156, armor: true, invul: [0, 156],
      kf: [[0, { lF: 78, kF: 92, lB: -12, kB: 104, lean: 18, head: 24, aF: 58, eF: 80, aB: 52, eB: 86, palm: 1, tab: 'G' }],
        [56, { lF: 78, kF: 92, lB: -12, kB: 104, lean: 22, head: 30, aF: 60, eF: 82, aB: 54, eB: 88, palm: 1, tab: 'G' }],
        [62, { lF: 16, kF: 18, lB: -8, kB: 26, lean: -14, head: -28, aF: 146, eF: 8, aB: -146, eB: -8, palm: 1, tab: 'B' }, 'snap'],
        [100, { lF: 16, kF: 18, lB: -8, kB: 26, lean: -12, head: -24, aF: 142, eF: 10, aB: -142, eB: -10, palm: 1, tab: 'B' }],
        [156, { lF: 22, kF: 34, lB: -4, kB: 40, lean: 2, head: -4, aF: 110, eF: 10, aB: -60, eB: 30, palm: 1, tab: 'B' }]],
      sfx: [[4, 'magic', { pitch: 0.4 }]],
      onFrame(e, f) {
        const B = mb(e);
        e.vx = 0; e.vy = 0;
        if (f < 58 && f % 2 === 0) BK.fx.add({ type: 'dot', x: e.x + U.rand(-40, 40), y: e.y + U.rand(-6, 6), z: U.rand(0, 40), vz: U.rand(1.5, 3.5), life: U.randi(24, 40), col: U.choose(['#fff2c0', '#ffd870', '#ffffff']), size: U.rand(1.5, 2.5) });
        if (f === 58) {
          B.form = 'angel'; B.formAt = e.animT;
          e.bloodCol = '#d8b870';
          BK.fx.flash('#fff6d8', 26); BK.fx.shake(9, 34);
          BK.audio.sfx('explode', { pitch: 0.6, vol: 0.9 });
          BK.fx.ring(e.x, e.y, 60, 160, '#fff2c0', 26);
          for (let i = 0; i < 16; i++) feather(e.x + U.rand(-40, 40), e.y, U.rand(40, 130));
        }
        if (f === 64) BK.audio.sfx('roar', { pitch: 0.75 });
        if (f === 100) { B.fly = true; B.tz = 48; B.hk = 0.035; }
      },
      onEnd(e) {
        const B = mb(e);
        B.phase = 2; B.form = 'angel'; B.cd = 40; B.hk = 0.08; B.fly = true; B.tz = 48;
        e.poise = e.def.poise;
        e.dmgTakenMul = 0.85; // 天使の加護
      },
    },
  };

  // ---------------------------------------------------------- 描画
  function mozPose(e, B, angel) {
    if (e.move && e.move.kf) return R.sample(e.move.kf, e.mf, e.move.angel ? ST2 : ST1);
    const st = angel ? ST2 : ST1;
    if (e.state === 'stun') return R.merge(STUN2, { head: STUN2.head + Math.sin(e.animT * 0.3) * 3, lean: STUN2.lean + Math.sin(e.animT * 0.11) * 2 });
    const rp = e.reactionPose(st);
    if (rp) return rp;
    if (B.intro > 0) return INTRO;
    if (!angel && e.state === 'walk') return R.walk(ST1, e.walkPh, WALK1);
    if (angel) {
      const s = Math.sin(e.animT * 0.05);
      return R.merge(ST2, { lean: ST2.lean + s * 2, aF: ST2.aF + s * 4, aB: ST2.aB - s * 4, lF: ST2.lF + s * 5, lB: ST2.lB - s * 5 });
    }
    return R.idle(ST1, e.animT);
  }
  function drawMozgus(c, e) {
    const B = mb(e);
    if (!e.spec) e.spec = MZ_SPEC;
    const angel = B.form === 'angel' || !!(e.move && e.move.angel);
    const pose = mozPose(e, B, angel);
    const sx = BK.sx(e.x), gy = BK.sy(e.y, 0);
    // 変身: 天から差す光の柱
    if (e.move === MM.transform) {
      const f = e.mf, k = f < 20 ? f / 20 : f < 70 ? 1 : Math.max(0, 1 - (f - 70) / 40);
      if (k > 0) {
        c.save(); c.globalCompositeOperation = 'lighter';
        c.globalAlpha = 0.22 * k; c.fillStyle = '#ffe6a0'; c.fillRect(sx - 58, 0, 116, gy + 8);
        c.globalAlpha = 0.35 * k; c.fillStyle = '#fff4d0'; c.fillRect(sx - 30, 0, 60, gy + 6);
        c.globalAlpha = 0.5 * k; c.fillRect(sx - 10, 0, 20, gy + 4);
        c.restore();
      }
    }
    let glow = 0;
    if (e.move === MM.pillar) glow = Math.min(1, e.mf / 14);
    else if (e.move === MM.ring) glow = e.mf < 31 ? e.mf / 31 : Math.max(0, 1 - (e.mf - 31) / 20);
    else if (e.move === MM.dive && e.mf < 30) glow = e.mf / 30 * 0.5;
    const wingK = !angel ? 0 : B.form === 'angel' ? U.clamp((e.animT - B.formAt) / 22, 0, 1) : 1;
    let flap = 1, wingBase = -2.3, wingS = 1;
    if (e.move === MM.dive) { if (e.mf >= 30 && e.mf < 50) { wingBase = -2.7; flap = 0.2; } else if (e.mf >= 50) { wingBase = -2.9; flap = 0.1; } }
    else if (e.state === 'stun') { wingBase = -2.95; flap = 0.08; }
    else if (e.move === MM.ring && e.mf >= 26 && e.mf < 60) { wingBase = -1.95; flap = 0.3; }
    else if (e.state === 'down' || e.state === 'dead') { wingBase = -1.4; flap = 0; wingS = 0.8; }
    c.save();
    if (e.state === 'dead') c.globalAlpha = Math.max(0, 1 - Math.max(0, e.st - 10) / 90);
    e.drawRig(c, pose, { colors: angel ? MZC_ANGEL : null, angel, wingK, glow, flap, wingBase, wingS });
    c.restore();
    e.drawTrail(c);
  }

  // ---------------------------------------------------------- AI
  function mozUpdate(e, game) {
    const B = mb(e);
    if (e.dead) {
      e.superArmor = 0; B.fly = false;
      if (e.state === 'dead' && e.st < 90 && e.st % 4 === 0) {
        if (B.form === 'angel') feather(e.x + U.rand(-40, 40), e.y, U.rand(10, 50));
        BK.fx.add({ type: 'dot', x: e.x + U.rand(-40, 40), y: e.y + U.rand(-5, 5), z: U.rand(0, 30), vz: U.rand(0.6, 1.6), life: U.randi(26, 40), col: B.form === 'angel' ? '#fff2c0' : '#b0a898', size: 2 });
      }
      return;
    }
    if (B.stunT > 0) B.stunT--;
    if (B.streakT > 0 && --B.streakT <= 0) B.streak = 0;
    if (B.grabCd > 0) B.grabCd--;
    if (B.phase === 1 && e.hp <= e.maxHp * 0.5 && e.state !== 'fall') startTransform(e, game);
    else if (B.phase === 1 && e.state === 'hurt' && B.streak >= 6) { B.streak = 0; e.hitstun = 0; e.startMove(MM.repel); }
    if (B.phase > 1) {
      flyUpdate(e, B);
      B.hard = e.hp < e.maxHp * 0.3;
      if (B.form === 'angel' && e.z > 4 && e.animT % 12 === 0) feather(e.x - e.face * U.rand(10, 40), e.y, e.z + U.rand(70, 110));
    }
    if (e.move !== MM.dive) e.x = U.clamp(e.x, BK.cam.x + 26, BK.cam.x + BK.W - 26);
    // 重い足音
    if (B.phase === 1 && e.state === 'walk') {
      const s = Math.floor(e.walkPh / Math.PI);
      if (s !== B.step) { B.step = s; BK.fx.dust(e.x + e.face * 6, e.y, 2); BK.audio.sfx('thud', { pitch: 0.7, vol: 0.25 }); }
    }
  }
  function mozThink1(e, game, B) {
    const h = game.hero;
    if (B.intro > 0) {
      B.intro--; e.state = 'idle'; e.vx = 0; e.vy = 0;
      if (B.intro === 1) BK.audio.sfx('growl', { pitch: 0.4 });
      return;
    }
    if (!h || h.dead) { e.state = 'idle'; e.vx = 0; e.vy = 0; return; }
    const dx = h.x - e.x, adx = Math.abs(dx), ady = Math.abs(h.y - e.y);
    e.face = U.sign(dx) || e.face;
    if (B.cd > 0) B.cd--;
    if (adx > 170) B.farT++; else B.farT = 0;
    if (B.cd <= 0) {
      if (!B.summoned && (e.hp < e.maxHp * 0.85 || B.t > 840)) { B.summoned = true; startAtk(e, B, MM.summon, 40); return; }
      const list = [];
      if (adx < 90 && ady < 14) list.push([3, MM.palm]);
      if (adx < 82 && ady < 12) list.push([2.2, MM.flurry]);
      if (adx < 76 && ady < 12 && B.grabCd <= 0 && canGrab(h)) list.push([2.4, MM.seize]);
      if (adx < 140 && ady < 24) list.push([1.5, MM.slam]);
      if (adx > 170 && B.farT > 90) list.push([4, MM.slam]);
      if (list.length) { startAtk(e, B, pick(list, B.last), U.randi(30, 58)); B.farT = 0; return; }
    }
    const want = 64;
    if (adx > want + 10 || ady > 6) e.moveToward(h.x - U.sign(dx) * want, h.y, 0.85, 0.62);
    else { e.vx = 0; e.vy = 0; e.state = 'idle'; }
    e.face = U.sign(dx) || e.face;
  }
  function mozThink2(e, game, B) {
    const h = game.hero;
    if (B.stunT > 0) { e.state = 'stun'; B.fly = false; return; }
    if (!B.fly) {
      B.fly = true; B.tz = 48; B.hk = 0.06; B.cd = Math.max(B.cd, 24); B.streak = 0;
      BK.fx.dust(e.x, e.y, 8); BK.audio.sfx('jump', { pitch: 0.5 });
      for (let i = 0; i < 4; i++) feather(e.x + U.rand(-30, 30), e.y, U.rand(40, 90));
    }
    e.state = 'idle';
    if (!h || h.dead) { airDrag(e, 0.9); return; }
    B.hk = e.z < 36 ? 0.06 : 0.08;
    B.tz = 46 + Math.sin(B.t * 0.04) * 6;
    const dx = h.x - e.x, adx = Math.abs(dx), ady = Math.abs(h.y - e.y);
    const side = U.sign(e.x - h.x) || 1;
    // 滞空中に殴られ続けたら、高く舞い上がって反対側へ移り、光の柱を降らせる
    if (B.evade > 0) {
      B.evade--; B.tz = 104; B.hk = 0.09;
      e.vx = U.approach(e.vx, U.clamp((B.evX - e.x) * 0.08, -3.6, 3.6), 0.25);
      e.vy = U.approach(e.vy, U.clamp((h.y - e.y) * 0.05, -1, 1), 0.08);
      e.face = U.sign(dx) || e.face;
      if (B.evade === 0) { B.cd = 0; B.next = MM.pillar; }
      return;
    }
    if (B.streak >= 8 && e.z > 20) {
      B.streak = 0; B.evade = 50;
      let ex = h.x - side * 160;
      if (ex < BK.cam.x + 70 || ex > BK.cam.x + BK.W - 70) ex = h.x + side * 160;
      B.evX = scrX(ex, 70);
      BK.audio.sfx('magic', { pitch: 0.6 }); BK.fx.ring(e.x, e.y, e.z + 60, 70, '#fff2c0', 14);
      for (let i = 0; i < 6; i++) feather(e.x + U.rand(-30, 30), e.y, e.z + U.rand(50, 110));
      return;
    }
    if (B.t % 200 === 1) B.pref = U.rand(90, 150);
    steer(e, scrX(h.x + side * B.pref, 40), h.y, 1.7, 1.2, 1.0, 0.1);
    e.face = U.sign(dx) || e.face;
    if (B.cd > 0) { B.cd--; return; }
    if (e.z < 24) return;
    if (B.next) { const m = B.next; B.next = null; startAtk(e, B, m, B.hard ? 24 : 36); return; }
    const list = [];
    if (adx < 84 && ady < 16) list.push([4, MM.swat]);
    list.push([3, MM.pillar]);
    if (adx > 40) list.push([2.4, MM.dive]);
    if (adx < 200) list.push([2, MM.ring]);
    startAtk(e, B, pick(list, B.last), B.hard ? U.randi(24, 40) : U.randi(36, 60));
  }
  function mozThink(e, game) {
    const B = mb(e);
    B.t++;
    if (B.phase === 1) mozThink1(e, game, B);
    else mozThink2(e, game, B);
  }

  BK.registerEnemy({
    id: 'mozgus', name: 'モズグス', title: '異端審問官', boss: true,
    hp: 750, poise: 90, w: 56, h: 140, weight: 3, speed: 0.85, score: 6000, bossBonus: 50000,
    grabbable: false, drop: null, bloodCol: '#8a0c14', dieSfx: 'roar', diePitch: 0.6, shadowR: 30,
    draw: drawMozgus,
    moves: MM,
    onSpawn(e) {
      const B = mb(e);
      bossCommon(e);
      e.spec = MZ_SPEC;
      e.deadTime = 120; e.downTime = 40;
      B.intro = 80; B.cd = 24;
      e.onDamaged = () => { B.streak++; B.streakT = 80; B.intro = 0; };
      e.onShakeOff = () => mozShakeOff(e);
      BK.audio.sfx('bell', { pitch: 0.7 });
    },
    update: mozUpdate,
    think: mozThink,
    onDie(e) {
      const B = mb(e);
      B.fly = false; e.drawLayer = 0;
      if (e.grabbing) e.releaseHero();
      BK.fx.ring(e.x, e.y, e.z + 60, 120, B.form === 'angel' ? '#fff2c0' : '#ffd0a0', 26);
      if (B.form === 'angel') for (let i = 0; i < 14; i++) feather(e.x + U.rand(-40, 40), e.y, e.z + U.rand(40, 130));
    },
  });
})(window.BK);

</script>
<script>/* js/boss_final.js */
'use strict';
/* =====================================================================
 *  boss_final.js ── 最終ボス「フェムト」 ゴッド・ハンド 闇の鷹（ROUND 6「蝕」）
 *
 *  見た目（自前描画: rig の骨格に独自パーツを載せる）
 *   ・鷹の嘴を持つ兜、漆黒の滑らかな鎧、背に巨大な黒い羽の翼（常にゆっくり羽ばたく）
 *   ・背後に「蝕」の光輪（黒い円盤 + 光冠）。形態ごとに色が変わる（金 → 紫 → 紅）
 *   ・普段は宙に浮かび（z≈46）静かに漂う。大技の後は地に降りて膝をつく ＝ 反撃の好機
 *
 *  フェアさの約束
 *   ・攻撃はすべて 30F 以上前から予告（床の表示・手の光・きらめき・効果音）
 *   ・ダメージ 13〜24（上限 28）。大技の後は z=0 で膝をつき、のけぞる＆被ダメージ 1.25 倍
 *   ・空中にいる間はスーパーアーマー（ダメージは通る）。殴られ続けると転移で離れる
 *
 *  形態: 体力 100〜66% / 66〜33% / 33〜0%。形態変化は無敵の演出（暗転・閃光・バナー）
 *  技:
 *   shock  念動衝撃波 … 足元の紋様が光る → 地を這う輪が広がる（跳んでかわす）。形態ごとに 1/2/3 連
 *   crush  重圧       … 床に紫の円が現れ、内側の輪が縮みきると押し潰す（円の外へ）
 *   wing   転移・翼斬 … 消えて、黒い羽の渦と赤い斬撃範囲が現れる → 範囲の外へ。後に大きな隙
 *   bolt   闇の雷柱   … 床の帯と空からの細い光で予告。第2形態から交互に落ちる（落ちた所へ移る）
 *   summon 使徒召喚   … 生贄の烙印の場所から使徒・蛾が出る（同時数に上限）
 *   buffet 翼の薙ぎ払い… 近くに居座ると、足元の赤い円で予告して全周をなぎ払う
 *   beam   蝕の光線（第3形態）… 奥/手前の「列」全体が赤く光り、矢印の向きへ光線が掃く
 *                              → 光っていない列へ移るか、跳んでかわす。続けて反対の列も掃く
 *  床の予告は「無害な飛び道具」の drawShadow（影の描画タイミング＝キャラより奥）で描き、
 *  柱や光線そのものは drawFn（キャラより手前）で描く。
 * ===================================================================== */
(function (BK) {
  const U = BK.U, R = BK.rig;
  const TAU = Math.PI * 2, PI = Math.PI;

  // ================================================================ 定数
  const HOVER_Z = 46;                        // 通常の浮遊高度
  const LANE_Y = BK.DEPTH / 2;               // 奥の列 / 手前の列 の境目（蝕の光線）
  const PH_AT = [0, 0.66, 0.33];             // この体力比を下回ると次の形態へ
  const SUM_LIM = [0, 2, 3, 3];              // 手下の同時数の上限
  const SUM_CD = [0, 720, 600, 540];         // 召喚の再使用間隔
  const GLIDE = [0, 1.1, 1.3, 1.5];          // 滑空の速さ
  const REST = [0, [46, 70], [34, 54], [24, 42]];  // 技の後の間
  const BLINK_N = [0, 8, 7, 6];              // 短時間にこの回数殴られたら転移で離れる
  const DIE_T = 215;                         // 消滅演出の長さ
  const CR_RX = 40, CR_RY = 18;              // 重圧の円
  const BOLT_HW = 18;                        // 雷柱の半幅

  // ================================================================ 色
  const COL = {
    armor: '#1c1a26', armorHi: '#36314a', beak: '#5a5478', beakDk: '#2a2638', armorDk: '#100e17', rim: '#8a86b8', rimDk: '#4c4868',
    skin: '#d6ccd2', lip: '#6e4a56',
    wing: '#120f1a', wingMid: '#17131f', wingTop: '#221c2e', wingDk: '#0b0910', wingEdge: '#5a4c7a',
    line: 'rgba(4,2,8,0.92)',
  };
  const WHITE = '#f2ecff';
  /** 形態ごとの魔力の色 */
  const PHC = [null,
    { glow: '#b48cff', core: '#f6eeff' },
    { glow: '#9a66ff', core: '#f0e4ff' },
    { glow: '#ff4060', core: '#ffe8ec' },
  ];
  const VIO = { fill: '#8a4cff', edge: '#d8c0ff' };
  const RED = { fill: '#ff2244', edge: '#ffa0ae' };
  /** 光輪: [中心側, 光冠, 外周, 光条, 縁] */
  const HALO = [null,
    ['rgba(255,244,220,0.95)', 'rgba(255,170,90,0.7)', 'rgba(160,30,50,0.22)', '#ffdcaa', '#fff6e2'],
    ['rgba(244,232,255,0.95)', 'rgba(170,112,255,0.66)', 'rgba(90,20,140,0.26)', '#dcc6ff', '#f8f0ff'],
    ['rgba(255,228,228,0.95)', 'rgba(255,52,82,0.74)', 'rgba(140,0,24,0.34)', '#ff94a2', '#ffecee'],
  ];

  // ================================================================ ポーズ
  // rig のキー + wo(翼の開き 0..1) wf(羽ばたき -1..1) ws(翼の前後の振り) glow(手の光) gh(光る手 1:前 2:奥 3:両方) toe(爪先 0:下向き 1:前向き)
  const ST = { lean: -2, head: 6, aF: 14, eF: 26, aB: -14, eB: 24, lF: 16, kF: 36, lB: -6, kB: 30, w: 0, rot: 0, lift: 0, hx: 0, drop: 0, cape: 0,

    R.limb(c, el.x, el.y, hd.x, hd.y, sp.armW * 0.85, sp.armW * 0.6, fill, col('line'));
    // 肘の棘
    const ua = Math.atan2(el.y - sh.y, el.x - sh.x), ux = Math.cos(ua), uy = Math.sin(ua);
    R.poly(c, [el.x - uy * 2.6, el.y + ux * 2.6, el.x + ux * 7, el.y + uy * 7, el.x + uy * 2.6, el.y - ux * 2.6], hi, col('line'));
    // 鉤爪
    const fa = Math.atan2(hd.y - el.y, hd.x - el.x), cx = Math.cos(fa), cy = Math.sin(fa), px = -cy, py = cx;
    c.beginPath();
    for (let i = -1; i <= 1; i++) {
      const bx = hd.x + px * i * 1.7, by = hd.y + py * i * 1.7, L = 7.5 - Math.abs(i) * 1.5;
      c.moveTo(bx + px * 0.9, by + py * 0.9); c.lineTo(bx + cx * L + px * i * 1.3, by + cy * L + py * i * 1.3); c.lineTo(bx - px * 0.9, by - py * 0.9);
    }
    c.fillStyle = hi; c.fill();
    R.circle(c, hd.x, hd.y, sp.armW * 0.42, fill, col('line'));
    // 肩当て（羽根状に重なる板）
    R.poly(c, [sh.x + 4, sh.y - 1, sh.x - 2, sh.y - 5.5, sh.x - 12, sh.y - 8, sh.x - 6, sh.y - 1, sh.x - 10, sh.y + 3, sh.x - 3, sh.y + 5, sh.x + 4, sh.y + 3], hi, col('line'));
    if (!back && !opt.tint) {
      c.strokeStyle = col('rim'); c.lineWidth = 1;
      c.beginPath(); c.moveTo(sh.x - 1, sh.y - 5); c.lineTo(sh.x - 11, sh.y - 7.5); c.stroke();
    }
  }
  function fLeg(c, sp, col, hip, kn, ft, back, pose, opt) {
    const fill = col(back ? 'armorDk' : 'armor');
    R.limb(c, hip.x, hip.y, kn.x, kn.y, sp.legW, sp.legW * 0.8, fill, col('line'));
    R.limb(c, kn.x, kn.y, ft.x, ft.y, sp.legW * 0.78, sp.legW * 0.42, fill, col('line'));
    // 膝当て
    R.poly(c, [kn.x + 5, kn.y - 1.5, kn.x, kn.y - 4.5, kn.x - 2.5, kn.y + 1, kn.x + 1, kn.y + 3.5], col(back ? 'armorDk' : 'armorHi'), col('line'));
    // 尖った爪先（浮遊中は下へ、膝をつくと前へ）
    const sa = Math.atan2(ft.y - kn.y, ft.x - kn.x);
    const ta = U.lerp(sa, 0.12, U.clamp(pose.toe || 0, 0, 1));
    const tx = Math.cos(ta), ty = Math.sin(ta);
    R.poly(c, [ft.x - ty * 2.6, ft.y + tx * 2.6, ft.x + tx * 9.5, ft.y + ty * 9.5, ft.x + ty * 2.6, ft.y - tx * 2.6], fill, col('line'));
    if (!back && !opt.tint) {
      c.strokeStyle = col('rim'); c.lineWidth = 0.9;
      const a = Math.atan2(kn.y - hip.y, kn.x - hip.x), nx = -Math.sin(a) * 3.2, ny = Math.cos(a) * 3.2;
      c.beginPath(); c.moveTo(hip.x - nx, hip.y - ny); c.lineTo(kn.x - nx * 0.8, kn.y - ny * 0.8); c.stroke();
    }
  }
  /** 手に宿る魔力の光 */
  function fFront(c, sp, col, sk, pose, opt) {
    const g = pose.glow || 0;
    if (g <= 0.02 || opt.tint) return;
    const gh = pose.gh || 0, pc = PHC[(opt.fm && opt.fm.phase) || 1];
    const A0 = c.globalAlpha;
    for (const hd of [(gh & 1) ? sk.hdF : null, (gh & 2) ? sk.hdB : null]) {
      if (!hd) continue;
      const fl = 0.85 + 0.15 * Math.sin((opt.t || 0) * 0.6 + hd.x);
      c.fillStyle = pc.glow;
      c.globalAlpha = A0 * 0.22 * g; c.beginPath(); c.arc(hd.x, hd.y, (6 + 7 * g) * fl, 0, TAU); c.fill();
      c.globalAlpha = A0 * 0.5 * g; c.beginPath(); c.arc(hd.x, hd.y, (3 + 3 * g) * fl, 0, TAU); c.fill();
      c.fillStyle = pc.core; c.globalAlpha = A0 * 0.95 * g; c.beginPath(); c.arc(hd.x, hd.y, 1.6 + 1.2 * g, 0, TAU); c.fill();
    }
    c.globalAlpha = A0;
  }
  const SPEC = R.makeSpec({
    scale: 1.3, thigh: 21, shin: 23, torso: 30, neck: 5, headR: 8.6, upper: 17, fore: 16,
    legW: 8, armW: 6.5, waistW: 11, chestW: 20, shoulderOff: 2, weaponLen: 0,
    colors: COL,
    draw: { head: fHead, torso: fTorso, arm: fArm, leg: fLeg, behind: fBehind, front: fFront },
  });

  // ---------------------------------------------------------------- 画面座標の小物
  /** 予備動作の「きらめき」（画面座標） */
  function glint(c, x, y, s, a, col) {
    if (a <= 0) return;
    c.save(); c.globalAlpha = Math.min(1, a); c.fillStyle = col || '#f4ecff';
    c.beginPath();
    c.moveTo(x, y - s); c.lineTo(x + s * 0.17, y - s * 0.17); c.lineTo(x + s, y); c.lineTo(x + s * 0.17, y + s * 0.17);
    c.lineTo(x, y + s); c.lineTo(x - s * 0.17, y + s * 0.17); c.lineTo(x - s, y); c.lineTo(x - s * 0.17, y - s * 0.17);
    c.closePath(); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(x, y, s * 0.2, 0, TAU); c.fill();
    c.restore();
  }
  function drawGlints(c, e, anc) {
    const m = e.move;
    if (!m || !m.glint) return;
    for (const g of m.glint) {
      const d = e.mf - g[0];
      if (d < 0 || d > 12) continue;
      const p = anc[g[1]];
      if (!p) continue;
      const k = d < 4 ? d / 4 : 1 - (d - 4) / 8;
      glint(c, p[0], p[1], 7 + 11 * k, k + 0.2, g[2]);
    }
  }
  /** 小さな羽根の形（画面座標） */
  function featherShape(c, x, y, ang, s, col) {
    c.save(); c.translate(x, y); c.rotate(ang);
    c.fillStyle = col;
    c.beginPath(); c.moveTo(-s, 0); c.quadraticCurveTo(0, -s * 0.34, s, 0); c.quadraticCurveTo(0, s * 0.26, -s, 0); c.fill();
    c.restore();
  }
  function drawFeatherP(c, sx, sy, k, p) {
    const age = p.max - p.life;
    c.save();
    c.globalAlpha = Math.min(1, k * 2.5);
    c.translate(sx, sy); c.rotate(p.rot + age * p.vr);
    const s = p.size;
    c.fillStyle = p.col;
    c.beginPath(); c.moveTo(-s, 0); c.quadraticCurveTo(0, -s * 0.34, s, 0); c.quadraticCurveTo(0, s * 0.26, -s, 0); c.fill();
    c.strokeStyle = 'rgba(140,120,190,0.55)'; c.lineWidth = 0.6;
    c.beginPath(); c.moveTo(-s * 1.15, 0); c.lineTo(s * 0.8, 0); c.stroke();
    c.restore();
  }
  /** 舞い散る黒い羽根（fx の custom パーティクル） */
  function featherFx(x, y, z, vx, vz, life, size, col) {
    BK.fx.add({ type: 'custom', x, y, z, vx, vz, g: 0.03, drag: 0.95, life, size, rot: U.rand(0, TAU), vr: U.rand(-0.14, 0.14), col: col || U.choose(['#0e0b14', '#17121f', '#221a2c']), draw: drawFeatherP });
  }
  function featherBurst(e, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, TAU);
      featherFx(e.x + Math.cos(a) * 12, e.y + U.rand(-4, 4), e.z + U.rand(40, 130), Math.cos(a) * U.rand(0.8, spd || 3.5), U.rand(-0.5, 2.5), U.randi(40, 70), U.rand(4, 7));
    }
  }

  // ================================================================ 床の予告（画面座標で描く）
  function pulse(sp) { return 0.5 + 0.5 * Math.sin(BK.frame * sp); }
  /** 床の楕円: k=0..1 は発動までの進み具合（内側の輪が縮む） */
  function floorOval(c, x, y, rx, ry, k, hot, pal) {
    const sx = BK.sx(x), sy = BK.sy(y, 0), pu = pulse(hot ? 0.9 : 0.3 + 0.4 * k);
    c.save();
    c.beginPath(); c.ellipse(sx, sy, rx, ry, 0, 0, TAU);
    c.globalAlpha = hot ? 0.34 + 0.14 * pu : 0.1 + 0.2 * k + 0.05 * pu; c.fillStyle = pal.fill; c.fill();
    c.globalAlpha = 0.55 + 0.4 * pu; c.strokeStyle = pal.edge; c.lineWidth = 1.8; c.stroke();
    const kk = 1 - U.clamp(k, 0, 1);
    if (kk > 0.05) { c.globalAlpha = 0.8; c.lineWidth = 1.3; c.beginPath(); c.ellipse(sx, sy, rx * kk, ry * kk, 0, 0, TAU); c.stroke(); }
    // 紋様の刻み（回る）
    c.globalAlpha = 0.45 + 0.35 * k; c.lineWidth = 1.2; c.beginPath();
    const rot = BK.frame * 0.02;
    for (let i = 0; i < 8; i++) {
      const a = rot + i * TAU / 8, ca = Math.cos(a), sa = Math.sin(a);
      c.moveTo(sx + ca * rx * 0.74, sy + sa * ry * 0.74); c.lineTo(sx + ca * rx * 0.94, sy + sa * ry * 0.94);
    }
    c.stroke();
    c.restore();
  }
  /** 床の長方形（斬撃範囲など） */
  function floorRect(c, x0, x1, y0, y1, k, hot, pal) {
    const a = Math.min(x0, x1), b = Math.max(x0, x1);
    const sx0 = BK.sx(a), sx1 = BK.sx(b), sy0 = BK.sy(y0, 0), sy1 = BK.sy(y1, 0);
    const pu = pulse(hot ? 0.9 : 0.25 + k * 0.4);
    c.save();
    c.globalAlpha = hot ? 0.38 + 0.12 * pu : 0.08 + 0.22 * k + 0.06 * pu; c.fillStyle = pal.fill;
    c.fillRect(sx0, sy0, sx1 - sx0, sy1 - sy0);
    c.globalAlpha = 0.5 + 0.4 * pu; c.strokeStyle = pal.edge; c.lineWidth = 1.6;
    c.setLineDash([7, 5]); c.lineDashOffset = -BK.frame * 0.6; c.strokeRect(sx0, sy0, sx1 - sx0, sy1 - sy0); c.setLineDash([]);
    c.restore();
  }

  // ================================================================ 攻撃の器（無害な飛び道具 + 独自の当たり判定）
  function hazard(e, o) {
    const g = BK.game;
    if (!g || !g.addProjectile) return null;
    const step = o.step;
    const p = new BK.Projectile(Object.assign({ x: e.x, y: e.y, z: 0, w: 1, h: 1, team: 'enemy', owner: e, harmless: true, life: 600, noShadow: true }, o));
    p.tick = function (pp) {
      // ボスが倒れたら（または別のゲームになったら）すべて消える
      if (e.dead || e.remove || BK.game !== g) { pp.remove = true; return; }
      // 予告だけの表示は、技が中断されたら消す（攻撃の来ない予告を残さない）
      if (pp.bind && e.move !== pp.bind) { pp.remove = true; return; }
      if (step) step(pp, e);
    };
    g.addProjectile(p);
    return p;
  }
  /** 主人公側への当たり判定（test が true の相手に h を当てる）。p があれば同じ相手には1回だけ */
  function strike(e, p, test, h) {
    const g = BK.game;
    if (!g) return false;
    let any = false;
    for (const t of g.actors) {
      if (t.team !== 'hero' || !t.hurtable || (p && p.hit.has(t))) continue;
      if (!test(t)) continue;
      const dir = (p && p.pushDir) || U.sign(t.x - (p ? p.x : e.x) || e.face);
      if (t.takeHit(e, h, dir)) { if (p) p.hit.add(t); BK.combat.hitFx(e, t, h, t.x, dir); any = true; }
    }
    return any;
  }
  function minionCount(e, g) {
    let n = 0;
    if (!g) return 0;
    for (const a of g.actors) if (a.team === 'enemy' && a !== e && !a.dead && !a.isProp) n++;
    return n;
  }

  /** 足元の紋様（技の予告。ボスについて動く） */
  function runeMarker(e, T, rx, ry, pal) {
    return hazard(e, {
      T, life: T, rx, ry, pal, bind: e.move,
      step(p) { p.x = e.x; p.y = e.y; },
      drawShadow(c) { floorOval(c, this.x, this.y, this.rx, this.ry, this.t / this.T, this.t >= this.T - 8, this.pal); },
      drawFn() {},
    });
  }

  // ---------------------------------------------------------------- 念動衝撃波（地を這う輪）
  function spawnRing(e, dmg, spd) {
    const hdef = { dmg, kb: 'down', push: 4, lift: 5, stop: 4, sfx: 'hitHeavy' };
    const col = PHC[st(e).phase];
    return hazard(e, {
      r: 18, spd, life: 140, col,
      step(p) {
        p.r += p.spd;
        if (p.r > 540) { p.remove = true; return; }
        strike(e, p, t => t.z < 20 && Math.abs(Math.hypot(t.x - p.x, (t.y - p.y) * 2.2) - p.r) < 12 + t.w / 2, hdef);
        if (p.t % 2 === 0) {
          const a = U.rand(0, TAU), x = p.x + Math.cos(a) * p.r, y = p.y + Math.sin(a) * p.r / 2.2;
          if (y > 0 && y < BK.DEPTH && x > BK.cam.x - 20 && x < BK.cam.x + BK.W + 20) BK.fx.add({ type: 'smoke', x, y, z: 3, vz: U.rand(0.5, 1.4), life: 18, size: U.rand(5, 9), col: 'rgba(90,60,120,0.4)', drag: 0.95 });
        }
      },
      drawShadow(c) { drawRingHalf(c, this, true); },
      drawFn(c) { drawRingHalf(c, this, false); },
    });
  }
  /** 輪の奥半分はキャラの後ろ（drawShadow）、手前半分はキャラの前（drawFn）に描く */
  function drawRingHalf(c, p, back) {
    const sx = BK.sx(p.x), sy = BK.sy(p.y, 0), rx = p.r, ry = p.r / 2.2;
    const fade = Math.min(1, (540 - p.r) / 140, p.r / 30);
    const a0 = back ? PI : 0, a1 = back ? TAU : PI;
    c.save();
    c.strokeStyle = p.col.glow;
    c.globalAlpha = 0.3 * fade; c.lineWidth = 14;
    c.beginPath(); c.ellipse(sx, sy - 9, rx, ry, 0, a0, a1); c.stroke();
    c.strokeStyle = p.col.core;
    c.globalAlpha = 0.95 * fade; c.lineWidth = 2.6;
    c.beginPath(); c.ellipse(sx, sy, rx, ry, 0, a0, a1); c.stroke();
    c.globalAlpha = 0.5 * fade; c.lineWidth = 1.2;
    c.beginPath(); c.ellipse(sx, sy - 18, rx, ry, 0, a0, a1); c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------- 重圧（床の円 → 押し潰す）
  function crushCircle(e, x, y, T, dmg) {
    const hdef = { dmg, kb: 'down', push: 3, lift: 6.5, stop: 6, sfx: 'hitHeavy' };
    return hazard(e, {
      x, y, T, life: T + 28, seed: U.randi(1, 99999),
      step(p) {
        if (p.t === p.T) {
          strike(e, p, t => { const dx = (t.x - p.x) / (CR_RX + t.w / 2), dy = (t.y - p.y) / CR_RY; return dx * dx + dy * dy <= 1 && t.z < 150; }, hdef);
          BK.fx.shake(4, 10);
          BK.fx.ring(p.x, p.y, 2, 64, '#d8c0ff', 14);
          BK.fx.dust(p.x, p.y, 6, 'rgba(50,30,70,0.55)');
          for (let i = 0; i < 6; i++) BK.fx.add({ type: 'dot', x: p.x + U.rand(-20, 20), y: p.y + U.rand(-6, 6), z: 2, vx: U.rand(-2.5, 2.5), vz: U.rand(2, 5), g: 0.3, life: U.randi(18, 30), col: U.choose(['#3a2a44', '#5a4a60', '#c8b0ff']), size: U.rand(1.5, 3) });
          BK.audio.sfx('cannon', { pitch: 1.3, vol: 0.5 });
        } else if (p.t < p.T && p.t % 5 === 0) {
          // 円へ吸い込まれる光の粒（重圧が溜まっていく）
          BK.fx.add({ type: 'dot', x: p.x + U.rand(-CR_RX, CR_RX) * 0.8, y: p.y + U.rand(-8, 8), z: U.rand(50, 90), vz: -2.2, life: 22, col: '#b890ff', size: 1.6 });
        }
      },
      drawShadow(c) {
        const p = this;
        if (p.t < p.T) { floorOval(c, p.x, p.y, CR_RX, CR_RY, p.t / p.T, p.t >= p.T - 8, VIO); return; }
        // 陥没の跡
        const k = Math.max(0, 1 - (p.t - p.T) / 28), sx = BK.sx(p.x), sy = BK.sy(p.y, 0);
        c.save();
        c.globalAlpha = 0.6 * k; c.fillStyle = '#07040b';
        c.beginPath(); c.ellipse(sx, sy, CR_RX * 0.9, CR_RY * 0.9, 0, 0, TAU); c.fill();
        c.globalAlpha = 0.7 * k; c.strokeStyle = '#8a60d0'; c.lineWidth = 1.2;
        const r = U.srand(p.seed);
        c.beginPath();
        for (let i = 0; i < 7; i++) {
          const a = r() * TAU, l = 0.6 + r() * 0.6;
          c.moveTo(sx + Math.cos(a) * CR_RX * 0.3, sy + Math.sin(a) * CR_RY * 0.3); c.lineTo(sx + Math.cos(a) * CR_RX * l, sy + Math.sin(a) * CR_RY * l);
        }
        c.stroke();
        c.restore();
      },
      drawFn(c) {
        const p = this, d = p.t - p.T;
        if (d < -10 || d > 8) return;
        const sx = BK.sx(p.x), sy = BK.sy(p.y, 0);
        c.save();
        if (d < 0) {
          // 落ちてくる重圧の影
          const k = (d + 10) / 10;
          c.globalAlpha = 0.22 * k; c.fillStyle = '#2a1040';
          c.fillRect(sx - CR_RX * 0.7 * k, 0, CR_RX * 1.4 * k, sy);
        } else {
          const k = 1 - d / 8;
          c.globalAlpha = 0.5 * k; c.fillStyle = '#3a1860';
          c.fillRect(sx - CR_RX * 0.85, 0, CR_RX * 1.7, sy);
          c.globalAlpha = 0.85 * k; c.fillStyle = '#ece2ff';
          c.fillRect(sx - 5 * k - 1, 0, 10 * k + 2, sy);
          c.globalAlpha = 0.8 * k; c.strokeStyle = '#f0e6ff'; c.lineWidth = 2.5;
          c.beginPath(); c.ellipse(sx, sy, CR_RX * (1.1 - k * 0.3), CR_RY * (1.1 - k * 0.3), 0, 0, TAU); c.stroke();
        }
        c.restore();
      },
    });
  }
  /** 重圧の円を n 個: 1つ目は主人公の足元、残りは離して散らす */
  function crushWave(e, n, T, dmg) {
    const g = BK.game, h = g && g.hero;
    const lo = BK.cam.x + 50, hi = BK.cam.x + BK.W - 50;
    const pts = [];
    if (h && !h.dead) pts.push([U.clamp(h.x, lo, hi), U.clamp(h.y, 10, BK.DEPTH - 10)]);
    let tries = 0;
    while (pts.length < n && tries++ < 80) {
      const x = U.rand(lo, hi), y = U.rand(12, BK.DEPTH - 12);
      if (pts.every(q => Math.hypot(q[0] - x, (q[1] - y) * 2.2) > 100)) pts.push([x, y]);
    }
    for (const q of pts) crushCircle(e, q[0], q[1], T, dmg);
  }

  // ---------------------------------------------------------------- 闇の雷柱（奥行き全体を貫く帯）
  function boltColumn(e, x, T, dmg) {
    const hdef = { dmg, kb: 'down', push: 3.5, lift: 6, stop: 5, sfx: 'hitHeavy' };
    return hazard(e, {
      x, y: LANE_Y, T, life: T + 18, seed: U.randi(1, 99999),
      step(p) {
        if (p.t === p.T) {
          strike(e, p, t => Math.abs(t.x - p.x) < BOLT_HW + t.w / 2 && t.z < 220, hdef);
          BK.fx.shake(3, 8);
          for (let i = 0; i < 5; i++) BK.fx.add({ type: 'line', x: p.x, y: U.rand(10, BK.DEPTH - 10), z: 4, vx: U.rand(-4, 4), vz: U.rand(1, 5), life: 10, col: '#e8d8ff', size: 1.4, drag: 0.85 });
          BK.fx.add({ type: 'burst', x: p.x, y: LANE_Y, z: 6, life: 7, size: 22, col: '#f4ecff' });
          BK.audio.sfx('explode', { pitch: 1.7, vol: 0.45 });
        }
      },
      drawShadow(c) {
        const p = this, sx = BK.sx(p.x), sy0 = BK.sy(0, 0), sy1 = BK.sy(BK.DEPTH, 0), d = p.t - p.T;
        c.save();
        if (d < 0) {
          const k = p.t / p.T, hot = d > -8, pu = pulse(hot ? 0.9 : 0.3 + 0.4 * k);
          c.globalAlpha = hot ? 0.36 + 0.14 * pu : 0.07 + 0.22 * k + 0.05 * pu; c.fillStyle = VIO.fill;
          c.fillRect(sx - BOLT_HW, sy0, BOLT_HW * 2, sy1 - sy0);
          c.globalAlpha = 0.45 + 0.4 * pu; c.strokeStyle = VIO.edge; c.lineWidth = 1.4;
          c.beginPath(); c.moveTo(sx - BOLT_HW, sy0); c.lineTo(sx - BOLT_HW, sy1); c.moveTo(sx + BOLT_HW, sy0); c.lineTo(sx + BOLT_HW, sy1); c.stroke();

  }
  function updateDying(e, game, F) {
    const t = ++e.st;
    e.gravMul = 0; e.vz = 0; e.vx = 0; e.vy = 0; e.shadowR = t < 150 ? 30 : 0;
    // 静かに浮かび上がる
    e.z = U.lerp(F.dieZ, Math.max(F.dieZ, 72), U.ease.inOut(Math.min(1, t / 120)));

    }

  }

  // ================================================================ 描画
  function femtoPose(e, F) {
    let p;
    if (e.state === 'dying') p = samp(DIE_KF, e.st, ST);
    else if (e.state === 'intro') p = lerpPose(F_VANISH, ST, U.ease.inOut(U.clamp((F.introT - 28) / 90, 0, 1)));
    else if (e.move && e.move.kf) p = samp(e.move.kf, e.mf, ST);
    else if (e.state === 'stagger') {
      p = Object.assign({}, F_STAG);

    // ゆっくりとした翼の呼吸

  function drawIntroFx(c, e, F) {
    const t = F.introT;

  function drawDeathLight(c, e, sx, sy, sk) {

    const cy = sk ? sy + (sk.sho.y + sk.hip.y) / 2 * sc : BK.sy(e.y, e.z + 70);

      const k = U.clamp((t - 16) / 90, 0, 1), fk = t > 150 ? 1 - (t - 150) / 40 : 1;
      const r = U.srand(e.uid * 31 + 7);

      c.beginPath();

        const a = r() * TAU, l = (14 + r() * 50) * k;

        c.lineTo(cx + Math.cos(a) * l, cy + Math.sin(a) * l);
      }
      c.stroke();
    }
    // 最後の光球
    if (t > 140 && t < 202) {
      const k = t < 186 ? (t - 140) / 46 : Math.max(0, 1 - (t - 186) / 16);
      c.globalAlpha = 0.3 * k; c.fillStyle = '#e8dcff'; c.beginPath(); c.arc(cx, cy, 12 + 44 * k, 0, TAU); c.fill();
      c.globalAlpha = 0.9 * k; c.fillStyle = '#ffffff'; c.beginPath(); c.arc(cx, cy, 3 + 13 * k, 0, TAU); c.fill();
    }
    c.restore();
  }

    const F = st(e);

    const dying = e.state === 'dying';

    if (dying) { white = U.clamp((e.st - 30) / 100, 0, 1); fade = U.clamp((e.st - 128) / 58, 0, 1); }

  BK.registerEnemy({

})(window.BK);

<script>/* js/stages.js */
'use strict';
/* =====================================================================
 *  stages.js ── ステージ進行（カメラ・ウェーブ・ボス）と背景描画ヘルパー
 *
 *  ステージ定義: BK.stages[i] = {
 *    id: 1, name: '黒い剣士', sub: '紅い月の城下町', len: 3600,
 *    bgm: 'stage1', bossBgm: 'boss',
 *    intro: '物語のナレーション（2〜3行）',
 *    heal: 0.3,                                       // ステージ開始時の体力回復率
 *    autoscroll: { speed: 1.2, until: 3000 },         // 強制スクロール（任意）
 *    props: [{ x, y, type:'barrel', item:'meat' }],   // 壊せる物
 *    events: [                                        // カメラ位置 at で発動
 *      { at: 300, waves: [ [ {t:'undead', side:'R', y:40, delay:0, palette:'bone', entry:'rise', x:400}, ... ], [...] ], lock: true, next: 0 },
 *      { at: 3000, boss: 'snakeBaron', x: 520, y: 60, waves: [[...minions]] },
 *    ],
 *    init(game), update(game),                        // 任意
 *    drawBg(c, game), drawFg(c, game),                // 背景 / 前景
 *    floorTint,                                       // 任意
 *  }
 *  spawn の side: 'R' 右画面外 / 'L' 左画面外 / x 指定で画面内（entry:'drop'|'rise'|'jump'）
 * ===================================================================== */
(function (BK) {
  const U = BK.U, C = BK.combat;

  // ================================================================ bg helpers
  const BG = BK.bg = {
    _cache: new Map(),
    /** オフスクリーンに一度だけ描いてキャッシュ（解像度変化で作り直し） */
    layer(key, w, h, fn) {
      // 倍率を段階化: URLバー等でわずかに renderScale が変わっても全レイヤーを作り直さない
      const r = BK.renderScale, rs = r > 1.5 ? 2 : r > 1.1 ? 1.5 : 1;
      const k = key + '@' + rs.toFixed(2);
      let cv = this._cache.get(k);

        if (this._rs !== rs) { this._rs = rs; for (const [key, old] of Array.from(this._cache)) if (!key.endsWith('@' + rs.toFixed(2))) { old.width = old.height = 0; this._cache.delete(key); } }
        cv = document.createElement('canvas');

        const c = cv.getContext('2d');

        cv.lw = w; cv.lh = h;
        this._cache.set(k, cv);

      }

    },
    /** 横方向にループするレイヤーを視差スクロールで描く */
    tile(c, cv, factor, y, offset) {
      const w = cv.lw;
      let x = -((BK.cam.x * factor + (offset || 0)) % w);

      for (; x < BK.W; x += w) c.drawImage(cv, x, y, w, cv.lh);
    },
    /** 縦グラデーションの空 */
    sky(c, stops, y0, y1) {

    /** 石畳の床（パースつき）: 画面座標で描く */

      while (rowY < H) {
        c.moveTo(0, rowY); c.lineTo(BK.W, rowY);
        const bw = rowH * 2.6;

        rowY += rowH; rowH *= 1.16; row++;

      c.stroke();
      if (o.shade !== false) {
        const s = c.createLinearGradient(0, top, 0, top + 40);
        s.addColorStop(0, 'rgba(0,0,0,0.55)'); s.addColorStop(1, 'rgba(0,0,0,0)');

    },
    /** 霧（画面全体に流れる） */
    fog(c, t, col, alpha, y) {
      c.save();
      c.globalAlpha = alpha || 0.18;
      c.fillStyle = col || '#8a8090';
      for (let i = 0; i < 5; i++) {
        const x = ((t * (0.2 + i * 0.07) + i * 260 - BK.cam.x * 0.3) % (BK.W + 400)) - 200;
        const yy = (y || BK.FLOOR_TOP - 20) + Math.sin(t * 0.01 + i) * 10 + i * 18;

    /** 画面の周辺減光 */
    vignette(c, strength) {

    },
    /** 雨 */
    rain(c, t, n, col) {
      c.strokeStyle = col || 'rgba(170,180,200,0.35)'; c.lineWidth = 1;
      c.beginPath();
      for (let i = 0; i < (n || 60); i++) {
        const x = (i * 97 + t * 3 - BK.cam.x * 0.2) % (BK.W + 40) - 20;
        const y = (i * 53 + t * 11) % (BK.H + 40) - 20;
        c.moveTo(x, y); c.lineTo(x - 4, y + 12);
      }
      c.stroke();
    },
  };

  // ================================================================ Game
  class Game {
    constructor(heroId, opt) {
      opt = opt || {};
      this.heroId = heroId;
      this.stageIdx = opt.stage || 0;
      this.score = 0;
      this.continues = 0;
      this.diffMul = 1;
      this.hero = null;
      this.hiscore = BK.save.get('hiscore', 50000);
      this.totalKills = 0;
      BK.game = this;
    }
    // ------------------------------------------------------------ setup
    loadStage(idx) {
      this.stageIdx = idx;
      const st = this.stage = BK.stages[idx];
      if (!st) throw new Error('stage ' + idx + ' missing');
      this.actors = []; this.projectiles = []; this.items = [];
      C.tokens = 0;
      BK.fx.reset();
      BK.cam.x = 0; this.camMin = 0;
      this.lock = null; this.lockEnemies = null;
      this.events = (st.events || []).map(e => Object.assign({ done: false }, e)).sort((a, b) => a.at - b.at);
      this.evIdx = 0;
      this.boss = null; this.bossDefeated = false; this.clearT = 0;
      this.time = 0; this.kills = 0; this.damageTaken = 0;
      this.freezeT = 0; this.freezer = null;
      this.banners = []; this.goT = 0; this.combo = 0; this.comboT = 0; this.maxCombo = 0;
      this.lastHitEnemy = null;
      this.continueT = 0; this.over = false;
      const def = BK.heroes[this.heroId];
      if (!this.hero) this.hero = new BK.Hero(def, 90, BK.DEPTH * 0.55);
      const h = this.hero;
      if (h.awkT > 0 && def.awaken && def.awaken.end) def.awaken.end(h);
      if (h.move) h.endMove();
      h.x = 90; h.y = BK.DEPTH * 0.55; h.z = 0; h.vx = h.vy = h.vz = 0; h.state = 'idle'; h.move = null;
      h.face = 1; h.dead = false; h.invul = 60; h.grabbing = null; h.grabbedBy = null; h.hitCount = 0;
      h.awkT = 0; h.dmgMul = 1; h.speedMul = 1; h.superArmor = 0; h.dmgTakenMul = 1; h.reloading = 0; h.ammo = def.shot.max;
      if (idx > 0) h.hp = Math.min(h.maxHp, h.hp + Math.round(h.maxHp * (st.heal == null ? 0.35 : st.heal)));
      this.actors.push(h);
      for (const p of st.props || []) this.spawnProp(p.type || 'barrel', p.x, p.y, p.item);
      if (st.init) st.init(this);
      BK.audio.playSong(st.bgm || 'stage1');
    }
    // ------------------------------------------------------------ spawners
    spawnEnemy(id, o) {
      o = o || {};
      let def = BK.enemyTypes[id];
      if (!def) { console.warn('unknown enemy', id); def = BK.enemyTypes.undead; }
      let x = o.x, y = o.y != null ? o.y : U.rand(8, BK.DEPTH - 8);
      let entry = o.entry || def.entry || 'walk';
      if (o.side === 'R') { x = BK.cam.x + BK.W + 30 + (o.off || 0); entry = o.entry || (def.entry === 'rise' || def.entry === 'drop' ? 'walk' : def.entry || 'walk'); }
      else if (o.side === 'L') { x = BK.cam.x - 30 - (o.off || 0); entry = o.entry || (def.entry === 'rise' || def.entry === 'drop' ? 'walk' : def.entry || 'walk'); }
      else if (x == null) x = BK.cam.x + U.rand(80, BK.W - 80);
      else if (o.screen) x = BK.cam.x + x;
      const e = new BK.Enemy(def, x, y, Object.assign({}, o, { entry }));
      e.face = x > (this.hero ? this.hero.x : 0) ? -1 : 1;
      if (o.hp) { e.hp = e.maxHp = o.hp; }
      this.actors.push(e);
      if (def.onSpawn) def.onSpawn(e, this);
      if (this.stage && this.stage.onSpawn) this.stage.onSpawn(e, this);

    }
    spawnProp(type, x, y, item) {

        if (e.team !== 'enemy' || e.dead || !e.grabbable || e.z > 2 || e.move || e.intangible) continue;
        if (e.state !== 'idle' && e.state !== 'walk' && e.state !== 'hurt') continue;
        if (Math.abs(e.y - h.y) > 9) continue;

      return null;
    }
    // ------------------------------------------------------------ hooks
    onHeroDealt(dmg) {
      this.addScore(dmg * 10);
      this.combo++; this.comboT = 70;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
    }
    onHeroHurt(dmg) { this.damageTaken += dmg; this.combo = 0; }
    onEnemyKilled(e) {
      this.kills++; this.totalKills++;
      this.addScore(e.scoreValue || 100);
      if (e.boss) { this.onBossKilled(e); return; }
      const d = e.def;
      let drop = d.drop === undefined ? 'common' : d.drop;
      if (drop && BK.dropTable[drop]) drop = U.weighted(BK.dropTable[drop]);
      if (drop && BK.itemDefs[drop]) this.spawnItem(drop, e.x, e.y, 30);
    }
    onBossKilled(e) {
      if (this.bossDefeated) return;
      this.bossDefeated = true;
      this.clearT = 1;
      BK.fx.flash('#ffffff', 20); BK.fx.shake(10, 40); BK.fx.slowmo = 90;
      BK.audio.sfx('roar', { pitch: 0.8 }); BK.audio.stopSong(1.5);
      // 残りの敵も消滅
      for (const a of this.actors) if (a.team === 'enemy' && a !== e && !a.dead) { a.hp = 0; a.die(this.hero, { dmg: 99 }, U.sign(a.x - e.x || 1)); }
      this.addScore(e.def.bossBonus || 20000);
    }
    // ------------------------------------------------------------ update
    update() {
      const fx = BK.fx;
      this.time++;
      if (this.banners.length) { for (const b of this.banners) b.t++; this.banners = this.banners.filter(b => b.t < b.dur); }
      // 止まっているフレームの押下は次のフレームへ持ち越す（連打・必殺の取りこぼし防止）
      if (fx.hitstop > 0) { fx.hitstop--; BK.input.defer(); fx.shakeT > 0 && fx.update(); return; }
      if (fx.slowmo > 0) { fx.slowmo--; if (fx.slowmo % 2) { BK.input.defer(); fx.update(); return; } }
      const h = this.hero;
      if (BK.autoplay) BK.autoCtrl.think(this);
      // 覚醒演出中は周囲が止まる
      if (this.freezeT > 0) {
        this.freezeT--;
        if (this.freezer !== h) BK.input.defer();
        fx.darken = Math.min(0.55, fx.darken + 0.05);
        if (this.freezer) this.freezer.update(this);
        fx.update();
        return;
      }
      fx.darken = Math.max(0, fx.darken - 0.05);
      for (let i = 0; i < this.actors.length; i++) {
        const a = this.actors[i];
        if (a.remove) continue;
        a.update(this);
      }
      C.resolve(this.actors);
      for (const p of this.projectiles) p.update(this.actors);
      this.projectiles = this.projectiles.filter(p => !p.remove);
      for (const it of this.items) it.update(this);
      this.items = this.items.filter(it => !it.remove);
      // 除去
      if (this.actors.some(a => a.remove)) {
        this.actors = this.actors.filter(a => !a.remove || a === h);
      }
      if (this.comboT > 0 && --this.comboT === 0) this.combo = 0;
      this.updateCamera();
      this.updateEvents();
      if (this.stage.update) this.stage.update(this);
      fx.update();
      this.updateHeroLife();
      if (this.clearT > 0) {
        this.clearT++;
        const cd = (this.boss && this.boss.def && this.boss.def.clearDelay) || 60;
        if (this.clearT === cd) { this.banner('ROUND CLEAR', '#ffd27a', null, 200); BK.audio.playSong('clear'); }
        if (this.clearT > cd + 170 && BK.scene && BK.scene.onStageClear) BK.scene.onStageClear();
      }
    }
    updateCamera() {
      const h = this.hero, st = this.stage;
      let maxX = Math.max(0, st.len - BK.W);
      if (this.lock) maxX = Math.min(maxX, this.lock.at);
      if (st.autoscroll && !this.lock && BK.cam.x < (st.autoscroll.until || maxX)) {
        BK.cam.x = Math.min(maxX, BK.cam.x + st.autoscroll.speed);
        // 主人公が遅れたら押し出す
      }
      let target = h.x - BK.W * 0.42;
      target = U.clamp(target, this.camMin, maxX);
      if (target > BK.cam.x) BK.cam.x = Math.min(target, BK.cam.x + 5);
      BK.cam.x = U.clamp(BK.cam.x, 0, Math.max(0, st.len - BK.W));
      this.camMin = BK.cam.x;
      // 主人公は画面内
      const minX = BK.cam.x + 14, maxHX = BK.cam.x + BK.W - 14;
      if (h.x < minX) { h.x = minX; if (st.autoscroll && h.state !== 'dead') h.vx = Math.max(h.vx, 0); }
      if (h.x > maxHX) h.x = maxHX;
      // GO 表示
      if (this.goT > 0) this.goT--;
    }
    updateEvents() {
      // 発動チェック
      while (this.evIdx < this.events.length && !this.lock) {
        const ev = this.events[this.evIdx];
        if (BK.cam.x + 0.5 < ev.at && !(ev.at > Math.max(0, this.stage.len - BK.W) && BK.cam.x >= this.stage.len - BK.W - 1)) break;
        this.evIdx++;
        this.startEvent(ev);
        if (ev.lock === false) continue;
        break;
      }
      // 進行中のロック
      const L = this.lock;
      if (!L) return;
      L.t++;
      const alive = L.spawned.filter(e => !e.dead && !e.remove).length;
      const pending = L.queue.length;
      // 遅延スポーン
      for (let i = L.queue.length - 1; i >= 0; i--) {
        const q = L.queue[i];
        if (--q.delay <= 0) { L.queue.splice(i, 1); L.spawned.push(this.spawnEnemy(q.t, q)); }
      }
      if (alive === 0 && pending === 0) {
        if (L.wave < L.ev.waves.length) {
          if (++L.gap > 30) this.spawnWave(L);
        } else if (!L.ev.boss || this.bossDefeated) {
          this.lock = null;
          if (L.ev.onClear) L.ev.onClear(this);
          if (!L.ev.boss && !this.stage.noGo && this.evIdx < this.events.length) { this.goT = 180; BK.audio.sfx('select', { pitch: 0.8 }); }
        }
      } else if (L.ev.next != null && alive <= L.ev.next && pending === 0 && L.wave < L.ev.waves.length) {
        this.spawnWave(L);
      }
    }
    startEvent(ev) {
      if (ev.onStart) ev.onStart(this);
      if (ev.text) this.banner(ev.text, '#e9dccb', ev.sub, 150);
      const L = { ev, wave: 0, spawned: [], queue: [], t: 0, gap: 99, at: Math.min(ev.at, Math.max(0, this.stage.len - BK.W)) };
      if (ev.lock === false) {
        // ロックしない散発的な出現
        const tmp = { ev, wave: 0, spawned: [], queue: [] };
        (ev.waves || []).forEach((w, i) => w.forEach(s => this.spawnEnemy(s.t, Object.assign({}, s))));
        return tmp;
      }
      this.lock = L;
      if (ev.boss) {
        const def = BK.enemyTypes[ev.boss];
        if (def) {
          const b = this.spawnEnemy(ev.boss, { x: BK.cam.x + (ev.x != null ? ev.x : BK.W - 120), y: ev.y != null ? ev.y : BK.DEPTH * 0.5, entry: ev.entry || def.entry || 'walk' });
          b.boss = true;
          this.boss = b;
          L.spawned.push(b);
          BK.audio.playSong(this.stage.bossBgm || 'boss');
          this.banner(def.name, '#ff5040', def.title || 'BOSS', 170);
          BK.audio.sfx('roar');
        } else { this.bossDefeated = true; this.clearT = 1; }
      }
      if (ev.waves && ev.waves.length) this.spawnWave(L);
      return L;
    }
    spawnWave(L) {
      const w = L.ev.waves[L.wave++];
      L.gap = 0;
      if (!w) return;
      for (const s of w) {
        if (s.delay) L.queue.push(Object.assign({}, s));
        else L.spawned.push(this.spawnEnemy(s.t, Object.assign({}, s)));
      }
    }
    updateHeroLife() {
      const h = this.hero;
      if (!h.dead || this.clearT) return;
      if (h.state === 'dead' && h.st > 70) {
        if (h.lives > 0) {
          h.lives--;
          h.respawn(BK.cam.x + 110);
        } else if (!this.over) {
          this.over = true;
          if (BK.scene && BK.scene.onGameOver) BK.scene.onGameOver();
        }
      }
    }
    continueGame() {
      this.continues++;
      this.over = false;
      const h = this.hero;
      h.lives = 2;
      h.respawn(BK.cam.x + 110);
      h.awk = 50;
    }
    // ------------------------------------------------------------ draw
    draw(c) {
      const st = this.stage;
      c.save();
      if (st.drawBg) st.drawBg(c, this); else { c.fillStyle = '#201818'; c.fillRect(0, 0, BK.W, BK.H); BG.cobbles(c); }
      // 影
      for (const a of this.actors) a.drawShadow(c);
      for (const p of this.projectiles) p.drawShadow(c);
      for (const a of this.actors) if (a.def && a.def.drawFloor && !a.remove) a.def.drawFloor(c, a);
      for (const it of this.items) it.draw(c);
      // 奥→手前の順に描く
      const list = this.actors.slice().sort((a, b) => (a.y - b.y) || ((a.drawLayer || 0) - (b.drawLayer || 0)));
      for (const a of list) a.draw(c);
      for (const p of this.projectiles) p.draw(c);
      BK.fx.draw(c);
      if (st.drawFg) st.drawFg(c, this);
      c.restore();
      BK.fx.drawScreen(c);
      // 覚醒・変身演出中はその主役だけ暗転の上に描く
      if (this.freezeT > 0 && this.freezer && !this.freezer.remove) { this.freezer.draw(c); if (this.freezer.drawTrail) this.freezer.drawTrail(c); }
      if (BK.fx.screenFx) for (const f of BK.fx.screenFx) f(c);
    }
  }
  BK.Game = Game;
})(window.BK);

(function (BK) {

  // ---- 遠景: 丘の上の城
  function drawCastle(c, w, h) {

  }
  // ---- 近景: 通り沿いの石壁・扉・絞首台

    c.lineWidth = 1.2; c.beginPath(); c.moveTo(x + 48, y - 120); c.lineTo(x + 48, y - 92); c.stroke();

  }

  BK.stages[0] = {

    props: [
      { x: 330, y: 30, type: 'barrel' }, { x: 380, y: 96, type: 'crate', item: 'meat' },
      { x: 1050, y: 20, type: 'barrel', item: 'bowgun' }, { x: 1500, y: 90, type: 'crate' }, { x: 1540, y: 70, type: 'barrel' },
      { x: 2250, y: 40, type: 'barrel', item: 'roast' }, { x: 2800, y: 100, type: 'crate', item: 'bombs' }, { x: 3060, y: 20, type: 'barrel', item: 'behelit' },

        [{ t: 'spirit', side: 'R', y: 50 }, { t: 'spirit', side: 'L', y: 30, delay: 30 }]] },
      { at: 1150, waves: [[{ t: 'soldier', side: 'R', y: 30 }, { t: 'soldier', side: 'R', y: 90, off: 30 }, { t: 'undead', side: 'L', y: 60 }],
        [{ t: 'soldier', side: 'R', y: 60, palette: 'captain' }, { t: 'crossbow', side: 'R', y: 20, off: 60 }, { t: 'undead', x: 300, y: 90, entry: 'rise', screen: true }]], next: 1 },
      { at: 1750, waves: [[{ t: 'undead', side: 'R', y: 20 }, { t: 'undead', side: 'R', y: 60, off: 30, palette: 'bone' }, { t: 'undead', side: 'L', y: 100 }, { t: 'spirit', side: 'R', y: 40, delay: 60 }],
        [{ t: 'hound', side: 'R', y: 50 }, { t: 'hound', side: 'L', y: 80, delay: 40 }], [{ t: 'soldier', side: 'R', y: 30 }, { t: 'undead', side: 'R', y: 90, palette: 'blood' }, { t: 'crossbow', side: 'L', y: 60 }]], next: 1 },
      { at: 2400, waves: [[{ t: 'spirit', side: 'R', y: 30 }, { t: 'spirit', side: 'R', y: 90, delay: 20 }, { t: 'spirit', side: 'L', y: 60, delay: 40 }, { t: 'undead', x: 380, y: 60, entry: 'rise', screen: true }],
        [{ t: 'soldier', side: 'R', y: 60, palette: 'captain' }, { t: 'soldier', side: 'L', y: 30 }, { t: 'undead', side: 'R', y: 100, palette: 'bone' }]], next: 1 },
      { at: 3080, boss: 'snakeBaron', x: 470, y: 60, waves: [] },
    ],
    drawBg(c, g) {
      const t = g.time;
      BG.sky(c, [[0, '#050203'], [0.55, '#2a0508'], [1, '#6a1410']], 0, BK.FLOOR_TOP);
      // 紅い月
      const mx = BK.W * 0.72 - BK.cam.x * 0.02, my = 70;
      const glow = c.createRadialGradient(mx, my, 20, mx, my, 150);
      glow.addColorStop(0, 'rgba(255,60,30,0.45)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = glow; c.fillRect(mx - 150, my - 150, 300, 300);
      c.fillStyle = '#c8261a'; c.beginPath(); c.arc(mx, my, 38, 0, 7); c.fill();
      c.fillStyle = 'rgba(90,10,8,0.5)'; c.beginPath(); c.arc(mx + 8, my - 6, 30, 0, 7); c.fill();
      // 雲
      c.fillStyle = 'rgba(10,2,4,0.6)';
      for (let i = 0; i < 4; i++) { const x = ((i * 240 - BK.cam.x * 0.05 - t * 0.1) % (BK.W + 300)) + BK.W + 150 - (BK.W + 300); c.beginPath(); c.ellipse(x, 60 + i * 18, 120, 10, 0, 0, 7); c.fill(); }
      BG.tile(c, BG.layer('s1castle', 900, 180, drawCastle), 0.08, BK.FLOOR_TOP - 180 + 6);
      BG.tile(c, BG.layer('s1town', 1100, 200, drawTown), 0.3, BK.FLOOR_TOP - 200 + 4);

      for (let gx = 700; gx < 3600; gx += 1300) { const sx = gx - BK.cam.x * 0.75; if (sx > -80 && sx < BK.W + 20) drawGallows(c, sx, BK.FLOOR_TOP - 8); }

      for (let tx = 200; tx < 3700; tx += 520) {
        const sx = tx - BK.cam.x;

        const lg = c.createRadialGradient(sx, BK.FLOOR_TOP - 40, 4, sx, BK.FLOOR_TOP - 20, 110 * fl);
        lg.addColorStop(0, 'rgba(255,140,60,0.35)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = lg; c.fillRect(sx - 120, BK.FLOOR_TOP - 150, 240, 250);
        c.fillStyle = '#2a1a10'; c.fillRect(sx - 2, BK.FLOOR_TOP - 70, 4, 60);
        c.fillStyle = '#ffb04a'; c.beginPath(); c.moveTo(sx - 5, BK.FLOOR_TOP - 70); c.quadraticCurveTo(sx, BK.FLOOR_TOP - 92 * fl, sx + 5, BK.FLOOR_TOP - 70); c.fill();
        if (t % 6 === 0) BK.fx.ember(tx + U.rand(-4, 4), -4, 70);
      }
    },
    drawFg(c, g) {
      BG.fog(c, g.time, '#6a2a2e', 0.12, BK.H - 60);
      // 前景の杭（手前を横切る）
      for (let px = 400; px < 3700; px += 700) {
        const sx = px - BK.cam.x * 1.25;
        if (sx < -30 || sx > BK.W + 30) continue;
        c.fillStyle = '#0a0506'; c.fillRect(sx, BK.H - 90, 12, 90);
        c.beginPath(); c.moveTo(sx - 2, BK.H - 90); c.lineTo(sx + 6, BK.H - 104); c.lineTo(sx + 14, BK.H - 90); c.fill();
      }
      BG.vignette(c, 0.55);
    },
  };
})(window.BK);

<script>/* js/stages_2to4.js */

  /** 敷居（床の継ぎ目）: 細い縁石と、門の内側に落ちる影。dir=1 で影は右（内側）へ */

  // ---------------------------------------------------------- 屋上
  /** 塔の頂から見下ろす夜景: 遠い山並み、町の灯、刑場の火 */
  function r5Land(c, w, h) {
    const r = U.srand(6313);
    // 地平の薄明かり
    const g0 = c.createLinearGradient(0, 0, 0, 60);
    g0.addColorStop(0, 'rgba(70,80,108,0)'); g0.addColorStop(0.7, 'rgba(80,90,118,0.45)'); g0.addColorStop(1, 'rgba(80,90,118,0.2)');
    c.fillStyle = g0; c.fillRect(0, 0, w, 60);
    // 山並み（2列）と平野
    const ridge = (base, amp, f1, f2, col) => {
      c.fillStyle = col;
      c.beginPath(); c.moveTo(0, h);
      for (let i = 0; i <= 100; i++) { const k = i / 100; c.lineTo(k * w, base + Math.sin(k * TAU * f1 + base) * amp + Math.sin(k * TAU * f2) * amp * 0.45); }
      c.lineTo(w, h); c.closePath(); c.fill();
    };
    ridge(40, 9, 3, 11, '#1a1e2b');
    ridge(54, 6, 5, 13, '#11141c');
    c.fillStyle = '#0b0d13'; c.fillRect(0, 64, w, h - 64);
    // 川筋
    c.strokeStyle = 'rgba(90,100,130,0.3)'; c.lineWidth = 1;
    c.beginPath(); for (let i = 0; i <= 50; i++) { const k = i / 50; const y = 80 + Math.sin(k * TAU * 2) * 10 + Math.sin(k * TAU * 5) * 3; if (i) c.lineTo(k * w, y); else c.moveTo(0, y); } c.stroke();

    for (let i = 0; i < 7; i++) {
      const x = 10 + r() * (w - 20), y = 72 + r() * (h - 80);
      const g = c.createRadialGradient(x, y, 0, x, y, 6);
      g.addColorStop(0, 'rgba(255,160,70,0.85)'); g.addColorStop(1, 'rgba(255,90,30,0)');
      c.fillStyle = g; c.fillRect(x - 6, y - 6, 12, 12);
    }
  }
  /** 屋上の胸壁（狭間・石像） */
  function r5Parapet(c, w, h) {

    }

    }

      c.beginPath(); c.moveTo(x - 4, y - 18); c.lineTo(x - 18, y - 30); c.lineTo(x - 10, y - 14); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(x + 8, y - 18); c.lineTo(x + 20, y - 32); c.lineTo(x + 12, y - 12); c.closePath(); c.fill();

    }

  function r5FloorC(c, w, h) {

  /** 鐘楼の枠（鐘は毎フレーム揺らして描く） */

  // ---------------------------------------------------------- 稲妻
  function st5(g) {
    if (!g.s5) g.s5 = { lt: 0, bolt: null, next: 90, thunderAt: 0, vol: 1 };
    return g.s5;
  }
  /** 今どの区間を見ているか（0 刑場 / 1 塔内 / 2 屋上） */
  function zone5() { const cx = BK.cam.x + BK.W / 2; return cx < X_GATE ? 0 : cx < X_ROOF ? 1 : 2; }
  function strike5(S, g, big) {
    const W = BK.W;
    S.lt = big ? 22 : 16;
    S.bolt = makeBolt(W * (0.12 + Math.random() * 0.76), -4, 120 + Math.random() * 50, 1 + Math.floor(Math.random() * 99999));
    const z = zone5();
    S.vol = big ? 1 : z === 1 ? 0.45 : 0.75;
    S.thunderAt = g.time + (big ? 3 : U.randi(12, 42));
  }
  /** 稲光の明るさ 0..1（明滅つき） */
  function flash5(S) {
    const f = S.lt;
    if (f <= 0) return 0;
    if (f > 12) return 1;
    if (f > 9) return 0.25;
    if (f > 6) return 0.75;
    return f / 6 * 0.3;
  }

    for (let y = 30; y < h + 10; y += 9 + r() * 3) {
