<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>聖犬士イッヌ - ベルトアクション</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#05060a; overflow:hidden;
    font-family:'Trebuchet MS','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    color:#fff; user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; background:#000; box-shadow:0 0 60px rgba(0,0,0,.8);
    image-rendering:auto; max-width:100%; max-height:100%; }

  /* ----- Start / Result overlays ----- */
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; z-index:20;
    background:radial-gradient(ellipse at center, rgba(20,12,40,.55), rgba(0,0,0,.88)); }
  .hidden { display:none !important; }
  .title-sub { font-size:14px; letter-spacing:6px; color:#ffd34d; text-shadow:0 0 8px #b8860b; }
  .title-main { font-size:clamp(40px,9vw,86px); font-weight:900; letter-spacing:4px;
    background:linear-gradient(180deg,#fff6d0,#ffcf3a 55%,#c8881a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 0 rgba(120,60,0,.4); margin:6px 0; }
  .title-jp { font-size:clamp(18px,4vw,30px); color:#fff; letter-spacing:8px;
    text-shadow:0 0 10px #ff8a00; margin-bottom:20px; }
  .btn { margin-top:14px; padding:14px 40px; font-size:20px; font-weight:800; letter-spacing:3px;
    color:#3a1d00; cursor:pointer; border:none; border-radius:10px;
    background:linear-gradient(180deg,#ffe98a,#ffb02e); border:2px solid #fff3c0;
    box-shadow:0 6px 0 #9c5a00,0 10px 20px rgba(0,0,0,.5); transition:transform .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #9c5a00; }
  .ctrls { margin-top:22px; font-size:13px; color:#cfe; line-height:1.9; opacity:.9; }
  .ctrls b { color:#ffd34d; }
  #result-title { font-size:clamp(36px,8vw,72px); font-weight:900; letter-spacing:6px; }
  #result-sub { font-size:18px; margin-top:10px; color:#ffd34d; letter-spacing:2px; }

  /* ----- Touch controls ----- */
  #touch { position:absolute; inset:0; z-index:15; pointer-events:none; display:none; }
  #stick { position:absolute; left:18px; bottom:18px; width:150px; height:150px;
    border-radius:50%; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.25);
    pointer-events:auto; }
  #stick .nub { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px;
    border-radius:50%; background:rgba(255,255,255,.35); border:2px solid #fff; }
  .tbtn { position:absolute; width:84px; height:84px; border-radius:50%; pointer-events:auto;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;
    color:#fff; text-shadow:0 1px 2px #000; border:3px solid rgba(255,255,255,.7); }
  #bAtk  { right:120px; bottom:96px; background:rgba(255,80,40,.55); }
  #bGrd  { right:24px;  bottom:140px; background:rgba(60,140,255,.55); }
  #bDash { right:24px;  bottom:24px; background:rgba(255,180,30,.55); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- Title -->
  <div id="start" class="overlay">
    <div class="title-sub">ARCADE BELT ACTION</div>
    <div class="title-main">聖犬士イッヌ</div>
    <div class="title-jp">〜 ワンワン帝国の野望 〜</div>
    <button id="startBtn" class="btn">▶ START</button>
    <div class="ctrls">
      <b>移動</b> 矢印 / WASD　　<b>短剣攻撃</b> J　　<b>ガード</b> K（長押し）　　<b>突進</b> L<br>
      スマホはタッチパッド＆ボタン操作 ／ <b>P</b> でポーズ
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="overlay hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <button id="retryBtn" class="btn">▶ もう一度</button>
  </div>

  <!-- Touch -->
  <div id="touch">
    <div id="stick"><div class="nub"></div></div>
    <div id="bAtk"  class="tbtn">短剣</div>
    <div id="bGrd"  class="tbtn">ガード</div>
    <div id="bDash" class="tbtn">突進</div>
  </div>
</div>

<script>
"use strict";
//======================================================================
//  聖犬士イッヌ  -  Final Fight style belt-scroll beat 'em up
//  All graphics drawn procedurally on canvas (no external assets).
//======================================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;       // logical resolution 960x540

// ---- ground / depth band ----
const GROUND_TOP = 360;     // furthest the player can stand (min y)
const GROUND_BOT = 512;     // nearest (max y)
const WORLD_END  = 4200;    // length of the stage in world px

// ---- game state ----
let state = 'title';        // title | play | clear | over | win | pause
let camX = 0;               // camera scroll (world x at left edge)
let score = 0, stageTime = 99, timeAcc = 0;
let shake = 0, hitStop = 0, flash = 0;
let bossIntro = 0;          // boss speech bubble timer
let goArrow = 0;            // "GO ->" pulse

//======================================================================
//  Input
//======================================================================
const keys = {};
const K = { left:false,right:false,up:false,down:false, atk:false,grd:false,dash:false };
const pressed = { atk:false, dash:false };   // edge-triggered

addEventListener('keydown', e=>{
  if(keys[e.code]) { e.preventDefault(); return; }
  keys[e.code]=true; mapKeys();
  if(['KeyJ','KeyZ'].includes(e.code)) pressed.atk=true;
  if(['KeyL','ShiftLeft','ShiftRight'].includes(e.code)) pressed.dash=true;
  if(e.code==='KeyP' && (state==='play'||state==='pause')) togglePause();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e=>{ keys[e.code]=false; mapKeys(); });
function mapKeys(){
  K.left  = keys['ArrowLeft']||keys['KeyA'];
  K.right = keys['ArrowRight']||keys['KeyD'];
  K.up    = keys['ArrowUp']||keys['KeyW'];
  K.down  = keys['ArrowDown']||keys['KeyS'];
  K.atk   = keys['KeyJ']||keys['KeyZ'];
  K.grd   = keys['KeyK']||keys['KeyX'];
  K.dash  = keys['KeyL']||keys['ShiftLeft']||keys['ShiftRight'];
}

//======================================================================
//  Audio (tiny WebAudio blips)
//======================================================================
let actx=null;
function beep(freq,dur,type='square',vol=.15,slide=0){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), actx.currentTime+dur);
    g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfx = {
  swing:()=>beep(520,.08,'square',.10,-200),
  hit:()=>{beep(180,.10,'square',.16,-90); beep(90,.12,'sawtooth',.10);},
  guard:()=>beep(700,.06,'square',.10),
  hurt:()=>beep(200,.18,'sawtooth',.14,-120),
  dash:()=>beep(300,.12,'square',.10,260),
  ko:()=>beep(120,.3,'sawtooth',.16,-80),
  boss:()=>{beep(80,.5,'sawtooth',.2,40);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'square',.16),i*120));},
};

//======================================================================
//  Helpers
//======================================================================
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function depthScale(y){ return 0.72 + (y-GROUND_TOP)/(GROUND_BOT-GROUND_TOP)*0.34; } // nearer = bigger

//======================================================================
//  Particles
//======================================================================
let particles=[];
function spark(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), s=rnd(2,6);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(14,26),
      max:26,color,star:Math.random()<.5});
  }
}
function popText(x,y,txt,color){ particles.push({x,y,txt,color,life:40,max:40,vy:-1.2}); }
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life--;
    if(p.txt){ p.y+=p.vy; }
    else { p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.vx*=0.94; }
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    const sx=p.x-camX, a=p.life/p.max;
    ctx.globalAlpha=a;
    if(p.txt){
      ctx.font='bold 22px Trebuchet MS'; ctx.textAlign='center';
      ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText(p.txt,sx,p.y);
      ctx.fillStyle=p.color; ctx.fillText(p.txt,sx,p.y);
    } else if(p.star){
      drawStar(sx,p.y,3,6,p.color);
    } else {
      ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,p.y,3*a+1,0,7); ctx.fill();
    }
  });
  ctx.globalAlpha=1; ctx.textAlign='left';
}
function drawStar(x,y,r1,r2,color){
  ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?r1:r2, a=Math.PI/5*i-Math.PI/2;
    ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r); }
  ctx.closePath(); ctx.fill();
}

//======================================================================
//  Player  -  聖犬士イッヌ
//======================================================================
const player = {
  x:120, y:460, vx:0, vy:0, w:46, h:78, facing:1,
  hp:100, maxHp:100, lives:3,
  state:'idle', anim:0,
  atkStep:0, atkTimer:0, comboTimer:0,   // combo chaining
  hurtTimer:0, invuln:0, dashTimer:0, dashCd:0, downTimer:0,
  hitSet:null,
};
function resetPlayer(full){
  player.x=120; player.y=460; player.vx=player.vy=0; player.facing=1;
  player.state='idle'; player.atkStep=0; player.atkTimer=0; player.comboTimer=0;
  player.hurtTimer=0; player.invuln=60; player.dashTimer=0; player.downTimer=0;
  player.hp=player.maxHp;
  if(full){ player.lives=3; }
}

const SPEED=2.6, DEPTH_SPEED=1.7;

function updatePlayer(){
  const p=player;
  if(p.invuln>0) p.invuln--;
  if(p.dashCd>0) p.dashCd--;
  if(p.comboTimer>0) p.comboTimer--; else p.atkStep=0;

  // --- knocked down ---
  if(p.state==='down'){
    p.downTimer--; p.vx*=0.86; p.x+=p.vx;
    if(p.downTimer<=0){ p.state='idle'; p.invuln=50; }
    return;
  }
  // --- hurt ---
  if(p.state==='hurt'){
    p.hurtTimer--; p.x+=p.vx; p.vx*=0.85;
    if(p.hurtTimer<=0) p.state='idle';
    return;
  }
  // --- dash (突進) ---
  if(p.state==='dash'){
    p.dashTimer--; p.x+=p.facing*7.5; p.anim+=0.4;
    dashHit();
    if(p.dashTimer<=0){ p.state='idle'; }
    p.x=clamp(p.x, camX+24, camX+W-24);
    return;
  }
  // --- attack ---
  if(p.state==='attack'){
    p.atkTimer--;
    if(p.atkTimer===6) attackHit();      // active frame
    if(p.atkTimer<=0){ p.state='idle'; p.comboTimer=22; }
    // small forward lunge
    p.x+=p.facing*(p.atkStep>=3?1.4:0.8);
    return;
  }
  // --- guard ---
  if(K.grd){ p.state='guard'; p.vx=p.vy=0; return; }

  // --- start actions ---
  if(pressed.dash && p.dashCd<=0){ startDash(); pressed.dash=false; return; }
  if((K.atk||pressed.atk)){ startAttack(); pressed.atk=false; return; }

  // --- movement ---
  let mx=0,my=0;
  if(K.left) mx=-1; if(K.right) mx=1;
  if(K.up) my=-1;   if(K.down) my=1;
  if(mx) p.facing=mx;
  p.x += mx*SPEED;
  p.y += my*DEPTH_SPEED;
  p.y = clamp(p.y, GROUND_TOP, GROUND_BOT);
  p.x = clamp(p.x, camX+24, Math.min(WORLD_END, camX+W-24));
  p.state=(mx||my)?'walk':'idle';
  p.anim += (mx||my)?0.22:0.08;
}
function startAttack(){
  const p=player;
  p.atkStep = (p.comboTimer>0)? Math.min(p.atkStep+1,3) : 1;
  p.comboTimer=0;
  p.state='attack'; p.atkTimer=16; p.hitSet=new Set();
  sfx.swing();
}
function startDash(){
  const p=player; p.state='dash'; p.dashTimer=18; p.dashCd=46; p.hitSet=new Set();
  if(K.left)p.facing=-1; if(K.right)p.facing=1;
  sfx.dash();
}
function attackHit(){
  const p=player;
  const reach = p.atkStep>=3?78:62;
  const hx = p.x + p.facing*reach*0.5;
  const dmg = p.atkStep>=3?18:10;
  const kb  = p.atkStep>=3?9:4;
  hitEnemies(hx, p.y, reach, 40, dmg, kb, p.atkStep>=3);
}
function dashHit(){
  const p=player;
  hitEnemies(p.x+p.facing*30, p.y, 60, 42, 8, 7, false, true);
}
function hitEnemies(hx,hy,rw,rh,dmg,kb,knockdown,dash){
  let any=false;
  enemies.forEach(e=>{
    if(e.dead||e.state==='down'&&!knockdown) {}
    if(e.dead) return;
    if(player.hitSet.has(e.id)) return;
    if(Math.abs(e.y-hy)>rh) return;
    const dx=e.x-hx;
    if(player.facing>0 && (dx< -10 || dx>rw)) return;
    if(player.facing<0 && (dx> 10 || dx<-rw)) return;
    player.hitSet.add(e.id);
    damageEnemy(e,dmg,kb*player.facing,knockdown);
    any=true;
  });
  if(any){ hitStop=Math.max(hitStop, knockdown?6:3); shake=Math.max(shake,knockdown?6:3); }
}

//======================================================================
//  Enemies
//======================================================================
let enemies=[];
let enemyId=0;
// type stats
const ETYPE = {
  wolf:  {hp:30, sp:1.5, dmg:8,  atkR:46, w:54, h:78, color1:'#8a8f99', color2:'#5c616b', score:200, name:'グレー狼'},
  hyena: {hp:22, sp:2.1, dmg:6,  atkR:42, w:46, h:70, color1:'#b07a3c', color2:'#7d5224', score:150, name:'ハイエナ犬'},
  boar:  {hp:48, sp:1.2, dmg:12, atkR:54, w:64, h:74, color1:'#7a5a3a', color2:'#4f3a24', score:300, charge:true, name:'イノシシ兵'},
  bitter:{hp:90, sp:2.6, dmg:11, atkR:50, w:46, h:78, color1:'#2a2a30', color2:'#111114', score:1200, name:'ビター・イッヌ', mini:true},
  boss:  {hp:420,sp:1.0, dmg:18, atkR:78, w:120,h:140,color1:'#26252b', color2:'#0d0d11', score:5000, name:'ダークワンワン大帝', boss:true},
};
function spawnEnemy(type, x, y){
  const t=ETYPE[type];
  enemies.push({
    id:++enemyId, type, x, y, vx:0, vy:0, facing:-1,
    hp:t.hp, maxHp:t.hp, w:t.w, h:t.h,
    state:'walk', anim:Math.random()*6, atkTimer:0, telegraph:0,
    hurtTimer:0, downTimer:0, stun:0, dead:false, deadTimer:0,
    chargeTimer:0, thinkCd:rnd(20,60),
  });
}

function damageEnemy(e,dmg,kbx,knockdown){
  if(e.state==='down') knockdown=true;
  e.hp-=dmg;
  e.facing = kbx>0?-1:1;            // face the hit
  e.vx = kbx*1.4;
  spark(e.x, e.y-e.h*0.5, '#ffe14d', knockdown?12:7);
  sfx.hit();
  addCombo();
  popText(e.x, e.y-e.h-6, dmg, knockdown?'#ff5a3c':'#ffe14d');
  if(e.hp<=0){ killEnemy(e); return; }
  if(knockdown){ e.state='down'; e.downTimer=46; e.vy=0; }
  else { e.state='hurt'; e.hurtTimer=16; e.stun=18; }
}
function killEnemy(e){
  e.dead=true; e.deadTimer=40; e.state='down'; e.downTimer=40;
  e.vx*=1.6;
  score += ETYPE[e.type].score + combo.count*10;
  spark(e.x, e.y-e.h*0.5, '#ff7a2a', 16);
  sfx.ko();
  if(ETYPE[e.type].boss){ winGame(); }
}

function updateEnemies(){
  const p=player;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; const t=ETYPE[e.type];
    if(e.dead){
      e.deadTimer--; e.x+=e.vx; e.vx*=0.86;
      if(e.deadTimer<=0) enemies.splice(i,1);
      continue;
    }
    if(e.stun>0) e.stun--;
    if(e.state==='down'){
      e.downTimer--; e.x+=e.vx; e.vx*=0.85;
      if(e.downTimer<=0){ e.state='walk'; }
      continue;
    }
    if(e.state==='hurt'){
      e.hurtTimer--; e.x+=e.vx; e.vx*=0.82;
      if(e.hurtTimer<=0) e.state='walk';
      continue;
    }
    // ---- attacking ----
    if(e.state==='attack'){
      e.atkTimer--;
      if(e.atkTimer===8) enemyAttackHit(e);
      if(e.atkTimer<=0){ e.state='walk'; e.thinkCd=rnd(30,70); }
      if(t.charge){ e.x+=e.facing*5; }
      continue;
    }
    if(e.telegraph>0){
      e.telegraph--;
      if(e.telegraph===0){ e.state='attack'; e.atkTimer=t.charge?26:18; sfx.swing(); }
      continue;
    }
    // ---- AI move toward player ----
    e.anim+=0.18;
    const dx=p.x-e.x, dy=p.y-e.y;
    e.facing = dx<0?-1:1;
    const dist=Math.abs(dx), aligned=Math.abs(dy)<24;
    // spread out: keep some depth offset based on id
    const desiredY = p.y + ((e.id%5)-2)*10;
    if(dist>t.atkR-6){
      const sp=t.sp*(t.boss?0.9:1);
      e.x += Math.sign(dx)*sp;
    }
    if(Math.abs(e.y-desiredY)>4) e.y += Math.sign(desiredY-e.y)*Math.min(t.sp,Math.abs(desiredY-e.y));
    e.y=clamp(e.y,GROUND_TOP,GROUND_BOT);
    // attack decision
    e.thinkCd--;
    if(dist<t.atkR && aligned && e.thinkCd<=0 && e.stun<=0){
      e.telegraph = t.boss?22:(t.charge?20:14);
      e.thinkCd=rnd(40,90);
    }
    // soft separation between enemies
  }
  // separation pass (avoid stacking)
  for(let a=0;a<enemies.length;a++)for(let b=a+1;b<enemies.length;b++){
    const e1=enemies[a],e2=enemies[b]; if(e1.dead||e2.dead)continue;
    if(Math.abs(e1.y-e2.y)<18 && Math.abs(e1.x-e2.x)<30){
      const push=(e1.x<e2.x?-0.5:0.5);
      e1.x+=push*0.6; e2.x-=push*0.6;
    }
  }
}
function enemyAttackHit(e){
  const p=player; const t=ETYPE[e.type];
  if(p.state==='down'||p.invuln>0) return;
  if(Math.abs(p.y-e.y)>34) return;
  const dx=p.x-e.x;
  if(Math.sign(dx)!==e.facing && Math.abs(dx)>10) return;
  if(Math.abs(dx)>t.atkR+10) return;
  // guard check
  if(p.state==='guard' && Math.sign(dx)===-p.facing){
    // facing toward attacker -> block
    sfx.guard(); spark(p.x+p.facing*20,p.y-40,'#7fd0ff',6);
    p.vx=e.facing*2; shake=3; resetCombo(); return;
  }
  hurtPlayer(t.dmg, e.facing, t.boss||t.charge);
}
function hurtPlayer(dmg,dir,knockdown){
  const p=player;
  if(p.invuln>0) return;
  p.hp-=dmg; p.invuln=knockdown?60:36;
  p.vx=dir*4; shake=6; flash=Math.max(flash,4); sfx.hurt();
  resetCombo();
  spark(p.x,p.y-40,'#ff4444',8);
  if(p.hp<=0){ loseLife(); return; }
  p.state=knockdown?'down':'hurt';
  p.hurtTimer=14; p.downTimer=44;
}
function loseLife(){
  player.lives--; player.hp=0;
  if(player.lives<0){ gameOver(); return; }
  // brief respawn
  setTimeout(()=>{ if(state==='play'){ resetPlayer(false); } },300);
}

//======================================================================
//  Encounters (belt-scroll wave gating)
//======================================================================
let encounters, curGateX=WORLD_END, encIndex=0;
function buildEncounters(){
  encounters = [
    {at:300,  cleared:false, list:[['wolf',2],['hyena',1]]},
    {at:820,  cleared:false, list:[['hyena',3],['boar',1]]},
    {at:1400, cleared:false, list:[['wolf',2],['hyena',2],['boar',1]]},
    {at:2050, cleared:false, mini:true, list:[['bitter',1],['hyena',2]]},
    {at:2650, cleared:false, list:[['boar',2],['wolf',2]]},
    {at:3250, cleared:false, list:[['wolf',2],['hyena',2],['boar',2]]},
    {at:3850, cleared:false, boss:true, list:[['boss',1]]},
  ];
  encIndex=0; curGateX=WORLD_END;
}
function aliveCount(){ return enemies.filter(e=>!e.dead).length; }

function updateEncounters(){
  // camera limit: player can't pass an un-cleared gate
  const enc = encounters[encIndex];
  if(enc && !enc.cleared){
    // trigger when player reaches the gate area
    if(!enc.spawned && player.x > enc.at-200){
      enc.spawned=true;
      curGateX = enc.at;             // lock camera here
      let off=0;
      enc.list.forEach(([type,n])=>{
        for(let i=0;i<n;i++){
          const side = (off%2===0)?1:-1;
          const sx = side>0 ? camX+W+40+rnd(0,120) : camX-40-rnd(0,120);
          spawnEnemy(type, clamp(sx, enc.at-260, enc.at+W*0.7), rnd(GROUND_TOP+20,GROUND_BOT-10));
          off++;
        }
      });
      if(enc.boss){ bossIntro=170; sfx.boss(); }
      if(enc.mini){ bossIntro=120; }
    }
    if(enc.spawned && aliveCount()===0){
      enc.cleared=true; encIndex++;
      curGateX = WORLD_END;
      goArrow=160;
      score+=300;
    }
  }
}

//======================================================================
//  Combo
//======================================================================
const combo={count:0,timer:0,show:0};
function addCombo(){ combo.count++; combo.timer=90; combo.show=1; if(combo.count>=10) score+=5; }
function resetCombo(){ combo.count=0; combo.timer=0; }
function updateCombo(){ if(combo.timer>0){combo.timer--; if(combo.timer===0)combo.count=0;} }

//======================================================================
//  Camera & world update
//======================================================================
function updateCamera(){
  const target = clamp(player.x - W*0.38, 0, Math.min(curGateX-(W-W*0.38), WORLD_END-W));
  // when locked, gate stops camera so enemies stay on screen
  const maxC = (encounters[encIndex] && !encounters[encIndex].cleared && encounters[encIndex].spawned)
    ? clamp(encounters[encIndex].at - W*0.45, 0, WORLD_END-W)
    : WORLD_END-W;
  camX += (Math.min(target,maxC)-camX)*0.12;
  camX=clamp(camX,0,WORLD_END-W);
  player.x=clamp(player.x, camX+24, camX+W-24);
}

function update(){
  if(hitStop>0){ hitStop--; return; }
  if(state!=='play') return;
  // timer
  timeAcc++; if(timeAcc>=60){ timeAcc=0; stageTime--; if(stageTime<=0){ stageTime=0; loseLife(); stageTime=99; } }
  updatePlayer();
  updateEnemies();
  updateEncounters();
  updateCamera();
  updateCombo();
  updateParticles();
  if(shake>0) shake-=0.6;
  if(flash>0) flash--;
  if(bossIntro>0) bossIntro--;
  if(goArrow>0) goArrow--;
}

//======================================================================
//  ===========  RENDERING  ===========
//======================================================================
function render(){
  ctx.save();
  if(shake>0){ ctx.translate(rnd(-shake,shake), rnd(-shake,shake)); }
  drawBackground();
  drawGround();
  // draw entities sorted by y (depth)
  const draw=[...enemies.map(e=>({y:e.y,e})), {y:player.y,p:player}];
  draw.sort((a,b)=>a.y-b.y);
  draw.forEach(o=>{ if(o.p) drawPlayer(); else drawEnemy(o.e); });
  drawParticles();
  ctx.restore();
  // screen flash
  if(flash>0){ ctx.fillStyle='rgba(255,80,80,'+(flash/10)+')'; ctx.fillRect(0,0,W,H); }
  drawHUD();
  drawTouchActionLabels();
}

// ---------- Background (medieval castle town) ----------
function drawBackground(){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,GROUND_TOP);
  sky.addColorStop(0,'#5ab4f0'); sky.addColorStop(.6,'#9fd6f5'); sky.addColorStop(1,'#dff0d8');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,GROUND_TOP+30);
  // far clouds (parallax x0.2)
  const cl=-camX*0.15;
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<12;i++){ const x=((i*340+cl)%(W+400))-200; cloud(x,60+ (i%3)*26, 60+(i%2)*20); }
  // central big castle (parallax 0.3)
  drawCastle((W*0.5)-camX*0.3, 70);
  // back towers parallax 0.4
  for(let i=0;i<10;i++){ const x=((i*260 - camX*0.4)%(W+260)+W+260)%(W+260)-130; drawTower(x,150,46,150,'#7d8aa0'); }
  // building row (parallax 0.6) — shops & houses
  drawBuildings();
}
function cloud(x,y,r){
  ctx.beginPath(); ctx.arc(x,y,r*.6,0,7); ctx.arc(x+r*.5,y+6,r*.5,0,7);
  ctx.arc(x-r*.5,y+8,r*.45,0,7); ctx.arc(x+r*.2,y-r*.3,r*.45,0,7); ctx.fill();
}
function drawTower(x,y,w,h,col){
  ctx.fillStyle=col; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#46506a';
  for(let i=0;i<w;i+=14) ctx.fillRect(x+i,y,8,8);
  // conical roof
  ctx.fillStyle='#3b6fb5'; ctx.beginPath();
  ctx.moveTo(x-6,y); ctx.lineTo(x+w/2,y-44); ctx.lineTo(x+w+6,y); ctx.fill();
  ctx.fillStyle='#d23'; ctx.fillRect(x+w/2-1,y-58,2,16); // flag pole
  ctx.beginPath(); ctx.moveTo(x+w/2+1,y-58); ctx.lineTo(x+w/2+16,y-53); ctx.lineTo(x+w/2+1,y-48); ctx.fill();
}
function drawCastle(cx,top){
  ctx.save();
  drawTower(cx-150,top+30,60,210,'#9aa6bd');
  drawTower(cx+90,top+30,60,210,'#9aa6bd');
  // main keep
  ctx.fillStyle='#aeb9cf'; ctx.fillRect(cx-70,top+10,140,230);
  ctx.fillStyle='#46506a';
  for(let i=0;i<140;i+=20) ctx.fillRect(cx-70+i,top+10,12,12);
  drawTower(cx-30,top-40,60,90,'#b6c2d8');
  // windows
  ctx.fillStyle='#324';
  for(let r=0;r<3;r++)for(let c=0;c<3;c++) ctx.fillRect(cx-50+c*40,top+60+r*50,18,30);
  // gate arch
  ctx.fillStyle='#3a2f4a';
  ctx.beginPath(); ctx.arc(cx,top+240,40,Math.PI,0); ctx.rect(cx-40,top+240,80,30); ctx.fill();
  ctx.restore();
}
function drawBuildings(){
  const par=0.6, baseY=GROUND_TOP-4;
  const cols=['#caa15a','#b9854a','#d8b56b','#a8753c','#c69a55'];
  const roofs=['#9c3b2e','#7a3528','#b5503a'];
  for(let i=-1;i<14;i++){
    const bw=140, gx=i*bw - (camX*par)%bw - bw;
    const baseGlobal = Math.floor((camX*par)/bw)+i;
    const h=80+ (Math.abs(baseGlobal*53%60));
    const y=baseY-h;
    ctx.fillStyle=cols[((baseGlobal%cols.length)+cols.length)%cols.length];
    ctx.fillRect(gx,y,bw-8,h);
    // timber framing
    ctx.strokeStyle='rgba(90,50,20,.5)'; ctx.lineWidth=3;
    ctx.strokeRect(gx,y,bw-8,h);
    ctx.beginPath(); ctx.moveTo(gx,y+h*0.5); ctx.lineTo(gx+bw-8,y+h*0.5); ctx.stroke();
    // roof
    ctx.fillStyle=roofs[((baseGlobal%roofs.length)+roofs.length)%roofs.length];
    ctx.beginPath(); ctx.moveTo(gx-8,y); ctx.lineTo(gx+(bw-8)/2,y-34); ctx.lineTo(gx+bw,y); ctx.fill();
    // windows
    ctx.fillStyle='#3a5a78';
    ctx.fillRect(gx+18,y+20,26,30); ctx.fillRect(gx+bw-52,y+20,26,30);
    // signboard for some
    if(baseGlobal%3===0){
      ctx.fillStyle='#5a3a1c'; ctx.fillRect(gx+34,y+h-40,bw-80,30);
      ctx.fillStyle='#ffe6b0'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
      ctx.fillText(baseGlobal%2? '肉球亭':'イッヌ商店', gx+(bw-8)/2, y+h-19);
      ctx.textAlign='left';
    }
  }
  // awning strip
  ctx.fillStyle='#2a3a4a'; ctx.fillRect(0,baseY,W,8);
}
// ---------- Ground (cobblestone) ----------
function drawGround(){
  const g=ctx.createLinearGradient(0,GROUND_TOP,0,H);
  g.addColorStop(0,'#8c8275'); g.addColorStop(1,'#5c5247');
  ctx.fillStyle=g; ctx.fillRect(0,GROUND_TOP,W,H-GROUND_TOP);
  // cobblestone perspective rows
  ctx.strokeStyle='rgba(40,34,28,.4)'; ctx.lineWidth=2;
  for(let r=0;r<10;r++){
    const y=GROUND_TOP+ r*r*2 + r*6;
    if(y>H)break;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    const step=30+r*6, off=(-(camX)%step+step)%step + (r%2?step/2:0);
    for(let x=-step;x<W+step;x+=step){
      ctx.beginPath(); ctx.moveTo(x-off, y); ctx.lineTo(x-off, y+ (r*2+6)); ctx.stroke();
    }
  }
}

function fluff(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }

// ---- Player: cream poodle knight ----
function drawPlayer(){

  // ----- red cape -----
  ctx.fillStyle='#c0392b';
  ctx.beginPath();
  ctx.moveTo(-6,-58); ctx.quadraticCurveTo(-34,-30,-26+Math.sin(p.anim)*3,-2);
  ctx.lineTo(-6,-10); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#962d22';

  ctx.strokeStyle='#b59a5e'; ctx.lineWidth=1.4;
  for(let i=-12;i<=12;i+=8){ ctx.beginPath(); ctx.moveTo(i,-30); ctx.lineTo(i*0.8,-12); ctx.stroke(); }

  // ----- body fluff (cream) -----
  ctx.fillStyle='#f6e8c6';
  fluff(-8,-40,12); fluff(8,-40,12); fluff(0,-46,14); fluff(0,-34,13);

  ctx.fillStyle='#ffcf3a'; ctx.beginPath(); ctx.arc(0,-38,5,0,7); ctx.fill();

  ctx.fillStyle='#f8ecce';
  fluff(0,-66,16); fluff(-12,-62,10); fluff(12,-62,10); fluff(-9,-74,9); fluff(9,-74,9); fluff(0,-78,9);
  // ears

  ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.ellipse(13,-58,2.6,2.2,0,0,7); ctx.fill(); // nose
  // eyes
  ctx.fillStyle='#2a1c10';
  ctx.beginPath(); ctx.arc(2,-62,2.4,0,7); ctx.arc(9,-62,2.4,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(2.8,-63,1,0,7); ctx.arc(9.8,-63,1,0,7); ctx.fill();
  // mouth (happy)
  ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(9,-55,3,0,Math.PI); ctx.stroke();

  // ----- sword arm -----
  drawPlayerWeapon(p);

  ctx.restore();

}
function drawPlayerWeapon(p){
  let ang=-0.4, ext=18;
  if(p.state==='attack'){
    const k=1-p.atkTimer/16;
    ang = -1.3 + k*2.4;                 // swing arc
    ext = 18+ Math.sin(k*Math.PI)*16;
    if(p.atkStep>=3) ang-=0.3;
  } else if(p.state==='dash'){ ang=0.1; ext=30; }
  ctx.save(); ctx.translate(12,-40); ctx.rotate(ang);
  // arm
  ctx.strokeStyle='#f3ead2'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ext*0.5,2); ctx.stroke();
  // hilt
  ctx.translate(ext*0.5,2);
  ctx.fillStyle='#caa54a'; ctx.fillRect(-3,-4,6,8);
  // blade
  const blgrad=ctx.createLinearGradient(0,0,ext,0);
  blgrad.addColorStop(0,'#eef3ff'); blgrad.addColorStop(1,'#aab6cf');
  ctx.fillStyle=blgrad;
  ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(ext+6,-2); ctx.lineTo(ext+12,0); ctx.lineTo(ext+6,2); ctx.lineTo(0,3); ctx.fill();
  ctx.restore();
  // swing trail
  if(p.state==='attack'&&p.atkTimer<12){
    ctx.save(); ctx.translate(20,-44);
    ctx.strokeStyle='rgba(255,224,120,'+(p.atkTimer/12*0.6)+')'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.arc(0,0,p.atkStep>=3?42:34,-1.1,0.9); ctx.stroke();
    ctx.restore();
  }
}

// ---- Enemies ----
function drawEnemy(e){
  const t=ETYPE[e.type]; const s=depthScale(e.y);
  const sx=e.x-camX, sy=e.y;
  if(e.dead && e.deadTimer<20) ctx.globalAlpha=clamp(e.deadTimer/20,0,1);
  shadow(sx,sy,(t.w*0.5)*s);
  ctx.save(); ctx.translate(sx,sy); ctx.scale(e.facing*s,s);
  if(e.state==='down'||e.dead){ ctx.rotate(0.9); ctx.translate(0,8); }
  const tele = e.telegraph>0;
  if(tele && Math.floor(e.telegraph/3)%2===0){ ctx.globalAlpha*=0.6; }

  if(t.boss) drawBoss(e);
  else if(e.type==='bitter') drawBitter(e);
  else drawBeast(e);

  ctx.restore();
  // HP pip for normal enemies (small)
  if(!t.boss && !e.dead && e.hp<e.maxHp){
    const bw=36*s, hpx=sx-bw/2, hpy=sy-e.h*s-8;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(hpx-1,hpy-1,bw+2,5);
    ctx.fillStyle='#ff5a3c'; ctx.fillRect(hpx,hpy,bw*(e.hp/e.maxHp),3);
  }
  ctx.globalAlpha=1;
}

// generic four-legged beast (wolf / hyena / boar)
function drawBeast(e){
  const t=ETYPE[e.type];
  const c1=t.color1, c2=t.color2;
  const atk=e.state==='attack';
  const walk=(e.state==='walk')?Math.sin(e.anim*2)*4:0;
  // legs
  ctx.fillStyle=c2;
  ctx.fillRect(-16,-18+walk,8,18); ctx.fillRect(8,-18-walk,8,18);
  ctx.fillRect(-4,-16-walk,8,16); ctx.fillRect(0,-16+walk,8,16);
  // body
  ctx.fillStyle=c1;
  ctx.beginPath(); ctx.ellipse(0,-32,26,18,0,0,7); ctx.fill();
  // back ridge / fur
  ctx.fillStyle=c2;
  ctx.beginPath(); ctx.moveTo(-22,-40); ctx.lineTo(-10,-52); ctx.lineTo(-2,-42);
  ctx.lineTo(6,-52); ctx.lineTo(14,-42); ctx.lineTo(22,-48); ctx.lineTo(22,-30); ctx.lineTo(-22,-30); ctx.fill();

  if(e.type==='boar'){
    // bandana
    ctx.fillStyle='#3a7d3a'; ctx.fillRect(-24,-30,48,7);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-26,2,0,7); ctx.fill(); // skull dot
  } else {
    // spiked collar
    ctx.fillStyle='#222'; ctx.fillRect(14,-30,12,8);
    ctx.fillStyle='#bbb';
    ctx.beginPath(); ctx.moveTo(16,-30);ctx.lineTo(18,-36);ctx.lineTo(20,-30); ctx.moveTo(21,-30);ctx.lineTo(23,-36);ctx.lineTo(25,-30); ctx.fill();
  }
  // head
  const hx=22, hy=-44;
  ctx.fillStyle=c1;
  ctx.beginPath(); ctx.ellipse(hx,hy,16,14,0,0,7); ctx.fill();
  // ears

  if(e.type==='hyena'){ // mohawk
    for(let i=-1;i<2;i++){ ctx.beginPath(); ctx.moveTo(hx-4+i*5,hy-12); ctx.lineTo(hx-2+i*5,hy-24); ctx.lineTo(hx+2+i*5,hy-12); ctx.fill(); }
  } else {
    ctx.beginPath(); ctx.moveTo(hx-8,hy-10); ctx.lineTo(hx-14,hy-22); ctx.lineTo(hx-2,hy-13); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx+6,hy-12); ctx.lineTo(hx+2,hy-24); ctx.lineTo(hx+12,hy-12); ctx.fill();
  }
  // snout
  ctx.fillStyle=c1;
  ctx.beginPath(); ctx.moveTo(hx+8,hy-2); ctx.lineTo(hx+24,hy+ (atk?-4:0)); ctx.lineTo(hx+24,hy+8); ctx.lineTo(hx+8,hy+8); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(hx+24,hy+2,3,0,7); ctx.fill();

    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(hx+12,hy+4);ctx.lineTo(hx+15,hy+9);ctx.lineTo(hx+18,hy+4); ctx.fill();
  }
  if(e.type==='boar'){ // tusks
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(hx+18,hy+8); ctx.lineTo(hx+22,hy+2); ctx.lineTo(hx+24,hy+8); ctx.fill();
  }
  // angry eye
  ctx.fillStyle='#ffdb3a'; ctx.beginPath(); ctx.ellipse(hx+4,hy-3,3,2.5,0,0,7); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(hx+5,hy-3,1.4,0,7); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(hx-2,hy-8); ctx.lineTo(hx+8,hy-4); ctx.stroke();

  ctx.fillStyle='#3a3a44'; ctx.beginPath(); ctx.ellipse(0,-50,32,28,0,0,7); ctx.fill();
  ctx.fillStyle='#caa54a'; ctx.fillRect(-30,-50,60,6);
  // skull emblem
  ctx.fillStyle='#e8e0d0'; ctx.beginPath(); ctx.arc(0,-58,9,0,7); ctx.fill();
  ctx.fillStyle='#26252b'; ctx.beginPath(); ctx.arc(-3,-58,2,0,7); ctx.arc(3,-58,2,0,7); ctx.fill();
  // head (bulldog)
  ctx.fillStyle='#1a1a1f';
  ctx.beginPath(); ctx.ellipse(0,-104,34,30,0,0,7); ctx.fill();
  // jowls
  ctx.fillStyle='#222228';
  ctx.beginPath(); ctx.ellipse(-16,-92,14,16,0,0,7); ctx.ellipse(16,-92,14,16,0,0,7); ctx.fill();
  // snout
  ctx.fillStyle='#15151a'; ctx.beginPath(); ctx.ellipse(0,-96,16,12,0,0,7); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(0,-102,7,5,0,0,7); ctx.fill();
  // angry red eyes
  ctx.fillStyle='#ff2a2a'; ctx.beginPath(); ctx.ellipse(-12,-114,5,4,0,0,7); ctx.ellipse(12,-114,5,4,0,0,7); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-20,-124);ctx.lineTo(-6,-116); ctx.moveTo(20,-124);ctx.lineTo(6,-116); ctx.stroke();
  // fangs
  if(atk||e.telegraph>0){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-8,-90);ctx.lineTo(-5,-80);ctx.lineTo(-2,-90); ctx.moveTo(8,-90);ctx.lineTo(5,-80);ctx.lineTo(2,-90); ctx.fill(); }
  // crown
  ctx.fillStyle='#ffcf3a';
  ctx.beginPath(); ctx.moveTo(-26,-130); ctx.lineTo(-26,-142); ctx.lineTo(-14,-132);
  ctx.lineTo(0,-148); ctx.lineTo(14,-132); ctx.lineTo(26,-142); ctx.lineTo(26,-130); ctx.fill();
  ctx.fillStyle='#e23'; ctx.beginPath(); ctx.arc(0,-136,3,0,7); ctx.fill();
  // scepter arm
  let ang=atk? (-0.6+(1-e.atkTimer/26)*1.4) : -0.2;
  ctx.save(); ctx.translate(34,-70); ctx.rotate(ang);
  ctx.strokeStyle='#caa54a'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(8,-60); ctx.stroke();
  ctx.fillStyle='#8a2be2'; ctx.beginPath(); ctx.arc(8,-66,10,0,7); ctx.fill();
  ctx.fillStyle='#caa54a'; ctx.beginPath(); ctx.arc(8,-66,5,0,7); ctx.fill();

}

function shadow(x,y,r){
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(x,y+2,r,r*0.32,0,0,7); ctx.fill();
}

//======================================================================
//  HUD
//======================================================================
function drawHUD(){
  // ----- player portrait box (top-left) -----
  panel(12,12,250,52);
  faceIcon(38,38,'#f6e8c6');
  ctx.fillStyle='#ffe14d'; ctx.font='bold 15px Trebuchet MS';
  ctx.fillText('1P  聖犬士イッヌ',70,28);
  // hp bar
  barFrame(70,34,170,12);
  const hpg=ctx.createLinearGradient(70,0,240,0); hpg.addColorStop(0,'#ffe14d'); hpg.addColorStop(1,'#ff4d2d');
  ctx.fillStyle=hpg; ctx.fillRect(72,36, 166*clamp(player.hp/player.maxHp,0,1), 8);
  // lives
  ctx.fillStyle='#ff5a6a'; ctx.font='14px Trebuchet MS';
  ctx.fillText('♥ ×'+Math.max(0,player.lives), 70, 60);
  // score
  ctx.fillStyle='#fff'; ctx.font='bold 18px monospace';
  ctx.fillText(String(score).padStart(6,'0'), 175, 60);

  // ----- timer (top-center) -----
  ctx.textAlign='center';
  ctx.fillStyle='#ffcf3a'; ctx.font='bold 14px Trebuchet MS'; ctx.fillText('TIME',W/2,24);
  ctx.fillStyle=stageTime<=10?'#ff4444':'#fff'; ctx.font='bold 30px monospace';
  ctx.fillText(String(stageTime).padStart(2,'0'),W/2,52);
  if(state==='play'&&Math.floor(Date.now()/500)%2) { ctx.fillStyle='#7fff7f'; ctx.font='bold 11px Trebuchet MS'; ctx.fillText('PRESS  ATTACK',W/2,66);}
  ctx.textAlign='left';

  // ----- boss bar (top-right) when boss present -----
  const boss=enemies.find(e=>ETYPE[e.type].boss && !e.dead);
  if(boss){
    panel(W-262,12,250,40);
    ctx.fillStyle='#c46bff'; ctx.font='bold 14px Trebuchet MS'; ctx.textAlign='right';
    ctx.fillText('ダークワンワン大帝',W-22,28); ctx.textAlign='left';
    barFrame(W-240,32,218,12);
    ctx.fillStyle='#a020f0'; ctx.fillRect(W-238,34,214*clamp(boss.hp/boss.maxHp,0,1),8);
  }
  // mini-boss bar
  const mini=enemies.find(e=>e.type==='bitter'&&!e.dead);
  if(mini && !boss){
    panel(W-262,12,250,38);
    ctx.fillStyle='#b388ff'; ctx.font='bold 13px Trebuchet MS'; ctx.textAlign='right';
    ctx.fillText('ビター・イッヌ',W-22,28); ctx.textAlign='left';
    barFrame(W-240,30,218,10);
    ctx.fillStyle='#7a3ad8'; ctx.fillRect(W-238,32,214*clamp(mini.hp/mini.maxHp,0,1),6);
  }

  // ----- combo -----
  if(combo.count>=2){
    const a=clamp(combo.timer/30,0,1);
    ctx.save(); ctx.globalAlpha=clamp(a+0.3,0,1);
    const cy=160, pop=combo.count>0? Math.min(1,(90-combo.timer)/6):1;
    ctx.font='italic bold 26px Trebuchet MS';
    ctx.fillStyle='#ff9a3a'; ctx.strokeStyle='#5a2400'; ctx.lineWidth=4;
    ctx.strokeText('COMBO!',24,cy); ctx.fillText('COMBO!',24,cy);
    ctx.font='italic bold 40px Trebuchet MS';
    const txt=combo.count+' HIT!';
    ctx.fillStyle='#46c8ff'; ctx.strokeText(txt,24,cy+38); ctx.fillText(txt,24,cy+38);
    ctx.restore();
  }

  // ----- objective banner -----
  if(enemies.some(e=>ETYPE[e.type].boss&&!e.dead)){
    ctx.fillStyle='rgba(0,0,0,.5)'; roundRect(W/2-90,H-44,180,30,6); ctx.fill();
    ctx.fillStyle='#ffe14d'; ctx.font='bold 16px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText('ボスをたおせ！',W/2,H-23); ctx.textAlign='left';
  }

  // ----- GO arrow -----
  if(goArrow>0 && state==='play'){
    const a=Math.abs(Math.sin(goArrow*0.15));
    ctx.globalAlpha=clamp(goArrow/40,0,1)*0.5+0.5;
    ctx.fillStyle='#ffec5a'; ctx.font='bold 40px Trebuchet MS'; ctx.textAlign='right';
    ctx.fillText('GO →',W-30+a*8,H/2); ctx.textAlign='left'; ctx.globalAlpha=1;
  }

  // ----- boss intro speech -----
  if(bossIntro>0){
    const big=enemies.find(e=>(ETYPE[e.type].boss||e.type==='bitter')&&!e.dead);
    if(big){
      const sx=clamp(big.x-camX,160,W-160), sy=big.y-big.h*depthScale(big.y)-40;
      speech(sx,sy, big.type==='boss'?'ワンワン帝国の力を思い知るがいい！':'フッ…相手になるかな？');
    }
  }

  // ----- pause -----
  if(state==='pause'){
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.font='bold 40px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText('PAUSE',W/2,H/2); ctx.font='16px Trebuchet MS';
    ctx.fillText('P で再開',W/2,H/2+34); ctx.textAlign='left';
  }
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(8,10,20,.62)'; roundRect(x,y,w,h,8); ctx.fill();
  ctx.strokeStyle='rgba(255,210,80,.6)'; ctx.lineWidth=2; roundRect(x,y,w,h,8); ctx.stroke();
}
function barFrame(x,y,w,h){ ctx.fillStyle='#000'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1; ctx.strokeRect(x-1,y-1,w+2,h+2); }
function faceIcon(x,y,col){
  ctx.fillStyle='rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(x,y,22,0,7); ctx.fill();
  ctx.fillStyle=col; fluff(x,y,18); fluff(x-12,y-2,9); fluff(x+12,y-2,9); fluff(x,y-12,9);
  ctx.fillStyle='#fff7e6'; ctx.beginPath(); ctx.ellipse(x+2,y+3,9,8,0,0,7); ctx.fill();
  ctx.fillStyle='#2a1c10'; ctx.beginPath(); ctx.arc(x-2,y,2,0,7); ctx.arc(x+5,y,2,0,7); ctx.fill();
  ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(x+6,y+4,2,0,7); ctx.fill();
}
function speech(x,y,txt){
  ctx.font='bold 15px Trebuchet MS';
  const w=ctx.measureText(txt).width+24;
  ctx.fillStyle='#6a2db0'; roundRect(x-w/2,y-32,w,28,8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x-8,y-6);ctx.lineTo(x+8,y-6);ctx.lineTo(x,y+6); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(txt,x,y-13); ctx.textAlign='left';
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

const elStart=document.getElementById('start');
const elResult=document.getElementById('result');
const elRTitle=document.getElementById('result-title');
const elRSub=document.getElementById('result-sub');

function startGame(){
  if(actx&&actx.state==='suspended') actx.resume();
  score=0; stageTime=99; timeAcc=0; camX=0; particles=[]; enemies=[]; combo.count=0;
  buildEncounters(); resetPlayer(true);
  state='play';
  elStart.classList.add('hidden'); elResult.classList.add('hidden');
}
function gameOver(){ state='over'; sfx.ko();
  elRTitle.textContent='GAME OVER'; elRTitle.style.color='#ff5a5a';
  elRSub.textContent='SCORE  '+String(score).padStart(6,'0');
  elResult.classList.remove('hidden'); }
function winGame(){ state='win'; sfx.win();
  score+=Math.max(0,stageTime)*50;
  elRTitle.textContent='STAGE CLEAR!'; elRTitle.style.color='#ffe14d';
  elRSub.textContent='ワンワン帝国を打ち倒した！  SCORE '+String(score).padStart(6,'0');
  elResult.classList.remove('hidden'); }
function togglePause(){ state = state==='pause'?'play':'pause'; }

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;

//======================================================================
//  Touch controls
//======================================================================
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
if(isTouch){ document.getElementById('touch').style.display='block'; }
function bindBtn(id,key){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault(); keys['_'+key]=true; mapTouch(); if(key==='atk')pressed.atk=true; if(key==='dash')pressed.dash=true;},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault(); keys['_'+key]=false; mapTouch();},{passive:false});
}
function mapTouch(){
  if(keys['_atk']) K.atk=true; if(keys['_grd']) K.grd=true; if(keys['_dash']) K.dash=true;
  if(!keys['_atk']&&!(keys['KeyJ']||keys['KeyZ'])) K.atk=false;
  if(!keys['_grd']&&!(keys['KeyK']||keys['KeyX'])) K.grd=false;
  if(!keys['_dash']&&!(keys['KeyL']||keys['ShiftLeft'])) K.dash=false;
}
bindBtn('bAtk','atk'); bindBtn('bGrd','grd'); bindBtn('bDash','dash');
// virtual stick
const stick=document.getElementById('stick'), nub=stick.querySelector('.nub');
let stickId=null,scx=0,scy=0;
stick.addEventListener('touchstart',e=>{e.preventDefault(); const t=e.changedTouches[0]; stickId=t.identifier;
  const r=stick.getBoundingClientRect(); scx=r.left+r.width/2; scy=r.top+r.height/2; moveStick(t);},{passive:false});
stick.addEventListener('touchmove',e=>{e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===stickId) moveStick(t);},{passive:false});
stick.addEventListener('touchend',e=>{for(const t of e.changedTouches) if(t.identifier===stickId){ stickId=null; nub.style.left='50%'; nub.style.top='50%'; K.left=K.right=K.up=K.down=false; }},{passive:false});
function moveStick(t){
  let dx=t.clientX-scx, dy=t.clientY-scy; const m=Math.hypot(dx,dy)||1, max=55;
  const cl=Math.min(m,max); dx=dx/m*cl; dy=dy/m*cl;
  nub.style.left=`calc(50% + ${dx}px)`; nub.style.top=`calc(50% + ${dy}px)`;
  const th=18;
  K.left=dx<-th; K.right=dx>th; K.up=dy<-th; K.down=dy>th;
}

//======================================================================
//  Resize / scale canvas to viewport
//======================================================================
function resize(){
  const r=Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.style.width=(W*r)+'px'; cv.style.height=(H*r)+'px';
}
addEventListener('resize',resize); resize();

//======================================================================
//  Main loop
//======================================================================
function loop(){
  update();
  render();
  // title backdrop animation
  if(state==='title'){ /* canvas shows static-ish bg */ }
  requestAnimationFrame(loop);
}
// draw an attract background once before start
buildEncounters();
loop();
