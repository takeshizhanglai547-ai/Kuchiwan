<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>イッヌ大作戦 - Bullet Hell Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none;font-family:monospace;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────
const W = 320, H = 480;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width  = W;
  canvas.height = H;
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ── WEB AUDIO ──────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function sfx(type) {
  try {
    const ac = getAudio();
    const t  = ac.currentTime;
    function beep(freq0, freq1, dur, wave, vol) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = wave;
      o.frequency.setValueAtTime(freq0, t);
      if (freq1 !== freq0) o.frequency.exponentialRampToValueAtTime(freq1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur);
    }
    if (type === 'shoot')   beep(880, 440, 0.07, 'square',   0.13);
    if (type === 'hit')     beep(150,  80, 0.12, 'square',   0.18);
    if (type === 'explode') beep(200,  50, 0.22, 'sawtooth', 0.28);
    if (type === 'bomb')    beep( 60,  30, 0.55, 'sawtooth', 0.45);
    if (type === 'powerup') {
      [440,660,880].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'triangle'; o.frequency.setValueAtTime(f, t + i*0.1);
        g.gain.setValueAtTime(0.18, t + i*0.1);
        g.gain.exponentialRampToValueAtTime(0.001, t + i*0.1 + 0.12);
        o.start(t + i*0.1); o.stop(t + i*0.1 + 0.15);
      });
    }
    if (type === 'gameover') {
      [880,660,440,220].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'square'; o.frequency.setValueAtTime(f, t + i*0.2);
        g.gain.setValueAtTime(0.18, t + i*0.2);
        g.gain.exponentialRampToValueAtTime(0.001, t + i*0.2 + 0.18);
        o.start(t + i*0.2); o.stop(t + i*0.2 + 0.2);
      });
    }
  } catch(e) {}
}

// BGM scheduler
let bgmType = null;
let bgmMaster = null;
let bgmLoopId = 0;

function stopBGM() {
  bgmLoopId++;
  if (bgmMaster) { try { bgmMaster.disconnect(); } catch(e){} bgmMaster = null; }
  bgmType = null;
}

function playBGM(type) {
  if (bgmType === type) return;
  stopBGM();
  bgmType = type;
  try {
    const ac = getAudio();
    bgmMaster = ac.createGain();
    bgmMaster.gain.setValueAtTime(0.10, ac.currentTime);
    bgmMaster.connect(ac.destination);
    const id = ++bgmLoopId;
    scheduleBGM(ac, type, id);
  } catch(e) {}
}

function note(ac, master, freq, start, dur, wave, vol) {
  if (!freq) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.connect(g); g.connect(master);
  o.type = wave; o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur * 0.85);
  o.start(start); o.stop(start + dur);
}

function scheduleBGM(ac, type, id) {
  if (bgmLoopId !== id || !bgmMaster) return;
  let t = ac.currentTime + 0.05;

  if (type === 'title') {
    const mel = [[523,.15],[659,.15],[784,.15],[1047,.3],[784,.15],[659,.15],[523,.3],
                 [587,.15],[698,.15],[880,.15],[1175,.3],[880,.15],[698,.15],[587,.45]];
    let total = 0;
    mel.forEach(([f,d]) => { note(ac, bgmMaster, f, t+total, d, 'square', 0.25); total+=d; });
    setTimeout(() => scheduleBGM(ac, type, id), (total - 0.05) * 1000);

  } else if (type === 'stage') {
    const mel = [[784,.1],[784,.1],[0,.05],[880,.1],[784,.1],[0,.05],[698,.1],[784,.2],[0,.1],
                 [659,.1],[659,.1],[0,.05],[784,.1],[659,.1],[0,.05],[587,.1],[659,.2],[0,.15]];
    const bas = [[131,.2],[131,.2],[147,.2],[131,.2],[123,.2],[123,.2],[131,.2],[131,.2]];
    let mt=0, bt=0, total=0;
    mel.forEach(([f,d]) => { note(ac, bgmMaster, f, t+mt, d, 'square',   0.22); mt+=d; total=mt; });
    bas.forEach(([f,d]) => { note(ac, bgmMaster, f, t+bt, d, 'sawtooth', 0.12); bt+=d; });
    setTimeout(() => scheduleBGM(ac, type, id), (total - 0.05) * 1000);

  } else if (type === 'boss') {
    const mel = [[220,.1],[0,.05],[220,.1],[0,.05],[262,.1],[247,.1],[233,.2],
                 [196,.1],[0,.05],[196,.1],[0,.05],[233,.1],[220,.1],[196,.2],
                 [175,.1],[0,.05],[175,.1],[0,.05],[220,.1],[196,.1],[175,.2],[0,.1]];
    let total = 0;
    mel.forEach(([f,d]) => {
      note(ac, bgmMaster, f,   t+total, d, 'sawtooth', 0.18);
      note(ac, bgmMaster, f*2, t+total, d, 'square',   0.09);
      total += d;
    });
    setTimeout(() => scheduleBGM(ac, type, id), (total - 0.05) * 1000);
  }
}

// ── INPUT ──────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const touch = {
  joy: { active:false, id:-1, sx:0, sy:0, dx:0, dy:0 },
  shot: false,
  bombPressed: false,
};

function touchZone(x, y) {
  if (x < W * 0.6) return 'joy';
  if (y > H * 0.7)  return 'shot';
  return 'bomb';
}
function toCanvas(cx, cy) {
  return {
    x: cx / (canvas.clientWidth  / W),
    y: cy / (canvas.clientHeight / H),
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  try { getAudio().resume(); } catch(_){}
  for (const t2 of e.changedTouches) {
    const {x, y} = toCanvas(t2.clientX, t2.clientY);
    const z = touchZone(x, y);
    if (z === 'joy' && !touch.joy.active)
      touch.joy = { active:true, id:t2.identifier, sx:x, sy:y, dx:0, dy:0 };
    else if (z === 'shot') touch.shot = true;
    else if (z === 'bomb') touch.bombPressed = true;
  }
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t2 of e.changedTouches) {
    if (t2.identifier === touch.joy.id) {
      const {x, y} = toCanvas(t2.clientX, t2.clientY);
      touch.joy.dx = x - touch.joy.sx;
      touch.joy.dy = y - touch.joy.sy;
    }
  }
}, { passive:false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t2 of e.changedTouches) {
    if (t2.identifier === touch.joy.id)
      touch.joy = { active:false, id:-1, sx:0, sy:0, dx:0, dy:0 };
    const {x, y} = toCanvas(t2.clientX, t2.clientY);
    const z = touchZone(x, y);
    if (z === 'shot') touch.shot = false;
  }
}, { passive:false });

function getInput() {
  let dx = 0, dy = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
  if (keys['ArrowUp']    || keys['KeyW']) dy -= 1;
  if (keys['ArrowDown']  || keys['KeyS']) dy += 1;

  if (touch.joy.active) {
    const JD = 40;
    const jx = touch.joy.dx, jy = touch.joy.dy;
    const d  = Math.sqrt(jx*jx + jy*jy);
    if (d > 5) { dx += jx / Math.max(d, JD); dy += jy / Math.max(d, JD); }
  }

  const len = Math.sqrt(dx*dx + dy*dy);
  if (len > 1) { dx /= len; dy /= len; }

  const shooting = !!(keys['KeyZ'] || keys['Space'] || touch.shot);
  const bomb     = !!(keys['KeyX'] || touch.bombPressed);
  if (touch.bombPressed) touch.bombPressed = false;
  return { dx, dy, shooting, bomb };
}

function drawTouchUI() {
  // Joystick ring
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(75, H-65, 38, 0, Math.PI*2); ctx.stroke();
  if (touch.joy.active) {
    const jx = touch.joy.sx, jy = touch.joy.sy;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(jx, jy, 38, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    const nx = Math.max(-30, Math.min(30, touch.joy.dx));
    const ny = Math.max(-30, Math.min(30, touch.joy.dy));
    ctx.beginPath(); ctx.arc(jx+nx, jy+ny, 16, 0, Math.PI*2); ctx.fill();
  }
  // SHOT button
  ctx.fillStyle = touch.shot ? 'rgba(255,220,0,0.55)' : 'rgba(255,200,0,0.22)';
  ctx.beginPath(); ctx.arc(W-42, H-52, 26, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,0,0.65)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SHOT', W-42, H-52);
  // BOMB button
  ctx.fillStyle = 'rgba(80,180,255,0.22)';
  ctx.beginPath(); ctx.arc(W-42, H-110, 20, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(80,200,255,0.65)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 8px monospace';
  ctx.fillText('BOMB', W-42, H-110);
}

// ── PLACEHOLDER ────────────────────────────────────────────
ctx.fillStyle = '#1a0040';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#fff';
ctx.font = '16px monospace';
ctx.textAlign = 'center';
ctx.fillText('Loading...', W/2, H/2);
</script>
</body>
</html>
