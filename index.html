<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUCHIWAN: IRON CLASH – 3D Mech Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <!-- Player Status -->
    <div id="player-status">
      <div class="pilot-name">KUCHIWAN</div>
      <div class="status-row">
        <span class="status-label">AP</span>
        <div class="bar-wrap"><div id="ap-bar" class="bar bar-ap"></div></div>
        <span id="ap-val" class="status-val">12000</span>
      </div>
      <div class="status-row">
        <span class="status-label">EN</span>
        <div class="bar-wrap"><div id="en-bar" class="bar bar-en"></div></div>
      </div>
      <div class="status-row">
        <span class="status-label">QB</span>
        <div class="bar-wrap"><div id="qb-bar" class="bar bar-qb"></div></div>
      </div>
    </div>

    <!-- Weapon -->
    <div id="weapon-status">
      <div class="weapon-row"><span class="w-label">RIFLE</span><span class="w-icon">▣</span><span id="ammo-count" class="w-val">∞</span></div>
      <div class="weapon-row"><span class="w-label">MISSILE</span><span class="w-icon">◈</span><span id="missile-count" class="w-val">36</span></div>
    </div>

    <!-- Lock-on -->
    <div id="lock-overlay">
      <div id="lock-ring" class="lock-ring"></div>
    </div>

    <!-- Enemy Status -->
    <div id="enemy-status" class="hidden">
      <div id="enemy-name-label">IRON GHOST</div>
      <div class="status-row">
        <span class="status-label">AP</span>
        <div class="bar-wrap"><div id="enemy-ap-bar" class="bar bar-enemy"></div></div>
        <span id="enemy-ap-val" class="status-val"></span>
      </div>
      <div id="phase-label"></div>
    </div>

    <!-- Center info -->
    <div id="center-info"></div>

    <!-- Crosshair -->
    <div id="crosshair">
      <div class="ch-h"></div>
      <div class="ch-v"></div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="title-block">
      <div class="title-sub">AC-STYLE 3D MECH BATTLE</div>
      <h1 class="title-main">KUCHIWAN</h1>
      <div class="title-sub2">IRON CLASH</div>
      <div class="title-sub">口湾 vs IRON GHOST</div>
    </div>
    <div class="controls-block">
      <h3>── CONTROLS ──</h3>
      <div class="ctrl-grid">
        <span>WASD</span><span>移動</span>
        <span>マウス</span><span>照準 / カメラ</span>
        <span>左クリック</span><span>ライフル射撃</span>
        <span>右クリック</span><span>ミサイル発射</span>
        <span>Shift</span><span>ブースト（高速移動）</span>
        <span>E</span><span>クイックブースト（瞬間回避）</span>
        <span>Space</span><span>上昇</span>
        <span>Ctrl</span><span>下降</span>
        <span>Q</span><span>ロックオン切替</span>
      </div>
    </div>
    <button id="start-btn">── ENGAGE IRON GHOST ──</button>
  </div>

  <!-- Game Over / Clear -->
  <div id="result-screen" class="hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <button id="retry-btn">RETRY</button>
  </div>

  <!-- Touch Controls (mobile) -->
  <div id="touch-controls" class="hidden">
    <!-- Left: Virtual Joystick + Up/Down -->
    <div id="vjoy-area">
      <div id="btn-up" class="touch-btn small-btn">▲</div>
      <div id="vjoy-base"><div id="vjoy-handle"></div></div>
      <div id="btn-down" class="touch-btn small-btn">▼</div>
    </div>
    <!-- Right: Action Buttons -->
    <div id="action-area">
      <div class="action-row">
        <div id="btn-lock" class="touch-btn">LOCK</div>
        <div id="btn-qb" class="touch-btn">QB</div>
      </div>
      <div class="action-row">
        <div id="btn-fire" class="touch-btn fire-btn">FIRE</div>
        <div id="btn-missile" class="touch-btn">MSL</div>
      </div>
      <div class="action-row">
        <div id="btn-boost" class="touch-btn boost-btn">BOOST</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
