    case 'down': case 'ko': {
      if(!e.onGround){ T.lie = A==='ko' ? Math.min(1.15, t/9) : Math.min(1, t/7); T.aF = -2.4 + Math.sin(k*0.8)*0.5; T.aB = -2.1 - Math.sin(k*0.8)*0.5; T.lF = 0.5 + Math.sin(k*0.7)*0.4; T.lB = 0.2 - Math.sin(k*0.7)*0.4; T.eF = T.eB = 1.0; }
      else { T.lie = 1; T.aF = -2.7; T.aB = -2.5; T.aFx = -0.4; T.aBx = 0.4; T.lF = 0.9 + (A==='ko' ? Math.sin(k*0.45)*0.12 : 0); T.lB = 0.5; T.eF = T.eB = 0.7; T.hz = 0.15; if(A==='ko') r.showStars = true; }
      T.tz = -0.4;
      r.K = 0.45;
      break;
    }
    case 'getup': {
      const q = U.clamp(t/Math.max(1, e.animLen||24), 0, 1);
      T.lie = 1 - U.easeOutBack(q); T.aF = U.lerp(-1.6, 0.3, q); T.aB = U.lerp(-1.4, -0.1, q); T.sq = q > 0.75 ? -0.12*(1-q)/0.25 : 0; T.lF = U.lerp(0.8, 0, q); T.lB = U.lerp(0.4, 0, q);
      r.K = 0.55;
      break;
    }
    case 'dizzy': {
      const w = k*0.12;
      T.lean = Math.sin(w)*0.14; T.sway = Math.cos(w)*0.1; T.hz = Math.sin(w + 1)*0.12; T.hx = Math.cos(w + 1)*0.1;
      T.aF = 0.35 + Math.sin(w)*0.2; T.aB = 0.3 - Math.sin(w)*0.2; T.aFx = -0.35; T.aBx = 0.35; T.sq = -0.04; T.eF = T.eB = -0.35; T.tz = -0.5;
      r.showStars = true;
      break;
    }
    case 'cheer': {
      const w = k*0.4, moving = Math.abs(e.vx||0) > 0.02;
      if(moving){ r.phase += 0.55; const s = Math.sin(r.phase); T.lF = s*0.8; T.lB = -s*0.8; T.lean = -0.12; }
      else { T.bob = Math.abs(Math.sin(k*0.2))*0.14; T.sq = Math.cos(k*0.4)*0.05; }
      T.aF = -2.7 + Math.sin(w)*0.35; T.aB = -2.5 - Math.sin(w)*0.35; T.aFx = -0.35; T.aBx = 0.35;
      T.ty = Math.sin(k*0.9)*0.9; T.tz = 0.35; T.eF = T.eB = Math.abs(Math.sin(k*0.2))*0.35; T.hz = 0.15;
      r.K = 0.5;
      break;
    }
    case 'fall': {
      T.aF = -2.6 + Math.sin(k*0.7)*0.4; T.aB = -2.4 - Math.sin(k*0.7)*0.4; T.aFx = -0.3; T.aBx = 0.3; T.lF = 0.3 + Math.sin(k*0.6)*0.3; T.lB = -0.3 - Math.sin(k*0.6)*0.3;
      T.sq = 0.12; T.eF = T.eB = 1.0; T.tz = 0.6;
      break;
    }
    case 'jump': {
      if((e.vy||0) > 0){ T.sq = 0.12; T.aF = -2.2; T.aB = -2.0; T.lF = 0.2; T.lB = -0.3; }
      else { T.sq = -0.04; T.aF = -1.2; T.aB = -1.0; T.lF = 0.55; T.lB = 0.3; }
      T.eF = T.eB = 0.5;
      break;
    }
    default: { // idle
      const b = Math.sin(k*0.09);
      T.sq = b*0.025; T.bob = Math.abs(Math.sin(k*0.09))*0.012;
      T.aF = 0.3 + b*0.06; T.aB = 0.18 - b*0.05; T.aFx = -0.18; T.aBx = 0.18;
      T.hz = Math.sin(k*0.045)*0.04; T.ty = Math.sin(k*0.07)*0.3; T.tz = 0.15;
      T.eF = T.eB = Math.max(0, Math.sin(k*0.031 + 1.3) - 0.92)*3;
    }
  }
}

// ---------------------------------------------------------------- quadruped (boar)
function poseQuad(r, e, A, t, p, hit, k){
  const T = r.T;
  const spd = Math.hypot(e.vx||0, e.vz||0);
  T.tz = 0.2;
  switch(A){
    case 'walk': case 'run': {
      r.phase += Math.max(0.24, spd*12);
      const s = Math.sin(r.phase);
      T.q1 = s*0.55; T.q4 = s*0.55; T.q2 = -s*0.55; T.q3 = -s*0.55;
      T.bob = Math.abs(Math.cos(r.phase))*0.03; T.hz = Math.sin(r.phase*2)*0.04; T.ty = Math.sin(r.phase*2)*0.5;
      r.K = 0.5; break;
    }
    case 'windup': {
      const q = U.easeOutCubic(Math.min(1, p*1.5));
      T.lean = 0.12*q; T.hz = -0.28*q; T.q1 = -0.35 + Math.sin(k*0.55)*0.6*q; T.q3 = 0.25*q; T.q4 = 0.25*q; T.sq = -0.06*q;
      T.eF = T.eB = -0.5*q; r.shake = Math.sin(k*2.6)*(0.01 + 0.03*p); T.ty = Math.sin(k*1.2)*0.6;
      r.K = 0.45; break;
    }
    case 'attack2': { // the charge: gallop
      r.phase += 0.75;
      const s = Math.sin(r.phase);
      T.q1 = T.q2 = s*0.95; T.q3 = T.q4 = -s*0.95; T.bob = Math.abs(s)*0.08; T.sq = -Math.abs(Math.cos(r.phase))*0.06;
      T.hz = -0.32; T.lean = -0.08; T.eF = T.eB = -0.6; T.tz = 0.7;
      r.K = 0.6; break;
    }
    case 'attack': case 'special': case 'shoot': {
      if(p < hit){ const q = p/hit; T.hz = U.lerp(-0.3, 0.45, q*q); T.px = 0.15*q; T.q1 = T.q2 = -0.3*q; T.sq = 0.08*q; }
      else { const q = (p-hit)/(1-hit), hold = 1 - U.smooth(q, 0.3, 1); T.hz = 0.45*hold; T.px = 0.15*hold; T.q1 = T.q2 = -0.3*hold; }
      r.K = 0.65; break;
    }
    case 'hurt': {
      const dec = Math.exp(-t/9);
      T.lean = 0.25*dec; T.hz = 0.3*dec; T.sq = Math.sin(t*1.1)*0.12*dec; r.shake = Math.sin(t*3.1)*0.03*dec; T.eF = T.eB = 0.8*dec;
      T.q1 = 0.4*dec; T.q2 = -0.3*dec; r.K = 0.6; break;
    }
    case 'down': case 'ko': {
      if(!e.onGround){ T.lie = Math.min(1, t/8); T.q1 = Math.sin(k*0.9)*0.6; T.q2 = -T.q1; T.q3 = T.q1; T.q4 = -T.q1; }
      else { T.lie = 1; const w = A==='ko' ? Math.sin(k*0.5)*0.15 : 0; T.q1 = 0.5 + w; T.q2 = 0.3 - w; T.q3 = -0.4 + w; T.q4 = -0.6 - w; if(A==='ko') r.showStars = true; }
      T.eF = T.eB = 0.6; T.tz = -0.3; r.K = 0.45; break;
    }
    case 'getup': { const q = U.clamp(t/Math.max(1, e.animLen||24), 0, 1); T.lie = 1 - U.easeOutBack(q); r.K = 0.55; break; }
    case 'dizzy': { const w = k*0.12; T.lean = Math.sin(w)*0.08; T.spin = Math.cos(w)*0.06; T.hz = Math.sin(w+1)*0.15; T.hy = Math.cos(w)*0.2; T.eF = T.eB = -0.4; r.showStars = true; break; }
    case 'cheer': { r.phase += 0.5; const s = Math.sin(r.phase); T.q1 = s*0.7; T.q4 = s*0.7; T.q2 = -s*0.7; T.q3 = -s*0.7; T.bob = Math.abs(Math.sin(k*0.2))*0.1; T.ty = Math.sin(k*0.9)*0.9; T.hz = 0.2; r.K = 0.5; break; }
    case 'fall': { T.q1 = Math.sin(k*0.7)*0.6; T.q2 = -T.q1; T.q3 = T.q1*0.8; T.q4 = -T.q1*0.8; T.sq = 0.1; T.eF = T.eB = 1.0; break; }
    case 'jump': { T.q1 = T.q2 = -0.5; T.q3 = T.q4 = 0.5; T.sq = (e.vy||0) > 0 ? 0.1 : -0.03; break; }
    default: { const b = Math.sin(k*0.08); T.sq = b*0.02; T.hz = Math.sin(k*0.05)*0.05; T.ty = Math.sin(k*0.07)*0.4;
      // snort every few seconds
      const sn = (k % 220); if(sn < 16){ T.hz += Math.sin(sn*0.8)*0.08; } }
  }
}

// ---------------------------------------------------------------- balloon
function poseBalloon(r, e, A, t, p, hit, k){
  const T = r.T;
  const w = k*0.06;
  T.bob = Math.sin(w)*0.04; T.hz = Math.sin(w*0.7)*0.06 - U.clamp((e.vx||0)*3, -0.2, 0.2)*(e.face||1);
  T.tz = Math.sin(w*1.3)*0.25 + U.clamp((e.vx||0)*4, -0.3, 0.3)*(e.face||1);
  switch(A){
    case 'windup': T.puff = 0.18*U.easeOutCubic(p); r.shake = Math.sin(k*2.5)*(0.01 + 0.03*p); break;
    case 'attack': case 'attack2': case 'special': T.sq = p < hit ? -0.15 : 0.12*(1-p); T.hz = -0.3*(1-p); r.K = 0.6; break;
    case 'hurt': case 'down': case 'ko': T.sq = Math.sin(t*1.3)*0.15*Math.exp(-t/8); r.shake = Math.sin(t*3)*0.03; break;
    case 'cheer': T.bob += Math.abs(Math.sin(k*0.2))*0.1; break;
  }
}

// ================================================================ per-type extras (meshes that are not part of the skinned body)
const EXTRA = {};
// their geometries are built once and shared by every instance (rig.dispose never touches them)
const XGEO = {};
function xgeo(key, fn){ return XGEO[key] || (XGEO[key] = plain(fn)); }
EXTRA.shield = {
  pose(r, e, A, t, p, hit, k){
    const T = r.T;
    const guard = A==='idle' || A==='walk' || A==='run' || A==='windup' || A==='attack' || A==='attack2';
    if(!guard) return;
    const G0 = 1.25;
    if(A==='windup'){ T.aF = G0 - 0.45*U.easeOutCubic(Math.min(1, p*1.6)); T.lean = 0.2*Math.min(1, p*1.6); T.aFx = 0; }
    else if(A==='attack' || A==='attack2'){ const q = p < hit ? Math.pow(p/hit, 1.5) : 1 - U.smooth((p-hit)/(1-hit), 0.3, 1);
      T.aF = G0 - 0.45 + 0.75*q; T.px = 0.25*q; T.lean = 0.2 - 0.45*q; T.aFx = 0; }
    else { T.aF = G0 + Math.sin(k*0.09)*0.03; T.aFx = 0; }
    if(e.blockT > 0){ const b = e.blockT/12; T.aF += Math.sin(e.blockT*1.9)*0.18*b; T.px -= 0.08*b; T.sq -= 0.06*b; T.lean += 0.1*b; }
  },
};
EXTRA.flyer = {
  pose(r, e, A, t, p, hit, k){
    const T = r.T;
    const air = !e.onGround || (e.y||0) > 0.05 || !(e.grounded > 0);   // flaps unless grounded after a hit
    if(A==='down' || A==='ko' || A==='hurt' || A==='getup'){ T.aFx = -0.2 + Math.sin(k*0.9)*0.4; T.aBx = -T.aFx; return; }
    if(A==='attack' || A==='attack2'){ // swoop: wings swept back
      T.aFx = -0.1; T.aBx = 0.1; T.aF = -0.9; T.aB = -0.9; T.lean = -0.35; T.hz = -0.15; T.lF = -0.6; T.lB = -0.7; T.sq = 0.08; r.K = 0.5; return; }
    if(air){
      const f = A==='windup' ? 0.75 : 0.42, amp = A==='windup' ? 0.75 : 0.6;
      const w = Math.sin(k*f);
      T.aFx = -(0.35 + w*amp); T.aBx = (0.35 + w*amp); T.aF = -0.35; T.aB = -0.35;
      T.lF = 0.25 + Math.sin(k*0.1)*0.08; T.lB = 0.1 + Math.sin(k*0.1+1)*0.08; T.lFy = 0; T.lBy = 0;
      T.bob = -w*0.035; T.lean = A==='windup' ? 0.25 : -0.08;
      if(A==='windup'){ r.shake = Math.sin(k*2.2)*0.02*p; T.hz = 0.15; }
    } else if(e.grounded > 0){ T.aFx = -0.05; T.aBx = 0.05; T.aF = 0.4; T.aB = 0.4; T.eF = T.eB = -0.3; }
  },
};
EXTRA.bomber = {

    const sp = r.spark = new THREE.Mesh(xgeo('spark', (pp)=>{ const R = prim(); pp.add(R.star, '#fff6a0', [0,0,0], null, 1.2); pp.add(R.sm, '#ffb000', [0,0,0], null, 0.05); }),

EXTRA.thrower = {

EXTRA.kire = {

EXTRA.oni = {

      else { const q = (p-hit)/(1-hit), hold = 1 - U.smooth(q, 0.4, 1); T.aF = 0.25 + 1.25*hold; T.aB = 0.1 + 1.2*hold; T.lean = -0.4*hold; T.sq = -0.12*hold*(q<0.2?1:0.5); } r.K = 0.7; }

EXTRA.ari = {

EXTRA.mecha = {
  pose(r, e, A, t, p, hit, k){

  },

    else if(A==='hurt' || A==='down' || A==='ko') g = 0.7 + (Math.random()<0.5 ? 0.6 : 0);
    else if(A==='cheer') g = 1.6;
    r.faceMat.emissiveIntensity = g;
    if(A==='windup'){ const s = 1 + 0.25*p + Math.sin(k*1.3)*0.05*p; r.face.scale.set(1, s, s); } else if(r.face.scale.y!==1) r.face.scale.set(1,1,1);
  },

// ================================================================ gameplay helpers
function D(){ return (G.game && G.game.diff) || { think:1, attackers:2, foeSpeed:1 }; }
function rnd(){ return G.rng(); }
function pre(e){
  if(e.oniBuff > 0){ e.oniBuff--; if(e.oniBuff % 40 === 39) fxb('magic', e.x, e.y + e.height*0.6, e.z + 0.2, FX_BUFF); }
  e.spdMul = (e.rageMul||1) * (e.oniBuff > 0 ? 1.25 : 1);
  if(e.modeT > 0) e.modeT--;
  // stuck against a wall/edge while trying to walk somewhere → try the other side of the hero for a while
  if(e.sideLock > 0) e.sideLock--;
  if(e.state==='move' && Math.abs(e.x - (e.lastX==null ? e.x : e.lastX)) < 0.004 && Math.abs(e.vx) > 0.01){ if(++e.stuckT > 24){ e.stuckT = 0; e.sideVal = -sideOf(e); e.sideLock = 100; } }
  else e.stuckT = 0;
  e.lastX = e.x;
  const t = H.target(e);
  if(!t){ H.stop(e); return null; }
  return t;
}
const FX_BUFF = { count:4, scale:0.35, color:'#c58aff' };
// spot beside the target on this foe's side (no allocation)
let FX_ = 0, FZ_ = 0;
function sideOf(e){ const t = H.target(e); return t && e.x < t.x ? -1 : 1; }
function side(e, t){ return e.sideLock > 0 ? e.sideVal : (e.x < t.x ? -1 : 1); }
function flank(e, t, dist, dzOff){
  FX_ = t.x + side(e, t)*dist;
  FZ_ = U.clamp(t.z + (dzOff!=null ? dzOff : ((e.id%3)-1)*0.28), ZMIN, ZMAX);
}
function A(o){ return Object.assign({ len:26, recover:44 }, o); }
function HIT(o){ return Object.assign({ at:8, dur:4, x0:0.1, x1:1.15, zr:0.5, y0:0, y1:1.3, dmg:8, kb:0.09, stun:18, kind:'blunt', power:1 }, o); }
// telegraphed attack + cooldown. 30_foes reads `recover` from the TYPE def, so the per-attack recover is applied here:
// cool counts down during the windup and the attack too, so what is left afterwards is the recover gap.
function attack(e, d, windup){
  if(!H.attack(e, d, windup)) return false;
  const w = Math.max(0, Math.round(windup*(D().think||1)));
  e.cool = Math.max(e.cool||0, w + d.len + (d.recover==null ? 40 : d.recover));
  return true;
}
// generic melee brain: approach → (token) telegraphed attack → hang back while cooling down
function brawl(e, t, o){
  const dx = t.x - e.x, adx = Math.abs(dx), adz = Math.abs(t.z - e.z);
  const inRange = adx < o.reach && adz < (o.zr||0.4) && adx > (o.min||0);
  if(e.backOff > 0){
    e.backOff--;
    flank(e, t, o.wait||2.4); if(H.walkTo(e, FX_, FZ_, e.def.spd*0.8)) H.face(e, t); else if(adx < 3) H.face(e, t);
    return;
  }
  if(inRange && e.cool <= 0){
    H.face(e, t);
    if(H.token(e)){ const pk = o.pick(e, t); attack(e, pk[0], pk[1]); return; }
    e.backOff = 30 + Math.floor(rnd()*40);
    return;
  }
  if(e.cool > 0){
    flank(e, t, o.hold||1.9);
    if(Math.abs(e.x - FX_) < 0.35 && Math.abs(e.z - FZ_) < 0.3){ H.stop(e); H.face(e, t); }
    else { H.walkTo(e, FX_, FZ_, e.def.spd*0.7); if(adx < 3) H.face(e, t); }
    return;
  }
  flank(e, t, o.stand||1.0);
  if(H.walkTo(e, FX_, FZ_)) H.face(e, t);
}
function nearestBounds(){ return G.cam.viewRange(); }

function boarCharge(e, t){

  const vr = nearestBounds();

  const passed = (e.x - c.tx)*e.face > 2.6;

  if(c.stuck >= 2 || edge || passed || t >= 100){
    G.combat.cancel(e);
    e.chg = null;
    e.vx = e.face*0.05;

      H.say(e, 'ゴチン！'); fxb('stars', e.x + e.face*0.5, 0.8, e.z + 0.2, FX_STARS); if(G.cam) G.cam.shake(2.5, 10);

function starsFill(r, y){ return (b)=>{ for(let i=0;i<3;i++){ const a = i/3*TAU; b.add(star(0.12), '#ffe14d', [Math.cos(a)*r, y + (i===1?0.05:0), Math.sin(a)*r], [0, -a + HPI, 0.3*i]); } }; }

// ================================================================ rig kit
const FACE_KEYS = ['N','B','O','X','S','H'];
// pose targets P and damped values C: one object literal with every channel, damped field by field (a string-keyed
// loop over the channel names made them dictionaries, and every double stored there was a fresh heap number each tick)
function newPose(){ return { face:'N', sweat:0, stars:0, spin:0, wagSpd:0.1, bx:0, by:0, sx:1, sy:1, lean:0, twist:0, hx:0, hy:0, hz:0, aLz:0, aRz:0, aLx:0, aRx:0, lLz:0, lRz:0, roll:0, rz:0, jaw:0, wag:0, ex:0 }; }
function poseDamp(C, P, r){
  C.bx += (P.bx - C.bx)*r; C.by += (P.by - C.by)*r; C.sx += (P.sx - C.sx)*r; C.sy += (P.sy - C.sy)*r;
  C.lean += (P.lean - C.lean)*r; C.twist += (P.twist - C.twist)*r; C.hx += (P.hx - C.hx)*r; C.hy += (P.hy - C.hy)*r;
  C.hz += (P.hz - C.hz)*r; C.aLz += (P.aLz - C.aLz)*r; C.aRz += (P.aRz - C.aRz)*r; C.aLx += (P.aLx - C.aLx)*r;
  C.aRx += (P.aRx - C.aRx)*r; C.lLz += (P.lLz - C.lLz)*r; C.lRz += (P.lRz - C.lRz)*r; C.roll += (P.roll - C.roll)*r;
  C.rz += (P.rz - C.rz)*r; C.jaw += (P.jaw - C.jaw)*r; C.wag += (P.wag - C.wag)*r; C.ex += (P.ex - C.ex)*r;
}
const FAST = { attack:1, attack2:1, attack3:1, shoot:1, dash:1, roar:1, special:1, hurt:1 };
const YAW_R = -0.61, YAW_L = -(Math.PI - 0.61);

// per-rig materials are recycled, never disposed: three.js deletes a shader program as soon as no material uses it, so a
// disposed boss / ghost brother threw its program (and the see-through twin compiled for a fade) away and the next one
// compiled and linked it again. A recycled material keeps its programs.
const MPOOL = new Map();
function takeMat(key, make){
  let list = MPOOL.get(key);
  if(!list){ list = []; MPOOL.set(key, list); }
  if(list.length){ const m = list.pop(); m.userData.pool.free = false; return m; }
  const m = make();
  m.userData.pool = { list, free:false, tr:m.transparent, op:m.opacity, dw:m.depthWrite };
  return m;
}
function giveMat(m){
  const s = m && m.userData.pool;
  if(!s){ if(m) m.dispose(); return; }
  if(s.free) return;
  s.free = true;
  if(m.transparent!==s.tr){ m.transparent = s.tr; m.needsUpdate = true; }
  m.opacity = s.op; m.depthWrite = s.dw;
  if(m.userData.uFlash) m.userData.uFlash.value = 0;
  s.list.push(m);
}

function Kit(o){
  this.o = o;
  this.root = new THREE.Group(); this.root.name = 'boss_'+o.type;
  this.yaw = new THREE.Group(); this.root.add(this.yaw);
  this.body = new THREE.Group(); this.yaw.add(this.body);
  const rough = o.rough==null ? 0.68 : o.rough;
  this.mat = takeMat('body|'+rough, ()=> G.look.vmat({ instance:true, rough }));
  this.gmat = takeMat('gloss', ()=> G.look.vmat({ instance:true, rough:0.28, rim:0.35 }));
  this.outlines = []; this.meshes = []; this.fsets = [];
  this.P = newPose(); this.C = newPose();
  this.seed = (Math.random()*997)|0; this.ph = 0; this.yawV = YAW_R - (o.yawOff||0); this.alpha = 1;
  this.land = 0; this.wob = 0; this.flinch = 0; this.prevFlash = 0; this.wasGround = true;
  this.sqx = 0; this.sqy = 0; this.spinA = 0; this.yokeV = 0;
  this.marker = null; this.markMat = null; this.sweat = null; this.stars = null;
  this.tip = new THREE.Object3D(); this.base = new THREE.Object3D();
}
Kit.prototype.grp = function(parent, pos){ const g = new THREE.Group(); if(pos) g.position.set(pos[0], pos[1], pos[2]); parent.add(g); return g; };
Kit.prototype.part = function(parent, key, fill, o){
  o = o || {};
  const g = cgeo(this.o.gkey + ':' + key, fill);
  const m = new THREE.Mesh(g, o.gloss ? this.gmat : this.mat);
  m.name = key;
  m.castShadow = o.shadow!==false; m.receiveShadow = false;
  if(o.outline!==0) this.outlines.push(G.look.outline(m, o.outline || this.o.ol || 0.024, o.oc || this.o.oc || '#3b2417'));
  if(o.pos) m.position.set(o.pos[0], o.pos[1], o.pos[2]);
  parent.add(m); this.meshes.push(m);
  return m;
};
Kit.prototype.faceSet = function(parent, prefix, fills){
  const set = { cur:null, blinkT: 50 + (Math.random()*140|0), blink:0 };
  for(const k of FACE_KEYS){
    if(!fills[k]) continue;
    const m = this.part(parent, prefix+'_f'+k, fills[k], { gloss:true, outline:0, shadow:false });
    m.visible = false; set[k] = m;
  }
  this.fsets.push(set);
  return set;
};
Kit.prototype.extras = function(parent, sweatPos, starR, starY){
  this.sweat = this.part(parent, 'sweat', sweatFill, { gloss:true, outline:0, shadow:false, pos:sweatPos });
  this.sweat.userData.y0 = sweatPos[1]; this.sweat.visible = false;
  this.stars = this.part(parent, 'stars', starsFill(starR, 0), { gloss:true, outline:0.012, shadow:false, pos:[0, starY, 0] });
  this.stars.visible = false;
};
function showFace(set, name){
  const m = set[name] || (name==='S' && set.X) || set.N;
  if(set.cur !== m){ if(set.cur) set.cur.visible = false; m.visible = true; set.cur = m; }
}
Kit.prototype.setAlpha = function(a){
  a = clamp(a, 0, 1);
  if(Math.abs(a - this.alpha) < 0.002) return;
  const was = this.alpha < 0.999, now = a < 0.999;
  this.alpha = a;
  const m1 = this.mat, m2 = this.gmat;
  m1.opacity = a; m2.opacity = a;
  if(was !== now){
    // three r160 compiles "opaque" into the program: toggling transparency needs a program switch
    m1.transparent = now; m2.transparent = now; m1.needsUpdate = true; m2.needsUpdate = true;
    const ov = !now && G.quality.tier < 2;
    for(let i=0;i<this.outlines.length;i++) this.outlines[i].visible = ov;
  }
  m1.depthWrite = a > 0.6; m2.depthWrite = a > 0.6;
  this.root.visible = a > 0.01;
};
Kit.prototype.makeMarker = function(){
  const tex = G.look.canvasTex('bossA_warn2', 128, 128, (x, w, h)=>{
    const c = w/2;
    const g = x.createRadialGradient(c, c, 4, c, c, c);
    g.addColorStop(0, 'rgba(255,90,70,0.10)'); g.addColorStop(0.7, 'rgba(255,90,70,0.32)'); g.addColorStop(0.86, 'rgba(255,70,50,0.9)'); g.addColorStop(1, 'rgba(255,70,50,0)');
    x.fillStyle = g; x.beginPath(); x.arc(c, c, c-1, 0, TAU); x.fill();
    x.lineWidth = 7; x.strokeStyle = '#ffffff'; x.beginPath(); x.arc(c, c, c*0.78, 0, TAU); x.stroke();
    x.lineWidth = 5; x.setLineDash([10, 8]); x.strokeStyle = 'rgba(255,255,255,0.9)'; x.beginPath(); x.arc(c, c, c*0.5, 0, TAU); x.stroke(); x.setLineDash([]);
    // "!" drawn tall: the ground is seen at a grazing angle, so it reads upright on screen
    x.save(); x.translate(c, c); x.scale(1, 2.2);
    x.fillStyle = '#ffffff'; x.strokeStyle = '#c0281c'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(-7, -24); x.lineTo(7, -24); x.lineTo(4, 5); x.lineTo(-4, 5); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.arc(0, 14, 6, 0, TAU); x.fill(); x.stroke();
    x.restore();
  });
  this.markMat = takeMat('mark', ()=> new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false, opacity:0.9, color:0xffffff, toneMapped:false }));
  const m = new THREE.Mesh(G.look.geo.plane(1, 1), this.markMat);
  m.rotation.x = -HPI; m.renderOrder = 3; m.visible = false; m.castShadow = false;
  G.scene.add(m);
  this.marker = m;
};
Kit.prototype.updMarker = function(e, T){
  const on = !!(e && e.warnOn && e.atk && !e.dead);
  if(!on){ if(this.marker) this.marker.visible = false; return; }
  if(!this.marker) this.makeMarker();
  const m = this.marker;
  const pul = e.warnLock ? 0.5 + 0.5*Math.sin(T*0.9) : 0.5 + 0.5*Math.sin(T*0.25);
  const s = (e.warnR || 1.5)*2*(1 + 0.07*pul);
  m.visible = true; m.position.set(e.warnX, 0.04, e.warnZ); m.scale.set(s, s, 1);
  this.markMat.opacity = 0.55 + 0.4*pul;
  this.markMat.color.setHex(e.warnLock ? 0xff6a5a : 0xffc060);
};
Kit.prototype.update = function(e){
  const P = this.P, C = this.C, T = G.time.tick + this.seed;
  const fl = e.flashT|0;
  if(e.introLine) introLine(e);
  if(fl > this.prevFlash){ this.wob = 1; this.flinch = 9; }
  this.prevFlash = fl;
  const fv = fl > 0 ? 0.62 : 0;
  this.mat.userData.uFlash.value = fv; this.gmat.userData.uFlash.value = fv;
  if(e.onGround && !this.wasGround) this.land = 1;
  this.wasGround = !!e.onGround;
  basePose(this, e, P, T);
  if(this.o.pose) this.o.pose(this, e, P, T);
  const r = FAST[e.anim] ? 0.42 : 0.24;
  poseDamp(C, P, r);
  const lw = this.land, ww = this.wob*Math.sin(T*1.3);
  this.sqy = -0.2*lw - 0.07*ww; this.sqx = 0.12*lw + 0.06*ww;
  this.land *= 0.8; this.wob *= 0.86; if(this.flinch>0) this.flinch--;
  this.o.apply(this, e, C, T, P);
  // facing: toward ent.face, ~35° toward the camera (turns through the front)
  const off = this.o.yawOff || 0, base = e.face > 0 ? YAW_R - off : YAW_L + off;
  this.yawV += (base - this.yawV)*0.2;
  if(P.spin){ this.spinA = P.spin; }
  else if(this.spinA){ const tgt = Math.round(this.spinA/TAU)*TAU; this.spinA += (tgt - this.spinA)*0.25; if(Math.abs(tgt - this.spinA) < 0.01) this.spinA = 0; }
  this.yaw.rotation.y = this.yawV + this.spinA;
  // expression
  let face = P.face;
  if(this.flinch>0 && (face==='N' || face==='O' || face==='B')) face = 'S';
  for(let i=0;i<this.fsets.length;i++){
    const set = this.fsets[i];
    let nm = face;
    if(face==='N'){ if(--set.blinkT <= 0){ set.blink = 7; set.blinkT = 110 + (Math.random()*170|0); } }
    if(set.blink > 0){ set.blink--; if(face==='N' || face==='O') nm = 'B'; }
    showFace(set, nm);
  }
  const sw = P.sweat || face==='S' || face==='X';
  if(this.sweat){ this.sweat.visible = !!sw; if(sw){ const q = (T % 50)/50; this.sweat.position.y = this.sweat.userData.y0 - q*0.12; this.sweat.scale.setScalar(0.85 + 0.25*Math.sin(q*Math.PI)); } }
  if(this.stars){ this.stars.visible = !!P.stars; if(P.stars) this.stars.rotation.y = T*0.13; }
  this.updMarker(e, T);
};
Kit.prototype.rig = function(height, radius){
  const k = this;
  this.tip.name = 'tip'; this.base.name = 'base';
  return {
    root: k.root, height, radius, tip: k.tip, base: k.base, kit: k,
    meshCount: k.meshes.length,
    update(e){ k.update(e); },
    setAlpha(a){ k.setAlpha(a); },
    dispose(){
      giveMat(k.mat); giveMat(k.gmat);
      if(k.marker){ if(k.marker.parent) k.marker.parent.remove(k.marker); giveMat(k.markMat); k.marker = null; }
    },
  };
};

// ---------------------------------------------------------------- generic procedural animation (targets; the kit damps them)
function strikeU(p, hit){
  const a0 = hit*0.55;
  if(p < a0) return 0.2*(1 - p/a0) ;                         // u: 0 = wound back … 1 = struck
  if(p < hit){ const q = (p - a0)/Math.max(0.001, hit - a0); return q*q; }
  const q = (p - hit)/Math.max(0.001, 1 - hit);
  return 1 - 0.55*U.easeInOutSine(Math.min(1, q*1.25));
}
function basePose(k, e, P, T){
  const an = e.anim, t = e.animT|0, len = e.animLen|0;
  const p = len > 0 ? clamp(t/len, 0, 1) : (t % 60)/60;
  const hit = e.animHit || 0.35;
  const br = Math.sin(T*0.07);
  P.bx = 0; P.by = 0; P.sx = 1; P.sy = 1; P.lean = -0.04; P.twist = 0;
  P.hx = 0; P.hy = 0; P.hz = 0.03*Math.sin(T*0.045);
  P.aLz = 0.22; P.aRz = 0.22; P.aLx = 0.16; P.aRx = 0.16; P.lLz = 0; P.lRz = 0; P.roll = 0; P.rz = 0;
  P.jaw = 0.04 + 0.03*br; P.wag = 0.25; P.wagSpd = 0.1; P.ex = 0;
  P.face = 'N'; P.sweat = 0; P.stars = 0; P.spin = 0;
  const lie = k.o.lie || 0.3, sit = k.o.sit || 0.3;
  switch(an){
    case 'idle': case 'land':
      P.sy = 1 + 0.024*br; P.sx = 1 - 0.012*br; P.aLz += 0.07*br; P.aRz += 0.07*br; break;
    case 'walk': case 'run': {
      const spd = Math.min(1.4, Math.hypot(e.vx||0, e.vz||0)/0.05);
      k.ph += 0.09 + 0.13*spd;
      const s = Math.sin(k.ph), c = Math.cos(k.ph);
      P.lLz = s*0.6; P.lRz = -s*0.6; P.aLz = 0.18 - s*0.5; P.aRz = 0.18 + s*0.5;
      P.by = Math.abs(c)*0.07; P.lean = -0.1; P.twist = s*0.1; P.hz = 0.035*Math.cos(k.ph*2); P.sy = 1 + 0.03*Math.abs(c);
      P.wag = 0.45; P.wagSpd = 0.22; break; }
    case 'windup': {
      const q = U.easeOutCubic(p), sh = Math.sin(T*1.9)*0.024*(0.4 + p);
      P.bx = sh; P.lean = 0.3*q; P.sy = 1 - 0.1*q; P.sx = 1 + 0.06*q;
      P.aRz = 0.2 - 1.5*q; P.aLz = 0.2 + 0.9*q; P.aRx = 0.3 + 0.35*q; P.aLx = 0.3 + 0.3*q; P.hz = 0.12*q; P.lLz = 0.25*q; P.lRz = -0.2*q;
      P.jaw = 0.7*q; P.face = 'O'; P.wag = 0.7; P.wagSpd = 0.4; break; }
    case 'attack': case 'attack2': case 'attack3': {
      const u = strikeU(p, hit), bump = U.bump(p, hit*0.7, Math.min(1, hit + 0.25));
      P.lean = lerp(0.24, -0.3, u); P.sy = 1 + 0.07*bump; P.sx = 1 - 0.03*bump; P.lLz = 0.35*u; P.lRz = -0.25*u; P.hz = lerp(0.1, -0.12, u);
      // torso twist is kept small and the head counter-turns so the face stays readable from the camera
      if(an==='attack'){ P.aRz = lerp(-1.3, 1.75, u); P.aLz = lerp(0.5, -0.35, u); P.twist = lerp(-0.22, 0.2, u); P.aRx = lerp(0.55, 0.4, u); }
      else if(an==='attack2'){ P.aLz = lerp(-1.3, 1.75, u); P.aRz = lerp(0.5, -0.35, u); P.twist = lerp(0.22, -0.22, u); P.aLx = lerp(0.55, 0.4, u); }
      else { P.aLz = P.aRz = lerp(2.7, 0.8, u); P.aLx = P.aRx = lerp(0.5, 0.15, u); P.lean = lerp(0.35, -0.45, u); P.by = 0.14*U.bump(p, 0, hit); }
      P.hy = -P.twist*0.9;
      P.jaw = p < hit ? 0.85 : Math.max(0.05, 0.85 - (p - hit)*9);
      P.face = 'O'; P.wag = 0.6; P.wagSpd = 0.35; break; }
    case 'dash': {
      if(p < 0.45){ k.ph += 0.55; const s = Math.sin(k.ph);
        P.lean = -0.42; P.sy = 0.93; P.sx = 1.06; P.aLz = P.aRz = 1.25; P.aLx = P.aRx = 0.22; P.lLz = s*0.85; P.lRz = -s*0.85; P.by = Math.abs(Math.cos(k.ph))*0.08; P.face = 'O'; P.jaw = 0.8; }
      else { P.lean = -0.18; P.lLz = 0.6; P.lRz = 0.25; P.aLz = P.aRz = -0.2; P.sy = 0.96; P.face = 'N'; }
      P.wag = 0.8; P.wagSpd = 0.4; break; }
    case 'shoot': {
      const u = strikeU(p, hit);
      P.lean = lerp(0.25, -0.22, u); P.hz = lerp(0.22, -0.1, u); P.aLz = P.aRz = lerp(-0.4, 1.3, u); P.aLx = P.aRx = 0.3;
      P.sy = 1 + 0.06*U.bump(p, hit*0.7, hit+0.2); P.jaw = u > 0.3 ? 0.85 : 0.3; P.face = 'O'; break; }
    case 'hurt': {

      P.lean = 0.3 + j; P.hz = 0.25; P.aLz = P.aRz = -0.5; P.aLx = P.aRx = 0.6; P.sy = 0.93; P.bx = -0.05; P.jaw = 0.4;
      P.face = 'S'; P.sweat = 1; break; }
    case 'down':
      P.rz = e.onGround ? 1.32 : 0.9 + 0.2*Math.sin(T*0.3); P.by = lie; P.aLz = P.aRz = 2.3 + 0.15*Math.sin(T*0.2); P.aLx = P.aRx = 0.5;
      P.lLz = 0.9; P.lRz = 0.6; P.hz = 0.2 + 0.08*Math.sin(T*0.1); P.jaw = 0.35; P.face = 'X'; P.sweat = 1; P.stars = 1; P.wag = 0.05; break;
    case 'getup': {
      const q = p, up = U.easeOutCubic(Math.min(1, q*1.35));
      P.rz = 1.32*(1 - up); P.by = lie*(1 - up) + 0.14*U.bump(q, 0.55, 1); P.aLz = P.aRz = lerp(2.0, 0.2, up); P.lLz = lerp(0.9, 0, up); P.lRz = lerp(0.6, 0, up);
      P.face = q < 0.6 ? 'S' : 'N'; P.sweat = q < 0.6 ? 1 : 0; break; }
    case 'dizzy':
      P.roll = 0.14*Math.sin(T*0.13); P.lean = 0.1*Math.cos(T*0.13); P.hx = 0.2*Math.sin(T*0.13 + 1); P.hz = 0.14*Math.cos(T*0.13);
      P.aLz = -0.15 + 0.4*Math.sin(T*0.2); P.aRz = -0.15 + 0.4*Math.sin(T*0.2 + 2); P.sy = 0.96; P.jaw = 0.3;
      P.face = 'X'; P.stars = 1; P.sweat = 1; break;
    case 'ko':
      if(!e.onGround){ P.rz = 0.5 + 0.25*Math.sin(T*0.35); P.aLz = P.aRz = 2.2; P.aLx = P.aRx = 1.0; P.lLz = 0.8; P.lRz = 0.3; P.face = 'X'; P.jaw = 0.5; }
      else { P.by = -sit; P.lLz = P.lRz = 1.45; P.lean = 0.35 + 0.05*Math.sin(T*0.1); P.aLz = P.aRz = -0.3; P.aLx = P.aRx = 0.4;
        P.hx = 0.2*Math.sin(T*0.1); P.hz = 0.16 + 0.08*Math.cos(T*0.1); P.roll = 0.06*Math.sin(T*0.1); P.jaw = 0.3; P.face = 'X'; P.stars = 1; P.sweat = 1; }
      P.wag = 0.05; break;
    case 'cheer': {

      P.by = Math.abs(Math.sin(ph))*0.3; P.sy = 1 + 0.07*Math.sin(ph*2); P.sx = 1 - 0.035*Math.sin(ph*2);
      P.aLz = 2.5 + 0.35*Math.sin(T*0.45); P.aRz = 2.5 + 0.35*Math.sin(T*0.45 + 1.4); P.aLx = P.aRx = 0.45;
      P.hx = 0.14*Math.sin(ph); P.hz = 0.12; P.lean = run ? -0.08 : 0.05; P.jaw = 0.45;
      if(run){ k.ph += 0.35; P.lLz = Math.sin(k.ph)*0.7; P.lRz = -Math.sin(k.ph)*0.7; }
      P.face = 'H'; P.wag = 0.95; P.wagSpd = 0.55; break; }
    case 'fall':

  C.hz += (P.hz - C.hz)*r; C.aLz += (P.aLz - C.aLz)*r; C.aRz += (P.aRz - C.aRz)*r; C.aLx += (P.aLx - C.aLx)*r;
  C.aRx += (P.aRx - C.aRx)*r; C.lLz += (P.lLz - C.lLz)*r; C.lRz += (P.lRz - C.lRz)*r; C.roll += (P.roll - C.roll)*r;
  C.rz += (P.rz - C.rz)*r; C.wag += (P.wag - C.wag)*r; C.wf += (P.wf - C.wf)*r; C.ex += (P.ex - C.ex)*r;

const FAST = { attack:1, attack2:1, attack3:1, shoot:1, dash:1, roar:1, special:1, hurt:1, parry:1,
  atk1:1, atk2:1, atk3:1, atk4:1, specialUp:1, specialDash:1 };
const YAW = 0.61;
const MAXM = 6;

// per-rig materials are recycled, never disposed: three.js deletes a shader program as soon as no material uses it, so a
// disposed boss / little slime / knight form threw its program (and the see-through twin compiled for a fade) away and
// the next one compiled and linked it again. A recycled material keeps its programs.
const MPOOL = new Map();
function takeMat(key, make){
  let list = MPOOL.get(key);
  if(!list){ list = []; MPOOL.set(key, list); }
  if(list.length){ const m = list.pop(); m.userData.pool.free = false; return m; }
  const m = make();
  m.userData.pool = { list, free:false, tr:m.transparent, op:m.opacity, dw:m.depthWrite, ei:m.emissiveIntensity };
  return m;
}
function giveMat(m){
  const s = m && m.userData.pool;
  if(!s){ if(m) m.dispose(); return; }
  if(s.free) return;
  s.free = true;
  if(m.transparent!==s.tr){ m.transparent = s.tr; m.needsUpdate = true; }
  m.opacity = s.op; m.depthWrite = s.dw;
  if(s.ei!==undefined) m.emissiveIntensity = s.ei;
  if(m.userData.uFlash) m.userData.uFlash.value = 0;
  s.list.push(m);
}

function Kit(o){

  this.root = new THREE.Group(); this.root.name = 'bossB_'+o.type;
  this.mir = new THREE.Group(); this.root.add(this.mir);          // mirror (scale.x = ±1)
  this.yaw = new THREE.Group(); this.mir.add(this.yaw);           // turn toward the camera
  this.scl = new THREE.Group(); this.yaw.add(this.scl); if(o.scale) this.scl.scale.setScalar(o.scale);
  this.body = new THREE.Group(); this.scl.add(this.body);

  this.mat = takeMat('body|'+rough, ()=> G.look.vmat({ instance:true, rough }));
  this.gmat = takeMat('gloss', ()=> G.look.vmat({ instance:true, rough:0.26, rim:0.35 }));
  this.mats = [this.mat, this.gmat];          // opaque per-rig materials (flash + fade)
  this.tmats = [];                             // always-transparent per-rig materials { m, base }
  this.bmat = null; this.emat = null;          // glow materials (blade / orb, eyes)
  this.outlines = []; this.meshes = []; this.fsets = [];
  this.P = newPose(); this.C = newPose();
  this.seed = (Math.random()*997)|0; this.ph = 0; this.tw = null; this.alpha = 1;
  this.land = 0; this.wob = 0; this.flinch = 0; this.prevFlash = 0; this.wasGround = true; this.landed = false; this.hitNow = false;
  this.sqx = 0; this.sqy = 0; this.spinA = 0;
  this.mk = []; this.laneM = null; this.beamG = null; this.beamMats = null; this.chargeM = null;

Kit.prototype.grp = function(parent, pos){ const g = new THREE.Group(); if(pos) g.position.set(pos[0], pos[1], pos[2]); parent.add(g); return g; };
Kit.prototype.glow = function(color, inten){
  const m = takeMat('glow|'+color+'|'+inten, ()=> G.look.vmat({ instance:true, rough:0.3, rim:0.8, emissive:color, emissiveIntensity: inten==null ? 0.7 : inten }));

Kit.prototype.part = function(parent, key, fill, o){

  if(o.outline!==0) this.outlines.push(G.look.outline(m, o.outline || this.o.ol || 0.024, o.oc || this.o.oc || '#3b2417'));
  if(o.pos) m.position.set(o.pos[0], o.pos[1], o.pos[2]);

Kit.prototype.faceSet = function(parent, prefix, fills, mat){
  const set = { cur:null, blinkT: 50 + (Math.random()*140|0), blink:0 };
  for(const k of FACE_KEYS){
    if(!fills[k]) continue;
    const m = this.part(parent, prefix+'_f'+k, fills[k], { mat: mat || 'g', outline:0, shadow:false });
    m.visible = false; set[k] = m;

Kit.prototype.extras = function(parent, sweatPos, starR, starY){

  this.sweat.userData.y0 = sweatPos[1]; this.sweat.visible = false;

function showFace(set, name){

  if(set.cur !== m){ if(set.cur) set.cur.visible = false; m.visible = true; set.cur = m; }
}
Kit.prototype.setAlpha = function(a){
  a = clamp(a, 0, 1);
  if(Math.abs(a - this.alpha) < 0.002) return;
  const was = this.alpha < 0.999, now = a < 0.999;
  this.alpha = a;
  for(let i=0;i<this.mats.length;i++){
    const m = this.mats[i];
    m.opacity = a;
    // three r160 compiles "opaque" into the program: toggling transparency needs a program switch
    if(was !== now){ m.transparent = now; m.needsUpdate = true; }
    m.depthWrite = a > 0.6;
  }
  for(let i=0;i<this.tmats.length;i++){ const t = this.tmats[i]; t.m.opacity = t.base*a; }
  if(was !== now){ const ov = !now && G.quality.tier < 2; for(let i=0;i<this.outlines.length;i++) this.outlines[i].visible = ov; }
  this.root.visible = a > 0.01;
};

// ---- world-space telegraphs: warning circles, a lane strip, the beam (owned by the rig, drawn from e.marks / e.lane / e.beam)
function warnTex(){
  return G.look.canvasTex('bossB_warn', 128, 128, (x, w, h)=>{
    const c = w/2;
    const g = x.createRadialGradient(c, c, 4, c, c, c);
    g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(0.68, 'rgba(255,255,255,0.30)'); g.addColorStop(0.86, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(c, c, c-1, 0, TAU); x.fill();
    x.lineWidth = 7; x.strokeStyle = '#ffffff'; x.beginPath(); x.arc(c, c, c*0.78, 0, TAU); x.stroke();
    x.lineWidth = 5; x.setLineDash([10, 8]); x.beginPath(); x.arc(c, c, c*0.5, 0, TAU); x.stroke(); x.setLineDash([]);
    // "!" drawn tall: the ground is seen at a grazing angle, so it reads upright on screen
    x.save(); x.translate(c, c); x.scale(1, 2.2);
    x.fillStyle = '#ffffff'; x.strokeStyle = 'rgba(120,20,10,0.9)'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(-7, -24); x.lineTo(7, -24); x.lineTo(4, 5); x.lineTo(-4, 5); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.arc(0, 14, 6, 0, TAU); x.fill(); x.stroke();
    x.restore();
  });
}
function laneTex(){
  const t = G.look.canvasTex('bossB_lane2', 128, 64, (x, w, h)=>{
    x.fillStyle = 'rgba(255,255,255,0.42)'; x.fillRect(0, 0, w, h);
    x.fillStyle = 'rgba(255,255,255,1)'; x.fillRect(0, 0, w, 7); x.fillRect(0, h-7, w, 7);
    x.fillStyle = 'rgba(40,10,10,0.55)'; x.fillRect(0, 7, w, 3); x.fillRect(0, h-10, w, 3);
    for(let i=0;i<2;i++){ const ox = i*64 + 12;
      x.fillStyle = 'rgba(40,10,10,0.6)'; x.beginPath(); x.moveTo(ox+3, 15); x.lineTo(ox+26, 32); x.lineTo(ox+3, 49); x.lineTo(ox+17, 49); x.lineTo(ox+40, 32); x.lineTo(ox+17, 15); x.closePath(); x.fill();
      x.fillStyle = 'rgba(255,255,255,1)'; x.beginPath(); x.moveTo(ox, 16); x.lineTo(ox+22, 32); x.lineTo(ox, 48); x.lineTo(ox+12, 48); x.lineTo(ox+34, 32); x.lineTo(ox+12, 16); x.closePath(); x.fill(); }
  });
  if(t.wrapS !== THREE.RepeatWrapping){ t.wrapS = THREE.RepeatWrapping; t.needsUpdate = true; }
  return t;
}
Kit.prototype.makeMark = function(i){
  const mat = takeMat('mark', ()=> new THREE.MeshBasicMaterial({ map:warnTex(), transparent:true, depthWrite:false, opacity:0.9, color:0xffc45a, toneMapped:false }));
  const m = new THREE.Mesh(G.look.geo.plane(1, 1), mat);
  m.rotation.x = -HPI; m.renderOrder = 3; m.visible = false; m.castShadow = false; m.name = 'bossB_mark';
  G.scene.add(m); this.mk[i] = m;
  return m;
};
Kit.prototype.makeLane = function(){
  const mat = takeMat('lane', ()=> new THREE.MeshBasicMaterial({ map:laneTex(), transparent:true, depthWrite:false, opacity:0.8, color:0xffc45a, toneMapped:false, side:THREE.DoubleSide }));
  const m = new THREE.Mesh(G.look.geo.plane(1, 1), mat);
  m.rotation.x = -HPI; m.renderOrder = 3; m.visible = false; m.castShadow = false; m.name = 'bossB_lane';
  G.scene.add(m); this.laneM = m;
};
Kit.prototype.makeBeam = function(){
  const col = this.o.beamCol || '#b060ff';
  const add = (c, o)=> takeMat('beam|'+c+'|'+o, ()=> new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:o, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }));
  const mo = add(col, 0.55), mi = add(this.o.beamCore || '#fff0ff', 0.95), mc = add(col, 0.7);
  const g = new THREE.Group(); g.name = 'bossB_beam';
  const cg = G.look.geo.cylinder(1, 1, 1, 18, false);
  const outer = new THREE.Mesh(cg, mo); outer.rotation.z = HPI; outer.renderOrder = 4; g.add(outer);
  const inner = new THREE.Mesh(cg, mi); inner.rotation.z = HPI; inner.scale.set(0.42, 1.001, 0.42); inner.renderOrder = 5; g.add(inner);
  g.visible = false; G.scene.add(g);
  const ball = new THREE.Mesh(G.look.geo.sphere(1, 16, 12), mc); ball.renderOrder = 5; ball.visible = false; G.scene.add(ball);
  this.beamG = g; this.chargeM = ball; this.beamMats = [mo, mi, mc];

Kit.prototype.updWorld = function(e, T){
  const live = !!(e && !e.dead);
  const ms = live ? e.marks : null;
  for(let i=0;i<MAXM;i++){
    const m = ms ? ms[i] : null, on = !!(m && m.on);
    let mesh = this.mk[i];
    if(!on){ if(mesh) mesh.visible = false; continue; }
    if(!mesh) mesh = this.makeMark(i);
    m.age = (m.age|0) + 1;
    const pul = m.lock ? 0.5 + 0.5*Math.sin(T*0.9) : 0.5 + 0.5*Math.sin(T*0.25);
    const s = m.r*2*(0.55 + 0.45*U.easeOutBack(Math.min(1, m.age/9)))*(1 + 0.06*pul);
    mesh.visible = true; mesh.position.set(m.x, 0.04 + i*0.004, m.z); mesh.scale.set(s, s, 1);
    mesh.material.opacity = 0.5 + 0.45*pul; mesh.material.color.setHex(m.lock ? 0xff4a3a : 0xffc45a);
  }
  const L = live ? e.lane : null;
  if(L && L.on){
    if(!this.laneM) this.makeLane();
    const m = this.laneM, len = Math.max(0.05, Math.abs(L.x1 - L.x0)), dir = L.x1 < L.x0 ? -1 : 1;
    L.age = (L.age|0) + 1;
    const grow = U.easeOutCubic(Math.min(1, L.age/12)), pul = L.lock ? 0.5 + 0.5*Math.sin(T*0.9) : 0.5 + 0.5*Math.sin(T*0.25);
    const l2 = len*grow;
    m.visible = true; m.position.set(L.x0 + dir*l2/2, 0.05, L.z); m.scale.set(l2*dir, L.w, 1);
    m.material.map.repeat.set(Math.max(1, len/1.6), 1); m.material.map.offset.x = -(T % 60)/60*(L.lock ? 2 : 1);
    m.material.opacity = 0.62 + 0.36*pul; m.material.color.setHex(L.lock ? 0xff3a22 : 0xffe040);
  } else if(this.laneM) this.laneM.visible = false;
  const B = live ? e.beam : null;
  if(B && (B.on || B.charge > 0)){
    if(!this.beamG) this.makeBeam();
    const ball = this.chargeM;
    ball.visible = true;
    const cs = B.on ? 0.55 + 0.08*Math.sin(T*1.7) : 0.12 + 0.5*B.charge + 0.05*Math.sin(T*0.9);
    ball.position.set(B.x0, B.y, B.z + 0.05); ball.scale.setScalar(cs);
    if(B.on){
      const g = this.beamG, len = Math.max(0.1, Math.abs(B.x1 - B.x0));
      const k = Math.min(1, (B.t+1)/3)*(B.t > B.len - 4 ? Math.max(0.1, (B.len - B.t)/4) : 1);
      const r = (0.42 + 0.06*Math.sin(T*1.9))*k;
      g.visible = true; g.position.set((B.x0 + B.x1)/2, B.y, B.z); g.scale.set(len, r, r);
    } else this.beamG.visible = false;
  } else if(this.beamG){ this.beamG.visible = false; this.chargeM.visible = false; }
};
Kit.prototype.update = function(e){
  const P = this.P, C = this.C, T = G.time.tick + this.seed;
  const fl = e.flashT|0;
  if(e.introLine) introLine(e);
  this.hitNow = fl > this.prevFlash;
  if(this.hitNow){ this.wob = 1; this.flinch = 9; }
  this.prevFlash = fl;
  const fv = fl > 0 ? 0.62 : 0;
  for(let i=0;i<this.mats.length;i++) this.mats[i].userData.uFlash.value = fv;
  for(let i=0;i<this.tmats.length;i++) this.tmats[i].m.userData.uFlash.value = fv*0.6;
  this.landed = !!e.onGround && !this.wasGround;
  if(this.landed) this.land = 1;
  this.wasGround = !!e.onGround;
  basePose(this, e, P, T);
  if(this.o.pose) this.o.pose(this, e, P, T);
  const r = FAST[e.anim] ? 0.42 : 0.24;
  poseDamp(C, P, r);
  const lw = this.land, ww = this.wob*Math.sin(T*1.3);
  this.sqy = -0.2*lw - 0.07*ww; this.sqx = 0.12*lw + 0.06*ww;
  this.o.apply(this, e, C, T, P);
  this.land *= 0.8; this.wob *= 0.86; if(this.flinch>0) this.flinch--;
  // facing: toward ent.face, ~35° toward the camera; turns through "facing the camera" and mirrors there
  const face = (e.face||1) >= 0 ? 1 : -1;
  if(this.tw==null) this.tw = face; else this.tw = U.approach(this.tw, face, 0.2);
  const aw = Math.abs(this.tw);
  this.mir.scale.x = this.tw >= 0 ? 1 : -1;
  if(P.spin){ this.spinA = P.spin; }
  else if(this.spinA){ const tgt = Math.round(this.spinA/TAU)*TAU; this.spinA += (tgt - this.spinA)*0.25; if(Math.abs(tgt - this.spinA) < 0.01) this.spinA = 0; }
  this.yaw.rotation.y = -(YAW + (1-aw)*(HPI - YAW)) + this.spinA;
  // expression
  let face_ = P.face;
  if(this.flinch>0 && (face_==='N' || face_==='O' || face_==='B')) face_ = 'S';
  for(let i=0;i<this.fsets.length;i++){
    const set = this.fsets[i];
    let nm = face_;
    if(face_==='N'){ if(--set.blinkT <= 0){ set.blink = 7; set.blinkT = 110 + (Math.random()*170|0); } }
    if(set.blink > 0){ set.blink--; if(face_==='N' || face_==='O') nm = 'B'; }
    showFace(set, nm);
  }
  const sw = P.sweat || face_==='S' || face_==='X';
  if(this.sweat){ this.sweat.visible = !!sw; if(sw){ const q = (T % 50)/50; this.sweat.position.y = this.sweat.userData.y0 - q*0.12; this.sweat.scale.setScalar(0.85 + 0.25*Math.sin(q*Math.PI)); } }
  if(this.stars){ this.stars.visible = !!P.stars; if(P.stars) this.stars.rotation.y = T*0.13; }
  this.updWorld(e, T);
};
Kit.prototype.dispose = function(){
  for(let i=0;i<this.mats.length;i++) giveMat(this.mats[i]);
  for(let i=0;i<this.tmats.length;i++) giveMat(this.tmats[i].m);
  this.mats.length = 0; this.tmats.length = 0;
  for(let i=0;i<this.mk.length;i++){ const m = this.mk[i]; if(m){ if(m.parent) m.parent.remove(m); giveMat(m.material); } }
  this.mk.length = 0;
  if(this.laneM){ if(this.laneM.parent) this.laneM.parent.remove(this.laneM); giveMat(this.laneM.material); this.laneM = null; }
  if(this.beamG){ if(this.beamG.parent) this.beamG.parent.remove(this.beamG); if(this.chargeM.parent) this.chargeM.parent.remove(this.chargeM);
    for(const m of this.beamMats) giveMat(m); this.beamG = null; this.chargeM = null; }
};
Kit.prototype.rig = function(height, radius){
  const k = this;
  this.tip.name = 'tip'; this.base.name = 'base';
  return {
    root: k.root, height, radius, tip: k.tip, base: k.base, kit: k,
    meshCount: k.meshes.length,
    update(e){ k.update(e); },
    setAlpha(a){ k.setAlpha(a); },
    dispose(){ k.dispose(); },
  };
};

// ---------------------------------------------------------------- generic procedural animation (targets; the kit damps them)
function strikeU(p, hit){
  const a0 = hit*0.55;
  if(p < a0) return 0.2*(1 - p/a0);                           // u: 0 = wound back … 1 = struck
  if(p < hit){ const q = (p - a0)/Math.max(0.001, hit - a0); return q*q; }
  const q = (p - hit)/Math.max(0.001, 1 - hit);
  return 1 - 0.55*U.easeInOutSine(Math.min(1, q*1.25));
}
function animP(e){ const len = e.animLen|0; return len > 0 ? clamp((e.animT|0)/len, 0, 1) : ((e.animT|0) % 60)/60; }
function basePose(k, e, P, T){
  const an = e.anim, p = animP(e), hit = e.animHit || 0.35;
  const br = Math.sin(T*0.07);
  P.bx = 0; P.by = 0; P.sx = 1; P.sy = 1; P.lean = -0.04; P.twist = 0;
  P.hx = 0; P.hy = 0; P.hz = 0.03*Math.sin(T*0.045);
  P.aLz = 0.22; P.aRz = 0.22; P.aLx = 0.16; P.aRx = 0.16; P.lLz = 0; P.lRz = 0; P.roll = 0; P.rz = 0;
  P.wag = 0.25; P.wagSpd = 0.1; P.wf = 0; P.ex = 0; P.tl = 0; P.flap = 0;
  P.face = 'N'; P.sweat = 0; P.stars = 0; P.spin = 0;
  const lie = k.o.lie || 0.3, sit = k.o.sit || 0.3;
  switch(an){
    case 'idle': case 'land':
      P.sy = 1 + 0.024*br; P.sx = 1 - 0.012*br; P.aLz += 0.07*br; P.aRz += 0.07*br; break;
    case 'walk': case 'run': {
      const spd = Math.min(1.4, Math.hypot(e.vx||0, e.vz||0)/0.05);
      k.ph += 0.09 + 0.13*spd;
      const s = Math.sin(k.ph), c = Math.cos(k.ph);
      P.lLz = s*0.6; P.lRz = -s*0.6; P.aLz = 0.18 - s*0.5; P.aRz = 0.18 + s*0.5;
      P.by = Math.abs(c)*0.07; P.lean = -0.1; P.twist = s*0.1; P.hz = 0.035*Math.cos(k.ph*2); P.sy = 1 + 0.03*Math.abs(c);
      P.wag = 0.45; P.wagSpd = 0.22; break; }
    case 'windup': {
      const q = U.easeOutCubic(p), sh = Math.sin(T*1.9)*0.024*(0.4 + p);
      P.bx = sh; P.lean = 0.3*q; P.sy = 1 - 0.1*q; P.sx = 1 + 0.06*q;

G.bus.on('down', (d)=>{ const e = d && d.ent; if(e && e.def && e.def.bossB) e.downMark = true; });
const GRACE = 240;
function pre(e){
  if(e.downMark){ e.downMark = false; e.poiseDmg = 0; e.noStagger = true; e.graceUntil = G.time.tick + GRACE; e.plan = null; }
  if(e.noStagger && G.time.tick >= (e.graceUntil||0)){ e.noStagger = false; e.poiseDmg = 0; }
}
function common(e){
  e.onInterrupt = onInterruptFor(e);
  e.plan = null; e.moves = 0; e.lastMove = null; e.introDone = false; e.phase = 0; e.form = 1;
  telegraphInit(e);
}
// "purified": the dark aura leaves while the boss lies dizzy
function purifyTick(e, t){ if(t===30){ fx('purify', e.x, 0.6, e.z, O.purify); sfx('heal'); } }
function koT(e){ return e.koLand==null ? -1 : e.deadT - e.koLand; }

// ---------------------------------------------------------------- custom projectile visuals (pooled; replace the fx visual)
const VISP = {};
function visMats(){
  if(VISP._m) return VISP._m;
  const add = (c, o)=>{ const m = new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:o, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }); m.userData.shared = true; return m; };
  VISP._m = {
    goo: G.look.mat('#8cff6a', { rough:0.18, emissive:'#2a9a20', emissiveIntensity:0.35 }),
    gooHi: G.look.mat('#ffffff', { rough:0.2 }),
    waveO: add('#a050ff', 0.9), waveI: add('#f6e0ff', 0.85),
  };
  return VISP._m;
}
function makeVis(kind){
  const M_ = visMats();
  const obj = new THREE.Group(); obj.name = 'bossB_proj_' + kind;
  const v = { kind, obj, live:false, age:0, m:null,
    update(p){ this.age++; this.obj.position.set(p.x, p.y, p.z); visTick(this, p); },
    dispose(){ if(!this.live) return; this.live = false; if(this.obj.parent) this.obj.parent.remove(this.obj); (VISP[this.kind] || (VISP[this.kind] = [])).push(this); } };
  if(kind==='goo'){
    const m = new THREE.Mesh(G.look.geo.sphere(0.3, 16, 12), M_.goo); m.castShadow = true;
    G.look.outline(m, 0.03, '#1f5a2a');
    const hi = new THREE.Mesh(G.look.geo.sphere(0.08, 8, 6), M_.gooHi); hi.position.set(-0.1, 0.14, 0.2); hi.scale.set(1, 0.7, 0.5); m.add(hi);
    obj.add(m); v.m = m;
  } else {
    const g = G.look.geo.torus(0.62, 0.1, 6, 18, Math.PI);
    // a flat ")" crescent in the screen plane (the x-y plane), bulging toward the travel direction
    const a = new THREE.Mesh(g, M_.waveO); a.rotation.set(0, 0, -HPI); a.scale.set(0.7, 1.25, 1.6);
    const b = new THREE.Mesh(g, M_.waveI); b.rotation.set(0, 0, -HPI); b.scale.set(0.62, 1.15, 0.7); b.position.x = -0.04;
    const w = new THREE.Group(); w.add(a); w.add(b); obj.add(w); v.m = w;
  }
  return v;
}
function visTick(v, p){
  const f = (p.vx||0) < 0 ? -1 : 1;
  if(v.kind==='goo'){ const s = 1 + 0.12*Math.sin(v.age*0.5); v.m.scale.set(s, 1/s, s); v.m.rotation.z = -f*v.age*0.05; }
  else { const s = Math.min(1, 0.4 + v.age*0.12); v.m.scale.set(f*s, s, s); v.m.rotation.x = 0.1*Math.sin(v.age*0.4);
    if(v.age%3===0) fx('sparkle', p.x - f*0.3, p.y, p.z, O.spark); }
}
function customVis(p, kind){
  if(!p) return;
  if(p.vis){ if(p.vis.obj && p.vis.obj.parent) p.vis.obj.parent.remove(p.vis.obj); try { p.vis.dispose && p.vis.dispose(); } catch(err){ G.logError('bossB vis', err); } }
  const pool = VISP[kind] || (VISP[kind] = []);
  const v = pool.pop() || makeVis(kind);
  v.live = true; v.age = 0; v.obj.position.set(p.x, p.y, p.z); v.obj.visible = true;
  G.scene.add(v.obj);
  p.vis = v;
}

      for(let i=0;i<5;i++){ const a = i/5*TAU; b.add(cone(0.075,0.2,8), SLM.GOLD, [Math.cos(a)*0.3, 0.2, Math.sin(a)*0.3]); b.add(sph(0.045,8,6), SLM.GOLD, [Math.cos(a)*0.3, 0.31, Math.sin(a)*0.3]); }
      b.add(sph(0.075,10,8), SLM.RUBY, [0.33,0.02,0], null, [0.6,1,1]);

    }, { mat:'g', outline:0.02, oc:'#5a3a10' });

    k.part(k.crown, 'sprout', (b)=>{

    }, { outline:0.012, oc:'#1d4d22' });
  }

  const eu = 0.36*s, ev = 0.13*s, es = small ? 0.08 : 0.165;
  const brow = SLM.BROW;
  if(small) LOD = 0.6;
  try {
  k.faceSet(k.faceG, 'f', {
    N:(b)=>{ eyeDot(b, BS, -eu, ev, es, { lift:L, brow, tilt:0.5 }); eyeDot(b, BS, eu, ev, es, { lift:L, brow, tilt:0.5 });
      if(small) mW(b, BS, 0, -0.12*s, 0.07, L); else { mGrin(b, BS, 0, -0.14, 0.14, L); feat(b, BS, -0.06, -0.26, L+0.02, sph(0.05,8,6), TONGUE, [1,1.1,0.4]); }
      blush(b, BS, -0.62*s, -0.1*s, 0.13*s, null, L*0.5); blush(b, BS, 0.62*s, -0.1*s, 0.13*s, null, L*0.5); },
    B:(b)=>{ eyeLine(b, BS, -eu, ev, es, 0.25, L); eyeLine(b, BS, eu, ev, es, 0.25, L); if(small) mW(b, BS, 0, -0.12*s, 0.07, L); else mGrin(b, BS, 0, -0.14, 0.14, L);
      blush(b, BS, -0.62*s, -0.1*s, 0.13*s, null, L*0.5); blush(b, BS, 0.62*s, -0.1*s, 0.13*s, null, L*0.5); },
    O: small ? null : (b)=>{ eyeDot(b, BS, -eu, ev, es*1.05, { lift:L, brow, tilt:0.7 }); eyeDot(b, BS, eu, ev, es*1.05, { lift:L, brow, tilt:0.7 }); mOpen(b, BS, 0, -0.18*s, 0.17*s, 0.13*s, !small, L);
      blush(b, BS, -0.62*s, -0.1*s, 0.13*s, null, L*0.5); blush(b, BS, 0.62*s, -0.1*s, 0.13*s, null, L*0.5); },
    X:(b)=>{ eyeX(b, BS, -eu, ev, es, null, L); eyeX(b, BS, eu, ev, es, null, L); mWavy(b, BS, 0, -0.16*s, 0.12*s, L); },
    S: small ? null : (b)=>{ eyeSqueeze(b, BS, -eu, ev, es, null, L); eyeSqueeze(b, BS, eu, ev, es, null, L); mO(b, BS, 0, -0.16*s, 0.05*s, L); },
    H:(b)=>{ eyeArc(b, BS, -eu, ev, es, false, null, L); eyeArc(b, BS, eu, ev, es, false, null, L); mOpen(b, BS, 0, -0.16*s, 0.14*s, 0.1*s, false, L);
      blush(b, BS, -0.6*s, -0.08*s, 0.16*s, null, L*0.5); blush(b, BS, 0.6*s, -0.08*s, 0.16*s, null, L*0.5); },
  });

  k.extras(k.faceG, sp(BS, -0.62*s, 0.55*s, 0.1*s), small ? 0.3 : 0.62, small ? 0.95 : 2.15);

}
function poseSlime(k, e, P, T){
  const an = e.anim, p = animP(e);
  P.sy = 1 + 0.03*Math.sin(T*0.08); P.sx = 1; P.by = 0; P.bx = 0; P.lean = 0; P.roll = 0;
  switch(an){
    case 'walk': case 'run': k.ph += k.small ? 0.3 : 0.2; P.sy = 1 + 0.09*Math.sin(k.ph*2); P.by = 0.05*Math.abs(Math.sin(k.ph))*(k.small?0.4:1); P.lean = -0.08; break;
    case 'windup': { const q = U.easeOutCubic(p); P.sy = 1 - 0.3*q; P.sx = 1 + 0.12*q; P.bx = Math.sin(T*1.9)*0.03*(0.4+p); P.lean = 0.1*q; P.face = 'O'; break; }
    case 'jump': P.sy = (e.vy||0) > 0.02 ? 1.26 : 1.1; P.sx = 0.9; P.face = 'O'; break;
    case 'fall': P.sy = 1.22; P.sx = 0.88; P.face = 'O'; break;
    case 'shoot': P.sy = p < 0.4 ? 1 + 0.14*U.smooth(p, 0, 0.35) : 0.84; P.sx = p < 0.4 ? 1.1 : 1.05; P.lean = p < 0.4 ? 0.06 : -0.12; P.face = 'O'; break;
    case 'special': P.sy = 0.62 + 0.04*Math.sin(T*0.3); P.sx = 1.18; P.face = p < 0.8 ? 'S' : 'N'; P.sweat = p < 0.8 ? 1 : 0; P.stars = p < 0.7 ? 1 : 0; break;
    case 'roar': P.sy = 1.18 + 0.04*Math.sin(T*1.6); P.sx = 0.95; P.bx = Math.sin(T*2.3)*0.02; P.face = 'O'; break;
    case 'attack': case 'attack2': P.sy = 1.1; P.lean = -0.15; P.face = 'O'; break;
    case 'hurt': P.sy = 0.9; P.lean = 0.12; P.face = 'S'; P.sweat = 1; break;
    case 'down': P.sy = e.onGround ? 0.55 : 0.9; P.sx = 1.25; P.face = 'X'; P.stars = 1; P.sweat = 1; break;
    case 'getup': P.sy = lerp(0.55, 1.05, U.easeOutCubic(p)); P.sx = lerp(1.25, 1, p); P.face = p < 0.6 ? 'S' : 'N'; break;
    case 'dizzy': case 'tired': P.lean = 0.12*Math.sin(T*0.13); P.roll = 0.08*Math.cos(T*0.13); P.sy = 0.92; P.face = an==='tired' ? 'S' : 'X'; P.stars = 1; P.sweat = 1; break;
    case 'ko': if(e.onGround){ P.sy = 0.52; P.sx = 1.3; } else { P.sy = 1.08; } P.face = 'X'; P.stars = 1; P.sweat = 1; break;
    case 'cheer': { const ph = T*0.22; P.by = Math.abs(Math.sin(ph))*(k.small ? 0.25 : 0.35); P.sy = 1 + 0.1*Math.cos(ph*2); P.lean = 0.08*Math.sin(ph); P.face = 'H'; break; }
  }
}
function applySlime(k, e, C, T, P){
  const s = k.small ? 0.34 : 1;
  if(k.landed){ k.spv -= 0.1 + Math.min(0.12, Math.abs(k.lastVy||0)*0.35); k.cyv += 0.05*s; k.wbv += (Math.random()-0.5)*0.05; }
  if(k.hitNow){ k.spv += (Math.random()-0.3)*0.1; k.wbv += (Math.random()-0.5)*0.1; }
  k.lastVy = e.vy||0;
  // damped springs: vertical squash and a sideways wobble
  k.spv += ((P.sy - 1) - k.sp)*0.2 - k.spv*0.22; k.sp = clamp(k.sp + k.spv, -0.5, 0.45);
  k.wbv += (C.lean - k.wb)*0.16 - k.wbv*0.16; k.wb = clamp(k.wb + k.wbv, -0.5, 0.5);
  const sy = 1 + k.sp, sx = C.sx*(1 - k.sp*0.55);
  k.jelly.position.set(C.bx, C.by, 0);
  k.jelly.scale.set(sx, sy, sx);
  k.jelly.rotation.set(C.roll, 0, k.wb);
  // the crown rides on top with a little lag
  k.cyv += (0 - k.cy)*0.18 - k.cyv*0.2 - k.spv*0.25*s; k.cy += k.cyv;
  k.crown.position.set(0.05*s + k.wb*-0.6*s + C.bx, 1.68*s*sy + C.by + k.cy, 0);
  k.crown.rotation.set(0, 0, (k.small ? 0 : 0.14) + k.wb*1.4 + k.cy*1.5/s);
}

// ---- slime moves
function bounceFn(e, t){
  const per = e.phase ? 40 : 46, crouch = 14, air = e.phase ? 30 : 33;
  // landing (checked first: the third hop lands after the last hop period starts)
  if(e.hopAir && e.hopUp > 3 && e.onGround){
    e.hopAir = false; e.vx = 0; e.vz = 0;
    if(e.hopMark){ e.hopMark.on = false; e.hopMark = null; }
    G.combat.area({ owner:e, x:e.x, z:e.z, r:1.35, zr:0.85, y0:-0.5, y1:1.5, dmg:12, kb:0.14, up:0.16, stun:20, power:2, kind:'blunt', dur:3 });
    fx('shock', e.x, 0.02, e.z, O.shockG); fx('ring', e.x, 0.25, e.z, O.ringG); shake(2.6, 12); sfx('land'); G.setAnim(e, 'land', 10);
  }
  if(e.hopAir){ e.hopUp++; e.vx = e.hopVx; e.vz = e.hopVz; }
  const k = Math.floor(t/per), tt = t % per;
  if(k >= 3) return;
  if(tt===0){
    const p = fh().target(e);
    G.setAnim(e, 'windup', crouch); e.vx = 0; e.vz = 0;
    const tx = p ? clampX(p.x, e.radius) : e.x, tz = p ? clampZ(p.z) : e.z;
    const dx = clamp(tx - e.x, -3.8, 3.8), dz = clamp(tz - e.z, -1.6, 1.6);
    e.hopVx = dx/air; e.hopVz = dz/air;
    e.hopMark = markOn(e, e.x + dx, e.z + dz, 1.35, true);
    if(p && Math.abs(p.x - e.x) > 0.1) e.face = p.x > e.x ? 1 : -1;
  }
  if(tt===crouch){ e.vy = 0.006*air; e.onGround = false; e.hopAir = true; e.hopUp = 0; G.setAnim(e, 'jump'); sfx('boing'); G.bus.emit('jump', { ent:e });
    if(k===0) say(e, 'ぼよよ〜ん！'); }
}
function slamFn(e, t){
  const p = fh().target(e);
  if(t===0){ G.setAnim(e, 'jump'); e.vy = 0.36; e.vx = 0; e.vz = 0; e.onGround = false; e.slamLand = false; e.slamMark = null;
    sfx('jump'); say(e, 'とんでけ〜！'); fx('dust', e.x, 0.05, e.z, O.dust8); G.bus.emit('jump', { ent:e }); }
  if(t===8) e.intangible = true;                                  // up in the sky: cannot be hit
  if(t < 104){ e.vx = 0; e.vz = 0;
    if(t > 2 && e.y > 4.5 && e.y < 12){ e.gravScale = 0; e.vy = Math.max(e.vy, 0.45); }
    if(e.y >= 12){ e.y = 12; e.vy = 0; e.gravScale = 0; } }
  if(t>=24 && t<80 && p){
    if(!e.slamMark){ e.slamMark = markOn(e, clampX(p.x, 1.1), clampZ(p.z), 2.0, false); sfx('alert'); }
    const m = e.slamMark; if(m){ m.x += (clampX(p.x, 1.1) - m.x)*0.16; m.z += (clampZ(p.z) - m.z)*0.16; }
  }
  if(t===80 && e.slamMark){ e.slamMark.lock = true; sfx('alert'); }
  if(t===104){ const m = e.slamMark; if(m){ e.x = e.px = m.x; e.z = e.pz = m.z; } e.y = e.py = 11; e.vy = -0.4; e.gravScale = 1; G.setAnim(e, 'fall');
    if(p) e.face = p.x > e.x ? 1 : -1; }
  if(t > 104 && !e.slamLand && (e.onGround || t > 150)){
    if(!e.onGround){ e.y = 0; e.vy = 0; e.onGround = true; }

let P = null;
function prims(){
  if(P) return P;

  P = {
    sph: g.sphere(1, 12, 9), lo: g.sphere(1, 8, 6), dot: g.sphere(1, 6, 4),

    cyl: g.cylinder(1, 1, 1, 10), cyl6: g.cylinder(1, 1, 1, 6), cylHi: g.cylinder(1, 1, 1, 16),
    cone: g.cone(1, 1, 10), cone6: g.cone(1, 1, 6),
    box: g.box(1, 1, 1), rbox: g.rbox(1, 1, 1, 0.2, 3), rbox2: g.rbox(1, 1, 1, 0.12, 2),
    oct: new THREE.OctahedronGeometry(1, 0),
    pyr: new THREE.ConeGeometry(1, 1, 4, 1).rotateY(PI/4), mid: g.sphere(1, 10, 8),
    torus: g.torus(1, 0.22, 5, 14), ring: g.torus(1, 0.08, 4, 12), can: g.sphere(1, 14, 10),

// ================================================================ build context: chunked layers
// layers per chunk: solid (lit + outline + casts shadow), sway (same, wind-swayed), glow (unlit, bright),
// deco (lit, no outline / shadow). Far: far (lit, fogged) + farGlow (unlit).
function makeCtx(def, seed){
  const L = def.length, x0 = -26, n = Math.ceil((L + 52) / CHUNK);
  const chunks = []; for(let i=0;i<n;i++) chunks.push({});
  const c = {
    L, R: mulberry(seed), chunks, x0, cur: chunks[0],
    far: G.look.builder(), farGlow: G.look.builder(),
    halos: [], spins: [], th: def.theme, def,
    at(x){ this.cur = chunks[U.clamp(Math.floor((x - x0)/CHUNK), 0, n-1)]; return this; },
    // parts far behind the belt (z < SHADOW_Z) go to no-shadow twins of solid/sway: their shadows would fall
    // behind them where nobody looks, and the shadow pass is not free
    add(layer, g, col, p, r, s){
      if((layer==='solid' || layer==='sway') && p && p[2] < SHADOW_Z) layer += 'B';
      const ch = this.cur; (ch[layer] || (ch[layer] = G.look.builder())).add(g, col, p, r, s);
    },
    S(g, col, p, r, s){ this.add('solid', g, col, p, r, s); },
    W(g, col, p, r, s){ this.add('sway', g, col, p, r, s); },
    GL(g, col, p, r, s){ this.add('glow', g, col, p, r, s); },
    D(g, col, p, r, s){ this.add('deco', g, col, p, r, s); },
    F(g, col, p, r, s){ this.far.add(g, col, p, r, s); },
    FG(g, col, p, r, s){ this.farGlow.add(g, col, p, r, s); },
    halo(x, y, z, col, size){ this.halos.push(x, y, z, col, size); },
    spin(kind, x, y, z, s, speed, rotY){ this.spins.push({ kind, x, y, z, s, speed, rotY: rotY||0 }); },
    h(x, z){ return groundH(def.theme, x, z); },
  };
  return c;
}

// ground height (surroundings): gentle toy-like bumps behind/in front of the belt and a soft drop-off ("brow")
// far behind so the far layer and sky show above it
function groundH(th, x, z){
  let y = 0;
  if(z < -4.6){
    const k = U.smooth(-z, 4.6, 8.5);
    y += k*(0.32*Math.sin(x*0.19 + 1.3) + 0.22*Math.sin(x*0.07 + z*0.33) + 0.18*(vnoise(x*0.2, z*0.2) - 0.5));
  } else if(z > BELT_Z1 + 0.9){
    const k = U.smooth(z, BELT_Z1 + 0.9, BELT_Z1 + 3.5);
    y += k*(0.14*Math.sin(x*0.35 + z) + 0.08);
  }
  if(th.brow != null && z < th.brow){
    const t = U.clamp((th.brow - z)/7, 0, 1);
    y -= t*t*(3 - 2*t)*8;
  }
  return y;
}

  tree(c, x, z, s, leaf, trunk){
    const y = c.h(x, z) - 0.05, p = prims(), far = z < SHADOW_Z, big = far ? p.sph : p.can, sm = far ? p.lo : p.mid;
    c.at(x);
    c.S(p.cyl6, trunk || '#a8744a', [x, y + 0.75*s, z], null, [0.13*s, 1.5*s, 0.13*s]);
    c.W(big, leaf, [x, y + 1.95*s, z], null, [0.95*s, 0.88*s, 0.95*s]);
    c.W(sm, shade(leaf, 0.06), [x - 0.5*s, y + 1.72*s, z + 0.3*s], null, 0.55*s);
    c.W(sm, shade(leaf, -0.05), [x + 0.52*s, y + 1.82*s, z + 0.12*s], null, 0.5*s);
  },
  // tall forest tree: stacked round canopies
  bigTree(c, x, z, s, leaf, trunk){
    const y = c.h(x, z) - 0.05, p = prims(), far = z < SHADOW_Z, big = far ? p.sph : p.can, sm = far ? p.lo : p.mid;
    c.at(x);

// boss / mid-boss arena range (shared by the decor and the progression)
const ARENA_W = 17;
function arenaRange(def, spot){ const a = Math.max(-2, spot.at - 4), b = Math.min(def.length + 4, a + (spot.width || ARENA_W)); return [a, b]; }
// arena dressing near the boss (and mid-boss): two poles with a string of little pennants between them
function arenaDecor(c, def){
  const p = prims(), th = def.theme;
  const pal = { town:['#ff6b5b','#ffd24d','#5aa0e0','#7ac86a','#ff8ac0'], dusk:['#ff6b5b','#ffb347','#fff1d6','#ff8ac0'],
    forest:['#9a7aff','#7ff0ff','#ff8ad8','#9affc8'], cave:['#7ff0ff','#ff9ad8','#b48aff','#a0ffd8'],
    airship:['#ff6b5b','#ffffff','#5aa0e0','#ffd24d'], snow:['#6ab0ff','#ff6b8a','#ffffff','#ffd24d'], castle:['#8a3ad0','#ffd24d','#ff8ad0','#c89aff'] }[th.scenery] || ['#ff6b5b','#ffd24d'];
  const glowy = th.scenery==='forest' || th.scenery==='cave' || th.scenery==='castle';
  const spots = [def.boss]; if(def.mid) spots.push(def.mid);
  for(const b of spots){
    const [a, e] = arenaRange(def, b), z = -4.25, x0 = a + 1, x1 = e - 1;
    const flat = th.scenery==='airship' || th.scenery==='castle';
    const y0 = flat ? 0 : c.h(x0, z), y1 = flat ? 0 : c.h(x1, z), top = 2.7;
    for(const [x, y] of [[x0, y0], [x1, y1]]){
      c.at(x);
      c.S(p.cyl6, '#7a5236', [x, y + top/2, z], null, [0.07, top, 0.07]);
      c.S(p.sph, pal[0], [x, y + top + 0.08, z], null, 0.13);
    }
    const n = Math.round((x1 - x0)/0.75);
    for(let i=1;i<n;i++){
      const t = i/n, x = U.lerp(x0, x1, t), y = U.lerp(y0, y1, t) + top - 0.12 - Math.sin(t*PI)*0.75, col = pal[i % pal.length];
      c.at(x);
      c.W(p.cone6, col, [x, y - 0.2, z], [PI, PI/6, 0], [0.2, 0.36, 0.05]);
      if(glowy && i % 2===0) c.halo(x, y - 0.2, z + 0.1, col, 0.7);
    }
  }
}

// ================================================================ ground textures (hand-painted canvas)
// belt: 512×384 px covers TILE units of x × the belt depth; surround: 256×256 px = 4×4 units
const TILE = 8;
function wrapBlob(x, W, H, rx, fn){ fn(x); if(x - rx < 0) fn(x + W); if(x + rx > W) fn(x - W); }
function ellipse(g, x, y, rx, ry, col, rot){ g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, rot||0, 0, TAU); g.fill(); }
function speckle(g, W, H, R, n, cols, r0, r1, yr, wrapY){
  for(let i=0;i<n;i++){
    const x = R()*W, y = yr ? yr[0]*H + R()*(yr[1]-yr[0])*H : R()*H, r = r0 + R()*(r1 - r0), col = cols[Math.floor(R()*cols.length)];
    wrapBlob(x, W, H, r, (xx)=>{ ellipse(g, xx, y, r, r*0.8, col); if(wrapY){ if(y - r < 0) ellipse(g, xx, y + H, r, r*0.8, col); if(y + r > H) ellipse(g, xx, y - H, r, r*0.8, col); } });
  }
}
function tufts(g, W, H, R, n, cols, yr, wrapY){
  g.lineWidth = 2.2; g.lineCap = 'round';
  for(let i=0;i<n;i++){
    const x = R()*W, y = yr ? yr[0]*H + R()*(yr[1]-yr[0])*H : R()*H, s = 4 + R()*5;
    g.strokeStyle = cols[Math.floor(R()*cols.length)];
    wrapBlob(x, W, H, 8, (xx)=>{
      g.beginPath(); g.moveTo(xx - s*0.6, y - s); g.quadraticCurveTo(xx - s*0.1, y - s*0.3, xx, y);
      g.moveTo(xx + s*0.6, y - s*0.9); g.quadraticCurveTo(xx + s*0.1, y - s*0.3, xx, y);
      g.moveTo(xx, y - s*1.2); g.lineTo(xx, y); g.stroke();
    });
  }
}
function flowerDots(g, W, H, R, n, cols, yr){
  for(let i=0;i<n;i++){
    const x = R()*W, y = yr ? yr[0]*H + R()*(yr[1]-yr[0])*H : R()*H, col = cols[Math.floor(R()*cols.length)], r = 2.4 + R()*1.4;
    wrapBlob(x, W, H, 6, (xx)=>{ for(let k=0;k<5;k++){ const a = k/5*TAU; ellipse(g, xx + Math.cos(a)*r, y + Math.sin(a)*r*0.8, r*0.75, r*0.62, col); } ellipse(g, xx, y, r*0.6, r*0.5, '#ffd84a'); });
  }
}
function pawPrint(g, x, y, s, col){ ellipse(g, x, y, 5*s, 4.2*s, col); for(let k=0;k<4;k++){ const a = -PI*0.5 + (k-1.5)*0.55; ellipse(g, x + Math.cos(a)*7*s, y + Math.sin(a)*6.5*s, 2*s, 2.2*s, col); } }
// wavy path edges (tileable: integer frequencies over the tile)
function pathEdge(u, base, amp, ph){ return base + amp*(Math.sin(u*TAU*2 + ph)*0.6 + Math.sin(u*TAU*5 + ph*2)*0.4); }
function fillPath(g, W, H, top, bot, col){
  g.fillStyle = col; g.beginPath();
  for(let x=0;x<=W;x+=4) g.lineTo(x, top(x/W)*H);
  for(let x=W;x>=0;x-=4) g.lineTo(x, bot(x/W)*H);
  g.closePath(); g.fill();
}
const GROUND = {
  meadow:{
    base:'#78c656',
    surround(g, W, H, R){ g.fillStyle = this.base; g.fillRect(0,0,W,H); speckle(g, W, H, R, 40, ['#70be50', '#84d062'], 8, 18, null, true); tufts(g, W, H, R, 70, ['#5eae44', '#98d86e', '#56a43e'], null, true); flowerDots(g, W, H, R, 7, ['#ffffff', '#ffb0d0', '#fff08a']); },
    belt(g, W, H, R){
      g.fillStyle = this.base; g.fillRect(0,0,W,H);
      speckle(g, W, H, R, 60, ['#70be50', '#84d062'], 8, 18);
      const top = (u)=> pathEdge(u, 0.24, 0.03, 0.4), bot = (u)=> pathEdge(u, 0.8, 0.028, 2.1);
      fillPath(g, W, H, (u)=> top(u) - 0.012, (u)=> bot(u) + 0.012, '#d9b77e');
      fillPath(g, W, H, top, bot, '#efd29c');
      speckle(g, W, H, R, 70, ['#e2c28a', '#f6e0b4', '#dcbc84'], 3, 9, [0.3, 0.75]);

// ================================================================ shaders
const SKY_VS = `varying vec3 vDir;
void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`;
const SKY_FS = `uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBot; uniform float uH0; uniform float uH1;
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uGlowCol; uniform float uSunR; uniform float uGlowR; uniform float uGlowStr;
uniform float uMoon; uniform float uStars; uniform float uTime; uniform float uHdr;
varying vec3 vDir;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec3 d = normalize(vDir);
  float t = clamp((d.y - uH0) / (uH1 - uH0), 0.0, 1.0);
  vec3 col = mix(uBot, uMid, smoothstep(0.0, 0.55, t));
  col = mix(col, uTop, smoothstep(0.5, 1.0, t));
  if(uStars > 0.0){
    vec2 sp = vec2(atan(d.x, -d.z) * 70.0, d.y * 140.0);
    vec2 cell = floor(sp); vec2 f = fract(sp) - 0.5;
    float h = hash(cell);
    float tw = 0.55 + 0.45 * sin(uTime * (1.5 + h * 3.0) + h * 40.0);
    float star = step(0.9, h) * smoothstep(0.16, 0.0, length(f + (vec2(hash(cell + 3.1), hash(cell + 7.7)) - 0.5) * 0.6)) * tw;
    col += vec3(1.0, 0.96, 0.86) * star * uStars * smoothstep(0.15, 0.6, t);
  }
  float cs = clamp(dot(d, uSunDir), -1.0, 1.0);
  float ang = acos(cs);
  col += uGlowCol * uGlowStr * exp(-ang / max(0.001, uGlowR));
  if(uSunR > 0.0){
    float disc = smoothstep(uSunR, uSunR * 0.92, ang);
    vec3 dc = uSunCol;
    if(uMoon > 0.5){
      vec3 r = normalize(cross(vec3(0.0, 1.0, 0.0), uSunDir)); vec3 u = cross(uSunDir, r);
      vec2 q = vec2(dot(d, r), dot(d, u)) / uSunR;
      float cr = smoothstep(0.26, 0.2, length(q - vec2(-0.32, 0.22))) + smoothstep(0.17, 0.11, length(q - vec2(0.36, -0.18)))
               + smoothstep(0.13, 0.08, length(q - vec2(0.08, 0.52))) + smoothstep(0.11, 0.06, length(q - vec2(-0.12, -0.46)));
      dc = mix(dc, dc * 0.84, clamp(cr, 0.0, 1.0));
      dc *= 1.0 - 0.16 * smoothstep(0.2, 1.0, length(q + vec2(0.35, -0.35)));
    } else {
      dc = mix(dc, vec3(1.0), 0.5 * (1.0 - ang / uSunR));
    }
    col = mix(col, dc * uHdr, disc);
  }
  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
// ambient particles: positions wrap inside a box that follows the camera (no CPU work per frame)
const PART_VS = `uniform float uTime; uniform vec3 uBoxMin; uniform vec3 uBoxSize; uniform vec3 uVel; uniform float uWob; uniform float uSize; uniform float uPx; uniform float uTwinkle;
attribute vec4 aRnd;
varying float vMix; varying float vAlpha; varying float vRot;
void main(){
  float sp = 0.6 + 0.8 * aRnd.x; float ph = aRnd.y * 6.2831;
  vec3 p = position + uVel * uTime * sp;
  p.x += sin(uTime * 1.3 * sp + ph) * uWob;
  p.y += sin(uTime * 0.9 + ph * 1.7) * uWob * 0.35;
  p.z += cos(uTime * 1.1 * sp + ph) * uWob * 0.6;
  p = uBoxMin + mod(p - uBoxMin, uBoxSize);
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = clamp(uSize * (0.55 + 0.9 * aRnd.z) * uPx * projectionMatrix[1][1] / max(0.5, -mv.z), 1.0, 80.0);
  vec3 f = (p - uBoxMin) / uBoxSize;
  vAlpha = smoothstep(0.0, 0.08, f.x) * smoothstep(1.0, 0.92, f.x) * smoothstep(0.0, 0.1, f.y) * smoothstep(1.0, 0.85, f.y);
  vAlpha *= mix(1.0, 0.25 + 0.75 * (0.5 + 0.5 * sin(uTime * (2.0 + 3.0 * aRnd.x) + ph * 3.0)), uTwinkle);
  vMix = aRnd.w; vRot = ph + uTime * (aRnd.x - 0.5) * 4.0;
}`;
const PART_FS = `uniform vec3 uColA; uniform vec3 uColB; uniform float uShape; uniform float uOpacity;
varying float vMix; varying float vAlpha; varying float vRot;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  vec3 col = mix(uColA, uColB, vMix); float a = 0.0;
  if(uShape < 0.5){ float d = length(c) * 2.0; a = exp(-d * d * 5.0) + 0.6 * smoothstep(0.4, 0.1, d); col = mix(col, vec3(1.0), smoothstep(0.35, 0.0, d) * 0.6); }
  else if(uShape < 1.5){ float s = sin(vRot), co = cos(vRot); vec2 q = vec2(co * c.x - s * c.y, s * c.x + co * c.y); q.y *= 1.8; q.x += q.y * q.y * 0.8;
    float d = length(q) * 2.0; a = smoothstep(1.0, 0.82, d); col = mix(col, vec3(1.0), 0.35 * (1.0 - d)); }
  else if(uShape < 2.5){ vec2 q = abs(c) * 2.0; float cr = max(0.0, 1.0 - (q.x * 5.0 + q.y * 0.9)) + max(0.0, 1.0 - (q.y * 5.0 + q.x * 0.9));
    float core = exp(-dot(q, q) * 12.0); a = clamp(cr + core, 0.0, 1.0); col = mix(col, vec3(1.0), core); }
  else { float d = length(c) * 2.0; a = smoothstep(1.0, 0.55, d); col = mix(col, vec3(1.0), 0.5 * (1.0 - d)); }
  a *= vAlpha * uOpacity;
  if(a < 0.01) discard;
  gl_FragColor = vec4(col, a);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
// soft light halos around lamps / mushrooms / crystals / torches (static points, gentle pulse)
const HALO_VS = `uniform float uTime; uniform float uPx; attribute float aSize; attribute float aPh; varying vec3 vCol; varying float vA;
void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;
  gl_PointSize = clamp(aSize * uPx * projectionMatrix[1][1] / max(0.5, -mv.z), 1.0, 220.0);
  vCol = color; vA = 0.78 + 0.22 * sin(uTime * 2.2 + aPh); }`;
const HALO_FS = `uniform float uStr; varying vec3 vCol; varying float vA;
void main(){ vec2 c = gl_PointCoord - 0.5; float d = length(c) * 2.0; float a = exp(-d * d * 4.0) * smoothstep(1.0, 0.7, d) * vA * uStr;
  if(a < 0.004) discard; gl_FragColor = vec4(vCol, a);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
// wind sway (vertex shader); amp is the GLSL expression for the sway amount
const swayGLSL = (amp)=> `{ float h_ = max(0.0, position.y - 0.7); float ph_ = position.x * 0.45 + position.z * 0.3;
  transformed.x += sin(uTime * 1.6 + ph_) * ${amp} * h_; transformed.z += cos(uTime * 1.25 + ph_ * 1.3) * ${amp} * 0.5 * h_; }`;

const env = {
  built:false, idx:-1, root:null, own:[], sky:null, far:null, farPar:0.75, clouds:null, cloudData:null,
  parts:null, halos:null, spinners:[], time:0, swayU:{ uTime:{ value:0 }, uSway:{ value:0.018 } },
  partU:null, haloU:null, skyU:null, stats:null,

const defaults = { saved:false };
function saveDefaults(){
  if(defaults.saved || !G.lights) return;
  const L = G.lights;
  defaults.saved = true;
  defaults.hemiSky = L.hemi.color.clone(); defaults.hemiGround = L.hemi.groundColor.clone(); defaults.hemi = L.hemi.intensity;
  defaults.key = L.key.color.clone(); defaults.keyI = L.key.intensity;
  defaults.rim = L.rim.color.clone(); defaults.rimI = L.rim.intensity;
  defaults.fill = L.fill.color.clone(); defaults.fillI = L.fill.intensity;
  defaults.exposure = G.renderer ? G.renderer.toneMappingExposure : 1.08;
  defaults.fog = G.scene.fog ? { color:G.scene.fog.color.clone(), near:G.scene.fog.near, far:G.scene.fog.far } : null;
  defaults.clear = G.renderer ? G.renderer.getClearColor(new THREE.Color()) : null;
  const u = G.look.uni;
  defaults.rimLook = [u.uRimColor.value.clone(), u.uRimStr.value, u.uWarm.value.clone(), u.uWarmStr.value];
}
function applyTheme(th){
  saveDefaults();
  const L = G.lights, l = th.light;
  if(L){
    L.hemi.color.set(l.hemiSky); L.hemi.groundColor.set(l.hemiGround); L.hemi.intensity = l.hemi;
    L.key.color.set(l.key); L.key.intensity = l.keyI;
    L.rim.color.set(l.rim); L.rim.intensity = l.rimI;
    L.fill.color.set(l.fill); L.fill.intensity = l.fillI;
  }
  if(G.renderer){ G.renderer.toneMappingExposure = th.exposure; G.renderer.setClearColor(new THREE.Color(th.fog.color), 1); }
  if(G.scene.fog){ G.scene.fog.color.set(th.fog.color); G.scene.fog.near = th.fog.near; G.scene.fog.far = th.fog.far; }
  else G.scene.fog = new THREE.Fog(th.fog.color, th.fog.near, th.fog.far);
  G.scene.background = new THREE.Color(th.fog.color);
  const r = th.rimLook; G.look.setRim(r[0], r[1], r[2], r[3]);
}
function restoreDefaults(){
  if(!defaults.saved) return;
  const L = G.lights;
  if(L){
    L.hemi.color.copy(defaults.hemiSky); L.hemi.groundColor.copy(defaults.hemiGround); L.hemi.intensity = defaults.hemi;
    L.key.color.copy(defaults.key); L.key.intensity = defaults.keyI;
    L.rim.color.copy(defaults.rim); L.rim.intensity = defaults.rimI;
    L.fill.color.copy(defaults.fill); L.fill.intensity = defaults.fillI;
  }
  if(G.renderer){ G.renderer.toneMappingExposure = defaults.exposure; if(defaults.clear) G.renderer.setClearColor(defaults.clear, 1); }
  G.scene.background = null;   // scenes that want a colour set their own (viewer / arena do)
  if(defaults.fog && G.scene.fog){ G.scene.fog.color.copy(defaults.fog.color); G.scene.fog.near = defaults.fog.near; G.scene.fog.far = defaults.fog.far; }
  const r = defaults.rimLook; G.look.setRim('#'+r[0].getHexString(), r[1], '#'+r[2].getHexString(), r[3]);
}

function own(x){ env.own.push(x); return x; }
function addObj(o){ env.root.add(o); return o; }

// ---------------------------------------------------------------- sky dome
function buildSky(th){
  const s = th.sky, sun = th.sun;
  const dir = new THREE.Vector3(sun.dir[0], sun.dir[1], sun.dir[2]).normalize();
  env.skyU = {
    uTop:{ value:new THREE.Color(s.top) }, uMid:{ value:new THREE.Color(s.mid) }, uBot:{ value:new THREE.Color(s.bot) },
    uH0:{ value:s.h0 }, uH1:{ value:s.h1 },
    uSunDir:{ value:dir }, uSunCol:{ value:new THREE.Color(sun.color) }, uGlowCol:{ value:new THREE.Color(sun.glow) },
    uSunR:{ value:sun.r }, uGlowR:{ value:sun.glowR }, uGlowStr:{ value:sun.glowStr }, uMoon:{ value:sun.moon||0 },
    uStars:{ value:th.stars||0 }, uTime:{ value:0 }, uHdr:{ value:1 },
  };
  const mat = own(new THREE.ShaderMaterial({ uniforms:env.skyU, vertexShader:SKY_VS, fragmentShader:SKY_FS, side:THREE.BackSide, depthWrite:false, fog:false }));
  const geo = own(new THREE.SphereGeometry(300, 40, 20));
  const m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false; m.renderOrder = -1000; m.name = 'sky';
  env.sky = addObj(m);
}

function buildGround(def, th){

  // belt
  {
