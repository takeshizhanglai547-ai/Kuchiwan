  else{   // ── 真・宇宙皇帝ワンダルク：恒星を宿す銀河の支配者 ──
    const cy=-H*0.58, R=HW*0.92; ctx.translate(0,hov);
    ctx.save(); ctx.globalCompositeOperation='lighter';   // 背後の銀河の光輪
    ctx.globalAlpha=0.20+0.08*Math.sin(gf*0.05);
    ctx.fillStyle=radGrad(0,cy,HW*1.75,t.accent,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(0,cy,HW*1.75,0,7); ctx.fill();
    ctx.globalAlpha=0.30; ctx.strokeStyle=t.accent;
    for(let i=0;i<3;i++){ ctx.lineWidth=2.6-i*0.6;
      ctx.beginPath(); ctx.ellipse(0,cy+R*0.1,HW*(0.98+i*0.11),HW*(0.22+i*0.05),-0.26+gf*0.004,0,7); ctx.stroke(); }
    ctx.globalAlpha=0.6; ctx.fillStyle=t.accent;   // 輪を巡る星屑
    for(let i=0;i<10;i++){ const a=i/10*Math.PI*2+gf*0.02;
      ctx.beginPath(); ctx.arc(Math.cos(a)*HW*1.04,cy+R*0.1+Math.sin(a)*HW*0.24,1.8,0,7); ctx.fill(); }
    ctx.restore();
    // 垂れ下がる巨大な触手群
    ctx.strokeStyle=t.c3; ctx.lineCap='round';
    for(let i=-3;i<=3;i++){ const ph=Math.sin(anim*1.3+i*0.9)*12;
      ctx.lineWidth=13-Math.abs(i)*1.8;
      ctx.beginPath(); ctx.moveTo(i*HW*0.20,cy+H*0.14);
      ctx.bezierCurveTo(i*HW*0.30+ph,cy+H*0.30, i*HW*0.36+ph*1.4,cy+H*0.42, i*HW*0.26+ph*2,cy+H*0.57); ctx.stroke();
      ctx.fillStyle=t.c3; ctx.beginPath(); ctx.arc(i*HW*0.26+ph*2,cy+H*0.57,(13-Math.abs(i)*1.8)*0.42,0,7); ctx.fill(); }
    // 脈打つ肉塊の本体
    // 頭頂を囲む骨質の棘冠（生物であることを強調）
    for(let i=-2;i<=2;i++){ const a=-Math.PI*0.5+i*0.42, bx=Math.cos(a)*R*0.92, by=cy+Math.sin(a)*R*0.88;
      const ln=20+(2-Math.abs(i))*10, w=11-Math.abs(i)*1.6;
      const nx=-Math.sin(a), ny=Math.cos(a);
      ctx.fillStyle=shade(t.c3,14+Math.abs(i)*8);
      ctx.beginPath(); ctx.moveTo(bx-nx*w,by-ny*w);
      ctx.quadraticCurveTo(bx+Math.cos(a)*ln*0.6-nx*w*0.4, by+Math.sin(a)*ln*0.6-ny*w*0.4, bx+Math.cos(a)*ln, by+Math.sin(a)*ln);
      ctx.quadraticCurveTo(bx+Math.cos(a)*ln*0.6+nx*w*0.5, by+Math.sin(a)*ln*0.6+ny*w*0.5, bx+nx*w,by+ny*w);
      ctx.closePath(); ctx.fill(); }
    // いびつに脈打つ肉塊（左右非対称）
    ctx.beginPath();
    for(let i=0;i<=56;i++){ const a=i/56*Math.PI*2;
      const rr=R*(1+0.10*Math.sin(a*2.0+1.1)+0.08*Math.sin(a*3.0+anim*1.2)+0.05*Math.sin(a*5.0-gf*0.03)-0.06*Math.cos(a));   // 左右非対称にうねる
      const px=Math.cos(a)*rr, py=cy+Math.sin(a)*rr*0.92;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath();
    ctx.fillStyle=radGrad(-R*0.3,cy-R*0.5,R*1.5,shade(t.c1,20),shade(t.c2,-16)); ctx.fill();
    ctx.save(); ctx.clip();
      ctx.fillStyle='rgba(6,40,34,.42)';   // 不規則な甲殻の斑
      for(let i=0;i<9;i++){ const a=i*2.4, rr=R*(0.30+0.62*(((i*5)%8)/8));
        ctx.save(); ctx.translate(Math.cos(a)*rr, cy+Math.sin(a*1.2)*rr*0.8); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0,0,R*(0.14+0.06*(i%3)),R*0.09,0,0,7); ctx.fill(); ctx.restore(); }
      alienGlow(0,cy+R*0.18,R*0.62,'rgba(190,255,235,.95)',0.45+0.18*Math.sin(gf*0.09));   // 体内で燃える恒星
      ctx.fillStyle='#f2fffa'; ctx.beginPath(); ctx.arc(0,cy+R*0.18,R*0.10+Math.sin(gf*0.12)*1.6,0,7); ctx.fill();
      ctx.strokeStyle='rgba(180,255,230,.20)'; ctx.lineWidth=2.4; ctx.lineCap='round';   // 核から走る血管
      for(let i=0;i<7;i++){ const a=i*0.9+0.4;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*R*0.16,cy+R*0.18+Math.sin(a)*R*0.16);
        ctx.quadraticCurveTo(Math.cos(a)*R*0.7+14,cy+Math.sin(a)*R*0.55, Math.cos(a)*R*1.05,cy+Math.sin(a)*R*0.95); ctx.stroke(); }
      ctx.fillStyle='rgba(0,20,16,.30)';   // 上部を沈ませて風船感を消す
      ctx.beginPath(); ctx.ellipse(0,cy-R*1.05,R*1.2,R*0.55,0,0,7); ctx.fill();
    ctx.restore();
    // 周囲に浮遊する結晶の装甲板
    for(let i=0;i<6;i++){ const a=i/6*Math.PI*2+gf*0.018, rr=HW*1.14+Math.sin(gf*0.06+i)*6;
      ctx.save(); ctx.translate(Math.cos(a)*rr, cy+Math.sin(a)*rr*0.68); ctx.rotate(a+gf*0.02);
      const cgd=ctx.createLinearGradient(-9,-14,9,14); cgd.addColorStop(0,shade(t.c1,-4)); cgd.addColorStop(1,t.c3);
      ctx.fillStyle=cgd; ctx.beginPath();
      ctx.moveTo(0,-14); ctx.lineTo(9,0); ctx.lineTo(0,14); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(200,255,232,.55)'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath();
      ctx.moveTo(0,-14); ctx.lineTo(9,0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill(); ctx.restore(); }
    // 体表を巡る無数の眼
    for(let i=0;i<9;i++){ const a=i/9*Math.PI*2+gf*0.010;
      const px=Math.cos(a)*R*0.66, py=cy+Math.sin(a)*R*0.72, r=6+3*(i%3);
      if(hurt){ hurtEye(px,py,r*0.95,'#06251f'); continue; }

      ctx.fillStyle='#06251f'; ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fill();
      ctx.fillStyle='#ffe14d'; ctx.beginPath(); ctx.arc(px,py,r*0.46,0,7); ctx.fill(); }
    // 中央の巨眼（縦の瞳孔）
    const ey=cy-R*0.46;
    if(hurt) hurtEye(0,ey,R*0.20,'#06251f');
    else { alienEye(0,ey,R*0.24,R*0.16,0,false,'rgba(150,255,225,.7)');
      ctx.fillStyle='#ff5a6a'; ctx.beginPath(); ctx.ellipse(0,ey,R*0.05,R*0.13,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(-R*0.08,ey-R*0.06,R*0.035,0,7); ctx.fill(); }
    // 裂けた大口（牙）
    const my=cy+R*0.62, mo=atk?1.6:1;
    if(hurt) alienMaw(0,my,R*0.62,R*0.16,true,'#06251f');
    else { ctx.fillStyle='#06251f'; ctx.beginPath(); ctx.ellipse(0,my,R*0.34,R*0.13*mo,0,0,7); ctx.fill();
      ctx.fillStyle='#eafff6';
      for(let i=-2;i<=2;i++){ const px=i*R*0.12;
        ctx.beginPath(); ctx.moveTo(px-4,my-R*0.12*mo); ctx.lineTo(px,my-R*0.01*mo); ctx.lineTo(px+4,my-R*0.12*mo); ctx.closePath(); ctx.fill(); } }
    if(hurt){ sweatDrop(R*0.85,cy-R*0.70); sweatDrop(R*0.68,cy-R*0.92); }
  }
}
// ══ 三周目・宇宙の背景（墜ちた円盤／母船の回廊／有機コア）══
function drawSpaceScene(T){
  const yb=GROUND_TOP;
  // 遠景：巨大な惑星と環
  const px=W*0.22 - camX*0.05, py=120;
  ctx.save(); ctx.globalAlpha=0.55;
  ctx.fillStyle=radGrad(px,py,74,T.core?'#7de8b0':T.corridor?'#7db8ff':'#c89cff', T.core?'#0a3a2a':T.corridor?'#123055':'#2a1848');
  ctx.beginPath(); ctx.arc(px,py,66,0,7); ctx.fill();
  ctx.strokeStyle='rgba(220,210,255,.35)'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(px,py,104,20,-0.35,0,7); ctx.stroke();
  ctx.restore();
  if(T.saucer){ // 墜ちた円盤：奥に浮かぶUFOと、地面に突き刺さった残骸
    for(let i=0;i<3;i++){ const ux=((i*430-camX*0.34)%(W+430)+W+430)%(W+430)-215, uy=110+(i*47%60)+Math.sin(gf*0.03+i)*7;
      ctx.save(); ctx.translate(ux,uy);
      ctx.fillStyle='rgba(150,130,190,.75)'; ctx.beginPath(); ctx.ellipse(0,0,52,13,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(190,240,255,.6)'; ctx.beginPath(); ctx.ellipse(0,-11,24,15,0,Math.PI,0); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(let k=0;k<3;k++){ ctx.fillStyle='rgba(160,255,220,'+(0.35+0.25*Math.sin(gf*0.12+k+i))+')';
        ctx.beginPath(); ctx.arc(-30+k*30, 4, 4, 0, 7); ctx.fill(); }
      ctx.globalAlpha=0.16; ctx.fillStyle=radGrad(0,60,80,'rgba(160,255,220,.9)','rgba(160,255,220,0)');
      ctx.beginPath(); ctx.moveTo(-26,6); ctx.lineTo(26,6); ctx.lineTo(60,120); ctx.lineTo(-60,120); ctx.closePath(); ctx.fill();   // 吸引ビーム
      ctx.restore(); ctx.restore(); }
    // 地面に刺さった円盤の残骸
    for(let i=-1;i<5;i++){ const step=360, gx=i*step-(camX*0.5)%step, g0=Math.floor((camX*0.5)/step)+i;
      if(g0%2)continue; ctx.save(); ctx.translate(gx+90, yb-6); ctx.rotate(-0.5);
      ctx.fillStyle='rgba(110,95,150,.85)'; ctx.beginPath(); ctx.ellipse(0,0,72,17,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(70,60,100,.9)'; ctx.beginPath(); ctx.ellipse(0,-12,32,17,0,Math.PI,0); ctx.fill(); ctx.restore(); } }
  if(T.corridor){ // 母船の回廊：奥へ続く金属リングとネオンライン
    for(let i=0;i<9;i++){ const k=i/9, rw=W*(0.16+k*0.42), rh=(yb-60)*(0.22+k*0.62);
      ctx.strokeStyle='rgba(120,190,255,'+(0.42-k*0.3)+')'; ctx.lineWidth=3+k*5;
      ctx.strokeRect(W/2-rw/2 - camX*0.06%40, yb-rh, rw, rh); }
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=-1;i<10;i++){ const step=150, gx=i*step-(camX*0.7)%step;
      ctx.fillStyle='rgba(110,220,255,'+(0.20+0.16*Math.sin(gf*0.08+i))+')'; ctx.fillRect(gx, yb-190, 5, 190); }
    ctx.restore(); }
  if(T.core){ // 母船コア：脈打つ巨大な有機体の心臓
    const cx=W*0.5-camX*0.18, cy=yb-190, pul=0.5+0.5*Math.sin(gf*0.06);
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.30+0.16*pul;
    ctx.fillStyle=radGrad(cx,cy,180,'rgba(120,255,190,.9)','rgba(120,255,190,0)');
    ctx.beginPath(); ctx.arc(cx,cy,180,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(20,90,66,.9)'; ctx.beginPath(); ctx.ellipse(cx,cy,96+8*pul,112+8*pul,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(140,255,200,.55)'; ctx.lineWidth=4;
    for(let i=0;i<6;i++){ const a=i*Math.PI/3+gf*0.006;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.quadraticCurveTo(cx+Math.cos(a)*120, cy+Math.sin(a)*90, cx+Math.cos(a)*190, cy+Math.sin(a)*150); ctx.stroke(); }
    ctx.fillStyle='rgba(180,255,220,'+(0.6+0.3*pul)+')'; ctx.beginPath(); ctx.ellipse(cx,cy,40,50,0,0,7); ctx.fill(); }
  // 手前：漂う光の粒（無重力のチリ）
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<14;i++){ const bx=((i*151+gf*(0.3+i%3*0.2))%(W+60))-30, by=70+((i*89)%(yb-120))+Math.sin(gf*0.03+i)*20;
    ctx.fillStyle='rgba(200,230,255,'+(0.2+0.3*Math.abs(Math.sin(gf*0.05+i*2)))+')'; ctx.beginPath(); ctx.arc(bx,by,2,0,7); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle=T.haze; ctx.fillRect(0,150,W,GROUND_TOP-150);
}
// ── 二周目・蟲の世界の背景（巨大な花・蜂の巣・蜘蛛の糸・光る茸）──
function drawGiantFlower(x,baseY,h,hue,ph){ // 見上げるほど巨大な花（茎＋花弁）

let _shadowSpr=null;   // 負荷対策：影は1枚のスプライトを拡縮（毎フレームのグラデ生成を排除）

    const c=_shadowSpr.getContext('2d');

  ctx.drawImage(_shadowSpr, x-r*1.06, y+2-r*0.4, r*2.12, r*0.8); }
const _fbCache={};   // 負荷対策：毛並みグラデーションを半径×色でキャッシュ
function furBall(x,y,r,inner,outer){

function drawEnemy(e){
  const t=ETYPE[e.type], s=depthScale(e.y), sx=e.x-camX, sy=e.y-groundLift(e.x);
  if(sx<-150||sx>W+150) return;   // 負荷対策：画面外の敵は描かない
  if(t.heroBoss){   // 腕試しの主役ボスは、プレイヤーとまったく同じ描画で出す
    let ha=1; if(e.dead&&e.deadTimer<22) ha=clamp(e.deadTimer/22,0,1);
    drawHeroBossEnemy(e,t,sx,sy,s,ha);
    if(e.duelSayT>0 && !e.dead) speech(sx, sy-t.h*s-e.z-30, e.duelSay);
    if((e.telegraph>0||e.state==='crouch')&&!e.dead && Math.floor(gf/4)%2){
      ctx.font='bold '+(26*s)+'px Trebuchet MS'; ctx.textAlign='center';
      ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText('!',sx,sy-t.h*s-e.z-12);
      ctx.fillStyle='#ffe23a'; ctx.fillText('!',sx,sy-t.h*s-e.z-12); ctx.textAlign='left'; }
    return; }

    ctx.fillStyle='#6a4a2c'; ctx.beginPath(); ctx.ellipse(0,-4,22,10,0,Math.PI,0); ctx.fill();

// ══ 腕試しの主役ボス：本人と“完全に同じ”見た目・技で戦う ══
// 実体はプレイヤーと同じ構造のゴースト。描画は drawPlayer、技は ATK テーブルをそのまま使う
function heroGhost(e){
  if(!e.ghost){ const k=ETYPE[e.type].heroBoss;
    const g=makePlayer(0,k); g.active=true; g.kind=k; g.weapon=defaultWeaponFor(k); g.permWeapon=null;
    g.lives=99; g.dim=3; g.dimMax=3; g.jHit=new Set();
    e.ghost=g; }
  const g=e.ghost;
  if(g.atk && e.state!=='bmove'){ g.atk=null; g.state='idle'; e.heroAtk=null; }   // 被弾などで技が中断されたら構えを解く
  g.x=e.x; g.y=e.y; g.z=e.z; g.facing=e.facing; g.hp=e.hp; g.maxHp=e.maxHp; g.invuln=0;
  return g;
}
// player グローバルを一時的にゴーストへ差し替えて描画・処理する
function withGhost(e,fn){ const g=heroGhost(e), sv=player; player=g; try{ return fn(g); } finally{ player=sv; } }

function drawHeroBossEnemy(e,t,sx,sy,s,al){
  const g=heroGhost(e);
  // 敵側の状態を、プレイヤーの状態語彙へ翻訳（技中はゴーストの atk をそのまま活かす）
  if(!g.atk){
    if(e.dead||e.state==='down'){ g.state='down'; g.downTimer=20; }
    else if(e.state==='hurt'){ g.state='hurt'; g.hurtTimer=10; }
    else if(e.state==='air'||e.z>4){ g.state='jump'; g.jAtk=0; }
    else if(e.state==='walk'){ g.state='walk'; }
    else g.state='idle';

  g.anim=e.anim||0;
  ctx.globalAlpha=al;
  softShadow(sx,sy,(t.w*0.5)*s*(e.z>0?0.7:1));
  withGhost(e,()=>drawPlayer());
  ctx.globalAlpha=1;

// ── 技：プレイヤーの ATK 定義をそのまま使い、当たり判定だけプレイヤー側へ向ける ──
function heroBeginAttack(e,type){ const def=ATK[type]; if(!def) return false;
  const g=heroGhost(e);
  g.atk={type, t:0, def, hitSet:new Set(), lastHit:{}};
  g.state='attack'; g.riseVel=def.rise? (def.riseV||9):0; g.charge=0;
  e.heroAtk=type;
  if(def.name) popText(e.x, e.y-e.h-16, def.name+'！', def.trail||ETYPE[e.type].accent, !!def.special);
  if(def.rise) sfx.rise(); else if(def.special){ sfx.boss(); flash=Math.max(flash,3); } else sfx.swing(1);

// doPlayerHit のミラー：同じ def を読み、敵ではなくプレイヤーを殴る
function heroDoHit(e,a){ const g=e.ghost, def=a.def, WP=WEAPONS[g.weapon]||WEAPONS.dagger;
  const reach=def.reach*REACH*WP.reach, hh=def.hh*HH;
  const dmgMul=WP.dmg*diffDmgMul();
  for(const p of players){ if(!p.active||p.state==='dead') continue;
    if(def.multi){ if(a.lastHit[p.pid] && gf-a.lastHit[p.pid]<(def.multiGap||8)) continue; }
    else if(a.hitSet.has(p.pid)) continue;
    if(Math.abs(p.y-e.y)>hh) continue;
    const dx=p.x-e.x;
    if(def.omni){ if(Math.abs(dx)>reach) continue; }
    else { if(Math.sign(dx)!==e.facing && Math.abs(dx)>18) continue; if(Math.abs(dx)>reach) continue; }
    const dmg=Math.max(1, Math.round((def.dmg||8)*dmgMul));

function heroRunAttack(e){ const g=e.ghost; if(!g||!g.atk) return false;

  else if(def.lunge && a.t<=def.act[1]) e.x+=dir*def.lunge*1.0;

// そのキャラが“自分でプレイする時に使える技”をそのまま候補にする
function heroMovePool(k){

  return {

    hadou: specialFor(ref,'hadou'),
    dp:    specialFor(ref,'dp'),
    du:    specialFor(ref,'du'),

// 距離に応じて“プレイヤーがやりそうな”技を選ぶ
function heroPickMove(e,dist){ const k=ETYPE[e.type].heroBoss, P=heroMovePool(k), r=Math.random();
  if(dist>300) return r<0.55? P.hadou : P.dash;
  if(dist>150) return r<0.4? P.hadou : (r<0.7? P.dash : P.fwd);
  if(r<0.34) return P.combo[(Math.random()*P.combo.length)|0];
  if(r<0.54) return P.fwd;
  if(r<0.70) return P.dp;
  if(r<0.84) return P.du;
  if(r<0.93) return P.up;
  return P.hadou; }

// ---------- 必殺技リスト（ポーズ画面）：レベルで進化する技の現状と次の解禁を見せる ----------
function drawSpecialList(cx, top){
  const p=activePlayers()[0]||players[0]; if(!p) return;
  const lv=p.level||1;
  ctx.font='bold 20px Trebuchet MS'; ctx.fillStyle='#ffe14d';
  ctx.fillText('必殺技（LV'+lv+'）', cx, top);
  // 2列で並べる（7スロット）
  const colX=[cx-232, cx+232], rowH=54;
  SPECIAL_SLOTS.forEach((slot,i)=>{
    const x=colX[i%2], y=top+28+Math.floor(i/2)*rowH;
    const evolved=!!specialUpgraded(p,slot), cur=specialFor(p,slot);
    const nm=(ATK[cur]||{}).name || SPECIAL_BASE_NAME[p.kind+'.'+slot] || cur || '—';
    const ups=(SPECIAL_UP[p.kind]||{})[slot]||[], next=ups.find(u=>lv<u[0]);
    ctx.font='12px Trebuchet MS'; ctx.fillStyle='#9fb0c4';
    ctx.fillText(SPECIAL_SLOT_NAME[slot]+'  '+SPECIAL_SLOT_CMD[slot], x, y);
    ctx.font='bold 17px Trebuchet MS'; ctx.fillStyle=evolved?'#ff8aff':'#ffffff';
    ctx.fillText((evolved?'★ ':'')+nm, x, y+19);
    ctx.font='11px Trebuchet MS'; ctx.fillStyle=next?'#7f8b9c':'#5f6a78';
    ctx.fillText(next? ('LV'+next[0]+' →「'+((ATK[next[1]]||{}).name||'')+'」') : '進化済み', x, y+34);
  });
}

    const ap=activePlayers().find(p=>p.state!=='dead'&&Math.abs(p.x-n.x)<64&&p.z<=0); if(!ap) continue;
    const box=(n.kind==='chest'||n.kind==='cursed'), low=(n.kind==='spring'||n.kind==='portal');
    const sx=n.x-camX, gy=LANE-groundLift(n.x)-(box?40:low?28:86);

}

// ── 傭兵AI：プレイヤーに追従し、近くの敵へ自動で攻撃 ──
function updateMercs(){
  for(let i=mercs.length-1;i>=0;i--){ const m=mercs[i], T=ETYPE[m.type];
    m.anim+=0.12; m.bob+=0.1; if(m.atkCd>0)m.atkCd--; if(m.hurtT>0)m.hurtT--;
    if(m.atkT>0){ m.atkT--; m.state='attack'; m.atkTimer=m.atkT; if(m.atkT===0)m.state='idle'; }
    const p=players[0];
    // 最寄りの敵を探す
    let tg=null, td=1e9;
    for(const e of enemies){ if(e.dead||e.state==='blastoff')continue; const d=Math.abs(e.x-m.x); if(d<td){td=d;tg=e;} }
    if(tg && td<360){
      m.facing=tg.x>m.x?1:-1;
      const reach=Math.min(T.atkR,80)*0.9+18;
      if(td>reach){ if(m.atkT<=0){ m.x+=m.facing*T.sp*1.6; m.state='walk'; } }
      else if(m.atkCd<=0){ m.atkCd=52; m.atkT=10; m.atkMax=10;
        spark(tg.x,tg.y-tg.h*0.5,'#9fff9f',9,8); ring(tg.x,tg.y-tg.h*0.4,'#c8ffc8');
        damageEnemy(tg, Math.round(T.dmg*1.6), m.facing*2, false); sfx.swing(1); }
    } else {   // 敵がいなければプレイヤーの少し後ろに付き従う
      const dd=p.x-m.x-((i%2)?-70:70);
      if(Math.abs(dd)>60){ m.facing=dd>0?1:-1; m.x+=m.facing*Math.min(Math.abs(dd)*0.08, T.sp*2.2); m.state='walk'; }
      else m.state='idle';
    }
    m.x=clamp(m.x, camX+16, camX+W-16);
    // 敵の攻撃に巻き込まれるとダメージ（被弾後は少し無敵）
    if(m.hurtT<=0){ for(const e of enemies){ if(e.dead)continue;
      if((e.state==='attack'||e.state==='bmove') && Math.abs(e.x-m.x)<Math.min((ETYPE[e.type].atkR||50),110)*0.8){
        m.hurtT=46; m.hp-=Math.round(ETYPE[e.type].dmg*diffDmgMul()); m.r.hp=m.hp;
        spark(m.x,m.y-m.h*0.5,'#ff8a6a',7,7);

function updateShop(){ gf++; shopT++; if(shopMsgT>0)shopMsgT--;
  // ── ガチャ演出中は専用の処理（回転→開封）──
  if(gacha){ gacha.t++;
    if(gacha.phase==='spin'){ if(gacha.t%3===0)sfx.swing(0);
      if(gacha.t>=48){ gacha.phase='reveal'; gacha.t=0; applyGacha(gacha.item);
        sfx.boss(); sfx.rise(); flash=Math.max(flash,3); shake=Math.max(shake,gacha.item.r*2);

    else { useInput(players[0].in);

        pressed.atk=pressed.jump=pressed.grab=pressed.grd=false;
        shopMsg='「'+gacha.item.name+'」を手に入れた！'; shopMsgT=110; gacha=null; }
      saveInput(players[0].in); }
    updateParticles(); return; }
  useInput(players[0].in);
  if(shopNavCd>0)shopNavCd--;

  shopScroll=clamp(shopScroll,0,Math.max(0,SHOP_ITEMS.length-SHOP_VIS));
  if(pressed.atk){ pressed.atk=false; const it=SHOP_ITEMS[shopSel];
    if(it.leave){ saveInput(players[0].in); exitShop(); return; }
    if(it.gacha){ if(coins>=it.cost){ coins-=it.cost; gacha={phase:'spin', t:0, item:rollGacha()}; sfx.rise(); saveInput(players[0].in); return; }
      else { shopMsg='コインが足りないニャ…'; shopMsgT=80; sfx.guard(); } }
    else if(it.merc){
      if(mercRoster.length>=MERC_MAX){ shopMsg='傭兵はこれ以上連れて行けないニャ（最大'+MERC_MAX+'体）'; shopMsgT=90; sfx.guard(); }
      else if(coins>=it.cost){ coins-=it.cost; hireMerc(it.merc);

      else { shopMsg='コインが足りないニャ…'; shopMsgT=80; sfx.guard(); } }
    else if(it.soldOut&&it.soldOut()){ shopMsg='それはもう売り切れだニャ'; shopMsgT=80; sfx.guard(); }
    else if(coins>=it.cost){ coins-=it.cost; it.buy(); shopMsg=it.name+'を購入！'; shopMsgT=90; sfx.rise(); }
    else { shopMsg='コインが足りないニャ…'; shopMsgT=80; sfx.guard(); } }
  if(pressed.grab||pressed.jump){ pressed.grab=false; pressed.jump=false; saveInput(players[0].in); exitShop(); return; }
  saveInput(players[0].in); updateParticles();
}

function drawGacha(){

  if(reveal){ ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<14;i++){ ctx.save(); ctx.rotate(gf*0.02+i*(Math.PI/7)); ctx.globalAlpha=0.09+0.05*it.r/5; ctx.fillStyle=it.col;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-24,-300); ctx.lineTo(24,-300); ctx.fill(); ctx.restore(); }
    ctx.restore(); }
  const pop = reveal ? (0.7+0.3*Math.min(1,gacha.t/9)) : (1+Math.sin(gacha.t*0.5)*0.03);
  ctx.scale(pop,pop);
  const cw=320, chh=210;
  const grd=ctx.createLinearGradient(0,-chh/2,0,chh/2); grd.addColorStop(0,'#232640'); grd.addColorStop(1,'#0c0d18');

  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=it.col; ctx.globalAlpha=0.35; ctx.beginPath(); ctx.arc(0,-42,44,0,7); ctx.fill(); ctx.restore();
  ctx.fillStyle=it.col; ctx.beginPath(); ctx.arc(0,-42,22,0,7); ctx.fill();

  ctx.fillText(reveal?'★ 専用アイテム GET! ★':'✦ 回転中… ✦', 0, -chh/2+30);

  function move(t){ const i=IN(), k=i.keys; let dx=t.clientX-scx,dy=t.clientY-scy; const m=Math.hypot(dx,dy)||1,max=50,cl=Math.min(m,max);

    const nl=dx<-th,nr=dx>th; if(nl&&lastTapDir!==-1){pushTapFor(i,-1);lastTapDir=-1;} if(nr&&lastTapDir!==1){pushTapFor(i,1);lastTapDir=1;} if(!nl&&!nr)lastTapDir=0;
    if(m>max*0.55){ const ang=Math.atan2(dy,dx); let card=(Math.round(ang/(Math.PI/2))+4)%4; card=[1,2,3,0][card];
      if(card!==lastCard){ pushCardFor(i,card); lastCard=card; }

  const n=CHARS.length, gap=n>5?10:(n>4?12:18);
  const cw=Math.min(n>4?168:178, Math.floor((W-40-(n-1)*gap)/n));
  const sc=clamp(cw/74, 1.6, 2.5), tot=n*cw+(n-1)*gap, x0=(W-tot)/2, cy=H*0.5;
  for(let i=0;i<n;i++){ const cx=x0+i*(cw+gap)+cw/2;
    const p1=csSel[0]===i, p2=csSel[1]===i;
    ctx.fillStyle='rgba(0,0,0,.34)'; roundRect(cx-cw/2,cy-96,cw,190,16); ctx.fill();
    ctx.lineWidth=(p1||p2)?4:2; ctx.strokeStyle=(p1&&p2)?'#fff':(p1?'#7dd0ff':(p2?'#ff9a5a':'rgba(255,255,255,.25)')); ctx.stroke();
    ctx.save(); ctx.translate(cx,cy-14); ctx.scale(sc,sc); CHARS[i].icon(0,0); ctx.restore();
    ctx.fillStyle=CHARS[i].col; ctx.font='bold 16px "Hiragino Maru Gothic ProN",sans-serif'; ctx.fillText(CHARS[i].name,cx,cy+72);
    if(p1) drawSelTag(cx-40, cy-118, '#7dd0ff', '1P', csLock[0]);
    if(p2) drawSelTag(cx+40, cy-118, '#ff9a5a', '2P', csLock[1]);
  }
  ctx.fillStyle='#cfe0ff'; ctx.font='14px "Hiragino Maru Gothic ProN",sans-serif';
  ctx.fillText('1P：矢印で選択・J/決定　　2P：WASDで選択・F/決定　（決定後は L/H でキャンセル）',W/2,H-42);
  ctx.fillStyle=(csLock[0]&&csLock[1])?'#7dff7d':'#8fa8c8'; ctx.font='bold 15px "Hiragino Maru Gothic ProN",sans-serif';
  ctx.fillText(hardMode?'高難易度モード ON　／　二人とも決定でスタート！':'二人とも決定でスタート！',W/2,H-18);
  ctx.textAlign='left';
}
function drawSelTag(x,y,col,label,locked){ ctx.save(); ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x,y+10); ctx.lineTo(x-9,y-4); ctx.lineTo(x+9,y-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle=col; roundRect(x-22,y-24,44,18,5); ctx.fill(); ctx.fillStyle='#1a1a20'; ctx.font='bold 12px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText(label,x,y-11);
  if(locked){ ctx.fillStyle='#7dff7d'; ctx.font='bold 12px "Hiragino Maru Gothic ProN",sans-serif'; ctx.fillText('決定!',x,y-30); } ctx.restore(); ctx.textAlign='center'; }
function loop(){
  if(state==='cut'){ gf++; updateCut(); ctx.clearRect(0,0,W,H); drawCut(); requestAnimationFrame(loop); return; }
  if(state==='shop'){ updateShop(); ctx.clearRect(0,0,W,H); drawShop(); requestAnimationFrame(loop); return; }
  if(state==='map'){ gf++; updateMap(); ctx.clearRect(0,0,W,H); drawMap(); requestAnimationFrame(loop); return; }
  if(state==='charsel'){ gf++; updateCharSel(); ctx.clearRect(0,0,W,H); drawCharSel(); requestAnimationFrame(loop); return; }
  // slow-motion: throttle logic ticks while keeping render smooth
  if(slowmo>0 && state==='play' && hitStop<=0){
    slowmo--; slowAcc+=0.34;
    if(slowAcc>=1){ slowAcc-=1; update(); }
  } else { update(); }
  if(state==='title'){ ctx.clearRect(0,0,W,H); drawTitleScene(); }
  else render();
  requestAnimationFrame(loop);
}
buildEncounters(); loop();
</script>
