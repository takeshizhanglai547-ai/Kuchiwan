; xevoSigma PREMIUM Custom Residence - Digital Twin
; Renderer configuration for a Nanite + Lumen + VSM realtime walkthrough.
; Brief sections O, Q, R.

[/Script/Engine.RendererSettings]
; --- Nanite (brief O) ---
r.Nanite=1
r.Nanite.ProjectEnabled=True

; --- Lumen: dynamic GI and reflections (brief O, Q) ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
; The double-height void is where screen-traced GI falls apart. Expect to need
; hardware ray tracing for the ULTRA preset; see WALKTHROUGH_SPEC.md section 6.

; --- Virtual Shadow Maps (brief O) ---
r.Shadow.Virtual.Enable=1

; --- Upscaling: TSR by default, vendor neutral (brief R) ---
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=200

; --- Interiors ---
r.DefaultFeature.AutoExposure=False
; Manual exposure. Auto-exposure makes a daylight study meaningless: the whole
; point is to see how bright the LDK actually is at 09:00 in February.
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True

; --- Physically correct light units (brief Q) ---
r.DefaultFeature.LightUnits=1

; --- Textures: 4K base, 8K on hero surfaces only (brief M) ---
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1

; --- Ray traced shadows for the piano lids and glazing ---
r.RayTracing=True
r.RayTracing.Shadows=1

[/Script/Engine.Engine]
; 1 Blender Unit = 1 m -> 1 uu = 1 cm. The conversion lives here and in the
; Datasmith import scale, and NOWHERE else.
NearClipPlane=1.0

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_Master
EditorStartupMap=/Game/Maps/L_Master
GlobalDefaultGameMode=/Game/Blueprints/BP_ArchVizGameMode.BP_ArchVizGameMode_C

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
