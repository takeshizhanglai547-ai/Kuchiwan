<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>聖犬士イッヌ - ベルトアクション</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#05060a; overflow:hidden;
    font-family:'Trebuchet MS','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    color:#fff; user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; background:#000; box-shadow:0 0 60px rgba(0,0,0,.8); max-width:100%; max-height:100%; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; z-index:20; padding:20px;
    background:radial-gradient(ellipse at center, rgba(20,12,40,.55), rgba(0,0,0,.9)); }
  .hidden { display:none !important; }
  .title-sub { font-size:14px; letter-spacing:6px; color:#ffd34d; text-shadow:0 0 8px #b8860b; }
  .title-main { font-size:clamp(38px,9vw,84px); font-weight:900; letter-spacing:4px;
    background:linear-gradient(180deg,#fff6d0,#ffcf3a 55%,#c8881a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 0 rgba(120,60,0,.4); margin:4px 0; }
  .title-jp { font-size:clamp(16px,4vw,28px); color:#fff; letter-spacing:8px;
    text-shadow:0 0 10px #ff8a00; margin-bottom:14px; }
  .btn { margin-top:12px; padding:13px 38px; font-size:20px; font-weight:800; letter-spacing:3px;
    color:#3a1d00; cursor:pointer; border-radius:10px;
    background:linear-gradient(180deg,#ffe98a,#ffb02e); border:2px solid #fff3c0;
    box-shadow:0 6px 0 #9c5a00,0 10px 20px rgba(0,0,0,.5); transition:transform .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #9c5a00; }
  .moves { margin-top:16px; font-size:12.5px; color:#dfeaff; line-height:1.7; max-width:600px; text-align:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,210,80,.25); border-radius:10px; padding:9px 16px; }
  .moves h3 { color:#ffd34d; letter-spacing:3px; margin-bottom:6px; font-size:13px; }
  .moves b { color:#7fd0ff; } .moves .cmd { color:#ff9a3a; font-weight:800; }
  #result-title { font-size:clamp(34px,8vw,70px); font-weight:900; letter-spacing:6px; }
  #result-sub { font-size:18px; margin-top:10px; color:#ffd34d; letter-spacing:2px; }

  /* sound toggle */
  #snd { position:absolute; top:10px; right:10px; z-index:25; width:42px; height:42px; border-radius:50%;
    background:rgba(8,10,20,.6); border:2px solid rgba(255,210,80,.6); color:#ffd34d; font-size:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }

  /* touch */
  #touch { position:absolute; inset:0; z-index:15; pointer-events:none; display:none; }
  .stk { position:absolute; border-radius:50%; background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.18); pointer-events:auto; }
  .stk .nub { position:absolute; left:50%; top:50%; width:66px; height:66px; margin:-33px;
    border-radius:50%; background:rgba(255,255,255,.26); border:2px solid rgba(255,255,255,.85); }
  #stick  { left:24px;  bottom:28px; width:184px; height:184px; }
  #stick2 { right:24px; bottom:28px; width:184px; height:184px; display:none; }
  .tbtn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center;
    justify-content:center; font-size:15px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000;
    border:3px solid rgba(255,255,255,.55); text-align:center; line-height:1.1;
    box-shadow:0 3px 10px rgba(0,0,0,.4); }
  .p2 { display:none; }
  .bA { background:rgba(255,80,40,.62); }  .bGr { background:rgba(170,90,235,.6); }
  .bJ { background:rgba(90,200,120,.6); }  .bD { background:rgba(60,140,255,.62); }
  /* 1P spacious layout */
  #bAtk  { right:118px; bottom:34px;  width:92px; height:92px; font-size:18px; }
  #bGrab { right:34px;  bottom:30px;  width:78px; height:78px; }
  #bJmp  { right:42px;  bottom:118px; width:74px; height:74px; }
  #bGrd  { right:142px; bottom:140px; width:72px; height:72px; }
  /* 2P split: P1 left cluster, P2 right cluster */
  #touch.twop #stick  { left:8px;  bottom:8px; width:128px; height:128px; }
  #touch.twop #stick2 { display:block; right:8px; bottom:8px; width:128px; height:128px; }
  #touch.twop .p2 { display:flex; }
  #touch.twop .tbtn { font-size:14px; }
  #touch.twop #bAtk { left:118px; right:auto; bottom:10px;  width:62px; height:62px; font-size:15px; }
  #touch.twop #bJmp { left:184px; right:auto; bottom:10px;  width:58px; height:58px; }
  #touch.twop #bGrd { left:118px; right:auto; bottom:76px;  width:58px; height:58px; }
  #touch.twop #bGrab{ left:184px; right:auto; bottom:76px;  width:58px; height:58px; }
  #bAtk2 { right:118px; bottom:10px; width:62px; height:62px; font-size:15px; }
  #bJmp2 { right:184px; bottom:10px; width:58px; height:58px; }
  #bGrd2 { right:118px; bottom:76px; width:58px; height:58px; }
  #bGrab2{ right:184px; bottom:76px; width:58px; height:58px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="snd">♪</div>

  <div id="start" class="overlay">
    <div class="title-sub">ARCADE BELT ACTION</div>
    <div class="title-main">聖犬士イッヌ</div>
    <div class="title-jp">〜 ワンワン帝国の野望 〜</div>
    <button id="continueBtn" class="btn hidden" style="background:linear-gradient(180deg,#7dd0ff,#3a8ad0)">▶ つづきから</button>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="startBtn" class="btn">▶ 1P イッヌ</button>
      <button id="startShimaBtn" class="btn" style="background:linear-gradient(180deg,#e0b07a,#b07a44)">▶ 1P シマダックス</button>
      <button id="start2Btn" class="btn" style="background:linear-gradient(180deg,#ffd08a,#ff8e2e)">▶ 2P CO-OP</button>
    </div>
    <div class="moves">
      移動 <b>矢印/WASD</b>　攻撃 <b>J/F</b>　ジャンプ <b>Space/V</b>　回避 <b>K/G</b>　掴み <b>L/H</b>　　<span style="opacity:.7">スマホは画面の操作パッドで</span>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="resumeBtn" class="btn hidden" style="background:linear-gradient(180deg,#7dd0ff,#3a8ad0)">▶ ステージ再開</button>
      <button id="retryBtn" class="btn">▶ 最初から</button>
    </div>
  </div>

  <div id="touch">
    <div id="stick" class="stk"><div class="nub"></div></div>
    <div id="bAtk"  class="tbtn bA">攻</div>
    <div id="bGrab" class="tbtn bGr">掴</div>
    <div id="bJmp"  class="tbtn bJ">跳</div>
    <div id="bGrd"  class="tbtn bD">回避</div>
    <div id="stick2" class="stk p2"><div class="nub"></div></div>
    <div id="bAtk2"  class="tbtn bA p2">攻</div>
    <div id="bGrab2" class="tbtn bGr p2">掴</div>
    <div id="bJmp2"  class="tbtn bJ p2">跳</div>
    <div id="bGrd2"  class="tbtn bD p2">回避</div>
  </div>
</div>

<script>
"use strict";
//======================================================================
//  聖犬士イッヌ  -  belt-scroll beat 'em up  (enhanced edition)
//  - procedural BGM (battle / boss / jingles)
//  - higher-fidelity shaded rendering
//  - 4-hit combo + charge + command moves (dash slash / rising slash)
//======================================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;                    // logical resolution

// hi-dpi crisp backing store
let DPR = Math.min(window.devicePixelRatio||1, 3);
function setupCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 3);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
setupCanvas();

const GROUND_TOP = 372, GROUND_BOT = 516, WORLD_END = 18400;
const LANE = 488, FIXED_SCALE = 1.82;     // single-plane brawler — larger sprites
const CEIL_Z = 408;                        // ceiling height (juggle bounces off the top of the screen)

let state='title', camX=0, score=0, coins=0;
let shake=0, hitStop=0, flash=0, bossIntro=0, goArrow=0, gf=0, quake=0; // gf = global frame
let slowmo=0, slowAcc=0, stage=1, stageBanner=0, stageBannerTxt='', shopPending=0;
let cut=null, cutAdvance=false, cutSkip=false, endingDone=false;   // cutscene state
function triggerSlow(n){ slowmo=Math.max(slowmo,n); }

//======================================================================
//  Input  (per-player; globals point to the player currently being simulated)
//======================================================================
let keys, K, pressed, dirTaps, cardSeq, stickRot;
function makeInput(){ return { keys:{},
  K:{left:false,right:false,up:false,down:false,atk:false,grd:false,grab:false},
  pressed:{atk:false,grab:false,up:false,jump:false,grd:false}, dirTaps:[], cardSeq:[], stickRot:-999 }; }
function useInput(inp){ keys=inp.keys; K=inp.K; pressed=inp.pressed; dirTaps=inp.dirTaps; cardSeq=inp.cardSeq; stickRot=inp.stickRot; }
function saveInput(inp){ inp.stickRot=stickRot; }
// key bindings per player (1P: arrows + JKL/space, 2P: WASD + F G H V)
const KEYMAP=[
  { left:['ArrowLeft'], right:['ArrowRight'], up:['ArrowUp'], down:['ArrowDown'],
    atk:['KeyJ','KeyZ'], grd:['KeyK','KeyX'], grab:['KeyL','KeyU','ShiftLeft','ShiftRight'], jump:['Space','KeyI'] },
  { left:['KeyA'], right:['KeyD'], up:['KeyW'], down:['KeyS'],
    atk:['KeyF'], grd:['KeyG'], grab:['KeyH'], jump:['KeyV','KeyB'] },
];
const CODE2PA={}; KEYMAP.forEach((m,pi)=>{ for(const act in m) m[act].forEach(c=>CODE2PA[c]=[pi,act]); });
function mapKeysFor(pi){ const m=KEYMAP[pi], inp=players[pi].in, k=inp.keys, KK=inp.K;
  KK.left=m.left.some(c=>k[c])||k['_l'];
  KK.right=m.right.some(c=>k[c])||k['_r'];
  KK.up=m.up.some(c=>k[c])||k['_u']||k['_up'];
  KK.down=m.down.some(c=>k[c])||k['_d'];
  KK.atk=m.atk.some(c=>k[c])||k['_atk'];
  KK.grd=m.grd.some(c=>k[c])||k['_grd'];
  KK.grab=m.grab.some(c=>k[c])||k['_grab'];
}
function pushTapFor(inp,d){ inp.dirTaps.push({d,f:gf}); if(inp.dirTaps.length>6) inp.dirTaps.shift(); }
function pushCardFor(inp,c){ const L=inp.cardSeq[inp.cardSeq.length-1]; if(L&&L.c===c){ L.f=gf; return; } inp.cardSeq.push({c,f:gf}); if(inp.cardSeq.length>8)inp.cardSeq.shift(); }
addEventListener('keydown',e=>{
  if(state==='cut'){ if(e.code==='Escape'||e.code==='KeyK') cutSkip=true; else cutAdvance=true; e.preventDefault(); return; }
  if(e.code==='KeyP'&&(state==='play'||state==='pause')){ togglePause(); return; }
  const pa=CODE2PA[e.code]; if(!pa) return; const [pi,act]=pa; const inp=players[pi].in;
  if(!inp.keys[e.code]){ inp.keys[e.code]=true; mapKeysFor(pi);
    if(act==='atk') inp.pressed.atk=true; if(act==='grab') inp.pressed.grab=true; if(act==='jump') inp.pressed.jump=true; if(act==='grd') inp.pressed.grd=true;
    if(act==='up') pushCardFor(inp,0); else if(act==='right'){ pushTapFor(inp,1); pushCardFor(inp,1); }
    else if(act==='down') pushCardFor(inp,2); else if(act==='left'){ pushTapFor(inp,-1); pushCardFor(inp,3); }
  }
  e.preventDefault();
});
addEventListener('keyup',e=>{ const pa=CODE2PA[e.code]; if(!pa) return; const [pi]=pa; players[pi].in.keys[e.code]=false; mapKeysFor(pi); });
// command detection (operate on the active player's globals)
function stingerReady(facing){ const want=facing>0?1:3, back=facing>0?3:1;
  const r=cardSeq.filter(t=>gf-t.f<=18);
  for(let i=r.length-1;i>=1;i--){ if(r[i].c===want && gf-r[i].f<=10){ for(let j=i-1;j>=0;j--){ if(r[j].c===back) return true; } } }
  return false; }
function rotationReady(){ if(gf-stickRot<=12) return true;
  const r=cardSeq.filter(t=>gf-t.f<=44); if(r.length<4) return false;
  for(let i=r.length-1;i>=3;i--){ const a=r[i-3].c,b=r[i-2].c,c=r[i-1].c,d=r[i].c;
    const cw=(b===(a+1)%4)&&(c===(b+1)%4)&&(d===(c+1)%4);
    const ccw=(b===(a+3)%4)&&(c===(b+3)%4)&&(d===(c+3)%4);
    if(cw||ccw) return true; }
  return false; }
function consumeCmd(){ cardSeq.length=0; dirTaps.length=0; stickRot=-999; }

//======================================================================
//  AUDIO  -  procedural SFX + BGM engine
//======================================================================
let actx=null, sndOn=true, masterGain=null, musicGain=null, sfxGain=null, noiseBuf=null;
function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=actx.createGain(); masterGain.gain.value=0.95;
  // master bus compressor — glue + loudness so impacts punch hard without nasty clipping
  const comp=actx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=4; comp.attack.value=0.002; comp.release.value=0.16;
  masterGain.connect(comp); comp.connect(actx.destination);
  musicGain=actx.createGain(); musicGain.gain.value=0.5; musicGain.connect(masterGain);
  sfxGain=actx.createGain(); sfxGain.gain.value=1.0; sfxGain.connect(masterGain);
  // spacious reverb send for the orchestral BGM (feedback-delay "hall")
  const verb=actx.createGain(); verb.gain.value=0.42;
  const dl=actx.createDelay(0.6); dl.delayTime.value=0.16;
  const fb=actx.createGain(); fb.gain.value=0.4;
  const damp=actx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2600;
  musicGain.connect(verb); verb.connect(dl); dl.connect(damp); damp.connect(fb); fb.connect(dl); damp.connect(masterGain);
  // noise buffer for drums/impacts
  noiseBuf=actx.createBuffer(1, actx.sampleRate*0.4, actx.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
// iOS/Safari need the context resumed AND a sound started *synchronously* inside a user gesture.
function unlockAudio(){
  try{ initAudio(); }catch(e){ return; }
  if(!actx) return;
  if(actx.state!=='running'){ const r=actx.resume&&actx.resume(); if(r&&r.then)r.catch(()=>{}); }
  try{ const b=actx.createBufferSource(); b.buffer=actx.createBuffer(1,1,22050); b.connect(actx.destination); b.start(0); }catch(e){}
  if(sndOn && state==='play' && !Music.isPlaying()) Music.start('battle');
}
['touchstart','touchend','pointerdown','mousedown','keydown','click'].forEach(ev=>
  addEventListener(ev, unlockAudio, {passive:true}));
const midi=n=>440*Math.pow(2,(n-69)/12);
function tone(freq,dur,type='square',vol=.15,slide=0,dest=null){
  if(!actx||!sndOn) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),actx.currentTime+dur);
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(); o.stop(actx.currentTime+dur);
}
function noise(dur,vol,hp,dest){
  if(!actx||!sndOn) return;
  const s=actx.createBufferSource(); s.buffer=noiseBuf;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  const f=actx.createBiquadFilter(); f.type=hp?'highpass':'lowpass'; f.frequency.value=hp||1200;
  s.connect(f); f.connect(g); g.connect(dest||sfxGain); s.start(); s.stop(actx.currentTime+dur);
}
const sfx={
  swing:(p=0)=>tone(560-p*40,.09,'square',.09,-260),
  heavy:()=>{tone(300,.16,'sawtooth',.12,-180); noise(.12,.18,2000);},
  hit:()=>{tone(170,.10,'square',.15,-90); noise(.09,.22,1800);},
  big:()=>{tone(110,.22,'sawtooth',.2,-60); noise(.2,.3,800);},
  guard:()=>{tone(760,.06,'square',.1); noise(.05,.12,4000);},
  hurt:()=>tone(200,.18,'sawtooth',.13,-120),
  dash:()=>{tone(320,.14,'square',.1,300); noise(.14,.14,2600);},
  rise:()=>{tone(420,.22,'square',.11,520);},
  charge:()=>tone(180,.5,'sawtooth',.05,400,sfxGain),
  ko:()=>{tone(120,.3,'sawtooth',.16,-80); noise(.3,.2,1200);},
  boss:()=>tone(70,.6,'sawtooth',.22,40),
  twinkle:()=>{ tone(1568,.10,'triangle',.12,200); setTimeout(()=>tone(2093,.16,'triangle',.10,300),60); setTimeout(()=>tone(2637,.22,'sine',.08,-200),120); },  // 星になって消える「キラーン☆」
};
// ---- 命中音 = 派手な「バキーン！」（金属クラング＋鳴り）＋「ドカーン！」（爆発ブーム）----
function hitSound(dmg){
  if(!actx||!sndOn) return;
  const t=actx.currentTime, tier=dmg>=30?3:dmg>=18?2:dmg>=10?1:0, V=0.7+tier*0.22;
  // ── バ：弾けるアタック・クラック ──
  { const s=actx.createBufferSource(); s.buffer=noiseBuf; const g=actx.createGain();
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.7;
    g.gain.setValueAtTime(V*1.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    s.connect(bp); bp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+0.08); }
  // ── キーン：明るい金属クラング（倍音を少しデチューンして煌めく鳴り）──
  const parts=[1320,1980,2640,3560,4900,6600,8800], pv=[1,0.82,0.68,0.55,0.42,0.3,0.2];
  parts.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
    o.type=i<3?'triangle':'sawtooth'; const det=1+(i%2?0.006:-0.005);
    o.frequency.setValueAtTime(f*det,t); o.frequency.exponentialRampToValueAtTime(f*0.93,t+0.34+tier*0.05);
    g.gain.setValueAtTime(V*0.34*pv[i],t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.34+tier*0.12);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.5); });
  // ── ン：きらめく上昇スイープ（シャキーンの閃き）──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(2600+tier*500,t); o.frequency.exponentialRampToValueAtTime(9000+tier*1500,t+0.12);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(V*0.34,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=6000; bp.Q.value=1.1; o.connect(bp); bp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.24); }
  // ── ド：パンチの効いた中域ボディ ──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.setValueAtTime(180-tier*24,t); o.frequency.exponentialRampToValueAtTime(54-tier*6,t+0.1);
    g.gain.setValueAtTime(V*0.66,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22+tier*0.05);
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500; o.connect(lp); lp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.34); }
  // ── カーン／ドカーン：深く長い爆発サブ・ブーム ──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime([86,72,58,46][tier],t); o.frequency.exponentialRampToValueAtTime([42,34,27,21][tier],t+0.4);
    g.gain.setValueAtTime(V*0.95,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55+tier*0.16);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.8); }
  // ── 強打（tier2以上）には轟くノイズ爆発を追加：ドッカーン！──
  if(tier>=2){ const s=actx.createBufferSource(); s.buffer=noiseBuf; const g=actx.createGain();
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(1400,t); lp.frequency.exponentialRampToValueAtTime(300,t+0.4);
    g.gain.setValueAtTime(V*0.7,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45+tier*0.1);
    s.connect(lp); lp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+0.6); }

// ---- BGM: generative orchestral / classical (strings + harp + horns + timpani) ----
const Music=(()=>{
  let playing=false, mode='battle', step=0, nextT=0, timer=null;
  const BPM=128, spb=60/BPM, stepDur=spb/2;          // up-tempo heroic; 8 eighth-steps per bar
  const SONG={
    // noble minor cadences [root,3rd,5th] + flowing 16-beat melody (one per beat)
    battle:{ chords:[[57,60,64],[53,57,60],[55,59,62],[52,55,59]],
             mel:[64,69,72,71, 69,72,69,65, 71,74,71,67, 64,67,71,76], padType:'sawtooth', leadType:'triangle' }, // Am F G Em
    boss:{   chords:[[50,53,57],[46,50,53],[43,46,50],[45,49,52]],
             mel:[69,74,77,76, 74,77,74,70, 70,74,70,67, 69,73,76,81], padType:'sawtooth', leadType:'square'   }, // Dm Bb Gm A
    town:{   chords:[[60,64,67],[57,60,64],[62,65,69],[55,59,62]],
             mel:[72,76,79,76, 71,74,71,69, 74,77,81,79, 67,71,74,72], padType:'triangle', leadType:'sine'      }, // C Am Dm G — 落ち着いた宿屋/酒場
  };
  function voice(f,t,dur,type,vol,atk,cut){ const o=actx.createOscillator(),g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+atk);
    g.gain.setValueAtTime(vol,t+Math.max(atk,dur*0.5)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let node=o; if(cut){ const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cut; o.connect(lp); node=lp; }
    node.connect(g); g.connect(musicGain); o.start(t); o.stop(t+dur+0.05); }
  function strings(n,t,dur,type){ voice(midi(n),t,dur,type,0.045,0.12,1900); voice(midi(n)*1.004,t,dur,type,0.03,0.14,1700); }
  function timp(t,root,vel){ vel=vel||1; const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(midi(root-24),t); o.frequency.exponentialRampToValueAtTime(midi(root-24)*0.7,t+0.14);
    g.gain.setValueAtTime(0.22*vel,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.34);
    const s=actx.createBufferSource(); s.buffer=noiseBuf; const ng=actx.createGain(); ng.gain.setValueAtTime(0.05*vel,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=460; s.connect(f);f.connect(ng); ng.connect(musicGain); s.start(t); s.stop(t+0.1); }
  const ARP=[0,1,2,1,0,2,1,2];
  function scheduleStep(s){
    if(!actx||!sndOn) return;
    const song=SONG[mode], bar=Math.floor(s/8)%4, st=s%8, t=nextT, ch=song.chords[bar], root=ch[0];
    if(st===0){ ch.forEach(n=>strings(n+12,t,stepDur*8*0.95,song.padType)); }               // sustained string pad
    if(st%2===0){ const bn=(st===0||st===4)? root-12 : ch[2]-12;                              // driving march bass
      voice(midi(bn),t,stepDur*1.5,'sawtooth',0.16,0.008,760); timp(t,root, st%4===0?1:0.6); }
    if(st%2===0){ const m=song.mel[(bar*4+(st>>1))%song.mel.length];                          // flowing quarter-note melody
      voice(midi(m),t,stepDur*1.9,song.leadType,0.085,0.015,3500); voice(midi(m-12),t,stepDur*1.9,'triangle',0.035,0.02,2200); }
    const an=ch[ARP[st]]+(st>=4?12:0); voice(midi(an+12),t,stepDur*1.15,'triangle',0.04,0.004,4600); // fast harp arpeggio
  }
  function tick(){ if(!playing||!actx) return;
    while(nextT < actx.currentTime+0.4){ scheduleStep(step); step=(step+1)%32; nextT+=stepDur; } }
  return {
    start(m){ if(!actx) return; mode=m||'battle'; if(playing){return;} playing=true; step=0;
      nextT=actx.currentTime+0.1; clearInterval(timer); timer=setInterval(tick,60); },
    setMode(m){ if(mode!==m){ mode=m; } },
    stop(){ playing=false; clearInterval(timer); },
    isPlaying(){ return playing; }
  };
})();

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
function depthScale(y){ return FIXED_SCALE; } // depth removed — uniform sprite size on a single lane
// マリオ風の地面の起伏。worldX に応じて足元の高さ(描画上)を上下させる（0=平地, 正=高い丘）
function groundLift(x){ const a=Math.sin(x*0.0090)+Math.sin(x*0.0041+2.1)*0.7+Math.sin(x*0.020+0.6)*0.32; return Math.max(0,a)*30; }
// 谷（落ちると即死）。各ステージの道中（戦闘ゲートの間）に配置
const PITS=[[1080,1210],[2400,2520],[4250,4380],[6060,6190],[8250,8380],[10240,10370],[11480,11610],[12620,12740],[13820,13940],[15020,15140],[16220,16340]];
function overPit(x){ for(const p of PITS){ if(x>p[0] && x<p[1]) return true; } return false; }
function radGrad(x,y,r,inner,outer){ const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r);
  g.addColorStop(0,inner); g.addColorStop(1,outer); return g; }

//======================================================================
//  Particles  (sparks, slash crescents, dust, floating text)
//======================================================================
let particles=[];
function spark(x,y,color,n=8,spd=6){
  for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), s=rnd(2,spd);
    particles.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(14,28),max:28,color,star:Math.random()<.5}); }
}
function dust(x,y,n=4){ for(let i=0;i<n;i++) particles.push({k:'dust',x,y,vx:rnd(-1.5,1.5),vy:rnd(-.4,-1.6),life:rnd(18,30),max:30}); }
function crescent(x,y,r,a0,a1,color){ particles.push({k:'arc',x,y,r,a0,a1,color,life:10,max:10}); }
function popText(x,y,txt,color,big){ particles.push({k:'txt',x,y,txt,color,big,life:46,max:46,vy:-1.3}); }
function ring(x,y,color){ particles.push({k:'ring',x,y,r:6,life:16,max:16,color}); }
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life--;
    if(p.k==='spark'){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.24;p.vx*=0.94; }
    else if(p.k==='dust'){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.04; }
    else if(p.k==='txt'){ p.y+=p.vy; p.vy*=0.92; }
    else if(p.k==='ring'){ p.r+=2.4; }
    else if(p.k==='twinkle'){ p.rot=(p.rot||0)+0.18; }
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{ const sx=p.x-camX, a=p.life/p.max;
    if(p.k==='txt'){ ctx.globalAlpha=clamp(a*1.4,0,1); ctx.font=`bold ${p.big?30:21}px Trebuchet MS`; ctx.textAlign='center';
      ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText(p.txt,sx,p.y); ctx.fillStyle=p.color; ctx.fillText(p.txt,sx,p.y); ctx.textAlign='left'; }
    else if(p.k==='arc'){ ctx.globalAlpha=a*0.85; ctx.strokeStyle=p.color; ctx.lineWidth=8*a+3; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(sx,p.y,p.r,p.a0,p.a1); ctx.stroke(); }
    else if(p.k==='ring'){ ctx.globalAlpha=a*0.6; ctx.strokeStyle=p.color; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,p.y,p.r,0,7); ctx.stroke(); }
    else if(p.k==='dust'){ ctx.globalAlpha=a*0.5; ctx.fillStyle='#cabfa6'; ctx.beginPath(); ctx.arc(sx,p.y,3*a+1,0,7); ctx.fill(); }
    else if(p.k==='twinkle'){ const gr=Math.sin((1-a)*Math.PI); const R=p.r*(0.5+gr); ctx.save(); ctx.translate(sx,p.y); ctx.rotate(p.rot||0);
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=clamp(a*1.3,0,1);
      ctx.fillStyle=radGrad(0,0,R*1.6,'rgba(255,255,255,.9)','rgba(255,225,90,0)'); ctx.beginPath(); ctx.arc(0,0,R*1.6,0,7); ctx.fill();
      drawStar(0,0,R*0.4,R,'#fff'); drawStar(0,0,R*0.22,R*0.6,'#ffe14d');
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2; for(let s=0;s<4;s++){ const an=p.rot+s*PI2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(an)*R*1.9,Math.sin(an)*R*1.9); ctx.stroke(); }
      ctx.restore(); }
    else { ctx.globalAlpha=a; if(p.star){ drawStar(sx,p.y,3,7,p.color); } else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,p.y,3*a+1,0,7); ctx.fill(); } }
  });
  ctx.globalAlpha=1;
}
function drawStar(x,y,r1,r2,color){ ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?r1:r2, a=Math.PI/5*i-Math.PI/2; ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r); }
  ctx.closePath(); ctx.fill(); }

function damageEnemy(e,dmg,kbx,knockdown,launch){
  const T=ETYPE[e.type];
  if(T.bossKind==='ghost' && e.vanish>10){ spark(e.x,e.y-e.h*0.5,'#bfe9ff',5,5); popText(e.x,e.y-e.h-6,'すりぬけ','#bfe9ff'); return; }  // 透明中はすり抜け
  if(e.sub){ spark(e.x,e.y,'#9fbfe0',5,5); return; }   // 陸鮫：地中は無敵
  if(e.transform>0){ spark(e.x,e.y-e.h*0.5,'#c46bff',5,6); return; }   // 形態進化中は無敵
  if(T.boss){ knockdown=false; launch=0; }                 // bosses have hyper-armor (no juggle/knockdown)
  if(!T.boss && (e.state==='down'||e.z>4)) knockdown=true;
  e.hitFace=12;   // 被弾時のやられ顔タイマー（全エネミー共通）
  e.hp-=dmg; if(!T.boss){ e.facing=kbx>0?-1:1; e.vx=kbx*1.3; } else { e.vx+=kbx*0.18; }
  spark(e.x,e.y-e.h*0.5,'#ffe14d', knockdown?13:7, knockdown?8:6);
  if(launch){ e.vz=-launch; e.state='air'; }
  addCombo();
  // hit-stop on every connect — bigger hits freeze longer (punchy, Smash-like)
  hitStop=Math.max(hitStop, dmg>=22?9:(dmg>=12?4:2));
  hitSound(dmg);                                           // layered weighty/crisp impact SE
  if(dmg>=22){ triggerSlow(22); flash=Math.max(flash,3); }   // 大技ヒットでスロー
  else if(dmg>=20){ flash=Math.max(flash,3); }
  popText(e.x,e.y-e.h-6,Math.round(dmg), knockdown?'#ff6a3c':'#ffe14d', dmg>=20);
  // スライム：攻撃のたびに小スライムへ分裂（合計5体まで）
  if(T.slimey && e.hp>0){ const n=enemies.filter(x=>!x.dead&&(x.type==='slime'||x.type==='slimelet')).length;
    if(n<5 && Math.random()<0.6){ spawnEnemy('slimelet', clamp(e.x+rnd(-44,44),camX+30,camX+W-30), LANE); const ne=enemies[enemies.length-1]; ne.vz=-7; ne.state='air'; ne.bounces=1; ne.invuln=0; popText(e.x,e.y-e.h-2,'分裂！','#7dff5a'); sfx.swing(0); } }
  if(e.hp<=0){ killEnemy(e); return; }
  if(launch){ /* stays air */ }
  else if(knockdown){ e.state='down'; e.downTimer=48; }
  else if(T.boss){ if(e.state==='walk'){ e.state='hurt'; e.hurtTimer=7; } e.stun=Math.min((e.stun||0)+3,9); }
  else { e.state='hurt'; e.hurtTimer=16; e.stun=18; }
}
// strong launch into the juggle (to screen edge / ceiling). vz<0 = up. Bosses resist.
function launchEnemy(e,vx,vz,bounces){ const T=ETYPE[e.type]; if(e.dead) return;
  if(T.boss){ e.vx+=vx*0.12; return; }                     // bosses: only slight push (hyper-armor)
  if(!T.mini && Math.abs(vz)>=11 && Math.abs(vx)>=12 && Math.random()<0.16){ startBlastoff(e, vx>0?1:-1); return; }  // 一定確率：吹っ飛びが星KOに
  e.state='air'; e.vx=vx; e.vz=vz; e.z=Math.max(e.z,2); e.bounces=(bounces==null?3:bounces);
  e.facing = vx>0?-1:1; }
// 吹っ飛ばし命中時、一定確率で画面外へ飛び去り星になって消える（スマブラ風スターKO）
function startBlastoff(e,dir){ const T=ETYPE[e.type];
  e.state='blastoff'; e.grabbedBy=0; e.bo=0; e.spin=0; e.vx=dir*Math.max(17,Math.abs(e.vx||0)); e.boVz=11.5; e.z=Math.max(e.z,12); e.facing=dir>0?-1:1;

function killEnemy(e){ const T=ETYPE[e.type];
  if(T.evolveTo){ evolveBoss(e,T); return; }               // 多段ボス：倒すと次形態へ進化
  e.dead=true; e.deadTimer=T.boss?70:44; e.state='down'; e.downTimer=44; e.vx*=1.5;

// ラスボスの形態進化（フリーザ風）：第1→第2(異形巨大狼)→第3(暗黒剣士)
function evolveBoss(e,T){ const nt=T.evolveTo, N=ETYPE[nt];

function bomberBoom(e){ ring(e.x,e.y-e.h*0.4,'#ff4d3a'); ring(e.x,e.y-e.h*0.4,'#fff'); spark(e.x,e.y-e.h*0.4,'#ffae42',26,12); dust(e.x,e.y,12);

let items=[];
function makeItem(x,kind){ items.push({x,kind,z:46,vz:-3,vx:rnd(-1,1),life:680,bob:Math.random()*6}); }
function makeCoin(x,val){ items.push({x,kind:'coin',val:val||1,z:rnd(40,70),vz:rnd(-4,-2),vx:rnd(-2.2,2.2),life:900,bob:Math.random()*6,spin:Math.random()*6}); }
function coinDrop(e,T){ const n=T.boss?(T.finalBoss?30:14):(T.mini?7:(T.charge||T.guarder?3:2)); const v=T.boss?5:1;
  for(let i=0;i<n;i++) makeCoin(e.x+rnd(-22,22), v); }
function weaponDropKind(){ // 出場キャラに合わせて武器ドロップを選ぶ（イッヌ=槍/ハンマー、シマ=ヌンチャク/トンファー）
  const pool=[];
  if(players.some(p=>p.active && p.kind!=='shima')) pool.push('spear','hammer');
  if(players.some(p=>p.active && p.kind==='shima')) pool.push('nunchaku','tonfa');
  if(!pool.length) pool.push('spear','hammer');
  return pool[Math.floor(Math.random()*pool.length)];
}
function dropFromEnemy(e,T){
  if(T.boss){ makeItem(e.x-26,'hp'); makeItem(e.x+26, weaponDropKind()); return; }  // ボスは確定ドロップ
  if(T.mini){ makeItem(e.x, Math.random()<0.5?'hp':weaponDropKind()); return; }
  const r=Math.random();
  if(r<0.11) makeItem(e.x,'hp');
  else if(r<0.23) makeItem(e.x,weaponDropKind());
  else if(r<0.27) makeItem(e.x,'costume');   // お着替えアイテム（見た目が豪華に）
}
function giveWeapon(p,kind){ p.weapon=kind; p.weaponT=1100;
  popText(p.x,p.y-110,WEAPONS[kind].name+'を装備！',WEAPONS[kind].col,true); ring(p.x,p.y-40,WEAPONS[kind].col); spark(p.x,p.y-40,WEAPONS[kind].col,14,8); sfx.rise(); }
function canPick(p,kind){ // 拾える武器はキャラごとに異なる
  if(kind==='coin') return false;   // コインは専用処理（吸い寄せ）で取得するのでここでは拾わない
  if(kind==='hp'||kind==='costume') return true;
  if(p.kind==='shima') return kind==='nunchaku'||kind==='tonfa';   // シマ＝拳法武器のみ
  return kind==='spear'||kind==='hammer'||kind==='dagger';          // イッヌ＝剣系のみ
}
function pickerFor(it){ // nearest eligible player on the ground
  let best=null,bd=1e9; for(const p of players){ if(!p.active||p.state==='down'||p.state==='dead')continue;
    if(Math.abs(p.x-it.x)<46 && p.z<70 && it.z<24){
      if(!canPick(p,it.kind)) continue;
      const d=Math.abs(p.x-it.x); if(d<bd){bd=d;best=p;} } }
  return best;
}
function updateItems(){
  for(let i=items.length-1;i>=0;i--){ const it=items[i]; it.life--; it.bob+=0.12; if(it.spin!=null)it.spin+=0.3;
    if(it.z>0||it.vz<0){ it.z=Math.max(0,it.z-it.vz); it.vz+=0.7; it.x+=it.vx; it.vx*=0.9; if(it.z<=0){ it.z=0; it.vz=0; } }
    if(it.kind==='coin'){ const tp=nearestPlayerTo(it.x); if(tp&&tp.active&&Math.abs(tp.x-it.x)<90 && it.z<24){ it.x+=Math.sign(tp.x-it.x)*4.2; }   // コインは近づくと吸い寄せ
      if(tp&&tp.active&&Math.abs(tp.x-it.x)<30 && tp.state!=='dead'){ coins+=it.val; popText(it.x,it.y-50,'+'+it.val+'¢','#ffe14d'); sfx.guard(); items.splice(i,1); continue; } }
    const p=pickerFor(it);
    if(p){ if(it.kind==='hp'){ p.hp=Math.min(p.maxHp, p.hp+40); popText(p.x,p.y-110,'+40','#7dff5a',true); ring(p.x,p.y-40,'#7dff5a'); spark(p.x,p.y-40,'#7dff5a',12,7); sfx.guard(); }
      else if(it.kind==='costume'){ p.costume=true; p.hp=Math.min(p.maxHp,p.hp+20); popText(p.x,p.y-112,(p.kind==='shima'?'豪華武闘服！':'豪華な鎧！'),'#ffe14d',true); ring(p.x,p.y-40,'#ffe14d'); ring(p.x,p.y-40,'#fff'); spark(p.x,p.y-40,'#ffe14d',18,9); sfx.rise(); }
      else giveWeapon(p,it.kind);
      items.splice(i,1); continue;
    }
    if(it.life<=0) items.splice(i,1);
  }
}

function updateEnemies(){

      if(e.z>=CEIL_Z && e.vz<0){ e.z=CEIL_Z; e.vz=-e.vz*0.9; e.vx*=0.96; if((e.bounces||0)>0)e.bounces--; spark(e.x,e.y-e.z,'#fff',14,9); ring(e.x,e.y-e.z,'#ffd24d'); shake=Math.max(shake,5); sfx.hit(); popText(e.x,e.y-e.z-10,'天井!','#ffd24d'); }

    // 跳躍犬: 中距離から飛びかかる
    if(t.pouncer && dist>120 && dist<360 && e.thinkCd<=0 && e.stun<=0){ e.state='crouch'; e.crouchT=18; e.thinkCd=rnd(90,150); continue; }
    // 盾犬兵: プレイヤーの攻撃を察知して構える
    if(t.guarder && dist<t.atkR+72 && e.guardCd<=0 && e.stun<=0 && (p.state==='attack'||Math.random()<0.02)){ e.state='guard'; e.guardT=rnd(36,72); e.guardCd=rnd(90,150); continue; }
    const spd=t.sp*1.35*(0.8+0.34*Math.sin(e.bob*1.3));        // faster to match player; pulsed
    if(dist>t.atkR-6){ e.x+=Math.sign(dx)*spd; }

}
// Shared melee resolver: front-arc check + guard/parry + slide/i-frame dodge. reach<0 = AoE (no facing check).
function hitOnePlayer(p,e,dmg,knock,reach,hh,unblock){
  if(!p.active||p.state==='down'||p.state==='dead'||p.state==='wheel'||p.invuln>0||p.state==='slide'||p.z>14) return false;
  if(Math.abs(p.y-e.y)>(hh||34)) return false;
  const dx=p.x-e.x;
  if(reach>=0){ if(Math.sign(dx)!==e.facing&&Math.abs(dx)>10) return false; if(Math.abs(dx)>reach) return false; }
  else if(Math.abs(dx)>-reach) return false;                   // AoE radius = -reach
  const fromFront = Math.sign(dx)===-p.facing;
  if(p.state==='guard' && fromFront){
    if(gf-p.guardStart<=9){ doParry(e,p); return true; }        // just-time guard → PARRY（ガー不もパリィなら防げる）
    if(!unblock){ sfx.guard(); spark(p.x+p.facing*24,p.y-46,'#9fd6ff',8); p.vx=e.facing*1.8; shake=3; resetCombo(); p.guardFx=8; return true; }
    popText(p.x,p.y-70,'GUARD CRUSH!','#ff4d6a',true); flash=Math.max(flash,4);
  }
  hurtPlayer(p,dmg,e.facing,knock); return true;
}
// hit whichever player(s) are in range; returns true if any connected
function tryHitPlayer(e,dmg,knock,reach,hh,unblock){
  let hit=false;
  for(const p of players){ if(!p.active) continue; if(hitOnePlayer(p,e,dmg,knock,reach,hh,unblock)){ hit=true; if(reach>=0) break; } } // AoE(<0) hits both
  return hit;
}

function bossTick(e,t){ const p=nearestPlayerTo(e.x), dx=p.x-e.x, dist=Math.abs(dx), kind=t.bossKind;
  e.anim+=0.16; e.bob+=0.1; if(e.vanish>0)e.vanish--;
  if(e.transform>0){ e.transform--; e.state='walk'; e.vx=0; e.facing=dx<0?-1:1;   // 進化の演出中は無敵で咆哮
    if(gf%2===0) spark(e.x+rnd(-e.w*0.4,e.w*0.4), e.y-rnd(0,e.h), '#c46bff', 2, 7);
    if(e.transform===1) sfx.boss(); return; }
  if(e.moveCd>0)e.moveCd--; if(e.stun>0)e.stun--;
  // ── per-boss signature flavor ──
  if(kind==='moloch' && gf%4===0) spark(e.x+rnd(-26,26), e.y-e.h*rnd(0.3,0.95), '#ff9a3a', 2, 4);
  else if(kind==='garm'){ if(e.hp<e.maxHp*0.35){ if(!e.rage){ e.rage=true; popText(e.x,e.y-e.h-10,'ENRAGE!','#ff4d3c',true); } if(gf%5===0) spark(e.x,e.y-e.h*0.5,'#ff4d3c',2,4); } }
  else if(kind==='vesper' && e.state==='bmove' && (e.moveName==='dashThrust'||e.moveName==='tripleStep') && gf%2===0) spark(e.x,e.y-e.h*0.45,'#aef8ff',2,3);
  else if(kind==='gigas' && e.state==='walk' && Math.sin(e.anim*1.0)>0.92 && gf%6===0){ shake=Math.max(shake,3); dust(e.x,e.y,4); }
  // ── 呪い犬：一定時間ごとに呪化（攻撃力・速度UP＋自動追尾の焔）──
  if(kind==='noroinu'){ if(e.curseCd==null){ e.curseCd=rnd(160,240); }
    if(e.curseCd>0)e.curseCd--;
    if(!e.cursed && e.curseCd<=0){ e.cursed=true; e.curseT=320; popText(e.x,e.y-e.h-12,'呪化！','#c89cff',true); ring(e.x,e.y-e.h*0.5,'#b06bff'); ring(e.x,e.y-e.h*0.5,'#fff'); sfx.boss(); flash=Math.max(flash,2); }
    if(e.cursed){ e.curseT--; if(gf%3===0)spark(e.x+rnd(-30,30),e.y-e.h*rnd(0.3,1),'#c89cff',2,4);
      if(gf%52===0 && projectiles.filter(pr=>pr.homing).length<6){ spawnProj(e.x, e.y-e.h*0.5, e.facing*5, 0, {owner:'enemy',dmg:t.dmg-4,color:'#b06bff',r:12,life:200,zz:52,homing:true}); }   // 自動追尾の呪いの焔
      if(e.curseT<=0){ e.cursed=false; e.curseCd=rnd(220,320); popText(e.x,e.y-e.h-12,'呪化解除','#9a8fae'); } } }
  const rageMul=(e.rage?1.4:1)*(e.cursed?1.5:1);
  // 飛行ボスのホバリング高度（ドラゴン＝高め、幽霊＝低め）。divebomb中は手動制御
  if(t.flyer && !(e.state==='bmove'&&e.moveName==='divebomb')){ const hov=(kind==='dragon'?78:34)+Math.sin(e.bob)*6; e.z += (hov-e.z)*0.12; e.vz=0; }
  if(e.state!=='bmove') e.facing=dx<0?-1:1;
  if(e.state==='bwind'){ e.moveT--; e.telegraph=Math.max(e.moveT,0);
    if(e.moveT<=0){ e.state='bmove'; e.moveT=0; e.telegraph=0; startBossMove(e); } return; }
  if(e.state==='bmove'){ runBossMove(e); e.moveT++;
    if(e.moveT>=e.moveMax){ e.state='walk'; e.moveCd=rnd(26,62)*(e.rage?0.6:1)*(e.cursed?0.55:1); e.vx=0; e.danger=false; } return; }  // より攻撃的に
  // ---- walk: approach + spacing ----
  const wantR=t.atkR*0.85;
  if(dist>wantR+30) e.x+=Math.sign(dx)*t.sp*1.3*rageMul;
  else if(dist<wantR-40) e.x-=Math.sign(dx)*t.sp*0.8;
  e.y=LANE;
  if(e.moveCd<=0 && e.stun<=0){ const mv=pickBossMove(e,dist);
    if(mv){ e.moveName=mv; const cfg=MV[mv]; e.danger=!!cfg.danger; e.state='bwind'; e.moveT=cfg.tele; e.teleMax=cfg.tele; e.moveMax=cfg.dur;
      if(mv!=='roar')sfx.heavy(); } }
}

function loseLife(p){ if(!p)p=player; if(p.state==='dead')return; p.lives--; p.hp=0;

  p.respawnT=90; }

      const sx=side>0?camX+W+40+rnd(0,120):camX-40-rnd(0,120);
      spawnEnemy(type,clamp(sx,enc.at-260,enc.at+W*0.7),rnd(GROUND_TOP+20,GROUND_BOT-10)); off++; } });
    if(enc.boss){ const btype=(enc.list.find(([ty])=>ETYPE[ty].boss)||[])[0]; if(btype) startBossCut(btype, enc.st); else { sfx.boss(); Music.setMode('boss'); } }
    else if(enc.mini){ bossIntro=130; }
  }
  if(enc.spawned&&aliveCount()===0&&projectiles.filter(pr=>pr.owner==='enemy').length===0){ enc.cleared=true; encIndex++; curGateX=WORLD_END; goArrow=160; score+=300;
    if(enc.boss){
      if(enc.st<12){ stageBanner=160; stageBannerTxt='STAGE '+enc.st+' CLEAR!';
        player.hp=Math.min(player.maxHp, player.hp+45); player.dim=Math.min(player.dimMax,player.dim+1); score+=1500; Music.setMode('battle');
        shopPending=120; }
    } else if(encounters[encIndex]&&!encounters[encIndex].boss) Music.setMode('battle');
  }
}

const combo={count:0,timer:0};
function addCombo(){ combo.count++; combo.timer=100; if(combo.count>=10)score+=5;
  if(combo.count===30 && player.dim<player.dimMax){ player.dim++; popText(player.x,player.y-120,'奥義ストック +1','#d6a6ff',true); ring(player.x,player.y-46,'#c46bff'); } }
function resetCombo(){ combo.count=0; combo.timer=0; }
function updateCombo(){ if(combo.timer>0){ combo.timer--; if(combo.timer===0)combo.count=0; } }

//======================================================================
//  Projectiles  (boss 飛び道具 — ガード/スライド回避/パリィ反射に対応)
//======================================================================
// y = depth coordinate (like entities); zz = visual height above ground for draw/collision.
let projectiles=[];
function spawnProj(x,y,vx,vy,o){ o=o||{};
  projectiles.push({x,y,vx,vy,zz:(o.zz!=null?o.zz:56),vzz:o.vzz||0,explode:!!o.explode,
    pierce:!!o.pierce,wave:!!o.wave,hit:o.pierce?new Set():null,homing:!!o.homing,spike:!!o.spike,
    life:o.life||150,r:o.r||11,dmg:o.dmg||10,color:o.color||'#d46bff',owner:o.owner||'enemy',spin:Math.random()*6,trail:[]}); }
// returns 'reflect' | 'gone' | null
function projVsPlayer(pr,p){
  if(!p.active||p.state==='dead') return null;
  const near = Math.abs(p.x-pr.x)<pr.r+14 && Math.abs(p.y-pr.y)<30 && pr.zz<64 && pr.zz>-8;
  const overIt = p.z > pr.zz+18;
  if(!near||overIt) return null;
  const dir=pr.vx>0?1:-1, fromFront=Math.sign(pr.x-p.x)===-p.facing;
  if(p.state==='slide'||p.invuln>0) return null;          // dodged
  if(p.state==='guard' && fromFront){
    if(gf-p.guardStart<=9){ pr.owner='player'; pr.vx=-pr.vx*1.5||(-p.facing*9); pr.vy*=-0.5; pr.vzz=0; pr.dmg=Math.max(pr.dmg,18); pr.color='#bfe9ff';
      spark(p.x+p.facing*22,p.y-40,'#fff',16,9); ring(p.x+p.facing*20,p.y-40,'#bfe9ff'); sfx.guard(); sfx.rise(); hitStop=10; popText(p.x,p.y-70,'REFLECT!','#9ff0ff',true); return 'reflect'; }
    sfx.guard(); spark(p.x+p.facing*22,p.y-44,'#9fd6ff',8); p.vx=dir*1.6; shake=3; p.guardFx=8; resetCombo(); return 'gone';
  }
  hurtPlayer(p,pr.dmg,dir,true); spark(pr.x,pr.y-pr.zz,pr.color,12,8); return 'gone';
}
function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){ const pr=projectiles[i];
    if(pr.homing && pr.owner==='enemy'){ const tp=nearestPlayerTo(pr.x); if(tp){ const ang=Math.atan2((tp.y-26)-(pr.y-pr.zz),tp.x-pr.x); const cur=Math.atan2(pr.vy,pr.vx); let d=ang-cur; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; const na=cur+clamp(d,-0.10,0.10), sp=Math.hypot(pr.vx,pr.vy)||6; pr.vx=Math.cos(na)*sp; pr.vy=Math.sin(na)*sp; } }
    pr.x+=pr.vx; pr.y=clamp(pr.y+pr.vy,GROUND_TOP-4,GROUND_BOT+4); pr.zz+=pr.vzz; pr.life--; pr.spin+=0.4;
    pr.trail.push({x:pr.x,y:pr.y-pr.zz}); if(pr.trail.length>7)pr.trail.shift();
    if(pr.owner==='player'){
      // 下方向エネルギー弾：地面で爆発（範囲ダメージ）
      if(pr.explode && pr.zz<=2){ ring(pr.x,LANE,pr.color); ring(pr.x,LANE,'#fff'); spark(pr.x,LANE,pr.color,20,11); dust(pr.x,LANE,12); shake=Math.max(shake,7); flash=Math.max(flash,3); sfx.big();
        enemies.forEach(e=>{ if(e.dead||e.grabbedBy)return; if(Math.abs(e.x-pr.x)<90){ damageEnemy(e,pr.dmg+4,(e.x<pr.x?-1:1)*10,true); if(!e.dead)launchEnemy(e,(e.x<pr.x?-1:1)*14,-9,3); } });
        projectiles.splice(i,1); continue; }
      let hit=false;
      for(const e of enemies){ if(e.dead||e.grabbedBy)continue;
        if(pr.pierce && pr.hit.has(e.id))continue;
        if(Math.abs(e.x-pr.x)<e.w*0.5+pr.r && Math.abs(e.y-pr.y)<(pr.wave?44:30) && pr.zz<e.h){
          damageEnemy(e,pr.dmg,pr.vx>0?9:-9,true); if(pr.wave&&!e.dead)launchEnemy(e,(pr.vx>0?1:-1)*16,-8,3);
          spark(e.x,e.y-e.h*0.5,pr.color,12,8);
          if(pr.pierce){ pr.hit.add(e.id); } else { hit=true; break; } } }
      if(hit){ spark(pr.x,pr.y-pr.zz,pr.color,12,8); projectiles.splice(i,1); continue; }
    } else {
      let res=null; for(const p of players){ res=projVsPlayer(pr,p); if(res)break; }
      if(res==='reflect') continue;
      if(res==='gone'){ projectiles.splice(i,1); continue; }
    }
    if(pr.life<=0 || pr.x<camX-100 || pr.x>camX+W+100 || pr.zz<-30) projectiles.splice(i,1);
  }
}
function drawProjectiles(){
  projectiles.forEach(pr=>{ const sx=pr.x-camX, sy=pr.y-pr.zz;
    if(pr.wave){ const dir=pr.vx>0?1:-1; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(sx,pr.y);
      for(let k=0;k<3;k++){ ctx.globalAlpha=0.5-k*0.13; ctx.strokeStyle=pr.color; ctx.lineWidth=7-k*2;
        ctx.beginPath(); ctx.ellipse(-dir*k*9, -28, pr.r*0.7, pr.r*1.7, 0, -1.15, 1.15); ctx.stroke(); }
      ctx.globalAlpha=0.85; ctx.fillStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(dir*4,-28,pr.r*0.4,pr.r*1.5,0,-1.0,1.0); ctx.fill();
      ctx.restore(); return; }
    if(pr.spike){ const ang=Math.atan2(pr.vy,pr.vx); ctx.save(); ctx.translate(sx,sy); ctx.rotate(ang);
      ctx.fillStyle=pr.color; ctx.beginPath(); ctx.moveTo(pr.r+4,0); ctx.lineTo(-pr.r*0.5,pr.r*0.7); ctx.lineTo(-pr.r*0.5,-pr.r*0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(pr.r+4,0); ctx.lineTo(0,pr.r*0.28); ctx.lineTo(0,-pr.r*0.28); ctx.closePath(); ctx.fill(); ctx.restore(); return; }
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<pr.trail.length;i++){ const tp=pr.trail[i], a=i/pr.trail.length*0.4;
      ctx.globalAlpha=a; ctx.fillStyle=pr.color; ctx.beginPath(); ctx.arc(tp.x-camX,tp.y,pr.r*(0.5+i/pr.trail.length*0.5),0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.fillStyle=radGrad(sx,sy,pr.r*1.8,'#ffffff',pr.color); ctx.beginPath(); ctx.arc(sx,sy,pr.r*1.8,0,7); ctx.fill();
    ctx.fillStyle=pr.color; ctx.beginPath(); ctx.arc(sx,sy,pr.r,0,7); ctx.fill();
    ctx.fillStyle='#fff'; for(let k=0;k<4;k++){ const a=pr.spin+k*PI2; ctx.beginPath();
      ctx.arc(sx+Math.cos(a)*pr.r*0.5, sy+Math.sin(a)*pr.r*0.5, pr.r*0.28,0,7); ctx.fill(); }
    ctx.restore();
  });
}

//======================================================================
//  Camera
//======================================================================
function camFocusX(){ const ap=activePlayers().filter(p=>p.state!=='dead'); if(!ap.length) return players[0].x;
  let mn=1e9,mx=-1e9; ap.forEach(p=>{ mn=Math.min(mn,p.x); mx=Math.max(mx,p.x); }); return (mn+mx)/2; }
function updateCamera(){
  const target=clamp(camFocusX()-W*0.5,0,WORLD_END-W);
  const enc=encounters[encIndex];
  const maxC=(enc&&!enc.cleared&&enc.spawned)?clamp(enc.at-W*0.45,0,WORLD_END-W):WORLD_END-W;
  camX+=(Math.min(target,maxC)-camX)*0.12; camX=clamp(camX,0,WORLD_END-W);
  players.forEach(p=>{ if(p.active) p.x=clamp(p.x,camX+24,camX+W-24); });
}
function stepPlayers(){
  for(const pl of players){ if(!pl.active) continue;
    player=pl; useInput(pl.in);
    if(pl.state==='dead'){ pl.respawnT--; if(pl.respawnT<=0 && pl.lives>=0) resetPlayer(pl,false); }
    else { updatePlayer();
      if(pl.weaponT>0){ pl.weaponT--; if(pl.weaponT<=0){ const base=pl.kind==='shima'?'fists':'dagger'; if(pl.weapon!==base){ pl.weapon=base; popText(pl.x,pl.y-110, base==='fists'?'素手に戻った':'短剣に戻った','#cfd8e6'); } } } }
    saveInput(pl.in);
  }
  player=players[0];
}
function update(){
  gf++;
  if(hitStop>0){ hitStop--; if(state==='play'){updateParticles();updateProjectiles();} return; }
  if(state!=='play') return;
  stepPlayers(); updateEnemies(); updateProjectiles(); updateItems(); updateEncounters(); updateCamera(); updateCombo(); updateParticles();
  if(shake>0)shake-=0.7; if(quake>0)quake--; if(flash>0)flash--; if(bossIntro>0)bossIntro--; if(goArrow>0)goArrow--; if(stageBanner>0)stageBanner--;
  if(shopPending>0){ shopPending--; if(shopPending===0 && state==='play') enterShop(); }
}

//======================================================================
//  ============ RENDERING ============
//======================================================================
function render(){
  ctx.save();
  const _q=shake+(quake>0?Math.abs(Math.sin(gf*0.9))*quake*0.5:0);
  if(_q>0) ctx.translate(rnd(-_q,_q),rnd(-_q*0.6,_q*0.6));
  drawBackground(); drawGround();
  drawItems();
  const order=[...enemies.map(e=>({y:e.y,e}))];
  players.forEach(pl=>{ if(pl.active) order.push({y:pl.y+pl.pid*0.5, pl}); });
  order.sort((a,b)=>a.y-b.y);
  order.forEach(o=>{ if(o.pl){ player=o.pl;
      if(o.pl.state==='seven'){ const sx0=o.pl.x; ctx.save(); ctx.globalAlpha=0.32;   // 七体の分身残像
        for(let g=0;g<7;g++){ o.pl.x=clamp(camX+ (g+0.5)/7*W + Math.sin(gf*0.5+g)*16, camX+24, camX+W-24); drawPlayer(); }
        ctx.restore(); o.pl.x=sx0; }
      drawPlayer(); }
    else drawEnemy(o.e); });
  player=players[0];
  drawProjectiles();
  drawParticles();
  drawLighting();
  ctx.restore();
  if(flash>0){ ctx.fillStyle='rgba(255,90,80,'+(flash/12)+')'; ctx.fillRect(0,0,W,H); }
  drawHUD();
}

let amb=[];
function updateAmbient(T){
  if(amb.length<T.amb.max && Math.random()<T.amb.rate){
    amb.push({x:rnd(0,W), y:rnd(0,GROUND_TOP-10), vx:T.amb.wind+rnd(-0.3,0.3), vy:T.amb.vy*rnd(0.6,1.4),
      r:rnd(T.amb.r0,T.amb.r1), life:rnd(140,320), max:320, col:T.amb.color, sway:Math.random()*6}); }
  for(let i=amb.length-1;i>=0;i--){ const a=amb[i]; a.sway+=0.045; a.x+=a.vx+Math.sin(a.sway)*0.4; a.y+=a.vy;
    a.life--; if(a.life<=0||a.y<-20||a.y>GROUND_TOP+10||a.x<-30||a.x>W+30) amb.splice(i,1); }
}
function drawAmbient(T){ ctx.save(); if(T.amb.glow)ctx.globalCompositeOperation='lighter';
  amb.forEach(a=>{ ctx.globalAlpha=clamp(a.life/70,0,1)*T.amb.alpha; ctx.fillStyle=a.col;
    if(T.amb.shape==='petal'){ ctx.beginPath(); ctx.ellipse(a.x,a.y,a.r,a.r*0.5,a.sway,0,7); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill(); } });
  ctx.globalAlpha=1; ctx.restore(); }

// ---------- Background ----------
function drawBackground(){
  const T=curTheme(); const sk=T.sky;
  const sky=ctx.createLinearGradient(0,0,0,GROUND_TOP);
  sky.addColorStop(0,sk[0]); sky.addColorStop(.45,sk[1]); sky.addColorStop(.8,sk[2]); sky.addColorStop(1,sk[3]);
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,GROUND_TOP+30);
  // stars (night / 魔界)
  if(T.stars){ ctx.save(); for(let i=0;i<T.stars;i++){ const sxp=(i*137.5)%W, syp=(i*71.3)%(GROUND_TOP-60);
    const tw=0.4+0.6*Math.abs(Math.sin(gf*0.03+i)); ctx.globalAlpha=tw*0.9; ctx.fillStyle=i%7?'#dfe7ff':'#fff6c0';
    ctx.fillRect(sxp,syp,1.6,1.6); } ctx.globalAlpha=1; ctx.restore(); }
  // sun / moon glow + disc
  const cdx=W*T.sunX, cdy=T.sunY;
  const sun=ctx.createRadialGradient(cdx,cdy,10,cdx,cdy,300);
  sun.addColorStop(0,T.sun+'.9)'); sun.addColorStop(1,T.sun+'0)');
  ctx.fillStyle=sun; ctx.fillRect(0,0,W,GROUND_TOP);
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=T.sun+'.45)'; ctx.beginPath(); ctx.arc(cdx,cdy,T.stars?44:58,0,7); ctx.fill(); ctx.restore();
  ctx.fillStyle=T.stars?'#eef3ff':'#fff7dc'; ctx.beginPath(); ctx.arc(cdx,cdy,T.stars?34:40,0,7); ctx.fill();
  if(T.stars){ ctx.fillStyle='rgba(150,170,210,.45)'; ctx.beginPath(); ctx.arc(cdx-11,cdy-7,7,0,7); ctx.arc(cdx+12,cdy+9,5,0,7); ctx.arc(cdx+5,cdy-13,4,0,7); ctx.fill(); }
  // god rays
  ctx.save(); ctx.globalAlpha=T.rays; ctx.globalCompositeOperation='lighter';
  for(let i=0;i<8;i++){ ctx.fillStyle=T.sun+'1)'; ctx.beginPath(); ctx.moveTo(W*T.sunX,T.sunY);
    const a=-0.5+i*0.26; ctx.lineTo(W*T.sunX+Math.cos(a)*1000,T.sunY+Math.sin(a)*1000); ctx.lineTo(W*T.sunX+Math.cos(a+0.05)*1000,T.sunY+Math.sin(a+0.05)*1000); ctx.fill(); }
  ctx.restore();
  // clouds (skip for night/魔界)
  if(!T.stars){ const cl=-camX*0.12;
    for(let i=0;i<10;i++){ const x=((i*360+cl)%(W+460)+W+460)%(W+460)-230; cloud(x,56+(i*53%70),58+(i%2)*24); } }
  drawMountains();
  drawCastle((W*0.5)-camX*0.28,60);
  for(let i=0;i<12;i++){ const x=((i*250-camX*0.42)%(W+250)+W+250)%(W+250)-125; drawTower(x,158,46,150,T.tower,true); }
  ctx.fillStyle=T.haze; ctx.fillRect(0,150,W,GROUND_TOP-150);
  drawBuildings(stage>=2);
  drawLampRow();
  drawBraziers(T);
  if(state==='play') updateAmbient(T);
  drawAmbient(T);
  const fog=ctx.createLinearGradient(0,GROUND_TOP-26,0,GROUND_TOP+10); fog.addColorStop(0,'rgba(220,228,235,0)'); fog.addColorStop(1,T.fog);
  ctx.fillStyle=fog; ctx.fillRect(0,GROUND_TOP-26,W,36);
}
function drawMountains(){ const yb=GROUND_TOP-24;
  for(let layer=0;layer<2;layer++){ ctx.fillStyle=layer?'rgba(150,170,200,.6)':'rgba(108,132,164,.78)';
    const step=150+layer*60, off=((-(camX*(0.14+layer*0.05)))%step+step)%step;
    ctx.beginPath(); ctx.moveTo(-step,yb+40);
    for(let x=-step;x<W+step;x+=step){ const px=x-off, h=80+((Math.floor(x/step)*37+layer*53)%70)+layer*26;
      ctx.lineTo(px+step/2, yb-h); ctx.lineTo(px+step, yb); }
    ctx.lineTo(W+step,yb+40); ctx.closePath(); ctx.fill();

      for(let x=-step;x<W+step;x+=step){ const px=x-off2, h=80+((Math.floor(x/step)*37)%70);
        ctx.beginPath(); ctx.moveTo(px+step/2,yb-h); ctx.lineTo(px+step/2-12,yb-h+18); ctx.lineTo(px+step/2+12,yb-h+18); ctx.fill(); } }
  }
}
function drawLampRow(){ const par=0.84, step=520, off=((-(camX*par))%step+step)%step;

function drawLamp(x,baseY){

  ctx.fillStyle='#2e2820'; ctx.fillRect(x+13,baseY-150,16,16);
  const lg=radGrad(x+21,baseY-142,11,'rgba(255,228,150,.98)','rgba(255,180,60,.25)'); ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(x+21,baseY-142,8,0,7); ctx.fill();

  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255); return `rgb(${r|0},${g|0},${b|0})`; }

function drawGround(){
  const T=curTheme();
  const g=ctx.createLinearGradient(0,GROUND_TOP,0,H); g.addColorStop(0,T.g[0]); g.addColorStop(.5,T.g[1]); g.addColorStop(1,T.g[2]);
  ctx.fillStyle=g; ctx.fillRect(0,GROUND_TOP,W,H-GROUND_TOP);
  // individual cobblestones with perspective + shading
  for(let r=0;r<11;r++){ const y=GROUND_TOP+r*r*1.7+r*6; if(y>H)break;
    const sz=22+r*6, off=((-(camX)% sz)+sz)%sz + (r%2?sz/2:0);
    for(let x=-sz;x<W+sz;x+=sz){ const cxs=x-off+sz/2, cys=y+sz*0.34;
      ctx.fillStyle= (Math.floor((x-off)/sz)+r)%2? T.cob[0]:T.cob[1];
      ctx.beginPath(); ctx.ellipse(cxs,cys,sz*0.46,sz*0.30,0,0,7); ctx.fill();
      ctx.strokeStyle='rgba(40,34,28,.35)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.ellipse(cxs-sz*0.1,cys-sz*0.08,sz*0.28,sz*0.16,0,0,7); ctx.fill(); }
  }
  // top edge shadow (wall base)
  const es=ctx.createLinearGradient(0,GROUND_TOP-2,0,GROUND_TOP+16); es.addColorStop(0,'rgba(0,0,0,.35)'); es.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=es; ctx.fillRect(0,GROUND_TOP-2,W,18);

    const cg=ctx.createLinearGradient(0,LANE-70,0,H); cg.addColorStop(0,'#0c0c16'); cg.addColorStop(1,'#000');
    ctx.fillStyle=cg; ctx.fillRect(x0,LANE-70,x1-x0,H-(LANE-70)); }
  // ── マリオ風の起伏した前景の地面（キャラはこの稜線の上に立つ。谷では地面が無い）──
  const step=10;
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let sx=0;sx<=W+step;sx+=step){ const wx=sx+camX; const ty=overPit(wx)?H:(LANE-groundLift(wx)); ctx.lineTo(sx,ty); }
  ctx.lineTo(W,H); ctx.closePath();
  const hg=ctx.createLinearGradient(0,LANE-70,0,H); hg.addColorStop(0,shade(T.g[0],18)); hg.addColorStop(.55,T.g[1]); hg.addColorStop(1,T.g[2]);
  ctx.fillStyle=hg; ctx.fill();

  ctx.stroke();
  // 地面のテクスチャ（稜線に沿った小石）
  for(let sx=14; sx<W; sx+=46){ const wx=sx+camX; if(overPit(wx))continue; const ty=LANE-groundLift(wx);
    ctx.fillStyle='rgba(0,0,0,.14)'; ctx.beginPath(); ctx.ellipse(sx,ty+22+((wx*0.7)%24),6,3,0,0,7); ctx.fill(); }

  if(e.grabbedBy && player.state==='screw'){ ctx.rotate(player.screwRot+Math.PI); }   // スクリューで一緒に回転

  if(e.state==='down'||e.dead){ ctx.rotate(0.95); ctx.translate(0,8); }
  // telegraph = crouch+lean back (wind-up); attack/bmove = explosive lunge + stretch
  if(e.telegraph>0){ const w=1-e.telegraph/(e.teleMax||26); ctx.rotate(-0.18*(1-w)); ctx.translate(-9*(1-w),3*(1-w)); ctx.scale(1+0.10*(1-w),1-0.10*(1-w)); }

  else if(e.type==='bitter') drawBitter(e); else if(e.type==='warpdog') drawWarpdog(e); else drawBeast(e);
  if(t.guarder) drawEnemyShield(e);

let shopSel=0, shopNavCd=0, shopMsg='', shopMsgT=0, shopT=0;
function enterShop(){ state='shop'; shopSel=0; shopNavCd=8; shopMsg=''; shopMsgT=0; shopT=0;
  unlockAudio(); if(sndOn){ if(!Music.isPlaying())Music.start('town'); else Music.setMode('town'); } }
function exitShop(){ state='play'; if(Music.setMode)Music.setMode('battle'); saveProgress(stage); }
function updateShop(){ gf++; shopT++; if(shopMsgT>0)shopMsgT--;
  useInput(players[0].in);
  if(shopNavCd>0)shopNavCd--;
  if(shopNavCd<=0){ if(K.up){shopSel=(shopSel+SHOP_ITEMS.length-1)%SHOP_ITEMS.length;shopNavCd=9;sfx.swing(0);}
    else if(K.down){shopSel=(shopSel+1)%SHOP_ITEMS.length;shopNavCd=9;sfx.swing(0);} }
  if(pressed.atk){ pressed.atk=false; const it=SHOP_ITEMS[shopSel];
    if(it.leave){ saveInput(players[0].in); exitShop(); return; }
    if(coins>=it.cost){ coins-=it.cost; it.buy(); shopMsg=it.name+'を購入！'; shopMsgT=90; sfx.rise(); }
    else { shopMsg='コインが足りないニャ…'; shopMsgT=80; sfx.guard(); } }
  if(pressed.grab||pressed.jump){ pressed.grab=false; pressed.jump=false; saveInput(players[0].in); exitShop(); return; }
  saveInput(players[0].in); updateParticles();
}

function startCutscene(scenes,onDone){ cut={scenes,i:0,t:0,onDone}; cutAdvance=false; cutSkip=false; state='cut';
  const es=document.getElementById('start'), er=document.getElementById('result');
  if(es)es.classList.add('hidden'); if(er)er.classList.add('hidden'); }
function startOpening(){ Music.stop(); startCutscene(STORY_OPEN, ()=>startGame()); }
function startBossCut(type,stageN){ Music.setMode('boss'); sfx.boss();
  startCutscene([{boss:type,stageN,name:ETYPE[type].name,role:BOSSROLE[ETYPE[type].bossKind],text:BOSSQUOTE[type]}], ()=>{ state='play'; }); }
// ラスボス形態変化のデモシーン
function startTransformCut(nt){ const N=ETYPE[nt], bk=N.bossKind; if(Music.setMode)Music.setMode('boss'); sfx.boss();
  startCutscene([{boss:nt, stageN:stage, name:N.name, role:BOSSROLE[bk]||'', text:BOSSQUOTE[bk]||'…', transform:true}], ()=>{ state='play'; }); }
function startEnding(){ if(endingDone)return; endingDone=true; Music.stop(); startCutscene(STORY_END, ()=>winGame()); }
function nextCutScene(){ if(!cut)return; cut.i++; cut.t=0; sfx.swing(0);
  if(cut.i>=cut.scenes.length){ const cb=cut.onDone; cut=null; if(cb)cb(); } }
function updateCut(){ if(!cut){ state='play'; return; } cut.t++;
  const sc=cut.scenes[cut.i], len=(sc.text||'').length, full=cut.t>=len*1.3;
  if(cutSkip){ cutSkip=false; cut.i=cut.scenes.length-1; const cb=cut.onDone; cut=null; if(cb)cb(); return; }
  if(cutAdvance){ cutAdvance=false; if(!full){ cut.t=Math.ceil(len*1.3); } else nextCutScene(); }
  else if(full && cut.t>len*1.3+240){ nextCutScene(); } }
// ---- cutscene rendering ----
function cutSky(idx,art){ const T=STAGE_THEME[clamp(idx,0,4)], sk=T.sky;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,sk[0]); g.addColorStop(.5,sk[1]); g.addColorStop(1,(art==='peace'||art==='city')?'#e9f3df':sk[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=T.sun+'.4)'; ctx.beginPath(); ctx.arc(W*0.7,110,82,0,7); ctx.fill(); ctx.restore();
  const dark=(art==='invade'||art==='fall');
  ctx.fillStyle='rgba(0,0,0,'+(dark?0.55:0.30)+')';
  for(let i=0;i<14;i++){ const bw=80, x=i*bw, h=70+((i*53)%80), ty=H*0.62-h;
    ctx.fillRect(x,ty,bw-6,h+260); ctx.beginPath(); ctx.moveTo(x-6,ty); ctx.lineTo(x+bw/2-3,ty-26); ctx.lineTo(x+bw,ty); ctx.fill(); }
  ctx.fillStyle='rgba(0,0,0,.42)'; ctx.fillRect(0,H*0.80,W,H*0.2);
  if(dark){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(200,40,30,.16)'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  if(art==='peace'||art==='end'){ ctx.fillStyle='rgba(255,210,228,.7)'; for(let i=0;i<26;i++){ const px=(i*97+gf*1.3)%W, py=(i*53+gf*0.8)%H; ctx.beginPath(); ctx.ellipse(px,py,3,1.5,i,0,7); ctx.fill(); } }
}
function drawMarch(){ const y=H*0.72; for(let i=0;i<7;i++){ const x=110+i*108+Math.sin(gf*0.12+i)*4;
  ctx.fillStyle='#0a0a12'; ctx.beginPath(); ctx.ellipse(x,y,26,19,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+18,y-15,13,12,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+12,y-24);ctx.lineTo(x+9,y-40);ctx.lineTo(x+19,y-27);ctx.fill();
  ctx.fillStyle='#ff3020'; ctx.beginPath(); ctx.arc(x+24,y-15,2.4,0,7); ctx.fill(); } }
function drawPlayerPortrait(px,py,sc,facing,st){ const p=player;
  const sv={x:p.x,y:p.y,z:p.z,s:p.state,f:p.facing,iv:p.invuln,an:p.anim,at:p.atk,ch:p.charge}, svc=camX;
  p.y=0; camX=p.x; p.z=0; p.state=st||'idle'; p.facing=facing||1; p.invuln=0; p.anim=gf*0.06; p.atk=null; p.charge=0;
  ctx.save(); ctx.translate(px,py); ctx.scale(sc,sc); drawPlayer(); ctx.restore();
  p.x=sv.x;p.y=sv.y;p.z=sv.z;p.state=sv.s;p.facing=sv.f;p.invuln=sv.iv;p.anim=sv.an;p.atk=sv.at;p.charge=sv.ch; camX=svc; }
function drawBossPortrait(type,px,py,sc,facing){ const t=ETYPE[type];
  const e={type,state:'walk',anim:gf*0.05,bob:gf*0.06,moveT:0,moveMax:1,telegraph:0,vanish:0,rage:false,hp:1,maxHp:1,h:t.h,w:t.w,facing:facing||-1};
  ctx.save(); ctx.translate(px,py); ctx.scale(facing*sc,sc);
  const bk=t.bossKind; if(bk==='emperor')drawBoss(e); else if(bk==='dragon')drawDragon(e); else if(bk==='ghost')drawGhost(e); else if(bk==='slime')drawSlime(e); else if(bk==='rival')drawRival(e); else if(bk==='shark')drawShark(e); else if(bk==='pirate')drawPirate(e); else if(bk==='noroinu')drawNoroinu(e); else if(bk==='cactus')drawCactus(e); else if(bk==='wolfking')drawWolfKing(e); else if(bk==='darkknight')drawDarkKnight(e); else drawBigBoss(e); ctx.restore(); }
function cutWrap(txt,x,y,maxw,lh){ ctx.textAlign='left'; let line='',yy=y;
  for(const ch of txt){ if(ctx.measureText(line+ch).width>maxw){ ctx.fillText(line,x,yy); line=ch; yy+=lh; } else line+=ch; }
  ctx.fillText(line,x,yy); }
function drawCut(){ if(!cut)return; const sc=cut.scenes[cut.i];
  const idx = sc.bgTheme!=null?sc.bgTheme : (sc.boss?clamp((sc.stageN||1)-1,0,4):0);
  cutSky(idx, sc.art||(sc.boss?'boss':''));
  // portrait / art
  if(sc.boss){ ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=radGrad(W/2,H*0.5,300,'rgba(255,255,255,.14)','rgba(255,255,255,0)'); ctx.beginPath(); ctx.arc(W/2,H*0.5,300,0,7); ctx.fill(); ctx.restore();
      const intro=Math.min(1,cut.t/24), bx=lerp(W*0.5+60,W*0.5,easeOut(intro));
      drawBossPortrait(sc.boss, bx, H*0.80, 1.7, -1);
      // big STAGE label
      ctx.globalAlpha=intro; ctx.textAlign='center'; ctx.fillStyle='#ffd24d'; ctx.font='bold 22px Trebuchet MS';
      ctx.fillText('STAGE '+(sc.stageN||1)+'  BOSS',W/2,86); ctx.globalAlpha=1; ctx.textAlign='left';
  } else if(sc.art==='player'){ drawPlayerPortrait(W*0.5,H*0.80,2.2,1,'idle');
  } else if(sc.art==='invade'){ drawMarch();
  } else if(sc.art==='fall'){ ctx.save(); ctx.globalAlpha=clamp(1-cut.t/120,0,1); drawBossPortrait('boss',W*0.5,H*0.82,1.6,-1); ctx.restore();
      ctx.save(); ctx.globalCompositeOperation='lighter'; for(let i=0;i<5;i++){ const a=cut.t*0.1+i; ctx.fillStyle='rgba(198,120,255,.5)'; ctx.beginPath(); ctx.arc(W/2+Math.cos(a)*cut.t*2,H*0.5+Math.sin(a)*cut.t*1.4,4,0,7); ctx.fill(); } ctx.restore();
  } else if(sc.art==='end'){ ctx.textAlign='center'; ctx.fillStyle='#ffe14d'; ctx.font='900 48px Trebuchet MS';
      ctx.fillText('聖犬士イッヌ',W/2,H*0.42); ctx.fillStyle='#fff'; ctx.font='bold 18px Trebuchet MS'; ctx.fillText('SCORE  '+String(score).padStart(6,'0'),W/2,H*0.42+34); ctx.textAlign='left'; }
  // letterbox + text panel
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,40); ctx.fillRect(0,H-128,W,128);
  const bx=40,by=H-112,bw=W-80,bh=84;
  ctx.fillStyle='rgba(8,10,20,.85)'; roundRect(bx,by,bw,bh,10); ctx.fill();
  ctx.strokeStyle='rgba(255,210,80,.55)'; ctx.lineWidth=2; roundRect(bx,by,bw,bh,10); ctx.stroke();
  if(sc.name){ ctx.font='bold 17px Trebuchet MS'; const nm=sc.name+(sc.role?'  〈'+sc.role+'〉':'');
    const tw=ctx.measureText(nm).width+24; ctx.fillStyle='rgba(8,10,20,.95)'; roundRect(bx+16,by-22,tw,26,8); ctx.fill();
    ctx.strokeStyle='rgba(255,210,80,.55)'; roundRect(bx+16,by-22,tw,26,8); ctx.stroke();
    ctx.fillStyle=sc.boss?ETYPE[sc.boss].accent:'#ffe14d'; ctx.fillText(nm,bx+28,by-3); }
  const len=(sc.text||'').length, shown=Math.min(len,Math.floor(cut.t/1.3));
  ctx.fillStyle='#fff'; ctx.font='20px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  cutWrap((sc.text||'').slice(0,shown), bx+24, by+34, bw-48, 28);
  if(cut.t>=len*1.3 && Math.floor(gf/20)%2===0){ ctx.fillStyle='#ffd24d'; ctx.font='14px Trebuchet MS'; ctx.textAlign='right'; ctx.fillText('▶ タップ / J で次へ',bx+bw-16,by+bh-12); ctx.textAlign='left'; }
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px Trebuchet MS'; ctx.textAlign='right'; ctx.fillText('K / ESC: スキップ',W-14,30); ctx.textAlign='left';
}

// ── ステージごとのオートセーブ（localStorage） ──
let curMode='inu';
function saveProgress(st){ try{
  const upg=players.map(p=>({maxHp:p.maxHp,atkMul:p.atkMul||1,dimMax:p.dimMax,lives:p.lives}));
  localStorage.setItem('kuchiwan_save', JSON.stringify({stage:st,mode:curMode,coins:coins,upg:upg})); }catch(e){} }
function loadProgress(){ try{ const s=localStorage.getItem('kuchiwan_save'); if(!s)return null; const o=JSON.parse(s); if(o&&o.stage>=1)return o; }catch(e){} return null; }
function clearProgress(){ try{ localStorage.removeItem('kuchiwan_save'); }catch(e){} }
function refreshContinueBtn(){ const b=document.getElementById('continueBtn'); if(!b)return; const sv=loadProgress();
  if(sv&&sv.stage>1){ b.textContent='▶ つづきから（ステージ'+sv.stage+'）'; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
function startGame(){ unlockAudio();
  score=0; coins=0; camX=0; particles=[]; enemies=[]; projectiles=[]; items=[]; amb=[]; combo.count=0; gf=0; shopPending=0;
  slowmo=0; slowAcc=0; stage=1; stageBanner=0; hitStop=0; cut=null; endingDone=false; buildEncounters();
  players[0].active=true; players[1].active=TWO_P;
  players.forEach(p=>{ if(p.active) resetPlayer(p,true); });
  player=players[0];
  state='play'; elStart.classList.add('hidden'); elResult.classList.add('hidden');
  if(sndOn) Music.start('battle'); }
// セーブしたステージから再開
function startGameAt(stageN){ startGame();
  const sv=loadProgress();
  if(sv){ coins=sv.coins||0;
    if(sv.upg) players.forEach((p,i)=>{ const u=sv.upg[i]; if(u){ if(u.maxHp){p.maxHp=u.maxHp;p.hp=u.maxHp;} if(u.atkMul)p.atkMul=u.atkMul; if(u.dimMax){p.dimMax=u.dimMax;p.dim=Math.min(p.dimMax,p.dim);} if(u.lives)p.lives=u.lives; } }); }
  if(stageN>1){ const idx=encounters.findIndex(e=>e.st===stageN);
    if(idx>0){ for(let i=0;i<idx;i++){ encounters[i].cleared=true; encounters[i].spawned=true; }
      encIndex=idx; stage=stageN; curGateX=WORLD_END;
      const at=encounters[idx].at, px=clamp(at-360,30,WORLD_END-30);
      players.forEach(p=>{ if(p.active) p.x=clamp(px+p.pid*60,30,WORLD_END-30); });
      camX=clamp(px-200,0,WORLD_END-W);
      stageBanner=140; stageBannerTxt='STAGE '+stageN+' START'; } }
}
function gameOver(){ state='over'; Music.stop(); gameOverSting();
  elRTitle.textContent='GAME OVER'; elRTitle.style.color='#ff5a5a'; elRSub.textContent='SCORE  '+String(score).padStart(6,'0');
  const sv=loadProgress(), rb=document.getElementById('resumeBtn');
  if(rb){ if(sv&&sv.stage>1){ rb.textContent='▶ ステージ'+sv.stage+'から再開'; rb.classList.remove('hidden'); } else rb.classList.add('hidden'); }
  elResult.classList.remove('hidden'); }
function winGame(){ state='win'; Music.stop(); victoryJingle(); clearProgress();
  elRTitle.textContent='ALL CLEAR!'; elRTitle.style.color='#ffe14d'; elRSub.textContent='全12ステージ制覇！ ワンワン帝国を打ち倒した！  SCORE '+String(score).padStart(6,'0');
  const rb=document.getElementById('resumeBtn'); if(rb)rb.classList.add('hidden'); elResult.classList.remove('hidden'); }
function togglePause(){ state=state==='pause'?'play':'pause';
  if(state==='pause'){ if(musicGain)musicGain.gain.value=0.0; } else if(musicGain&&sndOn){ musicGain.gain.value=0.55; } }
function setupRoster(mode){ curMode=mode; TWO_P=(mode==='coop');
  players[0].kind=(mode==='shima')?'shima':'inu'; players[1].kind='shima';
  players[0].active=true; players[1].active=TWO_P; setTouchMode(TWO_P); }
document.getElementById('startBtn').onclick=()=>{ unlockAudio(); setupRoster('inu'); startOpening(); };
document.getElementById('startShimaBtn').onclick=()=>{ unlockAudio(); setupRoster('shima'); startOpening(); };
document.getElementById('start2Btn').onclick=()=>{ unlockAudio(); setupRoster('coop'); startOpening(); };
document.getElementById('retryBtn').onclick=()=>{ clearProgress(); startGame(); };
document.getElementById('resumeBtn').onclick=()=>{ const sv=loadProgress(); if(sv){ setupRoster(sv.mode||'inu'); startGameAt(sv.stage); } else startGame(); };
const _contBtn=document.getElementById('continueBtn'); if(_contBtn) _contBtn.onclick=()=>{ unlockAudio(); const sv=loadProgress(); if(sv){ setupRoster(sv.mode||'inu'); startGameAt(sv.stage); } };
refreshContinueBtn();
// cutscene advance / skip input
addEventListener('pointerdown',()=>{ if(state==='cut') cutAdvance=true; },{passive:true});
// sound toggle
const sndBtn=document.getElementById('snd');
sndBtn.onclick=()=>{ initAudio(); sndOn=!sndOn; sndBtn.textContent=sndOn?'♪':'🔇';
  if(masterGain) masterGain.gain.value=sndOn?0.9:0;
  if(sndOn&&state==='play'&&!Music.isPlaying()) Music.start('battle'); };

//======================================================================
//  Touch
//======================================================================
const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
if(isTouch) document.getElementById('touch').style.display='block';
function setTouchMode(twop){ const t=document.getElementById('touch'); if(!t)return; t.classList.toggle('twop', !!twop); }
function bindBtn(id,key,pi){ const el=document.getElementById(id); if(!el)return; const IN=()=>players[pi].in;
  el.addEventListener('touchstart',e=>{ e.preventDefault(); const i=IN(); i.keys['_'+key]=true; mapKeysFor(pi);
    if(key==='atk')i.pressed.atk=true; if(key==='grab')i.pressed.grab=true; if(key==='jump')i.pressed.jump=true; if(key==='grd')i.pressed.grd=true; },{passive:false});
  el.addEventListener('touchend',e=>{ e.preventDefault(); IN().keys['_'+key]=false; mapKeysFor(pi); },{passive:false}); }
bindBtn('bAtk','atk',0); bindBtn('bGrd','grd',0); bindBtn('bGrab','grab',0); bindBtn('bJmp','jump',0);
bindBtn('bAtk2','atk',1); bindBtn('bGrd2','grd',1); bindBtn('bGrab2','grab',1); bindBtn('bJmp2','jump',1);
function makeStick(stickId,pi){ const stick=document.getElementById(stickId); if(!stick)return; const nub=stick.querySelector('.nub');
  let id=null,scx=0,scy=0,lastTapDir=0,lastCard=-1,angPrev=null,accum=0; const IN=()=>players[pi].in;
  stick.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; id=t.identifier; const r=stick.getBoundingClientRect(); scx=r.left+r.width/2; scy=r.top+r.height/2; move(t); },{passive:false});
  stick.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===id) move(t); },{passive:false});
  stick.addEventListener('touchend',e=>{ for(const t of e.changedTouches) if(t.identifier===id){ id=null; nub.style.left='50%'; nub.style.top='50%'; const k=IN().keys; k['_l']=k['_r']=k['_u']=k['_d']=false; lastTapDir=0; lastCard=-1; angPrev=null; accum=0; mapKeysFor(pi); } },{passive:false});
  function move(t){ const i=IN(), k=i.keys; let dx=t.clientX-scx,dy=t.clientY-scy; const m=Math.hypot(dx,dy)||1,max=50,cl=Math.min(m,max);
    dx=dx/m*cl; dy=dy/m*cl; nub.style.left='calc(50% + '+dx+'px)'; nub.style.top='calc(50% + '+dy+'px)'; const th=16;
    const nl=dx<-th,nr=dx>th; if(nl&&lastTapDir!==-1){pushTapFor(i,-1);lastTapDir=-1;} if(nr&&lastTapDir!==1){pushTapFor(i,1);lastTapDir=1;} if(!nl&&!nr)lastTapDir=0;
    if(m>max*0.55){ const ang=Math.atan2(dy,dx); let card=(Math.round(ang/(Math.PI/2))+4)%4; card=[1,2,3,0][card];
      if(card!==lastCard){ pushCardFor(i,card); lastCard=card; }
      if(angPrev!==null){ let d=ang-angPrev; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; accum+=d; }
      angPrev=ang; if(Math.abs(accum)>=Math.PI*1.7){ i.stickRot=gf; accum=0; }
    } else { lastCard=-1; angPrev=null; accum=0; }
    k['_l']=nl; k['_r']=nr; k['_u']=dy<-th; k['_d']=dy>th; mapKeysFor(pi); }
}
makeStick('stick',0); makeStick('stick2',1);

//======================================================================
//  Resize
//======================================================================
function resize(){ setupCanvas(); const r=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*r)+'px'; cv.style.height=(H*r)+'px'; }
addEventListener('resize',resize); resize();

//======================================================================
//  Title attract render
//======================================================================
function drawTitleScene(){ drawBackground(); drawGround();
  // pose the player on title
  const sv=player.x; player.x=camX+200; player.y=470; drawPlayer(); player.x=sv; drawLighting(); }

//======================================================================
//  Main loop
//======================================================================
function loop(){
  if(state==='cut'){ gf++; updateCut(); ctx.clearRect(0,0,W,H); drawCut(); requestAnimationFrame(loop); return; }
  if(state==='shop'){ updateShop(); ctx.clearRect(0,0,W,H); drawShop(); requestAnimationFrame(loop); return; }
  // slow-motion: throttle logic ticks while keeping render smooth
  if(slowmo>0 && state==='play' && hitStop<=0){
    slowmo--; slowAcc+=0.34;
    if(slowAcc>=1){ slowAcc-=1; update(); }
  } else { update(); }
  if(state==='title'){ ctx.clearRect(0,0,W,H); drawTitleScene(); }
  else render();
  requestAnimationFrame(loop);
}
buildEncounters(); loop();
</script>
