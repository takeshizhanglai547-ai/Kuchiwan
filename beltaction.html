<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>聖犬士イッヌ - ベルトアクション</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#05060a; overflow:hidden;
    font-family:'Trebuchet MS','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    color:#fff; user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; background:#000; box-shadow:0 0 60px rgba(0,0,0,.8); max-width:100%; max-height:100%; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; z-index:20; padding:20px;
    background:radial-gradient(ellipse at center, rgba(20,12,40,.55), rgba(0,0,0,.9)); }
  .hidden { display:none !important; }
  .title-sub { font-size:14px; letter-spacing:6px; color:#ffd34d; text-shadow:0 0 8px #b8860b; }
  .title-main { font-size:clamp(38px,9vw,84px); font-weight:900; letter-spacing:4px;
    background:linear-gradient(180deg,#fff6d0,#ffcf3a 55%,#c8881a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 0 rgba(120,60,0,.4); margin:4px 0; }
  .title-jp { font-size:clamp(16px,4vw,28px); color:#fff; letter-spacing:8px;
    text-shadow:0 0 10px #ff8a00; margin-bottom:14px; }
  .btn { margin-top:12px; padding:13px 38px; font-size:20px; font-weight:800; letter-spacing:3px;
    color:#3a1d00; cursor:pointer; border-radius:10px;
    background:linear-gradient(180deg,#ffe98a,#ffb02e); border:2px solid #fff3c0;
    box-shadow:0 6px 0 #9c5a00,0 10px 20px rgba(0,0,0,.5); transition:transform .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #9c5a00; }
  .moves { margin-top:16px; font-size:12.5px; color:#dfeaff; line-height:1.7; max-width:600px; text-align:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,210,80,.25); border-radius:10px; padding:9px 16px; }
  .moves h3 { color:#ffd34d; letter-spacing:3px; margin-bottom:6px; font-size:13px; }
  .moves b { color:#7fd0ff; } .moves .cmd { color:#ff9a3a; font-weight:800; }
  #result-title { font-size:clamp(34px,8vw,70px); font-weight:900; letter-spacing:6px; }
  #result-sub { font-size:18px; margin-top:10px; color:#ffd34d; letter-spacing:2px; }

  /* sound toggle */
  #snd { position:absolute; top:10px; right:10px; z-index:25; width:42px; height:42px; border-radius:50%;
    background:rgba(8,10,20,.6); border:2px solid rgba(255,210,80,.6); color:#ffd34d; font-size:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }

  /* touch */
  #touch { position:absolute; inset:0; z-index:15; pointer-events:none; display:none; }
  .stk { position:absolute; border-radius:50%; background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.18); pointer-events:auto; }
  .stk .nub { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px;
    border-radius:50%; background:rgba(255,255,255,.26); border:2px solid rgba(255,255,255,.85); }
  #stick  { left:22px;  bottom:24px; width:130px; height:130px; }
  #stick2 { right:22px; bottom:24px; width:130px; height:130px; display:none; }
  .tbtn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center;
    justify-content:center; font-size:15px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000;
    border:3px solid rgba(255,255,255,.55); text-align:center; line-height:1.1;
    box-shadow:0 3px 10px rgba(0,0,0,.4); }
  .p2 { display:none; }
  .bA { background:rgba(255,80,40,.62); }  .bGr { background:rgba(170,90,235,.6); }
  .bJ { background:rgba(90,200,120,.6); }  .bD { background:rgba(60,140,255,.62); }
  /* 1P spacious layout */
  #bAtk  { right:118px; bottom:34px;  width:92px; height:92px; font-size:18px; }
  #bGrab { right:34px;  bottom:30px;  width:78px; height:78px; }
  #bJmp  { right:42px;  bottom:118px; width:74px; height:74px; }
  #bGrd  { right:142px; bottom:140px; width:72px; height:72px; }
  /* 2P split: P1 left cluster, P2 right cluster */
  #touch.twop #stick  { left:8px;  bottom:8px; width:104px; height:104px; }
  #touch.twop #stick2 { display:block; right:8px; bottom:8px; width:104px; height:104px; }
  #touch.twop .p2 { display:flex; }
  #touch.twop .tbtn { font-size:14px; }
  #touch.twop #bAtk { left:118px; right:auto; bottom:10px;  width:62px; height:62px; font-size:15px; }
  #touch.twop #bJmp { left:184px; right:auto; bottom:10px;  width:58px; height:58px; }
  #touch.twop #bGrd { left:118px; right:auto; bottom:76px;  width:58px; height:58px; }
  #touch.twop #bGrab{ left:184px; right:auto; bottom:76px;  width:58px; height:58px; }
  #bAtk2 { right:118px; bottom:10px; width:62px; height:62px; font-size:15px; }
  #bJmp2 { right:184px; bottom:10px; width:58px; height:58px; }
  #bGrd2 { right:118px; bottom:76px; width:58px; height:58px; }
  #bGrab2{ right:184px; bottom:76px; width:58px; height:58px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="snd">♪</div>

  <div id="start" class="overlay">
    <div class="title-sub">ARCADE BELT ACTION</div>
    <div class="title-main">聖犬士イッヌ</div>
    <div class="title-jp">〜 ワンワン帝国の野望 〜</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="startBtn" class="btn">▶ 1P イッヌ</button>
      <button id="startShimaBtn" class="btn" style="background:linear-gradient(180deg,#e0b07a,#b07a44)">▶ 1P シマダックス</button>
      <button id="start2Btn" class="btn" style="background:linear-gradient(180deg,#ffd08a,#ff8e2e)">▶ 2P CO-OP</button>
    </div>
    <div class="moves">
      移動 <b>矢印/WASD</b>　攻撃 <b>J/F</b>　ジャンプ <b>Space/V</b>　ガード <b>K/G</b>　掴み <b>L/H</b>　　<span style="opacity:.7">スマホは画面の操作パッドで</span>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <button id="retryBtn" class="btn">▶ もう一度</button>
  </div>

  <div id="touch">
    <div id="stick" class="stk"><div class="nub"></div></div>
    <div id="bAtk"  class="tbtn bA">攻</div>
    <div id="bGrab" class="tbtn bGr">掴</div>
    <div id="bJmp"  class="tbtn bJ">跳</div>
    <div id="bGrd"  class="tbtn bD">防</div>
    <div id="stick2" class="stk p2"><div class="nub"></div></div>
    <div id="bAtk2"  class="tbtn bA p2">攻</div>
    <div id="bGrab2" class="tbtn bGr p2">掴</div>
    <div id="bJmp2"  class="tbtn bJ p2">跳</div>
    <div id="bGrd2"  class="tbtn bD p2">防</div>
  </div>
</div>

<script>
"use strict";
//======================================================================
//  聖犬士イッヌ  -  belt-scroll beat 'em up  (enhanced edition)
//  - procedural BGM (battle / boss / jingles)
//  - higher-fidelity shaded rendering
//  - 4-hit combo + charge + command moves (dash slash / rising slash)
//======================================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;                    // logical resolution

// hi-dpi crisp backing store
let DPR = Math.min(window.devicePixelRatio||1, 3);
function setupCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 3);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
setupCanvas();

const GROUND_TOP = 372, GROUND_BOT = 516, WORLD_END = 12900;
const LANE = 488, FIXED_SCALE = 1.82;     // single-plane brawler — larger sprites
const CEIL_Z = 408;                        // ceiling height (juggle bounces off the top of the screen)

let state='title', camX=0, score=0;
let shake=0, hitStop=0, flash=0, bossIntro=0, goArrow=0, gf=0; // gf = global frame
let slowmo=0, slowAcc=0, stage=1, stageBanner=0, stageBannerTxt='';
let cut=null, cutAdvance=false, cutSkip=false, endingDone=false;   // cutscene state
function triggerSlow(n){ slowmo=Math.max(slowmo,n); }

//======================================================================
//  Input  (per-player; globals point to the player currently being simulated)
//======================================================================
let keys, K, pressed, dirTaps, cardSeq, stickRot;
function makeInput(){ return { keys:{},
  K:{left:false,right:false,up:false,down:false,atk:false,grd:false,grab:false},
  pressed:{atk:false,grab:false,up:false,jump:false}, dirTaps:[], cardSeq:[], stickRot:-999 }; }
function useInput(inp){ keys=inp.keys; K=inp.K; pressed=inp.pressed; dirTaps=inp.dirTaps; cardSeq=inp.cardSeq; stickRot=inp.stickRot; }
function saveInput(inp){ inp.stickRot=stickRot; }
// key bindings per player (1P: arrows + JKL/space, 2P: WASD + F G H V)
const KEYMAP=[
  { left:['ArrowLeft'], right:['ArrowRight'], up:['ArrowUp'], down:['ArrowDown'],
    atk:['KeyJ','KeyZ'], grd:['KeyK','KeyX'], grab:['KeyL','KeyU','ShiftLeft','ShiftRight'], jump:['Space','KeyI'] },
  { left:['KeyA'], right:['KeyD'], up:['KeyW'], down:['KeyS'],
    atk:['KeyF'], grd:['KeyG'], grab:['KeyH'], jump:['KeyV','KeyB'] },
];
const CODE2PA={}; KEYMAP.forEach((m,pi)=>{ for(const act in m) m[act].forEach(c=>CODE2PA[c]=[pi,act]); });
function mapKeysFor(pi){ const m=KEYMAP[pi], inp=players[pi].in, k=inp.keys, KK=inp.K;
  KK.left=m.left.some(c=>k[c])||k['_l'];
  KK.right=m.right.some(c=>k[c])||k['_r'];
  KK.up=m.up.some(c=>k[c])||k['_u']||k['_up'];
  KK.down=m.down.some(c=>k[c])||k['_d'];
  KK.atk=m.atk.some(c=>k[c])||k['_atk'];
  KK.grd=m.grd.some(c=>k[c])||k['_grd'];
  KK.grab=m.grab.some(c=>k[c])||k['_grab'];
}
function pushTapFor(inp,d){ inp.dirTaps.push({d,f:gf}); if(inp.dirTaps.length>6) inp.dirTaps.shift(); }
function pushCardFor(inp,c){ const L=inp.cardSeq[inp.cardSeq.length-1]; if(L&&L.c===c){ L.f=gf; return; } inp.cardSeq.push({c,f:gf}); if(inp.cardSeq.length>8)inp.cardSeq.shift(); }
addEventListener('keydown',e=>{
  if(state==='cut'){ if(e.code==='Escape'||e.code==='KeyK') cutSkip=true; else cutAdvance=true; e.preventDefault(); return; }
  if(e.code==='KeyP'&&(state==='play'||state==='pause')){ togglePause(); return; }
  const pa=CODE2PA[e.code]; if(!pa) return; const [pi,act]=pa; const inp=players[pi].in;
  if(!inp.keys[e.code]){ inp.keys[e.code]=true; mapKeysFor(pi);
    if(act==='atk') inp.pressed.atk=true; if(act==='grab') inp.pressed.grab=true; if(act==='jump') inp.pressed.jump=true;
    if(act==='up') pushCardFor(inp,0); else if(act==='right'){ pushTapFor(inp,1); pushCardFor(inp,1); }
    else if(act==='down') pushCardFor(inp,2); else if(act==='left'){ pushTapFor(inp,-1); pushCardFor(inp,3); }
  }
  e.preventDefault();
});
addEventListener('keyup',e=>{ const pa=CODE2PA[e.code]; if(!pa) return; const [pi]=pa; players[pi].in.keys[e.code]=false; mapKeysFor(pi); });
// command detection (operate on the active player's globals)
function stingerReady(facing){ const want=facing>0?1:3, back=facing>0?3:1;
  const r=cardSeq.filter(t=>gf-t.f<=18);
  for(let i=r.length-1;i>=1;i--){ if(r[i].c===want && gf-r[i].f<=10){ for(let j=i-1;j>=0;j--){ if(r[j].c===back) return true; } } }
  return false; }
function rotationReady(){ if(gf-stickRot<=12) return true;
  const r=cardSeq.filter(t=>gf-t.f<=44); if(r.length<4) return false;
  for(let i=r.length-1;i>=3;i--){ const a=r[i-3].c,b=r[i-2].c,c=r[i-1].c,d=r[i].c;
    const cw=(b===(a+1)%4)&&(c===(b+1)%4)&&(d===(c+1)%4);
    const ccw=(b===(a+3)%4)&&(c===(b+3)%4)&&(d===(c+3)%4);
    if(cw||ccw) return true; }
  return false; }
function consumeCmd(){ cardSeq.length=0; dirTaps.length=0; stickRot=-999; }

//======================================================================
//  AUDIO  -  procedural SFX + BGM engine
//======================================================================
let actx=null, sndOn=true, masterGain=null, musicGain=null, sfxGain=null, noiseBuf=null;
function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=actx.createGain(); masterGain.gain.value=0.95;
  // master bus compressor — glue + loudness so impacts punch hard without nasty clipping
  const comp=actx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=4; comp.attack.value=0.002; comp.release.value=0.16;
  masterGain.connect(comp); comp.connect(actx.destination);
  musicGain=actx.createGain(); musicGain.gain.value=0.5; musicGain.connect(masterGain);
  sfxGain=actx.createGain(); sfxGain.gain.value=1.0; sfxGain.connect(masterGain);
  // spacious reverb send for the orchestral BGM (feedback-delay "hall")
  const verb=actx.createGain(); verb.gain.value=0.42;
  const dl=actx.createDelay(0.6); dl.delayTime.value=0.16;
  const fb=actx.createGain(); fb.gain.value=0.4;
  const damp=actx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2600;
  musicGain.connect(verb); verb.connect(dl); dl.connect(damp); damp.connect(fb); fb.connect(dl); damp.connect(masterGain);
  // noise buffer for drums/impacts
  noiseBuf=actx.createBuffer(1, actx.sampleRate*0.4, actx.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
// iOS/Safari need the context resumed AND a sound started *synchronously* inside a user gesture.
function unlockAudio(){
  try{ initAudio(); }catch(e){ return; }
  if(!actx) return;
  if(actx.state!=='running'){ const r=actx.resume&&actx.resume(); if(r&&r.then)r.catch(()=>{}); }
  try{ const b=actx.createBufferSource(); b.buffer=actx.createBuffer(1,1,22050); b.connect(actx.destination); b.start(0); }catch(e){}
  if(sndOn && state==='play' && !Music.isPlaying()) Music.start('battle');
}
['touchstart','touchend','pointerdown','mousedown','keydown','click'].forEach(ev=>
  addEventListener(ev, unlockAudio, {passive:true}));
const midi=n=>440*Math.pow(2,(n-69)/12);
function tone(freq,dur,type='square',vol=.15,slide=0,dest=null){
  if(!actx||!sndOn) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),actx.currentTime+dur);
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(); o.stop(actx.currentTime+dur);
}
function noise(dur,vol,hp,dest){
  if(!actx||!sndOn) return;
  const s=actx.createBufferSource(); s.buffer=noiseBuf;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  const f=actx.createBiquadFilter(); f.type=hp?'highpass':'lowpass'; f.frequency.value=hp||1200;
  s.connect(f); f.connect(g); g.connect(dest||sfxGain); s.start(); s.stop(actx.currentTime+dur);
}
const sfx={
  swing:(p=0)=>tone(560-p*40,.09,'square',.09,-260),
  heavy:()=>{tone(300,.16,'sawtooth',.12,-180); noise(.12,.18,2000);},
  hit:()=>{tone(170,.10,'square',.15,-90); noise(.09,.22,1800);},
  big:()=>{tone(110,.22,'sawtooth',.2,-60); noise(.2,.3,800);},
  guard:()=>{tone(760,.06,'square',.1); noise(.05,.12,4000);},
  hurt:()=>tone(200,.18,'sawtooth',.13,-120),
  dash:()=>{tone(320,.14,'square',.1,300); noise(.14,.14,2600);},
  rise:()=>{tone(420,.22,'square',.11,520);},
  charge:()=>tone(180,.5,'sawtooth',.05,400,sfxGain),
  ko:()=>{tone(120,.3,'sawtooth',.16,-80); noise(.3,.2,1200);},
  boss:()=>tone(70,.6,'sawtooth',.22,40),
};
// ---- 命中音 = 派手な「バキーン！」（金属クラング＋鳴り）＋「ドカーン！」（爆発ブーム）----
function hitSound(dmg){
  if(!actx||!sndOn) return;
  const t=actx.currentTime, tier=dmg>=30?3:dmg>=18?2:dmg>=10?1:0, V=0.7+tier*0.22;
  // ── バ：弾けるアタック・クラック ──
  { const s=actx.createBufferSource(); s.buffer=noiseBuf; const g=actx.createGain();
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.7;
    g.gain.setValueAtTime(V*1.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    s.connect(bp); bp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+0.08); }
  // ── キーン：明るい金属クラング（倍音を少しデチューンして煌めく鳴り）──
  const parts=[1320,1980,2640,3560,4900,6600,8800], pv=[1,0.82,0.68,0.55,0.42,0.3,0.2];
  parts.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
    o.type=i<3?'triangle':'sawtooth'; const det=1+(i%2?0.006:-0.005);
    o.frequency.setValueAtTime(f*det,t); o.frequency.exponentialRampToValueAtTime(f*0.93,t+0.34+tier*0.05);
    g.gain.setValueAtTime(V*0.34*pv[i],t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.34+tier*0.12);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.5); });
  // ── ン：きらめく上昇スイープ（シャキーンの閃き）──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(2600+tier*500,t); o.frequency.exponentialRampToValueAtTime(9000+tier*1500,t+0.12);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(V*0.34,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=6000; bp.Q.value=1.1; o.connect(bp); bp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.24); }
  // ── ド：パンチの効いた中域ボディ ──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.setValueAtTime(180-tier*24,t); o.frequency.exponentialRampToValueAtTime(54-tier*6,t+0.1);
    g.gain.setValueAtTime(V*0.66,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22+tier*0.05);
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500; o.connect(lp); lp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.34); }
  // ── カーン／ドカーン：深く長い爆発サブ・ブーム ──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime([86,72,58,46][tier],t); o.frequency.exponentialRampToValueAtTime([42,34,27,21][tier],t+0.4);
    g.gain.setValueAtTime(V*0.95,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55+tier*0.16);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.8); }
  // ── 強打（tier2以上）には轟くノイズ爆発を追加：ドッカーン！──
  if(tier>=2){ const s=actx.createBufferSource(); s.buffer=noiseBuf; const g=actx.createGain();
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(1400,t); lp.frequency.exponentialRampToValueAtTime(300,t+0.4);
    g.gain.setValueAtTime(V*0.7,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45+tier*0.1);
    s.connect(lp); lp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+0.6); }
}

// ---- BGM: generative orchestral / classical (strings + harp + horns + timpani) ----
const Music=(()=>{
  let playing=false, mode='battle', step=0, nextT=0, timer=null;
  const BPM=128, spb=60/BPM, stepDur=spb/2;          // up-tempo heroic; 8 eighth-steps per bar
  const SONG={
    // noble minor cadences [root,3rd,5th] + flowing 16-beat melody (one per beat)
    battle:{ chords:[[57,60,64],[53,57,60],[55,59,62],[52,55,59]],
             mel:[64,69,72,71, 69,72,69,65, 71,74,71,67, 64,67,71,76], padType:'sawtooth', leadType:'triangle' }, // Am F G Em
    boss:{   chords:[[50,53,57],[46,50,53],[43,46,50],[45,49,52]],
             mel:[69,74,77,76, 74,77,74,70, 70,74,70,67, 69,73,76,81], padType:'sawtooth', leadType:'square'   }, // Dm Bb Gm A
  };
  function voice(f,t,dur,type,vol,atk,cut){ const o=actx.createOscillator(),g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+atk);
    g.gain.setValueAtTime(vol,t+Math.max(atk,dur*0.5)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let node=o; if(cut){ const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cut; o.connect(lp); node=lp; }
    node.connect(g); g.connect(musicGain); o.start(t); o.stop(t+dur+0.05); }
  function strings(n,t,dur,type){ voice(midi(n),t,dur,type,0.045,0.12,1900); voice(midi(n)*1.004,t,dur,type,0.03,0.14,1700); }
  function timp(t,root,vel){ vel=vel||1; const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(midi(root-24),t); o.frequency.exponentialRampToValueAtTime(midi(root-24)*0.7,t+0.14);
    g.gain.setValueAtTime(0.22*vel,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.34);
    const s=actx.createBufferSource(); s.buffer=noiseBuf; const ng=actx.createGain(); ng.gain.setValueAtTime(0.05*vel,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=460; s.connect(f);f.connect(ng); ng.connect(musicGain); s.start(t); s.stop(t+0.1); }
  const ARP=[0,1,2,1,0,2,1,2];
  function scheduleStep(s){
    if(!actx||!sndOn) return;
    const song=SONG[mode], bar=Math.floor(s/8)%4, st=s%8, t=nextT, ch=song.chords[bar], root=ch[0];
    if(st===0){ ch.forEach(n=>strings(n+12,t,stepDur*8*0.95,song.padType)); }               // sustained string pad
    if(st%2===0){ const bn=(st===0||st===4)? root-12 : ch[2]-12;                              // driving march bass
      voice(midi(bn),t,stepDur*1.5,'sawtooth',0.16,0.008,760); timp(t,root, st%4===0?1:0.6); }
    if(st%2===0){ const m=song.mel[(bar*4+(st>>1))%song.mel.length];                          // flowing quarter-note melody
      voice(midi(m),t,stepDur*1.9,song.leadType,0.085,0.015,3500); voice(midi(m-12),t,stepDur*1.9,'triangle',0.035,0.02,2200); }
    const an=ch[ARP[st]]+(st>=4?12:0); voice(midi(an+12),t,stepDur*1.15,'triangle',0.04,0.004,4600); // fast harp arpeggio
  }
  function tick(){ if(!playing||!actx) return;
    while(nextT < actx.currentTime+0.4){ scheduleStep(step); step=(step+1)%32; nextT+=stepDur; } }
  return {
    start(m){ if(!actx) return; mode=m||'battle'; if(playing){return;} playing=true; step=0;
      nextT=actx.currentTime+0.1; clearInterval(timer); timer=setInterval(tick,60); },
    setMode(m){ if(mode!==m){ mode=m; } },
    stop(){ playing=false; clearInterval(timer); },
    isPlaying(){ return playing; }
  };
})();

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
function depthScale(y){ return FIXED_SCALE; } // depth removed — uniform sprite size on a single lane
function radGrad(x,y,r,inner,outer){ const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r);
  g.addColorStop(0,inner); g.addColorStop(1,outer); return g; }

//======================================================================
//  Particles  (sparks, slash crescents, dust, floating text)
//======================================================================
let particles=[];
function spark(x,y,color,n=8,spd=6){
  for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), s=rnd(2,spd);
    particles.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(14,28),max:28,color,star:Math.random()<.5}); }
}
function dust(x,y,n=4){ for(let i=0;i<n;i++) particles.push({k:'dust',x,y,vx:rnd(-1.5,1.5),vy:rnd(-.4,-1.6),life:rnd(18,30),max:30}); }
function crescent(x,y,r,a0,a1,color){ particles.push({k:'arc',x,y,r,a0,a1,color,life:10,max:10}); }
function popText(x,y,txt,color,big){ particles.push({k:'txt',x,y,txt,color,big,life:46,max:46,vy:-1.3}); }
function ring(x,y,color){ particles.push({k:'ring',x,y,r:6,life:16,max:16,color}); }
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life--;
    if(p.k==='spark'){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.24;p.vx*=0.94; }
    else if(p.k==='dust'){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.04; }
    else if(p.k==='txt'){ p.y+=p.vy; p.vy*=0.92; }
    else if(p.k==='ring'){ p.r+=2.4; }
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{ const sx=p.x-camX, a=p.life/p.max;
    if(p.k==='txt'){ ctx.globalAlpha=clamp(a*1.4,0,1); ctx.font=`bold ${p.big?30:21}px Trebuchet MS`; ctx.textAlign='center';
      ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText(p.txt,sx,p.y); ctx.fillStyle=p.color; ctx.fillText(p.txt,sx,p.y); ctx.textAlign='left'; }
    else if(p.k==='arc'){ ctx.globalAlpha=a*0.85; ctx.strokeStyle=p.color; ctx.lineWidth=8*a+3; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(sx,p.y,p.r,p.a0,p.a1); ctx.stroke(); }
    else if(p.k==='ring'){ ctx.globalAlpha=a*0.6; ctx.strokeStyle=p.color; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,p.y,p.r,0,7); ctx.stroke(); }
    else if(p.k==='dust'){ ctx.globalAlpha=a*0.5; ctx.fillStyle='#cabfa6'; ctx.beginPath(); ctx.arc(sx,p.y,3*a+1,0,7); ctx.fill(); }
    else { ctx.globalAlpha=a; if(p.star){ drawStar(sx,p.y,3,7,p.color); } else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,p.y,3*a+1,0,7); ctx.fill(); } }
  });
  ctx.globalAlpha=1;
}
function drawStar(x,y,r1,r2,color){ ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?r1:r2, a=Math.PI/5*i-Math.PI/2; ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r); }
  ctx.closePath(); ctx.fill(); }

function comboMaxFor(p){ const s=comboSet(p); return s? s.length : (p.kind==='shima'?5:4); }
function comboMoveFor(p,step){ const s=comboSet(p); if(s) return s[clamp(step,1,s.length)-1]; return (p.kind==='shima'?'sc':'c')+step; }
function chargeMoveFor(p){ if(p.weapon==='spear')return 'chargeSpear'; if(p.weapon==='hammer')return 'chargeHammer'; return 'charge'; }
function beginAttack(type){
  const p=player, def=ATK[type];
  p.atk={type, t:0, def, hitSet:new Set(), lastHit:{}};
  p.state='attack';
  if(def.rise){ p.riseVel=def.riseV||9; p.riseG=def.riseG||1.1; p.z=0; sfx.rise(); if(def.shoryu){ p.invuln=Math.max(p.invuln,12); ring(p.x,p.y-40,'#ffe27a'); spark(p.x,p.y-20,'#ffe27a',12,8); } }
  else if(type==='charge'||type==='chargeSpear'||type==='chargeHammer'){ sfx.heavy(); ring(p.x,p.y-40,def.trail||'#ffd24d'); spark(p.x+p.facing*22,p.y-40,def.trail||'#ffd24d',10,8); }
  else if(type==='stinger'){ sfx.dash(); spark(p.x+p.facing*20,p.y-40,'#9fe8ff',10,7); }
  else if(type==='gcounter'){ p.counterPow = p.guardFx>0 || (gf-p.guardStart<=14); p.invuln=Math.max(p.invuln,10);
    sfx.guard(); sfx.rise(); ring(p.x,p.y-40,'#bfe9ff'); if(p.counterPow){ flash=Math.max(flash,3); hitStop=Math.max(hitStop,6); } }
  else if(type==='dimension'){ p.dim--; p.invuln=Math.max(p.invuln,52); sfx.boss(); sfx.rise(); flash=Math.max(flash,5); shake=8; triggerSlow(36);
    ring(p.x,p.y-46,'#c46bff'); ring(p.x,p.y-46,'#fff'); spark(p.x,p.y-46,'#c46bff',24,11); popText(p.x,p.y-110,'次元斬！','#d6a6ff',true); }
  else if(type==='spunch'){ sfx.heavy(); spark(p.x+p.facing*20,p.y-40,'#ffd24d',8,7); }
  else if(type==='dragonkick'){ sfx.dash(); spark(p.x+p.facing*20,p.y-40,'#9fe8ff',10,7); }
  else if(type==='sweep'){ sfx.swing(0); }
  else if(type==='sc5'||def.kick){ sfx.swing(2); }
  else sfx.swing(p.comboStep);
}
function updatePlayer(){
  const p=player; const SHI=p.kind==='shima';
  if(p.invuln>0)p.invuln--; if(p.dashCd>0)p.dashCd--; if(p.parryFx>0)p.parryFx--; if(p.guardFx>0)p.guardFx--;
  if(p.comboTimer>0)p.comboTimer--; else if(p.state!=='attack') p.comboStep=0;

  if(p.state==='down'){ p.downTimer--; p.vx*=0.86; p.x+=p.vx; p.z=Math.max(0,p.z+ (p.riseVel||0));
    if(p.downTimer<=0){ p.state='idle'; p.invuln=55; } return; }
  if(p.state==='hurt'){ p.hurtTimer--; p.x+=p.vx; p.vx*=0.84; if(p.hurtTimer<=0)p.state='idle'; return; }
  if(p.state==='grab'){ updateGrab(); return; }
  if(p.state==='slide'){ updateSlide(); return; }
  if(p.state==='wheel'){ updateWheel(); return; }
  if(p.state==='screw'){ updateScrew(); return; }
  if(p.state==='rush'){ updateRush(); return; }
  if(p.state==='hadou'){ updateHadou(); return; }
  if(p.state==='seven'){ updateSeven(); return; }

  // ---- jump (high jump + aerial rave) ----
  if(p.state==='jump'){
    if(p.jHammer){ p.vz-=0.95; }                                       // ダブルハンマー：急降下
    else if(p.jHyaku && p.jAtk>0){ p.vz=Math.max(p.vz-0.13,-2.3); }    // 巨大百裂拳：ゆっくり高度落下
    else if(p.jAtk>0 && !p.jKabuto && !p.jDown){ p.vz=0; }   // エリアルレイブ中は高度維持（ホバー）
    else { p.vz-=0.62; }
    p.z+=p.vz;
    let mx=0; if(K.left)mx=-1; if(K.right)mx=1; if(mx&&!p.jKabuto&&!p.jDown)p.facing=mx; p.x+=mx*SPEED*(p.jDown?0.3:1.0);
    if(p.jDrop){ p.x+=p.facing*SPEED*1.4; }            // ドロップキックの突進
    // air attack
    if(pressed.atk && p.jAtk<=0){ pressed.atk=false; p.jAtk=13; p.jHit=new Set(); p.jKabuto=false; p.jDown=false; p.jDrop=false; p.jHammer=false; p.jHyaku=false;
      if(SHI && K.down){ p.jHammer=true; p.jAtk=22; p.vz=Math.min(p.vz,-2)-10; sfx.heavy(); spark(p.x,p.y-p.z-20,'#ffd24d',12,7); }   // シマ空中下：ダブルハンマーパンチ（急降下）
      else if(K.down){ p.jDown=true; p.jAtk=18; p.vz=Math.min(p.vz,-2)-9; sfx.dash(); spark(p.x,p.y-p.z-10,'#aef0ff',8,7); }   // イッヌ下突き
      else if(SHI && (K.left||K.right)){ p.jDrop=true; p.jAtk=18; p.facing=K.left?-1:1; p.vz=Math.max(p.vz,1); sfx.dash(); spark(p.x,p.y-p.z-20,'#9fe8ff',10,7); }   // ドロップキック
      else if(K.left||K.right){ p.jKabuto=true; p.jAtk=18; p.facing=K.left?-1:1; p.vz=Math.min(p.vz,-3)-7; sfx.heavy(); spark(p.x,p.y-p.z-40,'#fff0c0',10,7); }   // イッヌ兜割
      else if(SHI){ p.jHyaku=true; p.jAtk=28; sfx.swing(2); }   // シマ空中連打：巨大百裂拳（ゆっくり落下）
      else { sfx.swing(2); p.aerial=(p.aerial||0)+1; } }   // 通常空中斬り＝レイブ（高度維持）
    if(p.jAtk>0){ p.jAtk--;
      if(p.jHyaku){ if(p.jAtk%4===0){ p.jHit=new Set(); jumpAttackHit(); } }   // 百裂拳は連続ヒット
      else if(p.jHammer){ jumpAttackHit(); }   // ダブルハンマーは落下中ずっと判定
      else if(p.jAtk>=3 && p.jAtk<=11) jumpAttackHit(); }
    if(p.z<=0){ p.z=0; p.vz=0;
      if(p.jKabuto&&p.jAtk>0){ kabutoLand(); p.state='land'; p.landT=22; p.jAtk=0; p.jKabuto=false; p.jDown=false; dust(p.x,p.y,10); return; } // 兜割は着地硬直
      if(p.jHammer&&p.jAtk>0){ hammerLand(); p.state='land'; p.landT=18; p.jAtk=0; p.jHammer=false; dust(p.x,p.y,9); return; } // ダブルハンマー着地
      p.state='idle'; p.jAtk=0; p.jKabuto=false; p.jDown=false; p.jDrop=false; p.jHammer=false; p.jHyaku=false; dust(p.x,p.y,7); }
    p.x=clamp(p.x, camX+24, Math.min(WORLD_END, camX+W-24));
    return;
  }
  if(p.state==='land'){ p.landT--; p.vx*=0.8; p.x+=p.vx; p.x=clamp(p.x,camX+24,camX+W-24); if(p.landT<=0)p.state='idle'; return; }

  if(p.state==='attack'){
    const a=p.atk, def=a.def; a.t++;
    // movement during attacks
    if(def.move){ p.x+=p.facing*def.move*(a.t<def.act[1]?1:0.3); }
    else if(def.rise){ p.z=Math.max(0,p.z+p.riseVel); p.riseVel-=(p.riseG||1.1); }
    else if(!def.special){ p.x+=p.facing*(def.lunge||0)*(a.t<def.dur*0.6?1:0); }
    if(def.shoryu && (a.t%3===0)){ spark(p.x,p.y-p.z-30,'#ffe27a',3,5); }   // 上昇の光
    // active hit window
    if(a.t>=def.act[0] && a.t<=def.act[1]) doPlayerHit(a);
    if(a.t>=def.dur){
      if(def.shoryu && p.z>6){ p.state='jump'; p.vz=Math.min(p.riseVel,-2); p.jAtk=0; p.aerial=0; p.comboStep=0; return; } // 昇竜後はそのまま空中へ（→エリアルレイブ）
      p.state='idle'; p.z=0; p.riseVel=0;
      if(def.combo){ p.comboStep=def.combo; p.comboTimer=28; }
      else { p.comboStep=0; }
    }
    p.x=clamp(p.x, camX+24, Math.min(WORLD_END, camX+W-24));
    return;
  }
  // guard (auto-face nearest threat; raise shield; just-time = parry)
  if(K.grd && p.z<=0){
    if(p.state!=='guard') p.guardStart=gf;
    p.state='guard'; p.vx=0; p.charge=0; p.atkHeld=false;
    const ne=nearestEnemy(); if(ne) p.facing = ne.x<p.x?-1:1;
    if(pressed.atk){ pressed.atk=false; beginAttack('gcounter'); return; }   // ガード中に攻撃＝ガードカウンター
    return;
  }
  // jump start
  if(pressed.jump && p.z<=0){ pressed.jump=false; p.state='jump'; p.vz=17; p.jAtk=0; p.aerial=0; p.charge=0; sfx.dash(); return; }

  const SH=p.kind==='shima';
  // ---- charge release ----
  if(p.atkHeld && !K.atk){ p.atkHeld=false;
    if(p.charge>=0.45){ if(SH) beginHadou(); else beginAttack(chargeMoveFor(p)); p.charge=0; return; }   // 波動拳 / 溜め斬り（武器別）
    p.charge=0;
  }
  // ---- grab button (掴み) ----
  if(pressed.grab){ pressed.grab=false; tryGrab(); return; }
  // ---- attack press (edge-triggered) ----
  if(pressed.atk){
    pressed.atk=false;
    const fwd=(p.facing>0&&K.right)||(p.facing<0&&K.left);
    if(rotationReady() && p.dim>0){ if(SH) beginSeven(); else beginAttack('dimension'); consumeCmd(); return; } // 七死ワン生 / 次元斬
    if(K.down && p.z<=0){ if(SH) beginAttack('sdropkick'); else beginSlide(); if(!SH) return; p.atkHeld=true; return; } // ドロップキック / スライディング
    if(K.up){ beginAttack(SH?'tornado':'shoryu'); }                                      // 昇竜旋風脚 / 昇竜拳
    else if(stingerReady(p.facing)){ beginAttack(SH?'spindash':'stinger'); consumeCmd(); } // グルグルパンチ突進 / スティンガー
    else if(fwd){ const cs=comboSet(p); if(cs){ beginAttack(cs[cs.length-1]); }            // 武器持ち＝強攻撃（武器フィニッシュ）
      else if(SH){ beginAttack('spunch'); } else { beginRush(); return; } }                // 正拳突き / 素手乱舞
    else { const maxc=comboMaxFor(p); const next=(p.comboTimer>0 && p.comboStep<maxc)? p.comboStep+1:1; beginAttack(comboMoveFor(p,next)); }
    p.atkHeld=true; p.atkHoldF=0;
    return;
  }
  // build charge while holding atk and standing
  if(K.atk && p.atkHeld){ p.atkHoldF++; if(p.atkHoldF>8){ p.charge=clamp(p.charge+0.022,0,1); if(p.atkHoldF%8===0) sfx.charge(); } }
  else if(!K.atk){ p.atkHeld=false; }

  // movement (horizontal only — single lane)
  let mx=0,my=0;
  if(K.left)mx=-1; if(K.right)mx=1;
  if(mx)p.facing=mx;
  if(mx){ p.charge=0; } // moving cancels charge build (but keep simple)
  const slow = p.charge>0.1?0.4:1;
  p.x+=mx*SPEED*slow; p.y=LANE;
  p.x=clamp(p.x, camX+24, Math.min(WORLD_END, camX+W-24));
  p.state=mx?'walk':'idle'; p.anim+=mx?0.26:0.07;
  if(mx&&gf%8===0) dust(p.x,p.y, 1);
}
const REACH=1.62, HH=1.42;   // hit ranges scaled up for larger sprites
function doPlayerHit(a){
  const p=player, def=a.def, W=WEAPONS[p.weapon]||WEAPONS.dagger;
  const reach=def.reach*REACH*W.reach, hh=def.hh*HH;
  const hx=p.x+p.facing*reach*0.45;
  const dmgMul=((def.counter&&p.counterPow)?1.6:1)*W.dmg, LX=W.launch;
  enemies.forEach(e=>{
    if(e.dead) return;
    if(def.multi){ if(a.lastHit[e.id] && gf-a.lastHit[e.id]<(def.multiGap||8)) return; }
    else if(a.hitSet.has(e.id)) return;
    if(Math.abs(e.y-p.y)>hh) return;
    const canHigh = def.rise||def.special||def.launch;
    if(!canHigh && e.z>175) return;                                          // 高く浮いた敵は打上げ/空中技で拾う
    let dir=p.facing;
    if(def.omni){ if(Math.abs(e.x-p.x)>reach) return; dir=e.x<p.x?-1:1; }   // 全方位
    else { const dx=e.x-hx, back=Math.max(16, reach*0.32);   // 近接マージンはリーチに比例（長武器でも至近を打てる）
      if(p.facing>0 && (dx<-back || dx>reach)) return;
      if(p.facing<0 && (dx>back || dx<-reach)) return; }
    if(def.multi) a.lastHit[e.id]=gf; else a.hitSet.add(e.id);
    // 盾犬兵: 正面からの通常攻撃はガードで防がれる（重撃・必殺技はガード崩し）
    if(e.state==='guard' && e.facing===-dir){
      if(def.knock||def.aoe||def.finisher||def.special||def.counter){
        e.state='hurt'; e.hurtTimer=20; e.stun=24; e.guardCd=90;
        spark(e.x,e.y-e.h*0.5,'#fff',12,8); popText(e.x,e.y-e.h-8,'GUARD BREAK','#ffd24d',true); sfx.big();
        damageEnemy(e,def.dmg*dmgMul,def.kb*dir*W.kb,def.knock,def.launch);
      } else {
        sfx.guard(); spark(e.x-dir*12,e.y-e.h*0.5,'#bfe9ff',7); p.vx=-dir*1.4;
        popText(e.x,e.y-e.h-6,'GUARD','#9fd6ff');
      }
      return;
    }
    damageEnemy(e,def.dmg*dmgMul,def.kb*dir*W.kb,def.knock,def.launch);
    if(def.special) hitStop=Math.max(hitStop,5);
    if(def.counter&&p.counterPow){ popText(e.x,e.y-e.h-12,'COUNTER!','#bfe9ff',true); triggerSlow(18); }
    // ── フィニッシュ/必殺は強ベクトルで画面端・天井まで吹き飛ばし → バウンドでジャグル ──
    if(!e.dead){
      if(def.shoryu) launchEnemy(e, dir*4*LX, -24*LX, 4);   // 一緒に打ち上げ → 空中コンボへ
      else if(def.finisher) launchEnemy(e, dir*26*LX, -13*LX, 4);
      else if(def.aoe) launchEnemy(e, dir*30*LX, -10*LX, 4);
      else if(def.stinger) launchEnemy(e, dir*28*LX, -7*LX, 4);
      else if(def.counter) launchEnemy(e, dir*26*LX, -12*LX, 4);
      else if(def.special) launchEnemy(e, (Math.random()<.5?dir:-dir)*18, -15, 4);
      else if(e.state==='air'||e.z>6) launchEnemy(e, dir*20*W.kb*0.7, Math.min(e.vz,-8), Math.max(e.bounces||0,3));  // 空中の敵は各ヒットで再び端まで吹き飛ばす
      else if(W.launch>1.4) launchEnemy(e, dir*10, -7, 3);   // ハンマーは通常ヒットでも軽く浮かせる
    }
    crescent(e.x-dir*6, e.y-e.h*0.5, reach*0.5, def.omni?def.from:def.from*dir, def.omni?def.to:def.to*dir, def.trail);
  });
}
function nearestEnemy(){ let best=null,bd=1e9; for(const e of enemies){ if(e.dead)continue;
  const d=Math.abs(e.x-player.x)+Math.abs(e.y-player.y)*0.6; if(d<bd){bd=d;best=e;} } return best; }
function doParry(e,p){ if(!p)p=player;
  e.state='hurt'; e.hurtTimer=84; e.stun=120; e.telegraph=0; e.atkTimer=0; e.vx=p.facing*2.4;
  spark(p.x+p.facing*30,p.y-58,'#ffffff',18,9); ring(p.x+p.facing*26,p.y-58,'#bfe9ff'); ring(p.x+p.facing*26,p.y-58,'#ffffff');
  popText(e.x,e.y-e.h-12,'PARRY!','#9ff0ff',true);
  hitStop=14; flash=Math.max(flash,3); shake=4; sfx.guard(); sfx.rise();
  p.charge=clamp(p.charge+0.34,0,1); p.parryFx=16; score+=120; }
function jumpAttackHit(){ const p=player; const kab=p.jKabuto, dn=p.jDown, drop=p.jDrop, ham=p.jHammer, hya=p.jHyaku;
  let pogo=false;
  enemies.forEach(e=>{ if(e.dead||p.jHit.has(e.id))return;
    if(Math.abs(e.y-p.y)> (dn?70:(hya?64:56))) return; const dx=e.x-p.x;
    const reach=dn?56:(drop?108:(kab?112:(ham?96:(hya?110:98))));
    const back=(dn||ham)?34:(hya?40:28);
    if(p.facing>0&&(dx<-back||dx>reach))return; if(p.facing<0&&(dx>back||dx<-reach))return;
    p.jHit.add(e.id);
    if(dn){ damageEnemy(e,15,p.facing*3,true); e.state='down'; e.downTimer=46;        // 下突き：突き刺して
      crescent(e.x,e.y-e.h*0.5,40,1.1,2.0,'#aef0ff'); pogo=true; }                     // ヒットで跳ね返る（ポゴ）
    else if(ham){ damageEnemy(e,24,p.facing*2,true); if(!e.dead) launchEnemy(e, p.facing*4, -12, 3);   // ダブルハンマー：叩いて地面バウンド
      crescent(e.x,e.y-e.h*0.5,54,-1.4,1.4,'#ffd24d'); hitStop=Math.max(hitStop,6); shake=Math.max(shake,7); }
    else if(hya){ damageEnemy(e,5,p.facing*1,false); if(!e.dead){ e.vx=p.facing*2.4; if(e.z<2){ e.z=2; e.vz=Math.max(e.vz,1.2); } }   // 巨大百裂拳：連打で押し込む
      crescent(e.x,e.y-e.h*0.5,52,-0.6,0.9,'#ffd24d'); }
    else if(drop){ damageEnemy(e,18,p.facing*4,true); if(!e.dead) launchEnemy(e, p.facing*24, -7, 3);   // ドロップキック：大きく蹴り飛ばす
      crescent(e.x,e.y-e.h*0.5,50,-0.3,0.6,'#9fe8ff'); hitStop=Math.max(hitStop,5); }
    else if(kab){ damageEnemy(e,20,p.facing*4,true); e.vz=0; e.z=0; e.state='down'; e.downTimer=70; // 兜割：地面に叩き伏せる
      crescent(e.x,e.y-e.h*0.5,52,-1.6,1.5,'#fff0c0'); }
    else { damageEnemy(e,12,0,false); if(!e.dead) launchEnemy(e, p.facing*7, -9, Math.max(e.bounces||0,2));   // 空中斬り：浮かせ続けてエリアルレイブ
      crescent(e.x,e.y-e.h*0.5,46,-0.7,0.9,'#ffffff'); } });
  if(dn&&pogo){ p.vz=9.5; p.jAtk=0; p.jHit=new Set(); }   // 跳ね返って再度突きを狙える
}
function hammerLand(){ const p=player;
  spark(p.x,p.y,'#ffd24d',16,10); ring(p.x,p.y,'#ffd24d'); dust(p.x,p.y,12); shake=8; hitStop=7; sfx.big();
  enemies.forEach(e=>{ if(e.dead||e.grabbedBy)return; if(Math.abs(e.x-p.x)<82 && Math.abs(e.y-p.y)<40){ damageEnemy(e,10,Math.sign(e.x-p.x||p.facing)*7,true); if(!e.dead&&e.z<2){ e.z=2; e.vz=Math.max(e.vz,2); } } }); }
function kabutoLand(){ const p=player;
  spark(p.x,p.y,'#fff0c0',18,11); ring(p.x,p.y,'#ffd24d'); dust(p.x,p.y,14); shake=9; hitStop=8; sfx.big();
  enemies.forEach(e=>{ if(e.dead||e.grabbedBy||e.z>10)return; if(Math.abs(e.x-p.x)<76 && Math.abs(e.y-p.y)<40){ damageEnemy(e,12,Math.sign(e.x-p.x||p.facing)*9,true); } }); }

//======================================================================
//  Grab / throw system  (掴み → 腹パンチ / 投げ / 地獄グルマ)
//======================================================================
function grabbableTarget(){ const p=player; let best=null,bd=1e9;
  for(const e of enemies){ if(e.dead||e.grabbedBy) continue; const t=ETYPE[e.type]; if(t.boss) continue;
    if(e.z>8||e.state==='air'||e.state==='pounce') continue;
    const dx=e.x-p.x; if(Math.sign(dx)!==p.facing && Math.abs(dx)>8) continue;
    if(Math.abs(dx)>54 || Math.abs(e.y-p.y)>26) continue;
    const d=Math.abs(dx); if(d<bd){ bd=d; best=e; } }
  return best;
}
function tryGrab(){ const p=player; const e=grabbableTarget();
  if(!e){ sfx.swing(0); spark(p.x+p.facing*30,p.y-30,'#cfd8e6',5,4); return; }   // whiff
  p.state='grab'; p.grabEnemy=e; p.grabT=180; p.punch=0; p.grabSub='hold'; p.grabAnim=0;
  e.state='grabbed'; e.grabbedBy=1; e.vx=0; e.vz=0; e.z=0; e.stun=40; e.telegraph=0; e.atkTimer=0;

  if(players.some(p=>p.active && p.kind==='shima')) pool.push('nunchaku','tonfa');

}

function updateEnemies(){

    // air physics (juggle): z=height above ground, vz<0 = rising
    if(e.state==='air'||e.state==='pounce'||e.z>0){ e.z=Math.max(0,e.z - e.vz); e.vz+=0.9; }
    if(e.dead){ e.deadTimer--; e.x+=e.vx; e.vx*=0.86; if(e.z>0){e.vz+=0.9;e.z=Math.max(0,e.z-e.vz);} if(e.deadTimer<=0)enemies.splice(i,1); continue; }
    if(e.zankai>0){ e.zankai--; if(gf%6<3)spark(e.x,e.y-e.h*0.95,'#ff4d6a',2,4); if(e.zankai<=0){ zankaiBoom(e); continue; } }   // 残悔拳カウントダウン
    if(e.grabbedBy){ if(e.stun>0)e.stun--; continue; }          // held by player — suspend AI
    if(e.stun>0)e.stun--; if(e.guardCd>0)e.guardCd--;
    if(e.state==='air'){ e.x+=e.vx; e.vx*=0.994;                       // 空気抵抗を抑え、飛距離を保つ
      // ── 天井バウンド（同程度の距離を跳ね返す）──
      if(e.z>=CEIL_Z && e.vz<0){ e.z=CEIL_Z; e.vz=-e.vz*0.9; e.vx*=0.96; if((e.bounces||0)>0)e.bounces--; spark(e.x,e.y-e.z,'#fff',14,9); ring(e.x,e.y-e.z,'#ffd24d'); shake=Math.max(shake,5); sfx.hit(); popText(e.x,e.y-e.z-10,'天井!','#ffd24d'); }
      // ── 画面端バウンド（同程度の距離を跳ね返す）──
      const lpad=camX+30, rpad=camX+W-30;
      if((e.x<lpad&&e.vx<0)||(e.x>rpad&&e.vx>0)){ e.x=clamp(e.x,lpad,rpad); e.vx=-e.vx*0.92; if((e.bounces||0)>0)e.bounces--; spark(e.x,e.y-e.z,'#fff',12,9); ring(e.x,e.y-e.z,'#9fe8ff'); shake=Math.max(shake,5); sfx.hit(); popText(e.x,e.y-e.z-10,'壁!','#9fe8ff'); }
      // ── 床バウンド ──
      if(e.z<=0){ const impact=e.vz;

        else { e.z=0; e.vz=0; e.state='down'; e.downTimer=46; e.bounces=0; dust(e.x,e.y,8); } }

    if(e.state==='down'){ e.downTimer--; e.x+=e.vx; e.vx*=0.85; if(e.downTimer<=0)e.state='walk'; continue; }

      if(e.crouchT<=0){ const dd=Math.abs(p.x-e.x); e.state='pounce'; e.vz=-13; e.vx=e.facing*clamp(dd*0.05+4,5,11); e.pounceHit=false; sfx.dash(); } continue; }

    if(t.guarder && dist<t.atkR+72 && e.guardCd<=0 && e.stun<=0 && (p.state==='attack'||Math.random()<0.02)){ e.state='guard'; e.guardT=rnd(36,72); e.guardCd=rnd(90,150); continue; }
    const spd=t.sp*1.35*(0.8+0.34*Math.sin(e.bob*1.3));        // faster to match player; pulsed
    if(dist>t.atkR-6){ e.x+=Math.sign(dx)*spd; }
    else if(dist<t.atkR-34 && Math.random()<0.03){ e.x-=Math.sign(dx)*spd*0.9; }   // feint back-step
    e.y=LANE;
    if(e.z<=0 && dist>t.atkR && Math.random()<(e.type==='hyena'?0.03:0.008)){ e.vz=-6; }  // chase hop
    e.thinkCd--;

  }
  // separation
  for(let a=0;a<enemies.length;a++)for(let b=a+1;b<enemies.length;b++){ const e1=enemies[a],e2=enemies[b];
    if(e1.dead||e2.dead||e1.z>4||e2.z>4||e1.grabbedBy||e2.grabbedBy||e1.state==='pounce'||e2.state==='pounce'||ETYPE[e1.type].boss||ETYPE[e2.type].boss)continue;
    if(Math.abs(e1.y-e2.y)<18&&Math.abs(e1.x-e2.x)<30){ const push=e1.x<e2.x?-0.5:0.5; e1.x+=push*0.6; e2.x-=push*0.6; } }
}
// Shared melee resolver: front-arc check + guard/parry + slide/i-frame dodge. reach<0 = AoE (no facing check).
function hitOnePlayer(p,e,dmg,knock,reach,hh,unblock){
  if(!p.active||p.state==='down'||p.state==='dead'||p.state==='wheel'||p.invuln>0||p.state==='slide'||p.z>14) return false;
  if(Math.abs(p.y-e.y)>(hh||34)) return false;
  const dx=p.x-e.x;
  if(reach>=0){ if(Math.sign(dx)!==e.facing&&Math.abs(dx)>10) return false; if(Math.abs(dx)>reach) return false; }
  else if(Math.abs(dx)>-reach) return false;                   // AoE radius = -reach
  const fromFront = Math.sign(dx)===-p.facing;
  if(p.state==='guard' && fromFront){
    if(gf-p.guardStart<=9){ doParry(e,p); return true; }        // just-time guard → PARRY（ガー不もパリィなら防げる）
    if(!unblock){ sfx.guard(); spark(p.x+p.facing*24,p.y-46,'#9fd6ff',8); p.vx=e.facing*1.8; shake=3; resetCombo(); p.guardFx=8; return true; }
    popText(p.x,p.y-70,'GUARD CRUSH!','#ff4d6a',true); flash=Math.max(flash,4);
  }
  hurtPlayer(p,dmg,e.facing,knock); return true;
}
// hit whichever player(s) are in range; returns true if any connected
function tryHitPlayer(e,dmg,knock,reach,hh,unblock){
  let hit=false;
  for(const p of players){ if(!p.active) continue; if(hitOnePlayer(p,e,dmg,knock,reach,hh,unblock)){ hit=true; if(reach>=0) break; } } // AoE(<0) hits both
  return hit;
}
function pounceStrike(e){ const t=ETYPE[e.type]; tryHitPlayer(e,t.dmg,true,t.atkR*0.5+30,46); }
function enemyAttackHit(e){ const t=ETYPE[e.type]; tryHitPlayer(e,t.dmg,t.boss||t.charge,t.atkR*1.3+18,40); }

const MV={
  clawCombo:{tele:18,dur:28,minR:0,maxR:130}, heavySwing:{tele:22,dur:26,minR:0,maxR:150},
  darkSwipe:{tele:18,dur:30,minR:0,maxR:150}, roar:{tele:10,dur:20,minR:0,maxR:1300},
  lunge:{tele:16,dur:20,minR:110,maxR:560}, bodyCharge:{tele:24,dur:26,minR:110,maxR:640},
  dashThrust:{tele:16,dur:18,minR:90,maxR:520}, tripleStep:{tele:16,dur:30,minR:40,maxR:380},
  groundSlam:{tele:22,dur:46,minR:0,maxR:560}, darkSlam:{tele:22,dur:46,minR:0,maxR:560},
  fireball:{tele:18,dur:24,minR:120,maxR:1000}, flameSpread:{tele:24,dur:28,minR:120,maxR:1000},
  meteor:{tele:28,dur:34,minR:150,maxR:1300}, spearThrow:{tele:18,dur:22,minR:140,maxR:1000},
  orbSpread:{tele:20,dur:26,minR:120,maxR:1100}, darkBeam:{tele:26,dur:26,minR:120,maxR:1200},
  teleSlash:{tele:14,dur:28,minR:0,maxR:1300}, summon:{tele:24,dur:28,minR:220,maxR:1300},
  unblockSmash:{tele:32,dur:36,minR:0,maxR:220,danger:1}, bossGrab:{tele:26,dur:30,minR:0,maxR:96,danger:1},
};
function pickBossMove(e,dist){ const list=BOSSMOVES[ETYPE[e.type].bossKind]||[];
  const cands=list.filter(m=>MV[m] && dist>=MV[m].minR && dist<=MV[m].maxR);
  if(!cands.length) return null;
  // avoid repeating the same move back-to-back when possible
  let pool=cands.filter(m=>m!==e.lastMove); if(!pool.length)pool=cands;
  return pool[Math.floor(Math.random()*pool.length)];
}
function startBossMove(e){ e.slammed=false; e.lastMove=e.moveName;
  if(e.moveName==='groundSlam'||e.moveName==='darkSlam') e.vz=-13;
  if(e.moveName==='teleSlash'){ const tp=nearestPlayerTo(e.x); e.vanish=12; e.x=tp.x - tp.facing*72; e.y=clamp(tp.y,GROUND_TOP,GROUND_BOT); e.facing=e.x<tp.x?1:-1; spark(e.x,e.y-e.h*0.5,'#c46bff',18,9); sfx.boss(); } }
function bArc(e,reach,hh,dmg,knock,col){ const t=ETYPE[e.type], dir=e.facing, ex=e.x+dir*reach*0.6, ey=e.y-e.h*0.45;
  crescent(ex,ey,reach*0.6, dir>0?-0.85:Math.PI-0.85, dir>0?0.85:Math.PI+0.85, col||t.accent);
  spark(ex,ey,col||t.accent,8,7); tryHitPlayer(e,dmg,knock,reach,hh); }
function bShock(e,radius,dmg){ const t=ETYPE[e.type]; ring(e.x,e.y,t.accent); ring(e.x,e.y,'#fff'); dust(e.x,e.y,14); spark(e.x,e.y,'#fff',18,10);
  shake=Math.max(shake,8); flash=Math.max(flash,2); tryHitPlayer(e,dmg,true,-radius,radius*0.7); }
function bOrbs(e,n,spreadDeg,spd,dmg,col){ const t=ETYPE[e.type], dir=e.facing, tp=nearestPlayerTo(e.x);
  const ang=Math.atan2(tp.y-e.y, tp.x-e.x);
  for(let i=0;i<n;i++){ const a=ang+(i-(n-1)/2)*(spreadDeg*Math.PI/180);
    spawnProj(e.x+dir*22, e.y, Math.cos(a)*spd, Math.sin(a)*spd*0.4, {dmg,color:col||t.accent,r:11,life:180,zz:54}); }
  sfx.swing(0); }
function bMeteor(e,n,dmg,col){ const tp=nearestPlayerTo(e.x); for(let i=0;i<n;i++) spawnProj(tp.x+rnd(-180,180), clamp(tp.y+rnd(-12,12),GROUND_TOP,GROUND_BOT), rnd(-1,1), 0, {dmg,color:col||'#ffb02e',r:12,life:60,zz:185,vzz:-7.5}); }
function bBeam(e,dmg,col){ const t=ETYPE[e.type], dir=e.facing; spawnProj(e.x+dir*30, e.y, dir*13, 0, {dmg,color:col||t.accent,r:18,life:100,zz:60}); sfx.boss(); shake=Math.max(shake,5); }
function bSummon(e){ for(let i=0;i<2;i++) spawnEnemy(i?'hyena':'wolf', e.x+rnd(-70,70), clamp(e.y+rnd(-20,20),GROUND_TOP,GROUND_BOT)); ring(e.x,e.y-e.h*0.5,'#c46bff'); }
// ガード不能の特大斬撃（パリィのみ防御可）
function bUnblock(e,reach,hh,dmg){ const dir=e.facing, ex=e.x+dir*reach*0.6, ey=e.y-e.h*0.45;
  crescent(ex,ey,reach*0.7, dir>0?-1.05:Math.PI-1.05, dir>0?1.05:Math.PI+1.05, '#ff4d6a');
  ring(ex,ey,'#ff4d6a'); ring(ex,ey,'#fff'); spark(ex,ey,'#ff4d6a',16,10); shake=Math.max(shake,8); flash=Math.max(flash,3);
  tryHitPlayer(e,dmg,true,reach,hh,true); }
// 掴み投げ（ガード不能・パリィのみ回避）：命中で大ダメージ＋叩きつけ
function bThrow(e,dmg){ const t=ETYPE[e.type]; spark(e.x+e.facing*28,e.y-e.h*0.5,'#ff8a3a',14,9); ring(e.x+e.facing*24,e.y-e.h*0.5,'#ff8a3a');
  const hit=tryHitPlayer(e,dmg,true,t.atkR*0.8,42,true); if(hit){ shake=Math.max(shake,9); hitStop=Math.max(hitStop,6); } }
function runBossMove(e){ const t=ETYPE[e.type], n=e.moveName, f=e.moveT;
  if(e.z>0) e.x+=Math.sign(nearestPlayerTo(e.x).x-e.x)*2;         // air tracking
  switch(n){
    case 'clawCombo': if(f===7)bArc(e,82,42,13,false); if(f===18)bArc(e,92,46,t.dmg,true); break;
    case 'heavySwing': if(f<10)e.x+=e.facing*1.6; if(f===15)bArc(e,t.atkR+12,52,t.dmg,true); break;
    case 'darkSwipe': if(f===8)bArc(e,92,44,12,false); if(f===20)bArc(e,104,50,t.dmg,true); break;
    case 'lunge': if(f<14){ e.x+=e.facing*9; if(f%3===0)bArc(e,62,40,12,true); } break;
    case 'bodyCharge': if(f<18){ e.x+=e.facing*8; if(f%4===0)bArc(e,72,46,t.dmg,true);} break;
    case 'dashThrust': if(f<10)e.x+=e.facing*12; if(f===11)bArc(e,t.atkR,46,t.dmg,true); break;
    case 'tripleStep': if(f===5||f===14||f===23){ e.x+=e.facing*15; bArc(e,t.atkR-10,42,11,false);} break;
    case 'groundSlam': case 'darkSlam':
      if(f>2 && e.z<=0 && !e.slammed){ e.slammed=true; bShock(e,150,t.dmg); } break;
    case 'fireball': if(f===14)bOrbs(e,1,0,8,t.dmg); break;
    case 'flameSpread': if(f===16)bOrbs(e,3,16,7,t.dmg-2); break;
    case 'meteor': if(f===18)bMeteor(e,4,t.dmg-2); break;
    case 'spearThrow': if(f===12)bOrbs(e,1,0,11,t.dmg,'#aef8ff'); break;
    case 'orbSpread': if(f===14)bOrbs(e,3,18,8,t.dmg); break;
    case 'darkBeam': if(f===16)bBeam(e,t.dmg+4); break;
    case 'teleSlash': if(f===10)bArc(e,98,48,t.dmg,true,'#c46bff'); break;
    case 'summon': if(f===14)bSummon(e); break;
    case 'unblockSmash': if(f<14)e.x+=e.facing*3; if(f===18){ bUnblock(e,t.atkR+24,62,t.dmg+8); } break;
    case 'bossGrab': if(f<12)e.x+=e.facing*5; if(f===12){ bThrow(e,t.dmg+12); } break;
    case 'roar': if(f===6){ spark(e.x,e.y-e.h*0.6,t.accent,18,9); ring(e.x,e.y-e.h*0.5,t.accent); sfx.boss(); e.moveCd=Math.max(0,e.moveCd-30); } break;
  }
}
function bossTick(e,t){ const p=nearestPlayerTo(e.x), dx=p.x-e.x, dist=Math.abs(dx), kind=t.bossKind;
  e.anim+=0.16; e.bob+=0.1; if(e.vanish>0)e.vanish--;
  if(e.moveCd>0)e.moveCd--; if(e.stun>0)e.stun--;
  // ── per-boss signature flavor ──
  if(kind==='moloch' && gf%4===0) spark(e.x+rnd(-26,26), e.y-e.h*rnd(0.3,0.95), '#ff9a3a', 2, 4);
  else if(kind==='garm'){ if(e.hp<e.maxHp*0.35){ if(!e.rage){ e.rage=true; popText(e.x,e.y-e.h-10,'ENRAGE!','#ff4d3c',true); } if(gf%5===0) spark(e.x,e.y-e.h*0.5,'#ff4d3c',2,4); } }
  else if(kind==='vesper' && e.state==='bmove' && (e.moveName==='dashThrust'||e.moveName==='tripleStep') && gf%2===0) spark(e.x,e.y-e.h*0.45,'#aef8ff',2,3);
  else if(kind==='gigas' && e.state==='walk' && Math.sin(e.anim*1.0)>0.92 && gf%6===0){ shake=Math.max(shake,3); dust(e.x,e.y,4); }
  const rageMul=e.rage?1.4:1;
  if(e.state!=='bmove') e.facing=dx<0?-1:1;
  if(e.state==='bwind'){ e.moveT--; e.telegraph=Math.max(e.moveT,0);
    if(e.moveT<=0){ e.state='bmove'; e.moveT=0; e.telegraph=0; startBossMove(e); } return; }
  if(e.state==='bmove'){ runBossMove(e); e.moveT++;
    if(e.moveT>=e.moveMax){ e.state='walk'; e.moveCd=rnd(26,62)*(e.rage?0.6:1); e.vx=0; e.danger=false; } return; }  // より攻撃的に
  // ---- walk: approach + spacing ----
  const wantR=t.atkR*0.85;
  if(dist>wantR+30) e.x+=Math.sign(dx)*t.sp*1.3*rageMul;
  else if(dist<wantR-40) e.x-=Math.sign(dx)*t.sp*0.8;
  e.y=LANE;
  if(e.moveCd<=0 && e.stun<=0){ const mv=pickBossMove(e,dist);
    if(mv){ e.moveName=mv; const cfg=MV[mv]; e.danger=!!cfg.danger; e.state='bwind'; e.moveT=cfg.tele; e.teleMax=cfg.tele; e.moveMax=cfg.dur;
      if(mv!=='roar')sfx.heavy(); } }
}
function hurtPlayer(p,dmg,dir,knockdown){ if(!p)p=player; if(p.invuln>0||p.state==='dead')return;
  p.hp-=dmg; p.invuln=knockdown?64:38; p.vx=dir*4; shake=7; flash=Math.max(flash,4); sfx.hurt(); resetCombo();
  p.charge=0; p.atkHeld=false; spark(p.x,p.y-42,'#ff4444',9);
  if(p.hp<=0){ loseLife(p); return; }
  p.state=knockdown?'down':'hurt'; p.hurtTimer=14; p.downTimer=46; }
function loseLife(p){ if(!p)p=player; if(p.state==='dead')return; p.lives--; p.hp=0;
  if(p.grabEnemy){ p.grabEnemy.grabbedBy=0; p.grabEnemy=null; }
  p.state='dead'; p.downTimer=40; p.vz=8; p.riseVel=0;
  if(p.lives<0){ p.active=false; popText(p.x,p.y-100,(p.kind==='shima'?'シマダックス':'イッヌ')+' DOWN…','#ff5a5a',true);
    if(activePlayers().length===0) gameOver(); return; }
  p.respawnT=90; }

const combo={count:0,timer:0};
function addCombo(){ combo.count++; combo.timer=100; if(combo.count>=10)score+=5;
  if(combo.count===30 && player.dim<player.dimMax){ player.dim++; popText(player.x,player.y-120,'奥義ストック +1','#d6a6ff',true); ring(player.x,player.y-46,'#c46bff'); } }

//======================================================================
//  Projectiles  (boss 飛び道具 — ガード/スライド回避/パリィ反射に対応)
//======================================================================
// y = depth coordinate (like entities); zz = visual height above ground for draw/collision.
let projectiles=[];
function spawnProj(x,y,vx,vy,o){ o=o||{};
  projectiles.push({x,y,vx,vy,zz:(o.zz!=null?o.zz:56),vzz:o.vzz||0,explode:!!o.explode,
    life:o.life||150,r:o.r||11,dmg:o.dmg||10,color:o.color||'#d46bff',owner:o.owner||'enemy',spin:Math.random()*6,trail:[]}); }
// returns 'reflect' | 'gone' | null
function projVsPlayer(pr,p){
  if(!p.active||p.state==='dead') return null;
  const near = Math.abs(p.x-pr.x)<pr.r+14 && Math.abs(p.y-pr.y)<30 && pr.zz<64 && pr.zz>-8;
  const overIt = p.z > pr.zz+18;
  if(!near||overIt) return null;
  const dir=pr.vx>0?1:-1, fromFront=Math.sign(pr.x-p.x)===-p.facing;
  if(p.state==='slide'||p.invuln>0) return null;          // dodged
  if(p.state==='guard' && fromFront){
    if(gf-p.guardStart<=9){ pr.owner='player'; pr.vx=-pr.vx*1.5||(-p.facing*9); pr.vy*=-0.5; pr.vzz=0; pr.dmg=Math.max(pr.dmg,18); pr.color='#bfe9ff';
      spark(p.x+p.facing*22,p.y-40,'#fff',16,9); ring(p.x+p.facing*20,p.y-40,'#bfe9ff'); sfx.guard(); sfx.rise(); hitStop=10; popText(p.x,p.y-70,'REFLECT!','#9ff0ff',true); return 'reflect'; }
    sfx.guard(); spark(p.x+p.facing*22,p.y-44,'#9fd6ff',8); p.vx=dir*1.6; shake=3; p.guardFx=8; resetCombo(); return 'gone';
  }
  hurtPlayer(p,pr.dmg,dir,true); spark(pr.x,pr.y-pr.zz,pr.color,12,8); return 'gone';
}
function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){ const pr=projectiles[i];
    pr.x+=pr.vx; pr.y=clamp(pr.y+pr.vy,GROUND_TOP-4,GROUND_BOT+4); pr.zz+=pr.vzz; pr.life--; pr.spin+=0.4;
    pr.trail.push({x:pr.x,y:pr.y-pr.zz}); if(pr.trail.length>7)pr.trail.shift();
    if(pr.owner==='player'){
      // 下方向エネルギー弾：地面で爆発（範囲ダメージ）
      if(pr.explode && pr.zz<=2){ ring(pr.x,LANE,pr.color); ring(pr.x,LANE,'#fff'); spark(pr.x,LANE,pr.color,20,11); dust(pr.x,LANE,12); shake=Math.max(shake,7); flash=Math.max(flash,3); sfx.big();
        enemies.forEach(e=>{ if(e.dead||e.grabbedBy)return; if(Math.abs(e.x-pr.x)<90){ damageEnemy(e,pr.dmg+4,(e.x<pr.x?-1:1)*10,true); if(!e.dead)launchEnemy(e,(e.x<pr.x?-1:1)*14,-9,3); } });
        projectiles.splice(i,1); continue; }
      let hit=false;
      for(const e of enemies){ if(e.dead||e.grabbedBy)continue;
        if(Math.abs(e.x-pr.x)<e.w*0.5+pr.r && Math.abs(e.y-pr.y)<30 && pr.zz<e.h){ damageEnemy(e,pr.dmg,pr.vx>0?6:-6,true); hit=true; break; } }
      if(hit){ spark(pr.x,pr.y-pr.zz,pr.color,12,8); projectiles.splice(i,1); continue; }
    } else {
      let res=null; for(const p of players){ res=projVsPlayer(pr,p); if(res)break; }
      if(res==='reflect') continue;
      if(res==='gone'){ projectiles.splice(i,1); continue; }
    }
    if(pr.life<=0 || pr.x<camX-100 || pr.x>camX+W+100 || pr.zz<-30) projectiles.splice(i,1);

    ctx.fillStyle=radGrad(sx,sy,pr.r*1.8,'#ffffff',pr.color); ctx.beginPath(); ctx.arc(sx,sy,pr.r*1.8,0,7); ctx.fill();

//======================================================================
//  Camera
//======================================================================
function camFocusX(){ const ap=activePlayers().filter(p=>p.state!=='dead'); if(!ap.length) return players[0].x;
  let mn=1e9,mx=-1e9; ap.forEach(p=>{ mn=Math.min(mn,p.x); mx=Math.max(mx,p.x); }); return (mn+mx)/2; }
function updateCamera(){
  const target=clamp(camFocusX()-W*0.5,0,WORLD_END-W);
  const enc=encounters[encIndex];
  const maxC=(enc&&!enc.cleared&&enc.spawned)?clamp(enc.at-W*0.45,0,WORLD_END-W):WORLD_END-W;
  camX+=(Math.min(target,maxC)-camX)*0.12; camX=clamp(camX,0,WORLD_END-W);
  players.forEach(p=>{ if(p.active) p.x=clamp(p.x,camX+24,camX+W-24); });
}
function stepPlayers(){
  for(const pl of players){ if(!pl.active) continue;
    player=pl; useInput(pl.in);
    if(pl.state==='dead'){ pl.respawnT--; if(pl.respawnT<=0 && pl.lives>=0) resetPlayer(pl,false); }
    else { updatePlayer();
      if(pl.weaponT>0){ pl.weaponT--; if(pl.weaponT<=0){ const base=pl.kind==='shima'?'fists':'dagger'; if(pl.weapon!==base){ pl.weapon=base; popText(pl.x,pl.y-110, base==='fists'?'素手に戻った':'短剣に戻った','#cfd8e6'); } } } }
    saveInput(pl.in);
  }
  player=players[0];
}
function update(){
  gf++;
  if(hitStop>0){ hitStop--; if(state==='play'){updateParticles();updateProjectiles();} return; }
  if(state!=='play') return;
  stepPlayers(); updateEnemies(); updateProjectiles(); updateItems(); updateEncounters(); updateCamera(); updateCombo(); updateParticles();
  if(shake>0)shake-=0.7; if(flash>0)flash--; if(bossIntro>0)bossIntro--; if(goArrow>0)goArrow--; if(stageBanner>0)stageBanner--;
}

//======================================================================
//  ============ RENDERING ============
//======================================================================
function render(){
  ctx.save();
  if(shake>0) ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBackground(); drawGround();
  drawItems();
  const order=[...enemies.map(e=>({y:e.y,e}))];
  players.forEach(pl=>{ if(pl.active) order.push({y:pl.y+pl.pid*0.5, pl}); });
  order.sort((a,b)=>a.y-b.y);
  order.forEach(o=>{ if(o.pl){ player=o.pl;
      if(o.pl.state==='seven'){ const sx0=o.pl.x; ctx.save(); ctx.globalAlpha=0.32;   // 七体の分身残像
        for(let g=0;g<7;g++){ o.pl.x=clamp(camX+ (g+0.5)/7*W + Math.sin(gf*0.5+g)*16, camX+24, camX+W-24); drawPlayer(); }
        ctx.restore(); o.pl.x=sx0; }
      drawPlayer(); }
    else drawEnemy(o.e); });
  player=players[0];
  drawProjectiles();
  drawParticles();
  drawLighting();
  ctx.restore();
  if(flash>0){ ctx.fillStyle='rgba(255,90,80,'+(flash/12)+')'; ctx.fillRect(0,0,W,H); }
  drawHUD();
}

  for(let r=0;r<11;r++){ const y=GROUND_TOP+r*r*1.7+r*6; if(y>H)break;
    const sz=22+r*6, off=((-(camX)% sz)+sz)%sz + (r%2?sz/2:0);
    for(let x=-sz;x<W+sz;x+=sz){ const cxs=x-off+sz/2, cys=y+sz*0.34;
      ctx.fillStyle= (Math.floor((x-off)/sz)+r)%2? T.cob[0]:T.cob[1];
      ctx.beginPath(); ctx.ellipse(cxs,cys,sz*0.46,sz*0.30,0,0,7); ctx.fill();
      ctx.strokeStyle='rgba(40,34,28,.35)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.ellipse(cxs-sz*0.1,cys-sz*0.08,sz*0.28,sz*0.16,0,0,7); ctx.fill(); }
  }
  // top edge shadow (wall base)
  const es=ctx.createLinearGradient(0,GROUND_TOP-2,0,GROUND_TOP+16); es.addColorStop(0,'rgba(0,0,0,.35)'); es.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=es; ctx.fillRect(0,GROUND_TOP-2,W,18);
}
function drawLighting(){ // theme vignette + bloom
  const T=curTheme();
  const v=ctx.createRadialGradient(W/2,H*0.46,H*0.28,W/2,H*0.5,H*0.88);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,T.vig); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

//  Character art (shaded)

function softShadow(x,y,r){ const g=radGrad(x,y,r,'rgba(0,0,0,.34)','rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y+2,r,r*0.34,0,0,7); ctx.fill(); }
function furBall(x,y,r,inner,outer){ ctx.fillStyle=radGrad(x,y,r,inner,outer); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }

// ---- Player ----
const PI2=Math.PI/2;
// ---- Player: cute 2-head-tall chibi (feet at y=0, body grows upward) ----
function drawPlayer(){
  const p=player, s=depthScale(p.y)*0.94, sx=p.x-camX, sy=p.y, st=p.state, ph=p.anim;
  const blink=p.invuln>0&&Math.floor(p.invuln/4)%2===0; if(blink)ctx.globalAlpha=0.5;
  softShadow(sx,sy,26*s*(1-Math.min(p.z/130,0.5)));
  ctx.save(); ctx.translate(sx,sy-p.z); ctx.scale(p.facing*s,s);
  if(st==='down'||st==='dead'){ ctx.rotate(-0.9*p.facing); ctx.translate(0,9); }
  if(st==='wheel'){ ctx.rotate(p.wheelRot); }
  if(st==='screw'){ ctx.rotate(p.screwRot); }
  const _spec = st==='attack' && p.atk && p.atk.def.special;
  if(_spec){ ctx.rotate(Math.sin(p.atk.t*0.55)*0.28); }      // 次元斬の身体ブレ

  // ---------- pose params (swAng: 0=forward, +down) ----------
  let bodyY=0, bodyX=0, lean=0, swAng=-0.42, swExt=12, backArm=0.32, thF=0.14, thB=-0.14, kF=0.25, kB=0.25;
  let drawTrail=false, trailCol='#ffe9a0', tA0=0,tA1=0,tk=0, trailW=1, smear=0;
  let mode='blade';   // blade | shield | fist
  let faL1=9, faL2=8, faW=0.95, legF1=10, legF2=9, sqX=1, sqY=1;     // limb stretch & squash/stretch
  if(st==='walk'){ const w=Math.sin(ph*2); thF=w*0.7; thB=-w*0.7; kF=0.3+Math.max(0,w)*0.8; kB=0.3+Math.max(0,-w)*0.8;
    bodyY=-Math.abs(Math.sin(ph*2))*2; swAng=-0.42 - w*0.4; backArm=0.3 + w*0.6; lean=w*0.05; }
  else if(st==='idle'){ bodyY=Math.sin(ph*1.5)*1.3; swAng=-0.44+Math.sin(ph*1.5)*0.06; thF=0.16; thB=-0.16; }
  else if(st==='guard'){ bodyY=3; thF=0.46; thB=-0.46; kF=0.95; kB=0.95; lean=-0.12; swAng=1.05; backArm=-0.1; mode='shield'; }
  else if(st==='jump'){ thF=0.7; thB=0.45; kF=1.3; kB=1.55; bodyY=-2;
    if(p.jAtk>0){ const e=easeOut(1-p.jAtk/18); const big=Math.sin(clamp(1-p.jAtk/18,0,1)*Math.PI);
      if(p.jDown){ // 下突き：剣を真下に突き刺す（両脚を伸ばし直立）
        swAng=1.55; swExt=24*(1+0.8*big); trailCol='#aef0ff'; tA0=1.3; tA1=1.7; trailW=1.8;
        backArm=1.4; thF=0.25; thB=-0.05; kF=0.1; kB=0.1; sqY=1+0.12*big; sqX=1-0.08*big; bodyY=0;
      } else if(p.jKabuto){ // 兜割：頭上から真下への唐竹割り（両手で大上段）
        swAng=lerp(-1.95,1.7,e); swExt=22*(1+1.4*big); trailCol='#fff0c0'; tA0=-1.95; tA1=swAng; trailW=2.2;
        backArm=swAng-0.25; thF=0.5; thB=0.4; kF=0.8; kB=0.9; sqY=1+0.22*big; sqX=1-0.16*big; bodyY=-2-2*big;
      } else if(p.jHammer){ // ダブルハンマーパンチ：両腕を頭上から振り下ろす
        const hb=Math.sin(clamp(1-p.jAtk/22,0,1)*Math.PI), he=easeOut(clamp(1-p.jAtk/22,0,1));
        swAng=lerp(-1.95,1.65,he); swExt=22*(1+1.3*hb); trailCol='#ffd24d'; tA0=-1.95; tA1=swAng; trailW=2.6;
        backArm=swAng-0.12; thF=0.5; thB=0.4; kF=0.7; kB=0.85; sqY=1+0.2*hb; sqX=1-0.14*hb; bodyY=-2-2*hb;
        faL1=9+12*hb; faL2=8+15*hb; faW=0.95+1.0*hb;
      } else if(p.jHyaku){ // 巨大百裂拳：両拳を高速で連続突き出す
        const w=Math.sin(p.jAtk*1.5); swAng=0.05; trailCol='#ffd24d'; lean=0.16; bodyY=-1;
        thF=0.42; thB=-0.42; kF=0.7; kB=0.7; backArm=(w>0?-0.55:0.15);
        faL1=9+(w>0?15:2); faL2=8+(w>0?18:2); faW=0.95+(w>0?1.1:0.2);
      } else {
        swAng=lerp(-1.7,1.2,e); swExt=18*(1+1.1*big); trailCol='#fff'; tA0=-1.7; tA1=swAng;
        backArm=-1.3; faL1=9+11*big; faL2=8+14*big; faW=0.95+0.9*big; sqY=1+0.16*big; sqX=1-0.12*big; }
      drawTrail=true; tk=1-p.jAtk/18; }
    else { swAng=-1.0; backArm=-1.2; } }
  else if(st==='land'){ const k=clamp(p.landT/22,0,1); bodyY=10*(1-k*k)+2; thF=0.7; thB=-0.7; kF=1.5; kB=1.5; lean=0.1; swAng=0.9; backArm=0.5; sqX=1.14; sqY=0.8; }   // 着地硬直（深いしゃがみ）
  else if(st==='hurt'){ lean=-0.24; thF=-0.3; thB=0.3; swAng=-0.1; backArm=0.7; }
  else if(st==='slide'){ lean=-1.0; bodyY=8; thF=1.15; thB=0.25; kF=0.2; kB=1.3; swAng=0.7; backArm=0.1; sqX=1.12; sqY=0.82; }
  else if(st==='grab'){ thF=0.3; thB=-0.3; kF=0.4; kB=0.4; bodyY=1; mode='fist'; backArm=0.55;
      if(p.grabSub==='punch'){ const k=Math.sin(clamp(p.grabAnim/9,0,1)*Math.PI); swAng=0.05; faL1=9+5*k; faL2=8+7*k; faW=0.95+0.4*k; backArm=-0.1; bodyX=k*3; }
      else { swAng=0.25; } }
  else if(st==='wheel'||st==='screw'){ thF=0.95; thB=0.95; kF=1.4; kB=1.4; swAng=0.2; backArm=0.2; mode='fist'; }
  else if(st==='rush'){ mode='fist';
    if(p.rushPhase===2){ thF=1.5; thB=-0.25; kF=0.1; kB=0.5; lean=0.55; bodyY=-2; backArm=-0.4; swAng=0.3; }       // 砂かけ後ろ蹴り
    else if(p.rushPhase===1){ const w=Math.sin(p.rushT*1.3); lean=0.2; thF=0.55+Math.max(0,w)*1.0; kF=0.1; thB=-0.35; backArm=0.7; swAng=0.2; bodyY=-1; }  // 百烈脚
    else { const w=Math.sin(p.rushT*1.5); lean=0.18; thF=0.18; thB=-0.18; swAng=0.05; backArm=(w>0?-0.5:0.1); faL1=9+(w>0?7:0); faL2=8+(w>0?10:0); faW=0.95+(w>0?0.4:0); } } // 百裂拳
  else if(st==='hadou'){ mode='fist'; lean=0.18; swAng=0.05; backArm=0.05; thF=0.42; thB=-0.42; kF=0.7; kB=0.7; faL1=9+5; faL2=8+7; }   // 波動拳：両手前
  else if(st==='seven'){ mode='fist'; lean=0.1; thF=0.5; thB=-0.5; swAng=0.1; backArm=0.3; }   // 七死ワン生
  else if(st==='attack'){ const def=p.atk.def, t=p.atk.t, a0=def.act[0], a1=def.act[1];
    const e=easeOut(clamp((t-a0+2)/(a1-a0+4),0,1));
    const e2=Math.sin(clamp((t-(a0-3))/((a1+3)-(a0-3)),0,1)*Math.PI);   // strike bell 0→1→0
    const windup=clamp((a0-t)/Math.max(1,a0),0,1);                       // anticipation amount
    const heavy=(def.finisher||def.aoe||def.rise)?1.5:1.1, big=e2*heavy;
    swAng=lerp(def.from,def.to,e); swExt=def.len*0.55*(1+1.15*big);
    trailCol=def.trail; tA0=def.from; tA1=swAng; tk=clamp(t/def.dur,0,1); drawTrail=t<=a1+3; trailW=1.3+1.5*heavy; smear=big;
    lean=lerp(-0.40,0.42,e) - 0.22*windup; backArm=lerp(0.95,-1.35,e)-0.35*big;
    const fwd=(def.finisher||def.aoe)?1.05:0.72;
    thF=lerp(0.02,fwd,e)+0.22*big; thB=lerp(-0.02,-0.8,e)-0.45*big; kF=0.45; kB=0.3;
    bodyY=-2*e-4*windup; bodyX=7*big-3*windup;
    faL1=9+12*big; faL2=8+15*big; faW=0.95+1.0*big; legF1=10+6*big; legF2=9+6*big;
    sqX=1-0.16*big+0.10*windup; sqY=1+0.20*big-0.12*windup;
    if(def.rise){ thF=0.7+0.5*big; thB=0.6; kF=1.05; kB=1.4; bodyY=-3-7*big; legF1=10+9*big; legF2=9+10*big; } }

  const shima = p.kind==='shima';
  const shimaArmed = shima && (p.weapon==='nunchaku'||p.weapon==='tonfa');   // 拳法武器を装備中
  if(shima && !shimaArmed && (mode==='blade'||mode==='shield')) mode='fist'; // 素手時は拳のみ
  else if(shima && shimaArmed && mode==='shield') mode='fist';               // 武器持ちでもガードは拳で受ける
  const limbA = shima?'#8a5a30':'#e0d2ab', limbB = shima?'#7a4a24':'#ddcca0', bootB=shima?'#3a2410':'#5a4022';
  const limbF = shima?'#9a6a3a':'#efe2bc', bootF=shima?'#4a2e16':'#6b4f28', handCol=shima?'#9a6a3a':'#f1e7cc';
  ctx.translate(bodyX,0); ctx.scale(sqX,sqY); ctx.translate(0,bodyY);
  // ---------- back-to-front ----------
  if(!shima) drawCape(p,lean);
  poseArm(-5,-30, backArm, 9,8, limbA, 0.85);                      // far arm
  chibiLeg(-5, thB, kB, limbB, bootB);                             // far leg
  (shima?shimaBody:chibiBody)(lean);
  chibiLeg(6, thF, kF, limbF, bootF, legF1, legF2);               // near leg
  (shima?shimaHead:chibiHead)(lean);
  if(p.charge>0.05){ ctx.save(); ctx.globalAlpha=0.3+p.charge*0.4;
    ctx.fillStyle=radGrad(0,-40,22+p.charge*22,p.charge>=0.45?'rgba(255,230,90,.9)':'rgba(120,200,255,.7)','rgba(255,230,90,0)');
    ctx.beginPath(); ctx.arc(0,-40,22+p.charge*22,0,7); ctx.fill(); ctx.restore(); }
  // near arm + weapon / shield / fist
  if(mode==='shield'){
    const gh=poseArm(7,-30,1.05,9,8,'#eaddb6',0.9); drawBlade(gh.hx,gh.hy,1.05,11);
    const sh=poseArm(5,-31,-0.1,9,8,'#f1e7cc',0.95); drawShieldAt(sh.hx,sh.hy-1,p);
  } else {
    const hand=poseArm(6,-30, swAng, faL1,faL2, handCol,faW);
    if(mode==='fist') chibiFist(hand.hx,hand.hy, faW, handCol);
    else drawBlade(hand.hx,hand.hy,swAng,swExt);
  }
  if(drawTrail){ ctx.save(); ctx.translate(6,-30); const r=swExt+18;
    if(smear>0.25){ ctx.globalAlpha=0.22*smear; ctx.fillStyle=trailCol; ctx.beginPath(); ctx.arc(0,0,r+6,Math.min(tA0,tA1),Math.max(tA0,tA1)); ctx.arc(0,0,Math.max(2,r-14),Math.max(tA0,tA1),Math.min(tA0,tA1),true); ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle=trailCol; ctx.globalAlpha=0.55*(1-tk); ctx.lineWidth=(8*(1-tk)+3)*trailW; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,r, Math.min(tA0,tA1), Math.max(tA0,tA1)); ctx.stroke(); ctx.globalAlpha=1; ctx.restore(); }
  // ── 次元斬: 全方位を切り裂く回転刃 ──
  if(_spec){ const t=p.atk.t; ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){ const a=t*0.45 + i*(Math.PI/3); const rr=40+swExt;
      ctx.strokeStyle='rgba(198,107,255,'+(0.5)+')'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(0,-40, rr, a, a+0.9); ctx.stroke(); }
    ctx.globalAlpha=0.18; ctx.fillStyle=radGrad(0,-40,60+Math.sin(t*0.4)*8,'#fff','rgba(198,107,255,0)');
    ctx.beginPath(); ctx.arc(0,-40,60,0,7); ctx.fill(); ctx.restore(); }
  // ── 昇竜拳: 立ち昇る光柱 ──
  if(st==='attack' && p.atk.def.shoryu){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.5;
    const g=ctx.createLinearGradient(0,-30,0,-30-p.z-80); g.addColorStop(0,'rgba(255,226,122,0)'); g.addColorStop(.5,'rgba(255,226,122,.7)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(-7,-30-p.z-80,14,p.z+90); ctx.restore(); }
  // ── 乱舞: 百裂拳/百烈脚の残像 ──
  if(st==='rush' && p.rushPhase<2){ ctx.save(); const col=p.rushPhase?'#aef0ff':'#ffe9a0';
    for(let i=0;i<3;i++){ ctx.globalAlpha=0.5-i*0.13; const ex=18+i*9+Math.sin(p.rushT*1.4+i*1.7)*5;
      if(p.rushPhase){ ctx.strokeStyle=col; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(6,-14); ctx.lineTo(ex+10,-8-i*3); ctx.stroke();
        ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(ex+12,-8-i*3,5,4,0,0,7); ctx.fill(); }
      else { ctx.fillStyle=col; ctx.beginPath(); ctx.arc(ex+8,-28+i*3,5.5,0,7); ctx.fill(); } }
    ctx.globalAlpha=1; ctx.restore(); }
  ctx.restore(); ctx.globalAlpha=1;
}
function limbSeg(ax,ay,bx,by,w,col){ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); }
function poseArm(shX,shY,swordAng,l1,l2,col,wm){          // swordAng: 0=forward,+down
  const a=PI2-swordAng;                                   // convert to down-angle
  const ex=shX+Math.sin(a)*l1, ey=shY+Math.cos(a)*l1;     // elbow
  const bx=ex+Math.cos(a)*2, by=ey+Math.sin(a)*2+1;       // slight bend
  const hx=bx+Math.sin(a)*l2, hy=by+Math.cos(a)*l2;       // hand
  limbSeg(shX,shY,ex,ey,7*(wm||1),col); limbSeg(ex,ey,hx,hy,5.5*(wm||1),col);
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(hx,hy,3.4*(wm||1),0,7); ctx.fill();
  return {hx,hy};
}
function chibiLeg(hipX,thighAng,knee,col,boot,l1,l2){
  l1=l1||10; l2=l2||9; const hipY=-16;
  const kx=hipX+Math.sin(thighAng)*l1, ky=hipY+Math.cos(thighAng)*l1;
  const sa=thighAng - knee;
  const fx=kx+Math.sin(sa)*l2, fy=ky+Math.cos(sa)*l2;
  limbSeg(hipX,hipY,kx,ky,10,col);
  ctx.fillStyle='#cdbf95'; ctx.beginPath(); ctx.arc(kx,ky,3.6,0,7); ctx.fill();
  limbSeg(kx,ky,fx,fy,8,col);
  ctx.fillStyle=boot; ctx.beginPath(); ctx.ellipse(fx+2,fy+1,6,4.5,0,0,7); ctx.fill();
}
function chibiFist(hx,hy,sc,col){ sc=sc||1; ctx.fillStyle=col||'#f1e7cc'; ctx.beginPath(); ctx.arc(hx,hy,5.2*sc,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1.2; ctx.stroke(); }
// ---- シマダックス（サングラスのダックスフンド拳法家）の体と頭 ----
function shimaBody(lean){ ctx.save(); ctx.rotate(lean*0.22);
  const g=ctx.createLinearGradient(0,-34,0,-12); g.addColorStop(0,'#b07a44'); g.addColorStop(1,'#7a4e26');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,-23,14,15,0,0,7); ctx.fill();
  ctx.strokeStyle='#5a3818'; ctx.lineWidth=1.2; ctx.stroke();
  // 黒い横シマ模様（横縞のみ）
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,-23,14,15,0,0,7); ctx.clip();
  ctx.fillStyle='#241509'; for(const yy of [-30,-23,-16]){ ctx.fillRect(-15,yy-1.6,30,3.2); }
  ctx.restore();
  // 空手の黒帯
  ctx.fillStyle='#15151a'; ctx.fillRect(-13,-12,26,5);
  ctx.fillRect(-3,-12,4,10); ctx.fillRect(2,-12,4,10);
  ctx.restore();
}
function shimaHead(lean){ ctx.save(); ctx.translate(0,-46); ctx.rotate(lean*0.3);
  // 垂れ耳（ダックス）
  ctx.fillStyle='#5e3c20'; ctx.beginPath(); ctx.ellipse(-16,7,8,16,0.25,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16,7,8,16,-0.25,0,7); ctx.fill();
  // 頭
  furBall(0,-1,18,'#b07a44','#7a4e26');
  // 頭の黒い横シマ（横縞のみ）
  ctx.save(); ctx.beginPath(); ctx.arc(0,-1,18,0,7); ctx.clip();
  ctx.fillStyle='#241509'; for(const yy of [-13,-6]){ ctx.fillRect(-19,yy-1.4,38,2.8); } ctx.restore();
  // 長いマズル
  ctx.fillStyle='#c8966a'; ctx.beginPath(); ctx.ellipse(12,6,12,7,0,0,7); ctx.fill();
  ctx.fillStyle='#2a1810'; ctx.beginPath(); ctx.ellipse(22,5,3.4,2.7,0,0,7); ctx.fill();
  ctx.strokeStyle='#5a3818'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(12,9); ctx.lineTo(20,9); ctx.stroke();   // mouth line
  // サングラス
  ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-9,-2); ctx.lineTo(-16,-4); ctx.stroke();   // テンプル
  ctx.fillStyle='#0a0a0e'; ctx.beginPath(); ctx.ellipse(-3,-1,6.6,4.6,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(8.5,-1,6.6,4.6,0,0,7); ctx.fill();
  ctx.fillStyle='#15151a'; ctx.fillRect(2.5,-2.5,3.5,2.5);
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-5,-2.6,1.5,0,7); ctx.arc(6.5,-2.6,1.5,0,7); ctx.fill();
  ctx.restore();
}
function drawBlade(hx,hy,ang,ext){ const wk=player.weapon||'dagger';
  ctx.save(); ctx.translate(hx,hy); ctx.rotate(ang);
  if(wk==='spear'){ const L=ext*1.5+22;
    ctx.strokeStyle='#6a4a28'; ctx.lineWidth=3.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(L-10,0); ctx.stroke();
    ctx.fillStyle='#caa54a'; ctx.beginPath(); ctx.arc(L-10,0,3.2,0,7); ctx.fill();
    const bl=ctx.createLinearGradient(L-12,0,L+12,0); bl.addColorStop(0,'#ffffff'); bl.addColorStop(1,'#9fd6e6');
    ctx.fillStyle=bl; ctx.beginPath(); ctx.moveTo(L-12,-3.6); ctx.lineTo(L+13,0); ctx.lineTo(L-12,3.6); ctx.closePath(); ctx.fill();

// ---- Enemies dispatch ----
function drawEnemy(e){
  const t=ETYPE[e.type], s=depthScale(e.y), sx=e.x-camX, sy=e.y;
  let al=1; if(e.dead&&e.deadTimer<22) al=clamp(e.deadTimer/22,0,1); if(e.vanish>0) al=Math.min(al,0.35);
  ctx.globalAlpha=al;
  softShadow(sx,sy,(t.w*0.5)*s*(e.z>0?0.7:1));
  ctx.save(); ctx.translate(sx,sy-e.z); ctx.scale(e.facing*s,s);
  if(e.grabbedBy && player.state==='wheel'){ ctx.rotate(player.wheelRot+Math.PI); }   // 地獄グルマで一緒に回転
  if(e.grabbedBy && player.state==='screw'){ ctx.rotate(player.screwRot+Math.PI); }   // スクリューで一緒に回転
  if((e.state==='walk')&&e.z<=0) ctx.translate(0,-Math.abs(Math.sin(e.bob*1.3))*3);   // lively bob
  if(e.state==='down'||e.dead){ ctx.rotate(0.95); ctx.translate(0,8); }
  // telegraph = crouch+lean back (wind-up); attack/bmove = explosive lunge + stretch
  if(e.telegraph>0){ const w=1-e.telegraph/(e.teleMax||26); ctx.rotate(-0.18*(1-w)); ctx.translate(-9*(1-w),3*(1-w)); ctx.scale(1+0.10*(1-w),1-0.10*(1-w)); }
  else if(e.state==='attack'){ const w=clamp((e.atkMax-e.atkTimer)/6,0,1); const big=Math.sin(clamp((e.atkMax-e.atkTimer)/Math.max(1,e.atkMax),0,1)*Math.PI);
    ctx.translate(9*w+10*big,0); ctx.rotate(0.10*w); ctx.scale(1+0.16*big,1-0.12*big); }
  else if(e.state==='bmove'){ const big=Math.sin(clamp(e.moveT/Math.max(1,e.moveMax),0,1)*Math.PI); ctx.rotate(0.07); ctx.translate(6+8*big,0); ctx.scale(1+0.10*big,1-0.07*big); }
  else if(e.state==='crouch'){ ctx.scale(1,0.84); ctx.translate(0,5); }
  else if(e.state==='pounce'){ ctx.rotate(0.28); }
  if(t.boss){ if(t.bossKind==='emperor') drawBoss(e); else drawBigBoss(e); }
  else if(e.type==='bitter') drawBitter(e); else drawBeast(e);
  if(t.guarder) drawEnemyShield(e);
  ctx.restore();
  // wind-up warning ("!"); ガード不能技は紫＋「パリィ！」で警告
  if((e.telegraph>0||e.state==='crouch')&&!e.dead){ const fl=Math.floor(gf/4)%2, dg=e.danger;
    if(fl){ ctx.save(); ctx.globalAlpha=dg?0.42:0.30; ctx.globalCompositeOperation='lighter'; ctx.fillStyle=dg?'#c000ff':'#ff3020';
      ctx.beginPath(); ctx.ellipse(sx,sy-e.h*s*0.5-e.z, t.w*0.5*s, e.h*0.5*s, 0,0,7); ctx.fill(); ctx.restore(); }
    const bob=Math.sin(gf*0.5)*3; ctx.font='bold '+(26*s)+'px Trebuchet MS'; ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText('!',sx,sy-e.h*s-e.z-12+bob);
    ctx.fillStyle=dg?'#ff4dff':'#ffe23a'; ctx.fillText('!',sx,sy-e.h*s-e.z-12+bob);
    if(dg){ ctx.font='bold '+(13*s)+'px Trebuchet MS'; ctx.lineWidth=3; ctx.strokeStyle='#000'; ctx.strokeText('ガード不能！パリィ！',sx,sy-e.h*s-e.z-12+bob-22*s); ctx.fillStyle='#ff8aff'; ctx.fillText('ガード不能！パリィ！',sx,sy-e.h*s-e.z-12+bob-22*s); }
    ctx.textAlign='left'; }
  if(!t.boss&&!e.dead&&e.hp<e.maxHp){ const bw=38*s, hx=sx-bw/2, hy=sy-e.h*s-e.z-8;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(hx-1,hy-1,bw+2,5);
    ctx.fillStyle='#ff5a3c'; ctx.fillRect(hx,hy,bw*clamp(e.hp/e.maxHp,0,1),3); }
  ctx.globalAlpha=1;
}

// big, cathartic clawed foreleg that winds up then swings huge during the attack
function drawBeastClaw(e){ const t=ETYPE[e.type], atk=e.state==='attack', tele=e.telegraph>0;
  if(!atk&&!tele) return;
  let ang=-0.4, big=0;
  if(tele){ const w=1-e.telegraph/(e.teleMax||26); ang=-1.55+w*0.25; big=0.35+w*0.35; }
  else { const pr=clamp((e.atkMax-e.atkTimer)/Math.max(1,e.atkMax),0,1); big=Math.sin(pr*Math.PI); ang=lerp(-1.35,1.1,pr); }
  const acc=t.accent||'#ff6a3c', shX=6, shY=-40, a=PI2-ang, l1=13+big*18, l2=12+big*18;
  const ex=shX+Math.sin(a)*l1, ey=shY+Math.cos(a)*l1, pwx=ex+Math.sin(a)*l2, pwy=ey+Math.cos(a)*l2;
  if(atk&&big>0.25){ ctx.save(); ctx.globalAlpha=0.28*big; ctx.fillStyle=acc;
    ctx.beginPath(); ctx.arc(shX,shY,l1+l2+12,ang-0.6,ang+0.25); ctx.arc(shX,shY,8,ang+0.25,ang-0.6,true); ctx.closePath(); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle=shade(t.c1,6); ctx.lineWidth=11+big*9; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(shX,shY); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.strokeStyle=t.c2; ctx.lineWidth=9+big*9; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(pwx,pwy); ctx.stroke();
  ctx.save(); ctx.translate(pwx,pwy); ctx.rotate(ang);
  ctx.fillStyle=shade(t.c1,12); ctx.beginPath(); ctx.arc(0,0,6+big*4,0,7); ctx.fill();
  ctx.fillStyle='#f2efe6'; const cl=10+big*16;
  for(let i=-1;i<2;i++){ ctx.beginPath(); ctx.moveTo(2,i*5); ctx.lineTo(cl,i*6-1); ctx.lineTo(2,i*5+3.5); ctx.fill(); }

function drawBigBoss(e){ const t=ETYPE[e.type], kind=t.bossKind;

  if(kind==='garm'){ bRX=33;bRY=43;legW=16;legX=12;pald=34; }

function startCutscene(scenes,onDone){ cut={scenes,i:0,t:0,onDone}; cutAdvance=false; cutSkip=false; state='cut';

function nextCutScene(){ if(!cut)return; cut.i++; cut.t=0; sfx.swing(0);

  if(cutSkip){ cutSkip=false; cut.i=cut.scenes.length-1; const cb=cut.onDone; cut=null; if(cb)cb(); return; }
  if(cutAdvance){ cutAdvance=false; if(!full){ cut.t=Math.ceil(len*1.3); } else nextCutScene(); }
  else if(full && cut.t>len*1.3+240){ nextCutScene(); } }

function cutSky(idx,art){ const T=STAGE_THEME[clamp(idx,0,4)], sk=T.sky;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,sk[0]); g.addColorStop(.5,sk[1]); g.addColorStop(1,(art==='peace'||art==='city')?'#e9f3df':sk[2]);

  const dark=(art==='invade'||art==='fall');

  for(let i=0;i<14;i++){ const bw=80, x=i*bw, h=70+((i*53)%80), ty=H*0.62-h;
    ctx.fillRect(x,ty,bw-6,h+260); ctx.beginPath(); ctx.moveTo(x-6,ty); ctx.lineTo(x+bw/2-3,ty-26); ctx.lineTo(x+bw,ty); ctx.fill(); }
  ctx.fillStyle='rgba(0,0,0,.42)'; ctx.fillRect(0,H*0.80,W,H*0.2);
  if(dark){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(200,40,30,.16)'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  if(art==='peace'||art==='end'){ ctx.fillStyle='rgba(255,210,228,.7)'; for(let i=0;i<26;i++){ const px=(i*97+gf*1.3)%W, py=(i*53+gf*0.8)%H; ctx.beginPath(); ctx.ellipse(px,py,3,1.5,i,0,7); ctx.fill(); } }

  el.addEventListener('touchstart',e=>{ e.preventDefault(); const i=IN(); i.keys['_'+key]=true; mapKeysFor(pi);
    if(key==='atk')i.pressed.atk=true; if(key==='grab')i.pressed.grab=true; if(key==='jump')i.pressed.jump=true; },{passive:false});
  el.addEventListener('touchend',e=>{ e.preventDefault(); IN().keys['_'+key]=false; mapKeysFor(pi); },{passive:false}); }
bindBtn('bAtk','atk',0); bindBtn('bGrd','grd',0); bindBtn('bGrab','grab',0); bindBtn('bJmp','jump',0);
bindBtn('bAtk2','atk',1); bindBtn('bGrd2','grd',1); bindBtn('bGrab2','grab',1); bindBtn('bJmp2','jump',1);
function makeStick(stickId,pi){ const stick=document.getElementById(stickId); if(!stick)return; const nub=stick.querySelector('.nub');
  let id=null,scx=0,scy=0,lastTapDir=0,lastCard=-1,angPrev=null,accum=0; const IN=()=>players[pi].in;
  stick.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; id=t.identifier; const r=stick.getBoundingClientRect(); scx=r.left+r.width/2; scy=r.top+r.height/2; move(t); },{passive:false});
  stick.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===id) move(t); },{passive:false});
  stick.addEventListener('touchend',e=>{ for(const t of e.changedTouches) if(t.identifier===id){ id=null; nub.style.left='50%'; nub.style.top='50%'; const k=IN().keys; k['_l']=k['_r']=k['_u']=k['_d']=false; lastTapDir=0; lastCard=-1; angPrev=null; accum=0; mapKeysFor(pi); } },{passive:false});
  function move(t){ const i=IN(), k=i.keys; let dx=t.clientX-scx,dy=t.clientY-scy; const m=Math.hypot(dx,dy)||1,max=50,cl=Math.min(m,max);
    dx=dx/m*cl; dy=dy/m*cl; nub.style.left='calc(50% + '+dx+'px)'; nub.style.top='calc(50% + '+dy+'px)'; const th=16;
    const nl=dx<-th,nr=dx>th; if(nl&&lastTapDir!==-1){pushTapFor(i,-1);lastTapDir=-1;} if(nr&&lastTapDir!==1){pushTapFor(i,1);lastTapDir=1;} if(!nl&&!nr)lastTapDir=0;
    if(m>max*0.55){ const ang=Math.atan2(dy,dx); let card=(Math.round(ang/(Math.PI/2))+4)%4; card=[1,2,3,0][card];
      if(card!==lastCard){ pushCardFor(i,card); lastCard=card; }
      if(angPrev!==null){ let d=ang-angPrev; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; accum+=d; }
      angPrev=ang; if(Math.abs(accum)>=Math.PI*1.7){ i.stickRot=gf; accum=0; }
    } else { lastCard=-1; angPrev=null; accum=0; }
    k['_l']=nl; k['_r']=nr; k['_u']=dy<-th; k['_d']=dy>th; mapKeysFor(pi); }
}
makeStick('stick',0); makeStick('stick2',1);

//======================================================================
//  Resize
//======================================================================
function resize(){ setupCanvas(); const r=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*r)+'px'; cv.style.height=(H*r)+'px'; }
addEventListener('resize',resize); resize();

//======================================================================
//  Title attract render
//======================================================================
function drawTitleScene(){ drawBackground(); drawGround();
  // pose the player on title
  const sv=player.x; player.x=camX+200; player.y=470; drawPlayer(); player.x=sv; drawLighting(); }

//======================================================================
//  Main loop
//======================================================================
function loop(){
  if(state==='cut'){ gf++; updateCut(); ctx.clearRect(0,0,W,H); drawCut(); requestAnimationFrame(loop); return; }
  // slow-motion: throttle logic ticks while keeping render smooth
  if(slowmo>0 && state==='play' && hitStop<=0){
    slowmo--; slowAcc+=0.34;
    if(slowAcc>=1){ slowAcc-=1; update(); }
  } else { update(); }
  if(state==='title'){ ctx.clearRect(0,0,W,H); drawTitleScene(); }
  else render();
  requestAnimationFrame(loop);
}
buildEncounters(); loop();
</script>
