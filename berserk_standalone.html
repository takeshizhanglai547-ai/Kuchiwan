<script>/* js/rig.js */
'use strict';
/* =====================================================================
 *  rig.js ── 2D スケルタル・リグ（人型キャラを関節角度で描く）
 *
 *  ローカル座標: 原点=足元の地面、+x=向いている方向、y は下向きが正。
 *  角度(度): 0=真下, 90=前, 180=真上, -90=後ろ。  dir(a) = (sin a, cos a)
 *
 *  ポーズのキー:
 *    lean  胴体の前傾(度)         head 頭の傾き
 *    aF eF 前腕(手前側の腕)の上腕角度 / 肘の曲げ（前腕角度 = aF + eF）
 *    aB eB 奥側の腕
 *    lF kF 手前の脚: 太もも角度 / 膝の曲げ（すね角度 = lF - kF）
 *    lB kB 奥の脚
 *    w     武器角度（前腕基準の相対）  wAbs: 絶対角度で指定（こちら優先）
 *    wBack 1 のとき武器を体の後ろに描く
 *    grip  1 のとき奥の手を武器の柄へ自動で添える（両手持ち、IK）
 *    rot   全身の回転(度, +で前へ倒れる)  lift 全身の持ち上げ(px)
 *    hx    腰の前後オフセット(px)  drop 腰を下げる(px)
 *    cape  マントのはためき量(0..1.5)
 * ===================================================================== */
(function (BK) {
  const U = BK.U, D = U.DEG;
  const R = BK.rig = {};

  R.KEYS = ['lean', 'head', 'aF', 'eF', 'aB', 'eB', 'lF', 'kF', 'lB', 'kB', 'w', 'rot', 'lift', 'hx', 'drop', 'cape'];
  R.NEUTRAL = { lean: 4, head: 0, aF: 15, eF: 25, aB: -10, eB: 20, lF: 10, kF: 8, lB: -10, kB: 8, w: -40, rot: 0, lift: 0, hx: 0, drop: 0, cape: 0.3 };

  /** base にポーズ差分を上書きした新オブジェクト */
  R.merge = function (base, over) {
    const o = Object.assign({}, base);
    if (over) for (const k in over) o[k] = over[k];
    return o;
  };
  R.lerp = function (a, b, t) {
    const o = Object.assign({}, a);
    for (const k of R.KEYS) {
      const va = a[k], vb = b[k];
      if (va != null && vb != null) o[k] = va + (vb - va) * t;
      else if (vb != null) o[k] = vb;
    }
    if (b.wAbs != null && a.wAbs != null) o.wAbs = a.wAbs + (b.wAbs - a.wAbs) * t;
    else if (t >= 0.5) { o.wAbs = b.wAbs; }
    o.wBack = t < 0.5 ? a.wBack : b.wBack;
    o.grip = t < 0.5 ? a.grip : b.grip;
    return o;
  };

  const cache = new WeakMap();
  /**
   * キーフレーム列をサンプリング
   * frames: [[frame, poseDiff, ease?], ...]  ease は次のキーへ向かう補間 ('out' 既定)
   */
  R.sample = function (frames, f, base) {
    let c = cache.get(frames);
    if (!c || c.base !== base) {
      c = { base, res: frames.map(k => R.merge(base, k[1])) };
      cache.set(frames, c);
    }
    const res = c.res;
    if (f <= frames[0][0]) return res[0];
    for (let i = 0; i < frames.length - 1; i++) {
      const f0 = frames[i][0], f1 = frames[i + 1][0];
      if (f < f1) {
        const t = (f - f0) / Math.max(1, f1 - f0);
        const e = U.ease[frames[i + 1][2] || 'out'] || U.ease.out;
        return R.lerp(res[i], res[i + 1], e(t));
      }
    }
    return res[res.length - 1];
  };

  // ---------------------------------------------------- procedural poses
  R.idle = function (stance, t, amp) {
    const s = Math.sin(t * 0.06) * (amp == null ? 1 : amp);
    return R.merge(stance, { lean: stance.lean + s * 1.2, aF: stance.aF + s * 2, aB: stance.aB - s * 2, drop: (stance.drop || 0) + (s + 1) * 0.8, cape: 0.25 + s * 0.1 });
  };
  /** 歩き: phase はラジアン */
  R.walk = function (stance, ph, o) {
    o = o || {};
    const s = Math.sin(ph), c = Math.cos(ph);
    const st = o.stride || 26, arm = o.arm == null ? 18 : o.arm;
    return R.merge(stance, {
      lF: s * st + 4, kF: Math.max(0, -c) * 34 + 6,
      lB: -s * st + 4, kB: Math.max(0, c) * 34 + 6,
      aF: (o.lockArms || o.lockF) ? stance.aF : stance.aF - s * arm,
      aB: (o.lockArms || o.lockB) ? stance.aB : stance.aB + s * arm,
      drop: (stance.drop || 0) + Math.abs(c) * 2.5,
      lean: stance.lean + 3,
      cape: 0.6,
    });
  };
  R.run = function (stance, ph, o) {
    o = o || {};
    const s = Math.sin(ph), c = Math.cos(ph);
    const st = o.stride || 44;
    return R.merge(stance, {
      lF: s * st + 10, kF: Math.max(0, -c) * 70 + 12,
      lB: -s * st + 10, kB: Math.max(0, c) * 70 + 12,
      aF: (o.lockArms || o.lockF) ? stance.aF : stance.aF - s * 40,
      aB: (o.lockArms || o.lockB) ? stance.aB : stance.aB + s * 40,
      lean: stance.lean + (o.lean == null ? 16 : o.lean),
      drop: (stance.drop || 0) + Math.abs(c) * 4 + 2,
      cape: 1.3,
    });
  };

  // -------------------------------------------------------- skeleton math
  const dx = a => Math.sin(a * D), dy = a => Math.cos(a * D);

  /** 2リンクIK: 肩 S から目標 T へ。長さ l1,l2。bend=+1/-1 で肘の向き */
  R.ik = function (sx, sy, tx, ty, l1, l2, bend) {
    let ddx = tx - sx, ddy = ty - sy;
    let d = Math.hypot(ddx, ddy);
    const maxd = l1 + l2 - 0.01;
    if (d > maxd) { ddx *= maxd / d; ddy *= maxd / d; tx = sx + ddx; ty = sy + ddy; d = maxd; }
    const a = Math.atan2(ddy, ddx);
    const cosA = U.clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
    const b = a + Math.acos(cosA) * (bend || 1);
    return { ex: sx + Math.cos(b) * l1, ey: sy + Math.sin(b) * l1, hx: tx, hy: ty };
  };

  /** ポーズ → 各関節の座標 */
  R.skeleton = function (p, sp) {
    const th = sp.thigh, sh = sp.shin;
    const legExt = a => th * dy(a.t) + sh * dy(a.s);
    const fT = p.lF, fS = p.lF - p.kF, bT = p.lB, bS = p.lB - p.kB;
    const ext = Math.max(th * dy(fT) + sh * dy(fS), th * dy(bT) + sh * dy(bS));
    const hipY = -ext + (p.drop || 0);
    const hip = { x: p.hx || 0, y: hipY };
    const ta = 180 - p.lean;
    const sho = { x: hip.x + dx(ta) * sp.torso, y: hip.y + dy(ta) * sp.torso };
    const neck = { x: sho.x + dx(ta) * sp.neck, y: sho.y + dy(ta) * sp.neck };
    const ha = ta - (p.head || 0);
    const headC = { x: neck.x + dx(ha) * sp.headR, y: neck.y + dy(ha) * sp.headR };
    const shF = { x: sho.x + (sp.shoulderOff || 0), y: sho.y + 2 };
    const shB = { x: sho.x - (sp.shoulderOff || 0) * 0.6, y: sho.y + 1 };
    const elF = { x: shF.x + dx(p.aF) * sp.upper, y: shF.y + dy(p.aF) * sp.upper };
    const faF = p.aF + p.eF;
    const hdF = { x: elF.x + dx(faF) * sp.fore, y: elF.y + dy(faF) * sp.fore };
    const wa = p.wAbs != null ? p.wAbs : faF + p.w;
    const wd = { x: dx(wa), y: dy(wa) };
    const wLen = sp.weaponLen || 0;
    const tip = { x: hdF.x + wd.x * wLen, y: hdF.y + wd.y * wLen };
    let elB, hdB;
    if (p.grip && wLen) {
      const g = sp.gripDist || 9;
      const r = R.ik(shB.x, shB.y, hdF.x - wd.x * g, hdF.y - wd.y * g, sp.upper, sp.fore, -1);
      elB = { x: r.ex, y: r.ey }; hdB = { x: r.hx, y: r.hy };
    } else {
      elB = { x: shB.x + dx(p.aB) * sp.upper, y: shB.y + dy(p.aB) * sp.upper };
      const faB = p.aB + p.eB;
      hdB = { x: elB.x + dx(faB) * sp.fore, y: elB.y + dy(faB) * sp.fore };
    }
    const knF = { x: hip.x + dx(fT) * th + 1, y: hip.y + dy(fT) * th };
    const ftF = { x: knF.x + dx(fS) * sh, y: knF.y + dy(fS) * sh };
    const knB = { x: hip.x - 2 + dx(bT) * th, y: hip.y + dy(bT) * th };
    const ftB = { x: knB.x + dx(bS) * sh, y: knB.y + dy(bS) * sh };
    return { hip, sho, neck, headC, shF, shB, elF, hdF, elB, hdB, knF, ftF, knB, ftB, wa, wd, tip, ta, ha };
  };

  // ------------------------------------------------------------- drawing
  /** 先細りのカプセル（肢） */
  R.limb = function (c, x1, y1, x2, y2, w1, w2, fill, line) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    const nx = -Math.sin(a), ny = Math.cos(a);
    const r1 = w1 / 2, r2 = w2 / 2;
    c.beginPath();
    c.moveTo(x1 + nx * r1, y1 + ny * r1);
    c.lineTo(x2 + nx * r2, y2 + ny * r2);
    c.arc(x2, y2, r2, a + Math.PI / 2, a - Math.PI / 2, true);
    c.lineTo(x1 - nx * r1, y1 - ny * r1);
    c.arc(x1, y1, r1, a - Math.PI / 2, a + Math.PI / 2, true);
    c.closePath();
    c.fillStyle = fill; c.fill();
    if (line) { c.strokeStyle = line; c.lineWidth = 1.1; c.stroke(); }
  };
  /** 多角形 */
  R.poly = function (c, pts, fill, line, lw) {
    c.beginPath();
    c.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
    c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (line) { c.strokeStyle = line; c.lineWidth = lw || 1.1; c.stroke(); }
  };
  R.circle = function (c, x, y, r, fill, line) {
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (line) { c.strokeStyle = line; c.lineWidth = 1.1; c.stroke(); }
  };

  /** 標準のパーツ描画（spec.draw.* で個別に上書き可能） */
  const DEF = R.defaultDraw = {
    leg(c, sp, col, hip, kn, ft, back) {
      const k = back ? col('clothDark') : col('cloth');
      R.limb(c, hip.x, hip.y, kn.x, kn.y, sp.legW, sp.legW * 0.8, k, col('line'));
      R.limb(c, kn.x, kn.y, ft.x, ft.y, sp.legW * 0.82, sp.legW * 0.7, back ? col('bootDark') : col('boot'), col('line'));
      // 足先
      R.poly(c, [ft.x - 3, ft.y - 3, ft.x + 7, ft.y - 1, ft.x + 8, ft.y + 2, ft.x - 3, ft.y + 2], back ? col('bootDark') : col('boot'), col('line'));
    },
    arm(c, sp, col, sh, el, hd, back) {
      R.limb(c, sh.x, sh.y, el.x, el.y, sp.armW, sp.armW * 0.85, back ? col('clothDark') : col('sleeve'), col('line'));
      R.limb(c, el.x, el.y, hd.x, hd.y, sp.armW * 0.85, sp.armW * 0.75, back ? col('gloveDark') : col('glove'), col('line'));
      R.circle(c, hd.x, hd.y, sp.armW * 0.52, back ? col('gloveDark') : col('glove'), col('line'));
    },
    torso(c, sp, col, sk) {
      const h = sk.hip, s = sk.sho;
      const a = Math.atan2(s.y - h.y, s.x - h.x), nx = -Math.sin(a), ny = Math.cos(a);
      const wW = sp.waistW / 2, cW = sp.chestW / 2;
      R.poly(c, [h.x + nx * wW, h.y + ny * wW, s.x + nx * cW, s.y + ny * cW, s.x - nx * cW * 0.9, s.y - ny * cW * 0.9, h.x - nx * wW, h.y - ny * wW], col('body'), col('line'));
      // ベルト
      R.limb(c, h.x - nx * wW, h.y - ny * wW + 2, h.x + nx * wW, h.y + ny * wW + 2, 4, 4, col('belt'));
    },
    head(c, sp, col, sk) {
      R.circle(c, sk.headC.x, sk.headC.y, sp.headR, col('skin'), col('line'));
      // 髪
      c.beginPath();
      c.arc(sk.headC.x - 1, sk.headC.y - 1, sp.headR + 0.5, Math.PI * 0.9, Math.PI * 2.1);
      c.fillStyle = col('hair'); c.fill();
    },
    weapon(c, sp, col, len) { // 汎用の剣（原点=柄を握る手、+x方向に刃）
      R.poly(c, [-8, -1.5, 0, -1.5, 0, 1.5, -8, 1.5], col('grip'));
      R.poly(c, [-1, -5, 2, -5, 2, 5, -1, 5], col('metalDark'));
      R.poly(c, [2, -2.5, len - 6, -2, len, 0, len - 6, 2, 2, 2.5], col('metal'), col('line'));
    },
  };

  R.DEFAULT_COLORS = {
    skin: '#d7a582', hair: '#1a1210', cloth: '#3b3130', clothDark: '#262020', sleeve: '#3b3130',
    body: '#46403d', belt: '#2a1c14', boot: '#2d2521', bootDark: '#1c1714', glove: '#3a322c', gloveDark: '#241f1b',
    metal: '#b8b6b0', metalDark: '#6d6a66', grip: '#3a2616', line: 'rgba(8,5,5,0.85)', cape: '#1d1718', capeIn: '#3a1015',
  };
  R.DEFAULT_SPEC = {
    thigh: 22, shin: 22, torso: 30, neck: 4, headR: 8, upper: 17, fore: 16,
    legW: 9, armW: 7, waistW: 13, chestW: 20, shoulderOff: 2, weaponLen: 40, gripDist: 8, scale: 1,
  };
  /** spec を既定値で補完 */
  R.makeSpec = function (o) {
    const sp = Object.assign({}, R.DEFAULT_SPEC, o);
    sp.colors = Object.assign({}, R.DEFAULT_COLORS, o.colors || {});
    sp.draw = Object.assign({}, DEF, o.draw || {});
    return sp;
  };

  /**
   * キャラクターを描く
   * c: ctx（呼び出し側で足元位置へ translate 済み、向き反転も済み）
   * opt.tint: 全身をこの色で塗る（被弾フラッシュ等） opt.t: 時刻
   * 戻り値: skeleton（武器先端の座標などに使える）
   */
  R.draw = function (c, pose, sp, opt) {
    opt = opt || {};
    const tint = opt.tint;
    const colors = opt.colors || sp.colors;
    const col = tint ? (k => (k === 'line' ? 'rgba(0,0,0,0.3)' : tint)) : (k => colors[k] || R.DEFAULT_COLORS[k] || '#f0f');
    const sk = R.skeleton(pose, sp);
    const dr = sp.draw;
    c.save();
    if (pose.rot || pose.lift) {
      const py = sk.hip.y * 0.6;
      c.translate(0, -(pose.lift || 0) + py);
      c.rotate((pose.rot || 0) * D);
      c.translate(0, -py);
    }
    if (dr.behind) dr.behind(c, sp, col, sk, pose, opt);
    if (dr.cape) dr.cape(c, sp, col, sk, pose, opt);
    if (pose.wBack && sp.weaponLen) drawWeapon(c, sp, col, sk, pose, opt);
    dr.arm(c, sp, col, sk.shB, sk.elB, sk.hdB, true, pose, opt);
    dr.leg(c, sp, col, sk.hip, sk.knB, sk.ftB, true, pose, opt);
    dr.torso(c, sp, col, sk, pose, opt);
    dr.leg(c, sp, col, sk.hip, sk.knF, sk.ftF, false, pose, opt);
    dr.head(c, sp, col, sk, pose, opt);
    if (dr.chest) dr.chest(c, sp, col, sk, pose, opt);
    if (!pose.wBack && sp.weaponLen) drawWeapon(c, sp, col, sk, pose, opt);
    dr.arm(c, sp, col, sk.shF, sk.elF, sk.hdF, false, pose, opt);
    if (dr.front) dr.front(c, sp, col, sk, pose, opt);
    c.restore();
    return sk;
  };
  function drawWeapon(c, sp, col, sk, pose, opt) {
    if (opt.noWeapon) return;
    c.save();
    c.translate(sk.hdF.x, sk.hdF.y);
    c.rotate(Math.atan2(sk.wd.y, sk.wd.x));
    sp.draw.weapon(c, sp, col, sp.weaponLen, pose, opt);
    c.restore();
  }

  /**
   * 汎用マント描画（spec.draw.cape に設定して使う）
   */
  R.capeDraw = function (c, sp, col, sk, pose, opt) {
    const t = (opt.t || 0) * 0.15;
    const fl = pose.cape == null ? 0.3 : pose.cape;
    const s = sk.sho, h = sk.hip;
    const len = sp.capeLen || 48;
    const back = 8 + fl * 24;                     // 後ろへなびく量
    const wave = Math.sin(t) * 3 * (0.4 + fl);
    const bx = s.x - back + wave, by = s.y + len - fl * 14;
    const fx = h.x - 3 - back * 0.25, fy = s.y + len * 0.92 - fl * 6;
    c.beginPath();
    c.moveTo(s.x + 5, s.y - 3);
    c.quadraticCurveTo(s.x - 10 - fl * 6, s.y + 2, s.x - 8 - back * 0.6, s.y + len * 0.45 + wave * 0.5);
    c.lineTo(bx, by);
    // ぼろぼろの裾
    const n = 5;
    for (let i = 1; i <= n; i++) {
      const k = i / n;
      const x = U.lerp(bx, fx, k), y = U.lerp(by, fy, k) + (i % 2 ? -5 : 1) + Math.sin(t * 1.3 + i) * 1.5;
      c.lineTo(x, y);
    }
    c.quadraticCurveTo(h.x + 2, h.y - 2, s.x + 3, s.y + 7);
    c.closePath();
    c.fillStyle = col('cape'); c.fill();
    c.strokeStyle = col('line'); c.lineWidth = 1.1; c.stroke();
    if (!opt.tint) {
      // 縁のリムライト
      c.strokeStyle = 'rgba(150,120,130,0.28)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(s.x - 9 - fl * 5, s.y + 4); c.quadraticCurveTo(s.x - 8 - back * 0.6, s.y + len * 0.45, bx, by); c.stroke();
    }
  };
})(window.BK);

</script>
<script>/* js/combat.js */
'use strict';
/* =====================================================================
 *  combat.js ── アクター基底クラス・技(Move)の実行・当たり判定・飛び道具
 *
 *  ● 技 (Move) 定義
 *   {
 *     dur: 28,                      // 全体フレーム
 *     kf: [[0,{pose}],[6,{pose},'in'],...],  // rig のキーフレーム
 *     hits: [ { f:[8,11], x:[10,70], z:[20,90], d:16, dmg:10, kb:'light',
 *               push:3, lift:5, stop:5, sfx:'slash', fx:'blood'|'spark'|'none',
 *               multi: 6  /* 同じ技で multi フレームごとに再ヒット可 *\/ } ],
 *     move: [[0,0],[6,4],[12,0]],   // 前進速度カーブ [frame, vx(向き基準)]
 *     cancel: 16,                   // この F 以降はコンボ入力で次の技へ移行可
 *     invul: [0,20],                // 無敵フレーム
 *     armor: true,                  // スーパーアーマー（のけぞらない）
 *     trail: [6,12],                // 斬撃軌跡を出すフレーム
 *     trailCol: '#ffffff',
 *     sfx: [[6,'swing']],           // フレームごとの効果音
 *     onFrame(actor, f) {},         // 任意処理（飛び道具発射など）
 *     onHit(actor, target, hit) {}, // ヒット時の任意処理
 *     onEnd(actor) {},
 *     air: true,                    // 空中技（着地で終了）
 *     vz: 0, grav: true,            // 開始時の縦速度
 *   }
 *
 *  ● ノックバック種類 kb
 *   'light'  短いのけぞり        'heavy' 長いのけぞり
 *   'down'   吹っ飛びダウン      'launch' 真上に浮かせる（追撃可）
 *   'spin'   きりもみ吹っ飛び（ダウン、周囲を巻き込む）
 * ===================================================================== */
(function (BK) {
  const U = BK.U;
  const C = BK.combat = { actors: [], projectiles: [], tokens: 0, maxTokens: 2 };

  let _uid = 1;
  class Actor {
    constructor(o) {
      this.uid = _uid++;
      this.x = 0; this.y = 60; this.z = 0;
      this.vx = 0; this.vy = 0; this.vz = 0;
      this.face = 1;
      this.w = 26; this.h = 88;       // 喰らい判定 (幅, 高さ)
      this.team = 'enemy';
      this.hp = 100; this.maxHp = 100;
      this.state = 'idle'; this.st = 0;
      this.move = null; this.mf = 0; this.moveHit = false; this.hitIds = null;
      this.invul = 0; this.flash = 0; this.hitstun = 0;
      this.weight = 1;                // 吹っ飛びにくさ
      this.armor = false;             // 常時スーパーアーマー
      this.dead = false; this.remove = false;
      this.juggle = 0;
      this.pose = null;
      this.trail = []; this.trailOn = false;
      this.animT = 0;
      this.grabbedBy = null; this.grabbing = null;
      this.lastHitBy = null;
      this.shadowR = 16;
      this.hitCount = 0;               // 連続被弾数（ダウン判定用）
      this.downT = 0;
      this.scoreValue = 100;
      Object.assign(this, o || {});
    }
    get onGround() { return this.z <= 0 && this.vz <= 0; }
    get alive() { return !this.dead && this.hp > 0; }
    /** 喰らい判定の当たりやすさ */
    get hurtable() { return !this.dead && this.invul <= 0 && this.state !== 'down' && this.state !== 'getup' && !this.intangible; }

    startMove(def, opt) {
      this.move = def; this.mf = 0; this.moveHit = false; this.hitIds = new Map();
      this.state = 'move'; this.trail.length = 0; this.trailOn = false;
      if (def.vz != null) { this.vz = def.vz; }
      if (def.onStart) def.onStart(this, opt);
    }
    endMove() {
      const m = this.move;
      this.move = null; this.trailOn = false;
      if (m && m.onEnd) m.onEnd(this);
      if (this.state === 'move') this.state = (this.z > 0 && !this.flying) ? 'air' : 'idle';
    }
    /** 技の1フレーム処理（ポーズ・移動・判定・効果音） */
    updateMove() {
      const m = this.move, f = this.mf;
      if (m.move) {
        const vx = sampleCurve(m.move, f);
        if (vx != null) this.vx = vx * this.face * (this.moveSpeedMul || 1);
      }
      if (m.movY) this.vy = sampleCurve(m.movY, f) || 0;
      if (m.sfx) for (const s of m.sfx) if (s[0] === f) BK.audio.sfx(s[1], s[2]);
      if (m.onFrame) m.onFrame(this, f);
      if (this.move !== m) return; // onFrame で中断 / 別の技へ移行した
      this.trailOn = !!(m.trail && f >= m.trail[0] && f <= m.trail[1]);
      if (m.invul && f >= m.invul[0] && f <= m.invul[1]) this.invul = Math.max(this.invul, 1);
      this.mf++;
      if (m.air) {
        if (this.z <= 0 && this.mf > 2 && this.vz <= 0) { this.endMove(); this.land && this.land(); return; }
      }
      if (this.mf >= m.dur) this.endMove();
    }
    /** 現在の攻撃判定をワールド座標で列挙 */
    activeHits() {
      const m = this.move;
      if (!m || !m.hits) return null;
      const f = this.mf - 1; // updateMove で ++ 済み
      let out = null;
      for (let i = 0; i < m.hits.length; i++) {
        const h = m.hits[i];
        if (f < h.f[0] || f > h.f[1]) continue;
        const x0 = this.x + (this.face > 0 ? h.x[0] : -h.x[1]);
        const x1 = this.x + (this.face > 0 ? h.x[1] : -h.x[0]);
        (out || (out = [])).push({ h, i, x0, x1, z0: this.z + h.z[0], z1: this.z + h.z[1], y: this.y, d: h.d || 16 });
      }
      return out;
    }
    physics() {
      // 重力
      if (this.z > 0 || this.vz !== 0) {
        this.z += this.vz;
        this.vz -= BK.GRAV * (this.gravMul != null ? this.gravMul : 1);
        if (this.z <= 0) {
          this.z = 0;
          const impact = this.vz;
          this.vz = 0;
          this.onLand(impact);
        }
      }
      this.x += this.vx;
      this.y += this.vy;
      if (this.z <= 0 && this.state !== 'fall' && !(this.move && this.move.keepVel)) {
        this.vx *= this.friction || 0.78;
        this.vy *= this.friction || 0.78;
        if (Math.abs(this.vx) < 0.05) this.vx = 0;
        if (Math.abs(this.vy) < 0.05) this.vy = 0;
      }
      this.y = U.clamp(this.y, 0, BK.DEPTH);
    }
    onLand(impact) {
      if (this.state === 'fall') {
        if (this.dead || this.hp <= 0) {
          if (impact < -5 && !this._bounced) { this._bounced = true; this.vz = 3; this.z = 0.1; BK.fx.dust(this.x, this.y, 6); BK.audio.sfx('thud'); return; }
          this.state = 'dead'; this.st = 0; this.vx = 0;
          BK.fx.dust(this.x, this.y, 8);
          return;
        }
        if (impact < -6 && !this._bounced) { // 1回バウンド
          this._bounced = true; this.vz = 2.6; this.z = 0.1; this.vx *= 0.5;
          BK.fx.dust(this.x, this.y, 6); BK.audio.sfx('thud', { vol: 0.7 });
          return;
        }
        this.state = 'down'; this.st = 0; this.vx = 0; this._bounced = false; this.juggle = 0;
        BK.fx.dust(this.x, this.y, 8); BK.audio.sfx('thud', { vol: 0.8 });
        if (this.thrownBy) { this.thrownBy = null; this._thrownHit = null; }
      } else if (this.move && this.move.air) {
        this.endMove();
        if (this.land) this.land();
      } else if (this.land) this.land();
    }

    /**
     * 被弾処理。戻り値 true でヒット成立
     * src: 攻撃側アクター（飛び道具なら発射者）
     * h: ヒット定義 {dmg, kb, push, lift, stop, ...}
     * dir: 吹っ飛ぶ向き (+1/-1)
     */
    takeHit(src, h, dir) {
      const downHit = h.hitDown && (this.state === 'down' || this.state === 'getup') && !this.dead && !this.intangible;
      if (!this.hurtable && !downHit) return false;
      if (this.onBeforeHit && this.onBeforeHit(src, h, dir) === false) return false;
      let dmg = h.dmg * (src && src.dmgMul || 1);
      if (this.dmgTakenMul) dmg *= this.dmgTakenMul;
      dmg = Math.max(1, Math.round(dmg));
      this.hp -= dmg;
      this.flash = 6;
      this.lastHitBy = src;
      this.hitCount++;
      this._lastHitF = BK.frame;
      if (this.onDamaged) this.onDamaged(dmg, src, h);
      if (src && src.onDealDamage) src.onDealDamage(dmg, this, h);
      // 掴み中なら解除
      if (this.grabbing) { const g = this.grabbing; this.grabbing = null; g.grabbedBy = null; if (g.state === 'grabbed') { g.state = 'idle'; } }
      if (this.grabbedBy && !h.keepGrab) { const g = this.grabbedBy; this.grabbedBy = null; if (g.grabbing === this) g.grabbing = null; }

      const kb = h.kb || 'light';
      const heavyKb = kb === 'down' || kb === 'launch' || kb === 'spin';
      if (this.hp <= 0) {
        this.hp = 0;
        this.die(src, h, dir);
        return true;
      }
      // 掴まれたまま殴られている（膝蹴りなど）: 掴み状態を維持
      if (this.grabbedBy && h.keepGrab) return true;
      const armored = this.armor || (this.move && this.move.armor) || this.superArmor > 0;
      if (armored && !(h.breakArmor && heavyKb)) {
        // スーパーアーマー: 仰け反らない
        return true;
      }
      if (this.move) { this.endMove(); this.state = 'hurt'; }
      if (this.releaseToken) this.releaseToken();
      const w = this.weight || 1;
      const airborne = (this.z > 1 && !this.hover) || this.state === 'fall';
      if (heavyKb || airborne || this.hitCount >= (this.downAfter || 99)) {
        this.state = 'fall'; this.st = 0; this._bounced = false;
        const lift = (h.lift != null ? h.lift : (kb === 'launch' ? 8 : kb === 'spin' ? 6 : 5)) / Math.sqrt(w);
        this.juggle++;
        this.vz = Math.max(this.vz, airborne ? Math.max(2.5, lift * (1 - this.juggle * 0.18)) : lift);
        if (this.z <= 0) this.z = 0.5;
        this.vx = dir * (h.push != null ? h.push : (kb === 'launch' ? 1.2 : 4.2)) / w;
        this.spinning = kb === 'spin';
        this.hitCount = 0;
      } else {
        this.state = 'hurt'; this.st = 0;
        this.hitstun = h.stun || (kb === 'heavy' ? 22 : 13);
        this.vx = dir * (h.push != null ? h.push : (kb === 'heavy' ? 4 : 2.2)) / w;
      }
      return true;
    }
    die(src, h, dir) {
      this.dead = true;
      if (this.move) this.endMove();
      if (this.releaseToken) this.releaseToken();
      this.state = 'fall'; this.st = 0; this._bounced = false;
      this.vz = Math.max(this.vz, 6.5); if (this.z <= 0) this.z = 0.5;
      this.vx = dir * 4.5 / Math.sqrt(this.weight || 1);
      if (this.grabbedBy) { const g = this.grabbedBy; this.grabbedBy = null; if (g.grabbing === this) g.grabbing = null; }
      if (this.grabbing) { const g = this.grabbing; this.grabbing = null; g.grabbedBy = null; if (g.state === 'grabbed') g.state = 'idle'; }
      if (this.onDie) this.onDie(src, h);
    }
    /** のけぞり・ダウン・起き上がりの共通処理。処理したら true */
    updateReactions() {
      switch (this.state) {
        case 'hurt':
          if (--this.hitstun <= 0) { this.state = 'idle'; this.hitCount = Math.max(0, this.hitCount - 1); }
          return true;
        case 'fall':
          return true;
        case 'down':
          this.st++;
          if (this.st > (this.downTime || 38)) { this.state = 'getup'; this.st = 0; }
          return true;
        case 'getup':
          this.st++;
          if (this.st > (this.getupTime || 18)) { this.state = 'idle'; this.invul = Math.max(this.invul, this.getupInvul || 20); this.hitCount = 0; }
          return true;
        case 'dead':
          this.st++;
          if (this.st > (this.deadTime || 50)) this.remove = true;
          return true;
      }
      return false;
    }
    /** 汎用リアクションポーズ（被弾・ダウンなど） */
    reactionPose(stance) {
      const R = BK.rig;
      switch (this.state) {
        case 'hurt': {
          const k = Math.min(1, this.hitstun / 10);
          return R.merge(stance, { lean: -18 * k, head: -20 * k, aF: -30 * k + 10, eF: 40, aB: -50 * k, eB: 30, lF: 12, kF: 16, lB: -18, kB: 10, cape: 0.8 });
        }
        case 'fall': {
          if (this.spinning) return R.merge(stance, { rot: -(this.st * 24) % 360, lean: -10, aF: 120, aB: -120, lF: 30, lB: -30, kF: 30, kB: 30, cape: 1.2 });
          const up = this.vz > 0;
          return R.merge(stance, { rot: up ? -35 : -65, lift: 4, lean: -20, head: -25, aF: 150, eF: 20, aB: -150, eB: 20, lF: 40, kF: 40, lB: 10, kB: 50, cape: 1.2 });
        }
        case 'dead':
        case 'down':
          return R.merge(stance, { rot: -90, lift: 0, hx: -4, lean: -8, head: -10, aF: 170, eF: 0, aB: 180, eB: 10, lF: 5, kF: 5, lB: -5, kB: 5, drop: 0, cape: 0.1 });
        case 'getup': {
          const t = this.st / (this.getupTime || 18);
          return R.merge(stance, { rot: -90 * (1 - t), lean: 30 * (1 - t), lF: 60 * (1 - t) + 10, kF: 90 * (1 - t) + 8, lB: 20, kB: 60 * (1 - t) + 8, aF: 20, aB: -40 });
        }
      }
      return null;
    }
    updateTrail(sk) {
      // 描画時に呼ばれ、武器先端の軌跡を記録
      if (!this.trailOn || !sk) { if (this.trail.length) this.trail.length = 0; return; }
      if (this._trailF === BK.frame) return;
      this._trailF = BK.frame;
      const sc = this.spec.scale || 1, f = this.face;
      const tx = this.x + sk.tip.x * sc * f, ty = BK.FLOOR_TOP + this.y - this.z + sk.tip.y * sc;
      const bx = this.x + (sk.hdF.x + (sk.tip.x - sk.hdF.x) * 0.35) * sc * f, by = BK.FLOOR_TOP + this.y - this.z + (sk.hdF.y + (sk.tip.y - sk.hdF.y) * 0.35) * sc;
      this.trail.push({ tx, ty, bx, by, f: BK.frame });
      if (this.trail.length > 7) this.trail.shift();
    }
    drawTrail(c) {
      const tr = this.trail;
      if (tr.length < 2) return;
      const now = BK.frame;
      const col = (this.move && this.move.trailCol) || this.trailCol || '#ffffff';
      const ox = -BK.cam.x + BK.cam.sx, oy = BK.cam.sy;
      c.save();
      for (let i = 1; i < tr.length; i++) {
        const a = tr[i - 1], b = tr[i];
        const age = now - b.f;
        const k = (i / tr.length) * Math.max(0, 1 - age / 8);
        if (k <= 0) continue;
        c.globalAlpha = k * 0.85;
        c.fillStyle = col;
        c.beginPath();
        c.moveTo(a.tx + ox, a.ty + oy); c.lineTo(b.tx + ox, b.ty + oy);
        c.lineTo(b.bx + ox, b.by + oy); c.lineTo(a.bx + ox, a.by + oy);
        c.closePath(); c.fill();
      }
      c.restore();
    }
    drawShadow(c) {
      const sx = BK.sx(this.x), sy = BK.sy(this.y, 0);
      const k = Math.max(0.35, 1 - this.z / 160);
      c.fillStyle = 'rgba(0,0,0,0.42)';
      c.beginPath(); c.ellipse(sx, sy, this.shadowR * k, this.shadowR * 0.32 * k, 0, 0, Math.PI * 2); c.fill();
    }
    /** rig 使用アクターの標準描画 */
    drawRig(c, pose, opt) {
      const sx = BK.sx(this.x), sy = BK.sy(this.y, this.z);
      const sc = this.spec.scale || 1;
      c.save();
      c.translate(Math.round(sx * 2) / 2, Math.round(sy * 2) / 2);
      c.scale(this.face * sc, sc);
      let o = opt || {};
      if (this.flash > 0 && (this.flash & 2)) o = Object.assign({}, o, { tint: this.flashTint || '#ffffff' });
      o.t = this.animT;
      const sk = BK.rig.draw(c, pose, this.spec, o);
      c.restore();
      this.updateTrail(sk);
      this.sk = sk;
      return sk;
    }
  }
  BK.Actor = Actor;

  function sampleCurve(curve, f) {
    if (f < curve[0][0]) return null;
    for (let i = curve.length - 1; i >= 0; i--) if (f >= curve[i][0]) return curve[i][1];
    return null;
  }
  C.sampleCurve = sampleCurve;

  // ------------------------------------------------------------- hit test
  /** 攻撃判定 box と喰らい側アクターの重なり判定 */
  C.overlap = function (hb, t) {
    const hw = t.w / 2;
    if (hb.x1 < t.x - hw || hb.x0 > t.x + hw) return false;
    if (Math.abs(hb.y - t.y) > hb.d) return false;
    const tz0 = t.z + (t.hurtZ0 || 0), tz1 = t.z + (t.hurtH || t.h);
    if (hb.z1 < tz0 || hb.z0 > tz1) return false;
    return true;
  };

  /** 全アクターの攻撃判定を解決 */
  C.resolve = function (actors) {
    for (const a of actors) {
      if (a.dead || !a.move || a.state !== 'move') continue;
      const hbs = a.activeHits();
      if (!hbs) continue;
      for (const hb of hbs) {
        for (const t of actors) {
          if (t === a || t.team === a.team || !t.hurtable) continue;
          if (t.grabbedBy === a && !hb.h.grabHit) continue;
          const key = t.uid * 16 + hb.i;
          const lastF = a.hitIds.get(key);
          if (lastF != null && (!hb.h.multi || BK.frame - lastF < hb.h.multi)) continue;
          if (!C.overlap(hb, t)) continue;
          const dir = hb.h.dirAway ? U.sign(t.x - a.x) : a.face;
          if (t.takeHit(a, hb.h, dir)) {
            a.hitIds.set(key, BK.frame);
            a.moveHit = true;
            C.hitFx(a, t, hb.h, (hb.x0 + hb.x1) / 2, dir);
            if (a.move && a.move.onHit) a.move.onHit(a, t, hb.h);
          }
        }
      }
    }
    // 投げられた敵が他の敵に当たる
    for (const a of actors) {
      if (!a.thrownBy || a.state !== 'fall') continue;
      const seen = a._thrownHit || (a._thrownHit = new Set());
      for (const t of actors) {
        if (t === a || t.team !== a.team || !t.hurtable || t.thrownBy || seen.has(t)) continue;
        if (Math.abs(t.x - a.x) < (t.w + a.w) / 2 && Math.abs(t.y - a.y) < 18 && a.z < t.h) {
          const h = { dmg: 14, kb: 'down', push: 4, stop: 4, sfx: 'hitHeavy' };
          if (t.takeHit(a.thrownBy, h, U.sign(a.vx || 1))) { seen.add(t); C.hitFx(a.thrownBy, t, h, t.x, U.sign(a.vx || 1)); }
        }
      }
    }
  };

  /** ヒット時の演出（ヒットストップ・火花・効果音・揺れ） */
  C.hitFx = function (a, t, h, hx, dir) {
    const power = h.dmg >= 24 ? 2 : h.dmg >= 12 ? 1 : 0.4;
    const stop = h.stop != null ? h.stop : (power >= 2 ? 7 : power >= 1 ? 5 : 3);
    BK.fx.stop(stop);
    const zMid = t.z + (t.h || 80) * 0.6;
    const x = U.clamp(hx, t.x - t.w / 2, t.x + t.w / 2);
    if (h.fx !== 'none') {
      if (h.fx === 'spark' || t.metal || t.isProp) {
        for (let i = 0; i < 6; i++) BK.fx.add({ type: 'line', x, y: t.y, z: zMid, vx: dir * U.rand(1, 5), vz: U.rand(-2, 4), life: 10, col: '#ffe9a8', size: 1.5, drag: 0.85 });
        BK.fx.add({ type: 'burst', x, y: t.y, z: zMid, life: 6, size: 14, col: '#fff6d8' });
      } else BK.fx.hitSpark(x, t.y, zMid, dir, power, t.bloodCol);
    }
    if (power >= 1) BK.fx.shake(power >= 2 ? 5 : 2.5, power >= 2 ? 10 : 6);
    BK.audio.sfx(h.sfx || (t.metal ? 'clang' : power >= 2 ? 'hitHeavy' : 'slash'), { pitch: t.team === 'hero' ? 0.8 : 1 });
  };

  // ---------------------------------------------------------- projectiles
  /**
   * 飛び道具
   * o: { x,y,z, vx,vy,vz, grav, w,h, team, owner, dmg, kb, push, lift, life,
   *      pierce(貫通数), draw(c, sx, sy, p), onHit(p, target), onExpire(p), onGround(p) }
   */
  class Projectile {
    constructor(o) {
      this.x = 0; this.y = 0; this.z = 40; this.vx = 0; this.vy = 0; this.vz = 0; this.grav = 0;
      this.w = 12; this.h = 10; this.team = 'hero'; this.dmg = 8; this.kb = 'light'; this.life = 90;
      this.pierce = 0; this.hit = new Set(); this.remove = false; this.t = 0; this.depth = 14;
      Object.assign(this, o);
      this.face = this.face || U.sign(this.vx || 1);
    }
    update(actors) {
      this.t++;
      if (this.tick) this.tick(this);
      this.x += this.vx; this.y += this.vy; this.z += this.vz; this.vz -= this.grav;
      if (this.z <= 0 && this.grav) {
        this.z = 0;
        if (this.onGround) { this.onGround(this); } else this.remove = true;
      }
      if (--this.life <= 0) { this.remove = true; if (this.onExpire) this.onExpire(this); }
      if (this.remove || this.harmless) return;
      const hb = { x0: this.x - this.w / 2, x1: this.x + this.w / 2, z0: this.z - this.h / 2, z1: this.z + this.h / 2, y: this.y, d: this.depth };
      for (const t of actors) {
        if (t.team === this.team || !t.hurtable || this.hit.has(t)) continue;
        if (!C.overlap(hb, t)) continue;
        const dir = this.dirAway ? U.sign(t.x - this.x) : U.sign(this.vx || this.face);
        const h = { dmg: this.dmg, kb: this.kb, push: this.push, lift: this.lift, stun: this.stun, stop: this.stop != null ? this.stop : 3, sfx: this.sfx, fx: this.fx, breakArmor: this.breakArmor, hitDown: this.hitDown };
        if (t.takeHit(this.owner || null, h, dir)) {
          this.hit.add(t);
          C.hitFx(this.owner || this, t, h, this.x, dir);
          if (this.onHit) this.onHit(this, t);
          if (this.pierce-- <= 0) { this.remove = true; if (this.onExpire) this.onExpire(this); break; }
        }
      }
      // 画面外で消滅
      if (this.x < BK.cam.x - 120 || this.x > BK.cam.x + BK.W + 120) this.remove = true;
    }
    draw(c, groundPass) {
      if (this.ground && !groundPass) return;
      const sx = BK.sx(this.x), sy = BK.sy(this.y, this.z);
      if (this.drawFn) { this.drawFn(c, sx, sy, this); return; }
      c.fillStyle = this.col || '#ffd'; c.fillRect(sx - this.w / 2, sy - 2, this.w, 4);
    }
    drawShadow(c) {
      if (this.ground) { this.draw(c, true); return; } // 床に描くデカール（予告マーカー等）
      if (this.noShadow) return;
      c.fillStyle = 'rgba(0,0,0,0.3)';
      c.beginPath(); c.ellipse(BK.sx(this.x), BK.sy(this.y, 0), this.w * 0.5, 2.5, 0, 0, Math.PI * 2); c.fill();
    }
  }
  BK.Projectile = Projectile;

  /** 画面全体を揺らす爆発（範囲攻撃） */
  C.explode = function (x, y, z, r, dmg, team, owner, opt) {
    opt = opt || {};
    BK.audio.sfx(opt.sfx || 'explode');
    BK.fx.shake(opt.shake || 6, 14);
    BK.fx.glow(x, y, z + 10, r * 1.3, opt.col || '#ff7a2a', 18);
    BK.fx.ring(x, y, 2, r * 1.2, opt.ringCol || '#ffcf8a', 18);
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      BK.fx.add({ type: 'smoke', x: x + Math.cos(a) * r * 0.4, y: y + Math.sin(a) * 6, z: z + U.rand(0, 20), vx: Math.cos(a) * U.rand(1, 3), vz: U.rand(0.5, 2), life: U.randi(20, 40), size: U.rand(8, 16), col: 'rgba(60,40,35,0.6)', drag: 0.9 });
      BK.fx.add({ type: 'dot', x, y, z: z + 10, vx: Math.cos(a) * U.rand(2, 6), vz: U.rand(1, 6), g: 0.25, life: U.randi(15, 30), col: U.choose(['#ffcf6a', '#ff7a2a', '#fff2c0']), size: 2 });
    }
    const hits = [];
    for (const t of BK.game ? BK.game.actors : []) {
      if (t.team === team || !t.hurtable) continue;
      const dx = t.x - x, dy = (t.y - y) * 2;
      if (Math.hypot(dx, dy) > r + t.w / 2) continue;
      if (t.z > z + r) continue;
      const h = { dmg, kb: opt.kb || 'down', push: opt.push != null ? opt.push : 5, lift: opt.lift != null ? opt.lift : 6, stop: 0, sfx: 'none', fx: 'none', breakArmor: true };
      if (t.takeHit(owner, h, U.sign(dx || 1))) { hits.push(t); BK.fx.blood(t.x, t.y, t.z + 40, U.sign(dx || 1), 5, t.bloodCol); }
    }
    return hits;
  };
})(window.BK);

</script>
<script>/* js/items.js */
'use strict';
/* =====================================================================
 *  items.js ── 拾えるアイテム（回復・得点・サブ武器）と壊せるオブジェクト
 *
 *  BK.itemDefs[id] = { kind:'food'|'score'|'weapon', name, heal(割合), score, ammo,
 *                      draw(c, sx, sy, t), fire(hero) (weapon のみ) }
 *  BK.propDefs[id] = { hp, w, h, draw(c, sx, sy, prop), debris:[色...], metal }
 *  配置: BK.game.spawnItem(id, x, y, z) / BK.game.spawnProp(id, x, y, itemId)
 * ===================================================================== */
(function (BK) {
  const U = BK.U, R = BK.rig;

  // ------------------------------------------------------------- drawing
  function shine(c, x, y, t) {
    const k = (Math.sin(t * 0.15) + 1) / 2;
    c.globalAlpha = 0.5 * k; c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(x, y - 5); c.lineTo(x + 1.2, y - 1.2); c.lineTo(x + 5, y); c.lineTo(x + 1.2, y + 1.2);
    c.lineTo(x, y + 5); c.lineTo(x - 1.2, y + 1.2); c.lineTo(x - 5, y); c.lineTo(x - 1.2, y - 1.2); c.closePath(); c.fill();
    c.globalAlpha = 1;
  }

  const I = BK.itemDefs = {
    bread: { kind: 'food', name: '黒パン', heal: 0.15, draw(c, x, y) {
      c.fillStyle = '#7a4a22'; c.beginPath(); c.ellipse(x, y - 5, 10, 6, 0, 0, 7); c.fill();
      c.strokeStyle = '#3a220e'; c.lineWidth = 1; c.stroke();
      c.strokeStyle = '#b07a40'; c.beginPath(); c.moveTo(x - 5, y - 8); c.lineTo(x - 2, y - 3); c.moveTo(x + 1, y - 9); c.lineTo(x + 4, y - 4); c.stroke();
    } },
    wine: { kind: 'food', name: '葡萄酒', heal: 0.22, draw(c, x, y) {
      c.fillStyle = '#3a1a2a'; c.beginPath(); c.ellipse(x, y - 7, 6, 8, 0, 0, 7); c.fill();
      c.fillRect(x - 2, y - 20, 4, 7); c.fillStyle = '#c7a26a'; c.fillRect(x - 2.5, y - 21, 5, 2);
      c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(x - 3, y - 11, 1.5, 6);
    } },
    meat: { kind: 'food', name: '干し肉', heal: 0.35, draw(c, x, y) {
      c.fillStyle = '#e8dcc8'; c.fillRect(x + 4, y - 7, 9, 3);
      c.beginPath(); c.arc(x + 13, y - 7, 2.2, 0, 7); c.arc(x + 13, y - 4, 2.2, 0, 7); c.fill();
      c.fillStyle = '#8a2e1c'; c.beginPath(); c.ellipse(x - 2, y - 6, 9, 6.5, -0.3, 0, 7); c.fill();
      c.strokeStyle = '#3d0f08'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#b8543a'; c.beginPath(); c.ellipse(x - 4, y - 8, 4, 2.2, -0.3, 0, 7); c.fill();
    } },
    roast: { kind: 'food', name: '猪の丸焼き', heal: 0.7, draw(c, x, y) {
      c.fillStyle = '#6e5a44'; c.beginPath(); c.ellipse(x, y - 2, 16, 4, 0, 0, 7); c.fill();
      c.fillStyle = '#9a4a20'; c.beginPath(); c.ellipse(x, y - 9, 13, 8, 0, 0, 7); c.fill();
      c.strokeStyle = '#4a1c08'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#c8783a'; c.beginPath(); c.ellipse(x - 3, y - 12, 6, 3, -0.2, 0, 7); c.fill();
      c.fillStyle = '#5a2a10'; c.beginPath(); c.arc(x + 12, y - 11, 4, 0, 7); c.fill();
    } },
    dust: { kind: 'food', name: '妖精の鱗粉', heal: 1, draw(c, x, y, t) {
      const k = (Math.sin(t * 0.2) + 1) / 2;
      const g = c.createRadialGradient(x, y - 10, 0, x, y - 10, 14);
      g.addColorStop(0, 'rgba(255,255,220,0.95)'); g.addColorStop(0.5, `rgba(160,255,200,${0.4 + k * 0.3})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y - 10, 14, 0, 7); c.fill();
      c.fillStyle = '#e8d9a8'; c.beginPath(); c.ellipse(x, y - 8, 4, 5, 0, 0, 7); c.fill();
      c.fillStyle = '#a07a4a'; c.fillRect(x - 2, y - 15, 4, 3);
    } },
    silver: { kind: 'score', name: '銀貨', score: 500, draw(c, x, y, t) {
      c.fillStyle = '#c9ccd2'; c.beginPath(); c.ellipse(x, y - 5, 5 * Math.abs(Math.cos(t * 0.08)) + 1, 5, 0, 0, 7); c.fill();
      c.strokeStyle = '#6a6e76'; c.lineWidth = 1; c.stroke();
    } },
    gold: { kind: 'score', name: '金貨袋', score: 1500, draw(c, x, y, t) {
      c.fillStyle = '#6a4a2a'; c.beginPath(); c.ellipse(x, y - 7, 8, 7, 0, 0, 7); c.fill();
      c.fillStyle = '#4a3018'; c.fillRect(x - 3, y - 16, 6, 4);
      c.fillStyle = '#ffd54a'; c.beginPath(); c.arc(x - 2, y - 13, 2.5, 0, 7); c.arc(x + 3, y - 12, 2.5, 0, 7); c.fill();
      shine(c, x + 4, y - 12, t);
    } },
    gem: { kind: 'score', name: '紅玉', score: 3000, draw(c, x, y, t) {
      R.poly(c, [x, y - 16, x + 7, y - 9, x, y - 1, x - 7, y - 9], '#c01030', '#4a0010');
      R.poly(c, [x, y - 16, x + 3, y - 9, x, y - 4, x - 3, y - 9], '#ff5a70');
      shine(c, x + 2, y - 12, t);
    } },
    behelit: { kind: 'score', name: 'ベヘリット', score: 10000, draw(c, x, y, t) {
      // 覇王の卵: 目鼻口が不規則に並ぶ赤い卵
      c.fillStyle = '#8a1a1a'; c.beginPath(); c.ellipse(x, y - 9, 7, 9, 0, 0, 7); c.fill();
      c.strokeStyle = '#2a0404'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#1a0202';
      c.beginPath(); c.ellipse(x - 3, y - 12, 1.6, 1, 0.3, 0, 7); c.fill();
      c.beginPath(); c.ellipse(x + 2.5, y - 9, 1.3, 1, -0.2, 0, 7); c.fill();
      c.beginPath(); c.ellipse(x - 1, y - 5, 2.5, 0.9, 0.1, 0, 7); c.fill();
      c.fillStyle = '#ff6060'; c.beginPath(); c.arc(x - 3, y - 12, 0.6, 0, 7); c.fill();
      shine(c, x + 3, y - 14, t);
    } },
    // ------ サブ武器（射撃ボタンで使用。弾切れで消える）
    bowgun: { kind: 'weapon', name: '連射式ボウガン', ammo: 40, draw(c, x, y) {
      c.strokeStyle = '#3a2616'; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 10, y - 6); c.lineTo(x + 10, y - 6); c.stroke();
      c.strokeStyle = '#9a9a9a'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 6, y - 14); c.quadraticCurveTo(x + 2, y - 6, x + 6, y + 2); c.stroke();
      c.fillStyle = '#6a4a2a'; c.fillRect(x - 6, y - 10, 8, 5);
    }, fire(h) {
      BK.heroShots.bolt(h, { dmg: 5, spd: 12, col: '#e8e0c0' });
      BK.audio.sfx('shoot');
      return 6; // 次弾までのフレーム
    } },
    bombs: { kind: 'weapon', name: '炸裂弾', ammo: 6, draw(c, x, y) {
      c.fillStyle = '#2a2a2e'; c.beginPath(); c.arc(x, y - 7, 7, 0, 7); c.fill();
      c.strokeStyle = '#000'; c.lineWidth = 1; c.stroke();
      c.strokeStyle = '#b89a6a'; c.beginPath(); c.moveTo(x + 3, y - 13); c.quadraticCurveTo(x + 7, y - 18, x + 10, y - 16); c.stroke();
      c.fillStyle = '#ffb040'; c.beginPath(); c.arc(x + 10, y - 16, 1.8, 0, 7); c.fill();
    }, fire(h) {
      BK.heroShots.bomb(h);
      BK.audio.sfx('jump');
      return 22;
    } },
    firepot: { kind: 'weapon', name: '火炎壺', ammo: 5, draw(c, x, y) {
      c.fillStyle = '#8a5a3a'; c.beginPath(); c.ellipse(x, y - 7, 7, 7, 0, 0, 7); c.fill();
      c.strokeStyle = '#3a1a0a'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#6a3a1a'; c.fillRect(x - 3, y - 16, 6, 4);
      c.fillStyle = '#ff7a2a'; c.beginPath(); c.moveTo(x - 2, y - 16); c.quadraticCurveTo(x, y - 24, x + 2, y - 16); c.fill();
    }, fire(h) {
      BK.heroShots.firepot(h);
      BK.audio.sfx('jump');
      return 24;
    } },
    knives: { kind: 'weapon', name: '投げナイフ', ammo: 16, draw(c, x, y) {
      for (let i = 0; i < 3; i++) {
        c.save(); c.translate(x - 4 + i * 4, y - 6); c.rotate(-0.6 + i * 0.3);
        c.fillStyle = '#cfd2d6'; c.fillRect(0, -1, 10, 2); c.fillStyle = '#3a2616'; c.fillRect(-4, -1.2, 4, 2.4);
        c.restore();
      }
    }, fire(h) {
      BK.heroShots.knife(h, { dmg: 7, spd: 11 });
      BK.audio.sfx('knife');
      return 9;
    } },
    spear: { kind: 'weapon', name: '投げ槍', ammo: 3, draw(c, x, y) {
      c.strokeStyle = '#5a3a1a'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(x - 16, y - 4); c.lineTo(x + 12, y - 8); c.stroke();
      R.poly(c, [x + 12, y - 11, x + 21, y - 9, x + 12, y - 5], '#c8ccd0', '#333');
    }, fire(h) {
      BK.heroShots.spear(h);
      BK.audio.sfx('swingHeavy');
      return 26;
    } },
  };

  /** 敵が落とすアイテムのテーブル（重み付き） */
  BK.dropTable = {
    // 武器は主に樽・木箱から（AvP 同様）。雑魚からはたまに
    common: [[64, null], [10, 'bread'], [6, 'wine'], [10, 'silver'], [4, 'gold'], [1, 'knives'], [1, 'bowgun'], [1, 'bombs'], [1, 'spear']],
    prop: [[16, 'bread'], [12, 'meat'], [10, 'wine'], [3, 'roast'], [14, 'silver'], [8, 'gold'], [3, 'gem'], [1, 'behelit'], [6, 'bowgun'], [5, 'bombs'], [4, 'firepot'], [6, 'knives'], [4, 'spear']],
  };

  // --------------------------------------------------------- item entity
  class Item {
    constructor(id, x, y, z) {
      this.id = id; this.def = I[id]; this.x = x; this.y = y; this.z = z || 0;
      this.vz = z ? 3 : 4; this.vx = U.rand(-1, 1); this.t = 0; this.remove = false; this.life = 60 * 25;
    }
    update(game) {
      this.t++;
      if (this.z > 0 || this.vz > 0) {
        this.z += this.vz; this.vz -= 0.4; this.x += this.vx;
        // 着地点は画面内に収める（カメラは戻らないので、画面外に落ちると拾えなくなる）
        if (this.z <= 0) { this.z = 0; this.vz = 0; this.vx = 0; this.x = U.clamp(this.x, BK.cam.x + 24, BK.cam.x + BK.W - 24); }
      }
      if (--this.life <= 0) this.remove = true;
      const h = game.hero;
      if (!h || h.dead || this.t < 14 || this.z > 10) return;
      if (h.state === 'grabbed' || h.state === 'down' || h.state === 'fall') return;
      if (Math.abs(h.x - this.x) < 20 && Math.abs(h.y - this.y) < 12) {
        // 別の武器を持っている時は自動で持ち替えない（上に立って 射 で持ち替え）
        if (this.def.kind === 'weapon' && h.sub && h.sub.id !== this.id && !h.ctrl.pressed.sht) {
          if (!this.hinted) { this.hinted = true; BK.fx.text(this.x, this.y, 40, '射で持ち替え', '#ffd0a0', 11); }
          return;
        }
        this.pickup(h, game);
      }
    }
    pickup(h, game) {
      const d = this.def;
      if (d.kind === 'food') {
        if (h.hp >= h.maxHp) { game.addScore(500); BK.fx.text(this.x, this.y, 40, '+500', '#ffe08a', 12); }
        else { const amt = Math.round(h.maxHp * d.heal); h.hp = Math.min(h.maxHp, h.hp + amt); BK.fx.text(this.x, this.y, 40, d.name, '#9cff9c', 12); }
        BK.audio.sfx('heal');
      } else if (d.kind === 'score') {
        game.addScore(d.score); BK.fx.text(this.x, this.y, 40, '+' + d.score, '#ffe08a', 13);
        BK.audio.sfx('coin');
      } else if (d.kind === 'weapon') {
        if (h.sub && h.sub.id === this.id) h.sub.ammo = Math.min(d.ammo * 2, h.sub.ammo + d.ammo);
        else h.sub = { id: this.id, ammo: d.ammo };
        BK.fx.text(this.x, this.y, 40, d.name, '#ffd0a0', 12);
        BK.audio.sfx('pickup');
      }
      this.remove = true;
    }
    draw(c) {
      if (this.life < 180 && (this.t >> 3) % 2) return; // 消える前に点滅
      const sx = BK.sx(this.x), sy = BK.sy(this.y, this.z);
      c.fillStyle = 'rgba(0,0,0,0.35)';
      c.beginPath(); c.ellipse(sx, BK.sy(this.y, 0), 9, 2.5, 0, 0, 7); c.fill();
      this.def.draw(c, sx, sy, this.t);
    }
  }
  BK.Item = Item;

  // --------------------------------------------------------- breakables
  const P = BK.propDefs = {
    barrel: { name: '樽', hp: 18, w: 26, h: 34, debris: ['#6a4526', '#4a2e18', '#8a8a8a'], draw(c, x, y, p) {
      c.fillStyle = '#6a4526'; c.beginPath(); c.ellipse(x, y - 17, 13, 17, 0, 0, 7); c.fill();
      c.fillStyle = '#58381e'; c.fillRect(x - 13, y - 30, 26, 26);
      c.fillStyle = '#7a5230'; c.beginPath(); c.ellipse(x, y - 31, 12, 4, 0, 0, 7); c.fill();
      c.strokeStyle = '#2e1a0c'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#707070'; c.fillRect(x - 13, y - 26, 26, 2.5); c.fillRect(x - 13, y - 10, 26, 2.5);
      c.strokeStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); for (let i = -8; i <= 8; i += 6) { c.moveTo(x + i, y - 30); c.lineTo(x + i, y - 3); } c.stroke();
    } },
    crate: { name: '木箱', hp: 16, w: 30, h: 30, debris: ['#7a5a36', '#5a3e22'], draw(c, x, y) {
      R.poly(c, [x - 15, y - 30, x + 15, y - 30, x + 15, y, x - 15, y], '#7a5a36', '#2e1e0e');
      R.poly(c, [x - 15, y - 30, x - 9, y - 36, x + 21, y - 36, x + 15, y - 30], '#8e6c44', '#2e1e0e');
      R.poly(c, [x + 15, y - 30, x + 21, y - 36, x + 21, y - 6, x + 15, y], '#5a3e22', '#2e1e0e');
      c.strokeStyle = '#3e2a14'; c.lineWidth = 2; c.beginPath(); c.moveTo(x - 14, y - 29); c.lineTo(x + 14, y - 1); c.moveTo(x + 14, y - 29); c.lineTo(x - 14, y - 1); c.stroke();
    } },
    urn: { name: '壺', hp: 8, w: 20, h: 26, debris: ['#8a6a4a', '#5a4030'], draw(c, x, y) {
      c.fillStyle = '#7a5a3a'; c.beginPath(); c.moveTo(x - 6, y - 26); c.quadraticCurveTo(x - 16, y - 14, x - 7, y); c.lineTo(x + 7, y); c.quadraticCurveTo(x + 16, y - 14, x + 6, y - 26); c.closePath(); c.fill();
      c.strokeStyle = '#2e1e10'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#5a3e26'; c.fillRect(x - 7, y - 28, 14, 3);
      c.strokeStyle = '#a07a4a'; c.beginPath(); c.moveTo(x - 10, y - 14); c.lineTo(x + 10, y - 14); c.stroke();
    } },
    grave: { name: '墓標', hp: 22, w: 24, h: 36, metal: false, debris: ['#6a6a6e', '#4a4a50'], draw(c, x, y) {
      R.poly(c, [x - 10, y, x - 10, y - 26, x - 6, y - 34, x + 6, y - 34, x + 10, y - 26, x + 10, y], '#5e5e64', '#1e1e22');
      c.strokeStyle = '#2a2a30'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y - 30); c.lineTo(x, y - 12); c.moveTo(x - 6, y - 24); c.lineTo(x + 6, y - 24); c.stroke();
    } },
  };

  class Prop extends BK.Actor {
    constructor(id, x, y, itemId) {
      const d = P[id];
      super({ team: 'prop', x, y, hp: d.hp, maxHp: d.hp, w: d.w, h: d.h, weight: 99, shadowR: d.w * 0.6, metal: d.metal });
      this.pid = id; this.pdef = d; this.item = itemId === undefined ? U.weighted(BK.dropTable.prop) : itemId;
      this.isProp = true;
    }
    takeHit(src, h, dir) {
      if (this.dead) return false;
      this.hp -= h.dmg; this.flash = 6; this.wob = 8 * dir;
      if (this.hp <= 0) this.breakApart(dir);
      return true;
    }
    breakApart(dir) {
      this.dead = true; this.remove = true;
      BK.audio.sfx('hit', { pitch: 0.7 });
      for (let i = 0; i < 12; i++) {
        BK.fx.add({ type: 'dot', x: this.x + U.rand(-10, 10), y: this.y, z: U.rand(5, this.h), vx: dir * U.rand(0.5, 4) + U.rand(-1, 1), vz: U.rand(1, 5), g: 0.3, life: U.randi(25, 45), col: U.choose(this.pdef.debris), size: U.rand(2, 5) });
      }
      BK.fx.dust(this.x, this.y, 6);
      if (this.item && BK.game) BK.game.spawnItem(this.item, this.x, this.y, 16);
    }
    update() { if (this.flash > 0) this.flash--; if (this.wob) this.wob *= -0.7; if (Math.abs(this.wob || 0) < 0.3) this.wob = 0; }
    draw(c) {
      const sx = BK.sx(this.x) + (this.wob || 0) * 0.5, sy = BK.sy(this.y, 0);
      this.pdef.draw(c, sx, sy, this);
      if (this.flash > 0 && (this.flash & 2)) {
        c.globalAlpha = 0.5; c.fillStyle = '#fff'; c.fillRect(sx - this.w / 2, sy - this.h, this.w, this.h); c.globalAlpha = 1;
      }
    }
  }
  BK.Prop = Prop;
})(window.BK);

</script>
<script>/* js/heroes.js */
'use strict';
/* =====================================================================
 *  heroes.js ── プレイヤーキャラクター共通処理
 *
 *  キャラ定義は BK.registerHero(def) で登録する（hero_*.js）。
 *  def = {
 *    id, name, title, desc,                   // 表示用
 *    stats: {life, power, speed, reach, shot},// 選択画面の 1〜5
 *    maxHp, walk, walkY, run, jumpV, jumpVX, runJumpVX, weight, w, h,
 *    specialCost: 0.08,                       // 必殺技の体力消費（最大体力比）
 *    throwDmg: 18,
 *    spec: {...rig spec},  stance: {...pose},
 *    walkOpt, runOpt,                         // rig.walk / rig.run のオプション
 *    anim: { jump(h), grab(h), crouch(h), reload(h) } (省略可: pose を返す関数)
 *    moves: { atk1, atk2, atk3, atk4, dash, jumpAtk, jumpAtkF?, downAtk?, rising, charge,
 *             special, knee, throw, shoot, awaken, reload? },
 *    shot: { name, max, regen, cd, auto, air, reloadAll?, reloadLock?, fire(h),
 *            hold?: {frames, cost, fire(h)} },
 *    awaken: { name, type:'buff'|'screen', dur, start(h), update(h), end(h), colors? },
 *    drawBack(c,h), drawFront(c,h),           // 追加描画（オーラ等）
 *    init(h), update(h, game, input),        // 生成時 / 毎フレームの追加処理（重力倍率 h.gravMul など）
 *    ※ awaken.type 'screen' でも start(h) 内で h.awkT を設定すれば余韻バフを表現できる（HUDゲージ・配色は awkT を見る）
 *    portrait(c, x, y, s),                    // 省略時はリグで描く
 *  }
 * ===================================================================== */
(function (BK) {
  const U = BK.U, R = BK.rig;
  const CHARGE_FRAMES = 34;

  BK.registerHero = function (def) {
    def.spec = R.makeSpec(def.spec || {});
    def.stance = R.merge(R.NEUTRAL, def.stance || {});
    const mv = def.moves || (def.moves = {});
    ['atk1', 'atk2', 'atk3', 'atk4'].forEach((k, i) => { if (mv[k]) mv[k].comboIdx = i; });
    if (mv.throw && !mv.throw.onFrame) {
      const at = mv.throw.throwAt || 10;
      mv.throw.onFrame = (h, f) => { if (f === at) h.releaseThrow(); };
    }
    if (mv.knee && !mv.knee.onEnd) mv.knee.onEnd = h => { if (h.grabbing) h.state = 'grab'; };
    if (mv.throw && !mv.throw.onEnd) mv.throw.onEnd = h => { h.state = 'idle'; };
    BK.heroes[def.id] = def;
    if (BK.heroOrder.indexOf(def.id) < 0) BK.heroOrder.push(def.id);
    return def;
  };

  // ===================================================== shared shots
  const S = BK.heroShots = {
    /** 手元の発射位置 */
    muzzle(h, fwd, z) { return { x: h.x + h.face * (fwd || 30), y: h.y, z: h.z + (z || 56) }; },
    bolt(h, o) {
      o = o || {};
      const m = S.muzzle(h, o.fwd || 30, o.z || 56);
      BK.game.addProjectile(new BK.Projectile({
        x: m.x, y: m.y, z: m.z, vx: h.face * (o.spd || 11), w: 18, h: 56, team: 'hero', owner: h, dmg: o.dmg || 4, kb: 'light', push: 1.2, stop: 2, life: 60, sfx: 'hit',
        drawFn(c, sx, sy, p) {
          c.strokeStyle = o.col || '#d8d0b8'; c.lineWidth = 2;
          c.beginPath(); c.moveTo(sx - p.face * 12, sy); c.lineTo(sx + p.face * 6, sy); c.stroke();
          c.fillStyle = '#9a9a9a'; c.beginPath(); c.moveTo(sx + p.face * 9, sy); c.lineTo(sx + p.face * 4, sy - 2.5); c.lineTo(sx + p.face * 4, sy + 2.5); c.fill();
          c.fillStyle = '#a03030'; c.fillRect(sx - p.face * 12 - 1, sy - 2, 3, 4);
        },
      }));
    },
    knife(h, o) {
      o = o || {};
      const m = S.muzzle(h, 26, o.z || 60);
      BK.game.addProjectile(new BK.Projectile({
        x: m.x, y: m.y, z: m.z, vx: h.face * (o.spd || 10), w: 14, h: 56, team: 'hero', owner: h, dmg: o.dmg || 6, kb: 'light', push: 1.5, stop: 2, life: 55, sfx: 'slash',
        drawFn(c, sx, sy, p) {
          c.strokeStyle = 'rgba(230,236,245,0.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx - p.vx * 2.5, sy); c.stroke();
          c.save(); c.translate(sx, sy); c.rotate(p.t * 0.9 * p.face);
          c.fillStyle = '#e4e8ee'; c.fillRect(-1.5, -9, 3, 12); c.fillStyle = '#3a2616'; c.fillRect(-2, 3, 4, 5);
          c.restore();
        },
      }));
    },
    bomb(h) {
      const m = S.muzzle(h, 20, 56);
      BK.game.addProjectile(new BK.Projectile({
        x: m.x, y: m.y, z: m.z, vx: h.face * 5, vz: 2.5, grav: 0.35, w: 12, h: 36, team: 'hero', owner: h, dmg: 10, kb: 'down', life: 120, harmless: false,
        onGround(p) { p.remove = true; BK.combat.explode(p.x, p.y, 0, 50, 26, 'hero', h); },
        onHit(p) { p.remove = true; BK.combat.explode(p.x, p.y, p.z, 50, 26, 'hero', h); },
        drawFn(c, sx, sy, p) {
          c.fillStyle = '#2a2a2e'; c.beginPath(); c.arc(sx, sy, 6, 0, 7); c.fill();
          c.fillStyle = (p.t >> 2) % 2 ? '#ffd040' : '#ff6020'; c.beginPath(); c.arc(sx + 4, sy - 5, 2, 0, 7); c.fill();
        },
      }));
    },
    firepot(h) {
      const m = S.muzzle(h, 20, 56);
      BK.game.addProjectile(new BK.Projectile({
        x: m.x, y: m.y, z: m.z, vx: h.face * 4.6, vz: 2.5, grav: 0.35, w: 12, h: 36, team: 'hero', owner: h, dmg: 6, kb: 'light', life: 120,
        onGround(p) { p.remove = true; S.firePatch(p.x, p.y, 'hero', h); },
        onHit(p) { p.remove = true; S.firePatch(p.x, p.y, 'hero', h); },
        drawFn(c, sx, sy, p) {
          c.fillStyle = '#8a5a3a'; c.beginPath(); c.arc(sx, sy, 6, 0, 7); c.fill();
          c.fillStyle = '#ff8a2a'; c.beginPath(); c.arc(sx, sy - 7, 3 + Math.sin(p.t) * 1, 0, 7); c.fill();
        },
      }));
    },
    /** 地面で燃え続ける炎（team の反対側にダメージ） */
    firePatch(x, y, team, owner, o) {
      o = o || {};
      BK.audio.sfx('fire');
      BK.game.addProjectile(new BK.Projectile({
        x, y, z: 14, vx: 0, w: o.w || 70, h: 30, depth: 20, team, owner, dmg: o.dmg || 5, kb: 'light', push: 1, stop: 1, life: o.life || 110, pierce: 99, noShadow: true, sfx: 'fire', fx: 'none',
        tick(p) {
          if (p.t % 18 === 0) p.hit.clear();
          if (p.t % 2 === 0) BK.fx.add({ type: 'glow', x: p.x + U.rand(-p.w / 2, p.w / 2), y: p.y + U.rand(-8, 8), z: U.rand(0, 10), vz: U.rand(0.8, 2), life: U.randi(14, 24), size: U.rand(8, 14), col: U.choose(['#ff7a1a', '#ffb040', '#ff4010']) });
        },
        drawFn(c, sx, sy, p) {
          const k = Math.min(1, p.life / 20);
          c.globalAlpha = 0.5 * k; c.fillStyle = '#ff5010';
          c.beginPath(); c.ellipse(sx, sy + 14, p.w / 2, 6, 0, 0, 7); c.fill(); c.globalAlpha = 1;
        },
      }));
    },
    spear(h) {
      const m = S.muzzle(h, 20, 62);
      BK.game.addProjectile(new BK.Projectile({
        x: m.x, y: m.y, z: m.z, vx: h.face * 13, w: 40, h: 56, team: 'hero', owner: h, dmg: 18, kb: 'down', push: 4, life: 70, pierce: 3, stop: 5,
        drawFn(c, sx, sy, p) {
          c.strokeStyle = '#6a4a2a'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(sx - p.face * 26, sy); c.lineTo(sx + p.face * 12, sy); c.stroke();
          R.poly(c, [sx + p.face * 12, sy - 3.5, sx + p.face * 22, sy, sx + p.face * 12, sy + 3.5], '#d0d4d8', '#333');
        },
      }));
    },
  };

  // ===================================================== auto-play (デモ / テスト用)
  const AC = BK.autoCtrl = { held: {}, pressed: {}, released: {}, heldFrames: {}, dirX: 0, dirY: 0, duFrame: -999, dashTap: 0, stickFull: 0, ax: 0, ay: 0, t: 0 };
  ['atk', 'jmp', 'sht', 'sp', 'awk', 'start', 'pause', 'up', 'down', 'left', 'right'].forEach(b => { AC.held[b] = false; AC.pressed[b] = false; AC.released[b] = false; AC.heldFrames[b] = 0; });
  AC.tap = function (b) { this.pressed[b] = true; this.held[b] = true; };
  AC.think = function (game) {
    const h = game.hero;
    this.t++;
    for (const b in this.pressed) { this.released[b] = this.held[b] && !this.pressed[b]; this.pressed[b] = false; this.held[b] = false; }
    this.dirX = 0; this.dirY = 0; this.dashTap = 0;
    if (!h || h.dead) return;
    if (h.state === 'grabbed') { if (this.t % 3 === 0) this.tap('atk'); this.dirX = this.t % 6 < 3 ? 1 : -1; return; }
    if (h.state === 'grab') { if (this.t % 10 === 0) this.tap('atk'); return; }
    // 最寄りの敵
    let best = null, bd = 1e9;
    for (const a of game.actors) {
      if (a.team !== 'enemy' || a.dead || a.hp <= 0) continue;
      if (a.x < BK.cam.x - 20 || a.x > BK.cam.x + BK.W + 20) continue;
      const d = Math.abs(a.x - h.x) + Math.abs(a.y - h.y) * 2;
      if (d < bd) { bd = d; best = a; }
    }
    // 回復アイテム
    if (h.hp < h.maxHp * 0.5) {
      for (const it of game.items) if (it.def.kind === 'food') { best = { x: it.x, y: it.y, item: true }; break; }
    }
    if (!best) { this.dirX = 1; this.dirY = h.y < BK.DEPTH / 2 - 10 ? 1 : h.y > BK.DEPTH / 2 + 10 ? -1 : 0; if (this.t % 90 < 2) this.tap('sht'); return; }
    const dx = best.x - h.x, dy = best.y - h.y;
    if (best.item) { this.dirX = Math.abs(dx) > 6 ? Math.sign(dx) : 0; this.dirY = Math.abs(dy) > 4 ? Math.sign(dy) : 0; return; }
    const range = best.boss ? 70 : 52;
    if (Math.abs(dy) > 7) this.dirY = Math.sign(dy);
    if (Math.abs(dx) > range + 12) this.dirX = Math.sign(dx);
    else if (Math.abs(dx) < 22) this.dirX = -Math.sign(dx || 1);
    else if (h.face !== Math.sign(dx)) this.dirX = Math.sign(dx);
    if (Math.abs(dx) <= range + 16 && Math.abs(dy) <= 12 && h.face === Math.sign(dx)) {
      if (this.t % 7 === 0) this.tap('atk');
    } else if (Math.abs(dy) <= 10 && Math.abs(dx) > 120 && this.t % 20 === 0) this.tap('sht');
    if (h.awk >= 100 && this.t % 30 === 0) this.tap('awk');
    const near = game.actors.filter(a => a.team === 'enemy' && !a.dead && Math.abs(a.x - h.x) < 60 && Math.abs(a.y - h.y) < 20).length;
    if (near >= 3 && h.hp > h.maxHp * 0.3 && this.t % 60 === 0) this.tap('sp');
  };

  // ===================================================== Hero
  class Hero extends BK.Actor {
    constructor(def, x, y) {
      super({
        team: 'hero', x, y, w: def.w || 26, h: def.h || 92, hp: def.maxHp, maxHp: def.maxHp,
        weight: def.weight || 1.3, shadowR: def.shadowR || 18,
      });
      this.def = def; this.spec = def.spec; this.stance = def.stance;
      this.lives = 2;                 // 残機（画面上の表示は lives）
      this.ammo = def.shot.max; this.shotCd = 0; this.shotRegenT = 0; this.reloading = 0; this.holdS = 0;
      this.sub = null;
      this.awk = 0; this.awkT = 0;
      this.combo = 0; this.lastAtkEnd = -99; this.lastAtkHit = false; this.bufA = 0;
      this.chargeT = 0; this.chargeRel = 0;
      this.runDir = 0; this.jumpAtkUsed = false; this.landT = 0;
      this.contactT = 0; this.grabT = 0; this.knees = 0; this.throwDir = 1;
      this.escape = 0; this.walkPh = 0;
      this.dmgMul = 1; this.speedMul = 1; this.superArmor = 0;
      this.downAfter = 4; this.getupInvul = 50; this.downTime = 30; this.deadTime = 1e9;
      this.bloodCol = '#9e0d14';
      this.isHero = true;
      if (def.init) def.init(this);
    }
    get ctrl() { return BK.autoplay ? BK.autoCtrl : BK.input; }
    get specialCost() { return Math.ceil(this.maxHp * (this.def.specialCost || 0.08)); }
    canSpecial() { return this.def.moves.special && this.hp > this.specialCost; }

    update(game) {
      const I = this.ctrl, d = this.def;
      this.animT++;
      if (I.pressed.atk) this._atkF = BK.frame;
      if (this.invul > 0) this.invul--;
      if (this.flash > 0) this.flash--;
      if (this.shotCd > 0) this.shotCd--;

      this.updateAwaken();
      if (d.update) d.update(this, game, I);
      // 溜め
      if (I.held.atk) this.chargeT++;

      if (this.chargeRel > 0) this.chargeRel--;
      if (this.grabbing) this.holdGrabbed();

      if (this.dead) { this.updateReactions(); this.physics(); return; }

      // ---- のけぞり中（必殺技で割り込み可）
      if (this.state === 'hurt' || this.state === 'fall' || this.state === 'down' || this.state === 'getup') {
        if (this.state === 'hurt' && this.canSpecial() && (I.pressed.sp || (I.pressed.atk && I.held.jmp) || (I.pressed.jmp && I.held.atk))) {
          this.doSpecial();

      }
      if (this.state === 'grabbed') { this.updateGrabbed(I); return; }

      // ---- 技の実行中
      if (this.move) {
        const m = this.move;
        if (I.pressed.atk) this.bufA = 9; else if (this.bufA > 0) this.bufA--;
        const spOk = (m.comboIdx != null || m === d.moves.dash || m === d.moves.shoot || m === d.moves.charge) && this.canSpecial();
        if (spOk && (I.pressed.sp || (m.comboIdx != null && I.pressed.jmp && BK.frame - (this._atkF == null ? -99 : this._atkF) <= 4))) {
          this.endMove(); this.doSpecial();
        } else if (I.pressed.awk && this.awk >= 100 && (m.comboIdx != null || m === d.moves.shoot) && !this._awkPending) {
          this.endMove(); this.doAwaken();
        } else if (m.comboIdx != null && this.mf >= (m.cancel || m.dur) && this.bufA > 0 && this.moveHit && m.comboIdx < 3) {
          this.bufA = 0; this.startCombo(m.comboIdx + 1);
        } else if (m.comboIdx != null && this.mf >= (m.cancel || m.dur) && this.chargeRel > 0 && d.moves.charge) {
          this.chargeRel = 0; this.startMove(d.moves.charge);
        } else if (m.cancelShot && this.mf >= m.cancelShot && I.pressed.sht && this.shotCd <= 0 && (this.sub || (this.ammo > 0 && !this.reloading))) {
          this.endMove(); this.shoot(I);
        }
        if (this.move) this.updateMove();
        this.physics();
        return;
      }
      if (this.state === 'grab') { this.updateGrab(I, game); this.physics(); return; }
      if (this.state === 'jsq') {
        this.st++;
        if ((I.pressed.atk || I.pressed.sp) && this.canSpecial()) { this.doSpecial(); this.physics(); return; }
        if (this.st >= 3) this.launchJump(I);

      }
      if (this.landT > 0) {
        if (I.pressed.sp && this.canSpecial()) { this.landT = 0; this.doSpecial(); this.physics(); return; }
        this.landT--; this.physics(); return;
      }
      if (this.z > 0 || this.state === 'air') { this.updateAir(I); this.physics(); return; }
      this.updateGround(I, game);
      this.physics();
    }

    // ------------------------------------------------------------ ground
    updateGround(I, game) {
      const d = this.def;
      // リロード中は無防備（撃ち切った／被弾で中断された場合も再開）
      if (this.reloading > 0 && d.shot.reloadLock && d.moves.reload && !this.sub) {
        this.startMove(d.moves.reload);
        this.mf = Math.max(0, d.moves.reload.dur - this.reloading);
        return;
      }
      if (I.pressed.sp && this.canSpecial()) { this.doSpecial(); return; }
      if (I.pressed.awk && this.awk >= 100) { this.doAwaken(); return; }
      if (I.pressed.jmp) {
        if (I.held.atk && I.heldFrames.atk <= 4 && this.canSpecial()) { this.doSpecial(); return; }
        this.state = 'jsq'; this.st = 0; this.jumpRun = this.state === 'run' ? this.runDir : 0;
        if (this._wasRun) this.jumpRun = this.runDir;
        return;
      }
      if (I.pressed.atk) {
        if (BK.frame - I.duFrame <= 12 && d.moves.rising) { this.vy = 0; this.startMove(d.moves.rising); return; }
        if (this._wasRun && d.moves.dash) { this.startMove(d.moves.dash); this._wasRun = false; return; }
        const next = (BK.frame - this.lastAtkEnd < 26 && this.lastAtkHit && this.combo < 3) ? this.combo + 1 : 0;
        this.startCombo(next);
        return;
      }
      if (this.chargeRel > 0 && d.moves.charge) { this.chargeRel = 0; this.startMove(d.moves.charge); return; }
      if (I.pressed.sht || (d.shot.auto && I.held.sht && this.shotCd <= 0) || (this.sub && I.held.sht && this.shotCd <= 0)) {
        if (this.shoot(I)) return;
      }
      if (d.shot.hold && I.held.sht && !this.sub) {
        this.holdS++;

          this.ammo -= d.shot.hold.cost; this.holdS = 0;
          d.shot.hold.fire(this);
          return;
        }
      } else this.holdS = 0;

      // 移動
      const sp = this.speedMul;
      let vx = I.dirX * d.walk * sp, vy = I.dirY * d.walkY * sp;
      if (I.dirX !== 0 && this.state !== 'run') {
        const tapDash = I.dashTap === I.dirX;
        const autoDash = (I.stickFull >= 22 && BK.input.touchMode) || (I.stickFull >= 1 && I === BK.input && BK.input.src.kb.run);
        if (tapDash || autoDash) { this.state = 'run'; this.runDir = I.dirX; this.autoRun = !tapDash; BK.fx.dust(this.x - this.face * 8, this.y, 3); }
      }
      if (this.state === 'run') {
        if (I.dirX !== this.runDir) this.state = 'idle';
        else { vx = this.runDir * d.run * sp; vy = I.dirY * d.walkY * 0.8 * sp; if (this.animT % 14 === 0) BK.fx.dust(this.x - this.face * 10, this.y, 2); }
      }

      if (I.dirX !== 0) this.face = I.dirX;
      this.vx = vx; this.vy = vy;
      if (this.state !== 'run') this.state = (vx || vy) ? 'walk' : 'idle';
      this.walkPh += this.state === 'run' ? 0.3 * sp : (vx || vy) ? 0.2 * sp : 0;
      // 掴み（敵に向かって歩き続ける）。倒しっぱなしの自動ダッシュでぶつかっても掴む（→→ の意図的なダッシュは素通り）
      if ((this.state === 'walk' || (this.state === 'run' && this.autoRun)) && I.dirX === this.face) {

    }
    startCombo(i) {
      this.combo = i;

    }
    endMove() {
      const m = this.move;
      super.endMove();
      if (m && m.comboIdx != null) { this.lastAtkEnd = BK.frame; this.lastAtkHit = this.moveHit; }
    }

      BK.audio.sfx('land'); BK.fx.dust(this.x, this.y, 4);
    }

    // ------------------------------------------------------------ shot
    updateShot() {
      const s = this.def.shot;
      if (this.reloading > 0) { if (--this.reloading === 0) { this.ammo = s.max; BK.audio.sfx('select', { pitch: 1.5 }); } return; }

    // ------------------------------------------------------------ special / awaken
    doSpecial() {
      const cost = this.specialCost;

      if (this.move) super.endMove();
      this.startMove(this.def.moves.special);

      BK.fx.flash('#ffffff', 4);
    }
    doAwaken() {
      const d = this.def;
      this.awk = 0;
      BK.audio.sfx('awaken');
      BK.fx.flash('#ff2010', 10);
      BK.fx.shake(6, 30);
      if (BK.game) BK.game.freeze(d.moves.awaken ? d.moves.awaken.dur : 50, this);
      if (d.moves.awaken) this.startMove(d.moves.awaken);

    activateAwaken() {

    updateAwaken() {

    // ------------------------------------------------------------ grab
    startGrab(e) {

      if (e.releaseToken) e.releaseToken();

    holdGrabbed() {

      e.x = this.x + this.face * (this.w / 2 + e.w / 2 - 6); e.y = this.y; e.z = 0; e.vx = 0; e.vy = 0;
    }
    updateGrab(I) {

      if (I.pressed.atk) {
        const dir = I.dirX;

        }

      }

    }
    releaseThrow() {

    updateGrabbed(I) {

      if (this.z > 0 && !g.move) { this.z = Math.max(0, this.z + this.vz); this.vz = this.z > 0 ? this.vz - BK.GRAV * (this.gravMul != null ? this.gravMul : 1) : 0; }

    // ------------------------------------------------------------ damage hooks
    onDamaged(dmg) {

      this.jumpAtkUsed = true;

    }
    onDealDamage(dmg, target) {

    die(src, h, dir) {

    }

      this.x = x; this.y = BK.DEPTH * 0.5; this.z = 180; this.vz = -2; this.vx = 0; this.vy = 0;
      this.invul = 170; this.flash = 0; this.hitCount = 0; this.move = null; this.grabbedBy = null; this.grabbing = null;
      this.ammo = this.def.shot.max; this.reloading = 0;

    }

        BK.fx.ring(this.x, this.y, 2, 120, '#ffd9a0', 22);
        BK.fx.shake(6, 14); BK.audio.sfx('cannon', { vol: 0.7 });
        if (BK.game) for (const a of BK.game.actors) {
          if (a.team !== 'enemy' || a.dead || a.boss) continue;
          if (Math.abs(a.x - this.x) < 160) a.takeHit(this, { dmg: 1, kb: 'down', push: 6, lift: 5 }, U.sign(a.x - this.x || 1));
        }
      }
    }

    // ------------------------------------------------------------ drawing
    currentPose() {
      const st = this.stance, d = this.def, an = d.anim || {};
      if (this.move) return R.sample(this.move.kf, this.mf, st);
      const rp = this.reactionPose(st);
      if (rp) return rp;
      if (this.state === 'grabbed') return R.merge(st, { lean: -10 + Math.sin(this.animT * 0.8) * 8, aF: 60 + Math.sin(this.animT * 0.9) * 30, aB: 50, eF: 60, eB: 60, lF: 15, kF: 20, lB: -15, kB: 10 });
      if (this.state === 'grab') return an.grab ? an.grab(this) : R.merge(st, { lean: 12, aF: 75, eF: 30, aB: 70, eB: 40, lF: 24, kF: 20, lB: -20, kB: 6 });
      if (this.state === 'jsq' || this.landT > 0) return an.crouch ? an.crouch(this) : R.merge(st, { lF: 50, kF: 80, lB: -10, kB: 70, lean: 16, drop: 2 });
      if (this.z > 0) {
        if (an.jump) return an.jump(this);
        const up = this.vz > 0;
        return R.merge(st, { lF: up ? 55 : 30, kF: up ? 90 : 40, lB: up ? -5 : -20, kB: up ? 80 : 30, lean: 8, aB: -50, eB: 40, cape: 1.3 });
      }
      if (this.state === 'run') return R.run(st, this.walkPh, d.runOpt);
      if (this.state === 'walk') return R.walk(st, this.walkPh, d.walkOpt);
      return R.idle(st, this.animT);
    }
    draw(c) {
      const d = this.def;
      if (this.invul > 0 && this.invul < 170 && !this.move && this.state !== 'down' && this.state !== 'getup' && (BK.frame >> 2) % 2 && this.invul > 20) c.globalAlpha = 0.45;
      const pose = this.currentPose();
      if (d.drawBack) d.drawBack(c, this);
      const colors = this.awkT > 0 && d.awaken && d.awaken.colors ? Object.assign({}, this.spec.colors, d.awaken.colors) : null;
      this.drawRig(c, pose, colors ? { colors, awakened: true } : { awakened: false });
      c.globalAlpha = 1;
      this.drawTrail(c);
      if (d.drawFront) d.drawFront(c, this);
      // 溜め完了の光
      if (this.chargeT >= CHARGE_FRAMES && d.moves.charge) {
        const k = (Math.sin(BK.frame * 0.5) + 1) / 2;

        skin: '#c99c7a', hair: '#141012', cloth: '#26222a', clothDark: '#18161b', sleeve: '#2c2830', body: '#302c33', armor: '#3b3840', armorHi: '#6a6670',
        belt: '#3a2618', boot: '#221f24', bootDark: '#151317', glove: '#2a262c', gloveDark: '#5f5b57',
        metal: '#6f6b66', metalDark: '#3c3a38', grip: '#2a1a10', cape: '#141116',
      },
      draw: { cape: R.capeDraw, head, torso, weapon: dragonslayer, arm, front },
    },
    stance: { lean: 6, head: 0, aF: 40, eF: 105, aB: -5, eB: 35, lF: 12, kF: 10, lB: -14, kB: 8, wAbs: -118, wBack: 1, cape: 0.3 },
    walkOpt: { lockF: true, stride: 24 },
    runOpt: { lockF: true, stride: 40, lean: 14 },
    moves,
    shot: {
      name: '連射式ボウガン', max: 10, regen: 16, cd: 8, auto: false, air: true,
      fire(h) { BK.heroShots.bolt(h, { dmg: 4, spd: 12, fwd: 38, z: 66 }); BK.audio.sfx('shoot'); },
      hold: { frames: 30, cost: 5, fire(h) { h.startMove(moves.cannon); } },
      hint: '長押しで大砲（弾5消費）',
    },
    awaken: {
      name: '狂戦士の甲冑', type: 'buff', dur: 600,
      colors: { cloth: '#18171b', clothDark: '#0f0e11', sleeve: '#1f1e23', body: '#232228', armor: '#26252b', boot: '#18171b', glove: '#1f1e23', gloveDark: '#3a3a40' },
      start(h) { h.dmgMul = 1.7; h.speedMul = 1.22; h.superArmor = 1; h.dmgTakenMul = 0.6; },
      update(h) {

      c.fillStyle = g; c.beginPath(); c.arc(sx, sy, 70, 0, 7); c.fill();

})(window.BK);
