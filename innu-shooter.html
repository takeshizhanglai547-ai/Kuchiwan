<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>イッヌ大作戦 - Bullet Hell Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none;font-family:monospace;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────
const W = 320, H = 480;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width  = W;
  canvas.height = H;
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ── WEB AUDIO ──────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function sfx(type) {
  try {
    const ac = getAudio();
    const t  = ac.currentTime;
    function beep(freq0, freq1, dur, wave, vol) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = wave;
      o.frequency.setValueAtTime(freq0, t);
      if (freq1 !== freq0) o.frequency.exponentialRampToValueAtTime(freq1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur);
    }
    if (type === 'shoot')   beep(880, 440, 0.07, 'square',   0.13);
    if (type === 'hit')     beep(150,  80, 0.12, 'square',   0.18);
    if (type === 'explode') beep(200,  50, 0.22, 'sawtooth', 0.28);
    if (type === 'bomb')    beep( 60,  30, 0.55, 'sawtooth', 0.45);
    if (type === 'powerup') {
      [440,660,880].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'triangle'; o.frequency.setValueAtTime(f, t + i*0.1);
        g.gain.setValueAtTime(0.18, t + i*0.1);
        g.gain.exponentialRampToValueAtTime(0.001, t + i*0.1 + 0.12);
        o.start(t + i*0.1); o.stop(t + i*0.1 + 0.15);
      });
    }
    if (type === 'gameover') {
      [880,660,440,220].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'square'; o.frequency.setValueAtTime(f, t + i*0.2);
        g.gain.setValueAtTime(0.18, t + i*0.2);
        g.gain.exponentialRampToValueAtTime(0.001, t + i*0.2 + 0.18);
        o.start(t + i*0.2); o.stop(t + i*0.2 + 0.2);
      });
    }
  } catch(e) {}
}

// BGM scheduler
let bgmType = null;
let bgmMaster = null;
let bgmLoopId = 0;

function stopBGM() {
  bgmLoopId++;
  if (bgmMaster) { try { bgmMaster.disconnect(); } catch(e){} bgmMaster = null; }
  bgmType = null;
}

function playBGM(type) {
  if (bgmType === type) return;
  stopBGM();
  bgmType = type;
  try {
    const ac = getAudio();
    bgmMaster = ac.createGain();
    bgmMaster.gain.setValueAtTime(0.10, ac.currentTime);
    bgmMaster.connect(ac.destination);
    const id = ++bgmLoopId;
    scheduleBGM(ac, type, id);
  } catch(e) {}
}

function note(ac, master, freq, start, dur, wave, vol) {
  if (!freq) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.connect(g); g.connect(master);
  o.type = wave; o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur * 0.85);
  o.start(start); o.stop(start + dur);
}

function scheduleBGM(ac, type, id) {
  if (bgmLoopId !== id || !bgmMaster) return;
  let t = ac.currentTime + 0.05;

  if (type === 'title') {
    const mel = [[523,.15],[659,.15],[784,.15],[1047,.3],[784,.15],[659,.15],[523,.3],
                 [587,.15],[698,.15],[880,.15],[1175,.3],[880,.15],[698,.15],[587,.45]];
    let total = 0;
    mel.forEach(([f,d]) => { note(ac, bgmMaster, f, t+total, d, 'square', 0.25); total+=d; });
    setTimeout(() => scheduleBGM(ac, type, id), (total - 0.05) * 1000);

  } else if (type === 'stage') {
    const mel = [[784,.1],[784,.1],[0,.05],[880,.1],[784,.1],[0,.05],[698,.1],[784,.2],[0,.1],
                 [659,.1],[659,.1],[0,.05],[784,.1],[659,.1],[0,.05],[587,.1],[659,.2],[0,.15]];
    const bas = [[131,.2],[131,.2],[147,.2],[131,.2],[123,.2],[123,.2],[131,.2],[131,.2]];
    let mt=0, bt=0, total=0;
    mel.forEach(([f,d]) => { note(ac, bgmMaster, f, t+mt, d, 'square',   0.22); mt+=d; total=mt; });
    bas.forEach(([f,d]) => { note(ac, bgmMaster, f, t+bt, d, 'sawtooth', 0.12); bt+=d; });
    setTimeout(() => scheduleBGM(ac, type, id), (total - 0.05) * 1000);

  } else if (type === 'boss') {
    const mel = [[220,.1],[0,.05],[220,.1],[0,.05],[262,.1],[247,.1],[233,.2],
                 [196,.1],[0,.05],[196,.1],[0,.05],[233,.1],[220,.1],[196,.2],
                 [175,.1],[0,.05],[175,.1],[0,.05],[220,.1],[196,.1],[175,.2],[0,.1]];
    let total = 0;
    mel.forEach(([f,d]) => {
      note(ac, bgmMaster, f,   t+total, d, 'sawtooth', 0.18);
      note(ac, bgmMaster, f*2, t+total, d, 'square',   0.09);
      total += d;
    });
    setTimeout(() => scheduleBGM(ac, type, id), (total - 0.05) * 1000);
  }
}

// ── INPUT ──────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const touch = {
  joy: { active:false, id:-1, sx:0, sy:0, dx:0, dy:0 },
  shot: false,
  bombPressed: false,
};

function touchZone(x, y) {
  if (x < W * 0.6) return 'joy';
  if (y > H * 0.7)  return 'shot';
  return 'bomb';
}
function toCanvas(cx, cy) {
  return {
    x: cx / (canvas.clientWidth  / W),
    y: cy / (canvas.clientHeight / H),
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  try { getAudio().resume(); } catch(_){}
  for (const t2 of e.changedTouches) {
    const {x, y} = toCanvas(t2.clientX, t2.clientY);
    const z = touchZone(x, y);
    if (z === 'joy' && !touch.joy.active)
      touch.joy = { active:true, id:t2.identifier, sx:x, sy:y, dx:0, dy:0 };
    else if (z === 'shot') touch.shot = true;
    else if (z === 'bomb') touch.bombPressed = true;
  }
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t2 of e.changedTouches) {
    if (t2.identifier === touch.joy.id) {
      const {x, y} = toCanvas(t2.clientX, t2.clientY);
      touch.joy.dx = x - touch.joy.sx;
      touch.joy.dy = y - touch.joy.sy;
    }
  }
}, { passive:false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t2 of e.changedTouches) {
    if (t2.identifier === touch.joy.id)
      touch.joy = { active:false, id:-1, sx:0, sy:0, dx:0, dy:0 };
    const {x, y} = toCanvas(t2.clientX, t2.clientY);
    const z = touchZone(x, y);
    if (z === 'shot') touch.shot = false;
  }
}, { passive:false });

function getInput() {
  let dx = 0, dy = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
  if (keys['ArrowUp']    || keys['KeyW']) dy -= 1;
  if (keys['ArrowDown']  || keys['KeyS']) dy += 1;

  if (touch.joy.active) {
    const JD = 40;
    const jx = touch.joy.dx, jy = touch.joy.dy;
    const d  = Math.sqrt(jx*jx + jy*jy);
    if (d > 5) { dx += jx / Math.max(d, JD); dy += jy / Math.max(d, JD); }
  }

  const len = Math.sqrt(dx*dx + dy*dy);
  if (len > 1) { dx /= len; dy /= len; }

  const shooting = !!(keys['KeyZ'] || keys['Space'] || touch.shot);
  const bomb     = !!(keys['KeyX'] || touch.bombPressed);
  if (touch.bombPressed) touch.bombPressed = false;
  return { dx, dy, shooting, bomb };
}

function drawTouchUI() {
  // Joystick ring
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(75, H-65, 38, 0, Math.PI*2); ctx.stroke();
  if (touch.joy.active) {
    const jx = touch.joy.sx, jy = touch.joy.sy;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(jx, jy, 38, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    const nx = Math.max(-30, Math.min(30, touch.joy.dx));
    const ny = Math.max(-30, Math.min(30, touch.joy.dy));
    ctx.beginPath(); ctx.arc(jx+nx, jy+ny, 16, 0, Math.PI*2); ctx.fill();
  }
  // SHOT button
  ctx.fillStyle = touch.shot ? 'rgba(255,220,0,0.55)' : 'rgba(255,200,0,0.22)';
  ctx.beginPath(); ctx.arc(W-42, H-52, 26, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,0,0.65)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SHOT', W-42, H-52);
  // BOMB button
  ctx.fillStyle = 'rgba(80,180,255,0.22)';
  ctx.beginPath(); ctx.arc(W-42, H-110, 20, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(80,200,255,0.65)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 8px monospace';
  ctx.fillText('BOMB', W-42, H-110);
}

// ── BACKGROUND ─────────────────────────────────────────────
const stars = Array.from({length:80}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  spd: 0.5+Math.random()*2, r: 0.5+Math.random()*1.5, b: 0.3+Math.random()*0.7,
}));
function updateStars() {
  stars.forEach(s => { s.y += s.spd; if (s.y > H) { s.y=0; s.x=Math.random()*W; } });
}
function drawBackground(stageIdx) {
  const palettes = [
    ['#0a0022','#1a0040'],
    ['#180400','#381200'],
    ['#06000e','#120020'],
    ['#000000','#060010'],
  ];
  const [c1,c2] = palettes[Math.min(stageIdx, 3)];
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  stars.forEach(s => {
    ctx.fillStyle = `rgba(255,255,255,${s.b})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });
  // Stage deco
  if (stageIdx === 1) {
    ctx.fillStyle = 'rgba(180,150,255,0.05)';
    [[60,90],[160,180],[260,130]].forEach(([x,y]) => {
      ctx.beginPath(); ctx.ellipse(x,y,55,14,0,0,Math.PI*2); ctx.fill();
    });
  } else if (stageIdx === 2) {
    ctx.fillStyle = 'rgba(35,8,0,0.55)';
    for (let i=0;i<10;i++) {
      const bh = 35+((i*37)%55);
      ctx.fillRect(i*32, H-bh, 28, bh);
    }
  }
}

// ── DRAW HELPERS ───────────────────────────────────────────
function drawHpBar(x, y, w, hp, maxHp) {
  const r = Math.max(0, hp/maxHp);
  ctx.fillStyle='#222'; ctx.fillRect(x-w/2, y, w, 5);
  ctx.fillStyle = r>0.5?'#0f0':r>0.25?'#ff0':'#f33';
  ctx.fillRect(x-w/2, y, w*r, 5);
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.5;
  ctx.strokeRect(x-w/2, y, w, 5);
}

// ── PLAYER SPRITE ──────────────────────────────────────────
function drawPlayer(x, y, time, invincible) {
  if (invincible && Math.sin(time*22) > 0) return;
  const b = Math.sin(time*6)*1.5;
  // Body
  ctx.fillStyle='#f4f4f4';
  ctx.beginPath(); ctx.ellipse(x,y+b,14,16,0,0,Math.PI*2); ctx.fill();
  // Fur tufts
  ctx.fillStyle='#fff';
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*13,y+b+Math.sin(a)*14,5,5,a,0,Math.PI*2); ctx.fill();
  }
  // Head
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(x,y-10+b,12,11,0,0,Math.PI*2); ctx.fill();
  // Ears
  ctx.fillStyle='#eaeaea';
  ctx.beginPath(); ctx.ellipse(x-10,y-17+b,5,8,-0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+10,y-17+b,5,8, 0.3,0,Math.PI*2); ctx.fill();
  // Eyes
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(x-4,y-11+b,3,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+4,y-11+b,3,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x-3,y-13+b,1.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+5, y-13+b,1.2,0,Math.PI*2); ctx.fill();
  // Nose
  ctx.fillStyle='#ff9999';
  ctx.beginPath(); ctx.ellipse(x,y-7+b,2.5,2,0,0,Math.PI*2); ctx.fill();
  // Blush
  ctx.fillStyle='rgba(255,140,140,0.45)';
  ctx.beginPath(); ctx.ellipse(x-7,y-9+b,3.5,2,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+7,y-9+b,3.5,2,0,0,Math.PI*2); ctx.fill();
  // Smile
  ctx.strokeStyle='#cc8888'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(x,y-5+b,3,0.2,Math.PI-0.2); ctx.stroke();
  // Paws
  const pb = Math.sin(time*6+Math.PI)*2;
  ctx.fillStyle='#f0f0f0';
  ctx.beginPath(); ctx.ellipse(x-12,y+2+b+pb, 5,6,-0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+12,y+2+b-pb, 5,6, 0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#cc8888';
  ctx.beginPath(); ctx.ellipse(x-12,y+5+b+pb,3,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+12,y+5+b-pb,3,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#bb7777';
  [-1.5,0,1.5].forEach(o=>{
    ctx.beginPath(); ctx.arc(x-12+o,y+3+b+pb,0.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+12+o,y+3+b-pb,0.8,0,Math.PI*2); ctx.fill();
  });
}

// ── BONE BULLET ────────────────────────────────────────────
function drawBone(x, y) {
  ctx.fillStyle='#fffde7'; ctx.strokeStyle='#ccc'; ctx.lineWidth=0.5;
  ctx.fillRect(x-1.5,y-7,3,10); ctx.strokeRect(x-1.5,y-7,3,10);
  [y-7,y+3].forEach(cy=>{
    ctx.beginPath(); ctx.arc(x,cy,3,0,Math.PI*2); ctx.fill(); ctx.stroke();
  });
}

// ── ENEMY SPRITES ──────────────────────────────────────────
function drawPom(x, y, time) {
  const b=Math.sin(time*4+x)*1;
  ctx.fillStyle='#ff9933';
  ctx.beginPath(); ctx.ellipse(x,y+b,10,11,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffbb55';
  for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2;ctx.beginPath();ctx.arc(x+Math.cos(a)*10,y+b+Math.sin(a)*10,4,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#ffcc66';
  ctx.beginPath(); ctx.arc(x,y-8+b,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(x-3,y-8+b,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+3,y-8+b,2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#111'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x-5,y-11+b); ctx.lineTo(x-1,y-10+b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+5,y-11+b); ctx.lineTo(x+1,y-10+b); ctx.stroke();
  ctx.fillStyle='#446';
  ctx.beginPath(); ctx.ellipse(x,y-12+b,7,5,0,Math.PI,Math.PI*2); ctx.fill();
}

function drawShiba(x, y, time) {
  const b=Math.sin(time*3.5+x)*1.2;
  ctx.fillStyle='#cc5500';
  ctx.beginPath(); ctx.ellipse(x,y+b,9,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff5e0';
  ctx.beginPath(); ctx.ellipse(x,y+2+b,5,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#dd6600';
  ctx.beginPath(); ctx.ellipse(x,y-10+b,9,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff5e0';
  ctx.beginPath(); ctx.ellipse(x,y-8+b,5,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(x-3,y-11+b,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+3,y-11+b,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#dd6600';
  ctx.beginPath(); ctx.moveTo(x-6,y-14+b); ctx.lineTo(x-10,y-22+b); ctx.lineTo(x-2,y-16+b); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+6,y-14+b); ctx.lineTo(x+10,y-22+b); ctx.lineTo(x+2,y-16+b); ctx.fill();
}

function drawMiniBoss(x, y, time, hp, maxHp) {
  const b=Math.sin(time*2)*2;
  ctx.fillStyle='#888866';
  ctx.beginPath(); ctx.ellipse(x,y+b,20,22,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#999977';
  ctx.beginPath(); ctx.ellipse(x,y-18+b,18,15,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#777755'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x-8,y-18+b); ctx.lineTo(x-3,y-16+b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+8,y-18+b); ctx.lineTo(x+3,y-16+b); ctx.stroke();
  ctx.fillStyle='#cc2200';
  ctx.beginPath(); ctx.arc(x-5,y-20+b,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+5,y-20+b,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff0';
  ctx.beginPath(); ctx.arc(x-4,y-21+b,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+6,y-21+b,1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#553322';
  ctx.beginPath(); ctx.ellipse(x,y-12+b,5,4,0,0,Math.PI*2); ctx.fill();
  drawHpBar(x, y-40+b, 50, hp, maxHp);
}

// ── BOSS SPRITE ────────────────────────────────────────────
function drawBoss(x, y, time, hp, maxHp, phase) {
  const b = Math.sin(time*1.5)*3;
  const pulse = Math.sin(time*4)*0.1+0.9;
  // Aura phase 2+
  if (phase >= 2) {
    for (let r=68; r>28; r-=10) {
      ctx.fillStyle=`rgba(80,0,${100+r},${0.06*(r/68)})`;
      ctx.beginPath(); ctx.arc(x,y+b,r*pulse,0,Math.PI*2); ctx.fill();
    }
  }
  // Cape
  ctx.fillStyle='#4a0070';
  ctx.beginPath();
  ctx.moveTo(x-35,y-5+b);
  ctx.bezierCurveTo(x-40,y+40+b,x-20,y+50+b,x,y+45+b);
  ctx.bezierCurveTo(x+20,y+50+b,x+40,y+40+b,x+35,y-5+b);
  ctx.fill();
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x-35,y-5+b);
  ctx.bezierCurveTo(x-40,y+40+b,x-20,y+50+b,x,y+45+b);
  ctx.bezierCurveTo(x+20,y+50+b,x+40,y+40+b,x+35,y-5+b);
  ctx.stroke();
  // Body
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(x,y+10+b,28,30,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a1a';
  for(let i=0;i<7;i++){const a=(i/7)*Math.PI*2;ctx.beginPath();ctx.arc(x+Math.cos(a)*27,y+10+b+Math.sin(a)*28,10,0,Math.PI*2);ctx.fill();}
  // Medal
  ctx.fillStyle='#ffd700';
  ctx.beginPath(); ctx.arc(x,y+8+b,9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#cc0000'; ctx.font='bold 10px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('帝',x,y+8+b);
  // Head
  ctx.fillStyle='#0d0d0d';
  ctx.beginPath(); ctx.ellipse(x,y-25+b,24,22,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a1a';
  for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2;ctx.beginPath();ctx.arc(x+Math.cos(a)*23,y-25+b+Math.sin(a)*21,7,0,Math.PI*2);ctx.fill();}
  // Glowing eyes
  const ec = phase>=3?'#ff0000':phase>=2?'#dd00cc':'#cc0088';
  ctx.shadowColor=ec; ctx.shadowBlur=12;
  ctx.fillStyle=ec;
  ctx.beginPath(); ctx.ellipse(x-8,y-28+b,6,7,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+8,y-28+b,6,7,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(x-8,y-27+b,3,4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+8,y-27+b,3,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x-6,y-30+b,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+10,y-30+b,1.5,0,Math.PI*2); ctx.fill();
  // Fangs
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(x-5,y-16+b); ctx.lineTo(x-3,y-10+b); ctx.lineTo(x-1,y-16+b); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+1,y-16+b); ctx.lineTo(x+3,y-10+b); ctx.lineTo(x+5,y-16+b); ctx.fill();
  // Crown
  ctx.fillStyle='#ffd700';
  ctx.beginPath();
  ctx.moveTo(x-18,y-42+b); ctx.lineTo(x-18,y-52+b); ctx.lineTo(x-9,y-45+b);
  ctx.lineTo(x,y-58+b); ctx.lineTo(x+9,y-45+b); ctx.lineTo(x+18,y-52+b);
  ctx.lineTo(x+18,y-42+b); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#cc9900'; ctx.lineWidth=1.5; ctx.stroke();
  [{x:x-9,c:'#c00'},{x,c:'#00c'},{x:x+9,c:'#c00'}].forEach(g=>{
    ctx.fillStyle=g.c; ctx.beginPath(); ctx.arc(g.x,y-47+b,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(g.x-1,y-49+b,1,0,Math.PI*2); ctx.fill();
  });
  // HP bar
  drawHpBar(x, y-82+b, 120, hp, maxHp);
  ctx.fillStyle='#fff'; ctx.font='8px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`PHASE ${phase}`, x, y-88+b);
}

// ── ENEMY BULLETS ──────────────────────────────────────────
function drawEBullet(x, y, type) {
  const colors = { round:'#ff3333', big:'#ff6600', spiral:'#cc00ff', fast:'#ffee00' };
  const radii  = { round:4, big:6, spiral:5, fast:3 };
  ctx.fillStyle  = colors[type] || '#f33';
  ctx.shadowColor = colors[type] || '#f33';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(x,y,radii[type]||4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}

// ── POWERUP ────────────────────────────────────────────────
function drawPowerup(x, y, time) {
  const p = Math.sin(time*4)*2;
  ctx.fillStyle='#ffdd00'; ctx.strokeStyle='#ff8800'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2-Math.PI/2;
    ctx.lineTo(x+Math.cos(a)*(8+p),          y+Math.sin(a)*(8+p));
    ctx.lineTo(x+Math.cos(a+Math.PI/5)*(4+p*0.5), y+Math.sin(a+Math.PI/5)*(4+p*0.5));
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 8px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('P',x,y);
}

// ── BOMB EFFECT ────────────────────────────────────────────
function drawBombEffect(x, y, t) {
  const r = t * 320;
  if (r <= 0 || r > 320) return;
  const a = 1-t;
  ctx.strokeStyle=`rgba(255,255,200,${a})`; ctx.lineWidth=10*a;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.lineWidth=1;
  ctx.fillStyle=`rgba(255,255,150,${a*0.25})`;
  ctx.beginPath(); ctx.arc(x,y,r*0.8,0,Math.PI*2); ctx.fill();
  if (t < 0.4) {
    ctx.fillStyle=`rgba(255,255,0,${1-t*2.5})`;
    ctx.font=`bold ${28+t*45}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('BARK!',W/2,H/2);
  }
}

// ── PARTICLES ──────────────────────────────────────────────
const particles = [];
function spawnExp(x, y, n, c1, c2) {
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, spd=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1,decay:0.02+Math.random()*0.04,r:2+Math.random()*4,
      color:Math.random()>0.5?c1:c2});
  }
}
function updateParticles() {
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.95; p.vy*=0.95; p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles() {
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ── HUD ────────────────────────────────────────────────────
function drawHUD(pl, score) {
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,28);
  // Lives
  for(let i=0;i<pl.lives;i++){
    ctx.fillStyle='#ff4466'; ctx.font='14px serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('♥', 8+i*16, 10);
  }
  // Bombs
  for(let i=0;i<pl.bombs;i++){
    ctx.fillStyle='#44aaff';
    ctx.beginPath(); ctx.arc(10+i*12,22,4,0,Math.PI*2); ctx.fill();
  }
  // Power
  ctx.fillStyle='#ffdd00'; ctx.font='10px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`PWR ${pl.power}`, W/2, 14);
  // Score
  ctx.fillStyle='#fff'; ctx.textAlign='right';
  ctx.fillText(String(score).padStart(8,'0'), W-5, 14);
}

function spawnWave(w) {
  if (w.type === 'boss') { startBossIntro(); return; }
  const sp = 35, n = w.count;
  for(let i=0;i<n;i++){
    const ox = (i-(n-1)/2)*sp;
    enemies.push({
      type:w.type, x:w.x+ox, y:-30,
      vy:w.vy, dx:w.dx, hp:w.hp, maxHp:w.hp,
      shootTimer:0.5+Math.random(), shootRate:w.sr,
      pat:w.pat, dead:false,
    });
  }
}

// ── ENEMY SHOOTING ─────────────────────────────────────────
function fireEnemy(e) {
  const dx=PL.x-e.x, dy=PL.y-e.y, d=Math.sqrt(dx*dx+dy*dy)||1;
  function eb(vx,vy,type){ eBullets.push({x:e.x,y:e.y,vx,vy,type}); }
  if (e.pat==='down')    eb(0,3,'round');
  else if (e.pat==='aimed') eb((dx/d)*3,(dy/d)*3,'fast');
  else if (e.pat==='spread'){
    [-0.3,0,0.3].forEach(a=>{
      const ang=Math.atan2(dy,dx)+a;
      eb(Math.cos(ang)*2.5,Math.sin(ang)*2.5,'round');
    });
  } else if (e.pat==='spread3'){
    [-0.5,-0.25,0,0.25,0.5].forEach(a=>{
      eb(Math.sin(a)*2, 2.5+Math.cos(a)*0.5,'round');
    });
  } else if (e.pat==='circle'){
    const n=e.type==='mini'?8:6;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2;
      eb(Math.cos(a)*2,Math.sin(a)*2,'round');
    }
  }
}

// ── BOSS ───────────────────────────────────────────────────
function createBoss() {
  const hp = 2000+G.stage*600;
  return {x:W/2,y:-90,targetY:85,hp,maxHp:hp,
          phase:1,angle:0,moveTimer:0,targetX:W/2,
          shootTimer:1,patTimer:0,patIdx:0,dead:false};
}

function updateBoss(dt) {
  if(!boss||boss.dead) return;
  boss.angle += dt*1.3;
  // Move in
  if(boss.y < boss.targetY) boss.y += 55*dt;
  // Horizontal drift
  boss.moveTimer -= dt;
  if(boss.moveTimer<=0){ boss.targetX=60+Math.random()*(W-120); boss.moveTimer=1.5+Math.random(); }
  boss.x += (boss.targetX-boss.x)*dt*1.6;
  // Phase
  const r=boss.hp/boss.maxHp;
  if(r<0.33 && boss.phase<3){ boss.phase=3; spawnExp(boss.x,boss.y,30,'#f00','#f80'); sfx('explode'); }
  else if(r<0.66 && boss.phase<2){ boss.phase=2; spawnExp(boss.x,boss.y,20,'#c0f','#f0c'); sfx('explode'); }
  // Shoot
  boss.shootTimer -= dt;
  boss.patTimer    -= dt;
  if(boss.patTimer<=0){ boss.patIdx=(boss.patIdx+1)%4; boss.patTimer=5-boss.phase; }
  if(boss.shootTimer<=0){
    boss.shootTimer = boss.phase===3?0.32:boss.phase===2?0.48:0.68;
    fireBoss();
  }
}

function fireBoss() {
  const bx=boss.x, by=boss.y, p=boss.phase, pat=boss.patIdx;
  function eb(vx,vy,type){ eBullets.push({x:bx,y:by,vx,vy,type}); }
  if(pat===0){ // circle
    const n=8+p*4;
    for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+boss.angle; const spd=2+p*0.4; eb(Math.cos(a)*spd,Math.sin(a)*spd,p>=3?'big':'round');}
  } else if(pat===1){ // aimed burst
    const dx=PL.x-bx,dy=PL.y-by,d=Math.sqrt(dx*dx+dy*dy)||1;
    const sp=p>=2?3:2;
    for(let i=-sp;i<=sp;i++){const a=Math.atan2(dy,dx)+i*0.14; const spd=2.5+p*0.4; eb(Math.cos(a)*spd,Math.sin(a)*spd,'fast');}
  } else if(pat===2 && p>=2){ // spiral
    for(let j=0;j<2;j++){const a=boss.angle*2+j*Math.PI; eb(Math.cos(a)*2.3,Math.sin(a)*2.3,'spiral');}
  } else if(pat===3 && p>=3){ // 16-way
    for(let i=0;i<16;i++){const a=(i/16)*Math.PI*2; eb(Math.cos(a)*2.8,Math.sin(a)*2.8,'big');}
  } else { // fallback aimed
    const dx=PL.x-bx,dy=PL.y-by,d=Math.sqrt(dx*dx+dy*dy)||1;
    eb((dx/d)*2.5,(dy/d)*2.5,'round');
  }
}

// ── PLAYER ACTIONS ─────────────────────────────────────────
function playerShoot(dt, inp) {
  PL.shootTimer -= dt;
  if(inp.shooting && PL.shootTimer<=0){
    PL.shootTimer = PL.shotRate;
    sfx('shoot');
    const pw=PL.power;
    function pb(vx,vy){ pBullets.push({x:PL.x,y:PL.y-20,vx,vy}); }
    pb(0,-9);
    if(pw>=2){ pb(-0.3,-8.5); pb(0.3,-8.5); }
    if(pw>=3){ pb(-0.9,-8);   pb(0.9,-8);   }
    if(pw>=5){ pb(-1.6,-7);   pb(1.6,-7);   }
  }
}

function useBomb() {
  if(PL.bombs<=0) return;
  PL.bombs--; sfx('bomb');
  bombFx = {timer:0};
  eBullets = [];
  enemies.forEach(e=>{ e.hp-=50; spawnExp(e.x,e.y,5,'#ff0','#f80'); });
  enemies = enemies.filter(e=>e.hp>0);
  if(boss){ boss.hp-=300; spawnExp(boss.x,boss.y,20,'#ff0','#f80'); }
}

function playerHit() {
  sfx('hit'); PL.lives--; PL.invincible=3;
  PL.power = Math.max(1,PL.power-1);
  spawnExp(PL.x,PL.y,20,'#fff','#faa');
  eBullets=[];
  if(PL.lives<=0){
    sfx('gameover');
    setTimeout(()=>{ if(G.score>G.hiScore)G.hiScore=G.score; G.state='game_over'; G.stateTime=0; stopBGM(); },800);
  }
}

// ── COLLISION ──────────────────────────────────────────────
function checkCollisions() {
  // Player bullets → enemies
  for(let bi=pBullets.length-1;bi>=0;bi--){
    const b=pBullets[bi]; let hit=false;
    for(let ei=enemies.length-1;ei>=0;ei--){
      const e=enemies[ei];
      const r=e.type==='mini'?20:12;
      if(Math.hypot(b.x-e.x,b.y-e.y)<r){
        hit=true; e.hp--;
        if(e.hp<=0){
          spawnExp(e.x,e.y,e.type==='mini'?20:10,'#f80','#ff0');
          sfx('explode');
          G.score += e.type==='mini'?500:100;
          if(Math.random()<(e.type==='mini'?0.6:0.15)) powerups.push({x:e.x,y:e.y,vy:1.5});
          enemies.splice(ei,1);
        }
        break;
      }
    }
    if(!hit && boss && !boss.dead && Math.hypot(b.x-boss.x,b.y-boss.y)<32){
      hit=true;
      boss.hp -= PL.power>=3?12:PL.power>=2?8:5;
      if(boss.hp<=0){
        boss.hp=0; boss.dead=true;
        spawnExp(boss.x,boss.y,60,'#f00','#ff0'); sfx('explode');
        G.score += 5000*G.stage;
        setTimeout(()=>sfx('explode'),300); setTimeout(()=>sfx('explode'),600);
        if(G.stage>=3) setTimeout(()=>{ G.state='ending'; G.stateTime=0; },2200);
        else           setTimeout(()=>{ G.stage++; startGame(G.stage); },2200);
      }
    }
    if(hit || b.y<-20 || b.x<-20 || b.x>W+20) pBullets.splice(bi,1);
  }
  // Enemy bullets → player
  if(PL.invincible>0) return;
  for(let bi=eBullets.length-1;bi>=0;bi--){
    if(Math.hypot(eBullets[bi].x-PL.x,eBullets[bi].y-PL.y)<7){
      eBullets.splice(bi,1); playerHit(); return;
    }
  }
  // Enemies → player
  for(const e of enemies){
    if(Math.hypot(e.x-PL.x,e.y-PL.y)<14){ playerHit(); return; }
  }
  // Powerups → player
  for(let pi=powerups.length-1;pi>=0;pi--){
    if(Math.hypot(powerups[pi].x-PL.x,powerups[pi].y-PL.y)<16){
      powerups.splice(pi,1);
      if(PL.power<5){ PL.power++; sfx('powerup'); } else G.score+=200;
    }
  }
}

// ── GAME INIT ──────────────────────────────────────────────
function startGame(stage) {
  G.stage=stage||1; G.state='playing'; G.stateTime=0;
  G.waveTimer=0; G.waveIdx=0;
  Object.assign(PL,{x:W/2,y:H-80,lives:3,bombs:3,power:1,invincible:2,shootTimer:0});
  pBullets=[]; eBullets=[]; enemies=[]; powerups=[]; boss=null; bombFx=null;
  particles.length=0;
  playBGM('stage');
}

function startBossIntro() {
  G.state='boss_intro'; G.stateTime=0;
  enemies=[]; eBullets=[];
  boss=createBoss();
  playBGM('boss');
}

// ── GAME LOOP ──────────────────────────────────────────────
function updateCommon(dt, inp) {
  PL.x += inp.dx*PL.speed; PL.y += inp.dy*PL.speed;
  PL.x = Math.max(15,Math.min(W-15,PL.x));
  PL.y = Math.max(30,Math.min(H-20,PL.y));
  if(PL.invincible>0) PL.invincible-=dt;
  playerShoot(dt,inp);
  if(inp.bomb) useBomb();
  pBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  pBullets=pBullets.filter(b=>b.y>-30&&b.x>-30&&b.x<W+30);
  eBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  eBullets=eBullets.filter(b=>b.y<H+30&&b.y>-30&&b.x>-30&&b.x<W+30);
  powerups.forEach(p=>{p.y+=p.vy;}); powerups=powerups.filter(p=>p.y<H+20);
  if(bombFx){ bombFx.timer+=dt; if(bombFx.timer>1) bombFx=null; }
  updateParticles();
  checkCollisions();
}

function updatePlaying(dt) {
  G.waveTimer+=dt;
  const ws=WAVES[G.stage]||WAVES[1];
  while(G.waveIdx<ws.length && ws[G.waveIdx].t<=G.waveTimer) spawnWave(ws[G.waveIdx++]);
  updateCommon(dt, getInput());
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; e.y+=e.vy; e.x+=e.dx;
    if(e.x<20||e.x>W-20) e.dx*=-1;
    if(e.y>H+60){ enemies.splice(i,1); continue; }
    e.shootTimer-=dt;
    if(e.shootTimer<=0){ e.shootTimer=e.shootRate; fireEnemy(e); }
  }
}

function drawScene() {
  powerups.forEach(p=>drawPowerup(p.x,p.y,G.time));
  pBullets.forEach(b=>drawBone(b.x,b.y));
  eBullets.forEach(b=>drawEBullet(b.x,b.y,b.type));
  enemies.forEach(e=>{
    if(e.type==='pom')   drawPom(e.x,e.y,G.time);
    else if(e.type==='shiba') drawShiba(e.x,e.y,G.time);
    else if(e.type==='mini')  drawMiniBoss(e.x,e.y,G.time,e.hp,e.maxHp);
  });
  if(boss&&!boss.dead) drawBoss(boss.x,boss.y,G.time,boss.hp,boss.maxHp,boss.phase);
  if(PL.lives>0) drawPlayer(PL.x,PL.y,G.time,PL.invincible>0);
  drawParticles();
  if(bombFx) drawBombEffect(PL.x,PL.y,bombFx.timer);
  drawHUD(PL,G.score);
  drawTouchUI();
}

// ── SCREENS ────────────────────────────────────────────────
let titleBlink=0;
function drawTitle(dt) {
  playBGM('title');
  titleBlink+=dt;
  // Title
  ctx.font='bold 30px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#220044'; ctx.fillText('イッヌ大作戦',W/2+2,102);
  const tg=ctx.createLinearGradient(0,80,0,120);
  tg.addColorStop(0,'#ffff00'); tg.addColorStop(0.5,'#ff8800'); tg.addColorStop(1,'#ff4400');
  ctx.fillStyle=tg; ctx.fillText('イッヌ大作戦',W/2,100);
  ctx.fillStyle='#aaf'; ctx.font='11px monospace';
  ctx.fillText('INNU DAISAKUSEN',W/2,130);
  ctx.fillText('BULLET HELL SHOOTER',W/2,145);
  // Player preview
  drawPlayer(W/2-55, 220, G.time, false);
  // Boss preview
  ctx.save(); ctx.scale(0.4,0.4);
  drawBoss((W/2+70)/0.4, 220/0.4, G.time, 2000,2000,1);
  ctx.restore();
  // Hi-score
  ctx.fillStyle='#ffdd00'; ctx.font='10px monospace';
  ctx.fillText(`HI-SCORE: ${String(G.hiScore).padStart(8,'0')}`,W/2,295);
  // Blink
  if(Math.sin(titleBlink*3)>0){
    ctx.fillStyle='#fff'; ctx.font='bold 11px monospace';
    ctx.fillText('PRESS Z / TAP TO START',W/2,335);
  }
  ctx.fillStyle='#666'; ctx.font='8px monospace';
  ctx.fillText('ARROWS/WASD: MOVE  Z/SPACE: SHOT  X: BOMB',W/2,375);
  ctx.fillText('TOUCH: JOYSTICK | SHOT | BOMB',W/2,388);
  drawTouchUI();
  if(keys['KeyZ']||keys['Space']||keys['Enter']||touch.bombPressed||touch.shot){
    touch.bombPressed=false; touch.shot=false;
    G.score=0; startGame(1); try{getAudio().resume();}catch(_){}
  }
}

function drawBossIntro() {
  if(boss) drawBoss(boss.x,boss.y,G.time,boss.hp,boss.maxHp,1);
  drawPlayer(PL.x,PL.y,G.time,false); drawParticles();
  if(Math.sin(G.stateTime*8)>0){ ctx.fillStyle='rgba(255,0,0,0.13)'; ctx.fillRect(0,0,W,H); }
  if(G.stateTime<2.5){
    ctx.fillStyle='#f00'; ctx.font='bold 16px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('!! WARNING !!',W/2,H/2-20);
    ctx.fillStyle='#fcc'; ctx.font='11px monospace';
    ctx.fillText('ダークワンワン大帝',W/2,H/2+5);
    ctx.fillText('DARK WANWAN EMPEROR',W/2,H/2+22);
  }
  drawHUD(PL,G.score);
}

function drawStageClear() {
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  const fl=Math.sin(G.stateTime*5)>0;
  ctx.fillStyle=fl?'#ff0':'#fff'; ctx.font='bold 22px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('STAGE CLEAR!',W/2,H/2-20);
  ctx.fillStyle='#aff'; ctx.font='11px monospace';
  ctx.fillText(`SCORE: ${G.score}`,W/2,H/2+12);
  ctx.fillText(`STAGE ${G.stage} START!`,W/2,H/2+30);
  drawPlayer(W/2, H/2+85, G.time*2, false);
}

function drawGameOver() {
  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f22'; ctx.font='bold 26px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('GAME OVER',W/2,H/2-55);
  ctx.fillStyle='#fff'; ctx.font='11px monospace';
  ctx.fillText(`SCORE: ${G.score}`,W/2,H/2-10);
  ctx.fillText(`HI-SCORE: ${G.hiScore}`,W/2,H/2+8);
  if(Math.sin(G.stateTime*2)>0){
    ctx.fillStyle='#aaf'; ctx.font='10px monospace';
    ctx.fillText('PRESS Z / TAP TO RETRY',W/2,H/2+38);
  }
  ctx.globalAlpha=0.55; drawPlayer(W/2,H/2+85,0,false); ctx.globalAlpha=1;
  ctx.fillStyle='#888'; ctx.font='10px monospace'; ctx.fillText('x_x',W/2,H/2+112);
  drawTouchUI();
  if(keys['KeyZ']||keys['Space']||touch.bombPressed||touch.shot){
    touch.bombPressed=false; touch.shot=false; G.score=0; startGame(1);
  }
}

function drawEnding(dt) {
  const t=G.stateTime;
  if(Math.random()<0.25) spawnExp(Math.random()*W,Math.random()*H*0.5,4,'#ff0','#f80');
  updateParticles(); drawParticles();
  ctx.fillStyle='rgba(0,0,12,0.45)'; ctx.fillRect(0,0,W,H);
  if(t>0.8){
    const tg=ctx.createLinearGradient(0,65,0,115);
    tg.addColorStop(0,'#ff0'); tg.addColorStop(1,'#f80');
    ctx.fillStyle=tg; ctx.font='bold 20px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('CONGRATULATIONS!',W/2,88);
    ctx.fillStyle='#fcc'; ctx.font='10px monospace';
    ctx.fillText('ダークワンワン大帝を倒した！',W/2,112);
  }
  if(t>1.8){ drawPlayer(W/2,195,G.time*3,false); }
  if(t>2.5){
    ctx.fillStyle='#fff'; ctx.font='10px monospace';
    ctx.textAlign='center'; ctx.fillText('イッヌは世界を救った！',W/2,245);
    ctx.fillStyle='#ff0'; ctx.font='11px monospace';
    ctx.fillText(`FINAL SCORE: ${G.score}`,W/2,278);
    ctx.fillStyle='#aaf';
    ctx.fillText(`HI-SCORE: ${Math.max(G.score,G.hiScore)}`,W/2,296);
  }
  if(t>5 && Math.sin(t*2)>0){
    ctx.fillStyle='#afa'; ctx.font='bold 9px monospace';
    ctx.fillText('PRESS Z / TAP TO TITLE',W/2,365);
  }
  if(t>5 && (keys['KeyZ']||keys['Space']||touch.bombPressed||touch.shot)){
    touch.bombPressed=false; touch.shot=false;
    G.hiScore=Math.max(G.score,G.hiScore); G.score=0;
    G.state='title'; G.stateTime=0; stopBGM();
  }
  drawTouchUI();
}

// ── MAIN LOOP ──────────────────────────────────────────────
let lastT=0;
function loop(ts) {
  const dt=Math.min((ts-lastT)/1000, 0.05); lastT=ts;
  G.time+=dt; G.stateTime+=dt;
  ctx.clearRect(0,0,W,H);
  const bgIdx = (G.state==='boss'||G.state==='boss_intro') ? G.stage : G.stage-1;
  updateStars(); drawBackground(bgIdx);

  if(G.state==='title'){
    drawTitle(dt);
  } else if(G.state==='playing'){
    updatePlaying(dt); drawScene();
  } else if(G.state==='boss_intro'){
    if(boss) boss.y=Math.min(boss.targetY,boss.y+45*dt);
    if(G.stateTime>3.5){ G.state='boss'; G.stateTime=0; }
    drawBossIntro();
  } else if(G.state==='boss'){
    updateCommon(dt,getInput()); updateBoss(dt); drawScene();
  } else if(G.state==='stage_clear'){
    drawScene(); drawStageClear();
    if(G.stateTime>3.2) startGame(G.stage);
  } else if(G.state==='game_over'){
    drawBackground(G.stage-1); drawGameOver();
  } else if(G.state==='ending'){
    drawBackground(3); drawEnding(dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts=>{ lastT=ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
