function buildSpinners(c){
  if(!c.spins.length) return;
  const groups = {};
  for(const s of c.spins) (groups[s.kind] || (groups[s.kind] = [])).push(s);
  for(const kind in groups){
    const list = groups[kind];
    const geo = own(spinGeo(kind));
    const im = new THREE.InstancedMesh(geo, G.look.vmat({ rough:0.7 }), list.length);
    im.frustumCulled = false; im.castShadow = false;
    env.spinners.push({ im, list });
    addObj(im);
    own({ dispose(){ im.dispose(); } });
  }
}

// ---------------------------------------------------------------- merged scenery meshes
// Per chunk and depth band, the static and the wind-swayed parts are ONE mesh (aSway = 1 marks the swaying vertices)
// and all outlined layers share ONE outline hull, so a chunk costs ~6 draw calls instead of 11:
//   near band: solid+sway (casts shadow) · glow · deco · hull      far band (z < SHADOW_Z): solid+sway · hull
let swayMat = null, hullMat = null;
function makeSwayMats(){
  swayMat = own(G.look.matInstance(0xffffff, { vertexColors:true, rough:0.85, rim:0.45 }));
  const base = swayMat.onBeforeCompile;
  swayMat.onBeforeCompile = (sh, r)=>{
    base(sh, r);
    sh.uniforms.uTime = env.swayU.uTime; sh.uniforms.uSway = env.swayU.uSway;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime; uniform float uSway; attribute float aSway;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + swayGLSL('uSway * aSway'));
  };
  swayMat.customProgramCacheKey = ()=> 'inuSoftSway2';
  // the outline hull is pushed out at build time, so this is a plain back-face fill that only adds the wind
  hullMat = own(new THREE.MeshBasicMaterial({ color:new THREE.Color('#3b2417'), side:THREE.BackSide }));
  hullMat.onBeforeCompile = (sh)=>{
    sh.uniforms.uTime = env.swayU.uTime; sh.uniforms.uSway = env.swayU.uSway;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime; uniform float uSway; attribute float aSway;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + swayGLSL('uSway * aSway'));
  };
  hullMat.customProgramCacheKey = ()=> 'inuStageHull1';
}
// concatenate built geometries. list: [geometry, sway 0|1, line width]. Without `hull` the result keeps
// position/normal/colour and gets aSway; with `hull` it is the outline hull: every vertex pushed out along its normal
// by its part's line width (so the thinner glow line shares the geometry), position + aSway only.
function joinGeo(list, hull){
  let nv = 0, ni = 0;
  for(const it of list){ nv += it[0].attributes.position.count; ni += it[0].index.count; }
  const pos = new Float32Array(nv*3), nor = hull ? null : new Float32Array(nv*3), col = hull ? null : new Float32Array(nv*3);
  const sw = new Float32Array(nv), idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
  let vo = 0, io = 0;
  for(const [g, sway, t] of list){
    const P = g.attributes.position.array, N = g.attributes.normal.array, I = g.index.array, n = g.attributes.position.count;
    const S = g.attributes.aSway ? g.attributes.aSway.array : null;
    if(hull){ for(let i=0;i<n*3;i++) pos[vo*3 + i] = P[i] + N[i]*t; }
    else { pos.set(P, vo*3); nor.set(N, vo*3); col.set(g.attributes.color.array, vo*3); }
    if(S) sw.set(S, vo); else if(sway) sw.fill(1, vo, vo + n);
    for(let k=0;k<I.length;k++) idx[io++] = I[k] + vo;
    vo += n;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  if(!hull){ g.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); }
  g.setAttribute('aSway', new THREE.BufferAttribute(sw, 1));
  g.setIndex(new THREE.BufferAttribute(idx, 1)); g.computeBoundingSphere();
  return g;
}
const LINE = 0.032, GLOW_LINE = 0.022;
function buildChunks(c){
  const glowMat = own(new THREE.MeshBasicMaterial({ vertexColors:true, toneMapped:false }));
  env.glowMat = glowMat; env.glowPost = null;
  const decoMat = G.look.vmat({ rough:0.9, rim:0.3 });
  makeSwayMats();
  let tris = 0, meshes = 0;
  const count = (g)=>{ tris += (g.index ? g.index.count : g.attributes.position.count)/3; meshes++; };
  const hullMesh = (list, name)=>{
    const o = new THREE.Mesh(own(joinGeo(list, true)), hullMat); o.name = name;
    o.userData.isOutline = true; o.castShadow = false; o.receiveShadow = false; o.visible = G.quality.tier < 2;
    addObj(o);
  };
  for(const ch of c.chunks){
    for(const B of ['', 'B']){
      const parts = [], hull = [];
      if(ch['solid' + B] && !ch['solid' + B].empty) parts.push([ch['solid' + B].build(), 0]);
      if(ch['sway' + B] && !ch['sway' + B].empty) parts.push([ch['sway' + B].build(), 1]);
      if(parts.length){
        const g = own(joinGeo(parts, false)); count(g);
        for(const it of parts) it[0].dispose();
        const m = new THREE.Mesh(g, swayMat); m.name = 'solid' + B; m.castShadow = !B; m.receiveShadow = true;
        addObj(m); hull.push([g, 0, LINE]);
      }
      if(!B && ch.glow && !ch.glow.empty){
        const g = own(ch.glow.build()); count(g);
        const m = new THREE.Mesh(g, glowMat); m.castShadow = false; m.name = 'glow';
        addObj(m); hull.push([g, 0, GLOW_LINE]);
      }
      if(hull.length) hullMesh(hull, 'hull' + B);
    }
    if(ch.deco && !ch.deco.empty){
      const g = own(ch.deco.build()); count(g);
      const m = new THREE.Mesh(g, decoMat); m.castShadow = false; m.receiveShadow = true; m.name = 'deco';
      addObj(m);
    }
  }
  // far layer (parallax group)
  const far = new THREE.Group();
  if(!c.far.empty){ const g = own(c.far.build()); count(g); const m = new THREE.Mesh(g, G.look.vmat({ rough:1, rim:0.6 })); m.frustumCulled = false; m.name = 'far'; far.add(m); }
  if(!c.farGlow.empty){ const g = own(c.farGlow.build()); count(g); const m = new THREE.Mesh(g, glowMat); m.frustumCulled = false; m.name = 'farGlow'; far.add(m); }
  env.far = addObj(far);
  return { tris: Math.round(tris), meshes };
}

// ---------------------------------------------------------------- halos & particles
function buildHalos(c){
  const h = c.halos; if(!h.length) return;
  const n = h.length/5, pos = new Float32Array(n*3), col = new Float32Array(n*3), size = new Float32Array(n), ph = new Float32Array(n);
  const tc = new THREE.Color();
  for(let i=0;i<n;i++){
    pos[i*3] = h[i*5]; pos[i*3+1] = h[i*5+1]; pos[i*3+2] = h[i*5+2];
    tc.set(h[i*5+3]); col[i*3] = tc.r; col[i*3+1] = tc.g; col[i*3+2] = tc.b;
    size[i] = h[i*5+4]; ph[i] = (h[i*5]*1.7 + h[i*5+2]*0.9) % TAU;
  }
  const g = own(new THREE.BufferGeometry());
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1)); g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  g.computeBoundingSphere();
  env.haloU = { uTime:{ value:0 }, uPx:{ value:360 }, uStr:{ value: c.th.scenery==='town' || c.th.scenery==='airship' || c.th.scenery==='snow' ? 0.45 : 0.62 } };
  const mat = own(new THREE.ShaderMaterial({ uniforms:env.haloU, vertexShader:HALO_VS, fragmentShader:HALO_FS, vertexColors:true,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false }));
  const pts = new THREE.Points(g, mat); pts.frustumCulled = false; pts.renderOrder = 5;
  env.halos = addObj(pts);
}
const SHAPES = { glow:0, petal:1, sparkle:2, snow:3 };
function buildParticles(th){
  const pc = th.particles; if(!pc) return;
  const n = pc.n, R = mulberry(991 + n), box = pc.box;   // box: [width, y0, y1, z0, z1]
  const pos = new Float32Array(n*3), rnd = new Float32Array(n*4);
  for(let i=0;i<n;i++){
    pos[i*3] = R()*box[0]; pos[i*3+1] = U.lerp(box[1], box[2], R()); pos[i*3+2] = U.lerp(box[3], box[4], R());
    rnd[i*4] = R(); rnd[i*4+1] = R(); rnd[i*4+2] = R(); rnd[i*4+3] = R();
  }
  const g = own(new THREE.BufferGeometry());
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 4));
  env.partU = {
    uTime:{ value:0 }, uBoxMin:{ value:new THREE.Vector3(0, box[1], box[3]) }, uBoxSize:{ value:new THREE.Vector3(box[0], box[2]-box[1], box[4]-box[3]) },
    uVel:{ value:new THREE.Vector3(pc.vel[0], pc.vel[1], pc.vel[2]) }, uWob:{ value:pc.wob }, uSize:{ value:pc.size }, uPx:{ value:360 },
    uTwinkle:{ value:pc.twinkle||0 }, uColA:{ value:new THREE.Color(pc.a) }, uColB:{ value:new THREE.Color(pc.b) },
    uShape:{ value:SHAPES[pc.kind]||0 }, uOpacity:{ value:pc.opacity==null ? 1 : pc.opacity },
  };
  const mat = own(new THREE.ShaderMaterial({ uniforms:env.partU, vertexShader:PART_VS, fragmentShader:PART_FS, transparent:true, depthWrite:false,
    blending: pc.add ? THREE.AdditiveBlending : THREE.NormalBlending, fog:false }));
  const pts = new THREE.Points(g, mat); pts.frustumCulled = false; pts.renderOrder = 6;
  env.parts = addObj(pts); env.partN = n; env.partBoxW = box[0];
  applyParticleQuality();
}
function applyParticleQuality(){
  if(!env.parts) return;
  const k = G.quality.tier===0 ? 1 : G.quality.tier===1 ? 0.7 : 0.4;
  env.parts.geometry.setDrawRange(0, Math.max(1, Math.floor(env.partN*k)));
}

// ---------------------------------------------------------------- build / dispose
function buildEnv(i){
  const def = G.stages[i], th = def.theme;
  const t0 = performance.now();
  env.root = new THREE.Group(); env.root.name = 'stageEnv';
  env.own = []; env.spinners = []; env.parts = null; env.halos = null; env.clouds = null; env.cloudData = null;
  applyTheme(th);
  buildSky(th);
  buildGround(def, th);
  const c = makeCtx(def, 1234 + def.no*97);
  SCENERY[th.scenery](c);
  arenaDecor(c, def);
  if(FARS[th.far]) FARS[th.far](c);
  const st = buildChunks(c);
  buildClouds(th);
  buildSpinners(c);
  buildHalos(c);
  buildParticles(th);
  env.farPar = th.farPar;
  G.scene.add(env.root);
  env.built = true; env.idx = i;
  env.stats = { buildMs: Math.round(performance.now() - t0), sceneryTris: st.tris, sceneryMeshes: st.meshes, halos: c.halos.length/5, spinners: c.spins.length };
}
function disposeEnv(){
  if(!env.built) return;
  if(env.root && env.root.parent) env.root.parent.remove(env.root);
  for(const x of env.own){ try { x.dispose(); } catch(err){ G.logError('stage.dispose', err); } }
  env.own = []; env.root = null; env.sky = null; env.far = null; env.clouds = null; env.cloudData = null;
  env.parts = null; env.halos = null; env.spinners = []; env.partU = null; env.haloU = null; env.skyU = null; env.glowMat = null;
  swayMat = null; hullMat = null;
  env.built = false; env.idx = -1;
  restoreDefaults();
}

// ================================================================ progression
const st = {
  def:null, seq:[], ptr:0, active:null, locked:false, lockA:0, lockB:0, clearA:0, maxX:0,
  hintI:0, hintHold:0, propI:0, goOn:false, goX:0, goT:0, title:false, bossDone:false, t:0,
};
const B = { xmin:0, xmax:100, zmin:ZMIN, zmax:ZMAX };   // bounds() result (reused, never allocate per tick)
const HINT_DELAY = 160, HINT_HOLD = 120;              // ticks: 90_game's stage banner runs 150
const GLOW_HDR = 1.6;                                 // glow colour multiplier while 05_post's bloom is active

function resetProgress(def){
  st.def = def; st.ptr = 0; st.active = null; st.locked = false; st.lockA = 0; st.lockB = 0; st.clearA = 0; st.maxX = 0;
  st.hintI = 0; st.hintHold = 0; st.propI = 0; st.goOn = false; st.goX = 0; st.bossDone = false; st.t = 0;
  const seq = [];
  def.waves.forEach((w, i)=> seq.push({ kind:'wave', at:w.at, width:w.width || 16, wave:w, idx:i }));
  if(def.mid) seq.push({ kind:'mid', at:def.mid.at, width:def.mid.width || ARENA_W, type:def.mid.type });
  if(def.boss) seq.push({ kind:'boss', at:def.boss.at, width:def.boss.width || ARENA_W, type:def.boss.type });
  seq.sort((a, b)=> a.at - b.at);
  st.seq = seq;
  def.hints.sort((a, b)=> a.at - b.at); def.props.sort((a, b)=> a.x - b.x);
  G.stage.done = false;
}
function uiGo(on){ if(G.ui && typeof G.ui.go==='function'){ try { G.ui.go(on); } catch(err){ G.logError('stage ui.go', err); } } }
function showHint(h){
  const frames = h.frames || 300;
  if(G.ui && typeof G.ui.hint==='function'){ try { G.ui.hint(h.name, h.text, frames); } catch(err){ G.logError('stage ui.hint', err); } }
  G.bus.emit('hint', { name:h.name, text:h.text, frames });
}
function spawnFoe(type, x, z, opts){
  if(!(G.foes && typeof G.foes.spawn==='function')) return null;
  try { return G.foes.spawn(type, x, z, opts) || null; } catch(err){ G.logError('stage spawn '+type, err); return null; }
}
function lockTo(a, b){ st.locked = true; st.lockA = a; st.lockB = b; G.cam.lock(a, b); }
function unlock(){ st.locked = false; G.cam.unlock(); }
function makeQueue(list, t0){
  const q = []; let t = t0;
  for(const [type, n] of list){
    for(let k=0;k<n;k++){ q.push({ type, t, side: G.rng() < 0.62 ? 1 : -1 }); t += 14 + Math.floor(G.rng()*14); }
  }
  // interleave types a little so a wave doesn't arrive as a single file of the same foe
  for(let i=q.length-1;i>0;i--){ const j = Math.floor(G.rng()*(i+1)); const tt = q[i].type; q[i].type = q[j].type; q[j].type = tt; }
  return q;
}
function spawnQueued(item, a){
  const vr = G.cam.viewRange();
  const def = G.foes && G.foes.types ? G.foes.types[item.type] : null;
  const ent = item.entrance || ENTRANCE[item.type] || (def && def.entrance) || 'walk';
  const px = G.player ? G.player.x : (a.lockA + a.lockB)/2;
  let x, z = U.lerp(ZMIN + 0.3, ZMAX - 0.3, G.rng());
  if(ent==='walk'){
    x = item.side > 0 ? Math.max(vr[1], a.lockB) + 1.0 + G.rng()*1.4 : Math.min(vr[0], a.lockA) - 1.0 - G.rng()*1.4;
  } else {
    for(let k=0;k<8;k++){ x = U.lerp(a.lockA + 1.5, a.lockB - 1.5, G.rng()); if(Math.abs(x - px) > 3) break; }
  }
  const e = spawnFoe(item.type, x, z, { entrance:ent, face: x > px ? -1 : 1 });
  if(e) a.spawned++;
  return e;
}
// an arena never wider than what the camera can show (phones in portrait see ~8 units, 16:9 ~14)
function viewArenaW(){ return Math.max(6, (G.cam.usableW ? G.cam.usableW() : 2*G.cam.halfW) - 0.6); }
function startEvent(ev){
  const d = st.def, L = d.length;
  const vw = viewArenaW();
  // areaA/areaB: the lock this fight started with; a later refitLock (view resized) stays inside it
  if(ev.kind==='wave'){
    const w = Math.min(ev.width, vw);
    let a = ev.at - w*0.4; a = Math.max(-2, a); const b = Math.min(L + 4, a + w);
    lockTo(a, b);
    st.active = { kind:'wave', ev, t:0, qt:0, qi:0, q: makeQueue(ev.wave.foes, 16), then: ev.wave.then || null,
      thenAt: ev.wave.thenAt==null ? 1 : ev.wave.thenAt, spawned:0, lockA:a, lockB:b, areaA:a, areaB:b };
    G.bus.emit('wave', { index:ev.idx, total:d.waves.length, at:ev.at, lockA:a, lockB:b });
  } else {
    let [a, b] = arenaRange(d, ev);
    if(b - a > vw){ const px = G.player ? G.player.x : a; a = U.clamp(px - 1, a, b - vw); b = a + vw; }
    lockTo(a, b);
    const bx = b - 4;
    const e = spawnFoe(ev.type, bx, -0.3, { boss:true, face:-1 });
    const tdef = G.foes && G.foes.types ? G.foes.types[ev.type] : null;
    const nm = BOSS_NAMES[ev.type] || [ev.type, ''];
    st.active = { kind:ev.kind, ev, t:0, ent:e, down:false, goneT:0, doneT:0, lockA:a, lockB:b, areaA:a, areaB:b };
    G.bus.emit('bossIntro', { boss:e, name:(tdef && tdef.name) || nm[0], title:(tdef && tdef.title) || nm[1], mid: ev.kind==='mid', type:ev.type });
  }
}
// the view changed size mid-fight (a phone turned to portrait, a browser bar came in): re-fit the lock to the new
// view width so the hero and every foe stay on screen. It shrinks/grows about its old centre, moves only as far as
// needed to keep the hero (and, in a boss arena, the boss while it fits) inside, and never leaves the lock the
// fight started with (turning back to landscape restores it).
// core's belt clamp then pulls entered foes back inside the new bounds on their next tick.
function refitLock(){
  const a = st.active; if(!st.locked || !a || a.areaB==null) return;
  const w = Math.min(a.areaB - a.areaA, viewArenaW());
  if(Math.abs(w - (st.lockB - st.lockA)) < 0.01) return;
  const p = G.player, e = a.ent, m = 1;
  let lo = st.lockA + (st.lockB - st.lockA - w)*0.5;
  if(e && !e.dead && !e.removed && !e.removeMe) lo = U.clamp(lo, e.x + m - w, e.x - m);
  if(p) lo = U.clamp(lo, p.x + m - w, p.x - m);
  lo = U.clamp(lo, a.areaA, a.areaB - w);
  a.lockA = lo; a.lockB = lo + w;
  lockTo(lo, lo + w);
}
function tickWave(a){
  a.qt++;
  while(a.qi < a.q.length && a.q[a.qi].t <= a.qt){ spawnQueued(a.q[a.qi], a); a.qi++; }
  const alive = G.foesAlive();
  if(a.then && a.qi >= a.q.length && alive <= a.thenAt){ a.q = a.q.concat(makeQueue(a.then, a.qt + 20)); a.then = null; }
  if(!a.then && a.qi >= a.q.length && alive===0 && a.t > 20){
    unlock(); st.active = null; st.clearA = a.lockA;
    G.bus.emit('waveClear', { index:a.ev.idx, total:st.def.waves.length });
    G.bus.emit('go', {});
    uiGo(true); st.goOn = true; st.goX = a.lockB + 1; st.goT = 480;
    const rw = a.ev.wave.reward;
    if(rw && G.pickups && typeof G.pickups.spawn==='function' && G.player){
      try { const n = rw==='coin' ? 5 : 1; for(let i=0;i<n;i++) G.pickups.spawn(rw, G.player.x + 1.2 + i*0.3, U.clamp(G.player.z, ZMIN + 0.3, ZMAX - 0.3)); } catch(err){ G.logError('stage reward', err); }
    }
  }
}
function isBossEnt(e){ return e && e.team===1 && (e.kind==='boss' || e.boss===true || (e.def && e.def.boss)); }
function anyBossAlive(){ const es = G.world.ents; for(let i=0;i<es.length;i++){ const e = es[i]; if(isBossEnt(e) && !e.dead && !e.removed && !e.removeMe) return true; } return false; }
function tickBoss(a){
  const e = a.ent;
  // no foes module / spawn failed: nothing to fight, let the stage finish
  if(!e){ a.doneT++; if(a.doneT > 30) finishBoss(a); return; }
  // fallback when no bossDown arrives: the boss is gone and nothing that is a boss is left for a while
  const gone = e.dead || e.removed || e.removeMe;
  if(gone && !anyBossAlive() && G.foesAlive()===0) a.goneT++; else a.goneT = 0;
  if(a.down) a.doneT++;
  if((a.down && a.doneT >= 20) || a.goneT >= 120) finishBoss(a);
}
function finishBoss(a){
  if(a.kind==='mid'){
    unlock(); st.active = null; st.clearA = a.lockA;
    G.bus.emit('midClear', { boss:a.ent });
    G.bus.emit('go', {}); uiGo(true); st.goOn = true; st.goX = a.lockB + 1; st.goT = 480;
  } else {
    st.active = null; st.bossDone = true; G.stage.done = true;
  }
}
let busBound = false;
function bindBus(){
  if(busBound) return; busBound = true;
  G.bus.on('bossDown', (d)=>{
    const a = st.active; if(!a || (a.kind!=='boss' && a.kind!=='mid')) return;
    const b = d && d.boss;
    if(!b || b===a.ent || isBossEnt(b)) a.down = true;
  });
  G.bus.on('quality', applyParticleQuality);
  G.bus.on('resize', refitLock);
}

// ================================================================ per-frame visuals
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _db = new THREE.Vector2();
function frameEnv(dt){
  if(!env.built) return;
  env.time += dt;
  const t = env.time, cam = G.camera, cx = G.cam.x;
  if(env.sky){ env.sky.position.copy(cam.position); env.skyU.uTime.value = t; }
  // 05_post (bloom) renders to an HDR target and tone-maps in its composite: push glowing things above 1.0 so
  // they bloom there; without post they stay un-tone-mapped at their exact colours
  const post = !!(G.post && G.post.active);
  if(env.glowMat && env.glowPost !== post){
    env.glowPost = post; env.glowMat.color.setScalar(post ? GLOW_HDR : 1);
    if(env.skyU) env.skyU.uHdr.value = post ? 1.8 : 1;
  }
  if(env.far) env.far.position.x = cx*env.farPar;
  env.swayU.uTime.value = t;
  let px = 360;
  if(G.renderer){ G.renderer.getDrawingBufferSize(_db); px = _db.y*0.5; }
  if(env.partU){ env.partU.uTime.value = t; env.partU.uPx.value = px; env.partU.uBoxMin.value.x = cx - env.partBoxW*0.5; }
  if(env.haloU){ env.haloU.uTime.value = t; env.haloU.uPx.value = px; }
  if(env.clouds){
    const d = env.cloudData, W = 150;
    for(let i=0;i<d.length;i++){
      const c = d[i];
      let rel = (c.x + t*c.spd - cx*0.25) % W; if(rel < 0) rel += W;
      _v.set(cx + rel - W*0.5, c.y, c.z); _s.set(c.s, c.s, c.s); _q.identity();
      _m4.compose(_v, _q, _s); env.clouds.setMatrixAt(i, _m4);
    }
    env.clouds.instanceMatrix.needsUpdate = true;
  }
  for(let k=0;k<env.spinners.length;k++){
    const sp = env.spinners[k], list = sp.list;
    for(let i=0;i<list.length;i++){
      const s = list[i];
      _e.set(0, s.rotY, t*s.speed + i); _q.setFromEuler(_e);
      _v.set(s.x, s.y, s.z); _s.set(s.s, s.s, s.s); _m4.compose(_v, _q, _s); sp.im.setMatrixAt(i, _m4);
    }
    sp.im.instanceMatrix.needsUpdate = true;
  }
}

// ================================================================ public API
G.stage = {
  info:null, index:-1, done:false,
  env, st, THEMES,
  init(){ bindBus(); },
  load(i){
    bindBus();
    i = U.clamp(i|0, 0, G.stages.length - 1);
    const def = G.stages[i];
    if(!(env.built && env.idx===i)){ disposeEnv(); buildEnv(i); }
    else applyTheme(def.theme);
    this.info = def; this.index = i; st.title = false;
    resetProgress(def);
    return def;
  },
  unload(){
    if(st.locked) G.cam.unlock();
    disposeEnv();
    this.info = null; this.index = -1; this.done = false;
    st.def = null; st.active = null; st.locked = false; st.goOn = false; st.title = false;
  },
  // pleasant stage-1 backdrop for title / select / ending. The calling scene places the camera;
  // info stays null so core's stage-length camera clamp doesn't pull the title camera around.
  titleScene(){
    this.load(0);
    this.info = null; st.title = true; st.def = null;
    return G.stages[0];
  },
  tick(){
    const d = st.def; if(!d || st.title) return;
    const p = G.player; if(!p) return;
    if(p.x > st.maxX) st.maxX = p.x;
    st.t++;
    // hints wait until the stage-name banner has gone; one message at a time for kids: if the hero already ran
    // past several, only the newest is shown, and each stays at least HINT_HOLD ticks before the next replaces it
    if(st.t > HINT_DELAY && --st.hintHold <= 0){
      let j = -1;
      while(st.hintI < d.hints.length && p.x >= d.hints[st.hintI].at){ j = st.hintI; st.hintI++; }
      if(j >= 0){ showHint(d.hints[j]); st.hintHold = HINT_HOLD; }
    }
    while(st.propI < d.props.length && d.props[st.propI].x < p.x + 22){
      const pr = d.props[st.propI++];
      if(G.props && typeof G.props.spawn==='function'){ try { G.props.spawn(pr.kind, pr.x, pr.z, pr.drop); } catch(err){ G.logError('stage prop', err); } }
    }
    // the GO→ arrow stays until the hero walks out of the old fight area (or the next fight starts / 8 s pass)
    if(st.goOn && (p.x > st.goX || st.active || --st.goT <= 0)){ st.goOn = false; uiGo(false); }
    const a = st.active;
    if(a){
      a.t++;
      if(a.kind==='wave') tickWave(a); else tickBoss(a);
      return;
    }
    const next = st.seq[st.ptr];
    if(next && p.x >= next.at){ st.ptr++; startEvent(next); }
  },
  bounds(){
    const d = st.def;
    B.zmin = ZMIN; B.zmax = ZMAX;
    if(!d){ B.xmin = -1e9; B.xmax = 1e9; return B; }
    if(st.locked){ B.xmin = st.lockA; B.xmax = st.lockB; return B; }
    // can't walk back past the last cleared fight or far behind where you've been; can't run past the next fight
    B.xmin = Math.max(0, st.clearA, st.maxX - 16);
    const next = st.seq[st.ptr];
    B.xmax = next ? next.at + 4 : d.length + 6;
    return B;
  },
  frame(dt){ frameEnv(dt || G.cfg.TICK); },
  // debug / tests
  stats(){ return env.stats; },
  progress(){ const a = st.active; return { ptr:st.ptr, total:st.seq.length, active: a ? a.kind : null, activeIdx: a && a.ev ? (a.ev.idx==null ? -1 : a.ev.idx) : -1,
    locked:st.locked, lockA:st.lockA, lockB:st.lockB, done:G.stage.done, maxX:st.maxX }; },
};
})();

function damage(t, amount, info){

// ---------------------------------------------------------------- projectiles
function killProj(p, silent){
  if(p.dead) return; p.dead = true;
  if(p.vis){ if(p.vis.obj && p.vis.obj.parent) p.vis.obj.parent.remove(p.vis.obj); try{ p.vis.dispose && p.vis.dispose(); }catch(err){ G.logError('proj.dispose', err); } }

    if(p.onEnd) try { p.onEnd(p); } catch(err){ G.logError('proj.onEnd', err); }

// ---------------------------------------------------------------- areas
function stepAreas(){
  for(let i=areas.length-1;i>=0;i--){
    const a = areas[i];
    if(a.delay>0){ a.delay--; continue; }
    if(!a.fired){ a.fired = true; if(a.fx && G.fx && G.fx.burst) G.fx.burst(a.fx, a.x, a.y+0.1, a.z, { scale: a.r/1.5, color:a.color }); }

      if(a.sets.has(t.id)) return;

      if(dx*dx + dz*dz > 1) return;
      if(t.y + t.height < a.y + a.y0 || t.y > a.y + a.y1) return;

      damage(t, a.dmg, { src:a.owner, kind:a.kind, power:a.power, kb:a.kb, up:a.up, stun:a.stun, dir: a.dir || U.sign(t.x - a.x), dizzy:a.dizzy, coins:a.coins });

// ---------------------------------------------------------------- pickups
const PICK = {

function collect(e, p){
  const k = PICK[e.type] || {};
  let value = 0;
  if(k.heal){ const before = p.hp; p.hp = Math.min(p.maxHp, p.hp + Math.ceil(p.maxHp*k.heal)); value = p.hp - before; }
  if(k.coins && G.game){ G.game.coins += k.coins; value = k.coins; }
  if(k.sp){ p.sp = Math.min(3, (p.sp||0) + k.sp); value = k.sp; }
  G.bus.emit('pickup', { ent:p, kind:e.type, x:e.x, y:e.y+0.3, z:e.z, value });
  e.removeMe = true;
}

// ---------------------------------------------------------------- breakable props
function propRig(kind){
  const m = G.look.propMesh(kind);
  return {
    root: m.obj, height: kind==='pot'?0.7:0.9, radius:0.45,
    update(e){ if(e.wobble>0){ e.wobble *= 0.86; if(e.wobble<0.01) e.wobble=0; }
      const w = e.wobble||0; m.mesh.rotation.z = Math.sin(G.time.tick*0.9)*0.25*w; m.mesh.scale.set(1+w*0.12, 1-w*0.1, 1+w*0.12);
      if(m.mat.userData.uFlash) m.mat.userData.uFlash.value = e.flashT>0 ? 0.6 : 0; },
    dispose(){ m.dispose(); },
  };
}
G.props = {
  spawn(kind, x, z, drop){
    const e = G.makeEnt({ kind:'prop', type:kind, team:2, x, z, hp: kind==='crystal'?3:2, maxHp:2, radius:0.45,
      height:0.9, weight:99, rig: propRig(kind), drop: drop || null, shadowAlpha:0.35 });
    G.world.add(e);
    return e;
  },
  break(e){
    if(e.dead) return;
    e.dead = true; e.removeMe = true;
    if(G.fx && G.fx.burst){ G.fx.burst('poof', e.x, 0.5, e.z, { scale:1 }); G.fx.burst('stars', e.x, 0.6, e.z, { count:6 }); }
    G.bus.emit('propBreak', { ent:e, kind:e.type, x:e.x, z:e.z });
    if(G.audio && G.audio.sfx) G.audio.sfx('pop');
    const drops = e.drop ? [].concat(e.drop) : [G.rng()<0.5 ? 'coin' : (G.rng()<0.5 ? 'bone' : 'star')];
    for(const d of drops){
      const n = d==='coin' ? 3 : 1;
      for(let i=0;i<n;i++) G.pickups.spawn(d, e.x, e.z);
    }
  },
};

// ---------------------------------------------------------------- constants
const BASE_HP = 100, BASE_SPD = 0.078, JUMP_V = 0.22, DJUMP_V = 0.17;
const SP_MAX = 3, SP_REGEN = 1/260, ULT_MAX = 100;
const DODGE_LEN = 24, DODGE_INV = 18, JUST_WIN = 9;
const CHARGE_START = 12, CHARGE_FULL = 42;
const AIR_MAX = 3;

function heroMeta(id){ return (G.heroes && G.heroes.get && G.heroes.get(id)) || { id, name:id, color:'#ffd24d' }; }

// ---------------------------------------------------------------- create
const P = G.playerCtl = {
  MOVES,
  create(heroId, x, z){
    const mv = MOVES[heroId] || MOVES.inu;
    const st = mv.stats;
    const lvl = (G.game && G.game.level) || 1;
    const lvlHp = Math.pow(1.08, lvl-1), lvlAtk = Math.pow(1.05, lvl-1);   // same compounding as G.game.addXp
    const meta = heroMeta(heroId);
    let rig = null;
    try { rig = G.heroes && G.heroes.build ? G.heroes.build(heroId) : null; } catch(err){ G.logError('hero build', err); }
    if(!rig) rig = placeholderRig(meta.color);
    const maxHp = Math.round(BASE_HP * st.hp * lvlHp * ((G.game && G.game.diff && G.game.diff.heroHp) || 1));
    const p = G.makeEnt({ kind:'hero', type:heroId, team:0, x, z, face:1, rig,
      radius: heroId==='guard8' ? 0.46 : 0.38, height: rig.height || 1.3, weight: heroId==='guard8' ? 1.4 : 1,
      hp:maxHp, maxHp, atkMul: st.atk * lvlAtk, spd: BASE_SPD * st.spd, jumpV: JUMP_V * Math.sqrt(st.jump),
      sp:SP_MAX, ult: (G.game && G.game.ultCarry) || 0, comboStep:0, comboT:0, buffer:0, airCount:0, djump:false,
      charge:0, chargeT:0, trailColor: mv.trail, moves:mv, lives: 3, meta });
    p.onBeforeHit = (info)=> beforeHit(p, info);
    return p;
  },
  tick, queue,
  // external: full heal etc.
  heal(p, frac){ p.hp = Math.min(p.maxHp, p.hp + Math.ceil(p.maxHp*frac)); },
};
function placeholderRig(color){
  const b = G.look.builder();
  b.add(G.look.geo.sphere(0.4,16,12), color||'#fff3dc', [0,0.95,0]); b.add(G.look.geo.sphere(0.3,16,12), color||'#fff3dc', [0,0.4,0]);
  const mat = G.look.vmat({ instance:true }); const mesh = b.mesh({ material:mat }); const root = new THREE.Group(); root.add(mesh);
  const tip = new THREE.Object3D(); tip.position.set(0.9,0.7,0); root.add(tip); const base = new THREE.Object3D(); base.position.set(0.3,0.7,0); root.add(base);
  return { root, tip, base, height:1.3, radius:0.4, update(e){ mat.userData.uFlash.value = e.flashT>0?0.7:0; root.rotation.y = e.face>0 ? -0.5 : Math.PI+0.5; },
    setAlpha(a){ const tr=a<1; if(mat.transparent!==tr){ mat.transparent=tr; mat.needsUpdate=true; } mat.opacity=a; }, dispose(){ mesh.geometry.dispose(); mat.dispose(); } };
}

// ---------------------------------------------------------------- hit hook: dodge / just dodge
function beforeHit(p, info){
  if(p.state==='dodge' && p.stateT < DODGE_INV){
    if(p.stateT <= JUST_WIN && !p.justDone && info.src){
      p.justDone = true;
      G.slowmo(40, 0.3);
      p.inv = Math.max(p.inv, 40);
      p.ult = Math.min(ULT_MAX, p.ult + 10);
      G.bus.emit('dodge', { ent:p, just:true });
    }
    return false;
  }
  if(p.state==='ult' || p.state==='ultIntro') return false;
  return true;
}

// ---------------------------------------------------------------- helpers
function setFree(p){ G.setState(p, p.onGround ? 'idle' : 'air'); p.comboStep = p.comboStep; }
function canAct(p){ return p.state==='idle' || p.state==='move' || p.state==='air'; }
function spend(p){ if(p.sp < 1) return false; p.sp -= 1; return true; }
function startAtk(p, def, state){
  G.combat.start(p, def);
  G.setState(p, state || 'atk');
  if(G.fx && G.fx.trail && def.hits && def.hits.length && def.hits[0].kind!=='blunt') G.fx.trail(p);
}
function stickDir(p){
  const I = G.input;
  if(I.z < -0.55 && Math.abs(I.x) < 0.8) return 'up';
  if(Math.abs(I.x) > 0.45) return 'fwd';
  return 'n';
}
function doSpecial(p){
  if(p.q) p.q.special = 0;
  const dir = stickDir(p);
  if(dir==='fwd' && Math.abs(G.input.x) > 0.45) p.face = G.input.x > 0 ? 1 : -1;
  if(!spend(p)){ if(G.fx && G.fx.text) G.fx.text('✦が たりない…', p.x, p.height+0.5, p.z, 'info'); return false; }
  const def = p.moves.sp[dir] || p.moves.sp.n;
  p.vx = 0; p.vz = 0;
  startAtk(p, def, 'special');
  G.bus.emit('special', { ent:p, id:def.id, name:def.name, dir });
  if(G.audio && G.audio.voice) G.audio.voice(p.type, 'atk');
  return true;
}
function doUlt(p){
  if(p.q) p.q.ult = 0;
  if(p.ult < ULT_MAX) return false;
  p.ult = 0;
  p.vx = 0; p.vz = 0;
  G.setState(p, 'ultIntro');
  G.setAnim(p, 'ult', 70, 0.8);
  const u = p.moves.ult;
  G.game && (G.game.cutinT = 70);
  G.bus.emit('ult', { ent:p, id:p.type+'_ult', name:u.name, heroId:p.type });
  if(G.fx && G.fx.cutin) { try { G.fx.cutin(p.type, u.name, ()=>{}); } catch(err){ G.logError('cutin', err); } }
  if(G.audio && G.audio.voice) G.audio.voice(p.type, 'ult');
  return true;
}
function startUltAttack(p){
  const def = p.moves.ult.build(p);
  G.combat.start(p, def);
  G.setState(p, 'ult');
  p.inv = def.len + 30;
}
function doDodge(p){
  if(p.q) p.q.dodge = 0;
  const I = G.input;
  let dx = I.x, dz = I.z;
  if(Math.abs(dx) < 0.2 && Math.abs(dz) < 0.2){ dx = p.face; dz = 0; }
  const l = Math.hypot(dx, dz) || 1;
  p.dodgeVx = dx/l*0.2; p.dodgeVz = dz/l*0.14;
  if(Math.abs(dx) > 0.2) p.face = dx > 0 ? 1 : -1;
  G.combat.cancel(p);
  G.setState(p, 'dodge'); G.setAnim(p, 'dodge', DODGE_LEN);
  p.justDone = false;
  G.bus.emit('dodge', { ent:p, just:false });
}
function doJump(p, dbl){
  if(p.q) p.q.jump = 0;
  p.vy = dbl ? DJUMP_V * (p.jumpV/JUMP_V) : p.jumpV;
  p.onGround = false;
  if(dbl) p.djump = true;
  G.setState(p, 'air'); G.setAnim(p, 'jump');
  G.bus.emit('jump', { ent:p, double:!!dbl });
}
function comboDefs(p){ return p.moves.combo; }

// stomp: falling onto a foe's head bounces you up and bonks it
function checkStomp(p){
  if(p.vy >= 0 || p.stompUsed) return;
  for(const f of G.world.ents){
    if(f.team!==1 || f.dead || f.intangible || f.state==='spawn') continue;
    if(f.stompT > 0) continue;
    if(Math.abs(f.z - p.z) > 0.5 || Math.abs(f.x - p.x) > f.radius + p.radius*0.6) continue;
    const top = f.y + f.height;
    if(p.y < top - 0.35 || p.y > top + 0.3) continue;
    f.stompT = 30;
    G.combat.damage(f, 6*(p.atkMul||1), { src:p, kind:'pop', power:1, stun: f.def && f.def.boss ? 0 : 26, dir:p.face, kb:0.02, noDown:true });
    p.vy = 0.2; p.djump = false; p.airCount = 0; p.stompUsed = true;
    G.setAnim(p, 'jump');
    G.bus.emit('stomp', { ent:p, target:f });
    if(G.audio && G.audio.sfx) G.audio.sfx('boing');
    if(G.fx && G.fx.text) G.fx.text('ふみっ！', f.x, top + 0.3, f.z, 'onoma');
    break;
  }
}

// ---------------------------------------------------------------- tick
const QBTN = ['attack','jump','dodge','special','ult'];
// presses that happen while the world is frozen (hitstop) are kept for a few ticks
function queue(p){
  const b = G.input.btn; p.q = p.q || {};
  for(const k of QBTN) if(b[k].pressed) p.q[k] = 12;
}
function tick(p){
  const I = G.input, b0 = I.btn;
  p.q = p.q || {};
  const pb = {};
  for(const k of QBTN){ pb[k] = b0[k].pressed || p.q[k]>0; if(p.q[k]>0) p.q[k]--; }
  const b = { attack:{ pressed:pb.attack, down:b0.attack.down, held:b0.attack.held }, jump:{ pressed:pb.jump, down:b0.jump.down },
    dodge:{ pressed:pb.dodge }, special:{ pressed:pb.special }, ult:{ pressed:pb.ult } };
  const used = (k)=>{ p.q[k] = 0; };
  if(p.flashT>0) p.flashT--;
  if(p.inv>0) p.inv--;
  p.stateT++;
  if(p.buffer>0) p.buffer--;
  if(p.comboT>0){ p.comboT--; if(p.comboT===0) p.comboStep = 0; }
  if(p.sp < SP_MAX && p.state!=='ult') p.sp = Math.min(SP_MAX, p.sp + SP_REGEN);
  if(p.chargeSnd && p.state!=='charge'){ p.chargeSnd = false; if(G.audio && G.audio.sfx) G.audio.sfx('charge', { stop:true }); }
  for(const f of G.world.ents) if(f.stompT>0 && f.team===1) f.stompT--;

  // cut-in freeze is handled by the game loop; when it ends we start the ult attack
  if(p.state==='ultIntro'){
    if(!(G.game && G.game.cutinT>0)) startUltAttack(p);
    return;
  }

  switch(p.state){
    case 'hurt':
      if(p.anim!=='hurt') G.setAnim(p, 'hurt');
      if(--p.stun <= 0) setFree(p);
      return;
    case 'down':
      if(p.anim!=='down') G.setAnim(p, 'down');
      // mash to get up sooner (受け身)
      if(!p.onGround && p.stateT > 12 && (b.jump.pressed || b.dodge.pressed)){ p.vy = 0.14; p.vx = -p.hurtDir*0.04; G.setState(p, 'air'); G.setAnim(p, 'jump'); p.inv = 30; G.bus.emit('recover', { ent:p }); return; }
      if(p.onGround){ p.downT = (p.downT||0) + 1 + (b.attack.pressed||b.jump.pressed ? 6 : 0);
        if(p.downT > 34){ G.setState(p, 'getup'); G.setAnim(p, 'getup', 20); } }
      return;
    case 'getup':
      if(p.stateT >= 20){ p.inv = 50; setFree(p); }
      return;
    case 'dizzy':
      if(--p.stun <= 0) setFree(p);
      return;
    case 'ko':
      if(p.anim!=='ko') G.setAnim(p, 'ko');
      return;   // the game decides revive / game over
    case 'victory':
      p.vx = 0; p.vz = 0;
      if(p.anim!=='victory') G.setAnim(p, 'victory');
      return;
    case 'dodge': {
      const k = 1 - p.stateT/DODGE_LEN;
      p.vx = p.dodgeVx * (0.35 + 0.65*k); p.vz = p.dodgeVz * (0.35 + 0.65*k);
      if(p.stateT >= DODGE_LEN){ setFree(p); p.vx *= 0.3; }
      else if(p.stateT > DODGE_INV && (b.attack.pressed || b.jump.pressed)) { setFree(p); }
      else return;
      break;
    }
    case 'atk': case 'special': case 'ult': case 'airAtk': case 'charge': break;
  }

  // ---- charging (hold attack)
  if(p.state==='charge'){
    p.vx = 0; p.vz = 0;
    if(b.attack.down){
      p.chargeT++;
      p.charge = U.clamp((p.chargeT)/(CHARGE_FULL-CHARGE_START), 0, 1);
      if(p.anim!=='charge') G.setAnim(p, 'charge');
      if(p.charge>=1 && !p.chargeFull){ p.chargeFull = true; G.bus.emit('chargeFull', { ent:p }); if(G.fx && G.fx.burst) G.fx.burst('sparkle', p.x, p.height*0.6, p.z, { count:8 }); }
      if(b.dodge.pressed){ p.charge = 0; p.chargeFull = false; if(G.audio) G.audio.sfx('charge', { stop:true }); doDodge(p); }
      return;
    }
    for(const k of ['jump','dodge','special']) if(b[k].pressed) p.q[k] = 14;
    const full = p.charge >= 0.45;
    p.charge = 0; p.chargeFull = false; p.chargeT = 0;
    if(G.audio && G.audio.sfx) G.audio.sfx('charge', { stop:true });
    if(full){ startAtk(p, p.moves.charge, 'atk'); p.comboStep = 0; G.bus.emit('chargeRelease', { ent:p }); }
    else { startAtk(p, comboDefs(p)[0], 'atk'); p.comboStep = 1; p.comboT = 40; }
    return;
  }

    if(b.attack.pressed){ p.buffer = 14; used('attack'); }
    const a = p.atk;
    if(!a){ // finished
      if(G.fx && G.fx.trailStop) G.fx.trailStop(p);
      if(p.state==='ult'){ p.inv = Math.max(p.inv, 30); }
      setFree(p);
      if(p.state!=='air' && p.buffer>0 && p.comboStep>0 && p.comboStep < comboDefs(p).length){ nextCombo(p); return; }
      // fall through to free control this tick
    } else {
      const def = a.def;
      const pastCancel = a.t >= (def.cancel||def.len);
      if(!pastCancel){ for(const k of ['jump','special']) if(b[k].pressed && !(p.q[k] > 0)) p.q[k] = 14; }
      if(p.state==='atk' && pastCancel){
        if(p.buffer>0 && p.comboStep>0 && p.comboStep < comboDefs(p).length){ nextCombo(p); return; }
        if(b.special.pressed && p.sp>=1){ doSpecial(p); return; }
        if(b.jump.pressed){ G.combat.cancel(p); doJump(p, false); return; }
      }
      if(p.state==='airAtk' && pastCancel && b.jump.pressed && !p.djump){ G.combat.cancel(p); doJump(p, true); return; }
      if(p.state==='airAtk' && p.onGround && a.t > 4){ G.combat.cancel(p); G.setState(p,'idle'); G.setAnim(p,'land',8); return; }
      if((p.state==='atk' || p.state==='special') && b.dodge.pressed && a.t > 3 && p.state!=='ult'){ doDodge(p); return; }
      if(p.state==='atk' && b.ult.pressed && p.ult>=ULT_MAX){ G.combat.cancel(p); doUlt(p); return; }

  if(grounded) p.stompUsed = false;
  if(!grounded && p.state!=='air') G.setState(p, 'air');

  if(b.ult.pressed && p.ult >= ULT_MAX){ doUlt(p); return; }

  // ground
  if(b.attack.pressed){
    p.chargeT = 0;
    if(p.comboStep>0 && p.comboT>0 && p.comboStep < comboDefs(p).length){ nextCombo(p); return; }

    G.setState(p, 'charge'); p.chargeT = 0; p.charge = 0;
    G.bus.emit('chargeStart', { ent:p });

    return;
  }
  const mx = I.x, mz = I.z;

    p.vx = mx*p.spd; p.vz = mz*p.spd*0.72;
    if(Math.abs(mx) > 0.15) p.face = mx > 0 ? 1 : -1;

    if(p.anim!=='run') G.setAnim(p, 'run');

    p.vx = 0; p.vz = 0;
    if(p.state!=='idle') G.setState(p, 'idle');
    if(p.anim!=='idle' && !(p.anim==='land' && p.animT<8)) G.setAnim(p, 'idle');
  }
}

}

// ================================================================ particle system
// SoA pool. Sizes are world units, velocities units/frame, times in frames (60 Hz).
const MAXP = 600, HALO_MAX = 64, CAP = MAXP + HALO_MAX;
const F_FLUTTER=1, F_FLOOR=2, F_VALIGN=4, F_TWINK=8, F_WOB=16, F_TRAILER=32, F_REST=64, F_STRETCH=128, F_FLIP=256;
const px=new Float32Array(MAXP), py=new Float32Array(MAXP), pz=new Float32Array(MAXP);
const qx=new Float32Array(MAXP), qy=new Float32Array(MAXP), qz=new Float32Array(MAXP);     // velocity
const grav=new Float32Array(MAXP), drag=new Float32Array(MAXP), s0=new Float32Array(MAXP), s1=new Float32Array(MAXP);
const asp=new Float32Array(MAXP), rot=new Float32Array(MAXP), spin=new Float32Array(MAXP);
const cr=new Float32Array(MAXP), cg=new Float32Array(MAXP), cb=new Float32Array(MAXP), ca=new Float32Array(MAXP);
const fin=new Float32Array(MAXP), fout=new Float32Array(MAXP), life=new Float32Array(MAXP), age=new Float32Array(MAXP);
const wob=new Float32Array(MAXP), ph=new Float32Array(MAXP), str=new Float32Array(MAXP), addv=new Float32Array(MAXP);
const tile=new Uint8Array(MAXP), curve=new Uint8Array(MAXP), flags=new Uint16Array(MAXP);
const ARRS = [px,py,pz,qx,qy,qz,grav,drag,s0,s1,asp,rot,spin,cr,cg,cb,ca,fin,fout,life,age,wob,ph,str,addv,tile,curve,flags];
let np = 0, capP = MAXP;
function copyP(d, s){ for(let k=0;k<ARRS.length;k++){ const a=ARRS[k]; a[d]=a[s]; } }

// spawn spec (one reused object — no allocation per particle)
// curve: 0 linear s0→s1, 1 pop (overshoot in, then ease to s1), 2 fast-out s0→s1, 3 bell (s0·sin πt), 4 hold then s1
const S = {};
function sp(t, x, y, z){
  S.tile=t; S.x=x; S.y=y; S.z=z; S.vx=0; S.vy=0; S.vz=0; S.grav=0; S.drag=0;
  S.s0=0.3; S.s1=0.3; S.curve=0; S.asp=1; S.rot=0; S.spin=0;
  S.r=1; S.g=1; S.b=1; S.a=1; S.fin=0; S.fout=0.35; S.life=30; S.add=0; S.flags=0; S.wob=0; S.str=0; S.delay=0;
  return S;
}
function sc_(c){ const v=rgb(c); S.r=v[0]; S.g=v[1]; S.b=v[2]; }
function emit(){
  if(np >= capP) return -1;
  const i = np++;
  px[i]=S.x; py[i]=S.y; pz[i]=S.z; qx[i]=S.vx; qy[i]=S.vy; qz[i]=S.vz; grav[i]=S.grav; drag[i]=S.drag;
  s0[i]=S.s0; s1[i]=S.s1; asp[i]=S.asp; rot[i]=S.rot; spin[i]=S.spin; cr[i]=S.r; cg[i]=S.g; cb[i]=S.b; ca[i]=S.a;
  fin[i]=S.fin; fout[i]=S.fout; life[i]=Math.max(1,S.life); age[i]=-(S.delay||0); wob[i]=S.wob; ph[i]=rnd()*TAU; str[i]=S.str;
  addv[i]=S.add; tile[i]=S.tile; curve[i]=S.curve; flags[i]=S.flags;
  return i;
}

function updateParticles(k){
  let i = 0;
  while(i < np){
    const a0 = age[i], ag = a0 + k;
    if(ag >= life[i]){ np--; if(i<np) copyP(i, np); continue; }
    age[i] = ag;
    if(ag < 0){ i++; continue; }               // still waiting (delay)
    const f = flags[i];
    const dv = drag[i]; if(dv>0){ const m = 1/(1+dv*k); qx[i]*=m; qy[i]*=m; qz[i]*=m; }
    qy[i] += grav[i]*k;
    if(f & F_FLUTTER && qy[i] < -0.032) qy[i] += (-0.032 - qy[i])*Math.min(1, 0.25*k);   // paper falls slowly
    px[i] += qx[i]*k; py[i] += qy[i]*k; pz[i] += qz[i]*k;
    if(f & F_FLOOR && py[i] < 0.03 && qy[i] < 0){
      py[i] = 0.03; qy[i] = -qy[i]*0.25; qx[i]*=0.5; qz[i]*=0.5; spin[i]*=0.4;
      if(qy[i] < 0.012){ qy[i]=0; qx[i]=0; qz[i]=0; grav[i]=0; spin[i]=0; flags[i] = f | F_REST; }
    }
    rot[i] += spin[i]*k;
    if(f & F_TRAILER && ((ag/3)|0) !== ((Math.max(0,a0)/3)|0) && np < capP*0.8){
      const x=px[i], y=py[i], z=pz[i], r=cr[i], g=cg[i], b=cb[i];
      sp(T.glow, x, y, z); S.s0=0.2; S.s1=0.05; S.life=16; S.add=0.6; S.a=0.8; S.fout=0.8; S.r=r; S.g=g; S.b=b; S.vy=-0.004; emit();
    }
    i++;
  }
}

// instance buffers
let AP=null, AS=null, AC=null, attrP=null, attrS=null, attrC=null, pGeo=null, pMat=null, pMesh=null, atlas=null;
function put(j, x,y,z, ro, w,h, t, ad, r,g,b,a){
  const o=j*4;
  AP[o]=x; AP[o+1]=y; AP[o+2]=z; AP[o+3]=ro;
  AS[o]=w; AS[o+1]=h; AS[o+2]=t; AS[o+3]=ad;
  AC[o]=r; AC[o+1]=g; AC[o+2]=b; AC[o+3]=a;
}
let camRX=1, camRY=0, camRZ=0, camUX=0, camUY=1, camUZ=0;
function writeParticles(j, pass){
  for(let i=0;i<np;i++){
    const ag = age[i]; if(ag < 0) continue;
    const ad = addv[i]; if((ad >= 0.5 ? 1 : 0) !== pass) continue;
    if(j >= CAP) return j;
    const t = ag/life[i];
    const a0 = s0[i], a1 = s1[i];
    let s;
    switch(curve[i]){
      case 1: if(t < 0.16) s = a0*backOut(t/0.16); else { const q=(t-0.16)/0.84; s = a0 + (a1-a0)*q*q; } break;
      case 2: { const q=1-t; s = a0 + (a1-a0)*(1-q*q*q); } break;
      case 3: s = a0*Math.sin(Math.PI*t); break;
      case 4: s = t < 0.7 ? a0 : a0 + (a1-a0)*(t-0.7)/0.3; break;
      default: s = a0 + (a1-a0)*t;
    }
    let a = ca[i];
    const fi = fin[i]; if(fi>0 && t<fi) a *= t/fi;
    const fo = fout[i]; if(fo>0 && t>1-fo) a *= (1-t)/fo;
    const f = flags[i];
    if(f & F_TWINK) a *= 0.55 + 0.45*Math.sin(ag*0.9 + ph[i]);
    if(a <= 0.003 || s <= 0.001) continue;
    let w = s, h = s*asp[i], ro = rot[i], X = px[i];
    if(f & F_FLUTTER && !(f & F_REST)) w *= 0.2 + 0.8*Math.abs(Math.cos(ag*0.21 + ph[i]));
    if(f & F_WOB) X += Math.sin(ag*0.11 + ph[i]) * wob[i];
    if(f & (F_VALIGN|F_STRETCH)){
      const vx=qx[i], vy=qy[i], vz=qz[i];
      const sx = vx*camRX + vy*camRY + vz*camRZ, sy = vx*camUX + vy*camUY + vz*camUZ;
      if(f & F_VALIGN) ro = Math.atan2(sy, sx) + rot[i];
      if(f & F_STRETCH) w *= 1 + Math.sqrt(sx*sx+sy*sy)*str[i];
    }
    if(f & F_FLIP) w = -w;
    put(j++, X, py[i], pz[i], ro, w, h, tile[i], ad, cr[i], cg[i], cb[i], a);
  }
  return j;
}

const PVS = [
  'attribute vec4 aPos; attribute vec4 aSize; attribute vec4 aCol;',
  'uniform float uBias;',
  'varying vec2 vUv; varying vec4 vCol; varying float vAdd;',
  'void main(){',
  '  vec4 mv = modelViewMatrix * vec4(aPos.xyz, 1.0);',
  '  float c = cos(aPos.w), s = sin(aPos.w);',
  '  vec2 q = position.xy * aSize.xy;',
  '  mv.xy += vec2(c*q.x - s*q.y, s*q.x + c*q.y);',
  '  mv.z += uBias;',                                   // nudge toward the camera so sparks sit in front of the body
  '  gl_Position = projectionMatrix * mv;',
  '  float col = mod(aSize.z, 8.0), row = floor(aSize.z/8.0 + 0.001);',
  '  vec2 l = vec2(uv.x, 1.0 - uv.y) * 0.94 + 0.03;',    // inset: no bleeding from the neighbour tile
  '  vUv = vec2((col + l.x)/8.0, 1.0 - (row + l.y)/4.0);',
  '  vCol = aCol; vAdd = aSize.w;',
  '}'].join('\n');
const PFS = [
  'uniform sampler2D uMap; uniform vec2 uHdr;',
  'varying vec2 vUv; varying vec4 vCol; varying float vAdd;',
  // colours are authored in sRGB; convert to linear, then to whatever the target wants
  // (screen → sRGB again = exact authored colour; 05_post HDR target → linear, tone-mapped in its composite)
  'vec3 s2l(vec3 c){ return mix(c/12.92, pow((c+0.055)/1.055, vec3(2.4)), step(0.04045, c)); }',
  'void main(){',
  '  vec3 t = texture2D(uMap, vUv).rgb;',
  '  float m = max(t.r, t.b);',
  '  float a = m * vCol.a;',
  '  if(a < 0.003) discard;',
  '  vec3 c = vCol.rgb;',
  '  vec3 rgb = t.g < 0.5 ? mix(c*0.72, c, t.g*2.0) : mix(c, vec3(1.0), (t.g-0.5)*1.8);',
  '  vec3 line = mix(c*0.34, vec3(0.23,0.14,0.09), 0.35);',
  '  rgb = mix(rgb, line, clamp(t.b / max(m, 0.001), 0.0, 1.0));',
  '  vec3 o = linearToOutputTexel(vec4(s2l(max(rgb, vec3(0.0))) * mix(uHdr.x, uHdr.y, vAdd), 1.0)).rgb;',
  '  gl_FragColor = vec4(o * a, a * (1.0 - vAdd));',   // premultiplied: add=1 → additive, add=0 → normal blend
  '}'].join('\n');

function buildParticles(){
  atlas = buildAtlas();
  const base = new THREE.PlaneGeometry(1,1);
  pGeo = new THREE.InstancedBufferGeometry();
  pGeo.setIndex(base.index); pGeo.setAttribute('position', base.attributes.position); pGeo.setAttribute('uv', base.attributes.uv);
  AP = new Float32Array(CAP*4); AS = new Float32Array(CAP*4); AC = new Float32Array(CAP*4);
  attrP = new THREE.InstancedBufferAttribute(AP, 4); attrP.setUsage(THREE.DynamicDrawUsage);
  attrS = new THREE.InstancedBufferAttribute(AS, 4); attrS.setUsage(THREE.DynamicDrawUsage);
  attrC = new THREE.InstancedBufferAttribute(AC, 4); attrC.setUsage(THREE.DynamicDrawUsage);
  pGeo.setAttribute('aPos', attrP); pGeo.setAttribute('aSize', attrS); pGeo.setAttribute('aCol', attrC);
  pGeo.instanceCount = 0;
  pMat = new THREE.ShaderMaterial({
    uniforms: { uMap:{ value: atlas.tex }, uBias:{ value: 0.45 }, uHdr:{ value: new THREE.Vector2(1,1) } },
    vertexShader: PVS, fragmentShader: PFS,
    transparent: true, depthWrite: false, depthTest: true, side: THREE.DoubleSide, toneMapped: false, fog: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,

}
function markAttr(a, n){
  if(a.clearUpdateRanges){ a.clearUpdateRanges(); a.addUpdateRange(0, n*4); }
  else if(a.updateRange){ a.updateRange.offset = 0; a.updateRange.count = n*4; }
  a.needsUpdate = true;
}

// ================================================================ projectiles

let fxT = 0;                 // real frames since init (drives halo pulse/spin)
const liveProj = [];
const projPool = {};
const shared = new Map();
function once(key, make){ let v = shared.get(key); if(!v){ v = make(); shared.set(key, v); } return v; }
function basicMat(key, color, extra){ return once('m:'+key, ()=>{ const m = new THREE.MeshBasicMaterial(Object.assign({ color: new THREE.Color(color) }, extra||{})); m.userData.shared = true; return m; }); }

}
function toyMesh(geo, mat, outline){

}
const HL = (tile, size, color, a, add, extra)=> Object.assign({ tile, size, color, a, add, c:null }, extra||{});
const PDEF = {
  wave: { mesh:null,

const PROJ_KINDS = Object.keys(PDEF);

function makeProjectile(kind){
  if(!PDEF[kind]) kind = 'ball';
  const D = PDEF[kind];
  const pool = projPool[kind] || (projPool[kind] = []);
  let h = pool.pop();
  if(!h){
    const obj = new THREE.Group(); obj.name = 'fxProj_'+kind;
    let mesh = null;
    try { mesh = D.mesh ? D.mesh() : null; } catch(err){ G.logError('fx.projectile '+kind, err); }
    if(mesh) obj.add(mesh);
    h = { kind, D, obj, mesh: mesh || new THREE.Object3D(), live:false, t:0, age:0, vx:1, vy:0, face:1, scale:1, seed:0, x:0, y:0, z:0 };
    h.update = (p)=> projUpdate(h, p);
    h.dispose = ()=> projDispose(h);
    h.pop = ()=> projPop(h);
  }
  h.live = true; h.t = 0; h.age = 0; h.vx = 1; h.vy = 0; h.face = 1; h.scale = 0.4; h.seed = rnd();
  h.obj.position.set(0,0,0); h.obj.rotation.set(0,0,0); h.obj.scale.setScalar(0.4); h.obj.visible = true;
  h.mesh.position.set(0,0,0); h.mesh.rotation.set(0,0,0); h.mesh.scale.set(1,1,1);
  liveProj.push(h);
  return h;
}
function projUpdate(h, p){
  if(!h.live || !p) return;
  h.age = (typeof p.age === 'number') ? (p.age|0) : h.t; h.t++;
  h.x = p.x||0; h.y = p.y||0; h.z = p.z||0;
  h.obj.position.set(h.x, h.y, h.z);
  if(p.vx) h.vx = p.vx; h.vy = p.vy||0;
  const f = h.face = h.vx < 0 ? -1 : 1;
  let s = h.age < 5 ? 0.4 + 0.6*backOut((h.age+1)/5) : 1;
  if(p.life && p.life - h.age < 6) s *= Math.max(0.25, (p.life - h.age)/6);
  h.scale = s; h.obj.scale.setScalar(s);
  if(np < capP - 8 && h.D.tick){ try { h.D.tick(h, p, f); } catch(err){ G.logError('fx.projectile.tick '+h.kind, err); } }
}
function projDispose(h){
  if(!h.live) return;
  h.live = false;
  if(h.obj.parent) h.obj.parent.remove(h.obj);
  const i = liveProj.indexOf(h); if(i>=0) liveProj.splice(i,1);
  const pool = projPool[h.kind] || (projPool[h.kind] = []);
  if(pool.length < 24) pool.push(h);
}

const POPFX = { wave:'sparkle', star:'stars', ball:'ring', fire:'flame', ice:'ice', bolt:'thunder', cork:'poof', card:'sparkle', confetti:'confetti',
  bone:'stars', note:'notes', firework:'fireworks', rock:'dust', shadow:'smoke', beam:'ring', heart:'hearts', candy:'confetti' };
const POPCOL = { ball:'#6fd0ff', beam:'#ff5a6a', wave:'#bff0ff', card:'#ff5a6a' };
function projPop(h){
  const k = POPFX[h.kind] || 'sparkle';
  burst(k, h.x, h.y, h.z + 0.2, { scale: k==='fireworks' ? 0.5 : 0.7, count: k==='fireworks' ? 1 : (k==='confetti' ? 14 : 0) || undefined, color: POPCOL[h.kind] });

const _w = new THREE.Vector3();
function writeHalos(j, pass){
  for(let n=0;n<liveProj.length;n++){
    const h = liveProj[n], o = h.obj, hs = h.D.halos;
    if(!hs || !o.parent || !o.visible) continue;
    let X, Y, Z;
    if(o.parent === G.scene){ X=o.position.x; Y=o.position.y; Z=o.position.z; } else { o.getWorldPosition(_w); X=_w.x; Y=_w.y; Z=_w.z; }
    const sc = h.scale, f = h.face;
    for(let m=0;m<hs.length;m++){
      const L = hs[m];
      if((L.add >= 0.5 ? 1 : 0) !== pass) continue;
      if(j >= CAP) return j;
      if(!L.c) L.c = rgb(L.color);
      let s = L.size*sc, a = L.a;
      if(L.pulse) s *= 1 + L.pulse*Math.sin(fxT*0.4 + h.seed*10);
      if(L.flick) a *= 1 - L.flick*rnd();
      let ro = (L.spin||0)*fxT + h.seed*TAU*(L.spin?1:0);
      if(L.orient) ro = f>0 ? L.orient : -L.orient;
      if(L.jitter) ro += (rnd()*2-1)*L.jitter;
      let w = s; if(L.flip && f<0) w = -w;
      put(j++, X + (L.ox||0)*f*sc, Y + (L.oy||0)*sc, Z, ro, w, s*(L.asp||1), L.tile, L.add, L.c[0], L.c[1], L.c[2], a);
    }
  }
  return j;
}

const emitters = [];
function addEmitter(dur, rate, fn, x, y, z, o){
  if(emitters.length >= 16) emitters.shift();
  emitters.push({ t:0, dur, rate, acc:0, fn, x, y, z, o:o||{}, n:0 });
}
function updateEmitters(k){
  for(let i=emitters.length-1;i>=0;i--){
    const e = emitters[i];
    e.acc += e.rate*k*fxs();
    while(e.acc >= 1){ e.acc -= 1; if(np > capP*0.75) continue;   // ambient emitters yield to hit effects

    if(e.t >= e.dur) emitters.splice(i,1);
  }
}

  sps:[], spd:[], fit:1, pw:0, portrait:false, flashed:false, wd:0, id:0 };
function buildCut(){
  const el = document.createElement('div'); el.className = 'fxcut';
  el.innerHTML = '<div class="cband"><div class="cstripe"></div><div class="cedge"></div></div>' +
    '<div class="cport"><canvas width="256" height="256"></canvas></div><div class="cname"><div class="clabel">おうぎ！</div><div class="ctext"></div></div>';
  // the dim sits under the speed lines (so the lines stay white), the band/portrait/name over them
  const dim = document.createElement('div'); dim.className = 'fxcut'; dim.innerHTML = '<div class="cdim"></div>'; top.insertBefore(dim, speedHost);
  cut.dimWrap = dim; cut.el = el; cut.dim = dim.firstChild; cut.band = el.querySelector('.cband'); cut.stripe = el.querySelector('.cstripe');
  cut.port = el.querySelector('.cport'); cut.cv = el.querySelector('canvas'); cut.name = el.querySelector('.cname'); cut.label = el.querySelector('.clabel'); cut.txt = el.querySelector('.ctext');
  for(let i=0;i<10;i++){ const s = document.createElement('div'); s.className = 'csp'; el.appendChild(s); cut.sps.push(s); cut.spd.push({ x:0, y:0, ph:0, sz:1 }); }
  top.insertBefore(el, flashEl);   // over the speed lines, under the flash
}
function drawPortrait(heroId, col){
  const cv = cut.cv, x = cv.getContext('2d'), S2 = 256;
  x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,S2,S2);
  // ears (dog!) behind the medallion
  x.fillStyle = css(col, 0.35, 'k'); x.strokeStyle = '#3b2417'; x.lineWidth = 8;
  for(const sgn of [-1,1]){ x.beginPath(); x.ellipse(128+sgn*78, 70, 30, 46, sgn*0.5, 0, TAU); x.fill(); x.stroke(); }
  // medallion
  const g = x.createRadialGradient(108,100,10,128,128,112); g.addColorStop(0, css(col,0.55,'w')); g.addColorStop(0.7, css(col,0,'w')); g.addColorStop(1, css(col,0.25,'k'));
  x.fillStyle = g; x.beginPath(); x.arc(128,136,108,0,TAU); x.fill();
  let drew = false, src = null;
  try { if(G.heroes && typeof G.heroes.portrait === 'function') src = G.heroes.portrait(heroId); } catch(err){ G.logError('fx.cutin portrait', err); }
  if(src && src.isTexture) src = src.image;
  const drawSrc = (im)=>{ const sw = im.width||im.videoWidth||256, sh = im.height||im.videoHeight||256, k = Math.max(216/sw, 216/sh);
    x.save(); x.beginPath(); x.arc(128,136,104,0,TAU); x.clip(); x.drawImage(im, 128 - sw*k/2, 136 - sh*k/2, sw*k, sh*k); x.restore(); };
  if(src){
    try {
      if(typeof src === 'string'){ const im = new Image(); im.onload = ()=>{ try { drawSrc(im); ringP(); } catch(_){} }; im.src = src; drew = true; }
      else if((typeof HTMLCanvasElement!=='undefined' && src instanceof HTMLCanvasElement) || (typeof ImageBitmap!=='undefined' && src instanceof ImageBitmap) ||
              (typeof OffscreenCanvas!=='undefined' && src instanceof OffscreenCanvas)){ drawSrc(src); drew = true; }
      else if(typeof HTMLImageElement!=='undefined' && src instanceof HTMLImageElement){
        if(src.complete && src.naturalWidth){ drawSrc(src); drew = true; } else { src.addEventListener('load', ()=>{ try { drawSrc(src); ringP(); } catch(_){} }, { once:true }); drew = true; } }
    } catch(err){ G.logError('fx.cutin portrait draw', err); drew = false; }
  }
  if(!drew){
    const h = heroInfo(heroId);
    const nm = String((h && (h.short || h.name)) || heroId || '?');
    let ch = Array.from(nm)[0] || '?'; if(/[a-z]/.test(ch)) ch = ch.toUpperCase();
    x.font = '900 128px ' + FONT; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineJoin = 'round'; x.lineWidth = 16; x.strokeStyle = '#3b2417'; x.strokeText(ch, 128, 144);
    x.fillStyle = '#ffffff'; x.fillText(ch, 128, 144);
    // cheeks
    x.fillStyle = 'rgba(255,150,180,0.8)'; x.beginPath(); x.ellipse(72,176,16,9,0,0,TAU); x.fill(); x.beginPath(); x.ellipse(184,176,16,9,0,0,TAU); x.fill();
  }
  ringP();
  function ringP(){ x.lineWidth = 10; x.strokeStyle = '#ffffff'; x.beginPath(); x.arc(128,136,108,0,TAU); x.stroke();
    x.lineWidth = 5; x.strokeStyle = '#3b2417'; x.beginPath(); x.arc(128,136,114,0,TAU); x.stroke();
    x.fillStyle = '#ffffff'; x.globalAlpha = 0.85; x.beginPath(); x.ellipse(82,86,16,9,-0.7,0,TAU); x.fill(); x.globalAlpha = 1; }
}
function cutin(heroId, name, done){
  if(!ready){ if(typeof done==='function') try { done(); } catch(_){} return; }
  if(!cut.el) buildCut();
  if(cut.on){
    // same ult announced twice (bus 'ult' + direct call in the same moment): merge instead of restarting
    if(cut.heroId === heroId && cut.t < 4){ if(typeof done==='function'){ if(cut.done && cut.done!==done){ const d0 = cut.done; cut.done = ()=>{ d0(); done(); }; } else cut.done = done; } if(name) cut.txt.textContent = name; return; }
    finishCut(true);
  }
  const col = heroColor(heroId);
  cut.on = true; cut.t = 0; cut.done = (typeof done==='function') ? done : null; cut.heroId = heroId; cut.flashed = false; cut.id++;
  cut.band.style.background = 'linear-gradient(180deg,'+css(col,0.45,'w')+' 0%,'+css(col,0,'w')+' 46%,'+css(col,0.3,'k')+' 100%)';
  cut.el.style.setProperty('--hcd', css(col, 0.3, 'k'));
  cut.txt.textContent = name || 'おうぎ！';
  drawPortrait(heroId, col);
  cut.el.style.display = 'block'; cut.dimWrap.style.display = 'block';
  // layout (landscape: portrait left, name right / portrait: portrait top, name below)
  const W = G.view.w, H = G.view.h, mn = Math.min(W,H);
  cut.portrait = H > W*0.95;
  const pw = cut.pw = Math.min(mn*(cut.portrait ? 0.42 : 0.4), 270);
  const ps = cut.port.style; ps.width = pw+'px'; ps.height = pw+'px';
  let avail;
  if(!cut.portrait){ ps.left = (W*0.08)+'px'; ps.top = '50%'; cut.name.style.left = (W*0.08 + pw + mn*0.04)+'px'; cut.name.style.top = '50%'; avail = W - (W*0.08 + pw + mn*0.04) - W*0.04; }
  else { ps.left = ((W-pw)/2)+'px'; ps.top = '38%'; cut.name.style.left = (W*0.05)+'px'; cut.name.style.top = '64%'; avail = W*0.9; }
  cut.name.style.transform = 'none';
  const nw = cut.name.offsetWidth || 1;           // one layout per cut-in
  cut.fit = Math.min(1, avail / nw);
  for(const d of cut.spd){ d.x = R(0.05,0.95)*W; d.y = R(0.25,0.75)*H; d.ph = R(0,TAU); d.sz = R(0.6,1.4); }
  speedLines(64);
  if(cut.wd) clearTimeout(cut.wd);
  const id = cut.id;
  if(!G.testMode) cut.wd = setTimeout(()=>{ if(cut.on && cut.id===id) finishCut(true); }, 4000);   // never leave the game waiting
  updateCut(0);
}
function finishCut(callDone){
  if(!cut.on) return;
  cut.on = false; cut.el.style.display = 'none'; cut.dimWrap.style.display = 'none';
  if(cut.wd){ clearTimeout(cut.wd); cut.wd = 0; }
  const d = cut.done; cut.done = null;
  if(callDone && d){ try { d(); } catch(err){ G.logError('fx.cutin done', err); } }
}
function updateCut(k){
  if(!cut.on) return;
  cut.t += k;
  const t = cut.t, W = G.view.w;
  cut.dim.style.opacity = (smooth(t,0,8)*(1 - smooth(t,60,70))).toFixed(3);
  const exit = t > 58 ? cubicIn((t-58)/12) : 0;
  const bx = t < 10 ? -130*(1 - cubicOut(t/10)) : 130*exit;
  const by = t < 10 ? 0.45 + 0.55*backOut(t/10) : 1;
  cut.band.style.transform = 'translateX('+bx.toFixed(2)+'%) rotate(-7deg) scaleY('+by.toFixed(3)+')';
  cut.stripe.style.backgroundPosition = (-t*22).toFixed(0)+'px 0';
  const q = clamp((t-4)/10, 0, 1);
  const pxv = -W*0.6*(1 - backOut(q)) + W*1.3*exit;
  cut.port.style.transform = 'translate('+pxv.toFixed(1)+'px,calc(-50% + '+(Math.sin(t*0.16)*4).toFixed(1)+'px)) scale('+(0.7 + 0.3*backOut(q)).toFixed(3)+') rotate('+((1-q)*-20).toFixed(1)+'deg)';
  cut.port.style.opacity = q > 0 ? '1' : '0';
  const qn = clamp((t-10)/10, 0, 1);
  const ns = 1 + 1.6*(1 - cubicOut(qn));
  const sh = (t > 10 && t < 18) ? (rnd()*2-1)*5 : 0;
  const nx = W*0.9*exit;
  cut.name.style.transform = 'translate('+(nx+sh).toFixed(1)+'px,calc(-50% + '+(sh*0.6).toFixed(1)+'px)) scale('+(ns*cut.fit).toFixed(3)+')';
  cut.name.style.opacity = qn > 0 ? (Math.min(1, qn*3)*(1 - smooth(t,62,70))).toFixed(3) : '0';
  cut.label.style.transform = 'scale('+backOut(clamp((t-7)/7,0,1)).toFixed(3)+') rotate(-4deg)';
  for(let i=0;i<cut.sps.length;i++){
    const d = cut.spd[i], s = (t > 10 && t < 64) ? Math.max(0, Math.sin(t*0.3 + d.ph))*d.sz : 0;
    cut.sps[i].style.transform = 'translate('+d.x.toFixed(0)+'px,'+d.y.toFixed(0)+'px) scale('+s.toFixed(3)+') rotate('+(t*4).toFixed(0)+'deg)';
  }
  if(!cut.flashed && t >= 11){ cut.flashed = true; flash('#ffffff', 0.3, 8); }
  if(t >= cut.dur) finishCut(true);
}

// ================================================================ bus → effects
let hitsThisFrame = 0;
function headY(e){ return (e.y||0) + ((e.rig && e.rig.height) || e.height || 1.2); }
function onHit(d){
  hitsThisFrame++;

  const power = d.power||1, kind = KIND[d.kind] ? d.kind : 'slash';
  let x = d.x, y = d.y, z = d.z;
  if(x==null && tg){ x = tg.x; y = tg.y + (tg.height||1.2)*0.55; z = tg.z; }
  if(x==null) return;
  const zr = tg ? Math.min(0.7, (tg.radius||0.4)*0.9) : 0.3;
  const onPlayer = !!(tg && tg.team===0);
  const dir = d.dir||0;
  const reduced = hitsThisFrame > 2;                        // budget: several targets in one frame → lighter effects
  if(hitsThisFrame <= 14){
    // the contact point sits between attacker and target: centre the burst a little into the target instead
    const ix = onPlayer ? x : x + dir*0.2;
    if(d.blocked) guard(x, y, z+zr, { scale:1 });
    else impact(ix, y, z+zr, kind, onPlayer ? Math.min(power,2) : power, { dir, reduced, scale: onPlayer ? 0.8 : 1 });
  }
  if(d.dmg > 0){
    const hx = tg ? tg.x : x, hz = tg ? tg.z : z, hy = tg ? headY(tg) + 0.15 : y + 0.6, n = Math.max(1, Math.round(d.dmg));
    if(onPlayer || d.crit) text(String(n), hx + R(-0.2,0.2), hy, hz, onPlayer ? 'hurt' : 'crit');
    else dmgNumber(n, hx + R(-0.2,0.2), hy, hz);
  }
  if(!reduced){
    const K = KIND[kind];
    // hit word over the target, on the side away from the attacker (the damage number sits on its head);
    // 'pow' words keep off the hero, and only the strongest one shows in one spot
    const wx = tg ? (onPlayer ? tg.x : tg.x + (dir||1)*(tg.radius||0.4)*0.5) : x + (dir||1)*0.3;
    const wy = tg ? (onPlayer ? headY(tg) + 0.3 : (tg.y||0) + (tg.height||1.2)*0.62) : y + 0.1, wz = tg ? tg.z : z;
    const lean = onPlayer ? 0 : (dir||1);
    if(d.blocked) text('カキン！', wx, wy, wz, 'pow', { color:'#7fd0ff', rank:1, lean });
    else if(power >= 2) text(onPlayer ? 'いたっ！' : K.ono[power>=3 ? K.ono.length-1 : (rnd()*(K.ono.length-1))|0], wx, wy, wz, 'pow', { color: onPlayer ? '#ff5a8a' : K.oc, rank: Math.min(power,3), lean });
    if(power >= 3 && d.src && d.src.team===0) speedLines(12);
  }
}

    ring(e.x, 0.05, e.z, { flat:true, scale:1.3, color:'#ffd0ea' }); sp(T.glow, e.x, (e.y||0)+1.0, e.z); S.s0 = 1.1; S.s1 = 1.3; S.asp = 2.6; S.life = 40; S.add = 1; S.a = 0.5; S.fin = 0.2; S.fout = 0.5; sc_('#fff0f8'); emit(); },

// ================================================================ lifecycle
let ready = false;
function init(){
  if(ready) return;
  if(!G.scene || !G.camera) return;
  buildParticles(); buildTrails(); buildDOM();
  G.scene.add(pMesh); G.scene.add(trMesh);
  capP = Math.max(60, Math.round(MAXP * fxs()));
  for(const ev in HANDLERS) G.bus.on(ev, HANDLERS[ev]);
  ready = true;
}
function clear(){
  if(!ready) return;
  np = 0; emitters.length = 0;
  for(const t of trails){ t.on = false; t.ent = null; t.n = 0; }
  for(const p of pops){ p.on = false; p.el.style.visibility = 'hidden'; p.shown = false; }
  alertClear();
  fl.on = false; flashEl.style.opacity = '0'; flashEl.style.visibility = 'hidden';
  sl.on = false; for(const c of sl.cvs) c.style.visibility = 'hidden';
  if(cut.on){ cut.on = false; cut.done = null; cut.el.style.display = 'none'; cut.dimWrap.style.display = 'none'; if(cut.wd){ clearTimeout(cut.wd); cut.wd = 0; } }
}
let lastCount = 0;
function frame(dt){
  if(!ready) return;
  const kReal = clamp((dt>0 ? dt : 1/60)*60, 0, 4);
  // world effects follow slow motion a little (but keep animating during hitstop)
  const kw = G.fx.worldFrozen ? 0 : kReal * Math.max(0.4, Math.min(1, G.timeScale || 1));
  fxT += kReal;
  // the camera controller moved the camera this frame but its matrices update only at render time:
  // refresh them so billboards and DOM popups use this frame's view (not last frame's, which lags under shake)
  G.camera.updateMatrixWorld();
  try {
    if(pMesh.parent !== G.scene) G.scene.add(pMesh);

  const natural = b.buf.duration/rate;
  const len = Math.min(natural, Math.max(0.05, dur) + def.ring);
  const vv = v*def.gain;
  g.gain.setValueAtTime(vv, t);
  if(len < natural-0.02) g.gain.setTargetAtTime(0, t+len-0.05, 0.018);
  s.connect(g); g.connect(dest);
  s.start(t);

  if(len+0.06 < natural-0.01) s.stop(t+len+0.06);

}
const KIT = { k:0.95, s:0.5, c:0.45, sn:0.42, h:0.2, oh:0.22, sh:0.17, wb:0.32, cb:0.16, tb:0.18, sl:0.26, tk:0.85, tm:0.5, cr:0.24 };
function playDrum(E, dest, name, t, v, sfx){
  const b = E.bufs.drum[name]; if(!b) return;
  const c = E.ctx, s = c.createBufferSource(), g = c.createGain();
  s.buffer = b; g.gain.value = v*(KIT[name]||0.5);
  if(name==='h' || name==='sh' || name==='sl') s.playbackRate.value = 0.97 + Math.random()*0.06;
  s.connect(g); g.connect(dest); s.start(t);
  track(E, s, [g], sfx, 'drum');
}
function playLead(E, dest, inst, m, t, dur, v, last, sfx){
  const c = E.ctx, o = c.createOscillator(), g = c.createGain();
  o.setPeriodicWave(E.waves[inst==='flute' ? 'flute' : inst==='sq' ? 'sq' : 'pulse']);
  const f = mtof(m);
  if(inst==='flute' && last && last.m!==m && Math.abs(t-last.end) < 0.03){
    o.frequency.setValueAtTime(mtof(last.m), t); o.frequency.exponentialRampToValueAtTime(f, t+0.06);
  } else {
    o.frequency.setValueAtTime(f, t);
    o.detune.setValueAtTime(inst==='flute' ? -20 : -35, t); o.detune.linearRampToValueAtTime(0, t+0.03);
  }
  const att = inst==='flute' ? 0.025 : 0.006, d = Math.max(0.06, dur*0.92);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+att);
  g.gain.setTargetAtTime(v*(inst==='flute'?0.85:0.62), t+att, 0.09);
  g.gain.setTargetAtTime(0, t+d, 0.03);
  o.connect(g); g.connect(dest);
  const nodes = [g];
  if(d > 0.26){
    const l = c.createOscillator(), lg = c.createGain();
    l.frequency.value = 5.4; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(inst==='flute'?16:11, t+Math.min(0.3, d*0.7));
    l.connect(lg); lg.connect(o.detune); l.start(t); l.stop(t+d+0.2); nodes.push(l, lg);
  }

  if(last){ last.m = m; last.end = t+dur; }
}
function playBass(E, dest, m, t, dur, v){
  const c = E.ctx, o = c.createOscillator(), g = c.createGain();
  o.setPeriodicWave(E.waves.bass);
  const f = mtof(m); o.frequency.setValueAtTime(f*1.025, t); o.frequency.exponentialRampToValueAtTime(f, t+0.035);
  const d = Math.max(0.06, dur*0.9);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+0.005);
  g.gain.setTargetAtTime(v*0.5, t+0.005, 0.1); g.gain.setTargetAtTime(0, t+d, 0.025);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+d+0.15);
  track(E, o, [g], 0, 'bass');

function playBrass(E, dest, ms, t, dur, v, sfx){
  const c = E.ctx, arr = Array.isArray(ms) ? ms : [ms];
  const flt = c.createBiquadFilter(), g = c.createGain();
  flt.type='lowpass'; flt.Q.value=1.2;
  const d = Math.max(0.08, dur*0.9), peakF = 900 + 2600*v;
  flt.frequency.setValueAtTime(350, t); flt.frequency.exponentialRampToValueAtTime(peakF, t+0.035); flt.frequency.setTargetAtTime(peakF*0.5, t+0.05, 0.12);
  const vv = v/Math.sqrt(arr.length)*0.55;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vv, t+0.015);
  g.gain.setTargetAtTime(vv*0.7, t+0.03, 0.15); g.gain.setTargetAtTime(0, t+d, 0.04);
  flt.connect(g); g.connect(dest);
  const oscs = [];
  const add = (m, det)=>{ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=det; o.connect(flt); o.start(t); o.stop(t+d+0.25); oscs.push(o); };
  for(let i=0;i<arr.length;i++) add(arr[i], i%2 ? 7 : -5);
  if(arr.length===1) add(arr[0], 9);
  track(E, oscs[0], [flt, g].concat(oscs.slice(1)), sfx, 'brass');
}
// 曲のイベントを鳴らす（楽器名 → 実装）。オフラインでは実際に渡った音を E.log に記録する（検証用）
function play(E, dest, c, inst, m, t, dur, v, P){
  if(E.log && inst!=='drum'){
    if(Array.isArray(m)){ for(const x of m) E.log.push({ c, m:x, d:dur }); } else E.log.push({ c, m, d:dur });
  }
  if(inst==='drum') return playDrum(E, dest, m, t, v);
  if(SAMPLED[inst]){
    if(Array.isArray(m)){ for(let i=0;i<m.length;i++) playSample(E, dest, inst, m[i], t+i*0.01, dur, v); return; }
    return playSample(E, dest, inst, m, t, dur, v);
  }
  switch(inst){
    case 'pulse': case 'sq': case 'flute': {
      const last = P ? (P.last[c] || (P.last[c] = { m:-1, end:-1 })) : null;
      if(Array.isArray(m)){ for(const x of m) playLead(E, dest, inst, x, t, dur, v*0.6, null); return; }
      return playLead(E, dest, inst, m, t, dur, v, last);
    }
    case 'bass': return playBass(E, dest, m, t, dur, v);
    case 'brass': return playBrass(E, dest, m, t, dur, v);
  }
}

//   メロディ：音階の度数。1..7（8=1', 9=2'）、' で1オクターブ上、, で下、b/# で半音。 - = のばす、. = 休み
//   コード：ローマ数字（大文字=長三和音、小文字=短三和音、o=減、7/M7/sus/add9、b で半音下げ）。1小節に "IV/V" で2つ
// =====================================================================================
const MODES = { major:[0,2,4,5,7,9,11], lydian:[0,2,4,6,7,9,11], mixo:[0,2,4,5,7,9,10] };
const ROMAN = ['i','ii','iii','iv','v','vi','vii'];
function parseDeg(tok){
  let i=0, acc=0;
  while(tok[i]==='b' || tok[i]==='#'){ acc += tok[i]==='b' ? -1 : 1; i++; }
  const d = tok.charCodeAt(i)-48; if(!(d>=1 && d<=9)) return null; i++;
  let oct = d>=8 ? 1 : 0;
  for(; i<tok.length; i++){ const ch=tok[i]; if(ch==="'") oct++; else if(ch===',') oct--; else return null; }
  return { acc, deg:(d-1)%7, oct };
}
function degSemi(p, mode, shift, noAcc){
  let deg = p.deg + (shift||0), oct = p.oct;
  while(deg<0){ deg+=7; oct--; } while(deg>6){ deg-=7; oct++; }
  return MODES[mode][deg] + (noAcc ? 0 : p.acc) + 12*oct;
}
function parseChord(tok, mode){
  let i=0, acc=0;
  while(tok[i]==='b' || tok[i]==='#'){ acc += tok[i]==='b' ? -1 : 1; i++; }
  let j=i; while(j<tok.length && 'IViv'.indexOf(tok[j])>=0) j++;
  const rn = tok.slice(i,j), deg = ROMAN.indexOf(rn.toLowerCase()); if(deg<0) return null;
  const up = rn===rn.toUpperCase(), rest = tok.slice(j);
  const dim = rest.indexOf('o')>=0;
  const tones = rest.indexOf('sus')>=0 ? [0,5,7] : dim ? [0,3,6] : [0, up?4:3, 7];
  if(rest.indexOf('M7')>=0) tones.push(11); else if(rest.indexOf('7')>=0) tones.push(dim?9:10);
  if(rest.indexOf('add9')>=0) tones.push(14);
  return { root: MODES[mode][deg]+acc, tones };
}
function voicing(S, ch, lo){
  const out = [];
  for(const t of ch.tones){ const pc = S.key + ch.root + t; out.push(lo + (((pc-lo)%12)+12)%12); }
  out.sort((a,b)=>a-b);
  return out;
}

function resolveSec(S, name, depth){
  const s = S.sec[name]; if(!s) return null;
  if(!s.from || (depth||0) > 4) return s;
  const base = resolveSec(S, s.from, (depth||0)+1) || {};
  const out = Object.assign({}, base, s); delete out.from;
  return out;
}
function splitBars(str){ return String(str).split('|'); }
const compiled = {};
function compileSong(name){
  if(compiled[name]) return compiled[name];
  const S = SONGS[name]; if(!S) return null;
  const spb = S.spb||4, bpb = S.bpb||4, SB = spb*bpb;
  const stepDur = 60/S.bpm/spb, beat = 60/S.bpm;
  const tpb = spb===3 ? SB : bpb*2, tokSteps = SB/tpb;     // 伴奏・ベースの1文字 = 8分
  const warn = [], steps = [], starts = [];
  const rnd = mulberry(hashStr(name));
  const push = (st, ev)=>{ (steps[st] || (steps[st] = [])).push(ev); };
  let total = 0;
  S.order.forEach((sn, oi)=>{
    const sec = resolveSec(S, sn);
    if(!sec){ warn.push(name+': no section '+sn); return; }
    const base = total; starts.push(base);
    // ---- コード
    const ctoks = sec.ch.split(/\s+/).filter((x)=> x && x!=='|');
    const bars = ctoks.length, n = bars*SB;
    const chordAt = new Array(n);
    ctoks.forEach((tk, b)=>{
      const parts = tk.split('/');
      parts.forEach((p, k)=>{
        let ch = parseChord(p, S.mode); if(!ch){ warn.push(name+'.'+sn+': bad chord '+p); ch = { root:0, tones:[0,4,7] }; }
        const a = b*SB + Math.round(k*SB/parts.length), z = b*SB + Math.round((k+1)*SB/parts.length);
        for(let s=a; s<z; s++) chordAt[s] = ch;
      });
    });
    // ---- メロディ
    const mres = sec.mres || S.mres || (spb===3 ? 3 : 2), per = spb/mres;
    const notes = [];
    if(sec.mel){
      const toks = [];
      for(const ph of sec.mel.split(/\s+/)){
        if(!ph) continue;
        const src = S.ph[ph]; if(src==null){ warn.push(name+'.'+sn+': no phrase '+ph); continue; }
        for(const t of src.split(/\s+/)) if(t && t!=='|') toks.push(t);
      }
      if(toks.length !== bars*bpb*mres) warn.push(name+'.'+sn+': melody has '+toks.length+' tokens, want '+(bars*bpb*mres));
      let cur = null;
      toks.forEach((tk, k)=>{
        const st = Math.round(k*per);
        if(tk==='-'){ if(cur) cur.d += per; }
        else if(tk==='.'){ cur = null; }
        else { const p = parseDeg(tk); if(!p){ warn.push(name+'.'+sn+': bad note '+tk); cur=null; return; }
          cur = { st, d:per, p, m: S.key + degSemi(p, S.mode) }; notes.push(cur); }
      });
      const li = sec.lead || S.lead || 'pulse';
      for(const nt of notes){
        if(nt.st >= n) continue;
        const acc = (nt.st % SB)===0 ? 0.92 : (nt.st % spb)===0 ? 0.84 : 0.76;

      }
    }
    // ---- 対旋律（m2）：fill=メロディのすき間に和音の分散、arp=ずっと分散、double=オクターブ上、third=3度下のハモり
    if(sec.m2){
      const [mode2, inst2, opt2] = sec.m2.split(':');
      if(mode2==='double'){ for(const nt of notes) push(base+nt.st, { c:'m2', i:inst2, m:nt.m+12, d:nt.d, v:0.5 }); }
      else if(mode2==='third'){ for(const nt of notes) push(base+nt.st, { c:'m2', i:inst2, m:S.key+degSemi(nt.p, S.mode, -2, true), d:nt.d, v:0.55 }); }
      else if(mode2==='fill' || mode2==='arp'){
        const slot = opt2==='16' ? 1 : (spb===3 ? 1 : 2);
        const lo = sec.m2lo || S.m2lo || (mode2==='fill' ? S.key+7 : S.key-5);
        const busy = new Uint8Array(n);
        for(const nt of notes){ const e = Math.min(n, nt.st + Math.min(nt.d, spb)); for(let s=nt.st; s<e; s++) busy[s]=1; }
        const emit = (s, k, v)=>{
          const ch = chordAt[s]; const vo = voicing(S, ch, lo); vo.push(vo[0]+12);
          const L = vo.length, per2 = 2*L-2, q = k % per2, idx = q < L ? q : per2-q;
          push(base+s, { c:'m2', i:inst2, m:vo[idx], d:slot, v });

        if(mode2==='arp'){ let k=0; for(let s=0; s<n; s+=slot){ emit(s, k++, 0.42 + ((s%spb)===0 ? 0.08 : 0)); } }

          let s = 0;

            if(busy[s]){ s += slot; continue; }
            let e = s; while(e < n && !busy[e]) e += slot;
            if((e-s)/slot >= 2){ let k=0; for(let q=s; q<e; q+=slot) emit(q, k++, 0.4+0.04*Math.min(k,4)); }
            s = e;
          }
        }
      }
    }
    // ---- 伴奏（コードの刻み）
    if(sec.comp){
      const cs = sec.comp.lastIndexOf(':');
      const pat = cs>=0 ? sec.comp.slice(0, cs) : sec.comp, inst3 = cs>=0 ? sec.comp.slice(cs+1) : 'uke';
      const lines = splitBars(COMP[pat] || pat);
      const lo = sec.chordLo || S.chordLo || COMP_LO[inst3] || 57;
      for(let b=0; b<bars; b++){
        const line = lines[b % lines.length];
        if(line.length !== tpb){ warn.push(name+'.'+sn+': comp line "'+line+'" must be '+tpb); continue; }
        let ak = 0;
        for(let j=0; j<tpb; j++){
          const ch = line[j]; if(ch==='.' || ch==='-') continue;
          let j2 = j+1; while(j2 < tpb && line[j2]==='-') j2++;
          const st = b*SB + j*tokSteps, d = (j2-j)*tokSteps;
          const vo = voicing(S, chordAt[st], lo);
          if(ch==='a'){ push(base+st, { c:'chord', i:inst3, m:vo[ak++ % vo.length], d, v:0.55 }); continue; }
          if(ch==='r'){ push(base+st, { c:'chord', i:inst3, m:vo[0], d, v:0.6 }); continue; }
          const up = ch==='u', v = ch==='X' ? 0.95 : up ? 0.5 : 0.72;
          const notesC = up ? vo.slice(-3).reverse() : vo;
          if(inst3==='brass'){ push(base+st, { c:'chord', i:inst3, m:notesC, d, v }); continue; }
          const gap = inst3==='uke' ? 0.012 : 0.004;
          notesC.forEach((m, k)=> push(base+st, { c:'chord', i:inst3, m, d, v: v*(k===0?1:0.85), o:k*gap }));
        }
      }
    }
    // ---- ベース
    if(sec.bass){
      const lines = splitBars(BASS[sec.bass] || sec.bass);
      const blo = S.bassLo || 45;
      const rootM = (ch)=> blo + ((((S.key + ch.root) - blo)%12)+12)%12;
      for(let b=0; b<bars; b++){
        const line = lines[b % lines.length];
        if(line.length !== tpb){ warn.push(name+'.'+sn+': bass line "'+line+'" must be '+tpb); continue; }
        for(let j=0; j<tpb; j++){
          const t = line[j]; if(t==='.' || t==='-') continue;
          let j2 = j+1; while(j2 < tpb && line[j2]==='-') j2++;
          const st = b*SB + j*tokSteps, d = (j2-j)*tokSteps, ch = chordAt[st], r = rootM(ch);
          let m = r;
          if(t==='5') m = r+7; else if(t==='O') m = r+12; else if(t==='3') m = r+ch.tones[1]; else if(t==='L') m = r-5;
          else if(t==='A'){
            let nx = chordAt[st+tokSteps] || chordAt[(b+1)*SB] || chordAt[0];
            if(nx===ch) nx = chordAt[(b+1)*SB] || chordAt[0];
            const nr = rootM(nx), pcBelow = ((((S.key + nx.root - 2) - S.key)%12)+12)%12;
            m = MODES[S.mode].indexOf(pcBelow)>=0 ? nr-2 : nr-1;
          }
          push(base+st, { c:'bass', i:'bass', m, d, v: j===0 ? 0.95 : 0.8 });
        }
      }
    }
    // ---- ドラム（区間の最終小節はフィル）
    if(sec.drum){
      const ds = typeof sec.drum === 'object' ? sec.drum : DRUMS[sec.drum];
      if(!ds) warn.push(name+'.'+sn+': no drum style '+sec.drum);
      else {
        const insts = Object.keys(ds).filter((k)=> k!=='fill');
        if(ds.fill) for(const k in ds.fill) if(insts.indexOf(k)<0) insts.push(k);
        for(let b=0; b<bars; b++){
          const isFill = b===bars-1 && sec.fill!==false && ds.fill;
          for(const k of insts){
            let src = (isFill && ds.fill[k]!=null) ? ds.fill[k] : ds[k];
            if(src==null) continue;
            const lines = splitBars(src), line = lines[b % lines.length];
            if(line.length !== SB){ warn.push(name+'.'+sn+': drum '+k+' line must be '+SB); continue; }
            for(let j=0; j<SB; j++){
              const ch = line[j], v = ch==='X' ? 1 : ch==='x' ? 0.72 : ch==='o' ? 0.42 : 0;
              if(v) push(base + b*SB + j, { c:'drum', i:'drum', m:k, d:1, v: v*(0.94+rnd()*0.1) });
            }
          }
        }
      }
      if(sec.crash!==false) push(base, { c:'drum', i:'drum', m:'cr', d:1, v:0.75 });
    }
    // ---- 区間の終わりのグリッサンド（鉄琴でキラキラ駆け上がる）
    if(sec.gl){

      for(let k=0; k<8; k++){

        push(base+st, { c:'fx', i:sec.glInst||'glock', m: S.key + degSemi({ acc:0, deg:dg%7, oct:Math.floor(dg/7) }, S.mode), d:1, v:0.3+0.04*k, o:k*beat/8 });
      }
    }
    total += n;
  });
  const out = { name, S, spb, bpb, stepDur, L: total, loopStart: starts[S.loopFrom||0]||0, steps, warn,
    loop: S.loop!==false, swing: S.swing||0, bars: total/SB };
  compiled[name] = out;
  return out;
}
