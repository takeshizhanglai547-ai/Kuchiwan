; ============================================================================
;  OVERBURST — engine configuration.
;
;  Renderer settings here implement ART_DIRECTION.md section 5 (post) and the
;  lighting brief in section 2. Anything that is per-shot rather than
;  per-project (vignette, grain, chromatic aberration, the assault-boost FOV
;  ramp) is set in C++ on the pawn's camera instead, because those values are
;  driven by gameplay state and an .ini cannot be.
;
;  NOTHING IN THIS FILE IS GAMEPLAY TUNING. Every gameplay number lives in
;  ObCore/Public/ObConfig.h, which mirrors the web build 1:1.
; ============================================================================

[/Script/EngineSettings.GameMapsSettings]
; C++ classes, so the project boots with no Blueprint assets to import.
GlobalDefaultGameMode=/Script/OverburstUE.ObGameMode
GameInstanceClass=/Script/Engine.GameInstance
; GameDefaultMap / EditorStartupMap are deliberately left at the engine
; defaults. AObGameMode builds the arena procedurally at BeginPlay, so an
; EMPTY level is a playable level — see unreal/README.md.

[/Script/Engine.RendererSettings]
; --- global illumination -----------------------------------------------
; Lumen. The arena is lit by one low warm key plus a lot of local emissive
; (furnace mouths, molten channels, booster throats); baked lighting cannot
; carry that and the mech has to pick up bounce as it moves through it.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Shadow.Virtual.Enable=1

; --- anti-aliasing -----------------------------------------------------
; 0=None 1=FXAA 2=TAA 3=MSAA 4=TSR. TSR, because the frame is full of 1px
; chamfer highlights and thin HUD strokes and TAA smears both while moving.
r.AntiAliasingMethod=4

; --- tone mapping and exposure -----------------------------------------
; ACES is the UE default. Auto-exposure is OFF on purpose: the art direction
; asks for high contrast with deep shadow, and an auto-exposure that lifts the
; shadows every time the player looks into one destroys exactly that.
; Exposure is pinned in C++ (AObMechPawn's post-process defaults, ~1.05 EV).
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

; --- post ---------------------------------------------------------------
; Bloom on, but the threshold is raised in C++ so only genuinely emissive
; things glow. "Bloom smeared over everything" is an explicit anti-goal.
r.DefaultFeature.Bloom=True
r.DefaultFeature.LensFlare=False
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False

; Custom depth with stencil: the HUD's target framing and the lock-on
; silhouette read from it. 3 = enabled with stencil.
r.CustomDepth=3

; Emissive-heavy scene, so give the bloom something clean to work from.
r.Tonemapper.Quality=5
r.Filter.SizeScale=1.0

; Sharp contact shadows off the low key rake — this is what makes the
; chamfers and the plate gaps read at 20-40 m.
r.ContactShadows=1

[/Script/Engine.PhysicsSettings]
; ObCore integrates the MECH with cfg::Player::Gravity = 68 m/s^2 and never
; consults this value. It is matched here so that debris, ragdolls and any
; other rigid body the engine simulates fall at the same rate the mech does —
; a 9.8 m/s^2 chunk of wreckage next to a 68 m/s^2 mech reads as slow motion.
; 68 m/s^2 * 100 uu/m = 6800 uu/s^2.
DefaultGravityZ=-6800.000000
DefaultTerminalVelocity=15500.000000
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6

[/Script/Engine.CollisionProfile]
; ------------------------------------------------------------------------
;  Trace channels. FObWorldQueryUE — the ONLY implementation of ObCore's
;  IWorldQuery — issues every one of its traces on ObWorldTrace, so world
;  geometry is decided by one channel that gameplay code cannot accidentally
;  widen. Hit volumes for damage are ObCore's capsules, NOT engine collision;
;  ObTargetTrace exists only for editor picking and the HUD's lock cursor.
;
;  VERIFY THESE IN Project Settings -> Collision AFTER FIRST OPEN. Custom
;  channel .ini syntax is unforgiving and a mistyped entry fails silently:
;  the channel simply does not appear and every trace on it returns nothing,
;  which presents as "the mech falls through the floor" rather than as an
;  error.
; ------------------------------------------------------------------------
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="ObWorldTrace")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="ObTargetTrace")

+Profiles=(Name="ObWorld",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="WorldStatic",CustomResponses=((Channel="ObWorldTrace",Response=ECR_Block),(Channel="ObTargetTrace",Response=ECR_Ignore)),HelpMessage="Arena geometry. Blocks ObWorldTrace: this is what the mech collides with.")
+Profiles=(Name="ObMech",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="Pawn",CustomResponses=((Channel="ObWorldTrace",Response=ECR_Ignore),(Channel="ObTargetTrace",Response=ECR_Block),(Channel="Visibility",Response=ECR_Block)),HelpMessage="Player and hostile mech capsules. IGNORES ObWorldTrace so a mech never sweeps against itself or another mech - ObCore resolves mech-vs-mech, not the engine.")
+Profiles=(Name="ObProjectileVisual",CollisionEnabled=NoCollision,bCanModify=True,ObjectTypeName="WorldDynamic",HelpMessage="Projectile actors are VISUALS ONLY. Every intersection they represent was already decided by ObBallistics' swept segments; engine collision on them would double-resolve.")

[/Script/Engine.Engine]
; The mech reaches 146 m/s under assault boost and the arena is 500 m across.
; Default near/far and a 0.1 s frame clamp inside ObCore make hitching safe;
; this keeps the engine from also fighting it.
NearClipPlane=10.000000

[/Script/Engine.UserInterfaceSettings]
; The HUD is drawn with 1px strokes at a 1920x1080 authoring resolution and
; must not be blurred by DPI scaling on a 4K panel.
RenderFocusRule=Never
ApplicationScale=1.000000

[/Script/Engine.GarbageCollectionSettings]
; Projectiles are pooled and enemies are recycled, so the steady-state
; allocation rate is near zero; a long GC interval keeps the frame flat.
gc.TimeBetweenPurgingPendingKillObjects=120
gc.MaxObjectsInGame=2162688
