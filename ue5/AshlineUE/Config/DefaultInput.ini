; =============================================================================
; DefaultInput.ini — ASHLINE（PC版：ゲームパッドとキーボード＋マウスの両対応）
;
; 実際のキー割り当ては、このファイルではなく Enhanced Input のアセット
; （IMC_Ashline と IA_*）に入る。それらはエディタでしか作れないため、
; 何をどこに割り当てるかは ue5/RUNBOOK.md の手順4に表で書いてある。
;
; ここに書くのは「入力の土台をEnhanced Inputにする」設定と、
; マウスの生の値をゲームの回転量として素直に扱うための設定だけ。
; =============================================================================

[/Script/Engine.InputSettings]
; 入力の受け口を Enhanced Input にする。この2行が無いと、
; AshlinePlayerPawn::SetupPlayerInputComponent が
; 「EnhancedInputComponent ではありません」とエラーを出して無反応になる。
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; マウスの平滑化と加速はエンジン側で切る。
; 理由：視点感度の加速カーブはコア（Web版と同じ式）が持っている。
; エンジン側でも掛けると二重になり、Web版と手触りが合わなくなる。
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; 視点操作中にカーソルが画面外へ出ないようにする。
bAlwaysShowTouchInterface=False
bUseMouseForTouch=False
