<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1b1033">
  <title>イッヌ大作戦 - ダークワンワン大帝を倒せ！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-box">
          <span class="hud-label">HP</span>
          <div class="hp-bar"><div id="hp-fill" class="hp-fill"></div></div>
        </div>
        <div class="hud-box">
          <span class="hud-label">🦴</span>
          <span id="bomb-count" class="hud-val">3</span>
        </div>
        <div class="hud-box">
          <span class="hud-label">SCORE</span>
          <span id="score-val" class="hud-val">0</span>
        </div>
      </div>
      <div id="boss-hud" class="hidden">
        <div class="boss-name">ダークワンワン大帝</div>
        <div class="boss-bar"><div id="boss-fill" class="boss-fill"></div></div>
      </div>
      <div id="announce"></div>
    </div>

    <!-- Touch controls -->
    <div id="touch-controls" class="hidden">
      <div id="pad-left">
        <div class="dpad8">
          <button class="tbtn dpad-btn" data-dir="upLeft">↖</button>
          <button class="tbtn dpad-btn" data-dir="up">↑</button>
          <button class="tbtn dpad-btn" data-dir="upRight">↗</button>
          <button class="tbtn dpad-btn" data-dir="left">←</button>
          <div class="dpad-center">8</div>
          <button class="tbtn dpad-btn" data-dir="right">→</button>
          <button class="tbtn dpad-btn" data-dir="downLeft">↙</button>
          <button class="tbtn dpad-btn" data-dir="down">↓</button>
          <button class="tbtn dpad-btn" data-dir="downRight">↘</button>
        </div>
      </div>
      <div id="pad-right">
        <button class="tbtn btn-melee" data-key="melee">噛</button>
        <button class="tbtn btn-jump"  data-key="jump">跳</button>
        <button class="tbtn btn-bomb"  data-key="bomb">🦴</button>
        <button class="tbtn btn-shoot" data-key="shoot">撃</button>
      </div>
    </div>

    <!-- Title screen -->
    <div id="title-screen">
      <div class="title-deco">★ ACTION SHOOTING ★</div>
      <h1 class="title-main">イッヌ大作戦</h1>
      <div class="title-sub">〜ダークワンワン大帝を倒せ！〜</div>
      <div class="title-story">
        ワンワン王国を支配する暗黒の帝王<br>
        <b>ダークワンワン大帝</b> に立ち向かうのは<br>
        伝説のイッヌ戦士、ただ一匹！
      </div>
      <div class="controls-help">
        <div class="help-row"><b>PC:</b> ← → 移動 ／ ↑↓ 照準 ／ Z or Space ジャンプ</div>
        <div class="help-row">　　　 X 射撃 ／ V 噛みつき ／ C ボム</div>
        <div class="help-row"><b>スマホ:</b> 左 8方向ボタン（斜めも押せる）／ 右 噛・跳・🦴・撃</div>
        <div class="help-row" style="color:#ffde59">↗↘↖↙ で <b>斜め射撃</b> ／ 緑ボタンで噛みつき</div>
      </div>
      <button id="start-btn">▶ スタート</button>
    </div>

    <!-- Result screen -->
    <div id="result-screen" class="hidden">
      <div id="result-title" class="result-title"></div>
      <div id="result-score" class="result-score"></div>
      <button id="retry-btn">もう一度</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
