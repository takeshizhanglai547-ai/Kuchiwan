<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>聖犬士イッヌ - ベルトアクション</title>
<!-- build: 2周目「蟲の世界」＋タイトル2周目トグル同梱版 -->

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#05060a; overflow:hidden;
    font-family:'Trebuchet MS','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    color:#fff; user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; background:#000; box-shadow:0 0 60px rgba(0,0,0,.8); max-width:100%; max-height:100%; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; z-index:20; padding:20px;
    background:radial-gradient(ellipse at center, rgba(20,12,40,.55), rgba(0,0,0,.9)); }
  .hidden { display:none !important; }
  /* タイトルは背後の豪華な演出を活かすため、オーバーレイを控えめに */
  #start.overlay { background:radial-gradient(ellipse at center 38%, rgba(10,6,26,.30), rgba(3,2,10,.72) 78%); }
  #start .title-main { text-shadow:0 4px 0 rgba(120,60,0,.5), 0 0 22px rgba(255,180,40,.6); }
  #start .title-jp { text-shadow:0 0 10px #ff8a00, 0 2px 6px #000; }
  .title-sub { font-size:14px; letter-spacing:6px; color:#ffd34d; text-shadow:0 0 8px #b8860b; }
  .title-main { font-size:clamp(38px,9vw,84px); font-weight:900; letter-spacing:4px;
    background:linear-gradient(180deg,#fff6d0,#ffcf3a 55%,#c8881a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 0 rgba(120,60,0,.4); margin:4px 0; }
  .title-jp { font-size:clamp(16px,4vw,28px); color:#fff; letter-spacing:8px;
    text-shadow:0 0 10px #ff8a00; margin-bottom:14px; }
  .btn { margin-top:12px; padding:13px 38px; font-size:20px; font-weight:800; letter-spacing:3px;
    color:#3a1d00; cursor:pointer; border-radius:10px;
    background:linear-gradient(180deg,#ffe98a,#ffb02e); border:2px solid #fff3c0;
    box-shadow:0 6px 0 #9c5a00,0 10px 20px rgba(0,0,0,.5); transition:transform .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #9c5a00; }
  .moves { margin-top:16px; font-size:12.5px; color:#dfeaff; line-height:1.7; max-width:600px; text-align:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,210,80,.25); border-radius:10px; padding:9px 16px; }
  .moves h3 { color:#ffd34d; letter-spacing:3px; margin-bottom:6px; font-size:13px; }
  .moves b { color:#7fd0ff; } .moves .cmd { color:#ff9a3a; font-weight:800; }
  #result-title { font-size:clamp(34px,8vw,70px); font-weight:900; letter-spacing:6px; }
  #result-sub { font-size:18px; margin-top:10px; color:#ffd34d; letter-spacing:2px; }

  /* sound toggle */
  #snd { position:absolute; top:10px; right:10px; z-index:25; width:42px; height:42px; border-radius:50%;
    background:rgba(8,10,20,.6); border:2px solid rgba(255,210,80,.6); color:#ffd34d; font-size:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }

  /* touch */
  #touch { position:absolute; inset:0; z-index:15; pointer-events:none; display:none; }
  .stk { position:absolute; border-radius:50%; background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.18); pointer-events:auto; }
  .stk .nub { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px;
    border-radius:50%; background:rgba(255,255,255,.26); border:2px solid rgba(255,255,255,.85); }
  #stick  { left:20px;  bottom:24px; width:140px; height:140px; }
  #stick2 { right:20px; bottom:24px; width:140px; height:140px; display:none; }
  .tbtn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center;
    justify-content:center; font-size:15px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000;
    border:3px solid rgba(255,255,255,.55); text-align:center; line-height:1.1;
    box-shadow:0 3px 10px rgba(0,0,0,.4); }
  .p2 { display:none; }
  .bA { background:rgba(255,80,40,.62); }  .bGr { background:rgba(170,90,235,.6); }
  .bJ { background:rgba(90,200,120,.6); }  .bD { background:rgba(60,140,255,.62); }
  /* 1P spacious layout */
  #bAtk  { right:118px; bottom:34px;  width:92px; height:92px; font-size:18px; }
  #bGrab { right:34px;  bottom:30px;  width:78px; height:78px; }
  #bJmp  { right:42px;  bottom:118px; width:74px; height:74px; }
  #bGrd  { right:142px; bottom:140px; width:72px; height:72px; }
  /* 2P split: P1 left cluster, P2 right cluster */
  #touch.twop #stick  { left:8px;  bottom:8px; width:128px; height:128px; }
  #touch.twop #stick2 { display:block; right:8px; bottom:8px; width:128px; height:128px; }
  #touch.twop .p2 { display:flex; }
  #touch.twop .tbtn { font-size:14px; }
  #touch.twop #bAtk { left:118px; right:auto; bottom:10px;  width:62px; height:62px; font-size:15px; }
  #touch.twop #bJmp { left:184px; right:auto; bottom:10px;  width:58px; height:58px; }
  #touch.twop #bGrd { left:118px; right:auto; bottom:76px;  width:58px; height:58px; }
  #touch.twop #bGrab{ left:184px; right:auto; bottom:76px;  width:58px; height:58px; }
  #bAtk2 { right:118px; bottom:10px; width:62px; height:62px; font-size:15px; }
  #bJmp2 { right:184px; bottom:10px; width:58px; height:58px; }
  #bGrd2 { right:118px; bottom:76px; width:58px; height:58px; }
  #bGrab2{ right:184px; bottom:76px; width:58px; height:58px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="snd">♪</div>

  <div id="start" class="overlay">
    <div class="title-sub">ARCADE BELT ACTION</div>
    <div class="title-main">聖犬士イッヌ</div>
    <div class="title-jp">〜 ワンワン帝国の野望 〜</div>
    <button id="continueBtn" class="btn hidden" style="background:linear-gradient(180deg,#7dd0ff,#3a8ad0)">▶ つづきから</button>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="startBtn" class="btn">▶ 1P イッヌ</button>
      <button id="startShimaBtn" class="btn" style="background:linear-gradient(180deg,#e0b07a,#b07a44)">▶ 1P シマダックス</button>
      <button id="startNukoBtn" class="btn" style="background:linear-gradient(180deg,#ffb0e0,#c060a8)">▶ 1P ヌコ</button>
      <button id="startG8Btn" class="btn" style="background:linear-gradient(180deg,#e0a45f,#a05a22)">▶ 1P ガードワン8号</button>
      <button id="startWatchBtn" class="btn" style="background:linear-gradient(180deg,#eef2f7,#aab6c4);color:#2a3038">▶ 1P 盗賊ワッチ</button>
      <button id="startWandenBtn" class="btn" style="background:linear-gradient(180deg,#e8dcb4,#8a2a24);color:#2a1a10">▶ 1P 剣鬼ワンデン</button>
      <button id="start2Btn" class="btn" style="background:linear-gradient(180deg,#ffd08a,#ff8e2e)">▶ 2P CO-OP</button>
    </div>
    <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="hardBtn" class="btn" style="font-size:15px;height:auto;padding:8px 18px;background:linear-gradient(180deg,#3a3f4a,#20242c);border-color:rgba(255,120,90,.6);color:#ff9a7a">高難易度モード：OFF</button>
      <button id="ng2SelBtn" class="btn" style="font-size:15px;height:auto;padding:8px 18px;background:linear-gradient(180deg,#3a3f4a,#20242c);border-color:rgba(140,230,110,.6);color:#a0e87a">周回スタート：1周目</button>
    </div>
    <div class="moves">
      移動 <b>矢印/WASD</b>　攻撃 <b>J/F</b>　ジャンプ <b>Space/V</b>　回避 <b>K/G</b>　掴み <b>L/H</b>（<span class="cmd">NPCの前で＝会話</span>）　　<span style="opacity:.7">スマホは画面の操作パッドで</span>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="ng2Btn" class="btn hidden" style="background:linear-gradient(180deg,#a0e87a,#4a9a34);color:#12300a">▶ 2周目「蟲の世界」へ</button>
      <button id="resumeBtn" class="btn hidden" style="background:linear-gradient(180deg,#7dd0ff,#3a8ad0)">▶ ステージ再開</button>
      <button id="retryBtn" class="btn">▶ 最初から</button>
    </div>
  </div>

  <div id="touch">
    <div id="stick" class="stk"><div class="nub"></div></div>
    <div id="bAtk"  class="tbtn bA">攻</div>
    <div id="bGrab" class="tbtn bGr">掴</div>
    <div id="bJmp"  class="tbtn bJ">跳</div>
    <div id="bGrd"  class="tbtn bD">回避</div>
    <div id="stick2" class="stk p2"><div class="nub"></div></div>
    <div id="bAtk2"  class="tbtn bA p2">攻</div>
    <div id="bGrab2" class="tbtn bGr p2">掴</div>
    <div id="bJmp2"  class="tbtn bJ p2">跳</div>
    <div id="bGrd2"  class="tbtn bD p2">回避</div>
  </div>
</div>

<script>
"use strict";
//======================================================================
//  聖犬士イッヌ  -  belt-scroll beat 'em up  (enhanced edition)
//  - procedural BGM (battle / boss / jingles)
//  - higher-fidelity shaded rendering
//  - 4-hit combo + charge + command moves (dash slash / rising slash)
//======================================================================
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const W = 960, H = 540;                    // logical resolution（フル解像度で直接描画）

// hi-dpi crisp backing store
let DPR = Math.min(window.devicePixelRatio||1, 2);   // 負荷対策：内部解像度はDPR2まで（見た目はほぼ同等）
function setupCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
setupCanvas();

const GROUND_TOP = 372, GROUND_BOT = 516; let WORLD_END = 18400;
const LANE = 488, FIXED_SCALE = 1.82;     // single-plane brawler — larger sprites
const RISE_CEIL = 320;                     // 上昇技（昇竜など）の最高到達点＝画面天井。これ以上は上がらない
const CEIL_Z = 408;                        // ceiling height (juggle bounces off the top of the screen)

let state='title', camX=0, score=0, coins=0;
let shake=0, hitStop=0, flash=0, bossIntro=0, goArrow=0, gf=0, quake=0; // gf = global frame
let slowmo=0, slowAcc=0, stage=1, stageBanner=0, stageBannerTxt='', shopPending=0;
let cut=null, cutAdvance=false, cutSkip=false, endingDone=false;   // cutscene state
let lap=1;                       // 周回（1=一周目 2=二周目・蟲の世界）
let mercRoster=[], mercs=[];     // 傭兵：雇用リスト（周回・ステージをまたいで持続）と場に出ている実体
function triggerSlow(n){ slowmo=Math.max(slowmo,n); }

//======================================================================
//  Input  (per-player; globals point to the player currently being simulated)
//======================================================================
let keys, K, pressed, dirTaps, cardSeq, downTaps, stickRot;
function makeInput(){ return { keys:{},
  K:{left:false,right:false,up:false,down:false,atk:false,grd:false,grab:false},
  pressed:{atk:false,grab:false,up:false,jump:false,grd:false}, dirTaps:[], cardSeq:[], downTaps:[], stickRot:-999 }; }
function useInput(inp){ keys=inp.keys; K=inp.K; pressed=inp.pressed; dirTaps=inp.dirTaps; cardSeq=inp.cardSeq; downTaps=inp.downTaps; stickRot=inp.stickRot; }
function saveInput(inp){ inp.stickRot=stickRot; }
// key bindings per player (1P: arrows + JKL/space, 2P: WASD + F G H V)
const KEYMAP=[
  { left:['ArrowLeft'], right:['ArrowRight'], up:['ArrowUp'], down:['ArrowDown'],
    atk:['KeyJ','KeyZ'], grd:['KeyK','KeyX'], grab:['KeyL','KeyU','ShiftLeft','ShiftRight'], jump:['Space','KeyI'] },
  { left:['KeyA'], right:['KeyD'], up:['KeyW'], down:['KeyS'],
    atk:['KeyF'], grd:['KeyG'], grab:['KeyH'], jump:['KeyV','KeyB'] },
];
const CODE2PA={}; KEYMAP.forEach((m,pi)=>{ for(const act in m) m[act].forEach(c=>CODE2PA[c]=[pi,act]); });
function mapKeysFor(pi){ const m=KEYMAP[pi], inp=players[pi].in, k=inp.keys, KK=inp.K;
  KK.left=m.left.some(c=>k[c])||k['_l'];
  KK.right=m.right.some(c=>k[c])||k['_r'];
  KK.up=m.up.some(c=>k[c])||k['_u']||k['_up'];
  KK.down=m.down.some(c=>k[c])||k['_d'];
  KK.atk=m.atk.some(c=>k[c])||k['_atk'];
  KK.grd=m.grd.some(c=>k[c])||k['_grd'];
  KK.grab=m.grab.some(c=>k[c])||k['_grab'];
}
function pushTapFor(inp,d){ inp.dirTaps.push({d,f:gf}); if(inp.dirTaps.length>6) inp.dirTaps.shift(); }
function pushCardFor(inp,c){ const L=inp.cardSeq[inp.cardSeq.length-1]; if(L&&L.c===c){ L.f=gf; return; } inp.cardSeq.push({c,f:gf}); if(inp.cardSeq.length>8)inp.cardSeq.shift(); }
addEventListener('keydown',e=>{
  if(state==='cut'){ if(e.code==='Escape'||e.code==='KeyK') cutSkip=true; else cutAdvance=true; e.preventDefault(); return; }
  if(e.code==='KeyP'&&(state==='play'||state==='pause')){ togglePause(); return; }
  const pa=CODE2PA[e.code]; if(!pa) return; const [pi,act]=pa; const inp=players[pi].in;
  if(!inp.keys[e.code]){ inp.keys[e.code]=true; mapKeysFor(pi);
    if(act==='atk') inp.pressed.atk=true; if(act==='grab') inp.pressed.grab=true; if(act==='jump') inp.pressed.jump=true; if(act==='grd') inp.pressed.grd=true;
    if(act==='up') pushCardFor(inp,0); else if(act==='right'){ pushTapFor(inp,1); pushCardFor(inp,1); }
    else if(act==='down'){ pushCardFor(inp,2); inp.downTaps.push(gf); if(inp.downTaps.length>4)inp.downTaps.shift(); }
    else if(act==='left'){ pushTapFor(inp,-1); pushCardFor(inp,3); }
  }
  e.preventDefault();
});
addEventListener('keyup',e=>{ const pa=CODE2PA[e.code]; if(!pa) return; const [pi]=pa; players[pi].in.keys[e.code]=false; mapKeysFor(pi); });
// command detection (operate on the active player's globals)
function stingerReady(facing){ const want=facing>0?1:3, back=facing>0?3:1;
  const r=cardSeq.filter(t=>gf-t.f<=18);
  for(let i=r.length-1;i>=1;i--){ if(r[i].c===want && gf-r[i].f<=10){ for(let j=i-1;j>=0;j--){ if(r[j].c===back) return true; } } }
  return false; }
function rotationReady(){ if(gf-stickRot<=12) return true;
  const r=cardSeq.filter(t=>gf-t.f<=44); if(r.length<4) return false;
  for(let i=r.length-1;i>=3;i--){ const a=r[i-3].c,b=r[i-2].c,c=r[i-1].c,d=r[i].c;
    const cw=(b===(a+1)%4)&&(c===(b+1)%4)&&(d===(c+1)%4);
    const ccw=(b===(a+3)%4)&&(c===(b+3)%4)&&(d===(c+3)%4);
    if(cw||ccw) return true; }
  return false; }
function consumeCmd(){ cardSeq.length=0; dirTaps.length=0; downTaps.length=0; stickRot=-999; }
// ↓↑コマンド（下→上＋攻撃）：下から上へ入力して地面必殺を発動。
// 上を押した状態で攻撃すればよく、猶予は広め（下→上→少し遅れて攻撃でも出る）
function downUpReady(){ if(!K.up) return false;                       // 攻撃時に「上」を押していること＝↑パート
  const r=cardSeq;
  let upIdx=-1; for(let i=r.length-1;i>=0;i--){ if(r[i].c===0){ upIdx=i; break; } }   // 直近の「上」入力
  if(upIdx<0 || gf-r[upIdx].f>34) return false;                      // 上入力から約0.57秒以内
  for(let j=upIdx-1;j>=0;j--){ if(r[j].c===2 && r[upIdx].f-r[j].f<=30) return true; }  // その直前に「下」入力
  return false; }
// 波動拳コマンド（↓→＋攻撃）：下→前 の順入力
function hadokenReady(facing){ const fwdC=facing>0?1:3;
  const r=cardSeq.filter(t=>gf-t.f<=28);
  for(let i=r.length-1;i>=1;i--){ if(r[i].c===fwdC && gf-r[i].f<=9){
    for(let j=i-1;j>=0;j--){ if(r[j].c===2 && r[i].f-r[j].f<=20) return true; } } }
  return false; }
// 昇竜拳コマンド（→↓→＋攻撃）：前→下→前 の順入力
function dpReady(facing){ const fwdC=facing>0?1:3;
  const r=cardSeq.filter(t=>gf-t.f<=40);
  for(let i=r.length-1;i>=2;i--){ if(r[i].c===fwdC && gf-r[i].f<=9){
    for(let j=i-1;j>=1;j--){ if(r[j].c===2 && r[i].f-r[j].f<=20){
      for(let k=j-1;k>=0;k--){ if(r[k].c===fwdC && r[j].f-r[k].f<=20) return true; } } } } }
  return false; }

//======================================================================
//  AUDIO  -  procedural SFX + BGM engine
//======================================================================
let actx=null, sndOn=true, masterGain=null, musicGain=null, sfxGain=null, noiseBuf=null;
function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=actx.createGain(); masterGain.gain.value=0.95;
  // master bus compressor — glue + loudness so impacts punch hard without nasty clipping
  const comp=actx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=4; comp.attack.value=0.002; comp.release.value=0.16;
  masterGain.connect(comp); comp.connect(actx.destination);
  musicGain=actx.createGain(); musicGain.gain.value=0.55; musicGain.connect(masterGain);
  sfxGain=actx.createGain(); sfxGain.gain.value=1.0; sfxGain.connect(masterGain);
  // spacious reverb send for the orchestral BGM (feedback-delay "hall")
  const verb=actx.createGain(); verb.gain.value=0.42;
  const dl=actx.createDelay(0.6); dl.delayTime.value=0.16;
  const fb=actx.createGain(); fb.gain.value=0.4;
  const damp=actx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2600;
  musicGain.connect(verb); verb.connect(dl); dl.connect(damp); damp.connect(fb); fb.connect(dl); damp.connect(masterGain);
  // noise buffer for drums/impacts
  noiseBuf=actx.createBuffer(1, actx.sampleRate*0.4, actx.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
// iOS/Safari need the context resumed AND a sound started *synchronously* inside a user gesture.
function unlockAudio(){
  try{ initAudio(); }catch(e){ return; }
  if(!actx) return;
  if(actx.state!=='running'){ const r=actx.resume&&actx.resume(); if(r&&r.then)r.catch(()=>{}); }
  try{ const b=actx.createBufferSource(); b.buffer=actx.createBuffer(1,1,22050); b.connect(actx.destination); b.start(0); }catch(e){}
  if(sndOn && !Music.isPlaying()){ if(state==='play') Music.start('battle'); else if(state==='title') Music.start('title'); }
}
['touchstart','touchend','pointerdown','mousedown','keydown','click'].forEach(ev=>
  addEventListener(ev, unlockAudio, {passive:true}));
const midi=n=>440*Math.pow(2,(n-69)/12);
function tone(freq,dur,type='square',vol=.15,slide=0,dest=null){
  if(!actx||!sndOn) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),actx.currentTime+dur);
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(); o.stop(actx.currentTime+dur);
}
function noise(dur,vol,hp,dest){
  if(!actx||!sndOn) return;
  const s=actx.createBufferSource(); s.buffer=noiseBuf;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  const f=actx.createBiquadFilter(); f.type=hp?'highpass':'lowpass'; f.frequency.value=hp||1200;
  s.connect(f); f.connect(g); g.connect(dest||sfxGain); s.start(); s.stop(actx.currentTime+dur);
}
const sfx={
  swing:(p=0)=>tone(560-p*40,.09,'square',.09,-260),
  heavy:()=>{tone(300,.16,'sawtooth',.12,-180); noise(.12,.18,2000);},

// ---- 命中音 = 派手な「バキーン！」（金属クラング＋鳴り）＋「ドカーン！」（爆発ブーム）----
function hitSound(dmg){
  if(!actx||!sndOn) return;
  const t=actx.currentTime, tier=dmg>=30?3:dmg>=18?2:dmg>=10?1:0, V=0.7+tier*0.22;
  // ── バ：弾けるアタック・クラック ──
  { const s=actx.createBufferSource(); s.buffer=noiseBuf; const g=actx.createGain();
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.7;
    g.gain.setValueAtTime(V*1.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    s.connect(bp); bp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+0.08); }
  // ── キーン：明るい金属クラング（倍音を少しデチューンして煌めく鳴り）──
  const parts=[1320,1980,2640,3560,4900,6600,8800], pv=[1,0.82,0.68,0.55,0.42,0.3,0.2];
  parts.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
    o.type=i<3?'triangle':'sawtooth'; const det=1+(i%2?0.006:-0.005);
    o.frequency.setValueAtTime(f*det,t); o.frequency.exponentialRampToValueAtTime(f*0.93,t+0.34+tier*0.05);
    g.gain.setValueAtTime(V*0.34*pv[i],t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.34+tier*0.12);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.5); });
  // ── ン：きらめく上昇スイープ（シャキーンの閃き）──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(2600+tier*500,t); o.frequency.exponentialRampToValueAtTime(9000+tier*1500,t+0.12);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(V*0.34,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=6000; bp.Q.value=1.1; o.connect(bp); bp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.24); }
  // ── ド：パンチの効いた中域ボディ ──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.setValueAtTime(180-tier*24,t); o.frequency.exponentialRampToValueAtTime(54-tier*6,t+0.1);
    g.gain.setValueAtTime(V*0.66,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22+tier*0.05);
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500; o.connect(lp); lp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.34); }
  // ── カーン／ドカーン：深く長い爆発サブ・ブーム ──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime([86,72,58,46][tier],t); o.frequency.exponentialRampToValueAtTime([42,34,27,21][tier],t+0.4);
    g.gain.setValueAtTime(V*0.95,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55+tier*0.16);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.8); }
  // ── 強打（tier2以上）には轟くノイズ爆発を追加：ドッカーン！──
  if(tier>=2){ const s=actx.createBufferSource(); s.buffer=noiseBuf; const g=actx.createGain();
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(1400,t); lp.frequency.exponentialRampToValueAtTime(300,t+0.4);
    g.gain.setValueAtTime(V*0.7,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45+tier*0.1);
    s.connect(lp); lp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+0.6); }
}

// ---- 被弾音 = 重厚な「ドゴォッ…！」（鈍い衝撃＋胸に響く重低音＋歪んだクラック）----
function hurtSound(dmg){
  if(!actx||!sndOn) return;
  const t=actx.currentTime, tier=dmg>=30?2:dmg>=15?1:0, V=0.8+tier*0.25;
  // ── ドッ：鈍いボディブロー（沈み込むローパスノイズの塊）──
  { const s=actx.createBufferSource(); s.buffer=noiseBuf; const g=actx.createGain();
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(900,t); lp.frequency.exponentialRampToValueAtTime(180,t+0.22);
    g.gain.setValueAtTime(V*0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.26+tier*0.08);
    s.connect(lp); lp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+0.4); }
  // ── ゴ：中域の打撃ボディ ──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.setValueAtTime(150-tier*20,t); o.frequency.exponentialRampToValueAtTime(48,t+0.16);
    g.gain.setValueAtTime(V*0.6,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; o.connect(lp); lp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.3); }
  // ── ォオ…：胸に響く長いサブベース ──
  { const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime([70,58,46][tier],t); o.frequency.exponentialRampToValueAtTime([30,26,22][tier],t+0.5);
    g.gain.setValueAtTime(V*1.0,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55+tier*0.2);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.85); }
  // ── バリッ：歪んだクラック（重さの中の鋭さ）──
  { const s=actx.createBufferSource(); s.buffer=noiseBuf; const g=actx.createGain();
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=0.8;
    g.gain.setValueAtTime(V*0.5,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    s.connect(bp); bp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+0.1); }
  // ── 大ダメージ：不穏な鐘の余韻 ──
  if(tier>=1){ [98,147,196].forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(f*(1+(i%2?0.005:-0.004)),t);
    g.gain.setValueAtTime(V*0.16,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5+tier*0.2);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.8); }); }
}

function bossSteal(bossType){ const T=ETYPE[bossType]; if(!T) return null; const bk=T.bossKind, w=T.weapon;
  if(bk==='moloch'||bk==='dragon'||w==='fire') return {name:'業火弾',cast:stealFireVolley,col:'#ff8a3a'};
  if(bk==='emperor'||bk==='wolfking'||bk==='darkknight'||bk==='rival'||bk==='golux'||w==='dark') return {name:'闇の弾幕',cast:stealDarkOrbs,col:'#c46bff'};
  if(bk==='wanmen'||bk==='ghost'||bk==='noroinu'||bk==='cerbe') return {name:'メテオコール',cast:stealMeteor,col:'#d6a6ff'};
  if(bk==='gigas'||bk==='glaton'||bk==='guard0'||bk==='goldgolem'||bk==='cactus'||bk==='slime'||bk==='shark'||bk==='pirate') return {name:'グランドクエイク',cast:stealQuake,col:'#ffb85a'};
  return {name:'秘技・幻影弾',cast:stealDarkOrbs,col:'#bfe9ff'}; }

  e.state='grabbed'; e.grabbedBy=1; p.grabEnemy=e; p.gswingHit=new Set(); sfx.dash(); popText(p.x,p.y-104,'ジャイアントスイング!','#ffd24d',true); }
function updateGiantSwing(){ const p=player, e=p.grabEnemy;
  if(!e || e.dead){ p.state='idle'; p.grabEnemy=null; return; }
  p.gswingT++; const T=p.gswingT, dur=48;
  p.gswingRot += 0.52;
  const ang=p.gswingRot, R=54;
  e.x=clamp(p.x+Math.cos(ang)*R, camX+18, camX+W-18); e.y=p.y; e.z=Math.max(0,26+Math.sin(ang)*22); e.facing=Math.cos(ang)>0?-1:1; e.vx=0; e.vz=0;
  if(T%7===0) sfx.swing(0);
  enemies.forEach(o=>{ if(o.dead||o===e||o.grabbedBy)return;
    if(Math.abs(o.x-p.x)<74 && Math.abs(o.y-p.y)<42 && !p.gswingHit.has(o.id)){ p.gswingHit.add(o.id);
      damageEnemy(o,10,(o.x<p.x?-1:1)*9,true); if(!o.dead)launchEnemy(o,(o.x<p.x?-1:1)*15,-8,3); spark(o.x,o.y-o.h*0.5,'#ffe9a0',8,7); } });
  if(T%16===0) p.gswingHit.clear();
  if(T>=dur){ const dir = K.left?-1:K.right?1:p.facing; p.facing=dir;
    e.grabbedBy=0; e.z=0; damageEnemy(e,24,dir*6,true); launchEnemy(e, dir*32, -10, 5);
    popText(e.x,e.y-e.h-10,'ぶん投げ！','#ffd24d',true); spark(p.x+dir*44,p.y-26,'#fff',20,12); ring(p.x+dir*34,p.y-26,'#ffd24d');
    shake=12; flash=Math.max(flash,4); hitStop=13; triggerSlow(24); sfx.big();
    p.state='idle'; p.grabEnemy=null; }
  p.x=clamp(p.x,camX+24,camX+W-24);
}

function beginTriangle(e){ const p=player, dir=p.facing;

  sfx.dash(); popText(p.x,p.y-104,'三角蹴り!','#9fe8ff',true); }
function updateTriangle(){ const p=player, e=p.tkTarget; p.tkT++;
  if(p.tkPhase===0){ // 壁へ高く飛び上がる（約3倍の高さ）
    const k=Math.min(1,p.tkT/18); p.z=390*Math.sin(k*Math.PI*0.5); p.x=clamp(p.x+p.tkBackDir*7, camX+18, camX+W-18);
    if(p.tkT>=18){ p.tkPhase=1; p.tkT=0; p.facing=-p.tkBackDir; spark(p.x,p.y-p.z,'#9fe8ff',16,10); ring(p.x,p.y-p.z,'#bfe9ff'); sfx.dash(); }
  } else { // 壁を蹴って斜め下へ急降下突進
    const k=Math.min(1,p.tkT/22); p.z=390*(1-k); p.x+=p.facing*11;
    if(!p.tkHit){ for(const o of enemies){ if(o.dead||o.grabbedBy)continue;
      if(Math.abs(o.x-p.x)<62 && Math.abs(o.y-p.y)<50 && p.z<74){ p.tkHit=true;
        damageEnemy(o,26,p.facing*6,true); if(!o.dead)launchEnemy(o,p.facing*30,-8,4);
        spark(o.x,o.y-o.h*0.5,'#fff',20,12); ring(o.x,o.y-o.h*0.5,'#9fe8ff'); shake=11; flash=Math.max(flash,3); hitStop=12; triggerSlow(20); sfx.big(); break; } } }
    if(p.tkT>=22||p.z<=0){ p.z=0; p.state='idle'; p.tkTarget=null; dust(p.x,p.y,8); } }
  p.x=clamp(p.x,camX+24,camX+W-24);
}

// Shared melee resolver: front-arc check + guard/parry + slide/i-frame dodge. reach<0 = AoE (no facing check).
function hitOnePlayer(p,e,dmg,knock,reach,hh,unblock){
  if(!p.active||p.state==='down'||p.state==='dead'||p.state==='wheel'||p.invuln>0||p.state==='slide'||p.state==='egrab'||p.z>14) return false;
  if(Math.abs(p.y-e.y)>(hh||34)) return false;
  const dx=p.x-e.x;
  if(reach>=0){ if(Math.sign(dx)!==e.facing&&Math.abs(dx)>10) return false; if(Math.abs(dx)>reach) return false; }
  else if(Math.abs(dx)>-reach) return false;                   // AoE radius = -reach
  if(ETYPE[e.type].boss) dmg*=2;                               // 難易度UP：ボスの攻撃力2倍
  const fromFront = Math.sign(dx)===-p.facing;
  // ── ワンデンの居合パリィ：受け成功でガード不能技すら弾き、秘剣・犬返しの自動カウンターへ ──
  if(p.state==='iparry' && p.ipWin>0 && fromFront){ wandenCounter(e,p); return true; }
  if(p.state==='guard' && fromFront){
    if(gf-p.guardStart<=9){ doParry(e,p); return true; }        // just-time guard → PARRY（ガー不もパリィなら防げる）
    if(!unblock){ sfx.guard(); spark(p.x+p.facing*24,p.y-46,'#9fd6ff',8); p.vx=e.facing*1.8; shake=3; resetCombo(); p.guardFx=8; return true; }
    popText(p.x,p.y-70,'GUARD CRUSH!','#ff4d6a',true); flash=Math.max(flash,4);
  }
  hurtPlayer(p,dmg,e.facing,knock); return true;
}
// hit whichever player(s) are in range; returns true if any connected
function tryHitPlayer(e,dmg,knock,reach,hh,unblock){
  let hit=false;
  for(const p of players){ if(!p.active) continue; if(hitOnePlayer(p,e,dmg,knock,reach,hh,unblock)){ hit=true; if(reach>=0) break; } } // AoE(<0) hits both
  return hit;
}
const ZAKO_DMG=4.0;   // 雑魚の攻撃力（難易度UP：従来の2倍）
function zakoBuffMul(e){ return (e.rage?1.6:1)*(e.buffTill>gf?1.3:1)*diffDmgMul(); }   // 怒り／円陣強化＋難易度の攻撃力補正
function pounceStrike(e){ const t=ETYPE[e.type]; tryHitPlayer(e,t.dmg*ZAKO_DMG*zakoBuffMul(e),true,t.atkR*0.5+30,46); }

function canGrabPlayer(p){ return p && p.active && p.invuln<=0 && p.z<24 && p.state!=='dead' && p.state!=='down'

function releaseEnemyGrab(e){ const p=e.grabTarget; if(p&&p.grabbedByEnemy===e){ p.grabbedByEnemy=null; if(p.state==='egrab')p.state='idle'; } e.grabTarget=null; }
function updateEnemyGrab(){ const p=player, e=p.grabbedByEnemy;
  if(!e||e.dead||e.state!=='gripping'){ p.grabbedByEnemy=null; p.state='idle'; return; }

function pickBossMove(e,dist){ const list=BOSSMOVES[e.type]||BOSSMOVES[ETYPE[e.type].bossKind]||[];
  const cands=list.filter(m=>MV[m] && dist>=MV[m].minR && dist<=MV[m].maxR);
  if(!cands.length) return null;
  // avoid repeating the same move back-to-back when possible
  let pool=cands.filter(m=>m!==e.lastMove); if(!pool.length)pool=cands;
  return pool[Math.floor(Math.random()*pool.length)];
}

  if(e.moveName==='heroArt'){   // 腕試しボス：距離に応じて本人の技を選び、ゴースト側で発動
    const tp=nearestPlayerTo(e.x); e.facing=tp.x<e.x?-1:1;
    let ty=heroPickMove(e, Math.abs(tp.x-e.x));
    if(!ATK[ty]) ty=heroMovePool(ETYPE[e.type].heroBoss).combo[0];

function bossTick(e,t){ const p=nearestPlayerTo(e.x), dx=p.x-e.x, dist=Math.abs(dx), kind=t.bossKind;

  // ── per-boss signature flavor ──
  if(kind==='moloch' && gf%4===0) spark(e.x+rnd(-26,26), e.y-e.h*rnd(0.3,0.95), '#ff9a3a', 2, 4);
  else if(kind==='garm'){ if(e.hp<e.maxHp*0.35){ if(!e.rage){ e.rage=true; popText(e.x,e.y-e.h-10,'ENRAGE!','#ff4d3c',true); } if(gf%5===0) spark(e.x,e.y-e.h*0.5,'#ff4d3c',2,4); } }

    if(e.curseCd>0)e.curseCd--;

    if(e.cursed){ e.curseT--; if(gf%3===0)spark(e.x+rnd(-30,30),e.y-e.h*rnd(0.3,1),'#c89cff',2,4);
      if(gf%52===0 && projectiles.filter(pr=>pr.homing).length<6){ spawnProj(e.x, e.y-e.h*0.5, e.facing*5, 0, {owner:'enemy',dmg:t.dmg-4,color:'#b06bff',r:12,life:200,zz:52,homing:true}); }   // 自動追尾の呪いの焔
      if(e.curseT<=0){ e.cursed=false; e.curseCd=rnd(220,320); popText(e.x,e.y-e.h-12,'呪化解除','#9a8fae'); } } }

  const rageMul=(e.rage?1.4:1)*(e.cursed?1.5:1);
  // 飛行ボスのホバリング高度（ドラゴン＝高め、幽霊＝低め）。divebomb中は手動制御

  if(e.state!=='bmove') e.facing=dx<0?-1:1;
  if(e.state==='bwind'){ e.moveT--; e.telegraph=Math.max(e.moveT,0);

  // ---- walk: approach + spacing ----
  const wantR=t.atkR*0.85;

function hurtPlayer(p,dmg,dir,knockdown){ if(!p)p=player; if(p.invuln>0||p.state==='dead')return;

    spark(p.x,p.y-52,'#c8ccd4',8,6); ring(p.x,p.y-46,'#c8ccd4'); sfx.guard(); }
  dmg=Math.max(1,Math.round(dmg*(p.defMul||1)));   // 防御力（守りのマント）で軽減

  p.charge=0; p.atkHeld=false; spark(p.x,p.y-42,'#ff4444',9);

// 大きく描き直した乗り物（騎手は render 側で鞍の上に持ち上げて描画）
function drawVehicleShape(sx, gy, face, V, kind, p){ ctx.save(); ctx.translate(sx,gy); ctx.scale(face,1);
  const t=(p?p.anim:gf*0.12)||0, moving=p&&(K&&(K.left||K.right));
  softShadow(0, 0, 74);
  if(kind==='horse'){
    // 脚（4本・ギャロップ）
    ctx.strokeStyle=V.c2; ctx.lineWidth=11; ctx.lineCap='round';
    const legs=[[-48,0.0],[-24,1.6],[26,3.1],[50,4.7]];
    for(const [lx,ph] of legs){ const sw=Math.sin(t*0.9+ph)*(moving?14:5); ctx.beginPath(); ctx.moveTo(lx,-58); ctx.lineTo(lx+sw*0.4,-6); ctx.stroke(); }
    // 尾
    ctx.strokeStyle=V.mane; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-58,-92); ctx.quadraticCurveTo(-82,-70,-74,-18); ctx.stroke();
    // 胴
    ctx.fillStyle=V.col; ctx.beginPath(); ctx.ellipse(0,-84,66,36,0,0,7); ctx.fill();
    ctx.fillStyle=V.c2; ctx.beginPath(); ctx.ellipse(-8,-72,58,26,0,0,7); ctx.fill();   // 腹側の陰
    ctx.fillStyle=V.col; ctx.beginPath(); ctx.ellipse(0,-90,64,30,0,0,7); ctx.fill();
    // 鞍
    ctx.fillStyle='#5a3a1c'; ctx.beginPath(); ctx.ellipse(2,-112,26,10,0,Math.PI,0); ctx.fill(); ctx.fillStyle='#3a2410'; ctx.fillRect(-24,-112,52,5);
    ctx.strokeStyle='#3a2410'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(18,-108); ctx.lineTo(24,-74); ctx.stroke();   // 鐙の帯
    // 首・頭
    ctx.fillStyle=V.col; ctx.beginPath(); ctx.moveTo(48,-104); ctx.quadraticCurveTo(86,-116,96,-150); ctx.lineTo(112,-146); ctx.quadraticCurveTo(104,-104,60,-86); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(108,-150,16,12,0.5,0,7); ctx.fill();                    // 頭
    ctx.fillStyle=V.c2; ctx.beginPath(); ctx.moveTo(116,-160); ctx.lineTo(122,-176); ctx.lineTo(126,-158); ctx.closePath(); ctx.fill();   // 耳
    ctx.fillStyle='#1a120a'; ctx.beginPath(); ctx.arc(112,-152,2.6,0,7); ctx.fill();     // 目
    // たてがみ
    ctx.fillStyle=V.mane; ctx.beginPath(); ctx.moveTo(52,-104); ctx.quadraticCurveTo(84,-120,100,-150); ctx.lineTo(90,-150); ctx.quadraticCurveTo(74,-118,44,-96); ctx.closePath(); ctx.fill();
    // 手綱
    ctx.strokeStyle='#2a1c10'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(112,-146); ctx.lineTo(22,-108); ctx.stroke();
  } else {
    // タイヤ（大きなオフロードタイヤ・回転）
    for(const wx of [-52,52]){ ctx.save(); ctx.translate(wx,-24); ctx.rotate(t*0.6);
      ctx.fillStyle='#15151a'; ctx.beginPath(); ctx.arc(0,0,28,0,7); ctx.fill();
      ctx.fillStyle='#2a2a32'; for(let k=0;k<8;k++){ ctx.save(); ctx.rotate(k*0.785); ctx.fillRect(-3,-28,6,8); ctx.restore(); }   // トレッド
      ctx.fillStyle='#8a8f99'; ctx.beginPath(); ctx.arc(0,0,12,0,7); ctx.fill(); ctx.fillStyle='#c8ccd4'; ctx.beginPath(); ctx.arc(0,0,5,0,7); ctx.fill();
      ctx.restore(); }
    // 車体（ワイド）
    ctx.fillStyle=V.c2; ctx.beginPath(); ctx.moveTo(-64,-30); ctx.lineTo(64,-30); ctx.lineTo(64,-48); ctx.lineTo(-64,-48); ctx.closePath(); ctx.fill();
    ctx.fillStyle=V.col; ctx.beginPath(); ctx.moveTo(-60,-48); ctx.lineTo(62,-48); ctx.lineTo(46,-82); ctx.lineTo(-40,-82); ctx.closePath(); ctx.fill();   // キャビン
    ctx.fillStyle=V.c2; ctx.fillRect(-66,-40,132,10);                                    // バンパー
    // ロールケージ
    ctx.strokeStyle='#2a2a30'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-40,-82); ctx.lineTo(-30,-108); ctx.lineTo(30,-108); ctx.lineTo(46,-82); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30,-108); ctx.lineTo(-24,-84); ctx.moveTo(30,-108); ctx.lineTo(24,-84); ctx.stroke();
    // シート
    ctx.fillStyle='#33333c'; ctx.fillRect(-18,-104,32,22);
    // ヘッドライト
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,235,140,.9)'; ctx.beginPath(); ctx.arc(60,-58,6,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,235,140,.25)'; ctx.beginPath(); ctx.moveTo(60,-58); ctx.lineTo(120,-72); ctx.lineTo(120,-44); ctx.closePath(); ctx.fill(); ctx.restore();
    // 排気煙（走行中）
    if(moving && gf%3===0){ ctx.save(); ctx.globalAlpha=0.4; ctx.fillStyle='#9a9aa2'; ctx.beginPath(); ctx.arc(-70,-46,5,0,7); ctx.fill(); ctx.restore(); }
  }
  ctx.restore();
}

function placeNPC(n){ if(!n)return; let g=0; while(overPit(n.x)&&g++<5)n.x+=150; npcs.push(n); }
// 区画リストをワールド末尾へ追加（ゲート・NPC・落とし穴・イベントを配置）
function addBlocks(blocks,opts){
  blocks.forEach((b,bi)=>{
    const B=worldCursor, st=nextStage++, len=b.len||1900, last=bi===blocks.length-1;
    STAGE2THEME[st]=b.theme; STAGE_NAME[st]=b.name; stageStartX[st]=B;
    if(B>0 && !b.noPit && Math.random()<0.5) PITS.push([B+260,B+372]);
    b.gates.forEach(g=>{ encounters.push({st, at:B+g.off, list:g.list, boss:g.boss, mini:g.mini, rival:g.rival,
      final:g.final, branchAfter:(g.boss&&last&&opts&&opts.branchAfter)||undefined }); });
    if(b.npc) placeNPC(Object.assign({x:B+840+rnd(-60,60)},b.npc));
    if(b.npc2) placeNPC(Object.assign({x:B+(b.npc2.atX||1640)+rnd(-40,40)},b.npc2));   // 区画固有の2人目NPC（祭壇など）
    // ランダムイベントを多めに配置（未知の世界の冒険感を強調）
    if(!b.noPit){ placeNPC(randomEvent(B+1500+rnd(-90,140)));
      if(Math.random()<0.7) placeNPC(randomEvent(B+1120+rnd(-60,80))); }
    if(!b.npc && !b.noPit && Math.random()<0.7) placeNPC(randomEvent(B+760+rnd(-60,60)));
    worldCursor=B+len;
  });
  WORLD_END=worldCursor+340; curGateX=WORLD_END;
}

const FINAL_UNLOCK=6;   // 通常ステージをこの数クリアで「暗黒の城門」が解禁
let levelsDone={}, mapSel=0, mapNavCd=0, curLevelId=null, curLevelFinal=false;
function curWorldLevels(){ return lap>=3? WORLD3_LEVELS : lap>=2? WORLD2_LEVELS : WORLD_LEVELS; }
function allMapNodes(){ return lap>=3? WORLD3_LEVELS.concat(WORLD3_FINAL) : lap>=2? WORLD2_LEVELS.concat(WORLD2_FINAL) : WORLD_LEVELS.concat(WORLD_FINAL); }
function doneCount(){ return curWorldLevels().filter(l=>levelsDone[l.id]).length; }
function nodeUnlocked(node){
  if(lap>=3) return node.final? doneCount()>=NG3_UNLOCK : true;  // 三周目：玉座＝規定数クリアで解禁
  if(lap>=2) return node.final? doneCount()>=NG2_UNLOCK : true;  // 二周目：女王の間＝規定数クリアで解禁
  if(node.final) return !!levelsDone['joumon'];                 // 魔王の間＝城門クリア後
  if(node.id==='joumon') return doneCount()>=FINAL_UNLOCK;      // 城門＝規定数クリア後
  return true;                                                  // 通常ステージは最初から自由
}
function nodeSelectable(node){ return nodeUnlocked(node) && !levelsDone[node.id]; }
// 1レベルだけを読み込んで開始（x=0 起点の独立フィールド）
function loadLevel(node){
  resetWorldState(); curLevelId=node.id; curLevelFinal=!!node.final;
  const blocks = node.id==='joumon' ? [node.b] : [node.b];

  stage=1; for(const k in STAGE2THEME){ stage=k|0; break; }     // 単一区画の st

  const buggyLv=['haikyo','sabaku','reihou','futou','hikoutei'];
  spawnVehicle(WORLD_END*0.26, buggyLv.includes(node.id)?'buggy':'horse');

}
function enterMap(){ state='map'; mapNavCd=10;

  unlockAudio(); if(sndOn){ if(!Music.isPlaying())Music.start('town'); else Music.setMode('town'); }

}
function updateMap(){ useInput(players[0].in); if(mapNavCd>0)mapNavCd--;
  const nodes=allMapNodes();
  if(mapNavCd<=0){ let mv=0; if(K.left)mv=-1; else if(K.right)mv=1; else if(K.up)mv=-1; else if(K.down)mv=1;
    if(mv){ // 選択可能ノードを順に移動
      let i=mapSel; for(let k=0;k<nodes.length;k++){ i=(i+mv+nodes.length)%nodes.length; if(nodeSelectable(nodes[i])){ mapSel=i; break; } }

  if(pressed.atk||pressed.jump){ pressed.atk=false; pressed.jump=false;
    const node=nodes[mapSel];

}
function drawMap(){

  ctx.setLineDash([]);
  nodes.forEach((node,i)=>{ const x=node.mx*W, y=node.my*H*0.9+70, done=levelsDone[node.id], unl=nodeUnlocked(node), sel=i===mapSel;

}
function linesFor(n){ if(Array.isArray(n.lines)) return n.lines;
  return n.lines[players[0].kind]||n.lines.inu||[]; }   // キャラ別セリフ（オブジェクト形式に対応）
function startTalk(n,p){ state='talk'; dialog={n,p,ls:linesFor(n),i:0,t:0}; n.face=p.x<n.x?-1:1; sfx.swing(0); }
function updateTalk(){ if(!dialog){ state='play'; return; }
  useInput(players[0].in); dialog.t++;
  const line=dialog.ls[dialog.i]||'', full=dialog.t>=line.length*2;
  if(pressed.atk||pressed.jump||pressed.grab){ pressed.atk=pressed.jump=pressed.grab=false;
    if(!full){ dialog.t=line.length*2; }
    else { dialog.i++; dialog.t=0; sfx.swing(0);
      if(dialog.i>=dialog.ls.length){ endTalk(); return; } } }
  saveInput(players[0].in); }
function endTalk(){ const n=dialog.n, p=dialog.p; dialog=null; state='play';
  if(!n.met){ n.met=true; metNPC++; }
  if(n.give && (!n.given || n.give.shop)){ n.given=true; applyGive(n,p); }
  if(n.once) n.done=true;
  players.forEach(pp=>{ if(pp.active){ pp.invuln=Math.max(pp.invuln,18); pp.in.pressed.atk=pp.in.pressed.jump=pp.in.pressed.grab=false; } }); }

// ── 腕試し：主人公に選ばれていないキャラが中ボスとして立ちはだかる ──
const HERO_BOSS_OF={inu:'hbInu', shima:'hbShima', nuko:'hbNuko', guard8:'hbGuard8', watch:'hbWatch', wanden:'hbWanden'};

function heroDuelPick(){

// 中ボスの口上を一定時間ふきだしで出す
function speechQueue(e,txt){ if(!e) return; e.duelSay=txt; e.duelSayT=150; }
function triggerAmbush(n){ popText(n.x,LANE-140,'待ち伏せだ！','#ff5a5a',true); sfx.boss(); shake=Math.max(shake,6);

function updateNPCs(){

function randZako(){ const P=lap>=3?ALIEN_ZAKO_POOL:lap>=2?BUG_ZAKO_POOL:ZAKO_POOL; return P[(Math.random()*P.length)|0]; }
function randomizeZako(list){

//======================================================================
//  Projectiles  (boss 飛び道具 — ガード/スライド回避/パリィ反射に対応)
//======================================================================
// y = depth coordinate (like entities); zz = visual height above ground for draw/collision.
let projectiles=[];
function spawnProj(x,y,vx,vy,o){ o=o||{};
  projectiles.push({x,y,vx,vy,zz:(o.zz!=null?o.zz:56),vzz:o.vzz||0,explode:!!o.explode,nostop:!!o.nostop,noLaunch:!!o.noLaunch,
    pierce:!!o.pierce||!!o.multihit,wave:!!o.wave,hit:(o.pierce||o.multihit)?new Set():null,homing:!!o.homing,spike:!!o.spike,
    multihit:!!o.multihit,hitGap:o.hitGap||8,hitAt:o.multihit?{}:null,blast:!!o.blast,blastR:o.blastR||110,blastDmg:o.blastDmg||30,
    life:o.life||150,r:o.r||11,dmg:o.dmg||10,color:o.color||'#d46bff',owner:o.owner||'enemy',spin:Math.random()*6,trail:[]}); }
// 爆発（バズーカ弾など）：着弾点周囲に範囲ダメージ
function projExplode(x,y,R,dmg,color){ color=color||'#ffae42'; ring(x,y,color); ring(x,y,'#fff'); spark(x,y,color,28,13); dust(x,LANE,12);
  shake=Math.max(shake,10); flash=Math.max(flash,4); hitStop=Math.max(hitStop,7); sfx.big();
  enemies.forEach(e=>{ if(e.dead||e.grabbedBy)return; if(Math.abs(e.x-x)<R && Math.abs(e.y-y)<96){ damageEnemy(e,dmg,(e.x<x?-1:1)*11,true); if(!e.dead)launchEnemy(e,(e.x<x?-1:1)*14,-10,3); } }); }
// returns 'reflect' | 'gone' | null
function projVsPlayer(pr,p){
  if(!p.active||p.state==='dead') return null;
  const near = Math.abs(p.x-pr.x)<pr.r+14 && Math.abs(p.y-pr.y)<30 && pr.zz<64 && pr.zz>-8;
  const overIt = p.z > pr.zz+18;
  if(!near||overIt) return null;
  const dir=pr.vx>0?1:-1, fromFront=Math.sign(pr.x-p.x)===-p.facing;
  if(p.state==='slide'||p.invuln>0) return null;          // dodged
  if(p.state==='guard' && fromFront){
    if(gf-p.guardStart<=9){ pr.owner='player'; pr.vx=-pr.vx*1.5||(-p.facing*9); pr.vy*=-0.5; pr.vzz=0; pr.dmg=Math.max(pr.dmg,18); pr.color='#bfe9ff';
      spark(p.x+p.facing*22,p.y-40,'#fff',16,9); ring(p.x+p.facing*20,p.y-40,'#bfe9ff'); sfx.guard(); sfx.rise(); hitStop=10; popText(p.x,p.y-70,'REFLECT!','#9ff0ff',true); return 'reflect'; }
    sfx.guard(); spark(p.x+p.facing*22,p.y-44,'#9fd6ff',8); p.vx=dir*1.6; shake=3; p.guardFx=8; resetCombo(); return 'gone';
  }
  hurtPlayer(p,pr.dmg*2,dir,true); spark(pr.x,pr.y-pr.zz,pr.color,12,8); return 'gone';   // 難易度UP：敵弾2倍
}
function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){ const pr=projectiles[i];
    if(pr.homing){ let tx=null,ty=0;
      if(pr.owner==='enemy'){ const tp=nearestPlayerTo(pr.x); if(tp){ tx=tp.x; ty=tp.y-26; } }
      else { let best=null,bd=1e9; for(const e of enemies){ if(e.dead||e.grabbedBy)continue; const d=Math.abs(e.x-pr.x)+Math.abs(e.y-pr.y)*0.6; if(d<bd){bd=d;best=e;} } if(best){ tx=best.x; ty=best.y-best.h*0.5; } }
      if(tx!=null){ const ang=Math.atan2(ty-(pr.y-pr.zz),tx-pr.x); const cur=Math.atan2(pr.vy,pr.vx); let d=ang-cur; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; const na=cur+clamp(d,pr.owner==='enemy'?-0.10:-0.16,pr.owner==='enemy'?0.10:0.16), sp=Math.hypot(pr.vx,pr.vy)||6; pr.vx=Math.cos(na)*sp; pr.vy=Math.sin(na)*sp; } }
    pr.x+=pr.vx; pr.y=clamp(pr.y+pr.vy,GROUND_TOP-4,GROUND_BOT+4); pr.zz+=pr.vzz; pr.life--; pr.spin+=0.4;
    pr.trail.push({x:pr.x,y:pr.y-pr.zz}); if(pr.trail.length>7)pr.trail.shift();
    if(pr.owner==='player'){
      // 下方向エネルギー弾：地面で爆発（範囲ダメージ）
      if(pr.explode && pr.zz<=2){ ring(pr.x,LANE,pr.color); ring(pr.x,LANE,'#fff'); spark(pr.x,LANE,pr.color,20,11); dust(pr.x,LANE,12); shake=Math.max(shake,7); flash=Math.max(flash,3); sfx.big();
        enemies.forEach(e=>{ if(e.dead||e.grabbedBy)return; if(Math.abs(e.x-pr.x)<90){ damageEnemy(e,pr.dmg+4,(e.x<pr.x?-1:1)*10,true); if(!e.dead)launchEnemy(e,(e.x<pr.x?-1:1)*14,-9,3); } });
        projectiles.splice(i,1); continue; }
      let hit=false;
      for(const e of enemies){ if(e.dead||e.grabbedBy)continue;
        if(pr.multihit){ if(gf-(pr.hitAt[e.id]!=null?pr.hitAt[e.id]:-999) < pr.hitGap) continue; }   // 多段ヒット：一定間隔で再ヒット
        else if(pr.pierce && pr.hit.has(e.id))continue;
        if(Math.abs(e.x-pr.x)<e.w*0.5+pr.r && Math.abs(e.y-pr.y)<(pr.wave?44+pr.r*0.3:(pr.blast?62:30)) && (pr.blast?pr.zz<e.h+50:pr.zz<e.h)){
          if(pr.multihit){ noHitStopOnce=true; damageEnemy(e,pr.dmg,pr.vx>0?3:-3,false); spark(e.x,e.y-e.h*0.5,'#fff',6,7); }   // 多段ヒット：低威力・浮かせずに刻む
          else if(pr.nostop){ noHitStopOnce=true; damageEnemy(e,pr.dmg,pr.vx>0?2:-2,false); }   // エネルギー弾：低威力・ノックダウンもヒットストップも無し
          else damageEnemy(e,pr.dmg,pr.vx>0?9:-9,true);
          if(pr.wave&&!pr.noLaunch&&!pr.multihit&&!e.dead)launchEnemy(e,(pr.vx>0?1:-1)*16,-8,3);
          spark(e.x,e.y-e.h*0.5,pr.color,12,8);
          if(pr.multihit){ pr.hitAt[e.id]=gf; } else if(pr.pierce){ pr.hit.add(e.id); } else { hit=true; break; } } }
      if(hit){ if(pr.blast) projExplode(pr.x,pr.y,pr.blastR,pr.blastDmg,pr.color); else spark(pr.x,pr.y-pr.zz,pr.color,12,8); projectiles.splice(i,1); continue; }
    } else {
      let res=null; for(const p of players){ res=projVsPlayer(pr,p); if(res)break; }
      if(res==='reflect') continue;
      if(res==='gone'){ projectiles.splice(i,1); continue; }
    }
    if(pr.life<=0 || pr.x<camX-100 || pr.x>camX+W+100 || pr.zz<-30){ if(pr.blast && pr.owner==='player' && pr.life<=0) projExplode(pr.x,pr.y,pr.blastR,pr.blastDmg,pr.color); projectiles.splice(i,1); }
  }
}
function drawProjectiles(){
  projectiles.forEach(pr=>{ const sx=pr.x-camX, sy=pr.y-pr.zz;
    if(pr.wave){ const dir=pr.vx>0?1:-1; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(sx,pr.y);
      for(let k=0;k<3;k++){ ctx.globalAlpha=0.5-k*0.13; ctx.strokeStyle=pr.color; ctx.lineWidth=7-k*2;
        ctx.beginPath(); ctx.ellipse(-dir*k*9, -28, pr.r*0.7, pr.r*1.7, 0, -1.15, 1.15); ctx.stroke(); }
      ctx.globalAlpha=0.85; ctx.fillStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(dir*4,-28,pr.r*0.4,pr.r*1.5,0,-1.0,1.0); ctx.fill();
      ctx.restore(); return; }
    if(pr.spike){ const ang=Math.atan2(pr.vy,pr.vx); ctx.save(); ctx.translate(sx,sy); ctx.rotate(ang);
      ctx.fillStyle=pr.color; ctx.beginPath(); ctx.moveTo(pr.r+4,0); ctx.lineTo(-pr.r*0.5,pr.r*0.7); ctx.lineTo(-pr.r*0.5,-pr.r*0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(pr.r+4,0); ctx.lineTo(0,pr.r*0.28); ctx.lineTo(0,-pr.r*0.28); ctx.closePath(); ctx.fill(); ctx.restore(); return; }
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<pr.trail.length;i++){ const tp=pr.trail[i], a=i/pr.trail.length*0.4;
      ctx.globalAlpha=a; ctx.fillStyle=pr.color; ctx.beginPath(); ctx.arc(tp.x-camX,tp.y,pr.r*(0.5+i/pr.trail.length*0.5),0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.fillStyle=radGrad(sx,sy,pr.r*1.8,'#ffffff',pr.color); ctx.beginPath(); ctx.arc(sx,sy,pr.r*1.8,0,7); ctx.fill();
    ctx.fillStyle=pr.color; ctx.beginPath(); ctx.arc(sx,sy,pr.r,0,7); ctx.fill();
    ctx.fillStyle='#fff'; for(let k=0;k<4;k++){ const a=pr.spin+k*PI2; ctx.beginPath();
      ctx.arc(sx+Math.cos(a)*pr.r*0.5, sy+Math.sin(a)*pr.r*0.5, pr.r*0.28,0,7); ctx.fill(); }
    ctx.restore();
  });
}

function camFocusX(){ const ap=activePlayers().filter(p=>p.state!=='dead'); if(!ap.length) return players[0].x;
  let mn=1e9,mx=-1e9; ap.forEach(p=>{ mn=Math.min(mn,p.x); mx=Math.max(mx,p.x); }); return (mn+mx)/2; }
function updateCamera(){
  const target=clamp(camFocusX()-W*0.5,0,WORLD_END-W);
  const enc=encounters[encIndex];
  const maxC=(enc&&!enc.cleared&&enc.spawned)?clamp(enc.at-W*0.45,0,WORLD_END-W):WORLD_END-W;
  camX+=(Math.min(target,maxC)-camX)*0.12; camX=clamp(camX,0,WORLD_END-W);
  players.forEach(p=>{ if(p.active) p.x=clamp(p.x,camX+24,camX+W-24); });
}
function stepPlayers(){
  for(const pl of players){ if(!pl.active) continue;
    player=pl; useInput(pl.in);
    if(pl.state==='dead'){ pl.respawnT--; if(pl.respawnT<=0 && (TWO_P?coopLives>=0:pl.lives>=0)) resetPlayer(pl,false); }
    else { updatePlayer();
      if(pl.weaponT>0){ pl.weaponT--; if(pl.weaponT<=0){ const base=pl.permWeapon||defaultWeaponFor(pl.kind); if(pl.weapon!==base){ pl.weapon=base; popText(pl.x,pl.y-110, pl.permWeapon?WEAPONS[base].name+'に戻した':(base==='fists'?'素手に戻った':base==='wand'?'星の杖に戻した':base==='ghammer'?'巨大ハンマーに戻した':base==='inuboshi'?'犬干し竿に戻した':'短剣に戻った'),'#cfd8e6'); } } } }
    saveInput(pl.in);
  }
  player=players[0];
}
function update(){
  gf++;
  if(hitStop>0){ hitStop--; if(state==='play'){updateParticles();updateProjectiles();} return; }
  if(state==='talk'){ updateTalk(); updateParticles(); return; }
  if(state==='branch'){ updateBranch(); return; }
  if(state!=='play') return;
  stepPlayers(); updateEnemies(); updateMercs(); updateProjectiles(); updateHazards(); updateItems(); updateEncounters(); updateNPCs(); updateCamera(); updateCombo(); updateParticles();
  if(shake>0)shake-=0.7; if(quake>0)quake--; if(flash>0)flash--; if(bossIntro>0)bossIntro--; if(goArrow>0)goArrow--; if(stageBanner>0)stageBanner--;
  if(shopPending>0 && state==='play'){ shopPending--; if(shopPending===0) enterShop(); }   // 会話などで中断されたら次のフレームで再試行
}

  const _q=shake+(quake>0?Math.abs(Math.sin(gf*0.9))*quake*0.5:0);
  if(_q>0) ctx.translate(rnd(-_q,_q),rnd(-_q*0.6,_q*0.6));
  drawBackground(); drawGround();
  drawNPCs();
  drawItems();
  drawVehicles();
  const order=[...enemies.map(e=>({y:e.y,e}))];

  players.forEach(pl=>{ if(pl.active) order.push({y:pl.y+pl.pid*0.5, pl}); });
  order.sort((a,b)=>a.y-b.y);
  order.forEach(o=>{ if(o.m){ drawMercEnt(o.m); return; }
    if(o.pl){ player=o.pl;
      if(o.pl.state==='seven'){ const sx0=o.pl.x; ctx.save(); ctx.globalAlpha=0.32;   // 七体の分身残像
        for(let g=0;g<7;g++){ o.pl.x=clamp(camX+ (g+0.5)/7*W + Math.sin(gf*0.5+g)*16, camX+24, camX+W-24); drawPlayer(); }
        ctx.restore(); o.pl.x=sx0; }
      if(o.pl.vehicle){ drawMountedVehicle(o.pl); const sz=o.pl.z; o.pl.z+=mountLift(o.pl); drawPlayer(); o.pl.z=sz; drawMountWeapon(o.pl); }   // 乗り物→鞍上に騎手→武器
      else { drawPlayer(); if(o.pl.state==='gatling') drawGatlingGun(o.pl); } }

  player=players[0];
  drawHazards();
  drawProjectiles();
  drawParticles();
  drawGreatOne();
  drawForeground();
  drawLighting();
  ctx.restore();
  if(flash>0){ ctx.fillStyle='rgba(255,90,80,'+(flash/12)+')'; ctx.fillRect(0,0,W,H); }

}

function curTheme(){ return STAGE_THEME[themeIdxFor(stage)]; }
let amb=[], shootStars=[], birds=[];
function updateAmbient(T){
  if(amb.length<T.amb.max && Math.random()<T.amb.rate){
    amb.push({x:rnd(0,W), y:rnd(0,GROUND_TOP-10), vx:T.amb.wind+rnd(-0.3,0.3), vy:T.amb.vy*rnd(0.6,1.4),
      r:rnd(T.amb.r0,T.amb.r1), life:rnd(140,320), max:320, col:T.amb.color, sway:Math.random()*6}); }
  for(let i=amb.length-1;i>=0;i--){ const a=amb[i]; a.sway+=0.045; a.x+=a.vx+Math.sin(a.sway)*0.4; a.y+=a.vy;
    a.life--; if(a.life<=0||a.y<-20||a.y>GROUND_TOP+10||a.x<-30||a.x>W+30) amb.splice(i,1); }
}
function drawAmbient(T){ ctx.save(); if(T.amb.glow)ctx.globalCompositeOperation='lighter';
  amb.forEach(a=>{ ctx.globalAlpha=clamp(a.life/70,0,1)*T.amb.alpha; ctx.fillStyle=a.col;
    if(T.amb.shape==='petal'){ ctx.beginPath(); ctx.ellipse(a.x,a.y,a.r,a.r*0.5,a.sway,0,7); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill(); } });
  ctx.globalAlpha=1; ctx.restore(); }

// ── 負荷対策：空（グラデ・太陽・God rays）はテーマ毎に1度だけオフスクリーンへ描いて使い回す ──
let bgCache=null, bgCacheTheme=-1;
function buildSkyCache(T,ti){
  bgCacheTheme=ti;
  bgCache=document.createElement('canvas'); bgCache.width=W; bgCache.height=GROUND_TOP+30;
  const c=bgCache.getContext('2d'), sk=T.sky;
  const sky=c.createLinearGradient(0,0,0,GROUND_TOP);
  sky.addColorStop(0,sk[0]); sky.addColorStop(.45,sk[1]); sky.addColorStop(.8,sk[2]); sky.addColorStop(1,sk[3]);
  c.fillStyle=sky; c.fillRect(0,0,W,GROUND_TOP+30);
  const cdx=W*T.sunX, cdy=T.sunY;
  const sun=c.createRadialGradient(cdx,cdy,10,cdx,cdy,300);
  sun.addColorStop(0,T.sun+'.9)'); sun.addColorStop(1,T.sun+'0)');
  c.fillStyle=sun; c.fillRect(0,0,W,GROUND_TOP);
  c.save(); c.globalCompositeOperation='lighter'; c.fillStyle=T.sun+'.45)'; c.beginPath(); c.arc(cdx,cdy,T.stars?44:58,0,7); c.fill(); c.restore();
  c.fillStyle=T.stars?'#eef3ff':'#fff7dc'; c.beginPath(); c.arc(cdx,cdy,T.stars?34:40,0,7); c.fill();
  if(T.stars){ c.fillStyle='rgba(150,170,210,.45)'; c.beginPath(); c.arc(cdx-11,cdy-7,7,0,7); c.arc(cdx+12,cdy+9,5,0,7); c.arc(cdx+5,cdy-13,4,0,7); c.fill(); }
  c.save(); c.globalAlpha=T.rays; c.globalCompositeOperation='lighter';
  for(let i=0;i<8;i++){ c.fillStyle=T.sun+'1)'; c.beginPath(); c.moveTo(cdx,cdy);
    const a=-0.5+i*0.26; c.lineTo(cdx+Math.cos(a)*1000,cdy+Math.sin(a)*1000); c.lineTo(cdx+Math.cos(a+0.05)*1000,cdy+Math.sin(a+0.05)*1000); c.fill(); }
  c.restore();
}
function drawBackground(){
  const T=curTheme(), ti=themeIdxFor(stage);
  if(ti!==bgCacheTheme||!bgCache) buildSkyCache(T,ti);
  ctx.drawImage(bgCache,0,0);
  // stars (night / 魔界) — twinkle so drawn live
  if(T.stars){ ctx.save(); for(let i=0;i<T.stars;i++){ const sxp=(i*137.5)%W, syp=(i*71.3)%(GROUND_TOP-60);
    const tw=0.4+0.6*Math.abs(Math.sin(gf*0.03+i)); ctx.globalAlpha=tw*0.9; ctx.fillStyle=i%7?'#dfe7ff':'#fff6c0';
    ctx.fillRect(sxp,syp,1.6,1.6); } ctx.globalAlpha=1; ctx.restore(); }
  // shooting stars (night skies)
  if(T.stars){ if(Math.random()<0.006 && shootStars.length<2) shootStars.push({x:rnd(W*0.15,W*0.95),y:rnd(16,130),vx:rnd(-8,-5),vy:rnd(1.6,3),life:24,max:24});
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    for(let i=shootStars.length-1;i>=0;i--){ const st=shootStars[i]; st.x+=st.vx; st.y+=st.vy; st.life--;
      const a=st.life/st.max, g2=ctx.createLinearGradient(st.x,st.y,st.x-st.vx*6,st.y-st.vy*6);
      g2.addColorStop(0,'rgba(255,255,255,'+(a*0.95).toFixed(2)+')'); g2.addColorStop(1,'rgba(150,190,255,0)');
      ctx.strokeStyle=g2; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(st.x,st.y); ctx.lineTo(st.x-st.vx*6,st.y-st.vy*6); ctx.stroke();
      if(st.life<=0||st.x<-40) shootStars.splice(i,1); }
    ctx.restore(); }
  // clouds drift slowly even when standing still (skip for night/魔界)
  if(!T.stars){ const cl=-camX*0.12-gf*0.18;
    for(let i=0;i<10;i++){ const x=((i*360+cl)%(W+460)+W+460)%(W+460)-230; cloud(x,56+(i*53%70),58+(i%2)*24); } }
  // distant birds gliding across day skies
  if(!T.stars){ if(Math.random()<0.004 && birds.length<4) birds.push({x:W+24,y:rnd(36,150),v:rnd(0.7,1.3),f:Math.random()*6});
    ctx.save(); ctx.strokeStyle='rgba(30,30,55,.65)'; ctx.lineWidth=2; ctx.lineCap='round';
    for(let i=birds.length-1;i>=0;i--){ const b=birds[i]; b.x-=b.v; b.f+=0.18; const fl=Math.sin(b.f)*4;
      for(let w=0;w<2;w++){ const bx=b.x+w*11, by=b.y+w*5;
        ctx.beginPath(); ctx.moveTo(bx-5,by-fl*0.7); ctx.quadraticCurveTo(bx,by+2,bx+5,by-fl); ctx.stroke(); }
      if(b.x<-30) birds.splice(i,1); }
    ctx.restore(); }
  if(T.airship){ drawAirshipScene(); }
  else if(T.ruins){ drawRuinsScene(); }
  else if(T.space){ drawSpaceScene(T); }
  else if(T.bug){ drawBugScene(T); }
  else {
    drawMountains();
    drawCastle((W*0.5)-camX*0.28,60);
    for(let i=0;i<12;i++){ const x=((i*250-camX*0.42)%(W+250)+W+250)%(W+250)-125; drawTower(x,158,46,150,T.tower,true); }
    ctx.fillStyle=T.haze; ctx.fillRect(0,150,W,GROUND_TOP-150);
    drawBuildings(stage>=2);
    drawLampRow();
    drawBraziers(T);
  }
  if(state==='play') updateAmbient(T);
  drawAmbient(T);
  const fog=ctx.createLinearGradient(0,GROUND_TOP-26,0,GROUND_TOP+10); fog.addColorStop(0,'rgba(220,228,235,0)'); fog.addColorStop(1,T.fog);
  ctx.fillStyle=fog; ctx.fillRect(0,GROUND_TOP-26,W,36);
}
// 飛行艇の甲板ステージ：茜の雲海に浮かぶ艦隊＋流れる雲
function drawAirshipScene(){
  // 遠景の浮遊島
  ctx.fillStyle='rgba(120,90,110,.5)';
  for(let i=0;i<5;i++){ const x=((i*380-camX*0.1)%(W+380)+W+380)%(W+380)-190, y=110+(i*47%60);
    ctx.beginPath(); ctx.ellipse(x,y,60,16,0,0,7); ctx.fill(); ctx.beginPath(); ctx.moveTo(x-40,y); ctx.lineTo(x,y+40); ctx.lineTo(x+40,y); ctx.fill(); }
  // 分厚い雲海の帯
  for(let layer=0;layer<2;layer++){ ctx.fillStyle=layer?'rgba(255,220,170,.55)':'rgba(255,190,130,.4)';
    const step=200+layer*80, off=((-(camX*(0.16+layer*0.06))-gf*(0.4+layer))%step+step)%step, yb=GROUND_TOP-40-layer*24;
    for(let x=-step;x<W+step;x+=step){ const px=x-off; ctx.beginPath(); ctx.ellipse(px,yb,70,20,0,0,7); ctx.ellipse(px+50,yb+8,52,16,0,0,7); ctx.fill(); } }
  // 護衛の飛行艇（数隻）
  for(let i=0;i<3;i++){ const x=((i*520-camX*0.5)%(W+520)+W+520)%(W+520)-260, y=90+(i*53%50)+Math.sin(gf*0.03+i)*6, sc=0.7+i*0.15;
    ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
    ctx.fillStyle='#6a4a34'; ctx.beginPath(); ctx.ellipse(0,0,54,15,0,0,7); ctx.fill();
    ctx.fillStyle='#8a6242'; ctx.fillRect(-40,-4,80,6);
    ctx.fillStyle=radGrad(6,-34,28,'#c0533a','#7a2c1e'); ctx.beginPath(); ctx.ellipse(6,-34,26,20,0,0,7); ctx.fill();   // 気嚢
    ctx.strokeStyle='#5a3a28'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(-20,-14); ctx.lineTo(-14,-16); ctx.moveTo(20,-14); ctx.lineTo(28,-16); ctx.stroke();
    ctx.restore(); }
}

function drawAlienFoe(e,t){ const kind=t.alienKind||'grey', anim=e.anim||0, atk=e.state==='attack';
  const bw=t.w, bh=t.h, cy=-bh*0.45, hover=(kind==='floater'||kind==='probe')?Math.sin(anim*1.2)*5:0;
  ctx.save(); ctx.translate(0,hover);
  if(kind==='floater'){ // 浮遊する脳＋触手
    ctx.strokeStyle=t.c3; ctx.lineWidth=3; ctx.lineCap='round';
    for(let i=0;i<4;i++){ const a=Math.PI*0.25+i*0.55, sw=Math.sin(anim*2+i)*7;
      ctx.beginPath(); ctx.moveTo((i-1.5)*10, cy+bh*0.22);
      ctx.quadraticCurveTo((i-1.5)*14+sw, cy+bh*0.5, (i-1.5)*16+sw*1.5, cy+bh*0.8); ctx.stroke(); }
    ctx.fillStyle=radGrad(0,cy,bw*0.5,shade(t.c1,20),t.c2); ctx.beginPath(); ctx.ellipse(0,cy,bw*0.44,bh*0.42,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;   // 脳のしわ
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-8+i*8, cy-4+i*3, 9, 0.4, 2.6); ctx.stroke(); }
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(190,235,255,'+(0.3+0.25*Math.sin(gf*0.1))+')';
    ctx.beginPath(); ctx.arc(0,cy,bw*0.6,0,7); ctx.fill(); ctx.restore();
    ctx.restore(); return; }
  if(kind==='probe'){ // 球体の探査機（金属＋単眼＋リング）
    ctx.fillStyle=radGrad(-6,cy-6,bw*0.5,shade(t.c1,26),t.c2); ctx.beginPath(); ctx.arc(0,cy,bw*0.42,0,7); ctx.fill();
    ctx.strokeStyle=t.c3; ctx.lineWidth=4; ctx.beginPath(); ctx.ellipse(0,cy,bw*0.5,bh*0.18,0.35,0,7); ctx.stroke();
    ctx.save(); ctx.globalCompositeOperation='lighter'; const g=0.5+0.4*Math.sin(gf*0.14);
    ctx.fillStyle='rgba(140,210,255,'+g+')'; ctx.beginPath(); ctx.arc(bw*0.16,cy-2,7,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='#0e1622'; ctx.beginPath(); ctx.arc(bw*0.16,cy-2,3,0,7); ctx.fill();
    ctx.strokeStyle=t.c3; ctx.lineWidth=3; for(const sgn of [-1,1]){ ctx.beginPath(); ctx.moveTo(sgn*bw*0.36,cy+8); ctx.lineTo(sgn*bw*0.5,cy+bh*0.34); ctx.stroke(); }
    ctx.restore(); return; }
  if(kind==='ooze'){ // 寄生スライム（ぶよぶよ＋核）
    const wob=Math.sin(anim*2.4)*0.1;
    ctx.fillStyle=radGrad(0,cy,bw*0.55,shade(t.c1,20),t.c2);
    ctx.beginPath(); ctx.ellipse(0,cy+6,bw*0.5*(1+wob),bh*0.44*(1-wob),0,0,7); ctx.fill();
    ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(-bw*0.14,cy-6,bw*0.12,bh*0.1,-0.4,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle=t.c3; ctx.beginPath(); ctx.arc(0,cy+6,bw*0.16,0,7); ctx.fill();
    for(const ex of [-7,7]){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,cy,4,0,7); ctx.fill();
      ctx.fillStyle='#12301c'; ctx.beginPath(); ctx.arc(ex+1,cy,2,0,7); ctx.fill(); }
    ctx.restore(); return; }
  // grey / gunner：細身のヒト型宇宙人
  ctx.strokeStyle=t.c2; ctx.lineWidth=5; ctx.lineCap='round';
  const walk=(e.state==='walk')?Math.sin(anim*2)*4:0;
  ctx.beginPath(); ctx.moveTo(-5,cy+bh*0.3); ctx.lineTo(-7-walk*0.4,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,cy+bh*0.3); ctx.lineTo(7+walk*0.4,0); ctx.stroke();
  ctx.fillStyle=radGrad(0,cy,bw*0.4,shade(t.c1,18),t.c2);
  ctx.beginPath(); ctx.ellipse(0,cy+bh*0.06,bw*0.26,bh*0.28,0,0,7); ctx.fill();               // 細い胴
  ctx.strokeStyle=t.c1; ctx.lineWidth=4.4;
  ctx.beginPath(); ctx.moveTo(-bw*0.18,cy); ctx.lineTo(-bw*0.42,cy+bh*0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bw*0.18,cy); ctx.lineTo(bw*0.44,cy-(atk?bh*0.14:0)+bh*0.16); ctx.stroke();
  if(kind==='gunner'){ // レイガン
    ctx.save(); ctx.translate(bw*0.46,cy+bh*0.14); ctx.rotate(atk?-0.2:0.1);
    ctx.fillStyle='#3a3450'; roundRect(-4,-5,20,9,3); ctx.fill();
    ctx.fillStyle=t.accent; ctx.beginPath(); ctx.arc(16,-1,4,0,7); ctx.fill();
    if(atk){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(220,200,255,.8)';
      ctx.beginPath(); ctx.arc(20,-1,8,0,7); ctx.fill(); ctx.restore(); }
    ctx.restore(); }
  // 大きな逆三角の頭＋黒い巨眼
  ctx.fillStyle=radGrad(0,cy-bh*0.36,bw*0.42,shade(t.c1,26),t.c2);
  ctx.beginPath(); ctx.moveTo(-bw*0.34,cy-bh*0.46); ctx.quadraticCurveTo(0,cy-bh*0.72,bw*0.34,cy-bh*0.46);
  ctx.quadraticCurveTo(bw*0.22,cy-bh*0.12,0,cy-bh*0.06); ctx.quadraticCurveTo(-bw*0.22,cy-bh*0.12,-bw*0.34,cy-bh*0.46); ctx.fill();
  for(const sgn of [-1,1]){ ctx.save(); ctx.translate(sgn*bw*0.15, cy-bh*0.36); ctx.rotate(sgn*0.5);
    ctx.fillStyle='#0d1218'; ctx.beginPath(); ctx.ellipse(0,0,bw*0.14,bh*0.11,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-2,-2,bw*0.045,bh*0.03,0,0,7); ctx.fill(); ctx.restore(); }
  ctx.restore(); }
// ══ 三周目・宇宙人ボス（一目で地球外生命体と分かる造形）══
// 濡れたアーモンド型の巨眼。やられ時は×目
function alienEye(x,y,rx,ry,ang,hurt,glow){
  if(hurt){ hurtEye(x,y,Math.min(rx,ry)*1.05,'#160c22'); return; }
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang||0);
  ctx.fillStyle='#080a12'; ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,7); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=radGrad(0,0,rx*1.15,glow||'rgba(120,255,220,.45)','rgba(0,0,0,0)');
  ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,7); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(-rx*0.36,-ry*0.42,rx*0.22,ry*0.18,-0.4,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)'; ctx.beginPath(); ctx.ellipse(rx*0.32,ry*0.34,rx*0.12,ry*0.11,0,0,7); ctx.fill();
  ctx.restore(); }
// 細く節くれ立った四肢（先に長い指）
function alienLimb(ox,oy,mx,my,ex,ey,w,col,dir,fing){
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke();
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(mx,my,w*0.6,0,7); ctx.fill();   // 節のふくらみ
  if(fing!==false){ ctx.lineWidth=w*0.46;
    for(let i=-1;i<=1;i++){ const a=0.35+i*0.6;
      ctx.beginPath(); ctx.moveTo(ex,ey);
      ctx.quadraticCurveTo(ex+dir*w*1.2, ey+Math.sin(a)*w*1.5, ex+dir*w*1.9, ey+Math.sin(a)*w*3.4); ctx.stroke(); } } }
// 生体発光
function alienGlow(x,y,r,col,a){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=(a==null?0.5:a);
  ctx.fillStyle=radGrad(x,y,r,col,'rgba(0,0,0,0)'); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.restore(); }
// 宇宙人の口。やられ時は歪んだギザギザに
function alienMaw(x,y,w,h,hurt,col,open){
  if(hurt){ ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.beginPath();
    for(let i=0;i<=6;i++){ const px=x-w*0.5+w*i/6, py=y+(i%2?-h*0.5:h*0.5); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.stroke(); return; }
  ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y,w*0.5,h*0.5*(open||1),0,0,7); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.lineCap='round';   // 左右へ伸びる裂け目
  ctx.beginPath(); ctx.moveTo(x-w*0.86,y); ctx.lineTo(x+w*0.86,y); ctx.stroke(); }

function drawAlienBoss(e){ const t=ETYPE[e.type], kind=t.bossKind, hurt=enemyHurt(e);
  const HW=t.w*0.5, H=t.h, anim=e.anim||0;
  const atk=e.state==='bmove', wind=e.state==='bwind';
  const hov=Math.sin(gf*0.055)*5;
  ctx.lineJoin='round';

  if(kind==='greyking'){   // ── 大灰星人ゼータ：巨大頭蓋と黒い巨眼のグレイ型 ──
    ctx.translate(0,hov*0.4);
    const walk=(e.state==='walk')?Math.sin(anim*1.9)*7:0;
    // 逆関節の細い脚＋平たい足
    for(const sgn of [-1,1]){ const sw=(sgn>0?walk:-walk);
      alienLimb(sgn*9,-H*0.34, sgn*21+sw,-H*0.19, sgn*13+sw*0.6,-3, 7, t.c2, sgn, false);
      ctx.fillStyle=shade(t.c2,-8); ctx.beginPath(); ctx.ellipse(sgn*15+sw*0.6,-2,12,4.5,0,0,7); ctx.fill(); }
    // 痩せこけた胴（肋が透ける）
    const bg=ctx.createLinearGradient(0,-H*0.74,0,-H*0.26);
    bg.addColorStop(0,shade(t.c1,24)); bg.addColorStop(1,t.c2);
    ctx.fillStyle=bg; ctx.beginPath();
    ctx.moveTo(-HW*0.44,-H*0.74); ctx.quadraticCurveTo(-HW*0.64,-H*0.50,-HW*0.28,-H*0.29);
    ctx.quadraticCurveTo(0,-H*0.23, HW*0.28,-H*0.29); ctx.quadraticCurveTo(HW*0.64,-H*0.50, HW*0.44,-H*0.74);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(16,58,46,.32)'; ctx.lineWidth=2.2;
    for(let i=0;i<4;i++){ const y=-H*0.66+i*H*0.075;
      ctx.beginPath(); ctx.moveTo(-HW*0.34,y); ctx.quadraticCurveTo(0,y+7,HW*0.34,y); ctx.stroke(); }
    alienGlow(0,-H*0.44,HW*0.42,'rgba(140,255,210,.6)',0.35);   // 腹の生体発光
    // 異様に長い腕
    for(const sgn of [-1,1]){ const rise=atk? -H*0.18 : wind? H*0.06 : 0;
      alienLimb(sgn*HW*0.38,-H*0.68, sgn*HW*1.10,-H*0.46+Math.sin(anim+sgn)*4, sgn*HW*0.90,-H*0.20+rise, 6.5, t.c2, sgn); }
    // 細い首
    ctx.strokeStyle=t.c2; ctx.lineWidth=9; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-H*0.74); ctx.lineTo(0,-H*0.80); ctx.stroke();
    // 極端に肥大した頭蓋
    ctx.fillStyle=radGrad(-HW*0.25,-H*0.98,HW*1.5,shade(t.c1,36),t.c2);
    ctx.beginPath(); ctx.moveTo(0,-H*0.70);
    ctx.bezierCurveTo(-HW*0.92,-H*0.74, -HW*1.34,-H*0.86, -HW*1.02,-H*0.97);
    ctx.bezierCurveTo(-HW*0.74,-H*1.06,  HW*0.74,-H*1.06,  HW*1.02,-H*0.97);
    ctx.bezierCurveTo( HW*1.34,-H*0.86,  HW*0.92,-H*0.74, 0,-H*0.70);
    ctx.closePath(); ctx.fill();
    ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(-HW*0.34,-H*0.96,HW*0.42,H*0.05,-0.2,0,7); ctx.fill(); ctx.restore();
    ctx.strokeStyle='rgba(40,120,100,.30)'; ctx.lineWidth=1.8;   // 頭蓋に走る血管
    for(const sgn of [-1,1]){ ctx.beginPath(); ctx.moveTo(sgn*HW*0.15,-H*0.99);
      ctx.quadraticCurveTo(sgn*HW*0.70,-H*0.98, sgn*HW*0.86,-H*0.88); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sgn*HW*0.30,-H*1.01);
      ctx.quadraticCurveTo(sgn*HW*0.55,-H*0.93, sgn*HW*0.48,-H*0.86); ctx.stroke(); }
    // 黒い巨眼
    alienEye(-HW*0.46,-H*0.865,HW*0.40,HW*0.24,-0.42,hurt,'rgba(150,255,215,.5)');
    alienEye( HW*0.46,-H*0.865,HW*0.40,HW*0.24, 0.42,hurt,'rgba(150,255,215,.5)');
    // 鼻孔と小さな裂け口
    if(!hurt){ ctx.fillStyle='rgba(20,70,58,.7)';
      for(const sgn of [-1,1]){ ctx.beginPath(); ctx.ellipse(sgn*HW*0.10,-H*0.780,1.8,3,0,0,7); ctx.fill(); } }
    alienMaw(0,-H*0.745,HW*0.30,HW*0.075,hurt,'#153b30',atk?2.6:1);
    if(hurt){ sweatDrop(HW*0.95,-H*0.97); sweatDrop(HW*0.75,-H*1.04); }
  }
  else if(kind==='ufoboss'){   // ── 円盤母艦ディスコ：生体金属の円盤＋ドーム内の脳型パイロット ──
    const cy=-H*0.52; ctx.translate(0,hov);
    ctx.rotate(atk?0.20:wind?-0.13:Math.sin(anim*0.8)*0.05);
    if(atk||wind){   // 牽引ビーム
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.30+0.14*Math.sin(gf*0.3);
      const bm=ctx.createLinearGradient(0,cy,0,cy+H*1.0);
      bm.addColorStop(0,t.accent); bm.addColorStop(1,'rgba(180,150,255,0)');
      ctx.fillStyle=bm; ctx.beginPath(); ctx.moveTo(-HW*0.24,cy+6); ctx.lineTo(HW*0.24,cy+6);
      ctx.lineTo(HW*0.70,cy+H*0.98); ctx.lineTo(-HW*0.70,cy+H*0.98); ctx.closePath(); ctx.fill(); ctx.restore(); }
    // 船体から垂れる触手（生体である証）
    ctx.strokeStyle=t.c3; ctx.lineWidth=5; ctx.lineCap='round';
    for(let i=-2;i<=2;i++){ const px=i*HW*0.30, cur=i*11+Math.sin(anim*1.6+i)*9, tipY=cy+H*(0.58+Math.abs(i)*0.03);
      ctx.lineWidth=6.5-Math.abs(i)*0.9;
      ctx.beginPath(); ctx.moveTo(px,cy+H*0.14);
      ctx.bezierCurveTo(px-cur*0.6,cy+H*0.32, px+cur*1.1,cy+H*0.46, px+cur*1.5,tipY); ctx.stroke();
      ctx.fillStyle=t.c3; ctx.beginPath(); ctx.arc(px+cur*1.5,tipY,3.6,0,7); ctx.fill();
      ctx.fillStyle=shade(t.c2,14);   // 吸盤
      for(let k=1;k<=2;k++){ ctx.beginPath(); ctx.arc(px+cur*0.5*k, cy+H*(0.26+k*0.14), 2.4,0,7); ctx.fill(); } }
    // 底面（脈打つ肉の裏側）
    ctx.fillStyle=radGrad(0,cy+8,HW*1.05,t.c2,t.c3);
    ctx.beginPath(); ctx.ellipse(0,cy+4,HW*0.96,H*0.28,0,0,Math.PI); ctx.fill();
    alienGlow(0,cy+H*0.14,HW*0.5,t.accent,0.45+0.2*Math.sin(gf*0.12));
    // 主船体
    const hg=ctx.createLinearGradient(0,cy-H*0.22,0,cy+H*0.12);
    hg.addColorStop(0,shade(t.c1,32)); hg.addColorStop(0.55,t.c2); hg.addColorStop(1,t.c3);
    ctx.fillStyle=hg; ctx.beginPath(); ctx.ellipse(0,cy,HW,H*0.25,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2;
    for(let i=1;i<=2;i++){ ctx.beginPath(); ctx.ellipse(0,cy,HW*(1-i*0.22),H*0.25*(1-i*0.22),0,0,7); ctx.stroke(); }
    ctx.strokeStyle='rgba(20,10,50,.35)'; ctx.lineWidth=1.6;   // 装甲の継ぎ目
    for(let i=0;i<8;i++){ const a=i/8*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*HW*0.30,cy+Math.sin(a)*H*0.075);
      ctx.lineTo(Math.cos(a)*HW*0.94,cy+Math.sin(a)*H*0.235); ctx.stroke(); }
    // 回転する縁のライト
    for(let i=0;i<14;i++){ const a=i/14*Math.PI*2+gf*0.045, dep=(Math.sin(a)+1)*0.5;
      ctx.globalAlpha=0.3+0.65*dep; ctx.fillStyle=(i%3===0)?'#ffe06a':t.accent;
      ctx.beginPath(); ctx.arc(Math.cos(a)*HW*0.9,cy+Math.sin(a)*H*0.215,3+dep*1.8,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // ドームの中の脳型パイロット
    const dy=cy-H*0.14;
    ctx.save(); ctx.beginPath(); ctx.ellipse(0,dy,HW*0.42,H*0.30,0,Math.PI,0); ctx.clip();
      ctx.fillStyle=radGrad(0,dy-H*0.08,HW*0.36,shade(t.c1,28),t.c2);
      ctx.beginPath(); ctx.ellipse(0,dy-H*0.07,HW*0.27,H*0.15,0,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;   // 脳のしわ
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-HW*0.11+i*HW*0.11,dy-H*0.10+i*3,7,0.4,2.6); ctx.stroke(); }
      ctx.strokeStyle=t.c2; ctx.lineWidth=3; ctx.lineCap='round';   // パイロットの触手
      for(let i=-1;i<=1;i++){ const ph=Math.sin(anim*2+i)*4;
        ctx.beginPath(); ctx.moveTo(i*9,dy-H*0.01); ctx.quadraticCurveTo(i*15+ph,dy+H*0.05,i*20+ph,dy+H*0.10); ctx.stroke(); }
      alienEye(-HW*0.10,dy-H*0.075,HW*0.075,H*0.042,-0.3,hurt,'rgba(210,170,255,.6)');
      alienEye( HW*0.10,dy-H*0.075,HW*0.075,H*0.042, 0.3,hurt,'rgba(210,170,255,.6)');
      alienMaw(0,dy-H*0.015,HW*0.16,H*0.05,hurt,'#1a1038',atk?1.5:1);
    ctx.restore();
    // ガラスのドーム
    ctx.save(); ctx.globalAlpha=0.40;
    ctx.fillStyle=radGrad(-HW*0.14,dy-H*0.14,HW*0.5,'#ffffff','rgba(160,200,255,.12)');
    ctx.beginPath(); ctx.ellipse(0,dy,HW*0.42,H*0.30,0,Math.PI,0); ctx.fill(); ctx.restore();
    ctx.strokeStyle=shade(t.c1,18); ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(0,dy,HW*0.42,H*0.30,0,Math.PI,0); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.ellipse(0,dy,HW*0.34,H*0.24,0,-2.45,-1.85); ctx.stroke();
    if(hurt){   // 被弾：船体から火花と黒煙
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,215,120,.85)';
      for(let i=0;i<5;i++){ const a=gf*0.4+i*1.3;
        ctx.beginPath(); ctx.arc(Math.cos(a)*HW*(0.4+0.45*Math.abs(Math.sin(a))), cy+Math.sin(a*1.3)*H*0.14, 3,0,7); ctx.fill(); }
      ctx.restore();
      ctx.fillStyle='rgba(60,58,74,.45)';
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-HW*0.55-i*11, cy-H*0.14-i*13+Math.sin(gf*0.1+i)*4, 8+i*3,0,7); ctx.fill(); }
      sweatDrop(HW*0.5,dy-H*0.24); }
  }
  else if(kind==='bioblob'){   // ── 増殖体バイオブロブ：核が漂う不定形の生体兵器 ──
    const cy=-H*0.46, R=HW*0.95, squash=atk?1.14:wind?0.90:1;
    ctx.fillStyle='rgba(24,84,46,.42)'; ctx.beginPath(); ctx.ellipse(0,-4,HW*1.05,11,0,0,7); ctx.fill();   // 粘液だまり
    // 分裂しかけの子体
    for(const sgn of [-1,1]){ const bx=sgn*HW*0.88, by=cy+H*0.20+Math.sin(anim*1.5+sgn)*5;
      ctx.fillStyle=radGrad(bx,by,HW*0.36,shade(t.c1,14),t.c2);
      ctx.beginPath(); ctx.arc(bx,by,HW*0.30,0,7); ctx.fill();
      if(hurt) hurtEye(bx,by-2,HW*0.10,'#0a2a16');
      else { ctx.fillStyle='#0a2a16'; ctx.beginPath(); ctx.arc(bx,by-2,HW*0.09,0,7); ctx.fill();
        ctx.fillStyle='#c8ffd8'; ctx.beginPath(); ctx.arc(bx-3,by-6,HW*0.03,0,7); ctx.fill(); } }
    // 本体（ぶよぶよ揺れる不定形）
    ctx.beginPath();
    for(let i=0;i<=52;i++){ const a=i/52*Math.PI*2;
      const rr=R*(1+0.11*Math.sin(a*3+anim*1.7)+0.07*Math.sin(a*5-anim*1.2)+0.05*Math.sin(a*7+gf*0.05));
      const px=Math.cos(a)*rr*(2-squash), py=cy+Math.sin(a)*rr*0.88*squash;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath();
    ctx.fillStyle=radGrad(-R*0.25,cy-R*0.35,R*1.55,shade(t.c1,26),t.c2); ctx.fill();
    ctx.save(); ctx.clip();
      for(let i=0;i<11;i++){   // 内部を漂う無数の核
        const a=i*1.9+gf*0.012, rr=R*(0.18+0.55*(((i*7)%10)/10));
        const nx=Math.cos(a)*rr, ny=cy+Math.sin(a*1.3)*rr*0.7;
        const nr=6+(i%3)*2.5;
        alienGlow(nx,ny,nr*2.4,'rgba(170,255,200,.7)',0.5);
        ctx.fillStyle='rgba(9,48,26,.8)'; ctx.beginPath(); ctx.arc(nx,ny,nr,0,7); ctx.fill();
        ctx.fillStyle='rgba(190,255,215,.9)'; ctx.beginPath(); ctx.arc(nx,ny,nr*0.36,0,7); ctx.fill();   // 分裂中の核
        ctx.strokeStyle='rgba(190,255,215,.5)'; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.arc(nx,ny,nr*0.72,0,7); ctx.stroke(); }
      ctx.strokeStyle='rgba(232,242,224,.42)'; ctx.lineWidth=3; ctx.lineCap='round';   // 取り込んだ骨
      ctx.beginPath(); ctx.moveTo(-R*0.52,cy+R*0.28); ctx.lineTo(-R*0.20,cy+R*0.46); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(R*0.34,cy-R*0.12); ctx.lineTo(R*0.56,cy+R*0.10); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.22)';
      ctx.beginPath(); ctx.ellipse(-R*0.34,cy-R*0.46,R*0.32,R*0.16,-0.4,0,7); ctx.fill();
    ctx.restore();
    // 表面に浮かぶ複数の目
    [[-0.48,-0.30,10],[0.00,-0.48,13],[0.48,-0.28,10],[-0.24,0.08,8],[0.30,0.12,8]].forEach((q,i)=>{
      const ex=q[0]*R, ey=cy+q[1]*R;
      if(hurt){ hurtEye(ex,ey,q[2]*0.95,'#0a2a16'); return; }
      ctx.fillStyle='#eafff0'; ctx.beginPath(); ctx.arc(ex,ey,q[2],0,7); ctx.fill();
      const bl=Math.sin(gf*0.06+i*1.7)>0.92;
      ctx.fillStyle='#0a2a16'; ctx.beginPath(); ctx.ellipse(ex+2,ey,q[2]*0.45,q[2]*(bl?0.09:0.45),0,0,7); ctx.fill(); });
    // 裂けた大口

  else if(kind==='emperorX'){   // ── 宇宙皇帝ワンダルク：四つ目の異星の支配者 ──

    for(let i=0;i<14;i++){ const px=-HW*(0.28+1.25*(((i*3)%7)/7)), py=-H*(0.10+0.58*(((i*5)%9)/9));
      ctx.globalAlpha=0.25+0.6*Math.abs(Math.sin(gf*0.05+i)); ctx.beginPath(); ctx.arc(px,py,1.7,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // 脚はなく、下半身は束ねた触手
    ctx.strokeStyle=t.c2; ctx.lineWidth=6; ctx.lineCap='round';
    for(let i=-2;i<=2;i++){ const ph=Math.sin(anim*1.6+i)*7;
      ctx.beginPath(); ctx.moveTo(i*4,-H*0.42); ctx.quadraticCurveTo(i*10+ph,-H*0.20,i*14+ph*1.5,-H*0.02); ctx.stroke(); }
    // 細長い胴
    const bx=ctx.createLinearGradient(0,-H*0.78,0,-H*0.36);
    bx.addColorStop(0,shade(t.c1,28)); bx.addColorStop(1,t.c2);
    ctx.fillStyle=bx; ctx.beginPath();
    ctx.moveTo(-HW*0.46,-H*0.76); ctx.quadraticCurveTo(-HW*0.66,-H*0.54,-HW*0.32,-H*0.38);
    ctx.quadraticCurveTo(0,-H*0.32, HW*0.32,-H*0.38); ctx.quadraticCurveTo(HW*0.66,-H*0.54, HW*0.46,-H*0.76);
    ctx.closePath(); ctx.fill();
    for(const sgn of [-1,1]){   // 尖った肩の甲殻

      ctx.quadraticCurveTo(sgn*HW*1.25,-H*0.90, sgn*HW*1.00,-H*0.60);
      ctx.quadraticCurveTo(sgn*HW*0.56,-H*0.66, sgn*HW*0.28,-H*0.72); ctx.closePath(); ctx.fill(); }
    alienGlow(0,-H*0.60,HW*0.55,t.accent,0.55);   // 胸の核
    ctx.fillStyle=t.accent; ctx.beginPath();
    ctx.moveTo(0,-H*0.69); ctx.lineTo(HW*0.19,-H*0.60); ctx.lineTo(0,-H*0.51); ctx.lineTo(-HW*0.19,-H*0.60); ctx.closePath(); ctx.fill();
    // 長い腕
    const rise=atk?-H*0.22:wind?H*0.05:0;
    for(const sgn of [-1,1]) alienLimb(sgn*HW*0.54,-H*0.72, sgn*HW*1.55,-H*0.52+Math.sin(anim+sgn)*4, sgn*HW*1.28,-H*0.30+rise, 5.5, t.c2, sgn);
    // 暗黒エネルギーの笏
    ctx.save(); ctx.translate(HW*1.28,-H*0.30+rise); ctx.rotate(atk?-0.85:-0.32);
      ctx.strokeStyle=t.c3; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,H*0.14); ctx.lineTo(0,-H*0.40); ctx.stroke();
      alienGlow(0,-H*0.44,18,t.accent,0.7);
      ctx.fillStyle=t.accent; ctx.beginPath();
      ctx.moveTo(0,-H*0.52); ctx.lineTo(7,-H*0.44); ctx.lineTo(0,-H*0.36); ctx.lineTo(-7,-H*0.44); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 縦に伸びた頭蓋
    ctx.fillStyle=radGrad(-HW*0.2,-H*0.96,HW*1.2,shade(t.c1,34),t.c2);
    ctx.beginPath(); ctx.moveTo(0,-H*0.74);
    ctx.bezierCurveTo(-HW*0.88,-H*0.78, -HW*1.00,-H*0.94, -HW*0.58,-H*1.01);
    ctx.bezierCurveTo(-HW*0.28,-H*1.06,  HW*0.28,-H*1.06,  HW*0.58,-H*1.01);
    ctx.bezierCurveTo( HW*1.00,-H*0.94,  HW*0.88,-H*0.78, 0,-H*0.74);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-H*1.05); ctx.lineTo(0,-H*0.76); ctx.stroke();
    // 四つの眼（上段は小さく、下段は大きく）
    alienEye(-HW*0.40,-H*0.865,HW*0.30,HW*0.19,-0.36,hurt,'rgba(215,160,255,.6)');
    alienEye( HW*0.40,-H*0.865,HW*0.30,HW*0.19, 0.36,hurt,'rgba(215,160,255,.6)');
    alienEye(-HW*0.27,-H*0.955,HW*0.17,HW*0.11,-0.30,hurt,'rgba(215,160,255,.6)');
    alienEye( HW*0.27,-H*0.955,HW*0.17,HW*0.11, 0.30,hurt,'rgba(215,160,255,.6)');
    alienMaw(0,-H*0.788,HW*0.32,HW*0.085,hurt,'#1a0a34',atk?2.4:1);
    // 頭上を周回する王冠のリング
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.strokeStyle=t.accent; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(0,-H*1.12,HW*0.76,HW*0.20,Math.sin(gf*0.03)*0.16,0,7); ctx.stroke(); ctx.restore();
    for(let i=0;i<5;i++){ const a=i/5*Math.PI*2+gf*0.03;
      ctx.fillStyle=t.accent; ctx.globalAlpha=0.35+0.65*((Math.sin(a)+1)/2);
      ctx.beginPath(); ctx.arc(Math.cos(a)*HW*0.76,-H*1.12+Math.sin(a)*HW*0.20,3.6,0,7); ctx.fill(); }

    if(hurt){ sweatDrop(HW*0.92,-H*0.97); sweatDrop(HW*0.72,-H*1.05); }
