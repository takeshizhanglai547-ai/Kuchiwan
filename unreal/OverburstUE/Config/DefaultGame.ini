; ============================================================================
;  OVERBURST — project identity and packaging.
; ============================================================================

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=OVERBURST
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "OVERBURST")
Description=Armored Core VI-grade mech action. OP-317 "SLAG CROWN".
ProjectVersion=0.1.0
bStartInVR=False
bAllowWindowResize=True
bAllowClose=True
bAllowMaximize=True

[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
UsePakFile=True
bCompressed=True

; The mech, the arena and the HUD are all generated from C++ at runtime, so
; there is no /Game content to cook yet. What DOES have to be cooked is the
; handful of engine primitives the static-mesh fallback rig path references
; (see UObMechRigComponent::BuildWithStaticMeshes). Engine content is not
; cooked unless something references it, and a ConstructorHelpers path is a
; hard reference only for the class that declares it - so these directories
; are listed explicitly. Without this the fallback rig is invisible in a
; packaged build while working perfectly in PIE, which is a miserable bug to
; find later.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineMaterials")

[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="Map",AssetBaseClass="/Script/Engine.World",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Maps")),Rules=(Priority=-1))

[/Script/Engine.CollisionProfile]
; Deliberately empty. Collision channels and profiles are declared once, in
; DefaultEngine.ini, so there is a single place to check them against
; FObWorldQueryUE's trace channel.
