<!DOCTYPE html>
<html lang="ja">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<!-- build: 00_core,05_post,10_look,20_heroes,30_foes,31_zako,35_bosses_a,36_bosses_b,40_stage,50_combat,55_player,60_fx,70_audio,80_ui,90_game -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
  :root { color-scheme: light; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#8fd0ff;
    font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic',sans-serif;
    color:#4a2c14; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none; overscroll-behavior:none; }
  #game { position:fixed; inset:0; display:block; width:100%; height:100%; outline:none; }
  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:radial-gradient(circle at 50% 40%, #fff6d8 0%, #ffd9a0 45%, #ffb36b 100%);
    z-index:100; text-align:center; padding:24px; }
  #boot .t { font-size:clamp(26px,7vw,46px); font-weight:900; color:#fff; letter-spacing:2px;
    text-shadow:0 3px 0 #d9772b, 0 6px 16px rgba(160,70,0,.35); }
  #boot .s { font-size:16px; font-weight:800; color:#8a4a1a; }
  #boot .dots span { display:inline-block; width:12px; height:12px; margin:0 5px; border-radius:50%;
    background:#fff; animation:bootdot 0.9s ease-in-out infinite; }
  #boot .dots span:nth-child(2){ animation-delay:.15s } #boot .dots span:nth-child(3){ animation-delay:.3s }
  @keyframes bootdot { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-10px) } }
  @media (prefers-reduced-motion: reduce){ #boot .dots span { animation:none; } }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="ui"></div>
<div id="boot">
  <div class="t">もふもふ聖犬士イッヌ</div>
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="s" id="bootmsg">じゅんびちゅう…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
if(!window.THREE){
  document.getElementById('bootmsg').textContent = 'インターネットにつないで、もういちど ひらいてね';
} else {

// ===== 00_core.js =====
// 00_core.js — もふもふ聖犬士イッヌ 2.5D : core services
// 名前空間・固定60Hzループ・入力・カメラ・実体（エンティティ）・物理・品質ガバナー。
// 他のモジュールは G.* 経由でだけ参照する（CONTRACT.md §3）。
(function(){ 'use strict';
const G = window.G = window.G || {};
const THREE = window.THREE;
G.THREE = THREE;

// ---------------------------------------------------------------- config
G.cfg = {
  TICK: 1/60,
  GRAV: -0.012,            // units / frame^2 (jump 0.22 → apex 2.0u, 37 frames airtime)
  ZMIN: -2.4, ZMAX: 2.0,   // walkable belt depth
  FRICTION_GROUND: 0.80,
  FRICTION_AIR: 0.985,
  MAX_STEPS: 5,            // max fixed ticks per rendered frame (spiral-of-death guard)
};

// ---------------------------------------------------------------- utils
const TAU = Math.PI*2;
const U = G.U = {
  TAU,
  clamp:(v,a,b)=> v<a?a:(v>b?b:v),
  lerp:(a,b,t)=> a+(b-a)*t,
  invLerp:(a,b,v)=> (v-a)/(b-a),
  // frame-rate independent smoothing: k = response per second
  damp:(a,b,k,dt)=> a+(b-a)*(1-Math.exp(-k*dt)),
  approach:(v,t,s)=> v<t?Math.min(v+s,t):Math.max(v-s,t),
  rand:(a,b)=> a+Math.random()*(b-a),
  randi:(a,b)=> Math.floor(a+Math.random()*(b-a+1)),
  pick:(arr)=> arr[Math.floor(Math.random()*arr.length)],
  chance:(p)=> Math.random()<p,
  sign:(v)=> v<0?-1:1,
  easeOutBack:(t)=>{ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
  easeOutCubic:(t)=> 1-Math.pow(1-t,3),
  easeInCubic:(t)=> t*t*t,
  easeInOutSine:(t)=> -(Math.cos(Math.PI*t)-1)/2,
  easeOutElastic:(t)=>{ if(t<=0) return 0; if(t>=1) return 1; return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(TAU/3))+1; },
  // smooth 0→1→0 bump over [a,b]
  bump:(t,a,b)=>{ if(t<=a||t>=b) return 0; const x=(t-a)/(b-a); return Math.sin(x*Math.PI); },
  // 0 before a, 1 after b, smooth in between
  smooth:(t,a,b)=>{ if(t<=a) return 0; if(t>=b) return 1; const x=(t-a)/(b-a); return x*x*(3-2*x); },
  v3:()=> new THREE.Vector3(),
};

// seedable RNG (mulberry32) for gameplay decisions
let _seed = 0x1234abcd;
G.seed = (n)=>{ _seed = (n>>>0) || 1; };
G.rng = ()=>{ _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0; let t = Math.imul(_seed ^ (_seed>>>15), 1 | _seed);
  t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t; return ((t ^ (t>>>14)) >>> 0) / 4294967296; };
G.rpick = (arr)=> arr[Math.floor(G.rng()*arr.length)];

// ---------------------------------------------------------------- event bus
const handlers = {};
G.bus = {
  on(evt, fn){ (handlers[evt] = handlers[evt] || []).push(fn); return fn; },
  off(evt, fn){ const h = handlers[evt]; if(!h) return; const i = h.indexOf(fn); if(i>=0) h.splice(i,1); },
  emit(evt, data){
    const h = handlers[evt]; if(!h) return;
    for(let i=0;i<h.length;i++){
      try { h[i](data||{}); } catch(err){ G.logError && G.logError('bus:'+evt, err); }
    }
  },
};

// errors are collected (tests read them) and never stop the loop
G.errors = [];
G.logError = (where, err)=>{
  G.errors.push(where+': '+(err && err.stack || err));
  if(G.errors.length>50) G.errors.shift();
  try { console.error('[inu25d]', where, err); } catch(_){}
};

// ---------------------------------------------------------------- quality
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
G.isTouch = isTouch;
G.quality = { tier: isTouch ? 1 : 0, dpr: 1, shadows: true, fxScale: 1 };
function applyQuality(){
  const q = G.quality, dev = window.devicePixelRatio || 1;
  q.dpr = q.tier===0 ? Math.min(dev, 2) : q.tier===1 ? Math.min(dev, 1.5) : Math.min(dev, 1);
  q.shadows = q.tier<2;
  q.fxScale = q.tier===0 ? 1 : q.tier===1 ? 0.7 : 0.4;
  if(G.renderer){
    G.renderer.setPixelRatio(q.dpr);
    G.renderer.shadowMap.enabled = q.shadows;
    if(G.lights && G.lights.key){
      G.lights.key.castShadow = q.shadows;
      const sz = q.tier===0 ? 2048 : 1024;
      if(G.lights.key.shadow.mapSize.x!==sz){
        G.lights.key.shadow.mapSize.set(sz, sz);
        if(G.lights.key.shadow.map){ G.lights.key.shadow.map.dispose(); G.lights.key.shadow.map = null; }
      }
    }
    // materials must recompile when shadow maps toggle
    if(G.scene) G.scene.traverse(o=>{ if(o.material){ const m=o.material; (Array.isArray(m)?m:[m]).forEach(mm=>mm.needsUpdate=true); } });
    resize();
  }
  G.bus.emit('quality', q);
}
G.setQuality = (tier)=>{ G.quality.tier = U.clamp(tier|0,0,2); G.quality.pendingTier = null; applyQuality(); };
// a deferred downgrade (shader recompiles) is applied at the next calm moment
function applyPendingQuality(){ if(G.quality.pendingTier!=null) G.setQuality(G.quality.pendingTier); }
G.bus.on('waveClear', applyPendingQuality); G.bus.on('scene', applyPendingQuality); G.bus.on('pause', applyPendingQuality);

// ---------------------------------------------------------------- renderer / scene / lights
G.initRenderer = function(canvas){
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', alpha: false,
      preserveDrawingBuffer: !!G.testMode });
  } catch(err){
    G.logError('webgl', err);
    return false;
  }
  G.renderer = renderer;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0xbfe6ff, 1);
  renderer.info.autoReset = false;       // renderNow() resets once per frame so info covers every pass

  const scene = G.scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xcfeaff, 30, 90);

  const camera = G.camera = new THREE.PerspectiveCamera(30, 16/9, 0.1, 400);
  camera.position.set(0, 6, 16);

  // Pixar-ish three-point lighting: warm key, cool sky fill, strong back rim
  const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x9ccb73, 1.25);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff0d8, 2.4);
  key.position.set(-6, 14, 10);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  const sc = key.shadow.camera; sc.left=-15; sc.right=15; sc.top=12; sc.bottom=-10; sc.near=1; sc.far=60;
  key.shadow.bias = -0.0008; key.shadow.normalBias = 0.03; key.shadow.radius = 4;
  scene.add(key); scene.add(key.target);
  const rim = new THREE.DirectionalLight(0xbfe0ff, 1.6);   // from behind-top: cool rim
  rim.position.set(4, 8, -12);
  scene.add(rim); scene.add(rim.target);
  const fill = new THREE.DirectionalLight(0xffe2f0, 0.45); // soft pinkish bounce from front-right-low
  fill.position.set(8, 2, 12);
  scene.add(fill); scene.add(fill.target);
  G.lights = { hemi, key, rim, fill };

  applyQuality();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=> setTimeout(resize, 120));
  if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();
  return true;
};

let viewW = 1, viewH = 1;
function resize(){
  if(!G.renderer) return;
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  viewW = w; viewH = h;
  G.renderer.setSize(w, h, false);
  G.renderer.domElement.style.width = w+'px';
  G.renderer.domElement.style.height = h+'px';
  G.camera.aspect = w/h;
  G.camera.updateProjectionMatrix();
  G.view = { w, h, portrait: h>w };
  G.cam && G.cam.recalc();
  G.bus.emit('resize', G.view);
}
G.resize = resize;
G.view = { w:1, h:1, portrait:false };

// world → CSS pixel projection (for DOM popups / bars)
const _pv = new THREE.Vector3();
G.toScreen = (x,y,z,out)=>{
  out = out || {};
  _pv.set(x,y,z).project(G.camera);
  out.x = (_pv.x*0.5+0.5)*viewW;
  out.y = (-_pv.y*0.5+0.5)*viewH;
  out.visible = _pv.z<1 && _pv.x>-1.2 && _pv.x<1.2 && _pv.y>-1.3 && _pv.y<1.3;
  return out;
};

// ---------------------------------------------------------------- camera controller
const VFOV = 30, PITCH = 17*Math.PI/180;
G.cam = {
  x:0, y:1.1, z:0,           // current look target
  tx:0, ty:1.1, tz:0,        // desired
  dist:16, halfW:7,
  followEnt:null, lockMin:-1e9, lockMax:1e9,
  shakeP:0, shakeT:0, shakeMax:1,
  punch:0, punchT:0, punchMax:1,
  focusT:0, fx:0, fy:0, fz:0, focusZoom:0,
  zoom:0,                    // extra zoom in (units closer), e.g. boss fights zoom out with negative
  recalc(){
    // keep a comfortable visible width at the belt plane: wider in landscape, tighter in portrait
    const aspect = G.camera.aspect;
    const wantW = aspect>=1 ? U.clamp(10.5 + (aspect-1)*4.2, 10.5, 15) : U.clamp(8.2*aspect/0.56, 6.5, 9.5);
    const tanV = Math.tan(VFOV*Math.PI/360);
    const d = (wantW/2)/(tanV*aspect);
    this.baseDist = U.clamp(d, 10, 30);
    this.halfW = wantW/2;
  },
  follow(ent){ this.followEnt = ent; },
  lock(a,b){ this.lockMin=a; this.lockMax=b; },
  unlock(){ this.lockMin=-1e9; this.lockMax=1e9; },
  shake(power, frames){ if(power>=this.shakeP*(this.shakeT/Math.max(1,this.shakeMax))){ this.shakeP=power; this.shakeT=frames; this.shakeMax=frames; } },
  kick(power, frames){ this.punch=power; this.punchT=frames; this.punchMax=frames; },
  focus(x,y,z,frames,zoom){ this.fx=x; this.fy=y; this.fz=z; this.focusT=frames; this.focusZoom=zoom||0; },
  snap(){ this.frame(1, true); },
  // world x range currently visible at the belt plane (for spawns / locks)
  // fraction of halfW hidden on the right by the touch buttons (phones in landscape)
  rightCover(){
    if(G.view && G.view.portrait) return 0;
    const t = G.ui && G.ui.touch;
    const on = t && typeof t.visible==='boolean' ? t.visible : (G.input && G.input.lastDevice==='touch');
    return on ? 0.5 : 0;
  },
  // clear transient effects (a new scene must not inherit a boss-intro focus, shake or punch)
  reset(){ this.focusT = 0; this.focusZoom = 0; this.shakeT = 0; this.shakeP = 0; this.punchT = 0; this.zoom = 0; },
  // world width that is actually usable (not under the touch buttons)
  usableW(){ return this.halfW * (2 - this.rightCover()); },
  // reused array: read it right away, don't keep it
  viewRange(){ const r = this._vr || (this._vr = [0,0]); r[0] = this.x - this.halfW; r[1] = this.x + this.halfW; return r; },
  frame(dt, snap){
    const e = this.followEnt;
    if(e){
      const look = e.face*0.9 + this.halfW*this.rightCover()*0.5;
      this.tx = e.x + look; this.ty = 1.05 + Math.max(0, e.y*0.35); this.tz = U.lerp(-0.2, e.z, 0.35);
    }
    // camera centre must keep the lock range fully on screen (and out from under the touch buttons)
    const rc = this.rightCover();
    const lo = this.lockMax - this.halfW*(1-rc), hi = this.lockMin + this.halfW;
    if(this.lockMin > -1e8){ this.tx = lo<=hi ? U.clamp(this.tx, lo, hi) : U.clamp(this.tx, hi, lo); }
    const stg = G.stage && G.stage.info;
    if(stg){ this.tx = U.clamp(this.tx, this.halfW-1, Math.max(this.halfW-1, stg.length - this.halfW + 1)); }
    let gx=this.tx, gy=this.ty, gz=this.tz, zoom=this.zoom;
    const kf = snap ? 0 : dt*60;
    if(this.focusT>0){ this.focusT -= kf; gx=this.fx; gy=this.fy; gz=this.fz; zoom += this.focusZoom; }
    if(snap){ this.x=gx; this.y=gy; this.z=gz; this.zc = zoom; }
    else { this.x=U.damp(this.x,gx,5.5,dt); this.y=U.damp(this.y,gy,4,dt); this.z=U.damp(this.z,gz,3,dt); this.zc=U.damp(this.zc||0, zoom, 2.5, dt); }
    let d = (this.baseDist||16) - this.zc;
    // visible half-width at the belt plane follows the real distance (boss fights zoom out)
    this.halfW = Math.tan(VFOV*Math.PI/360) * G.camera.aspect * d;
    if(this.punchT>0){ d -= this.punch*Math.sin(Math.PI*U.clamp(this.punchT/this.punchMax,0,1)); this.punchT -= kf; }
    let sx=0, sy=0;
    if(this.shakeT>0){
      const k = this.shakeP*U.clamp(this.shakeT/this.shakeMax,0,1);
      sx = (Math.random()*2-1)*k*0.12; sy = (Math.random()*2-1)*k*0.09;
      this.shakeT -= kf;
    }
    const cam = G.camera;
    cam.position.set(this.x + sx, this.y + Math.sin(PITCH)*d + sy, this.z + Math.cos(PITCH)*d);
    cam.lookAt(this.x + sx*0.5, this.y + sy*0.5, this.z);
    // shadow camera follows the view
    const L = G.lights;
    if(L){
      L.key.target.position.set(this.x, 0, this.z);
      L.key.position.set(this.x-6, 14, this.z+10);
      L.rim.target.position.set(this.x, 0.8, this.z);
      L.rim.position.set(this.x+4, 8, this.z-12);
      L.fill.target.position.set(this.x, 0.8, this.z);
      L.fill.position.set(this.x+8, 2, this.z+12);
    }
  },
};

// ---------------------------------------------------------------- input
const BTNS = ['attack','jump','dodge','special','ult','pause','confirm'];
const KEYS = {
  attack:['KeyJ','KeyZ'], jump:['KeyK','Space'], dodge:['KeyL','ShiftLeft','ShiftRight'],
  special:['KeyI','KeyX'], ult:['KeyU','KeyC'], pause:['KeyP','Escape'], confirm:['Enter','NumpadEnter'],
};
const MOVE = { left:['ArrowLeft','KeyA'], right:['ArrowRight','KeyD'], up:['ArrowUp','KeyW'], down:['ArrowDown','KeyS'] };
const keyDown = Object.create(null);
const latch = Object.create(null);
const inp = G.input = {
  x:0, z:0, btn:{}, touch:{ x:0, z:0 }, pad:{ x:0, z:0 }, lastDevice: isTouch ? 'touch' : 'key',
  // UI calls this on touch/pointer down so a tap shorter than one tick still counts
  latch(btn){ latch[btn] = true; },
  anyPressed(){ for(const b of BTNS){ if(inp.btn[b].pressed) return true; } return false; },
  // a pad/touch button still physically held stays "down", so letting go of it later
  // is not mistaken for a new press (START on the pause menu used to re-pause at once)
  clear(){ for(const b of BTNS){ const s=inp.btn[b]; s.down = !!inp.pad[b] || !!inp.touch[b]; s.pressed=s.released=false; s.held=0; latch[b]=false; }
           for(const k in keyDown) keyDown[k]=false; },
};
for(const b of BTNS){ inp.btn[b] = { down:false, pressed:false, released:false, held:0 }; inp.touch[b]=false; inp.pad[b]=false; }

const codeToBtn = {};
for(const b in KEYS) for(const c of KEYS[b]) codeToBtn[c]=b;
const moveCodes = new Set([].concat(MOVE.left,MOVE.right,MOVE.up,MOVE.down));
window.addEventListener('keydown', (e)=>{
  const c = e.code;
  if(codeToBtn[c] || moveCodes.has(c)){
    // keep the page from scrolling / buttons from being "clicked" by space
    if(!(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA'))) e.preventDefault();
  }
  if(!e.repeat && codeToBtn[c]) latch[codeToBtn[c]] = true;
  keyDown[c] = true; inp.lastDevice = 'key';
  if(G.audio && G.audio.unlock) G.audio.unlock();
}, {passive:false});
window.addEventListener('keyup', (e)=>{ keyDown[e.code] = false; });
window.addEventListener('blur', ()=>{ for(const k in keyDown) keyDown[k]=false; for(const b of BTNS) inp.touch[b]=false; inp.touch.x=0; inp.touch.z=0; });
const kd = (list)=> list.some(c=>keyDown[c]);

function pollPad(){
  const p = inp.pad; p.x=0; p.z=0; for(const b of BTNS) p[b]=false;
  if(!navigator.getGamepads) return;
  let pads; try { pads = navigator.getGamepads(); } catch(_){ return; }
  if(!pads) return;
  for(const gp of pads){
    if(!gp || !gp.connected) continue;
    const ax = gp.axes[0]||0, az = gp.axes[1]||0;
    if(Math.abs(ax)>0.2) p.x = ax;
    if(Math.abs(az)>0.2) p.z = az;
    const b = (i)=> gp.buttons[i] && gp.buttons[i].pressed;
    if(b(14)) p.x=-1; if(b(15)) p.x=1; if(b(12)) p.z=-1; if(b(13)) p.z=1;
    p.attack = b(2); p.jump = b(0); p.dodge = b(1) || b(4); p.special = b(3);
    p.ult = b(5) || b(7); p.pause = b(9); p.confirm = b(0) || b(9);
    if(p.attack||p.jump||p.x||p.z) inp.lastDevice='pad';
    break;
  }
}

function updateInput(){
  pollPad();
  let x = 0, z = 0;
  if(kd(MOVE.left)) x -= 1; if(kd(MOVE.right)) x += 1;
  if(kd(MOVE.up)) z -= 1;   if(kd(MOVE.down)) z += 1;
  x += inp.touch.x + inp.pad.x; z += inp.touch.z + inp.pad.z;
  inp.x = U.clamp(x,-1,1); inp.z = U.clamp(z,-1,1);
  for(const b of BTNS){
    const s = inp.btn[b];
    const down = kd(KEYS[b]) || !!inp.touch[b] || !!inp.pad[b];
    s.pressed = !!latch[b] || (down && !s.down);
    s.released = !down && s.down;
    s.down = down;
    s.held = down ? s.held+1 : 0;
    latch[b] = false;
  }
}

// ---------------------------------------------------------------- entities & world
let _id = 1;
G.makeEnt = function(o){
  const e = Object.assign({
    id:_id++, kind:'prop', type:'', team:2,
    x:0,y:0,z:0, vx:0,vy:0,vz:0, px:0,py:0,pz:0, face:1, onGround:true,
    radius:0.4, height:1.2, weight:1, gravScale:1,
    hp:1, maxHp:1, dead:false,
    state:'idle', stateT:0,
    anim:'idle', animT:0, animLen:0, animHit:0.35,
    atk:null, inv:0, stun:0, flashT:0, hurtDir:1, armor:0, charge:0,
    bounce:0, entered:true, noClamp:false, removeMe:false,
    rig:null, shadow:null,
  }, o||{});

  }),

// ---------------------------------------------------------------- part builder: merge many primitives into one vertex-coloured geometry
const _m4 = new THREE.Matrix4(), _n3 = new THREE.Matrix3(), _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _c = new THREE.Color();
class PartBuilder {
  constructor(){ this.parts = []; }
  // add(geometry, color, [x,y,z], [rx,ry,rz], [sx,sy,sz] | number)
  add(g, color, pos, rot, scl){
    const m = new THREE.Matrix4();
    _e.set(rot?rot[0]:0, rot?rot[1]:0, rot?rot[2]:0);
    _q.setFromEuler(_e);
    if(scl==null) _s.set(1,1,1); else if(typeof scl==='number') _s.set(scl,scl,scl); else _s.set(scl[0],scl[1],scl[2]);
    m.compose(_v.set(pos?pos[0]:0, pos?pos[1]:0, pos?pos[2]:0), _q, _s);
    this.parts.push({ g, color, m });
    return this;
  }
  addMatrix(g, color, matrix){ this.parts.push({ g, color, m: matrix.clone() }); return this; }
  get empty(){ return this.parts.length===0; }
  build(){
    let nv = 0, ni = 0;
    for(const p of this.parts){ nv += p.g.attributes.position.count; ni += p.g.index ? p.g.index.count : p.g.attributes.position.count; }
    const pos = new Float32Array(nv*3), nor = new Float32Array(nv*3), col = new Float32Array(nv*3);
    const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
    let vo = 0, io = 0;
    for(const p of this.parts){
      const P = p.g.attributes.position, N = p.g.attributes.normal;
      _n3.getNormalMatrix(p.m);
      // mirrored matrices flip winding
      const flip = p.m.determinant() < 0;
      _c.set(p.color);
      for(let i=0;i<P.count;i++){
        _v.fromBufferAttribute(P,i).applyMatrix4(p.m);
        pos[(vo+i)*3]=_v.x; pos[(vo+i)*3+1]=_v.y; pos[(vo+i)*3+2]=_v.z;
        if(N){ _v.fromBufferAttribute(N,i).applyMatrix3(_n3).normalize(); nor[(vo+i)*3]=_v.x; nor[(vo+i)*3+1]=_v.y; nor[(vo+i)*3+2]=_v.z; }
        col[(vo+i)*3]=_c.r; col[(vo+i)*3+1]=_c.g; col[(vo+i)*3+2]=_c.b;
      }
      if(p.g.index){
        const I = p.g.index.array;
        for(let k=0;k<I.length;k+=3){
          if(flip){ idx[io++]=I[k]+vo; idx[io++]=I[k+2]+vo; idx[io++]=I[k+1]+vo; }
          else { idx[io++]=I[k]+vo; idx[io++]=I[k+1]+vo; idx[io++]=I[k+2]+vo; }
        }
      } else {
        for(let k=0;k<P.count;k+=3){
          if(flip){ idx[io++]=vo+k; idx[io++]=vo+k+2; idx[io++]=vo+k+1; }
          else { idx[io++]=vo+k; idx[io++]=vo+k+1; idx[io++]=vo+k+2; }
        }
      }
      vo += P.count;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    g.setIndex(new THREE.BufferAttribute(idx,1));
    g.computeBoundingSphere();
    return g;
  }
  // convenience: build → Mesh with a (shared or given) vertex-colour material, optional outline child
  mesh(opts){
    opts = opts || {};
    const g = this.build();
    const mat = opts.material || G.look.vmat(opts);
    const mesh = new THREE.Mesh(g, mat);
    mesh.castShadow = opts.castShadow!==false; mesh.receiveShadow = !!opts.receiveShadow;
    if(opts.outline!==false && opts.outline!==0) G.look.outline(mesh, opts.outline==null ? 0.022 : opts.outline, opts.outlineColor);
    return mesh;
  }
}

  },

function mergeColored(list){
  let nv=0, ni=0;
  for(const it of list){ nv += it.g.attributes.position.count; ni += it.g.index ? it.g.index.count : it.g.attributes.position.count; }
  const pos = new Float32Array(nv*3), nor = new Float32Array(nv*3), col = new Float32Array(nv*3);
  const idx = new Uint16Array(ni); const v = new THREE.Vector3(), n3 = new THREE.Matrix3(), c = new THREE.Color();
  let vo=0, io=0;
  for(const it of list){
    const P = it.g.attributes.position, N = it.g.attributes.normal, C = it.g.attributes.color;
    n3.getNormalMatrix(it.m); const flip = it.m.determinant()<0;
    if(it.color!=null) c.set(it.color);
    for(let i=0;i<P.count;i++){
      v.fromBufferAttribute(P,i).applyMatrix4(it.m); pos.set([v.x,v.y,v.z], (vo+i)*3);
      v.fromBufferAttribute(N,i).applyMatrix3(n3).normalize(); nor.set([v.x,v.y,v.z], (vo+i)*3);
      if(it.color!=null) col.set([c.r,c.g,c.b], (vo+i)*3);
      else if(it.recolor){ const r=C.getX(i), g=C.getY(i), bb=C.getZ(i); const dark = r+g+bb < 0.5; if(dark){ c.set(it.recolor); col.set([c.r,c.g,c.b],(vo+i)*3); } else col.set([r,g,bb],(vo+i)*3); }
      else col.set([C.getX(i),C.getY(i),C.getZ(i)], (vo+i)*3);
    }
    const I = it.g.index.array;
    for(let k=0;k<I.length;k+=3){ idx[io++]=I[k]+vo; idx[io++]=flip?I[k+2]+vo:I[k+1]+vo; idx[io++]=flip?I[k+1]+vo:I[k+2]+vo; }
    vo += P.count;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeBoundingSphere();
  return g;
}

// ---------------------------------------------------------------- body layout (units at scale 1; guard8 is scaled ×1.25 as a whole)
const L = {
  hipY: 0.21,            // leg + hips pivot height
  bodyC: 0.15,           // body centre above hips pivot
  neckY: 0.36,           // head pivot above hips pivot
  headC: 0.30,           // head centre above neck
  headR: 0.36,
  headS: [1.0, 0.92, 1.06],
  shoulder: [0.0, 0.27, 0.185],
  legZ: 0.095,
  hand: [0.012, -0.175, 0],
};
// point on the head ellipsoid (head-pivot space) + a rotation that points local +z along the surface normal
function onHead(az, el, lift, R){
  R = R || L.headR; const s = L.headS, k = 1 + (lift||0);
  const ce = Math.cos(el);
  return [ R*s[0]*ce*Math.cos(az)*k, L.headC + R*s[1]*Math.sin(el)*k, R*s[2]*ce*Math.sin(az)*k ];
}
function faceRot(az, el, spin){ return [ -el, HP - az, spin||0 ]; }   // use with order 'YXZ'

function part(D, name){ return D[name] || (D[name] = B()); }

function buildCommon(D, T){
  const geo = G.look.geo;
  // legs (pivot at hip joint)
  for(const side of [-1,1]){
    const b = part(D, side<0?'legL':'legR');
    b.add(geo.capsule(0.072, 0.06, 3, 10), T.leg, [0,-0.085,0]);
    b.add(geo.sphere(0.08,10,7), T.foot||T.leg, [0.03,-0.165,0], null, [1.35,0.72,1.08]);
  }
  // body bean (pivot = hips)
  const bs = T.bodyScale || [0.95,1.08,0.98];
  if(!T.noBean) part(D,'body').add(geo.sphere(0.215, 18, 12), T.body, [0, L.bodyC, 0], null, bs);
  // arms (pivot at shoulder)
  for(const side of [-1,1]){
    const b = part(D, side<0?'armL':'armR');
    b.add(geo.capsule(0.058, 0.07, 3, 8), T.sleeve||T.fur, [0,-0.07,0]);
    b.add(geo.sphere(T.pawR||0.072,10,7), T.paw||T.fur, [0.012,-0.165,0]);
  }
  // head (pivot at neck)
  const h = part(D,'head');
  h.add(geo.sphere(L.headR, 24, 16), T.fur, [0, L.headC, 0], null, L.headS);
  const mz = T.muzzleScale || [0.9,0.72,1.12];
  const mp = onHead(0, -0.36, -0.2);
  if(T.muzzleFwd) mp[0] += T.muzzleFwd;
  h.add(geo.sphere(0.13, 14, 10), T.muzzle, mp, null, mz);
  D.a.muzzle = mp; D.a.muzzleFront = mp[0] + 0.13*mz[0];
  // face details without outline: nose, ω mouth, blush
  const f = part(D,'face');
  const nx = D.a.muzzleFront - 0.012, ny = mp[1] + 0.13*mz[1]*0.55;
  f.add(geo.sphere(0.042, 10, 7), T.nose||'#2a1a14', [nx, ny, 0], null, [0.85,0.72,1.15]);
  f.add(geo.sphere(0.012, 6, 4), '#ffffff', [nx+0.025, ny+0.02, 0.012]);     // nose shine
  const my = mp[1] - 0.012;
  for(const s of [-1,1]) f.add(G.look.geo.torus(0.02, 0.0065, 5, 10, Math.PI), T.mouthCol||'#4a2418',
    [D.a.muzzleFront - 0.028, my, s*0.02], [0, HP, Math.PI]);
  f.add(geo.cylinder(0.006,0.006,0.035,5), T.mouthCol||'#4a2418', [D.a.muzzleFront-0.02, my+0.028, 0]);
  D.a.mouthPos = [D.a.muzzleFront - 0.03, my - 0.012, 0];
  const bl = G.look.blush(0.072); const blGeo = bl.geometry;   // same shape/colour as G.look.blush, baked (no extra draw call)
  for(const s of [-1,1]){
    const az = s*(T.blushAz||0.98), el = T.blushEl==null ? -0.24 : T.blushEl;
    f.add(blGeo, T.blush||'#ff9fb5', onHead(az, el, -0.012), faceRot(az, el), [1.25,0.62,0.3], 'YXZ');
  }
  // eye placement (used by the eye meshes built in buildEyes)
  D.a.eyeAz = T.eyeAz || 0.40; D.a.eyeEl = T.eyeEl==null ? -0.02 : T.eyeEl; D.a.eyeSize = T.eye || 0.05;
  D.a.eyeY = onHead(0, D.a.eyeEl, 0)[1];
}

// both eyes (+ expression variants) in one mesh each, pivot at eye height so scale.y blinks them
function buildEyes(D, T){
  const a = D.a, y0 = a.eyeY, sz = a.eyeSize, list = [];
  const dark = T.lineCol || '#3a2418';
  const eyeG = G.look.eye(sz).geometry;
  const skip = T.patchEye;   // +1 / -1: that eye is covered (eyepatch)
  const place = (s, extra)=>{
    const az = s*a.eyeAz, el = a.eyeEl, p = onHead(az, el, extra==null?-0.02:extra);
    p[1] -= y0; return M(p, faceRot(az, el), null, 'YXZ');
  };
  for(const s of [-1,1]){ if(s===skip) continue; list.push({ g:eyeG, m:place(s), recolor:T.eyeCol||null }); }
  if(T.lashes){ for(const s of [-1,1]){ const m = place(s, 0.0).multiply(M([s*-sz*0.2, sz*0.95, 0],[0,0,s*-0.9],[1,1,1]));
    list.push({ g:G.look.geo.capsule(0.009, sz*0.55, 2, 5), m, color:dark }); } }
  D.eyesGeo = mergeColored(list);
  eyeG.dispose();
  // × eyes (dizzy / down / ko), > < squeezed (hurt / charge), ^ ^ happy
  const cap = G.look.geo.capsule(0.011, sz*1.35, 2, 6), capS = G.look.geo.capsule(0.011, sz*1.05, 2, 6);
  const arc = G.look.geo.torus(sz*0.85, 0.013, 5, 10, Math.PI);
  const X = B(), S = B(), H = B();
  for(const s of [-1,1]){
    if(s===skip) continue;
    const base = place(s, 0.005);
    X.addM(cap, dark, base.clone().multiply(M([0,0,0],[0,0, 0.78])));
    X.addM(cap, dark, base.clone().multiply(M([0,0,0],[0,0,-0.78])));
    // chevrons point toward the middle of the face (eye local +x = viewer's right)
    const dir = s>0 ? -1 : 1;
    S.addM(capS, dark, base.clone().multiply(M([0, sz*0.36, 0],[0,0, dir*-0.62])));
    S.addM(capS, dark, base.clone().multiply(M([0,-sz*0.36, 0],[0,0, dir* 0.62])));
    H.addM(arc, dark, base.clone().multiply(M([0,-sz*0.35,0],[0,0,0])));
  }
  D.xGeo = X.build(); D.sqGeo = S.build(); D.happyGeo = H.build();
  // open mouth (yell / hurt / cheer)
  const mo = B(), mp = a.mouthPos;
  mo.add(G.look.geo.sphere(0.05, 10, 7), '#6b1e24', [0, 0, 0], [0,0,0], [0.45,0.62,0.8]);
  mo.add(G.look.geo.sphere(0.03, 10, 6), '#ff7d8f', [0.01, -0.018, 0], [0,0,0], [0.45,0.5,0.9]);
  D.mouthGeo = mo.build();
}

// ---- shared accessory makers
function earsOf(D, type, col, col2, opt){
  const geo = G.look.geo; opt = opt || {};
  for(const s of [-1,1]){
    const b = part(D, s<0?'earL':'earR');
    if(type==='flop'){          // fluffy floppy ears (poodle-ish)
      b.add(geo.sphere(0.12,10,7), col, [0.0,-0.15, s*0.03], [s*-0.12,0,0], [0.62,1.45,0.5]);
      b.add(geo.sphere(0.07, 8, 6), col2, [0.02,-0.27, s*0.04]);
      b.add(geo.sphere(0.06, 8, 6), col2, [-0.05,-0.25, s*0.03]);
    } else if(type==='long'){   // long flat dachshund ears
      b.add(geo.sphere(0.11,10,7), col, [0.0,-0.18, s*0.02], [s*-0.08,0,0.1], [0.7,1.95,0.38]);
    } else if(type==='hair'){   // long silky maltese hair
      b.add(geo.sphere(0.13,10,7), col, [0.0,-0.19, s*0.03], [s*-0.1,0,0.05], [0.72,1.8,0.52]);
      b.add(geo.sphere(0.075, 8, 6), col2, [0.01,-0.36, s*0.04]);
    } else if(type==='curly'){  // poodle curls
      const pts = [[0,-0.06],[0.02,-0.16],[-0.03,-0.2],[0.03,-0.27],[-0.02,-0.3]];
      pts.forEach((q,i)=> b.add(geo.sphere(i?0.068:0.075, 10, 7), i%2?col2:col, [q[0], q[1], s*0.035]));
    } else if(type==='up'){     // huge upright chihuahua ears
      const len = opt.len || 0.42;
      b.add(geo.cone(0.14, len, 14), col, [0, len*0.5, 0], [s*0.32, 0, 0], [0.42,1,1]);
      b.add(geo.cone(0.1, len*0.78, 12), opt.inner||'#f4b0c4', [0.03, len*0.43, s*0.0], [s*0.32, 0, 0], [0.3,1,1]);
    }
  }
  D.a.earType = type;
  D.a.earPivot = opt.pivot || (type==='up' ? onHead(0.95, 0.72, -0.12) : onHead(1.3, 0.42, -0.04));
}
function tailOf(D, type, col, col2){

// on-head accessory helper: matrix that sits on the head surface, local +z = outward normal
function headM(az, el, lift, extraRot, scl){
  const m = M(onHead(az, el, lift), faceRot(az, el), null, 'YXZ');
  if(extraRot || scl) m.multiply(M([0,0,0], extraRot, scl));
  return m;
}

const PARTS = ['body','head','face','armL','armR','legL','legR','tail','earL','earR','cape','weapon','glasses','gem'];
function getModel(id){
  if(MODEL[id]) return MODEL[id];
  const T = DESIGN[id], D = { a:{}, T };
  buildCommon(D, T); T.build(D); buildEyes(D, T);
  const geos = {};
  for(const k of PARTS){ if(D[k] && !D[k].empty){ geos[k] = D[k].build(); } }
  geos.eyes = D.eyesGeo; geos.eyesX = D.xGeo; geos.eyesSq = D.sqGeo; geos.eyesHappy = D.happyGeo; geos.mouth = D.mouthGeo;
  for(const k in geos) geos[k].userData.shared = true;     // cached per hero, shared by every rig of that hero
  return (MODEL[id] = { geos, a:D.a, T });
}

// ---------------------------------------------------------------- shared small meshes' geometry/materials (lazy)
let SH = null;
function shared(){
  if(SH) return SH;
  const geo = G.look.geo;
  const sb = B();
  for(let i=0;i<3;i++){ const a = i/3*TAU; sb.add(geo.star(0.075,0.5,0.03), i===1?'#ffffff':'#ffe14d', [Math.cos(a)*0.3, Math.sin(a*2)*0.03, Math.sin(a)*0.3], [0, -a, 0]); }
  const starsGeo = sb.build(); starsGeo.userData.shared = true;
  SH = {
    starsGeo,
    starsMat: G.look.mat('#ffffff', { vertexColors:true, emissive:'#ffb400', emissiveIntensity:0.55, rough:0.4 }),
    haloGeo: geo.torus(0.17, 0.028, 6, 20),
    haloMat: G.look.mat('#ffd54a', { emissive:'#ffb000', emissiveIntensity:0.9, rough:0.3, metal:0.2, rim:0.6 }),
    gemMat: G.look.vmat({ emissive:'#ff5fb4', emissiveIntensity:0.55, rough:0.35 }),
    eyeMat: G.look.vmat({ rough:0.25, rim:0.2 }),       // same shared material G.look.eye uses
    faceMat: G.look.vmat({ rough:0.85, rim:0.15 }),
    glassMat: G.look.vmat({ rough:0.2, metal:0.1, rim:0.5 }),
  };
  return SH;
}
const glowMats = {};
function weaponGlowMat(col){ return glowMats[col] || (glowMats[col] = G.look.vmat({ emissive:col, emissiveIntensity:0.7, rough:0.35 })); }

// ---------------------------------------------------------------- rig
const COM = 0.55;          // roll pivot height (centre of mass), unscaled
const TURN = 0.61;         // 35° toward the camera
const HEADTURN = 0.22;     // the head looks a little more toward the camera
const AIMS = { atk1:1, atk2:1, atk3:1, atk4:1, chargeAtk:1, airAtk:1, airAtk2:1, dive:1, special:1, specialUp:0.6, specialDash:1, charge:0.6, run:0.45 };
function grp(parent, x, y, z){ const g = new THREE.Group(); g.position.set(x||0, y||0, z||0); if(parent) parent.add(g); return g; }

function build(id, opts){
  opts = opts || {};
  const hero = BYID[id] || BYID.inu; id = hero.id;
  const md = getModel(id), a = md.a, T = md.T, gs = md.geos, sh = shared();
  const scale = hero.scale || 1;
  const mat = G.look.vmat({ instance:true });                       // per-rig: hit flash, charge glow, fade
  const mesh = (geoName, parent, material, outline, shadow)=>{
    const m = new THREE.Mesh(gs[geoName], material || mat);
    m.castShadow = !!shadow; m.receiveShadow = false;
    if(outline) G.look.outline(m, outline);
    parent.add(m); return m;
  };
  const root = new THREE.Group(); root.name = 'hero-'+id;
  const mir = grp(root);  mir.scale.setScalar(scale);
  const yaw = grp(mir);
  const act = grp(yaw, 0, COM, 0);
  const sq = grp(act, 0, -COM, 0);
  const hips = grp(sq, 0, L.hipY, 0);
  const body = mesh('body', hips, null, 0.022, true);
  const legL = grp(sq, 0, L.hipY, -L.legZ), legR = grp(sq, 0, L.hipY, L.legZ);
  mesh('legL', legL, null, 0.02, false); mesh('legR', legR, null, 0.02, false);
  const neck = grp(hips, 0, L.neckY, 0);
  const head = mesh('head', neck, null, 0.022, true);
  mesh('face', neck, sh.faceMat, 0, false);
  const eyeP = grp(neck, 0, a.eyeY, 0);
  const eyes = mesh('eyes', eyeP, sh.eyeMat, 0, false);
  const eyesX = mesh('eyesX', eyeP, sh.eyeMat, 0, false); eyesX.visible = false;
  const eyesSq = mesh('eyesSq', eyeP, sh.eyeMat, 0, false); eyesSq.visible = false;
  const eyesHappy = mesh('eyesHappy', eyeP, sh.eyeMat, 0, false); eyesHappy.visible = false;
  const mouth = mesh('mouth', neck, sh.faceMat, 0, false); mouth.visible = false; mouth.position.set(a.mouthPos[0], a.mouthPos[1], 0);
  const mouthC = new THREE.Vector3(a.mouthPos[0], a.mouthPos[1], 0);
  let glasses = null;
  if(gs.glasses){ glasses = grp(eyeP); mesh('glasses', glasses, sh.glassMat, 0.012, false); }
  const sp = L.shoulder;
  const armL = grp(hips, sp[0], sp[1], -sp[2]), armR = grp(hips, sp[0], sp[1], sp[2]);
  mesh('armL', armL, null, 0.02, false); mesh('armR', armR, null, 0.02, false);
  const handR = grp(armR, L.hand[0], L.hand[1], L.hand[2]);
  const tip = new THREE.Object3D(), base = new THREE.Object3D();
  let wpn = null, gem = null;
  if(gs.weapon){
    wpn = grp(handR);
    mesh('weapon', wpn, T.weaponGlow ? weaponGlowMat(T.weaponGlow) : mat, 0.013, true);
    tip.position.fromArray(a.tip); base.position.fromArray(a.wbase);
    wpn.add(tip); wpn.add(base);
    if(gs.gem){ gem = grp(wpn, a.gemPos[0], a.gemPos[1], a.gemPos[2]); mesh('gem', gem, sh.gemMat, 0.01, false); }
  } else {                                   // bare paws: trail from the paw centre to the knuckles
    base.position.set(L.hand[0], L.hand[1]+0.03, 0); tip.position.set(L.hand[0]+0.02, L.hand[1]-0.07, 0);
    armR.add(base); armR.add(tip);
  }
  let earL = null, earR = null;
  if(gs.earL){ const p = a.earPivot;
    earL = grp(neck, p[0], p[1], -p[2]); earR = grp(neck, p[0], p[1], p[2]);
    mesh('earL', earL, null, 0.016, false); mesh('earR', earR, null, 0.016, false); }
  let tail = null;
  if(gs.tail){ const p = a.tailPivot; tail = grp(hips, p[0], p[1], p[2]); mesh('tail', tail, null, 0.016, false); }
  let cape = null;
  if(gs.cape){ const p = a.capePivot; cape = grp(hips, p[0], p[1], p[2]); mesh('cape', cape, null, 0.018, true); }
  const n_ = (g)=> g ? g.children[0] : null;
  let halo = null;
  if(T.halo){ halo = new THREE.Mesh(sh.haloGeo, sh.haloMat); halo.rotation.x = HP; halo.position.set(-0.02, L.headC+0.47, 0); halo.castShadow = false; neck.add(halo); }
  const stars = new THREE.Mesh(sh.starsGeo, sh.starsMat); stars.position.set(0, L.headC+0.42, 0); stars.visible = false; neck.add(stars);

  const rig = {
    root, heroId:id, style:hero.weapon, earType:a.earType||null, height:1.25*scale + (T.halo?0.08:0), radius:0.42*scale, scale,
    tip, base, mat,
    n:{ mir, yaw, act, sq, hips, body, head, neck, legL, legR, armL, armR, handR, wpn, gem, eyeP, eyes, eyesX, eyesSq, eyesHappy,
        mouth, glasses, earL, earR, tail, cape, halo, stars },
    mouthC,
    st: makeState(hero.weapon),
    alpha: 1,
    update(ent, dt){ updateRig(rig, ent, dt==null ? G.cfg.TICK : dt); },
    setAlpha(v){ setAlpha(rig, v); },
    dispose(){
      if(root.parent) root.parent.remove(root);
      mat.dispose();                                   // the only thing this rig created for itself (geometry is cached per hero)
      rig.disposed = true;
    },
  };
  // meshes on shared materials can't fade: they hide instead when the rig is mostly transparent
  rig.outlines = []; rig.sharedMeshes = [];
  root.traverse(o=>{ if(!o.isMesh) return; if(o.userData.isOutline) rig.outlines.push(o);
    else if(o.material!==mat && o!==eyes && o!==eyesX && o!==eyesSq && o!==eyesHappy && o!==mouth && o!==stars) rig.sharedMeshes.push(o); });
  // top of the head (incl. hat / ears / halo) in the idle pose, for HP bars and popups
  rig._measure = [head, n_(earL), n_(earR), halo];
  // default fists: tip follows the paw; kicks move it to the foot (see updateRig)
  rig.tipHome = tip.parent; rig.footTip = grp(legR, 0.1, -0.17, 0); rig.footBase = grp(legR, 0.0, -0.06, 0);
  // settle once so a freshly built rig already stands in its idle pose
  updateRig(rig, { anim:'idle', animT:0, animLen:0, animHit:0.35, face:1, vx:0, vy:0, vz:0, onGround:true, flashT:0, stun:0, charge:0 }, G.cfg.TICK, true);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();

    K(0.5,{sq:0.07, lean:-0.16, fx:-0.05, nod:0.15, aLz:1.0, aRz:1.0, aLx:0.6, aRx:0.6, mouth:0.6}),
    K(1,Z)],
  getup: [K(0,{roll:HP, y:-0.14, aLz:2.3, aRz:2.0, lLz:0.4, lRz:0.2}),
    K(0.35,{roll:0.95, y:-0.1, aLz:0.4, aRz:0.4, lLz:0.9, lRz:0.9, sq:-0.1}),
    K(0.62,{roll:-0.08, y:0.12, sq:0.16, aLz:2.3, aRz:2.2, aLx:0.6, aRx:0.6},'out'),
    K(0.8,{sq:-0.16, y:0}),
    K(1,Z)],
  ko: [K(0,Z),
    K(0.14,{sq:-0.22, lean:-0.3, nod:0.4, mouth:1, aLz:2.0, aRz:1.8}),
    K(0.42,{roll:1.8, y:-0.06, aLz:2.6, aRz:2.4, lLz:0.8, lRz:0.6},'in'),
    K(0.58,{roll:1.4, y:0.06, aLz:2.2, aRz:2.2, lLz:0.6, lRz:0.3},'out'),
    K(0.74,{roll:HP+0.04, y:-0.15, sq:-0.08, aLz:2.5, aRz:2.3, lLz:0.4, lRz:0.2},'in'),
    K(1,{roll:HP, y:-0.14, aLz:2.4, aRz:2.2, aLx:0.8, aRx:0.8, lLz:0.4, lRz:0.2})],
  dodge: [K(0,Z),
    K(0.12,{sq:-0.2, lean:0.3, aLz:1.6, aRz:1.4, aLx:0.1, aRx:0.1, lLz:0.9, lRz:0.9, y:-0.1}),
    K(0.8,{sq:-0.2, lean:0.3, aLz:1.6, aRz:1.4, aLx:0.1, aRx:0.1, lLz:0.9, lRz:0.9, y:-0.1, roll:-TAU},'io'),
    K(1,{roll:-TAU})],
};
// weapon style → which template each attack uses
const MOVES = {
  sword:  { atk1:'hslash', atk2:'up', atk3:'diag', atk4:'over', special:'hslash', specialUp:'rise', specialDash:'dash', airAtk:'air', airAtk2:'flip' },
  fist:   { atk1:'jabR', atk2:'jabL', atk3:'hook', atk4:'kick', special:'hadou', specialUp:'riseKick', specialDash:'spinKick', airAtk:'kick', airAtk2:'flip', chargeAtk:'spinKick' },
  staff:  { atk1:'diag', atk2:'up', atk3:'cast', atk4:'bigcast', special:'cast', specialUp:'bigcast', specialDash:'thrust', airAtk:'cast', airAtk2:'flip', chargeAtk:'bigcast' },
  hammer: { atk1:'hslash', atk2:'back', atk3:'up', atk4:'over', special:'over', specialUp:'rise', specialDash:'tackle', airAtk:'over', airAtk2:'flip' },
  cane:   { atk1:'thrust', atk2:'thrust', atk3:'twirl', atk4:'up', special:'toss', specialUp:'smoke', specialDash:'slide', airAtk:'thrust', airAtk2:'flip' },
  katana: { atk1:'iai', atk2:'over', atk3:'up', atk4:'spinslash', special:'iai', specialUp:'up', specialDash:'dash', airAtk:'air', airAtk2:'flip' },
  gun:    { atk1:'shoot', atk2:'shoot', atk3:'shoot', atk4:'spinShoot', special:'lob', specialUp:'rocket', specialDash:'drill', airAtk:'shoot', airAtk2:'flip', chargeAtk:'spinShoot' },
};
const ONESHOT_LEN = { land:10, atk1:18, atk2:18, atk3:20, atk4:26, chargeAtk:30, airAtk:18, airAtk2:22, dodge:22, special:30,
  specialUp:30, specialDash:28, ult:80, hurt:18, getup:30, ko:50 };

const KICKS = { kick:1, riseKick:1, spinKick:1 };
function makeState(style){
  const P = {}, Q = {};
  for(const k of ALL){ P[k] = REST[style][k]; Q[k] = P[k]; }
  const spring = ()=>({ x:0, v:0 });
  return { P, Q, init:false, tw:1, runPh:0, stepN:0, blinkT:0, blinkNext:90+Math.random()*120, t:0,
    eBack:spring(), eFlap:spring(), tYaw:spring(), tLift:spring(), cSwing:spring(), cFlare:spring(),
    prevHY:0, aim:0, lastAnim:'', eyeMode:'open', tpl:null, gemSpin:0 };
}
// damped spring toward target, frame-rate independent (fixed 1/120 s substeps)
function spring(s, target, k, c, dt){
  let n = Math.max(1, Math.ceil(dt*120)); const h = dt/n;
  while(n--){ s.v += (k*(target - s.x) - c*s.v)*h; s.x += s.v*h; }
  if(s.x!==s.x){ s.x = 0; s.v = 0; }
}
const ANIMS = { idle:1, run:1, jump:1, fall:1, land:1, atk1:1, atk2:1, atk3:1, atk4:1, charge:1, chargeAtk:1, airAtk:1, airAtk2:1,
  dive:1, dodge:1, special:1, specialUp:1, specialDash:1, ult:1, hurt:1, down:1, getup:1, dizzy:1, ko:1, victory:1, pose:1, cheer:1 };

function updateRig(rig, e, dt, first){
  const st = rig.st, style = rig.style, rest = REST[style], P = st.P, Q = st.Q, n = rig.n;
  let anim = e.anim; if(!ANIMS[anim]) anim = 'idle';
  const T = e.animT || 0;
  const len = e.animLen > 0 ? e.animLen : (ONESHOT_LEN[anim] || 0);
  const p = len > 0 ? U.clamp(T/len, 0, 1) : 0;
  const h = U.clamp(e.animHit==null ? 0.35 : e.animHit, 0.05, 0.95);
  st.t += dt*60;
  if(anim!==st.lastAnim){
    st.lastAnim = anim;
    if(anim==='dodge') st.backRoll = (e.vx||0)*(e.face||1) < -0.01;   // backward roll when dodging backward
  }
  for(let i=0;i<ALL.length;i++) Q[ALL[i]] = rest[ALL[i]];
  let eyes = 'open', stars = false, oneshot = false, tpl = null, glow = 0;
  const moves = MOVES[style];

  switch(anim){
    case 'idle': {
      const t = st.t;
      Q.sq += 0.018*Math.sin(t*0.075); Q.nod += 0.03*Math.sin(t*0.037);
      Q.aLz += 0.05*Math.sin(t*0.075+1); Q.aRz += 0.035*Math.sin(t*0.075+1.6);
      if(style==='fist'){ Q.y += 0.022*Math.abs(Math.sin(t*0.12)); Q.aLz += 0.08*Math.sin(t*0.24); Q.aRz += 0.08*Math.sin(t*0.24+1.5); }
      Q.tail += 0.35*Math.sin(t*0.09);
      break; }
    case 'run': {
      const spd = Math.hypot(e.vx||0, e.vz||0);
      st.runPh += (0.2 + Math.min(spd, 0.16)*2.6) * dt*60;
      const s = Math.sin(st.runPh), as = Math.abs(s);
      const stepN = Math.floor((st.runPh + HP)/Math.PI);
      if(stepN!==st.stepN){ st.stepN = stepN; if(e.id && !first && G.bus) G.bus.emit('step', { ent:e }); }
      Q.lLz = 0.95*s; Q.lRz = -0.95*s;
      const armAmp = style==='fist' ? 0.7 : 0.45;
      Q.aLz += -0.8*s; Q.aRz += armAmp*s;
      Q.y = 0.075*(1-as); Q.sq = 0.06*(1-as) - 0.06*as*as;
      Q.lean = 0.24; Q.nod = -0.1; Q.twist = 0.12*s; Q.hy = -0.06*s;
      Q.tail = 0.7*Math.sin(st.runPh*2);
      break; }
    case 'jump': case 'fall': {
      const vy = e.vy||0;
      if(anim==='jump' && vy>0){ Q.sq = 0.1 + U.clamp(vy*1.6, 0, 0.12); Q.lLz = 0.6; Q.lRz = -0.2; Q.aLz = 2.2; Q.aRz = rest.aRz + 0.9; Q.lean = -0.05; Q.nod = 0.15; }
      else { Q.sq = 0.05; Q.lLz = 0.3; Q.lRz = 0.45; Q.aLz = 2.3 + 0.2*Math.sin(st.t*0.45); Q.aRz = rest.aRz + 1.0 + 0.15*Math.sin(st.t*0.45+1); Q.nod = 0.12; Q.mouth = vy < -0.25 ? 0.6 : 0; }
      Q.lLx = 0.15; Q.lRx = 0.15; Q.aLx = 0.55; Q.aRx = 0.5;
      break; }
    case 'land': {
      oneshot = true;
      Q.sq = -0.3*Math.exp(-4*p)*Math.cos(9*p); Q.aLx += 0.35*(1-p); Q.aRx += 0.3*(1-p); Q.lLx += 0.12*(1-p); Q.lRx += 0.12*(1-p);
      break; }
    case 'charge': {
      const c = U.clamp(e.charge||0, 0, 1), t = st.t;
      Q.sq = -0.12 - 0.06*c; Q.lean = -0.06; Q.y = -0.02;
      if(style==='fist'){ Q.aLz = -0.25; Q.aRz = -0.25; Q.aLx = 0.5; Q.aRx = 0.5; }
      else { Q.aRz = -0.35; Q.aRy = -0.4; Q.wz = 0.95; Q.aLz = 0.8; }
      Q.fx += (Math.random()-0.5)*0.022*(0.35+c); Q.side += (Math.random()-0.5)*0.05*c;
      Q.lLx = 0.18; Q.lRx = 0.18;
      eyes = 'sq'; glow = c*(0.7+0.3*Math.sin(t*0.5));
      break; }
    case 'dive': {
      Q.roll = style==='fist' ? -0.5 : -0.75; Q.sq = 0.14; Q.mouth = 1; Q.aLz = 1.9; Q.lLz = -0.5; Q.lRz = -0.3;
      if(style==='fist'){ Q.lRz = 1.4; Q.aRz = 1.9; tpl = 'kick'; } else { Q.aRz = 0.35; Q.wz = -1.95; }
      break; }
    case 'down': {
      Q.roll = HP; Q.y = -0.14; Q.aLz = 2.4; Q.aRz = 2.2; Q.aLx = 0.8; Q.aRx = 0.8; Q.lLz = 0.45; Q.lRz = 0.25;
      Q.sq = 0.02*Math.sin(st.t*0.08); eyes = 'x';
      break; }
    case 'dizzy': {
      const t = st.t;
      Q.side = 0.16*Math.sin(t*0.1); Q.tilt = 0.25*Math.sin(t*0.1+0.8); Q.nod = 0.08 + 0.12*Math.cos(t*0.1);
      Q.aLz = -0.05; Q.aRz = 0.15; Q.aLx = 0.55 + 0.15*Math.sin(t*0.1); Q.aRx = 0.5; Q.fx = 0.05*Math.sin(t*0.1);
      Q.sq = -0.03 + 0.03*Math.sin(t*0.2); Q.mouth = 0.5; eyes = 'x'; stars = true;
      break; }
    case 'victory': case 'cheer': {
      const ph = ((T % 56)/56), hop = U.bump(ph, 0, 0.5);
      Q.y = 0.2*hop; Q.sq = hop>0 ? 0.1*hop : 0; if(ph>0.5 && ph<0.62) Q.sq = -0.14*U.bump(ph,0.5,0.62);
      const w = Math.sin(st.t*0.22);
      if(anim==='victory' && style!=='fist'){ Q.aRz = 2.25; Q.wz = style==='gun' ? -1.0 : -0.9; Q.wx = 0.55; Q.aRx = 0.7; Q.aLz = 2.2 + 0.4*w; Q.aLx = 0.6; }
      else { Q.aLz = 2.6 + 0.35*w; Q.aRz = 2.6 - 0.35*w; Q.aLx = 0.55; Q.aRx = 0.55; if(style!=='fist') Q.wz = -0.3; }
      Q.nod = 0.25; Q.mouth = 1; Q.tail = 0.9*Math.sin(st.t*0.5); Q.lLz = 0.3*hop; Q.lRz = -0.3*hop;
      eyes = 'happy';
      break; }
    case 'pose': {
      posePersonality(rig, Q, rest, T, st.t);
      eyes = Q._eyes || 'open';
      break; }
    case 'hurt': {
      oneshot = true; sampleKeys(T8.hurt, p, h, Q, rest);
      // hurtDir = world direction the hit pushes us; in model space that is hurtDir*face
      const pushFwd = (e.hurtDir||-(e.face||1))*(e.face||1) > 0;
      if(pushFwd){ Q.lean = -Q.lean*0.8; Q.fx = -Q.fx; Q.nod = -Q.nod*0.6; }
      eyes = 'sq';
      break; }
    case 'dodge': {
      oneshot = true; sampleKeys(T8.dodge, p, h, Q, rest);
      if(st.backRoll){ Q.roll = -Q.roll; Q.lean = -Q.lean; }
      break; }
    case 'getup': oneshot = true; sampleKeys(T8.getup, p, h, Q, rest); if(p<0.4) eyes = 'x'; break;
    case 'ko': oneshot = true; sampleKeys(T8.ko, p, h, Q, rest); eyes = p<0.14 ? 'sq' : 'x'; stars = p>0.6; break;
    case 'ult': {
      oneshot = true; tpl = 'ult'; sampleKeys(T8.ult, p, h, Q, rest);
      if(style==='fist'){ Q.aLz = Q.aRz; Q.aLx = Q.aRx + 0.2; }
      if(style==='gun'){ Q.wz = -0.95; }
      if(p>0.55 && p<0.7) eyes = 'sq';
      break; }
    default: {   // attacks / specials / air
      oneshot = true;
      tpl = (moves && moves[anim]) || (anim==='chargeAtk' ? 'chargeAtk' : 'hslash');
      const keys = T8[tpl] || T8.hslash;
      sampleKeys(keys, p, h, Q, rest);
      if(anim==='chargeAtk' && style==='hammer'){ Q.spin *= 2; }
      if(style==='hammer' && (tpl==='over')) Q.sq *= 1.3;
      if(tpl==='hurt') eyes='sq';
    }
  }
  st.tpl = tpl;
  if(TWOHAND[style] && (oneshot && anim!=='hurt' && anim!=='ko' && anim!=='getup' && anim!=='dodge') || (TWOHAND[style] && anim==='charge')){
    Q.aLz = Q.aRz*0.95; Q.aLy = U.clamp(0.5 - Q.aRy*1.1, -1.2, 1.0); Q.aLx = 0.12;
  }

  // ---- smooth toward the target pose
  if(first || !st.init){ for(let i=0;i<ALL.length;i++) P[ALL[i]] = Q[ALL[i]]; st.init = true; st.tw = (e.face||1)>=0?1:-1; }
  else {
    const k = oneshot ? (T < 3 ? 26 : 70) : 13;
    const a = 1 - Math.exp(-k*dt);
    for(let i=0;i<CH.length;i++){ const c = CH[i]; P[c] += (Q[c]-P[c])*a; }
    // direct channels: exact during one-shots (full turns), otherwise ease the short way round
    const al = 1 - Math.exp(-11*dt);
    for(let i=0;i<DIRECT.length;i++){
      const c = DIRECT[i];
      if(oneshot){ P[c] = Q[c]; continue; }
      let d = (Q[c] - P[c]) % TAU; if(d > Math.PI) d -= TAU; if(d < -Math.PI) d += TAU;
      P[c] = Q[c] - d + d*al; if(Math.abs(P[c]-Q[c])<1e-4) P[c] = Q[c];
    }
  }
  // attacks turn the body toward the target (more profile) so swings read left/right; the head keeps looking at us
  const aimT = AIMS[anim] || 0;
  st.aim = first ? aimT : st.aim + (aimT - st.aim)*(1 - Math.exp(-(aimT>st.aim?16:6)*dt));
  applyPose(rig, e, dt, first, anim, eyes, stars, glow, T, p);
}

function applyPose(rig, e, dt, first, anim, eyes, stars, glow, T, p){
  const st = rig.st, P = st.P, n = rig.n, sc = rig.scale;
  // ---- facing: turn through "facing the camera", mirror when crossing it (weapon hand stays on the camera side)
  const face = (e.face||1) >= 0 ? 1 : -1;
  if(first) st.tw = face; else st.tw = U.approach(st.tw, face, 0.2*dt*60);
  const aw = Math.abs(st.tw), sgn = st.tw >= 0 ? 1 : -1;
  n.mir.scale.set(sgn*sc, sc, sc);
  const tb = TURN*(1 - 0.7*st.aim);
  n.yaw.rotation.y = -(tb + (1-aw)*(HP - tb));
  // ---- body
  n.act.position.set(P.fx, COM + P.y, 0);
  n.act.rotation.set(0, 0, P.roll);
  const s = Math.max(0.4, 1 + P.sq), ss = 1/Math.sqrt(s);
  n.sq.scale.set(ss, s, ss);
  n.hips.rotation.set(P.side, P.twist + P.spin, -P.lean);
  n.neck.rotation.set(P.tilt, P.hy - (HEADTURN + 0.28*st.aim)*aw, P.nod);
  n.armL.rotation.set(P.aLx, -P.aLy, P.aLz);
  n.armR.rotation.set(-P.aRx, P.aRy, P.aRz);
  n.legL.rotation.set(P.lLx, 0, P.lLz);
  n.legR.rotation.set(-P.lRx, 0, P.lRz);
  if(n.wpn) n.wpn.rotation.set(P.wx, P.wy, -HP + P.wz + P.wspin);
  // weapon trail anchor: kicks move tip/base to the right foot
  const kick = rig.style==='fist' && st.tpl && KICKS[st.tpl];
  const tipPar = kick ? rig.footTip : rig.tipHome;
  if(rig.tip.parent !== tipPar){
    if(kick){ rig.footTip.add(rig.tip); rig.tip.position.set(0,0,0); rig.footBase.add(rig.base); rig.base.position.set(0,0,0); }
    else { rig.tipHome.add(rig.tip); rig.tipHome.add(rig.base);
      rig.tip.position.set(L.hand[0]+0.02, L.hand[1]-0.07, 0); rig.base.position.set(L.hand[0], L.hand[1]+0.03, 0); }
  }
  // ---- secondary motion (springs)
  const fwd = (e.vx||0)*face*60, up = (e.vy||0)*60;
  const headY = P.y + P.sq*0.9;
  const hv = first ? 0 : (headY - st.prevHY)/Math.max(dt,1e-4); st.prevHY = headY;
  const happy = eyes==='happy';
  const earType = rig.earType;
  spring(st.eBack, U.clamp(fwd*0.08 + P.lean*0.8 + P.roll*0.15, -0.6, 1.0), 170, 9, dt);
  spring(st.eFlap, U.clamp(-up*0.1 - hv*0.12 + (happy?0.15:0), -0.35, 1.0), 150, 8, dt);
  const wag = (anim==='run'?0.55: happy?0.8 : 0.25) * Math.sin(st.t*(happy?0.45:anim==='run'?0.35:0.12));
  spring(st.tYaw, P.tail*0.6 + wag, 120, 10, dt);
  spring(st.tLift, U.clamp(-up*0.06 - hv*0.08 + (happy?0.3:0), -0.5, 0.8), 140, 9, dt);
  spring(st.cSwing, -U.clamp(Math.abs(fwd)*0.16 + Math.max(0, up)*0.12 + P.lean*0.6, -0.4, 1.15) - U.clamp(-hv*0.1,-0.4,0.4), 90, 7, dt);
  spring(st.cFlare, U.clamp(-up*0.05, -0.2, 0.3) + 0.05*Math.sin(st.t*0.07), 80, 7, dt);
  if(first){ for(const k of ['eBack','eFlap','tYaw','tLift','cSwing','cFlare']){ const sp = st[k]; sp.v = 0; } }
  if(n.earL){
    const up_ = earType==='up';
    const zb = up_ ? st.eBack.x*0.6 : -st.eBack.x, fl = st.eFlap.x*(up_?-0.4:1) + (up_?0.05:0.12);
    n.earL.rotation.set(up_ ? -fl : fl, 0, zb);
    n.earR.rotation.set(up_ ? fl : -fl, 0, zb);
  }
  if(n.tail) n.tail.rotation.set(0, st.tYaw.x, st.tLift.x);
  if(n.cape) n.cape.rotation.set(st.cFlare.x*0.3, 0, st.cSwing.x);
  // ---- expressions
  let mode = eyes;
  if(mode==='open'){
    st.blinkT += dt*60;
    const bt = st.blinkT - st.blinkNext;
    if(bt > 0){ const k = U.bump(bt, 0, 8); n.eyes.scale.y = Math.max(0.12, 1 - k); if(bt > 8){ st.blinkT = 0; st.blinkNext = 100 + Math.random()*160; if(Math.random()<0.2) st.blinkNext = 12; } }
    else n.eyes.scale.y = 1;
  } else n.eyes.scale.y = 1;
  const hide = !!rig.hideShared;
  n.eyes.visible = mode==='open' && !hide;
  n.eyesX.visible = mode==='x' && !hide;
  n.eyesSq.visible = mode==='sq' && !hide;
  n.eyesHappy.visible = mode==='happy' && !hide;
  if(n.glasses){
    // sunglasses: on the eyes normally; slide up for smiles, get knocked down the nose when hurt
    const g = n.glasses;
    if(mode==='happy'){ g.position.set(-0.01, 0.15, 0); g.rotation.set(0,0,0.25); }
    else if(mode==='x' || mode==='sq'){ g.position.set(0.02, -0.075, 0); g.rotation.set(0.28, 0, -0.12); }
    else { g.position.set(0,0,0); g.rotation.set(0,0,0); }
    if(mode==='open') n.eyes.visible = false;                 // behind the dark lenses
  }
  const mo = P.mouth;
  n.mouth.visible = mo > 0.3 && !hide;
  if(n.mouth.visible){ const k = 0.55 + 0.55*mo; n.mouth.scale.set(1, k, k); }
  n.stars.visible = stars && !hide;
  if(stars){ n.stars.rotation.y += 0.09*dt*60; n.stars.position.y = L.headC + 0.42 + 0.02*Math.sin(st.t*0.2); }
  // ---- halo / star staff idle motion
  if(n.halo){ n.halo.position.y = L.headC + 0.47 + 0.018*Math.sin(st.t*0.06); n.halo.rotation.set(HP + 0.12*Math.sin(st.t*0.035), 0.1*Math.sin(st.t*0.05), 0); }
  if(n.gem){ st.gemSpin += (0.035 + (st.tpl==='cast'||st.tpl==='bigcast'||anim==='ult' ? 0.2 : 0))*dt*60; n.gem.rotation.set(0, st.gemSpin, 0); }
  // ---- hit flash + charge glow (per-rig material only)
  const ud = rig.mat.userData;
  ud.uFlash.value = (e.flashT||0) > 0 ? 0.85 : 0;
  const g = glow > 0 ? glow : 0;
  ud.uTint.value.setRGB(1 + 0.32*g, 1 + 0.26*g, 1 + 0.1*g);
}

// select-screen idle: each hero shows their personality (looping, frames T / free-running t)
function posePersonality(rig, Q, rest, T, t){
  Q._eyes = 'open';
  Q.sq += 0.02*Math.sin(t*0.07);
  switch(rig.heroId){
    case 'inu': {                       // sword up in a salute, paw on the hip, a smile now and then
      Q.aRz = 2.1; Q.wz = -0.85; Q.wx = 0.5; Q.aRx = 0.55; Q.aLz = -0.35; Q.aLx = 0.95; Q.aLy = -0.25;
      Q.lean = -0.08; Q.nod = 0.12 + 0.03*Math.sin(t*0.05); Q.tail = 0.5*Math.sin(t*0.2);
      if((T % 200) > 140) Q._eyes = 'happy';
      break; }
    case 'shima': {                     // shadow boxing with a bounce
      const c = T % 44;
      Q.y = 0.03*Math.abs(Math.sin(t*0.14));
      if(c < 12){ const k = U.bump(c,0,12); Q.aLz = U.lerp(rest.aLz, 1.62, k); Q.aLy = U.lerp(rest.aLy, 0.38, k); Q.twist = -0.35*k; Q.mouth = k; }
      else if(c>=22 && c<34){ const k = U.bump(c,22,34); Q.aRz = U.lerp(rest.aRz, 1.62, k); Q.aRy = U.lerp(rest.aRy, 0.38, k); Q.twist = 0.4*k; Q.mouth = k; }
      break; }
    case 'nuko': {                      // twirls the star staff, sways, paw to the cheek
      Q.aRz = 1.2; Q.wz = -0.4; Q.wspin = t*0.09; Q.side = 0.09*Math.sin(t*0.06); Q.tilt = 0.18*Math.sin(t*0.06+0.6);
      Q.aLz = 2.1; Q.aLy = 0.7; Q.aLx = 0.1; Q._eyes = (T % 180) > 110 ? 'happy' : 'open';
      break; }
    case 'guard8': {                    // hammer on the shoulder, flexing
      Q.aRz = 1.25; Q.wz = 1.75; Q.aLz = 2.35 + 0.12*Math.sin(t*0.1); Q.aLx = 1.0; Q.aLy = -0.25;
      Q.nod = 0.2; Q.lean = -0.1; Q.y = 0.012*Math.abs(Math.sin(t*0.1));
      if((T % 160) > 110){ Q._eyes = 'happy'; Q.mouth = 0.8; }
      break; }
    case 'watch': {                     // tips the hat with a bow, then twirls the cane
      const c = (T % 160)/160;
      if(c < 0.35){ const k = U.bump(c, 0, 0.35); Q.aLz = 2.9*k + rest.aLz*(1-k); Q.aLy = 0.55*k; Q.lean = 0.25*k; Q.nod = -0.25*k; Q._eyes = k>0.5?'happy':'open'; }
      else { Q.aRz = 1.25; Q.wz = -1.25; Q.wspin = -t*0.3; Q.aLz = -0.2; Q.aLx = 0.9; }
      break; }
    case 'wanden': {                    // calm iai stance, eyes closed, opens them now and then
      Q.aRz = 0.55; Q.aRy = 1.25; Q.wz = -2.55; Q.aLz = 0.3; Q.aLy = 0.35; Q.lean = 0.12; Q.sq -= 0.05;
      Q.nod = -0.02 + 0.02*Math.sin(t*0.04); Q._eyes = (T % 220) < 150 ? 'happy' : 'open';
      break; }
    case 'mack': {                      // spins the cork gun on a finger, then points it up with a grin
      const c = (T % 150)/150;
      if(c < 0.6){ Q.aRz = 1.2; Q.wz = -1.2; Q.wspin = -t*0.35; Q.aLz = -0.3; Q.aLx = 0.9; }
      else { Q.aRz = 2.3; Q.wz = -1.0; Q.wx = 0.5; Q.aRx = 0.7; Q.nod = 0.2; Q._eyes = 'happy'; Q.mouth = 0.9; Q.aLz = -0.3; Q.aLx = 0.9; }
      break; }
  }
}

// ---------------------------------------------------------------- portraits (bust on a transparent background → PNG dataURL)
const pCache = {};
let pScene = null, pCam = null, pRT = null;
const _hv = new THREE.Vector3(), _hf = new THREE.Vector3(), _cc = new THREE.Color();
function portrait(id, opts){
  opts = opts || {};
  const hero = BYID[id]; if(!hero) return null;
  const size = Math.max(32, Math.min(1024, opts.size|0 || 256)), expr = opts.expr || 'normal';
  const key = hero.id+'|'+size+'|'+expr+'|'+(opts.bg||'');
  if(pCache[key]) return pCache[key];
  const R = G.renderer; if(!R) return null;
  let url = null, rig = null;
  const prevRT = R.getRenderTarget(), prevA = R.getClearAlpha(), prevAuto = R.autoClear; R.getClearColor(_cc);
  try {
    if(!pScene){
      pScene = new THREE.Scene();
      pScene.add(new THREE.HemisphereLight(0xdcefff, 0xf2d6b0, 1.3));
      const key = new THREE.DirectionalLight(0xfff0d8, 2.3); key.position.set(-3, 5, 6); pScene.add(key);
      const rim = new THREE.DirectionalLight(0xbfe0ff, 1.8); rim.position.set(4, 4, -6); pScene.add(rim);
      const fill = new THREE.DirectionalLight(0xffe2f0, 0.5); fill.position.set(5, 1, 6); pScene.add(fill);
      pCam = new THREE.PerspectiveCamera(22, 1, 0.05, 50);
    }
    const S = size*2;                                        // 2× supersampled, box-filtered by the 2D canvas
    if(!pRT || pRT.width!==S){
      if(pRT) pRT.dispose();
      pRT = new THREE.WebGLRenderTarget(S, S, { depthBuffer:true });
      pRT.texture.colorSpace = THREE.SRGBColorSpace; pRT.texture.internalFormat = 'RGBA8';
      pRT.isXRRenderTarget = true;       // r160: makes three apply tone mapping + sRGB output like the screen does
    }
    rig = build(hero.id, { anim:'idle' });
    const ent = { anim:'idle', animT:0, animLen:0, animHit:0.35, face:1, vx:0, vy:0, vz:0, onGround:true, flashT:0, stun:0, charge:0 };
    rig.st.blinkNext = 1e9;
    updateRig(rig, ent, G.cfg.TICK, true);
    const n = rig.n;
    if(expr==='happy'){ n.eyes.visible = false; n.eyesHappy.visible = true; n.mouth.visible = true; n.mouth.scale.set(1,1,1);
      if(n.glasses){ n.glasses.position.set(-0.01,0.15,0); n.glasses.rotation.set(0,0,0.25); } }
    else if(expr==='hurt'){ n.eyes.visible = false; n.eyesSq.visible = true; n.mouth.visible = true; }
    else if(expr==='shout'){ n.mouth.visible = true; n.mouth.scale.set(1,1.1,1.1); }
    pScene.add(rig.root);
    rig.root.updateMatrixWorld(true);
    // aim at the face from a 3/4 front view
    n.neck.localToWorld(_hv.set(0, L.headC, 0));
    _hf.set(1,0,0).transformDirection(n.neck.matrixWorld);
    _hf.multiplyScalar(0.55).add(_p.set(0,0.12,0.75)).normalize();
    const sc = rig.scale, dist = (1.3*sc*0.5) / Math.tan(pCam.fov*Math.PI/360);
    _hv.y += 0.07*sc;
    pCam.position.copy(_hv).addScaledVector(_hf, dist);
    pCam.lookAt(_hv);
    R.setRenderTarget(pRT);
    if(opts.bg){ R.setClearColor(opts.bg, 1); } else R.setClearColor(0x000000, 0);
    R.autoClear = true;
    R.clear(true, true, true);
    R.render(pScene, pCam);
    const buf = new Uint8Array(S*S*4);
    R.readRenderTargetPixels(pRT, 0, 0, S, S, buf);
    const big = document.createElement('canvas'); big.width = big.height = S;
    const bx = big.getContext('2d'), img = bx.createImageData(S, S);
    for(let y=0;y<S;y++) img.data.set(buf.subarray((S-1-y)*S*4, (S-y)*S*4), y*S*4);   // flip rows
    bx.putImageData(img, 0, 0);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const cx = c.getContext('2d'); cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
    cx.drawImage(big, 0, 0, size, size);
    url = c.toDataURL('image/png');
    pCache[key] = url;
  } catch(err){ G.logError && G.logError('heroes.portrait '+id, err); }
  finally {
    R.setRenderTarget(prevRT); R.setClearColor(_cc, prevA); R.autoClear = prevAuto;
    if(rig){ pScene && pScene.remove(rig.root); rig.dispose(); }
  }
  return url;
}

// ---------------------------------------------------------------- export
G.heroes = {
  list: LIST,
  ids: LIST.map(h=>h.id),
  get(id){ return BYID[id] || null; },
  init(){ for(const h of LIST){ try { getModel(h.id); } catch(err){ G.logError('heroes.model '+h.id, err); } } shared(); },
  build,
  portrait,
  clearPortraits(){ for(const k in pCache) delete pCache[k]; },
  // for tests / other modules: which swing template an anim uses for a hero (e.g. 'hslash')
  moveOf(id, anim){ const h = BYID[id]; return h && MOVES[h.weapon] ? (MOVES[h.weapon][anim] || null) : null; },
  layout: L,
};

// ===== 30_foes.js =====
// 30_foes.js — 敵の枠組み（リード担当）。種類の登録・出現・共通の反応（のけぞり/ダウン/起き上がり/
// ピヨり/やっつけ→ぽんっ→子犬になって走り去る）・AI用の小道具 h.*。敵の中身は 31/35/36 が define する。
(function(){ 'use strict';
const G = window.G; const THREE = window.THREE; const U = G.U;

const types = {};
const tokens = new Set();

function diff(){ return (G.game && G.game.diff) || { foeHp:1, attackers:2, foeSpeed:1, think:1 }; }

// placeholder rig (used when a type has no build or the build throws)
function fallbackRig(def){
  const b = G.look.builder();
  const s = def && def.boss ? 1.8 : 1;
  b.add(G.look.geo.sphere(0.42*s, 16, 12), '#8f8fa0', [0, 0.95*s, 0]);
  b.add(G.look.geo.sphere(0.34*s, 16, 12), '#7a7a8a', [0, 0.4*s, 0]);
  const mat = G.look.vmat({ instance:true });
  const mesh = b.mesh({ material:mat });
  const root = new THREE.Group(); root.add(mesh);
  return { root, height:1.35*s, radius:0.4*s, tip:null, base:null,
    update(e){ mat.userData.uFlash.value = e.flashT>0 ? 0.7 : 0; root.rotation.z = e.state==='down' ? -1.2*e.face : 0; },
    setAlpha(a){ const tr = a<1; if(mat.transparent!==tr){ mat.transparent = tr; mat.needsUpdate = true; } mat.opacity = a; },
    dispose(){ mesh.geometry.dispose(); mat.dispose(); } };
}

const h = {
  target(e){
    const p = G.player;
    if(p && !p.dead && !p.removed) return p;
    return null;
  },
  dx:(e,t)=> t.x - e.x,
  dz:(e,t)=> t.z - e.z,
  dist:(e,t)=> Math.hypot(t.x - e.x, (t.z - e.z)*1.4),
  face(e, t){ if(t && Math.abs(t.x - e.x) > 0.05) e.face = t.x > e.x ? 1 : -1; },
  walkTo(e, x, z, spd){
    const dx = x - e.x, dz = z - e.z, d = Math.hypot(dx, dz);
    spd = (spd==null ? e.def.spd||0.04 : spd) * diff().foeSpeed * (e.spdMul||1);
    if(d < Math.max(0.12, spd*1.5)){ h.stop(e); return true; }
    e.vx = dx/d*spd; e.vz = dz/d*spd*0.8;
    if(Math.abs(dx) > 0.08) e.face = dx > 0 ? 1 : -1;
    if(e.state!=='move') G.setState(e, 'move');
    if(e.anim!=='walk') G.setAnim(e, 'walk');
    return false;
  },
  stop(e){ e.vx = 0; e.vz = 0; if(e.state==='move') G.setState(e, 'idle'); if(e.anim==='walk' || e.anim==='run') G.setAnim(e, 'idle'); },
  // telegraphed attack: windup frames of 'windup' + alert, then G.combat.start
  attack(e, def, windup){
    if(e.state==='act' || e.atk || e.pending) return false;
    G.setState(e, 'act');
    e.vx = 0; e.vz = 0;
    const w = Math.max(0, Math.round((windup==null ? 20 : windup) * (diff().think||1)));
    e.pending = { def, t:w };
    if(w>0){
      G.setAnim(e, def.windupAnim || 'windup', w);
      if(G.fx && G.fx.alert && !def.noAlert) G.fx.alert(e);
      if(G.audio && G.audio.sfx && !def.noAlert) G.audio.sfx('alert', { vol:0.6 });
      G.bus.emit('alert', { ent:e });
    }
    return true;
  },
  shoot(e, o){ return G.combat.shoot(Object.assign({ owner:e, team:e.team }, o)); },
  token(e){
    if(e.hasToken) return true;
    const max = diff().attackers || 2;
    // drop stale holders
    for(const id of tokens){ let f = null; const ents = G.world.ents; for(let i=0;i<ents.length;i++){ if(ents[i].id===id){ f = ents[i]; break; } } if(!f || f.dead || f.removed) tokens.delete(id); }
    if(tokens.size >= max) return false;
    tokens.add(e.id); e.hasToken = true; return true;
  },
  release(e){ if(e.hasToken){ tokens.delete(e.id); e.hasToken = false; } },
  wait(e, frames){ e.cool = Math.max(e.cool||0, frames|0); },
  spawnMinion(type, x, z, opts){ return G.foes.spawn(type, x, z, Object.assign({ entrance:'drop', minion:true }, opts||{})); },
  say(e, text){ if(G.fx && G.fx.text) G.fx.text(text, e.x, e.y + (e.rig && e.rig.height || 1.3) + 0.35, e.z, 'onoma'); },
  rand(){ return G.rng(); },
  // pick a spot beside the target on its belt line (for surrounding)
  flank(e, t, dist){ const side = e.x < t.x ? -1 : 1; return { x: t.x + side*(dist||1.1), z: U.clamp(t.z + (e.id%3-1)*0.35, G.cfg.ZMIN, G.cfg.ZMAX) }; },
};

G.foes = {
  types, h, tokens,
  init(){
    G.bus.on('scene', ()=> tokens.clear());
    // when a boss is purified every helper still standing gives up (safety net for types that ignore e.scared)
    G.bus.on('bossDown', (d)=>{
      const b = d && d.boss; let k = 0;
      for(const e of G.world.ents){ if(e.team===1 && !e.dead && e!==b && !(e.def && e.def.boss)){ e.scared = true; e.ignoreForClear = true; e.giveUpT = 30 + (k++)*10; e.pending = null; e.atk = null; h.release(e); } }
    });
  },
  define(type, def){
    def.type = type;
    def.name = def.name || type;
    def.hp = def.hp || 30; def.spd = def.spd || 0.04;
    def.radius = def.radius || 0.42; def.height = def.height || 1.25; def.weight = def.weight || 1;
    def.score = def.score || 100; def.xp = def.xp || 10;
    types[type] = def;
    return def;
  },
  build(type, ent){
    const def = types[type];
    let rig = null;
    try { rig = def && def.build ? def.build(ent||null) : null; } catch(err){ G.logError('foe build '+type, err); }
    return rig || fallbackRig(def);
  },
  spawn(type, x, z, opts){
    opts = opts || {};
    const def = types[type];
    if(!def){ G.logError('spawn', 'unknown foe type '+type); return null; }
    const D = diff();
    const stageMul = 1 + (G.stage && G.stage.index ? G.stage.index*0.07 : 0);
    const hpMul = (opts.hpMul || 1) * D.foeHp * (def.boss ? 1 : stageMul);
    const p = G.player;
    const e = G.makeEnt({
      kind: def.boss ? 'boss' : 'foe', type, team:1, def, x, z: U.clamp(z, G.cfg.ZMIN, G.cfg.ZMAX), y: opts.y || 0,
      face: opts.face || (p ? (x > p.x ? -1 : 1) : -1),
      hp: Math.round(def.hp*hpMul), maxHp: Math.round(def.hp*hpMul), hpMul,
      radius:def.radius, height:def.height, weight:def.weight, armor:def.armor||0,
      state:'spawn', cool: 20 + Math.floor(G.rng()*30), phase:0, minion:!!opts.minion,
      entrance: opts.entrance || def.entrance || 'walk', boss: !!(def.boss || opts.boss),
    });
    e.rig = G.foes.build(type, e);
    if(e.rig){ if(e.rig.height) e.height = def.height || e.rig.height; }
    // entrance setup
    if(e.entrance==='drop'){ e.y = opts.y || 7; e.vy = 0; e.onGround = false; }
    else if(e.entrance==='burrow'){ e.intangible = true; e.burrowT = 40; if(e.rig && e.rig.setAlpha) e.rig.setAlpha(0.0); }
    else if(e.entrance==='walk'){ e.entered = false; }
    if(def.init){ try { def.init(e, opts); } catch(err){ G.logError('foe init '+type, err); } }
    G.world.add(e);
    G.bus.emit('foeSpawn', { ent:e });
    return e;
  },
  // framework per tick: reactions + AI
  tick(e){
    if(e.giveUpT>0 && !e.dead && --e.giveUpT===0){ e.dead = true; e.deadT = 0; e.gaveUp = true; e.atk = null; e.pending = null; G.setState(e, 'ko'); e.vy = 0.12; e.onGround = false; h.release(e); }
    if(e.flashT>0) e.flashT--;
    if(e.inv>0) e.inv--;
    if(e.hpShowT>0) e.hpShowT--;
    if(e.cool>0) e.cool--;
    e.stateT++;
    // leaving the attack state frees the token
    if(e.hasToken && e.state!=='act' && !e.atk && !e.pending) h.release(e);
    // entered the arena?
    if(!e.entered){
      const vr = G.cam.viewRange();
      if(e.x > vr[0] + e.radius && e.x < vr[1] - e.radius) e.entered = true;
    }
    switch(e.state){
      case 'spawn': return tickSpawn(e);
      case 'hurt':
        if(e.anim!=='hurt') G.setAnim(e, 'hurt');
        if(--e.stun <= 0){ G.setState(e, 'idle'); G.setAnim(e, 'idle'); e.cool = Math.max(e.cool, 10); }
        return;
      case 'down':
        if(e.anim!=='down') G.setAnim(e, 'down');
        if(e.onGround){ e.downT = (e.downT||0) + 1; if(e.downT > (e.def.boss ? 70 : 42)){ G.setState(e, 'getup'); G.setAnim(e, 'getup', 24); } }
        return;
      case 'getup':
        if(e.stateT >= 24){ G.setState(e, 'idle'); G.setAnim(e, 'idle'); e.inv = 16; e.cool = Math.max(e.cool, 12); e.poiseDmg = 0; }
        return;
      case 'dizzy':
        if(e.anim!=='dizzy') G.setAnim(e, 'dizzy');
        if(--e.stun <= 0){ G.setState(e, 'idle'); G.setAnim(e, 'idle'); }
        return;
      case 'ko': return tickKO(e);
    }
    // a scared helper drops whatever it was winding up
    if(e.scared && (e.pending || e.atk)){ e.pending = null; e.atk = null; }
    // FREE: running a pending telegraph?
    if(e.pending){
      if(--e.pending.t <= 0){ const d = e.pending.def; e.pending = null; G.combat.start(e, d); }
      return;
    }
    if(e.atk){ return; }
    if(e.state==='act'){ G.setState(e, 'idle'); G.setAnim(e, 'idle'); e.cool = Math.max(e.cool, (e.lastAtk && e.lastAtk.recover) || e.def.recover || 16); }
    if(!e.entered && e.entrance==='walk'){
      // walk into view first
      const p = G.player; const tx = p ? p.x : e.x;
      e.vx = U.sign(tx - e.x) * (e.def.spd||0.04) * 1.2; e.face = U.sign(e.vx); if(e.anim!=='walk') G.setAnim(e, 'walk');
      return;
    }
    const def = e.def;
    if(e.scared){ e.vx *= 0.8; e.vz *= 0.8; const t = h.target(e); if(t) h.face(e, t); if(e.anim!=='hurt') G.setAnim(e, 'hurt'); if(e.state==='move') G.setState(e, 'idle'); return; }
    if(def.ai){ try { def.ai(e); } catch(err){ G.logError('ai '+e.type, err); e.cool = 30; } }
    else defaultAI(e);
  },
};

function tickSpawn(e){
  if(e.entrance==='drop'){
    if(e.anim!=='fall') G.setAnim(e, 'fall');
    if(e.onGround){ G.setState(e, 'idle'); G.setAnim(e, 'idle'); e.entered = true; if(G.fx && G.fx.burst) G.fx.burst('dust', e.x, 0.05, e.z, { scale:0.8 }); }
    return;
  }
  if(e.entrance==='burrow'){
    e.burrowT--;
    if(e.burrowT===20 && G.fx && G.fx.burst) G.fx.burst('dust', e.x, 0.05, e.z, { scale:1 });
    if(e.burrowT<=0){ e.intangible = false; if(e.rig && e.rig.setAlpha) e.rig.setAlpha(1); e.vy = 0.16; e.onGround=false; G.setState(e, 'idle'); G.setAnim(e, 'jump'); e.entered = true; }
    return;
  }
  G.setState(e, 'idle'); G.setAnim(e, 'idle');
}

function tickKO(e){
  e.deadT = (e.deadT||0) + 1;
  if(e.def.onKOTick){ try { if(e.def.onKOTick(e)===true) return; } catch(err){ G.logError('onKOTick', err); } }
  const boss = e.def.boss;
  const lie = boss ? 80 : (e.gaveUp ? 8 : 26);
  if(!e.onGround && e.deadT < 120){ if(e.anim!=='ko') G.setAnim(e, 'ko'); return; }
  if(e.koLand==null){ e.koLand = e.deadT; G.setAnim(e, 'ko'); e.vx = 0; }
  const t = e.deadT - e.koLand;
  if(t===lie){
    // ぽんっ — the grumpy soldier turns into a happy pup
    if(G.audio && G.audio.sfx) G.audio.sfx('poof');
    G.bus.emit('poof', { ent:e });
    G.setAnim(e, 'cheer');
    e.happy = true;
    // drops
    if(!e.gaveUp && (!e.minion || G.rng()<0.3)){
      const n = boss ? 12 : 2 + Math.floor(G.rng()*2);
      for(let i=0;i<n;i++) G.pickups.spawn('coin', e.x, e.z);
      const r = G.rng();
      if(boss) G.pickups.spawn('cake', e.x, e.z);
      else if(r < 0.14) G.pickups.spawn('bone', e.x, e.z);
      else if(r < 0.22) G.pickups.spawn('star', e.x, e.z);
    }
  }
  if(t > lie + 16){
    // run away happily, fading out
    const away = G.player ? U.sign(e.x - G.player.x) : 1;
    e.face = away; e.vx = away*0.09; e.noClamp = true;
    if(t % 22 === 0 && e.onGround){ e.vy = 0.1; }
    const a = U.clamp(1 - (t - lie - 16)/60, 0, 1);
    if(e.rig && e.rig.setAlpha) e.rig.setAlpha(a);
    e.shadowAlpha = 0.42*a;

    { n:'armF', p:1, at:[0.02, shY, shZ] }, { n:'armB', p:1, at:[0.02, shY, -shZ] },
    { n:'legF', p:0, at:[0, hipY, 0.11] }, { n:'legB', p:0, at:[0, hipY, -0.11] },
    { n:'tail', p:1, at:[-bR[0]+0.05, hipY+0.12, 0] },
    { n:'earF', p:2, at:[0.02+eA[0], neckY+eA[1], eA[2]] }, { n:'earB', p:2, at:[0.02+eA[0], neckY+eA[1], -eA[2]] },
  ]);
  if(o.held) BL.push({ n:'held', p:3, at:[0.07, shY - 0.25, shZ + 0.06] });
  const hb = boneAt(BL,'head');
  const HC = [hb[0]+hc[0], hb[1]+hc[1], hb[2]+hc[2]];      // head centre in model space
  const hs = (az, el, d)=>{ const q = surf(F, az, el, d); return [hb[0]+q[0], hb[1]+q[1], hb[2]+q[2]]; };
  const fur = o.fur, light = o.light, dark = o.dark || '#2a2630', earIn = o.earIn || '#f2a7b8';
  const p = Parts();
  // body
  p.on(bi(BL,'body'));
  if(!o.noBody) p.add(R.s, o.suit || fur, [0, bodyY, 0], null, bR);
  p.add(R.sm, o.belly || light, [bR[0]*0.52, bodyY - 0.03, 0], null, [bR[0]*0.55, bR[1]*0.72, bR[2]*0.78]);
  // collar with white studs
  const colY = neckY + 0.015;
  p.add(R.tor(0.19, 0.045, TAU, 16), o.collar || dark, [0.02, colY, 0], [HP, 0, 0]);
  if(o.studs!==false) for(let k=-2;k<=2;k++){ const a = k*0.52 + 0.12; p.add(R.st, '#ffffff', [0.02 + Math.cos(a)*0.232, colY, Math.sin(a)*0.232], null, 0.03); }
  // head
  p.on(bi(BL,'head'));
  p.add(R.s, fur, HC, null, headR);
  const mz = [HC[0] + headR[0]*0.74, HC[1] - 0.1, 0];
  p.add(R.sm, o.muzzle || light, mz, null, [0.16, 0.115, 0.165]);
  p.add(R.sl, '#2a2028', [mz[0] + 0.14, mz[1] + 0.05, 0], null, [0.045, 0.04, 0.062]);
  p.add(R.st, '#ffffff', [mz[0] + 0.16, mz[1] + 0.075, 0.02], null, 0.014);
  const mo = R.tor(0.028, 0.009, PI, 6);
  for(const zs of [1,-1]) p.add(mo, C.rim, [mz[0] + 0.15, mz[1] - 0.045, zs*0.028], [0, HP, PI]);
  // ears
  const earBones = [bi(BL,'earF'), bi(BL,'earB')];
  for(let k=0;k<2;k++){
    const zs = k===0 ? 1 : -1, at = boneAt(BL, k===0 ? 'earF' : 'earB');
    p.on(earBones[k]);
    if(o.ear==='floppy'){
      p.add(R.sm, o.earCol || o.ear2 || fur, [at[0]-0.01, at[1]-0.1, at[2]+zs*0.05], [-zs*0.3, 0, 0.1], [0.1, 0.19, 0.055]);
    } else {
      const big = o.ear==='big', h = big ? 0.34 : (o.earH||0.26), r = big ? 0.17 : 0.115, tilt = big ? 0.72 : 0.36;
      const dir = [0, Math.cos(tilt), zs*Math.sin(tilt)];
      p.add(R.cone, o.earCol || fur, [at[0] + (big?0:-0.01), at[1] + dir[1]*h*0.45, at[2] + dir[2]*h*0.45], [zs*tilt, 0, 0.12], [r, h, r*0.72]);
      p.add(R.cone, earIn, [at[0] + 0.035, at[1] + dir[1]*h*0.42, at[2] + dir[2]*h*0.42], [zs*tilt, 0, 0.12], [r*0.6, h*0.72, r*0.35]);
    }
  }
  // arms
  if(!o.noArms) for(const nm of ['armF','armB']){
    const zs = nm==='armF' ? 1 : -1, at = boneAt(BL, nm);
    p.on(bi(BL, nm));
    p.add(R.cap(0.068, 0.13 + lk*0.04), o.sleeve || fur, [at[0]+0.01, at[1]-0.1 - lk*0.02, at[2] + zs*0.02], [-zs*0.12, 0, 0]);
    p.add(R.sl, o.paw || light, [at[0]+0.02, at[1]-0.22 - lk*0.04, at[2] + zs*0.035], null, 0.083);
  }
  // legs
  for(const nm of ['legF','legB']){
    const at = boneAt(BL, nm);
    p.on(bi(BL, nm));
    p.add(R.cap(0.075, 0.05 + lk*0.07), o.pants || fur, [at[0], at[1]*0.55, at[2]], null);
    p.add(R.sl, o.foot || light, [at[0]+0.045, 0.06, at[2]], null, [0.11, 0.065, 0.09]);
  }
  // tail
  p.on(bi(BL,'tail'));
  const ta = boneAt(BL,'tail');
  if(o.tail!=='none'){
    p.add(R.cap(0.052, 0.15), o.tailCol || fur, [ta[0]-0.07, ta[1]+0.1, 0], [0, 0, 0.75]);
    p.add(R.sl, o.tailTip || light, [ta[0]-0.15, ta[1]+0.2, 0], null, 0.06);
  }
  if(o.gear) o.gear(p, { BL, R, bi, boneAt, HC, headR, hs, hipY, bodyY, bR, neckY, shY, shZ, F, hb });
  const geo = merge(p.list, true);
  const face = faceSet('dog_'+o.id, { c:hc, r:headR, az:o.eyeAz||0.46, el:o.eyeEl||0.1, size:o.eye||0.08, tilt:o.tilt });
  const top = HC[1] + headR[1];
  return { id:o.id, kind:'biped', BL, geo, face, faceBone:'head', height: o.height || top + 0.06, radius: 0.42,
    outline:0.02, lieLift:0.3, lieShift:0.5, rough:0.72, stars:{ bone:'head', pos:[hc[0], hc[1] + headR[1] + 0.12, 0] },
    tip:{ bone:'armF', pos:[0.02, -0.24, 0.03] }, base:{ bone:'armF', pos:[0,0,0] }, dog:true };
}

// ---------------------------------------------------------------- blob monks (kire / pierrot / oni): body+head is one round "bouzu"
function blobBP(o){
  const R = prim();
  const Rb = o.R, legTop = o.legTop || 0.16, cy = legTop + Rb*0.9;
  const bRad = [Rb, Rb*0.95, Rb*0.94];
  const shY = cy - Rb*0.12, shZ = Rb*0.9;
  const BL = bones([
    { n:'root', p:-1, at:[0,0,0] },
    { n:'body', p:0, at:[0, legTop, 0] },
    { n:'head', p:1, at:[0, cy, 0] },
    { n:'armF', p:1, at:[0.02, shY, shZ] }, { n:'armB', p:1, at:[0.02, shY, -shZ] },
    { n:'legF', p:0, at:[0.02, legTop, Rb*0.36] }, { n:'legB', p:0, at:[0.02, legTop, -Rb*0.36] },
  ]);
  const F = { c:[0,0,0], r:bRad };
  const hs = (az, el, d)=>{ const q = surf(F, az, el, d); return [q[0], cy + q[1], q[2]]; };
  const p = Parts();
  p.on(bi(BL,'body'));
  p.add(R.s, o.col, [0, cy, 0], null, bRad);
  if(o.belly) feat(p, R.dome, o.belly, { c:[0, cy, 0], r:bRad }, 0.25, -0.62, -0.01, 0, [Rb*0.5, Rb*0.36, Rb*0.08]);
  const s = o.limb || 1;
  for(const nm of ['armF','armB']){
    const zs = nm==='armF' ? 1 : -1, at = boneAt(BL, nm);
    p.on(bi(BL, nm));
    p.add(R.cap(0.07*s, 0.1*s), o.arm || o.col, [at[0]+0.01, at[1]-0.08*s, at[2]+zs*0.03], [-zs*0.2, 0, 0]);
    p.add(R.sl, o.fist || o.col, [at[0]+0.02, at[1]-0.19*s, at[2]+zs*0.05], null, 0.095*s);
  }
  for(const nm of ['legF','legB']){
    const at = boneAt(BL, nm);
    p.on(bi(BL, nm));
    p.add(R.cap(0.08*s, 0.04*s), o.leg || o.col, [at[0], at[1]*0.6, at[2]], null);
    p.add(R.sl, o.foot || '#2a2630', [at[0]+0.05, 0.055, at[2]], null, [0.12*s, 0.065, 0.1*s]);
  }
  p.on(bi(BL,'head'));
  if(o.gear) o.gear(p, { BL, R, bi, boneAt, cy, Rb, bRad, F, hs, legTop });
  const geo = merge(p.list, true);
  const fl = o.faceLift||1;
  const face = faceSet('blob_'+o.id, { c:[0,0,0], r:[bRad[0]*fl, bRad[1]*fl, bRad[2]*fl], az:o.eyeAz||0.36, el:o.eyeEl||0.14, size:o.eye||0.085, tilt:o.tilt, dropAz:0.95, dropEl:0.6, mouth:o.mouth, mouthEl:o.mouthEl });
  return { id:o.id, kind:'biped', blob:true, headYaw:-0.42, BL, geo, face, faceBone:'head', height: o.height || cy + Rb*0.95 + 0.1, radius: Rb*0.95,
    outline:0.022, lieLift: Rb*0.9, lieShift: cy*0.9, rough:0.7, stars:{ bone:'head', pos:[0, Rb*0.95 + (o.starUp||0.14), 0] },
    tip:{ bone:'armF', pos:[0.02, -0.19*s, 0.05] }, base:{ bone:'armF', pos:[0,0,0] } };
}
