<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>聖犬士イッヌ - ベルトアクション</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#05060a; overflow:hidden;
    font-family:'Trebuchet MS','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    color:#fff; user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; background:#000; box-shadow:0 0 60px rgba(0,0,0,.8); max-width:100%; max-height:100%; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; z-index:20; padding:20px;
    background:radial-gradient(ellipse at center, rgba(20,12,40,.55), rgba(0,0,0,.9)); }
  .hidden { display:none !important; }
  .title-sub { font-size:14px; letter-spacing:6px; color:#ffd34d; text-shadow:0 0 8px #b8860b; }
  .title-main { font-size:clamp(38px,9vw,84px); font-weight:900; letter-spacing:4px;
    background:linear-gradient(180deg,#fff6d0,#ffcf3a 55%,#c8881a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 0 rgba(120,60,0,.4); margin:4px 0; }
  .title-jp { font-size:clamp(16px,4vw,28px); color:#fff; letter-spacing:8px;
    text-shadow:0 0 10px #ff8a00; margin-bottom:14px; }
  .btn { margin-top:12px; padding:13px 38px; font-size:20px; font-weight:800; letter-spacing:3px;
    color:#3a1d00; cursor:pointer; border-radius:10px;
    background:linear-gradient(180deg,#ffe98a,#ffb02e); border:2px solid #fff3c0;
    box-shadow:0 6px 0 #9c5a00,0 10px 20px rgba(0,0,0,.5); transition:transform .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #9c5a00; }
  .moves { margin-top:16px; font-size:12.5px; color:#dfeaff; line-height:1.7; max-width:600px; text-align:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,210,80,.25); border-radius:10px; padding:9px 16px; }
  .moves h3 { color:#ffd34d; letter-spacing:3px; margin-bottom:6px; font-size:13px; }
  .moves b { color:#7fd0ff; } .moves .cmd { color:#ff9a3a; font-weight:800; }
  #result-title { font-size:clamp(34px,8vw,70px); font-weight:900; letter-spacing:6px; }
  #result-sub { font-size:18px; margin-top:10px; color:#ffd34d; letter-spacing:2px; }

  /* sound toggle */
  #snd { position:absolute; top:10px; right:10px; z-index:25; width:42px; height:42px; border-radius:50%;
    background:rgba(8,10,20,.6); border:2px solid rgba(255,210,80,.6); color:#ffd34d; font-size:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }

  /* touch */
  #touch { position:absolute; inset:0; z-index:15; pointer-events:none; display:none; }
  .stk { position:absolute; border-radius:50%; background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.18); pointer-events:auto; }
  .stk .nub { position:absolute; left:50%; top:50%; width:66px; height:66px; margin:-33px;
    border-radius:50%; background:rgba(255,255,255,.26); border:2px solid rgba(255,255,255,.85); }
  #stick  { left:24px;  bottom:28px; width:184px; height:184px; }
  #stick2 { right:24px; bottom:28px; width:184px; height:184px; display:none; }
  .tbtn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center;
    justify-content:center; font-size:15px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000;
    border:3px solid rgba(255,255,255,.55); text-align:center; line-height:1.1;
    box-shadow:0 3px 10px rgba(0,0,0,.4); }
  .p2 { display:none; }
  .bA { background:rgba(255,80,40,.62); }  .bGr { background:rgba(170,90,235,.6); }
  .bJ { background:rgba(90,200,120,.6); }  .bD { background:rgba(60,140,255,.62); }
  /* 1P spacious layout */
  #bAtk  { right:118px; bottom:34px;  width:92px; height:92px; font-size:18px; }
  #bGrab { right:34px;  bottom:30px;  width:78px; height:78px; }
  #bJmp  { right:42px;  bottom:118px; width:74px; height:74px; }
  #bGrd  { right:142px; bottom:140px; width:72px; height:72px; }
  /* 2P split: P1 left cluster, P2 right cluster */
  #touch.twop #stick  { left:8px;  bottom:8px; width:128px; height:128px; }
  #touch.twop #stick2 { display:block; right:8px; bottom:8px; width:128px; height:128px; }
  #touch.twop .p2 { display:flex; }
  #touch.twop .tbtn { font-size:14px; }
  #touch.twop #bAtk { left:118px; right:auto; bottom:10px;  width:62px; height:62px; font-size:15px; }
  #touch.twop #bJmp { left:184px; right:auto; bottom:10px;  width:58px; height:58px; }
  #touch.twop #bGrd { left:118px; right:auto; bottom:76px;  width:58px; height:58px; }
  #touch.twop #bGrab{ left:184px; right:auto; bottom:76px;  width:58px; height:58px; }
  #bAtk2 { right:118px; bottom:10px; width:62px; height:62px; font-size:15px; }
  #bJmp2 { right:184px; bottom:10px; width:58px; height:58px; }
  #bGrd2 { right:118px; bottom:76px; width:58px; height:58px; }
  #bGrab2{ right:184px; bottom:76px; width:58px; height:58px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="snd">♪</div>

  <div id="start" class="overlay">
    <div class="title-sub">ARCADE BELT ACTION</div>
    <div class="title-main">聖犬士イッヌ</div>
    <div class="title-jp">〜 ワンワン帝国の野望 〜</div>
    <button id="continueBtn" class="btn hidden" style="background:linear-gradient(180deg,#7dd0ff,#3a8ad0)">▶ つづきから</button>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="startBtn" class="btn">▶ 1P イッヌ</button>
      <button id="startShimaBtn" class="btn" style="background:linear-gradient(180deg,#e0b07a,#b07a44)">▶ 1P シマダックス</button>
      <button id="startNukoBtn" class="btn" style="background:linear-gradient(180deg,#ffb0e0,#c060a8)">▶ 1P ヌコ</button>
      <button id="startG8Btn" class="btn" style="background:linear-gradient(180deg,#e0a45f,#a05a22)">▶ 1P ガードワン8号</button>
      <button id="start2Btn" class="btn" style="background:linear-gradient(180deg,#ffd08a,#ff8e2e)">▶ 2P CO-OP</button>
    </div>
    <div class="moves">
      移動 <b>矢印/WASD</b>　攻撃 <b>J/F</b>　ジャンプ <b>Space/V</b>　回避 <b>K/G</b>　掴み <b>L/H</b>（<span class="cmd">NPCの前で＝会話</span>）　　<span style="opacity:.7">スマホは画面の操作パッドで</span>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button id="resumeBtn" class="btn hidden" style="background:linear-gradient(180deg,#7dd0ff,#3a8ad0)">▶ ステージ再開</button>
      <button id="retryBtn" class="btn">▶ 最初から</button>
    </div>
  </div>

  <div id="touch">
    <div id="stick" class="stk"><div class="nub"></div></div>
    <div id="bAtk"  class="tbtn bA">攻</div>
    <div id="bGrab" class="tbtn bGr">掴</div>
    <div id="bJmp"  class="tbtn bJ">跳</div>
    <div id="bGrd"  class="tbtn bD">回避</div>
    <div id="stick2" class="stk p2"><div class="nub"></div></div>
    <div id="bAtk2"  class="tbtn bA p2">攻</div>
    <div id="bGrab2" class="tbtn bGr p2">掴</div>
    <div id="bJmp2"  class="tbtn bJ p2">跳</div>
    <div id="bGrd2"  class="tbtn bD p2">回避</div>
  </div>
</div>

<script>
"use strict";
//======================================================================
//  聖犬士イッヌ  -  belt-scroll beat 'em up  (enhanced edition)
//  - procedural BGM (battle / boss / jingles)
//  - higher-fidelity shaded rendering
//  - 4-hit combo + charge + command moves (dash slash / rising slash)
//======================================================================
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const W = 960, H = 540;                    // logical resolution（フル解像度で直接描画）

// hi-dpi crisp backing store
let DPR = Math.min(window.devicePixelRatio||1, 2);   // 負荷対策：内部解像度はDPR2まで（見た目はほぼ同等）
function setupCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
setupCanvas();

const GROUND_TOP = 372, GROUND_BOT = 516; let WORLD_END = 18400;
const LANE = 488, FIXED_SCALE = 1.82;     // single-plane brawler — larger sprites
const RISE_CEIL = 320;                     // 上昇技（昇竜など）の最高到達点＝画面天井。これ以上は上がらない
const CEIL_Z = 408;                        // ceiling height (juggle bounces off the top of the screen)

let state='title', camX=0, score=0, coins=0;
let shake=0, hitStop=0, flash=0, bossIntro=0, goArrow=0, gf=0, quake=0; // gf = global frame
let slowmo=0, slowAcc=0, stage=1, stageBanner=0, stageBannerTxt='', shopPending=0;
let cut=null, cutAdvance=false, cutSkip=false, endingDone=false;   // cutscene state
function triggerSlow(n){ slowmo=Math.max(slowmo,n); }

//======================================================================
//  Input  (per-player; globals point to the player currently being simulated)
//======================================================================
let keys, K, pressed, dirTaps, cardSeq, downTaps, stickRot;
function makeInput(){ return { keys:{},
  K:{left:false,right:false,up:false,down:false,atk:false,grd:false,grab:false},
  pressed:{atk:false,grab:false,up:false,jump:false,grd:false}, dirTaps:[], cardSeq:[], downTaps:[], stickRot:-999 }; }
function useInput(inp){ keys=inp.keys; K=inp.K; pressed=inp.pressed; dirTaps=inp.dirTaps; cardSeq=inp.cardSeq; downTaps=inp.downTaps; stickRot=inp.stickRot; }
function saveInput(inp){ inp.stickRot=stickRot; }
// key bindings per player (1P: arrows + JKL/space, 2P: WASD + F G H V)
const KEYMAP=[
  { left:['ArrowLeft'], right:['ArrowRight'], up:['ArrowUp'], down:['ArrowDown'],
    atk:['KeyJ','KeyZ'], grd:['KeyK','KeyX'], grab:['KeyL','KeyU','ShiftLeft','ShiftRight'], jump:['Space','KeyI'] },
  { left:['KeyA'], right:['KeyD'], up:['KeyW'], down:['KeyS'],
    atk:['KeyF'], grd:['KeyG'], grab:['KeyH'], jump:['KeyV','KeyB'] },
];
const CODE2PA={}; KEYMAP.forEach((m,pi)=>{ for(const act in m) m[act].forEach(c=>CODE2PA[c]=[pi,act]); });
function mapKeysFor(pi){ const m=KEYMAP[pi], inp=players[pi].in, k=inp.keys, KK=inp.K;
  KK.left=m.left.some(c=>k[c])||k['_l'];
  KK.right=m.right.some(c=>k[c])||k['_r'];
  KK.up=m.up.some(c=>k[c])||k['_u']||k['_up'];
  KK.down=m.down.some(c=>k[c])||k['_d'];
  KK.atk=m.atk.some(c=>k[c])||k['_atk'];
  KK.grd=m.grd.some(c=>k[c])||k['_grd'];
  KK.grab=m.grab.some(c=>k[c])||k['_grab'];
}
function pushTapFor(inp,d){ inp.dirTaps.push({d,f:gf}); if(inp.dirTaps.length>6) inp.dirTaps.shift(); }
function pushCardFor(inp,c){ const L=inp.cardSeq[inp.cardSeq.length-1]; if(L&&L.c===c){ L.f=gf; return; } inp.cardSeq.push({c,f:gf}); if(inp.cardSeq.length>8)inp.cardSeq.shift(); }
addEventListener('keydown',e=>{
  if(state==='cut'){ if(e.code==='Escape'||e.code==='KeyK') cutSkip=true; else cutAdvance=true; e.preventDefault(); return; }
  if(e.code==='KeyP'&&(state==='play'||state==='pause')){ togglePause(); return; }
  const pa=CODE2PA[e.code]; if(!pa) return; const [pi,act]=pa; const inp=players[pi].in;
  if(!inp.keys[e.code]){ inp.keys[e.code]=true; mapKeysFor(pi);
    if(act==='atk') inp.pressed.atk=true; if(act==='grab') inp.pressed.grab=true; if(act==='jump') inp.pressed.jump=true; if(act==='grd') inp.pressed.grd=true;
    if(act==='up') pushCardFor(inp,0); else if(act==='right'){ pushTapFor(inp,1); pushCardFor(inp,1); }
    else if(act==='down'){ pushCardFor(inp,2); inp.downTaps.push(gf); if(inp.downTaps.length>4)inp.downTaps.shift(); }
    else if(act==='left'){ pushTapFor(inp,-1); pushCardFor(inp,3); }
  }
  e.preventDefault();
});
addEventListener('keyup',e=>{ const pa=CODE2PA[e.code]; if(!pa) return; const [pi]=pa; players[pi].in.keys[e.code]=false; mapKeysFor(pi); });
// command detection (operate on the active player's globals)
function stingerReady(facing){ const want=facing>0?1:3, back=facing>0?3:1;
  const r=cardSeq.filter(t=>gf-t.f<=18);
  for(let i=r.length-1;i>=1;i--){ if(r[i].c===want && gf-r[i].f<=10){ for(let j=i-1;j>=0;j--){ if(r[j].c===back) return true; } } }
  return false; }
function rotationReady(){ if(gf-stickRot<=12) return true;
  const r=cardSeq.filter(t=>gf-t.f<=44); if(r.length<4) return false;
  for(let i=r.length-1;i>=3;i--){ const a=r[i-3].c,b=r[i-2].c,c=r[i-1].c,d=r[i].c;
    const cw=(b===(a+1)%4)&&(c===(b+1)%4)&&(d===(c+1)%4);
    const ccw=(b===(a+3)%4)&&(c===(b+3)%4)&&(d===(c+3)%4);
    if(cw||ccw) return true; }
  return false; }
function consumeCmd(){ cardSeq.length=0; dirTaps.length=0; downTaps.length=0; stickRot=-999; }
// ↓↑コマンド（下→上＋攻撃）：下から上へ入力して地面必殺を発動。
// 上を押した状態で攻撃すればよく、猶予は広め（下→上→少し遅れて攻撃でも出る）
function downUpReady(){ if(!K.up) return false;                       // 攻撃時に「上」を押していること＝↑パート
  const r=cardSeq;
  let upIdx=-1; for(let i=r.length-1;i>=0;i--){ if(r[i].c===0){ upIdx=i; break; } }   // 直近の「上」入力
  if(upIdx<0 || gf-r[upIdx].f>34) return false;                      // 上入力から約0.57秒以内
  for(let j=upIdx-1;j>=0;j--){ if(r[j].c===2 && r[upIdx].f-r[j].f<=30) return true; }  // その直前に「下」入力
  return false; }
// 波動拳コマンド（↓→＋攻撃）：下→前 の順入力
function hadokenReady(facing){ const fwdC=facing>0?1:3;
  const r=cardSeq.filter(t=>gf-t.f<=28);
  for(let i=r.length-1;i>=1;i--){ if(r[i].c===fwdC && gf-r[i].f<=9){
    for(let j=i-1;j>=0;j--){ if(r[j].c===2 && r[i].f-r[j].f<=20) return true; } } }
  return false; }
// 昇竜拳コマンド（→↓→＋攻撃）：前→下→前 の順入力
function dpReady(facing){ const fwdC=facing>0?1:3;
  const r=cardSeq.filter(t=>gf-t.f<=40);
  for(let i=r.length-1;i>=2;i--){ if(r[i].c===fwdC && gf-r[i].f<=9){
    for(let j=i-1;j>=1;j--){ if(r[j].c===2 && r[i].f-r[j].f<=20){
      for(let k=j-1;k>=0;k--){ if(r[k].c===fwdC && r[j].f-r[k].f<=20) return true; } } } } }
  return false; }

//======================================================================
//  AUDIO  -  procedural SFX + BGM engine
//======================================================================
let actx=null, sndOn=true, masterGain=null, musicGain=null, sfxGain=null, noiseBuf=null;
function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=actx.createGain(); masterGain.gain.value=0.95;
  // master bus compressor — glue + loudness so impacts punch hard without nasty clipping
  const comp=actx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=4; comp.attack.value=0.002; comp.release.value=0.16;
  masterGain.connect(comp); comp.connect(actx.destination);
  musicGain=actx.createGain(); musicGain.gain.value=0.55; musicGain.connect(masterGain);
  sfxGain=actx.createGain(); sfxGain.gain.value=1.0; sfxGain.connect(masterGain);
  // spacious reverb send for the orchestral BGM (feedback-delay "hall")
  const verb=actx.createGain(); verb.gain.value=0.42;
  const dl=actx.createDelay(0.6); dl.delayTime.value=0.16;
  const fb=actx.createGain(); fb.gain.value=0.4;
  const damp=actx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2600;
  musicGain.connect(verb); verb.connect(dl); dl.connect(damp); damp.connect(fb); fb.connect(dl); damp.connect(masterGain);
  // noise buffer for drums/impacts
  noiseBuf=actx.createBuffer(1, actx.sampleRate*0.4, actx.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
// iOS/Safari need the context resumed AND a sound started *synchronously* inside a user gesture.
function unlockAudio(){
  try{ initAudio(); }catch(e){ return; }
  if(!actx) return;
  if(actx.state!=='running'){ const r=actx.resume&&actx.resume(); if(r&&r.then)r.catch(()=>{}); }
  try{ const b=actx.createBufferSource(); b.buffer=actx.createBuffer(1,1,22050); b.connect(actx.destination); b.start(0); }catch(e){}
  if(sndOn && !Music.isPlaying()){ if(state==='play') Music.start('battle'); else if(state==='title') Music.start('title'); }
}
['touchstart','touchend','pointerdown','mousedown','keydown','click'].forEach(ev=>
  addEventListener(ev, unlockAudio, {passive:true}));
const midi=n=>440*Math.pow(2,(n-69)/12);
function tone(freq,dur,type='square',vol=.15,slide=0,dest=null){
  if(!actx||!sndOn) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),actx.currentTime+dur);
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(); o.stop(actx.currentTime+dur);
}
function noise(dur,vol,hp,dest){
  if(!actx||!sndOn) return;
  const s=actx.createBufferSource(); s.buffer=noiseBuf;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  const f=actx.createBiquadFilter(); f.type=hp?'highpass':'lowpass'; f.frequency.value=hp||1200;
  s.connect(f); f.connect(g); g.connect(dest||sfxGain); s.start(); s.stop(actx.currentTime+dur);
}
const sfx={
  swing:(p=0)=>tone(560-p*40,.09,'square',.09,-260),
  heavy:()=>{tone(300,.16,'sawtooth',.12,-180); noise(.12,.18,2000);},
  hit:()=>{tone(170,.10,'square',.15,-90); noise(.09,.22,1800);},
  big:()=>{tone(110,.22,'sawtooth',.2,-60); noise(.2,.3,800);},
  guard:()=>{tone(760,.06,'square',.1); noise(.05,.12,4000);},
  hurt:()=>tone(200,.18,'sawtooth',.13,-120),
  dash:()=>{tone(320,.14,'square',.1,300); noise(.14,.14,2600);},
  rise:()=>{tone(420,.22,'square',.11,520);},
  charge:()=>tone(180,.5,'sawtooth',.05,400,sfxGain),
  ko:()=>{tone(120,.3,'sawtooth',.16,-80); noise(.3,.2,1200);},
  boss:()=>tone(70,.6,'sawtooth',.22,40),
  twinkle:()=>{ tone(1568,.10,'triangle',.12,200); setTimeout(()=>tone(2093,.16,'triangle',.10,300),60); setTimeout(()=>tone(2637,.22,'sine',.08,-200),120); },  // 星になって消える「キラーン☆」
  coin:()=>{ tone(1318,.06,'square',.09); setTimeout(()=>tone(1760,.2,'square',.08),45); },           // コイン「チャリン♪」
  heal:()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.24,'triangle',.10),i*70)); },    // 回復チャイム
  jump:()=>{ tone(240,.16,'square',.07,420); noise(.07,.05,2800); },                                   // ジャンプ「ヒュッ」
  zap:()=>{ tone(2200,.08,'sawtooth',.10,-1400); noise(.09,.12,5200); tone(170,.12,'square',.08,-60); },// 電撃「バチッ」
  land:()=>{ tone(110,.07,'sine',.10,-40); noise(.05,.07); },                                          // 着地「トッ」
};
// ---- 命中音 = 派手な「バキーン！」（金属クラング＋鳴り）＋「ドカーン！」（爆発ブーム）----
function hitSound(dmg){
  if(!actx||!sndOn) return;
  const t=actx.currentTime, tier=dmg>=30?3:dmg>=18?2:dmg>=10?1:0, V=0.7+tier*0.22;
  // ── バ：弾けるアタック・クラック ──

      if(st===0){ organ(ch,t,stepDur*8); ch.forEach(n=>choir(n+24,t,stepDur*8*0.92)); brass(ch,t,stepDur*2.4); }   // オルガン土台＋聖歌隊＋全小節頭のパワーブラス
      if(st===0&&bar%4===0) crash(t,0.9);                                                       // フレーズ頭にシンバルの一撃
      if(st===4) brass([ch[0]+12,ch[2]+12],t,stepDur*1.3);                                       // 裏拍の追いブラス
      if(st%2===0){ const dm=S.mel[(bar*4+(st>>1))%32]; if(dm!=null) voice(midi(dm+12),t,stepDur*2.6,'sawtooth',0.04,0.2,3400); }  // 高らかに伸びるディセンタント
      if(bar===7&&st>=4) timp(t,root,0.5);                                                       // ラスト小節のティンパニロール
    } else if(!S.soft && st===0 && bar%2===0) brass(ch,t,stepDur*1.7);                          // brass stab on phrase accents
    if(S.soft){ if(st%4===0) bassN(root,t,stepDur*3.4); }                                       // gentle half-note bass
    else { const bn=[root-12,root-12,ch[2]-12,root-12,root,root-12,ch[2]-12,ch[1]-12][st];      // walking 8th-note bass
      bassN(bn,t,stepDur*0.92); }
    if(!S.soft){                                                                                // drum kit
      if(st===0||st===4) kick(t,1);
      if(S.drive&&(st===3||st===6)) kick(t,0.72);
      if(st===2||st===6) snare(t,1);
      if(bar===7&&st===7){ snare(t,0.55); snare(t+stepDur/2,0.85); }                            // phrase-end fill
      hat(t,st%2?0.55:1); hat(t+stepDur/2,0.4);                                                 // 16th hats
      if(st===0&&bar%4===0) timp(t,root,1);
      if(S.epic&&st===4) timp(t,root,0.7);                                                      // 最終決戦：ティンパニ連打
    } else hat(t,st===0?0.3:0.14);
    if(st%2===0){ const m=S.mel[(bar*4+(st>>1))%32];                                            // quarter-note melody + octave support
      if(m!=null){ voice(midi(m),t,stepDur*1.9,S.lead,S.soft?0.07:0.09,0.014,4200);
        voice(midi(m-12),t,stepDur*1.9,'triangle',0.034,0.02,2400); } }
    if(!S.soft && bar>=4 && st%2===1){ voice(midi(ch[(st>>1)%3]+12),t,stepDur*0.85,'triangle',0.028,0.01,3200); } // off-beat counter line (2nd half)
    const an=ch[ARP[st]]+(st>=4?12:0); voice(midi(an+12),t,stepDur*(S.soft?1.6:1.1),'triangle',S.soft?0.05:0.038,0.004,4600); // harp arpeggio
    if(st===7 && mode==='battle'){ const want=themeIdxFor(stage); if(want!==themeIdx) themeIdx=want; } // follow stage theme at bar lines
  }
  function tick(){ if(!playing||!actx) return;
    while(nextT < actx.currentTime+0.45){ scheduleStep(step); step=(step+1)&63; nextT+=curStep; } }
  function applyMode(m){ mode=m; if(m==='battle') themeIdx=themeIdxFor(stage); }
  function fadeTo(m){ if(!actx){ applyMode(m); return; }
    const g=bus().gain, t=actx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0.0001,t+0.32);
    setTimeout(()=>{ if(!actx) return; applyMode(m); step=0; nextT=actx.currentTime+0.06;
      const t2=actx.currentTime; g.cancelScheduledValues(t2); g.setValueAtTime(0.0001,t2); g.linearRampToValueAtTime(1,t2+0.45); },340); }
  return {
    start(m){ if(!actx) return; if(playing){ if(m&&m!==mode) fadeTo(m); return; }
      applyMode(m||'battle'); playing=true; step=0; bus().gain.value=1;
      nextT=actx.currentTime+0.1; clearInterval(timer); timer=setInterval(tick,60); },
    setMode(m){ if(!playing){ applyMode(m); return; } if(m!==mode) fadeTo(m); },
    stop(){ playing=false; clearInterval(timer); },
    isPlaying(){ return playing; }
  };
})();

  [72,76,79,84,88,91,96].forEach((n,i)=>setTimeout(()=>tone(midi(n),.3,'triangle',.07,0,musicGain),550+i*70)); }

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
function depthScale(y){ return FIXED_SCALE; } // depth removed — uniform sprite size on a single lane
// マリオ風の地面の起伏。worldX に応じて足元の高さ(描画上)を上下させる（0=平地, 正=高い丘）
function groundLift(x){ const a=Math.sin(x*0.0090)+Math.sin(x*0.0041+2.1)*0.7+Math.sin(x*0.020+0.6)*0.32; return Math.max(0,a)*30; }
// 谷（落ちると即死）。ワールド構築時にステージ区画ごとへランダム配置される
let PITS=[[1080,1210],[2400,2520],[4250,4380],[6060,6190],[8250,8380],[10240,10370],[11480,11610],[12620,12740],[13820,13940],[15020,15140],[16220,16340]];
function overPit(x){ for(const p of PITS){ if(x>p[0] && x<p[1]) return true; } return false; }
// ステージ番号→ビジュアルテーマ（分岐ルートで動的に決まる）
let STAGE2THEME={}, STAGE_NAME={};
function themeIdxFor(st){ return STAGE2THEME[st]!=null ? clamp(STAGE2THEME[st],0,STAGE_THEME.length-1) : clamp(st-1,0,STAGE_THEME.length-1); }
function radGrad(x,y,r,inner,outer){ const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r);
  g.addColorStop(0,inner); g.addColorStop(1,outer); return g; }

//======================================================================
//  Particles  (sparks, slash crescents, dust, floating text)
//======================================================================
let particles=[];
let noHitStopOnce=false;   // ヒットストップ抑制フラグ（連射弾・設置魔法用）
let curHitIsMelee=false;   // ゴルックスのパリィ：近接ヒット中フラグ
function spark(x,y,color,n=8,spd=6){
  for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), s=rnd(2,spd);
    particles.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(14,28),max:28,color,star:Math.random()<.5}); }
}
function dust(x,y,n=4){ for(let i=0;i<n;i++) particles.push({k:'dust',x,y,vx:rnd(-1.5,1.5),vy:rnd(-.4,-1.6),life:rnd(18,30),max:30}); }
function crescent(x,y,r,a0,a1,color){ particles.push({k:'arc',x,y,r,a0,a1,color,life:10,max:10}); }
function popText(x,y,txt,color,big){ particles.push({k:'txt',x,y,txt,color,big,life:46,max:46,vy:-1.3}); }
function ring(x,y,color){ particles.push({k:'ring',x,y,r:6,life:16,max:16,color}); }
function impactBurst(x,y,color,big){ particles.push({k:'impact',x,y,color,life:big?13:9,max:big?13:9,R:big?54:34,n:big?10:7,rot:Math.random()*6}); }
function updateParticles(){
  if(particles.length>240) particles.splice(0, particles.length-240);   // 負荷対策：パーティクル上限
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life--;
    if(p.k==='spark'){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.24;p.vx*=0.94; }
    else if(p.k==='dust'){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.04; }
    else if(p.k==='txt'){ p.y+=p.vy; p.vy*=0.92; }
    else if(p.k==='ring'){ p.r+=2.4; }
    else if(p.k==='twinkle'){ p.rot=(p.rot||0)+0.18; }
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{ const sx=p.x-camX, a=p.life/p.max;
    if(p.k==='txt'){ ctx.globalAlpha=clamp(a*1.4,0,1); ctx.font=`bold ${p.big?30:21}px Trebuchet MS`; ctx.textAlign='center';
      ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText(p.txt,sx,p.y); ctx.fillStyle=p.color; ctx.fillText(p.txt,sx,p.y); ctx.textAlign='left'; }
    else if(p.k==='arc'){ ctx.globalAlpha=a*0.85; ctx.strokeStyle=p.color; ctx.lineWidth=8*a+3; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(sx,p.y,p.r,p.a0,p.a1); ctx.stroke(); }
    else if(p.k==='ring'){ ctx.globalAlpha=a*0.6; ctx.strokeStyle=p.color; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,p.y,p.r,0,7); ctx.stroke(); }
    else if(p.k==='bolt'){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a;
      ctx.strokeStyle='#bfe9ff'; ctx.lineWidth=3.5*a+1; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(sx,p.y);
      for(let i=1;i<=7;i++){ ctx.lineTo(sx+p.len*(i/7), p.y+(i<7?rnd(-9,9):0)); }
      ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); }
    else if(p.k==='hlaser'){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a;
      const hw=(p.w||8)*a+2, lx0=Math.min(sx,sx+p.len), lw=Math.abs(p.len);
      const hg=ctx.createLinearGradient(sx,0,sx+p.len,0); hg.addColorStop(0,'rgba(255,170,235,.95)'); hg.addColorStop(1,'rgba(255,120,220,.1)');
      ctx.fillStyle=hg; ctx.fillRect(lx0,p.y-hw/2,lw,hw);
      ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fillRect(lx0,p.y-1,lw,2);
      ctx.restore(); }
    else if(p.k==='laser'){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a;
      const wdt=(p.w||10)*a+3;
      const lg=ctx.createLinearGradient(0,0,0,p.gy); lg.addColorStop(0,'rgba(190,235,255,.95)'); lg.addColorStop(1,'rgba(120,200,255,.55)');
      ctx.fillStyle=lg; ctx.fillRect(sx-wdt/2,0,wdt,p.gy);
      ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fillRect(sx-1.2,0,2.4,p.gy); ctx.restore(); }
    else if(p.k==='impact'){ const pr=1-a; ctx.save(); ctx.translate(sx,p.y); ctx.rotate(p.rot);
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a; ctx.strokeStyle=p.color; ctx.lineCap='round';
      for(let i=0;i<p.n;i++){ const an=i/p.n*Math.PI*2, r0=p.R*(0.3+pr*0.7), r1=p.R*(0.55+pr*0.85);
        ctx.lineWidth=3*a+1; ctx.beginPath(); ctx.moveTo(Math.cos(an)*r0,Math.sin(an)*r0); ctx.lineTo(Math.cos(an)*r1,Math.sin(an)*r1); ctx.stroke(); }
      ctx.restore(); }
    else if(p.k==='dust'){ ctx.globalAlpha=a*0.5; ctx.fillStyle='#cabfa6'; ctx.beginPath(); ctx.arc(sx,p.y,3*a+1,0,7); ctx.fill(); }
    else if(p.k==='twinkle'){ const gr=Math.sin((1-a)*Math.PI); const R=p.r*(0.5+gr); ctx.save(); ctx.translate(sx,p.y); ctx.rotate(p.rot||0);
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=clamp(a*1.3,0,1);
      ctx.fillStyle=radGrad(0,0,R*1.6,'rgba(255,255,255,.9)','rgba(255,225,90,0)'); ctx.beginPath(); ctx.arc(0,0,R*1.6,0,7); ctx.fill();
      drawStar(0,0,R*0.4,R,'#fff'); drawStar(0,0,R*0.22,R*0.6,'#ffe14d');
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2; for(let s=0;s<4;s++){ const an=p.rot+s*PI2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(an)*R*1.9,Math.sin(an)*R*1.9); ctx.stroke(); }
      ctx.restore(); }
    else { ctx.globalAlpha=a; if(p.star){ drawStar(sx,p.y,3,7,p.color); } else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,p.y,3*a+1,0,7); ctx.fill(); } }
  });
  ctx.globalAlpha=1;
}
function drawStar(x,y,r1,r2,color){ ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?r1:r2, a=Math.PI/5*i-Math.PI/2; ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r); }
  ctx.closePath(); ctx.fill(); }

        if(n>0){ popText(e.x,e.y-e.h-8,'バルーン召喚！','#ff8ab0'); ring(e.x,e.y-e.h*0.6,'#ff8ab0'); sfx.rise(); } }

    if(e.telegraph>0){ e.telegraph--; if(e.telegraph===0){ e.state='attack'; e.atkMax=t.charge?28:20; e.atkTimer=e.atkMax; sfx.heavy();} continue; }
    // AI (livelier: strafe/weave, pulsed speed, hops, feints)

    // 風船兵：ふわふわ漂って体当たりで破裂
    if(t.balloon){ e.z=Math.max(22, e.z+Math.sin(e.bob*1.6)*0.7+(36-e.z)*0.03);

    // キレボウズ：定期的にブチギレて攻撃力・速度・手数が上昇
    if(t.rager){ if(e.rageT>0){ e.rageT--; if(gf%4===0)spark(e.x+rnd(-14,14),e.y-e.h*rnd(0.4,1.1),'#ff6a3a',2,5);

      else { if(e.rageCd==null)e.rageCd=rnd(90,160); e.rageCd--;

    // ワープ犬: 一定間隔でプレイヤーの背後へ瞬間移動して不意打ち
    if(t.warper){ if(e.warpCd==null)e.warpCd=rnd(50,110); e.warpCd--;
      if(e.warpCd<=0 && e.stun<=0 && dist>90){ e.vanish=12; e.x=clamp(p.x - p.facing*60, camX+24, camX+W-24); e.facing=p.x<e.x?-1:1;

    // 跳躍犬: 中距離から飛びかかる

    // 盾犬兵: プレイヤーの攻撃を察知して構える
    if(t.guarder && dist<t.atkR+72 && e.guardCd<=0 && e.stun<=0 && (p.state==='attack'||Math.random()<0.02)){ e.state='guard'; e.guardT=rnd(36,72); e.guardCd=rnd(50,85); continue; }
    // 組み付き犬: 近づいて掴みかかる（ガードを貫通）
    if(t.grappler && dist<t.atkR+22 && e.thinkCd<=0 && e.stun<=0 && canGrabAnyPlayer()){ e.state='grabtele'; e.grabTeleT=15; e.facing=dx<0?-1:1; e.thinkCd=rnd(40,70); sfx.heavy(); popText(e.x,e.y-e.h-6,'がしっ…！','#ff6ad0'); continue; }
    const spd=t.sp*1.35*(0.8+0.34*Math.sin(e.bob*1.3))*(e.rage?1.6:1)*(e.buffTill>gf?1.35:1);  // 怒り／円陣強化で加速
    if(dist>t.atkR-6){ e.x+=Math.sign(dx)*spd; }
    else if(dist<t.atkR-34 && Math.random()<0.03){ e.x-=Math.sign(dx)*spd*0.9; }   // feint back-step
    e.y=LANE;
    if(e.z<=0 && dist>t.atkR && Math.random()<(e.type==='hyena'?0.03:0.008)){ e.vz=-6; }  // chase hop

  }

  for(let a=0;a<enemies.length;a++)for(let b=a+1;b<enemies.length;b++){ const e1=enemies[a],e2=enemies[b];
    if(e1.dead||e2.dead||e1.z>4||e2.z>4||e1.grabbedBy||e2.grabbedBy||e1.state==='pounce'||e2.state==='pounce'||e1.state==='gripping'||e2.state==='gripping'||ETYPE[e1.type].boss||ETYPE[e2.type].boss)continue;
    if(Math.abs(e1.y-e2.y)<18&&Math.abs(e1.x-e2.x)<30){ const push=e1.x<e2.x?-0.5:0.5; e1.x+=push*0.6; e2.x-=push*0.6; } }
}
// Shared melee resolver: front-arc check + guard/parry + slide/i-frame dodge. reach<0 = AoE (no facing check).
function hitOnePlayer(p,e,dmg,knock,reach,hh,unblock){
  if(!p.active||p.state==='down'||p.state==='dead'||p.state==='wheel'||p.invuln>0||p.state==='slide'||p.state==='egrab'||p.z>14) return false;
  if(Math.abs(p.y-e.y)>(hh||34)) return false;
  const dx=p.x-e.x;
  if(reach>=0){ if(Math.sign(dx)!==e.facing&&Math.abs(dx)>10) return false; if(Math.abs(dx)>reach) return false; }
  else if(Math.abs(dx)>-reach) return false;                   // AoE radius = -reach
  if(ETYPE[e.type].boss) dmg*=2;                               // 難易度UP：ボスの攻撃力2倍
  const fromFront = Math.sign(dx)===-p.facing;
  if(p.state==='guard' && fromFront){
    if(gf-p.guardStart<=9){ doParry(e,p); return true; }        // just-time guard → PARRY（ガー不もパリィなら防げる）
    if(!unblock){ sfx.guard(); spark(p.x+p.facing*24,p.y-46,'#9fd6ff',8); p.vx=e.facing*1.8; shake=3; resetCombo(); p.guardFx=8; return true; }
    popText(p.x,p.y-70,'GUARD CRUSH!','#ff4d6a',true); flash=Math.max(flash,4);
  }
  hurtPlayer(p,dmg,e.facing,knock); return true;
}
// hit whichever player(s) are in range; returns true if any connected
function tryHitPlayer(e,dmg,knock,reach,hh,unblock){
  let hit=false;
  for(const p of players){ if(!p.active) continue; if(hitOnePlayer(p,e,dmg,knock,reach,hh,unblock)){ hit=true; if(reach>=0) break; } } // AoE(<0) hits both
  return hit;
}
const ZAKO_DMG=4.0;   // 雑魚の攻撃力（難易度UP：従来の2倍）
function zakoBuffMul(e){ return (e.rage?1.6:1)*(e.buffTill>gf?1.3:1); }   // 怒り／円陣強化の攻撃力補正
function pounceStrike(e){ const t=ETYPE[e.type]; tryHitPlayer(e,t.dmg*ZAKO_DMG*zakoBuffMul(e),true,t.atkR*0.5+30,46); }
// ---- 組み付き犬の掴み（プレイヤー拘束）----
function canGrabPlayer(p){ return p && p.active && p.invuln<=0 && p.z<24 && p.state!=='dead' && p.state!=='down'

function canGrabAnyPlayer(){ for(const p of players){ if(canGrabPlayer(p)) return true; } return false; }
function grabbablePlayerNear(e){ for(const p of players){ if(canGrabPlayer(p) && Math.abs(p.x-e.x)<42 && Math.abs(p.y-e.y)<46) return p; } return null; }

  sfx.heavy(); shake=Math.max(shake,6); popText(p.x,p.y-92,'つかまれた！ 連打で脱出！','#ff6ad0',true); }
function releaseEnemyGrab(e){ const p=e.grabTarget; if(p&&p.grabbedByEnemy===e){ p.grabbedByEnemy=null; if(p.state==='egrab')p.state='idle'; } e.grabTarget=null; }
function updateEnemyGrab(){ const p=player, e=p.grabbedByEnemy;
  if(!e||e.dead||e.state!=='gripping'){ p.grabbedByEnemy=null; p.state='idle'; return; }

function pickBossMove(e,dist){ const list=BOSSMOVES[ETYPE[e.type].bossKind]||[];
  const cands=list.filter(m=>MV[m] && dist>=MV[m].minR && dist<=MV[m].maxR);
  if(!cands.length) return null;
  // avoid repeating the same move back-to-back when possible
  let pool=cands.filter(m=>m!==e.lastMove); if(!pool.length)pool=cands;
  return pool[Math.floor(Math.random()*pool.length)];
}

  else if(dist<wantR-40) e.x-=Math.sign(dx)*t.sp*0.8;
  e.y=LANE;
  if(e.moveCd<=0 && e.stun<=0){ const mv=pickBossMove(e,dist);
    if(mv){ e.moveName=mv; const cfg=MV[mv]; e.danger=!!cfg.danger; e.state='bwind'; e.moveT=cfg.tele; e.teleMax=cfg.tele; e.moveMax=cfg.dur;
      if(mv!=='roar')sfx.heavy(); } }
}
function hurtPlayer(p,dmg,dir,knockdown){ if(!p)p=player; if(p.invuln>0||p.state==='dead')return;
  dmg=Math.max(1,Math.round(dmg*(p.defMul||1)));   // 防御力（守りのマント）で軽減
  p.hp-=dmg; p.invuln=knockdown?64:38; p.vx=dir*4; shake=7; flash=Math.max(flash,4); hurtSound(dmg); resetCombo();
  p.charge=0; p.atkHeld=false; spark(p.x,p.y-42,'#ff4444',9);
  if(p.hp<=0){ loseLife(p); return; }
  p.state=knockdown?'down':'hurt'; p.hurtTimer=14; p.downTimer=46; }
function loseLife(p){ if(!p)p=player; if(p.state==='dead')return; p.lives--; p.hp=0;
  if(p.grabEnemy){ p.grabEnemy.grabbedBy=0; p.grabEnemy=null; }
  p.state='dead'; p.downTimer=40; p.vz=8; p.riseVel=0;
  if(p.lives<0){ p.active=false; popText(p.x,p.y-100,(p.kind==='shima'?'シマダックス':p.kind==='nuko'?'ヌコ':p.kind==='guard8'?'ガードワン8号':'イッヌ')+' DOWN…','#ff5a5a',true);
    if(activePlayers().length===0) gameOver(); return; }
  p.respawnT=90; }

// 区画リストをワールド末尾へ追加（ゲート・NPC・落とし穴・イベントを配置）
function addBlocks(blocks,opts){
  blocks.forEach((b,bi)=>{
    const B=worldCursor, st=nextStage++, len=b.len||1900, last=bi===blocks.length-1;
    STAGE2THEME[st]=b.theme; STAGE_NAME[st]=b.name; stageStartX[st]=B;
    if(B>0 && !b.noPit && Math.random()<0.5) PITS.push([B+260,B+372]);
    b.gates.forEach(g=>{ encounters.push({st, at:B+g.off, list:g.list, boss:g.boss, mini:g.mini, rival:g.rival,
      final:g.final, branchAfter:(g.boss&&last&&opts&&opts.branchAfter)||undefined }); });
    if(b.npc) placeNPC(Object.assign({x:B+840+rnd(-60,60)},b.npc));
    if(b.npc2) placeNPC(Object.assign({x:B+(b.npc2.atX||1640)+rnd(-40,40)},b.npc2));   // 区画固有の2人目NPC（祭壇など）
    // ランダムイベントを多めに配置（未知の世界の冒険感を強調）
    if(!b.noPit){ placeNPC(randomEvent(B+1500+rnd(-90,140)));
      if(Math.random()<0.7) placeNPC(randomEvent(B+1120+rnd(-60,80))); }
    if(!b.npc && !b.noPit && Math.random()<0.7) placeNPC(randomEvent(B+760+rnd(-60,60)));
    worldCursor=B+len;
  });
  WORLD_END=worldCursor+340; curGateX=WORLD_END;
}

  {id:'yugure', b:CH1[1],       mx:0.20, my:0.34},   // 黄昏の城下町（ライバル中ボス）
  {id:'gouka',  b:SEGS.A[0][0], mx:0.34, my:0.60},   // 業火の渓谷
  {id:'kokoku', b:SEGS.A[0][1], mx:0.46, my:0.78},   // 渓谷の最深部
  {id:'mori',   b:SEGS.A[1][0], mx:0.30, my:0.20},   // 月詠の森
  {id:'suisho', b:SEGS.A[1][1], mx:0.44, my:0.42},   // 瑠璃の水晶洞
  {id:'hikoutei',b:SEGS.B[0][0],mx:0.58, my:0.24},   // 海賊飛行艇の甲板
  {id:'futou',  b:SEGS.B[0][1], mx:0.70, my:0.40},   // 海賊王の埠頭
  {id:'sabaku', b:SEGS.B[1][0], mx:0.60, my:0.64},   // 灼熱の砂漠
  {id:'haikyo', b:SEGS.B[1][1], mx:0.72, my:0.78},   // 灼熱の巨大廃墟
  {id:'reihou', b:FINAL_CH[0],  mx:0.82, my:0.55},   // 氷雪の霊峰
];
const WORLD_FINAL=[
  {id:'joumon', b:FINAL_CH[1],  mx:0.90, my:0.34, locked:true},   // 暗黒の城門（クロイヌ＋月光の祭壇）
  {id:'maou',   b:FINAL_CH[2],  mx:0.95, my:0.16, locked:true, final:true},   // 魔王の間
];
const FINAL_UNLOCK=6;   // 通常ステージをこの数クリアで「暗黒の城門」が解禁
let levelsDone={}, mapSel=0, mapNavCd=0, curLevelId=null, curLevelFinal=false;
function allMapNodes(){ return WORLD_LEVELS.concat(WORLD_FINAL); }
function doneCount(){ return WORLD_LEVELS.filter(l=>levelsDone[l.id]).length; }
function nodeUnlocked(node){
  if(node.final) return !!levelsDone['joumon'];                 // 魔王の間＝城門クリア後
  if(node.id==='joumon') return doneCount()>=FINAL_UNLOCK;      // 城門＝規定数クリア後
  return true;                                                  // 通常ステージは最初から自由
}
function nodeSelectable(node){ return nodeUnlocked(node) && !levelsDone[node.id]; }
// 1レベルだけを読み込んで開始（x=0 起点の独立フィールド）
function loadLevel(node){
  resetWorldState(); curLevelId=node.id; curLevelFinal=!!node.final;
  const blocks = node.id==='joumon' ? [node.b] : [node.b];
  addBlocks(blocks, null);
  stage=1; for(const k in STAGE2THEME){ stage=k|0; break; }     // 単一区画の st
  players.forEach(p=>{ if(p.active){ resetPlayer(p,false); p.x=clamp(90+p.pid*60,30,WORLD_END-30); } });
  camX=0; player=players[0]; goArrow=160; shopPending=0;
  state='play'; if(sndOn){ if(!Music.isPlaying())Music.start('battle'); else Music.setMode('battle'); }
  saveProgress(1);
}
function enterMap(){ state='map'; mapNavCd=10;
  // カーソルを最初の選択可能ノードへ
  const nodes=allMapNodes(); if(!nodeSelectable(nodes[mapSel])){ for(let i=0;i<nodes.length;i++){ if(nodeSelectable(nodes[i])){ mapSel=i; break; } } }
  unlockAudio(); if(sndOn){ if(!Music.isPlaying())Music.start('town'); else Music.setMode('town'); }
  // 全ステージ制覇していれば魔王の間へ促す（自動選択）
}
function updateMap(){ useInput(players[0].in); if(mapNavCd>0)mapNavCd--;
  const nodes=allMapNodes();
  if(mapNavCd<=0){ let mv=0; if(K.left)mv=-1; else if(K.right)mv=1; else if(K.up)mv=-1; else if(K.down)mv=1;
    if(mv){ // 選択可能ノードを順に移動
      let i=mapSel; for(let k=0;k<nodes.length;k++){ i=(i+mv+nodes.length)%nodes.length; if(nodeSelectable(nodes[i])){ mapSel=i; break; } }
      mapNavCd=10; sfx.swing(0); } }
  if(pressed.atk||pressed.jump){ pressed.atk=false; pressed.jump=false;
    const node=nodes[mapSel];
    if(nodeSelectable(node)){ sfx.rise(); saveInput(players[0].in); loadLevel(node); return; }
    else { sfx.guard(); } }
  saveInput(players[0].in); updateParticles();
}
function drawMap(){
  // 空と大地
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#26406a'); g.addColorStop(.5,'#3a5a7a'); g.addColorStop(1,'#2a3a44'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 星
  for(let i=0;i<60;i++){ const x=(i*137.5)%W, y=(i*71.3)%(H*0.5); ctx.globalAlpha=0.3+0.5*Math.abs(Math.sin(gf*0.02+i)); ctx.fillStyle='#dfe7ff'; ctx.fillRect(x,y,1.6,1.6); } ctx.globalAlpha=1;
  // 大陸っぽい地面
  ctx.fillStyle='rgba(60,90,60,.5)'; ctx.beginPath(); ctx.moveTo(0,H*0.7);
  for(let x=0;x<=W;x+=40){ ctx.lineTo(x, H*0.68+Math.sin(x*0.01+2)*30); } ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
  ctx.fillStyle='#ffe14d'; ctx.font='900 30px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif'; ctx.textAlign='center';
  ctx.strokeStyle='#000'; ctx.lineWidth=5; ctx.strokeText('ワールドマップ',W/2,52); ctx.fillText('ワールドマップ',W/2,52);

  const nodes=allMapNodes();
  // ノード間の道（隣接を薄く結ぶ）
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
  for(let i=0;i<nodes.length-1;i++){ const a=nodes[i],b=nodes[i+1]; ctx.beginPath(); ctx.moveTo(a.mx*W,a.my*H*0.9+70); ctx.lineTo(b.mx*W,b.my*H*0.9+70); ctx.stroke(); }
  ctx.setLineDash([]);
  nodes.forEach((node,i)=>{ const x=node.mx*W, y=node.my*H*0.9+70, done=levelsDone[node.id], unl=nodeUnlocked(node), sel=i===mapSel;
    // ノード円

    if(sel){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=radGrad(x,y,34,'rgba(255,240,150,.8)','rgba(255,240,150,0)'); ctx.beginPath(); ctx.arc(x,y,34,0,7); ctx.fill(); ctx.restore(); ctx.fillStyle=unl&&!done?'#fff':'rgba(255,210,80,.92)'; }
    ctx.beginPath(); ctx.arc(x,y,15,0,7); ctx.fill();
    ctx.strokeStyle='#1a1410'; ctx.lineWidth=2.5; ctx.stroke();
    if(done){ ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x-6,y); ctx.lineTo(x-1,y+6); ctx.lineTo(x+7,y-6); ctx.stroke(); }   // チェック
    else if(!unl){ ctx.fillStyle='#2a2a34'; ctx.fillRect(x-4,y-1,8,7); ctx.beginPath(); ctx.arc(x,y-1,4,Math.PI,0); ctx.strokeStyle='#2a2a34'; ctx.lineWidth=2; ctx.stroke(); }   // 鍵
    // 名前
    ctx.fillStyle=sel?'#fff':(unl?'#ffe9a0':'#8a8a9a'); ctx.font='bold 13px "Hiragino Maru Gothic ProN",sans-serif'; ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.lineWidth=3; const nm=node.b.name; ctx.strokeText(nm,x,y+30); ctx.fillText(nm,x,y+30);
  });
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.8)'; ctx.font='13px "Hiragino Maru Gothic ProN",sans-serif';

function linesFor(n){ if(Array.isArray(n.lines)) return n.lines;
  return n.lines[players[0].kind]||n.lines.inu||[]; }   // キャラ別セリフ（オブジェクト形式に対応）

function updateTalk(){ if(!dialog){ state='play'; return; }
  useInput(players[0].in); dialog.t++;
  const line=dialog.ls[dialog.i]||'', full=dialog.t>=line.length*2;
  if(pressed.atk||pressed.jump||pressed.grab){ pressed.atk=pressed.jump=pressed.grab=false;
    if(!full){ dialog.t=line.length*2; }
    else { dialog.i++; dialog.t=0; sfx.swing(0);
      if(dialog.i>=dialog.ls.length){ endTalk(); return; } } }
  saveInput(players[0].in); }
function endTalk(){ const n=dialog.n, p=dialog.p; dialog=null; state='play';
  if(!n.met){ n.met=true; metNPC++; }
  if(n.give && (!n.given || n.give.shop)){ n.given=true; applyGive(n,p); }

  players.forEach(pp=>{ if(pp.active){ pp.invuln=Math.max(pp.invuln,18); pp.in.pressed.atk=pp.in.pressed.jump=pp.in.pressed.grab=false; } }); }

  if(g.chest){ chestsOpened++; const r=Math.random();
    if(r<0.18){ popText(n.x,LANE-130,'ミミックだ！！','#ff5a5a',true); sfx.boss(); shake=Math.max(shake,6);

    else { const c=8+(Math.random()*14|0); for(let i=0;i<c;i++) makeCoin(n.x,1); sfx.coin(); } } }
function triggerAmbush(n){ popText(n.x,LANE-140,'待ち伏せだ！','#ff5a5a',true); sfx.boss(); shake=Math.max(shake,6);
  const picks=['wolf','hyena','ari','kirebouzu'];
  for(let i=0;i<4;i++) spawnEnemy(picks[i%picks.length], n.x+(i%2?1:-1)*(W*0.52+rnd(0,90)), rnd(GROUND_TOP+20,GROUND_BOT-10)); }
function updateNPCs(){

// y = depth coordinate (like entities); zz = visual height above ground for draw/collision.
let projectiles=[];
function spawnProj(x,y,vx,vy,o){ o=o||{};
  projectiles.push({x,y,vx,vy,zz:(o.zz!=null?o.zz:56),vzz:o.vzz||0,explode:!!o.explode,nostop:!!o.nostop,noLaunch:!!o.noLaunch,
    pierce:!!o.pierce||!!o.multihit,wave:!!o.wave,hit:(o.pierce||o.multihit)?new Set():null,homing:!!o.homing,spike:!!o.spike,
    multihit:!!o.multihit,hitGap:o.hitGap||8,hitAt:o.multihit?{}:null,
    life:o.life||150,r:o.r||11,dmg:o.dmg||10,color:o.color||'#d46bff',owner:o.owner||'enemy',spin:Math.random()*6,trail:[]}); }
// returns 'reflect' | 'gone' | null
function projVsPlayer(pr,p){
  if(!p.active||p.state==='dead') return null;
  const near = Math.abs(p.x-pr.x)<pr.r+14 && Math.abs(p.y-pr.y)<30 && pr.zz<64 && pr.zz>-8;
  const overIt = p.z > pr.zz+18;
  if(!near||overIt) return null;
  const dir=pr.vx>0?1:-1, fromFront=Math.sign(pr.x-p.x)===-p.facing;
  if(p.state==='slide'||p.invuln>0) return null;          // dodged
  if(p.state==='guard' && fromFront){
    if(gf-p.guardStart<=9){ pr.owner='player'; pr.vx=-pr.vx*1.5||(-p.facing*9); pr.vy*=-0.5; pr.vzz=0; pr.dmg=Math.max(pr.dmg,18); pr.color='#bfe9ff';
      spark(p.x+p.facing*22,p.y-40,'#fff',16,9); ring(p.x+p.facing*20,p.y-40,'#bfe9ff'); sfx.guard(); sfx.rise(); hitStop=10; popText(p.x,p.y-70,'REFLECT!','#9ff0ff',true); return 'reflect'; }
    sfx.guard(); spark(p.x+p.facing*22,p.y-44,'#9fd6ff',8); p.vx=dir*1.6; shake=3; p.guardFx=8; resetCombo(); return 'gone';
  }
  hurtPlayer(p,pr.dmg*2,dir,true); spark(pr.x,pr.y-pr.zz,pr.color,12,8); return 'gone';   // 難易度UP：敵弾2倍
}
function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){ const pr=projectiles[i];
    if(pr.homing){ let tx=null,ty=0;
      if(pr.owner==='enemy'){ const tp=nearestPlayerTo(pr.x); if(tp){ tx=tp.x; ty=tp.y-26; } }
      else { let best=null,bd=1e9; for(const e of enemies){ if(e.dead||e.grabbedBy)continue; const d=Math.abs(e.x-pr.x)+Math.abs(e.y-pr.y)*0.6; if(d<bd){bd=d;best=e;} } if(best){ tx=best.x; ty=best.y-best.h*0.5; } }
      if(tx!=null){ const ang=Math.atan2(ty-(pr.y-pr.zz),tx-pr.x); const cur=Math.atan2(pr.vy,pr.vx); let d=ang-cur; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; const na=cur+clamp(d,pr.owner==='enemy'?-0.10:-0.16,pr.owner==='enemy'?0.10:0.16), sp=Math.hypot(pr.vx,pr.vy)||6; pr.vx=Math.cos(na)*sp; pr.vy=Math.sin(na)*sp; } }
    pr.x+=pr.vx; pr.y=clamp(pr.y+pr.vy,GROUND_TOP-4,GROUND_BOT+4); pr.zz+=pr.vzz; pr.life--; pr.spin+=0.4;
    pr.trail.push({x:pr.x,y:pr.y-pr.zz}); if(pr.trail.length>7)pr.trail.shift();
    if(pr.owner==='player'){
      // 下方向エネルギー弾：地面で爆発（範囲ダメージ）
      if(pr.explode && pr.zz<=2){ ring(pr.x,LANE,pr.color); ring(pr.x,LANE,'#fff'); spark(pr.x,LANE,pr.color,20,11); dust(pr.x,LANE,12); shake=Math.max(shake,7); flash=Math.max(flash,3); sfx.big();
        enemies.forEach(e=>{ if(e.dead||e.grabbedBy)return; if(Math.abs(e.x-pr.x)<90){ damageEnemy(e,pr.dmg+4,(e.x<pr.x?-1:1)*10,true); if(!e.dead)launchEnemy(e,(e.x<pr.x?-1:1)*14,-9,3); } });
        projectiles.splice(i,1); continue; }
      let hit=false;
      for(const e of enemies){ if(e.dead||e.grabbedBy)continue;
        if(pr.multihit){ if(gf-(pr.hitAt[e.id]!=null?pr.hitAt[e.id]:-999) < pr.hitGap) continue; }   // 多段ヒット：一定間隔で再ヒット
        else if(pr.pierce && pr.hit.has(e.id))continue;
        if(Math.abs(e.x-pr.x)<e.w*0.5+pr.r && Math.abs(e.y-pr.y)<(pr.wave?44+pr.r*0.3:30) && pr.zz<e.h){
          if(pr.multihit){ noHitStopOnce=true; damageEnemy(e,pr.dmg,pr.vx>0?3:-3,false); spark(e.x,e.y-e.h*0.5,'#fff',6,7); }   // 多段ヒット：低威力・浮かせずに刻む
          else if(pr.nostop){ noHitStopOnce=true; damageEnemy(e,pr.dmg,pr.vx>0?2:-2,false); }   // エネルギー弾：低威力・ノックダウンもヒットストップも無し
          else damageEnemy(e,pr.dmg,pr.vx>0?9:-9,true);
          if(pr.wave&&!pr.noLaunch&&!pr.multihit&&!e.dead)launchEnemy(e,(pr.vx>0?1:-1)*16,-8,3);
          spark(e.x,e.y-e.h*0.5,pr.color,12,8);
          if(pr.multihit){ pr.hitAt[e.id]=gf; } else if(pr.pierce){ pr.hit.add(e.id); } else { hit=true; break; } } }
      if(hit){ spark(pr.x,pr.y-pr.zz,pr.color,12,8); projectiles.splice(i,1); continue; }
    } else {
      let res=null; for(const p of players){ res=projVsPlayer(pr,p); if(res)break; }
      if(res==='reflect') continue;
      if(res==='gone'){ projectiles.splice(i,1); continue; }
    }
    if(pr.life<=0 || pr.x<camX-100 || pr.x>camX+W+100 || pr.zz<-30) projectiles.splice(i,1);
  }
}
function drawProjectiles(){
  projectiles.forEach(pr=>{ const sx=pr.x-camX, sy=pr.y-pr.zz;
    if(pr.wave){ const dir=pr.vx>0?1:-1; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(sx,pr.y);
      for(let k=0;k<3;k++){ ctx.globalAlpha=0.5-k*0.13; ctx.strokeStyle=pr.color; ctx.lineWidth=7-k*2;
        ctx.beginPath(); ctx.ellipse(-dir*k*9, -28, pr.r*0.7, pr.r*1.7, 0, -1.15, 1.15); ctx.stroke(); }
      ctx.globalAlpha=0.85; ctx.fillStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(dir*4,-28,pr.r*0.4,pr.r*1.5,0,-1.0,1.0); ctx.fill();
      ctx.restore(); return; }
    if(pr.spike){ const ang=Math.atan2(pr.vy,pr.vx); ctx.save(); ctx.translate(sx,sy); ctx.rotate(ang);
      ctx.fillStyle=pr.color; ctx.beginPath(); ctx.moveTo(pr.r+4,0); ctx.lineTo(-pr.r*0.5,pr.r*0.7); ctx.lineTo(-pr.r*0.5,-pr.r*0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(pr.r+4,0); ctx.lineTo(0,pr.r*0.28); ctx.lineTo(0,-pr.r*0.28); ctx.closePath(); ctx.fill(); ctx.restore(); return; }
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<pr.trail.length;i++){ const tp=pr.trail[i], a=i/pr.trail.length*0.4;
      ctx.globalAlpha=a; ctx.fillStyle=pr.color; ctx.beginPath(); ctx.arc(tp.x-camX,tp.y,pr.r*(0.5+i/pr.trail.length*0.5),0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.fillStyle=radGrad(sx,sy,pr.r*1.8,'#ffffff',pr.color); ctx.beginPath(); ctx.arc(sx,sy,pr.r*1.8,0,7); ctx.fill();
    ctx.fillStyle=pr.color; ctx.beginPath(); ctx.arc(sx,sy,pr.r,0,7); ctx.fill();
    ctx.fillStyle='#fff'; for(let k=0;k<4;k++){ const a=pr.spin+k*PI2; ctx.beginPath();
      ctx.arc(sx+Math.cos(a)*pr.r*0.5, sy+Math.sin(a)*pr.r*0.5, pr.r*0.28,0,7); ctx.fill(); }
    ctx.restore();
  });
}

function camFocusX(){ const ap=activePlayers().filter(p=>p.state!=='dead'); if(!ap.length) return players[0].x;
  let mn=1e9,mx=-1e9; ap.forEach(p=>{ mn=Math.min(mn,p.x); mx=Math.max(mx,p.x); }); return (mn+mx)/2; }
function updateCamera(){
  const target=clamp(camFocusX()-W*0.5,0,WORLD_END-W);
  const enc=encounters[encIndex];
  const maxC=(enc&&!enc.cleared&&enc.spawned)?clamp(enc.at-W*0.45,0,WORLD_END-W):WORLD_END-W;
  camX+=(Math.min(target,maxC)-camX)*0.12; camX=clamp(camX,0,WORLD_END-W);
  players.forEach(p=>{ if(p.active) p.x=clamp(p.x,camX+24,camX+W-24); });
}
function stepPlayers(){
  for(const pl of players){ if(!pl.active) continue;
    player=pl; useInput(pl.in);
    if(pl.state==='dead'){ pl.respawnT--; if(pl.respawnT<=0 && pl.lives>=0) resetPlayer(pl,false); }
    else { updatePlayer();
      if(pl.weaponT>0){ pl.weaponT--; if(pl.weaponT<=0){ const base=pl.permWeapon||(pl.kind==='shima'?'fists':pl.kind==='nuko'?'wand':pl.kind==='guard8'?'ghammer':'dagger'); if(pl.weapon!==base){ pl.weapon=base; popText(pl.x,pl.y-110, pl.permWeapon?WEAPONS[base].name+'に戻した':(base==='fists'?'素手に戻った':base==='wand'?'星の杖に戻した':'短剣に戻った'),'#cfd8e6'); } } } }
    saveInput(pl.in);
  }
  player=players[0];
}
function update(){
  gf++;
  if(hitStop>0){ hitStop--; if(state==='play'){updateParticles();updateProjectiles();} return; }
  if(state==='talk'){ updateTalk(); updateParticles(); return; }
  if(state==='branch'){ updateBranch(); return; }
  if(state!=='play') return;
  stepPlayers(); updateEnemies(); updateProjectiles(); updateHazards(); updateItems(); updateEncounters(); updateNPCs(); updateCamera(); updateCombo(); updateParticles();
  if(shake>0)shake-=0.7; if(quake>0)quake--; if(flash>0)flash--; if(bossIntro>0)bossIntro--; if(goArrow>0)goArrow--; if(stageBanner>0)stageBanner--;
  if(shopPending>0 && state==='play'){ shopPending--; if(shopPending===0) enterShop(); }   // 会話などで中断されたら次のフレームで再試行
}

function render(){
  // フル解像度＆DPRスケールで直接描画（なめらかな高精細レンダリング）
  ctx.clearRect(0,0,W,H);
  ctx.save();
  const _q=shake+(quake>0?Math.abs(Math.sin(gf*0.9))*quake*0.5:0);
  if(_q>0) ctx.translate(rnd(-_q,_q),rnd(-_q*0.6,_q*0.6));
  drawBackground(); drawGround();
  drawNPCs();
  drawItems();
  const order=[...enemies.map(e=>({y:e.y,e}))];
  players.forEach(pl=>{ if(pl.active) order.push({y:pl.y+pl.pid*0.5, pl}); });
  order.sort((a,b)=>a.y-b.y);
  order.forEach(o=>{ if(o.pl){ player=o.pl;
      if(o.pl.state==='seven'){ const sx0=o.pl.x; ctx.save(); ctx.globalAlpha=0.32;   // 七体の分身残像
        for(let g=0;g<7;g++){ o.pl.x=clamp(camX+ (g+0.5)/7*W + Math.sin(gf*0.5+g)*16, camX+24, camX+W-24); drawPlayer(); }
        ctx.restore(); o.pl.x=sx0; }
      drawPlayer(); }
    else drawEnemy(o.e); });
  player=players[0];
  drawHazards();
  drawProjectiles();
  drawParticles();
  drawGreatOne();
  drawForeground();
  drawLighting();
  ctx.restore();
  if(flash>0){ ctx.fillStyle='rgba(255,90,80,'+(flash/12)+')'; ctx.fillRect(0,0,W,H); }
  drawHUD();
}

function shade(hex,amt){ const c=hex.replace('#',''); const n=c.length===3?c.split('').map(x=>x+x).join(''):c;

function drawGround(){
  const T=curTheme();
  const g=ctx.createLinearGradient(0,GROUND_TOP,0,H); g.addColorStop(0,T.g[0]); g.addColorStop(.5,T.g[1]); g.addColorStop(1,T.g[2]);
  ctx.fillStyle=g; ctx.fillRect(0,GROUND_TOP,W,H-GROUND_TOP);
  // cobblestones（負荷対策：行数と装飾を間引いた軽量版）
  for(let r=0;r<6;r++){ const y=GROUND_TOP+r*r*4+r*8; if(y>H)break;
    const sz=30+r*12, off=((-(camX)% sz)+sz)%sz + (r%2?sz/2:0);
    for(let x=-sz;x<W+sz;x+=sz){ const cxs=x-off+sz/2, cys=y+sz*0.34;
      ctx.fillStyle= (Math.floor((x-off)/sz)+r)%2? T.cob[0]:T.cob[1];
      ctx.beginPath(); ctx.ellipse(cxs,cys,sz*0.46,sz*0.30,0,0,7); ctx.fill(); }
  }
  // top edge shadow (wall base)
  const es=ctx.createLinearGradient(0,GROUND_TOP-2,0,GROUND_TOP+16); es.addColorStop(0,'rgba(0,0,0,.35)'); es.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=es; ctx.fillRect(0,GROUND_TOP-2,W,18);
  // ── 谷（落とし穴）：暗い奈落を描く ──
  for(const pit of PITS){ const x0=pit[0]-camX, x1=pit[1]-camX; if(x1<-30||x0>W+30)continue;
    const cg=ctx.createLinearGradient(0,LANE-70,0,H); cg.addColorStop(0,'#0c0c16'); cg.addColorStop(1,'#000');
    ctx.fillStyle=cg; ctx.fillRect(x0,LANE-70,x1-x0,H-(LANE-70)); }
  // ── マリオ風の起伏した前景の地面（キャラはこの稜線の上に立つ。谷では地面が無い）──
  const step=10;
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let sx=0;sx<=W+step;sx+=step){ const wx=sx+camX; const ty=overPit(wx)?H:(LANE-groundLift(wx)); ctx.lineTo(sx,ty); }
  ctx.lineTo(W,H); ctx.closePath();

  ctx.fillStyle=hg; ctx.fill();

  ctx.strokeStyle=shade(T.g[0],44); ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
  let pen=false; ctx.beginPath();
  for(let sx=0;sx<=W+step;sx+=step){ const wx=sx+camX; if(overPit(wx)){ pen=false; continue; } const ty=LANE-groundLift(wx); if(!pen){ctx.moveTo(sx,ty);pen=true;} else ctx.lineTo(sx,ty); }
  ctx.stroke();
  // 地面のテクスチャ（稜線に沿った小石）
  for(let sx=14; sx<W; sx+=46){ const wx=sx+camX; if(overPit(wx))continue; const ty=LANE-groundLift(wx);
    ctx.fillStyle='rgba(0,0,0,.14)'; ctx.beginPath(); ctx.ellipse(sx,ty+22+((wx*0.7)%24),6,3,0,0,7); ctx.fill(); }

// ---- Enemies dispatch ----
function drawEnemy(e){
  const t=ETYPE[e.type], s=depthScale(e.y), sx=e.x-camX, sy=e.y-groundLift(e.x);
  if(sx<-150||sx>W+150) return;   // 負荷対策：画面外の敵は描かない
  let al=1; if(e.dead&&e.deadTimer<22) al=clamp(e.deadTimer/22,0,1); if(e.vanish>0) al=Math.min(al,0.35);
  // 兵隊アリ：地中移動中は土の盛り上がりだけを描く
  if(e.sub && t.digger){ ctx.save(); ctx.translate(sx,sy);
    ctx.fillStyle='#6a4a2c'; ctx.beginPath(); ctx.ellipse(0,-4,22,10,0,Math.PI,0); ctx.fill();
    ctx.fillStyle='#8a6a40'; ctx.beginPath(); ctx.ellipse(-6,-8,9,5,0.3,Math.PI,0); ctx.fill();
    ctx.restore(); return; }
  ctx.globalAlpha=al;
  softShadow(sx,sy,(t.w*0.5)*s*(e.z>0?0.7:1));
  ctx.save(); ctx.translate(sx,sy-e.z); ctx.scale(e.facing*s,s);
  if(e.grabbedBy && player.state==='wheel'){ ctx.rotate(player.wheelRot+Math.PI); }   // 地獄グルマで一緒に回転
  if(e.grabbedBy && player.state==='screw'){ ctx.rotate(player.screwRot+Math.PI); }   // スクリューで一緒に回転
  if(e.grabbedBy && player.state==='gswing'){ ctx.rotate(player.gswingRot+Math.PI*0.5); }   // ジャイアントスイングで振り回される
  if(e.state==='blastoff'){ ctx.rotate(e.spin); const bsc=clamp(1-e.bo/95,0.3,1); ctx.scale(bsc,bsc); }   // 飛び去りながら回転＆縮小
  if((e.state==='walk')&&e.z<=0) ctx.translate(0,-Math.abs(Math.sin(e.bob*1.3))*3);   // lively bob
  if(e.state==='down'||e.dead){ ctx.rotate(0.95); ctx.translate(0,8); }
  // telegraph = crouch+lean back (wind-up); attack/bmove = explosive lunge + stretch
  if(e.telegraph>0){ const w=1-e.telegraph/(e.teleMax||26); ctx.rotate(-0.18*(1-w)); ctx.translate(-9*(1-w),3*(1-w)); ctx.scale(1+0.10*(1-w),1-0.10*(1-w)); }
  else if(e.state==='attack'){ const w=clamp((e.atkMax-e.atkTimer)/6,0,1); const big=Math.sin(clamp((e.atkMax-e.atkTimer)/Math.max(1,e.atkMax),0,1)*Math.PI);
    ctx.translate(9*w+10*big,0); ctx.rotate(0.10*w); ctx.scale(1+0.16*big,1-0.12*big); }
  else if(e.state==='bmove'){ const big=Math.sin(clamp(e.moveT/Math.max(1,e.moveMax),0,1)*Math.PI); ctx.rotate(0.07); ctx.translate(6+8*big,0); ctx.scale(1+0.10*big,1-0.07*big); }
  else if(e.state==='crouch'){ ctx.scale(1,0.84); ctx.translate(0,5); }
  else if(e.state==='pounce'){ ctx.rotate(0.28); }
  if(t.slimey) drawSlime(e);
  else if(e.type==='wanmen'){ drawWanmen(e); }
  else if(e.type==='golux'){ drawGolux(e); }
  else if(e.type==='papipoo'){ drawPapipoo(e); }
  else if(t.bossKind==='guard0'){ drawGuard0(e); }
  else if(t.boss){ const bk=t.bossKind; if(bk==='emperor')drawBoss(e); else if(bk==='dragon')drawDragon(e); else if(bk==='ghost')drawGhost(e); else if(bk==='rival')drawRival(e); else if(bk==='shark')drawShark(e); else if(bk==='pirate')drawPirate(e); else if(bk==='noroinu')drawNoroinu(e); else if(bk==='cactus')drawCactus(e); else if(bk==='wolfking')drawWolfKing(e); else if(bk==='darkknight')drawDarkKnight(e); else drawBigBoss(e); }
  else if(e.type==='bitter') drawBitter(e); else if(e.type==='warpdog') drawWarpdog(e);
  else if(t.summoner) drawPierrot(e); else if(t.balloon) drawBalloonFoe(e);
  else if(t.rager) drawKirebouzu(e); else if(t.digger) drawAri(e); else if(t.buffer) drawOnibouzu(e);
  else drawBeast(e);
  if(t.guarder) drawEnemyShield(e);
  if(e.frozen>0){ const fa=Math.min(1,e.frozen/30);   // 氷結：青い氷塊に包まれる
    ctx.save(); ctx.globalAlpha=0.45*fa; ctx.fillStyle='#9fd6ff';
    ctx.beginPath(); ctx.ellipse(0,-t.h*0.45,t.w*0.46,t.h*0.52,0,0,7); ctx.fill();
    ctx.globalAlpha=0.85*fa; ctx.strokeStyle='#dff6ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-t.w*0.2,-t.h*0.8); ctx.lineTo(0,-t.h*0.45); ctx.lineTo(t.w*0.16,-t.h*0.7); ctx.stroke();
    for(const ic of [[-t.w*0.3,-t.h*0.15],[t.w*0.28,-t.h*0.3],[0,-t.h*0.95]]){
      ctx.fillStyle='#dff6ff'; ctx.beginPath(); ctx.moveTo(ic[0],ic[1]); ctx.lineTo(ic[0]-4,ic[1]+9); ctx.lineTo(ic[0]+4,ic[1]+9); ctx.closePath(); ctx.fill(); }
    ctx.restore(); }
  ctx.restore();
  // wind-up warning ("!"); ガード不能技は紫＋「パリィ！」で警告
  if((e.telegraph>0||e.state==='crouch')&&!e.dead){ const fl=Math.floor(gf/4)%2, dg=e.danger;
    if(fl){ ctx.save(); ctx.globalAlpha=dg?0.42:0.30; ctx.globalCompositeOperation='lighter'; ctx.fillStyle=dg?'#c000ff':'#ff3020';
      ctx.beginPath(); ctx.ellipse(sx,sy-e.h*s*0.5-e.z, t.w*0.5*s, e.h*0.5*s, 0,0,7); ctx.fill(); ctx.restore(); }
    const bob=Math.sin(gf*0.5)*3; ctx.font='bold '+(26*s)+'px Trebuchet MS'; ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText('!',sx,sy-e.h*s-e.z-12+bob);
    ctx.fillStyle=dg?'#ff4dff':'#ffe23a'; ctx.fillText('!',sx,sy-e.h*s-e.z-12+bob);
    if(dg){ ctx.font='bold '+(13*s)+'px Trebuchet MS'; ctx.lineWidth=3; ctx.strokeStyle='#000'; ctx.strokeText('ガード不能！パリィ！',sx,sy-e.h*s-e.z-12+bob-22*s); ctx.fillStyle='#ff8aff'; ctx.fillText('ガード不能！パリィ！',sx,sy-e.h*s-e.z-12+bob-22*s); }
    ctx.textAlign='left'; }
  if(!t.boss&&!e.dead&&e.hp<e.maxHp){ const bw=38*s, hx=sx-bw/2, hy=sy-e.h*s-e.z-8;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(hx-1,hy-1,bw+2,5);
    ctx.fillStyle='#ff5a3c'; ctx.fillRect(hx,hy,bw*clamp(e.hp/e.maxHp,0,1),3); }
  ctx.globalAlpha=1;
}

// ---------- NPC art ----------
function drawNPCs(){
  npcs.forEach(n=>{ if(n.hidden) return; const sx=n.x-camX; if(sx<-90||sx>W+90) return;
    const gy=LANE-groundLift(n.x);
    ctx.save(); ctx.translate(sx,gy);
    softShadow(0,2,24);
    if(n.kind==='chest'||n.kind==='cursed') drawChestNPC(n);
    else if(n.kind==='spring') drawSpringNPC(n);
    else if(n.kind==='merchant'){ ctx.scale(0.85,0.85); drawCham(0,0); }
    else if(n.kind==='altar'||n.kind==='shrine') drawAltarNPC(n);
    else if(n.kind==='portal') drawPortalNPC(n);
    else drawVillagerDog(n);
    ctx.restore();
  });
}
function drawChestNPC(n){
  ctx.fillStyle='#7a4a22'; ctx.fillRect(-22,-26,44,26);
  ctx.fillStyle='#9a6232';
  if(n.given){ ctx.fillRect(-22,-30,44,6); ctx.fillStyle='#3a2410'; ctx.fillRect(-18,-24,36,8); }
  else { ctx.beginPath(); ctx.moveTo(-22,-26); ctx.quadraticCurveTo(0,-44,22,-26); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle='#e8b34a'; ctx.lineWidth=3; ctx.strokeRect(-22,-26,44,26);
  ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(0,0); ctx.stroke();
  ctx.fillStyle='#ffe14d'; ctx.fillRect(-4,-22,8,10);
  if(!n.given && gf%30<15) drawStar(14,-46,2,5,'#ffe9a0');
}

  ctx.save(); ctx.globalCompositeOperation='lighter';                                       // 浮かぶ光輝

const SHOP_VIS=9;   // 一度に表示する品数（残りはスクロール）
function updateShop(){ gf++; shopT++; if(shopMsgT>0)shopMsgT--;
  useInput(players[0].in);
  if(shopNavCd>0)shopNavCd--;
  if(shopNavCd<=0){ if(K.up){shopSel=(shopSel+SHOP_ITEMS.length-1)%SHOP_ITEMS.length;shopNavCd=9;sfx.swing(0);}
    else if(K.down){shopSel=(shopSel+1)%SHOP_ITEMS.length;shopNavCd=9;sfx.swing(0);} }
  if(shopSel<shopScroll) shopScroll=shopSel; else if(shopSel>=shopScroll+SHOP_VIS) shopScroll=shopSel-SHOP_VIS+1;
  shopScroll=clamp(shopScroll,0,Math.max(0,SHOP_ITEMS.length-SHOP_VIS));
  if(pressed.atk){ pressed.atk=false; const it=SHOP_ITEMS[shopSel];
    if(it.leave){ saveInput(players[0].in); exitShop(); return; }
    if(it.soldOut&&it.soldOut()){ shopMsg='それはもう売り切れだニャ'; shopMsgT=80; sfx.guard(); }
    else if(coins>=it.cost){ coins-=it.cost; it.buy(); shopMsg=it.name+'を購入！'; shopMsgT=90; sfx.rise(); }
    else { shopMsg='コインが足りないニャ…'; shopMsgT=80; sfx.guard(); } }
  if(pressed.grab||pressed.jump){ pressed.grab=false; pressed.jump=false; saveInput(players[0].in); exitShop(); return; }
  saveInput(players[0].in); updateParticles();
}

  } else if(sc.art==='fall'){ ctx.save(); ctx.globalAlpha=clamp(1-cut.t/120,0,1); drawBossPortrait('boss',W*0.5,H*0.82,1.6,-1); ctx.restore();
      ctx.save(); ctx.globalCompositeOperation='lighter'; for(let i=0;i<5;i++){ const a=cut.t*0.1+i; ctx.fillStyle='rgba(198,120,255,.5)'; ctx.beginPath(); ctx.arc(W/2+Math.cos(a)*cut.t*2,H*0.5+Math.sin(a)*cut.t*1.4,4,0,7); ctx.fill(); } ctx.restore();
  } else if(sc.art==='end'){ ctx.textAlign='center'; ctx.fillStyle='#ffe14d'; ctx.font='900 48px Trebuchet MS';
      ctx.fillText('聖犬士イッヌ',W/2,H*0.42); ctx.fillStyle='#fff'; ctx.font='bold 18px Trebuchet MS'; ctx.fillText('SCORE  '+String(score).padStart(6,'0'),W/2,H*0.42+34); ctx.textAlign='left'; }
  // letterbox + text panel
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,40); ctx.fillRect(0,H-128,W,128);
  const bx=40,by=H-112,bw=W-80,bh=84;
  ctx.fillStyle='rgba(8,10,20,.85)'; roundRect(bx,by,bw,bh,10); ctx.fill();
  ctx.strokeStyle='rgba(255,210,80,.55)'; ctx.lineWidth=2; roundRect(bx,by,bw,bh,10); ctx.stroke();
  if(sc.name){ ctx.font='bold 17px Trebuchet MS';
    const heroNm=players[0].kind==='shima'?'拳聖シマダックス':players[0].kind==='nuko'?'魔法使いヌコ':players[0].kind==='guard8'?'守護犬ガードワン8号':'聖犬士イッヌ';
    const nm=(sc.name==='@hero'?heroNm:sc.name)+(sc.role?'  〈'+sc.role+'〉':'');
    const tw=ctx.measureText(nm).width+24; ctx.fillStyle='rgba(8,10,20,.95)'; roundRect(bx+16,by-22,tw,26,8); ctx.fill();
    ctx.strokeStyle='rgba(255,210,80,.55)'; roundRect(bx+16,by-22,tw,26,8); ctx.stroke();
    ctx.fillStyle=sc.boss?ETYPE[sc.boss].accent:'#ffe14d'; ctx.fillText(nm,bx+28,by-3); }
  const len=(sc.text||'').length, shown=Math.min(len,Math.floor(cut.t/1.3));
  ctx.fillStyle='#fff'; ctx.font='20px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  cutWrap((sc.text||'').slice(0,shown), bx+24, by+34, bw-48, 28);
  if(cut.t>=len*1.3 && Math.floor(gf/20)%2===0){ ctx.fillStyle='#ffd24d'; ctx.font='14px Trebuchet MS'; ctx.textAlign='right'; ctx.fillText('▶ タップ / J で次へ',bx+bw-16,by+bh-12); ctx.textAlign='left'; }
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px Trebuchet MS'; ctx.textAlign='right'; ctx.fillText('K / ESC: スキップ',W-14,30); ctx.textAlign='left';
}

const elStart=document.getElementById('start'),elResult=document.getElementById('result');
const elRTitle=document.getElementById('result-title'),elRSub=document.getElementById('result-sub');
// ── ステージごとのオートセーブ（localStorage） ──
let curMode='inu';
function saveProgress(st){ try{
  const upg=players.map(p=>({maxHp:p.maxHp,atkMul:p.atkMul||1,defMul:p.defMul||1,spdMul:p.spdMul||1,coinMul:p.coinMul||1,dimMax:p.dimMax,lives:p.lives,permWeapon:p.permWeapon||null,armored:!!p.armored,costume:!!p.costume}));
  localStorage.setItem('kuchiwan_save', JSON.stringify({stage:doneCount()+1,mode:curMode,coins:coins,upg:upg,done:levelsDone})); }catch(e){} }
function loadProgress(){ try{ const s=localStorage.getItem('kuchiwan_save'); if(!s)return null; const o=JSON.parse(s); if(o&&o.stage>=1)return o; }catch(e){} return null; }
function clearProgress(){ try{ localStorage.removeItem('kuchiwan_save'); }catch(e){} }
function refreshContinueBtn(){ const b=document.getElementById('continueBtn'); if(!b)return; const sv=loadProgress();
  if(sv&&sv.stage>1){ b.textContent='▶ つづきから（ステージ'+sv.stage+'）'; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
function startGame(){ unlockAudio();
  score=0; coins=0; camX=0; particles=[]; enemies=[]; projectiles=[]; items=[]; amb=[]; hazards=[]; combo.count=0; gf=0; shopPending=0;
  slowmo=0; slowAcc=0; stage=1; stageBanner=0; hitStop=0; cut=null; endingDone=false;
  levelsDone={}; mapSel=0; curLevelId=null; curLevelFinal=false; buildEncounters();
  players[0].active=true; players[1].active=TWO_P;
  players.forEach(p=>{ if(p.active) resetPlayer(p,true); });
  player=players[0];
  state='play'; elStart.classList.add('hidden'); elResult.classList.add('hidden');
  if(sndOn) Music.start('battle'); }
// セーブから再開（強化・制覇状況を復元してワールドマップへ）
function startGameAt(stageN){ startGame();
  const sv=loadProgress();
  if(sv){ coins=sv.coins||0;
    if(sv.upg) players.forEach((p,i)=>{ const u=sv.upg[i]; if(u){ if(u.maxHp){p.maxHp=u.maxHp;p.hp=u.maxHp;} if(u.atkMul)p.atkMul=u.atkMul; if(u.defMul)p.defMul=u.defMul; if(u.spdMul)p.spdMul=u.spdMul; if(u.coinMul)p.coinMul=u.coinMul; if(u.dimMax){p.dimMax=u.dimMax;p.dim=Math.min(p.dimMax,p.dim);} if(u.lives)p.lives=u.lives;
      if(u.permWeapon&&WEAPONS[u.permWeapon]){p.permWeapon=u.permWeapon;p.weapon=u.permWeapon;} if(u.armored)p.armored=true; if(u.costume)p.costume=true; } });
    if(sv.done) levelsDone=Object.assign({}, sv.done); }
  enterMap();   // 王都郊外クリア後の続き＝ワールドマップから再開
}
function gameOver(){ state='over'; Music.stop(); gameOverSting();
  elRTitle.textContent='GAME OVER'; elRTitle.style.color='#ff5a5a'; elRSub.textContent='SCORE  '+String(score).padStart(6,'0');
  const sv=loadProgress(), rb=document.getElementById('resumeBtn');
  if(rb){ if(sv&&sv.stage>1){ rb.textContent='▶ ステージ'+sv.stage+'から再開'; rb.classList.remove('hidden'); } else rb.classList.add('hidden'); }
  elResult.classList.remove('hidden'); }
function winGame(){ state='win'; Music.stop(); victoryJingle(); clearProgress();
  elRTitle.textContent='ALL CLEAR!'; elRTitle.style.color='#ffe14d';
  elRSub.textContent='ワンワン帝国を打ち倒した！  制覇フィールド '+doneCount()+'/'+WORLD_LEVELS.length+' ／ 出会った仲間 '+metNPC+'匹 ／ 宝箱 '+chestsOpened+'個  SCORE '+String(score).padStart(6,'0');
  const rb=document.getElementById('resumeBtn'); if(rb)rb.classList.add('hidden'); elResult.classList.remove('hidden'); }
function togglePause(){ state=state==='pause'?'play':'pause';
  if(state==='pause'){ if(musicGain)musicGain.gain.value=0.0; } else if(musicGain&&sndOn){ musicGain.gain.value=0.55; } }
function setupRoster(mode){ curMode=mode; TWO_P=(mode==='coop');
  players[0].kind=(mode==='shima')?'shima':(mode==='nuko')?'nuko':(mode==='guard8')?'guard8':'inu'; players[1].kind='shima';
  players[0].active=true; players[1].active=TWO_P; setTouchMode(TWO_P); }
document.getElementById('startBtn').onclick=()=>{ unlockAudio(); setupRoster('inu'); startOpening(); };
document.getElementById('startShimaBtn').onclick=()=>{ unlockAudio(); setupRoster('shima'); startOpening(); };
const _nukoBtn=document.getElementById('startNukoBtn'); if(_nukoBtn) _nukoBtn.onclick=()=>{ unlockAudio(); setupRoster('nuko'); startOpening(); };
const _g8Btn=document.getElementById('startG8Btn'); if(_g8Btn) _g8Btn.onclick=()=>{ unlockAudio(); setupRoster('guard8'); startOpening(); };
document.getElementById('start2Btn').onclick=()=>{ unlockAudio(); setupRoster('coop'); startOpening(); };
document.getElementById('retryBtn').onclick=()=>{ clearProgress(); startGame(); };
document.getElementById('resumeBtn').onclick=()=>{ const sv=loadProgress(); if(sv){ setupRoster(sv.mode||'inu'); startGameAt(sv.stage); } else startGame(); };
const _contBtn=document.getElementById('continueBtn'); if(_contBtn) _contBtn.onclick=()=>{ unlockAudio(); const sv=loadProgress(); if(sv){ setupRoster(sv.mode||'inu'); startGameAt(sv.stage); } };
refreshContinueBtn();
// cutscene advance / skip input
addEventListener('pointerdown',()=>{ if(state==='cut') cutAdvance=true; },{passive:true});
// sound toggle
const sndBtn=document.getElementById('snd');
sndBtn.onclick=()=>{ initAudio(); sndOn=!sndOn; sndBtn.textContent=sndOn?'♪':'🔇';
  if(masterGain) masterGain.gain.value=sndOn?0.9:0;
  if(sndOn&&state==='play'&&!Music.isPlaying()) Music.start('battle'); };

//======================================================================
//  Touch
//======================================================================
const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
if(isTouch) document.getElementById('touch').style.display='block';
function setTouchMode(twop){ const t=document.getElementById('touch'); if(!t)return; t.classList.toggle('twop', !!twop); }
function bindBtn(id,key,pi){ const el=document.getElementById(id); if(!el)return; const IN=()=>players[pi].in;
  el.addEventListener('touchstart',e=>{ e.preventDefault(); const i=IN(); i.keys['_'+key]=true; mapKeysFor(pi);
    if(key==='atk')i.pressed.atk=true; if(key==='grab')i.pressed.grab=true; if(key==='jump')i.pressed.jump=true; if(key==='grd')i.pressed.grd=true; },{passive:false});
  el.addEventListener('touchend',e=>{ e.preventDefault(); IN().keys['_'+key]=false; mapKeysFor(pi); },{passive:false}); }
bindBtn('bAtk','atk',0); bindBtn('bGrd','grd',0); bindBtn('bGrab','grab',0); bindBtn('bJmp','jump',0);
bindBtn('bAtk2','atk',1); bindBtn('bGrd2','grd',1); bindBtn('bGrab2','grab',1); bindBtn('bJmp2','jump',1);
function makeStick(stickId,pi){ const stick=document.getElementById(stickId); if(!stick)return; const nub=stick.querySelector('.nub');
  let id=null,scx=0,scy=0,lastTapDir=0,lastCard=-1,angPrev=null,accum=0; const IN=()=>players[pi].in;
  stick.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; id=t.identifier; const r=stick.getBoundingClientRect(); scx=r.left+r.width/2; scy=r.top+r.height/2; move(t); },{passive:false});
  stick.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===id) move(t); },{passive:false});
  stick.addEventListener('touchend',e=>{ for(const t of e.changedTouches) if(t.identifier===id){ id=null; nub.style.left='50%'; nub.style.top='50%'; const k=IN().keys; k['_l']=k['_r']=k['_u']=k['_d']=false; lastTapDir=0; lastCard=-1; angPrev=null; accum=0; mapKeysFor(pi); } },{passive:false});
  function move(t){ const i=IN(), k=i.keys; let dx=t.clientX-scx,dy=t.clientY-scy; const m=Math.hypot(dx,dy)||1,max=50,cl=Math.min(m,max);
    dx=dx/m*cl; dy=dy/m*cl; nub.style.left='calc(50% + '+dx+'px)'; nub.style.top='calc(50% + '+dy+'px)'; const th=16;
    const nl=dx<-th,nr=dx>th; if(nl&&lastTapDir!==-1){pushTapFor(i,-1);lastTapDir=-1;} if(nr&&lastTapDir!==1){pushTapFor(i,1);lastTapDir=1;} if(!nl&&!nr)lastTapDir=0;
    if(m>max*0.55){ const ang=Math.atan2(dy,dx); let card=(Math.round(ang/(Math.PI/2))+4)%4; card=[1,2,3,0][card];
      if(card!==lastCard){ pushCardFor(i,card); lastCard=card; }
      if(angPrev!==null){ let d=ang-angPrev; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; accum+=d; }
      angPrev=ang; if(Math.abs(accum)>=Math.PI*1.7){ i.stickRot=gf; accum=0; }
    } else { lastCard=-1; angPrev=null; accum=0; }
    k['_l']=nl; k['_r']=nr; k['_u']=dy<-th; k['_d']=dy>th; mapKeysFor(pi); }
}
makeStick('stick',0); makeStick('stick2',1);

//======================================================================
//  Resize
//======================================================================
function resize(){ setupCanvas(); const r=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*r)+'px'; cv.style.height=(H*r)+'px'; }
addEventListener('resize',resize); resize();

//======================================================================
//  Title attract render
//======================================================================
function drawTitleScene(){ drawBackground(); drawGround();
  // pose the player on title
  const sv=player.x; player.x=camX+200; player.y=470; drawPlayer(); player.x=sv; drawForeground(); drawLighting(); }

//======================================================================
//  Main loop
//======================================================================
function loop(){
  if(state==='cut'){ gf++; updateCut(); ctx.clearRect(0,0,W,H); drawCut(); requestAnimationFrame(loop); return; }
  if(state==='shop'){ updateShop(); ctx.clearRect(0,0,W,H); drawShop(); requestAnimationFrame(loop); return; }
  if(state==='map'){ gf++; updateMap(); ctx.clearRect(0,0,W,H); drawMap(); requestAnimationFrame(loop); return; }
  // slow-motion: throttle logic ticks while keeping render smooth
  if(slowmo>0 && state==='play' && hitStop<=0){
    slowmo--; slowAcc+=0.34;
    if(slowAcc>=1){ slowAcc-=1; update(); }
  } else { update(); }
  if(state==='title'){ ctx.clearRect(0,0,W,H); drawTitleScene(); }
  else render();
  requestAnimationFrame(loop);
}
buildEncounters(); loop();
</script>
