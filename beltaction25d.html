function makePlayer(E, name, t0, fade){

    const g = c.createGain(); g.gain.value = (S.mix && S.mix[k]!=null) ? S.mix[k] : MIXDEF[k]; nodes.push(g);
    const pan = S.pan && S.pan[k]!=null ? S.pan[k] : ({ m2:0.3, chord:-0.25, fx:0.2 })[k] || 0;
    if(pan && c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(out); nodes.push(p); } else g.connect(out);
    const send = S.send && S.send[k]!=null ? S.send[k] : SENDDEF[k];
    if(send > 0){ const sg = c.createGain(); sg.gain.value = send; g.connect(sg); sg.connect(sendG); nodes.push(sg); }
    ch[k] = g; dest[k] = g;
  }
  const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = S.leadLP || 3400; lp.Q.value = 0.5; lp.connect(ch.lead); dest.lead = lp; nodes.push(lp);
  const blp = c.createBiquadFilter(); blp.type='lowpass'; blp.frequency.value = 1500; blp.connect(ch.bass); dest.bass = blp; nodes.push(blp);
  // 部屋（ディレイ）を曲のテンポに合わせる
  const r = S.room || {}, R = E.room, at = Math.max(t0, c.currentTime);
  try{
    R.dl.delayTime.setTargetAtTime(clamp((r.beats||0.75)*60/S.bpm, 0.05, 1.4), at, 0.05);
    R.fb.gain.setTargetAtTime(r.fb==null ? 0.26 : r.fb, at, 0.05);
    R.wet.gain.setTargetAtTime(r.wet==null ? 0.28 : r.wet, at, 0.05);
  }catch(_){}
  return { name, song, E, out, sendG, nodes, dest, last:{}, pos:0, nextTime:t0, loops:0, stopping:false, done:false, dead:false };
}
function advance(P){
  const song = P.song;
  P.nextTime += song.stepDur; P.pos++;
  if(P.pos >= song.L){ if(song.loop){ P.pos = song.loopStart; P.loops++; } else P.done = true; }
}
function schedulePlayer(P, until){
  const E = P.E, song = P.song, now = E.ctx.currentTime;
  // 大きく遅れた（メインスレッドが止まった・復帰した）ときは、鳴らさずに今の位置まで進めて同期し直す
  if(!E.offline && P.nextTime < now - 0.08){ let guard = 0; while(P.nextTime < now && !P.done && guard++ < 20000) advance(P); }
  const silent = !E.offline && muted;
  while(P.nextTime < until && !P.done){
    const evs = song.steps[P.pos];
    if(evs && !silent){
      const sw = (song.swing && (P.pos % song.spb)===song.spb/2) ? song.swing*song.stepDur*2 : 0;
      const t = P.nextTime + sw;
      for(let i=0;i<evs.length;i++){
        const e = evs[i];
        try{ play(E, P.dest[e.c], e.c, e.i, e.m, t + (e.o||0), e.d*song.stepDur, e.v, P); }catch(err){ logErr('note '+P.name, err); }
      }
    }
    advance(P);
  }
}
function fadeOutPlayer(P, sec){
  if(P.stopping) return;
  P.stopping = true;
  const t = P.E.ctx.currentTime;
  holdAndFade(P.out.gain, t, sec); holdAndFade(P.sendG.gain, t, sec);
  setTimeout(()=> disposePlayer(P), (sec+2.2)*1000);
}
function disposePlayer(P){
  if(P.dead) return; P.dead = true;
  for(const n of P.nodes){ try{ n.disconnect(); }catch(_){} }
  const L = P.E.players, i = L.indexOf(P); if(i>=0) L.splice(i,1);
}

function sOsc(E, d, type, f0, f1, t, dur, vol, att){
  const c = E.ctx, o = c.createOscillator(), g = c.createGain();
  if(E.waves[type]) o.setPeriodicWave(E.waves[type]); else o.type = type;
  o.frequency.setValueAtTime(f0, t); if(f1 && f1!==f0) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
  att = Math.min(att||0.004, dur*0.5); vol = Math.max(0.002, vol);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+att); g.gain.exponentialRampToValueAtTime(0.0005, t+dur);
  o.connect(g); g.connect(d); o.start(t); o.stop(t+dur+0.02);
  track(E, o, [g], 1);
}
function sNoise(E, d, t, dur, vol, ftype, f0, f1, Q, att){
  const c = E.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = E.bufs.noise; f.type = ftype; f.Q.value = Q||1;
  f.frequency.setValueAtTime(f0, t); if(f1 && f1!==f0) f.frequency.exponentialRampToValueAtTime(f1, t+dur);
  att = Math.min(att||0.005, dur*0.7); vol = Math.max(0.002, vol);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+att); g.gain.exponentialRampToValueAtTime(0.0005, t+dur);
  s.connect(f); f.connect(g); g.connect(d); s.start(t, Math.random()*0.5); s.stop(t+dur+0.02);
  track(E, s, [f, g], 1);
}
function sBell(E, d, inst, m, t, vol){ playSample(E, d, inst, m, t, 0.3, vol, 1); }
function sLead(E, d, m, t, dur, vol){ playLead(E, d, 'sq', m, t, dur, vol, null, 1); }
function boing(E, d, t, p, vol){
  const c = E.ctx, o = c.createOscillator(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(190*p, t); o.frequency.exponentialRampToValueAtTime(330*p, t+0.35);
  l.frequency.value = 17; lg.gain.setValueAtTime(70*p, t); lg.gain.exponentialRampToValueAtTime(3, t+0.4); l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+0.01); g.gain.setTargetAtTime(0, t+0.14, 0.09);
  o.connect(g); g.connect(d); o.start(t); l.start(t); o.stop(t+0.55); l.stop(t+0.55);
  track(E, o, [g, l, lg], 1);
}
function roar(E, d, t, p, vol){
  const c = E.ctx, bp = c.createBiquadFilter(), lp = c.createBiquadFilter(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain();
  bp.type='bandpass'; bp.Q.value=2.2; bp.frequency.setValueAtTime(450, t); bp.frequency.linearRampToValueAtTime(1300, t+0.25); bp.frequency.linearRampToValueAtTime(600, t+0.85);

  l.frequency.value = 7; lg.gain.value = 45; l.connect(lg);
  const oscs = [];
  const add = (f, type)=>{ const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f*p*0.9, t); o.frequency.linearRampToValueAtTime(f*p*1.25, t+0.2); o.frequency.linearRampToValueAtTime(f*p*0.8, t+0.95); lg.connect(o.detune); o.connect(bp); o.start(t); o.stop(t+1); oscs.push(o); };
  add(105,'sawtooth'); add(158,'sawtooth'); add(210,'square');
  bp.connect(lp); lp.connect(g); g.connect(d); l.start(t); l.stop(t+1);
  track(E, oscs[0], [bp, lp, g, l, lg, oscs[1], oscs[2]], 1);

// 途中で音量を 0 へ下ろす。value の読み取りは描画前だと既定値(1)を返すので、cancelAndHold を優先し、無ければ既知の値を使う
function holdAndFade(gp, t, dur, known){
  try{
    if(gp.cancelAndHoldAtTime) gp.cancelAndHoldAtTime(t);
    else { const v = known!=null ? known : gp.value; gp.cancelScheduledValues(t); gp.setValueAtTime(v, t); }
    gp.linearRampToValueAtTime(0, t+dur);
  }catch(_){}
}
let chargeV = null;
function chargeStop(at){
  const V = chargeV; if(!V) return; chargeV = null;
  try{
    const c = V.E.ctx, t = at!=null ? at : c.currentTime;
    holdAndFade(V.g.gain, t, 0.08, V.vol);
    V.o1.stop(t+0.1); V.o2.stop(t+0.1); V.l.stop(t+0.1);
  }catch(_){}
}
function chargeStart(E, d, t, p, vol, stopAt){

  o1.type='triangle'; o2.type='sine';
  o1.frequency.setValueAtTime(220*p, t); o1.frequency.exponentialRampToValueAtTime(523*p, t+1.1);
  o2.frequency.setValueAtTime(330*p, t); o2.frequency.exponentialRampToValueAtTime(784*p, t+1.1);
  l.frequency.value = 9; lg.gain.setValueAtTime(0, t); lg.gain.setValueAtTime(0, t+1.0); lg.gain.linearRampToValueAtTime(vol*0.35, t+1.3); l.connect(lg); lg.connect(g.gain);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+0.15);
  o1.connect(g); o2.connect(g); g.connect(d);
  const end = t+5;   // 止め忘れの保険
  o1.start(t); o2.start(t); l.start(t); o1.stop(end); o2.stop(end); l.stop(end);
  track(E, o1, [o2, g, l, lg], 1);

}

const VOICE_DEF = { inu:[300,'sawtooth'], shima:[186,'sawtooth'], nuko:[520,'triangle'], guard8:[148,'sawtooth'], watch:[392,'sawtooth'], wanden:[228,'sawtooth'], mack:[262,'sawtooth'] };
const CHIRP = {
  atk: { dur:0.17, p:[[0,1],[0.035,1.3],[0.17,0.92]], f1:[320,820], f2:[2300,1250], vib:0, vol:1.5 },
  hurt:{ dur:0.24, p:[[0,1.75],[0.03,1.95],[0.24,0.85]], f1:[360,700], f2:[2600,1500], vib:0, vol:1.4 },
  ult: { dur:0.55, p:[[0,1],[0.1,1.35],[0.42,1.5],[0.55,1.2]], f1:[380,860], f2:[2100,1150], vib:1, vol:1.6 },
  wan: { dur:0.15, p:[[0,1.12],[0.05,1.35],[0.15,1.05]], f1:[300,760], f2:[800,1250], vib:0, vol:1.6 },
};
function chirp(E, d, t, f0, type, K, vol){
  const c = E.ctx, o = c.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0*K.p[0][1], t);
  for(let i=1;i<K.p.length;i++) o.frequency.linearRampToValueAtTime(f0*K.p[i][1], t+K.p[i][0]);
  const b1 = c.createBiquadFilter(), b2 = c.createBiquadFilter(), g2 = c.createGain(), env = c.createGain();
  b1.type='bandpass'; b2.type='bandpass'; b1.Q.value=3; b2.Q.value=5; g2.gain.value=0.7;
  b1.frequency.setValueAtTime(K.f1[0], t); b1.frequency.exponentialRampToValueAtTime(K.f1[1], t+K.dur*0.45);
  b2.frequency.setValueAtTime(K.f2[0], t); b2.frequency.exponentialRampToValueAtTime(K.f2[1], t+K.dur*0.45);
  // 波形で倍音の量が違うので補正（矩形は強い、三角・正弦は弱い）＋フォルマントを通らない素の音を少し混ぜて下限を作る
  const vv = vol*K.vol*({ square:0.62, triangle:0.9, sine:0.75 }[type] || 1);
  const dry = c.createGain(); dry.gain.value = 0.3; o.connect(dry); dry.connect(env);
  env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(vv, t+0.015); env.gain.setValueAtTime(vv, t+K.dur*0.6); env.gain.linearRampToValueAtTime(0.0001, t+K.dur);
  o.connect(b1); o.connect(b2); b2.connect(g2); b1.connect(env); g2.connect(env); env.connect(d);
  const nodes = [b1, b2, g2, env, dry];
  if(K.vib){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 7; lg.gain.value = 35; l.connect(lg); lg.connect(o.detune); l.start(t); l.stop(t+K.dur+0.05); nodes.push(l, lg); }
  o.start(t); o.stop(t+K.dur+0.05);
  track(E, o, nodes, 1);
  return env;
}
function voiceParams(heroId){
  let f0 = 0, type = '';
  try{ const h = G.heroes && G.heroes.get && G.heroes.get(heroId); if(h && h.voice){ f0 = +h.voice.f0 || 0; type = h.voice.type || ''; } }catch(_){}
  const def = VOICE_DEF[heroId] || [300,'sawtooth'];
  if(!(f0 > 60 && f0 < 1200)) f0 = def[0];
  const osc = ['sine','square','sawtooth','triangle'].indexOf(type)>=0 ? type : (type==='tri' ? 'triangle' : def[1]);
  return { f0, osc };
}
function renderVoice(E, d, t, heroId, kind, vol){
  const vp = voiceParams(heroId);
  if(kind==='win'){ chirp(E, d, t, vp.f0, vp.osc, CHIRP.wan, vol); return chirp(E, d, t+0.2, vp.f0*1.06, vp.osc, CHIRP.wan, vol); }
  return chirp(E, d, t, vp.f0, vp.osc, CHIRP[kind] || CHIRP.atk, vol);
}

let ctx = null, E = null, muted = false, volume = 0.8, current = null, want = false, wantAt = 0;
let hidden = false, timer = null, inited = false, suspendedByUs = false, musicPaused = false;
const rl = {};              // 効果音の連打制限：名前 → 直近3回の時刻(ms)
const vlast = {};           // 声：ヒーロー → {t, env}
function running(){ return !!(ctx && E && ctx.state==='running' && !hidden); }
function applyVolume(){
  if(!E) return;
  try{ const t = ctx.currentTime; E.master.gain.cancelScheduledValues(t); E.master.gain.setTargetAtTime(muted ? 0 : volume, t, 0.03); }catch(_){}
}
const pumpStat = { n:0, ms:0, max:0 };
function startTimer(){ if(!timer && E && !E.offline && !hidden) timer = setInterval(pump, TICK_MS); }
function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }
function pump(){
  try{
    if(!E){ stopTimer(); return; }
    if(hidden || ctx.state!=='running') return;
    const t0 = nowMs();
    const until = ctx.currentTime + LOOKAHEAD;
    const L = E.players;
    for(let i=L.length-1; i>=0; i--){
      const P = L[i];
      if(!P.stopping && !P.done && !musicPaused) schedulePlayer(P, until);
      if(P.done && !P.stopping){ P.stopping = true; setTimeout(()=> disposePlayer(P), 4000); }
    }
    if(!L.length) stopTimer();
    const dt = nowMs()-t0; pumpStat.n++; pumpStat.ms += dt; if(dt > pumpStat.max) pumpStat.max = dt;
  }catch(err){ logErr('pump', err); }
}
function startSong(name){
  want = false;
  if(!E) return;
  const t = ctx.currentTime, S = name && SONGS[name], jingle = !!(S && S.loop===false);
  let had = false;
  for(const P of E.players) if(!P.stopping){ fadeOutPlayer(P, jingle ? 0.12 : XFADE); had = true; }
  if(!S) return;
  const P = makePlayer(E, name, t+0.04, had && !jingle ? XFADE : 0);
  if(!P) return;
  E.players.push(P);
  if(ctx.state==='running' && !hidden && !musicPaused) schedulePlayer(P, t+LOOKAHEAD);
  startTimer();
}
function maybeStartWanted(){
  if(!want || !current || !E) return;
  const S = SONGS[current];
  if(S && S.loop===false && nowMs()-wantAt > 3000){ want = false; return; }   // 古いジングルは今さら鳴らさない
  startSong(current);
}
function onState(){
  try{
    if(!ctx) return;
    if(ctx.state==='running' && !hidden){ suspendedByUs = false; maybeStartWanted(); if(E.players.length) startTimer(); }
  }catch(err){ logErr('state', err); }
}
function unlock(){
  if(!AC) return false;
  try{
    if(ctx && ctx.state==='running') return true;
    if(!ctx){
      buildBank();
      try{ ctx = new AC({ latencyHint:'interactive' }); }catch(_){ ctx = new AC(); }
      E = makeEngine(ctx, null);
      ctx.onstatechange = onState;
      applyVolume();
    }
    try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(_){}
    if(!hidden && ctx.state!=='running' && ctx.state!=='closed' && ctx.resume){
      const pr = ctx.resume(); if(pr && pr.then) pr.then(onState, ()=>{});
    }
    // iOS：ジェスチャーの中で同期的に何か鳴らす（1サンプルの無音）
    try{ const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0); }catch(_){}
    onState();
    return ctx.state==='running';
  }catch(err){ logErr('unlock', err); return false; }
}
function bgm(name){
  try{
    if(name===undefined || name==='') name = null;
    if(name!==null && !SONGS[name]) return;
    if(name===current) return;
    current = name; want = name!==null; wantAt = nowMs();
    if(!E) return;                     // 最初のタップ（unlock）で始まる
    startSong(name);
  }catch(err){ logErr('bgm', err); }
}
function panDest(Eg, pan){
  if(!Eg.pans.length || !pan) return Eg.sfx;
  return Eg.pans[clamp(Math.round((clamp(pan,-1,1)*0.6+0.6)/0.3), 0, 4)];
}
const PRIORITY = { ult:1, clear:1, levelup:1, bossRoar:1, go:1, ok:1, cancel:1, select:1, heal:1 };
function sfx(name, opts){
  try{
    const o = opts || {};
    if(name==='charge' && o.stop){ chargeStop(); return; }
    if(!running() || muted) return;
    const fn = SFX[name]; if(!fn && name!=='charge') return;
    const tm = nowMs();
    let r = rl[name]; if(!r) r = rl[name] = [-1e9, -1e9, -1e9];
    let n = 0, oi = 0;
    for(let i=0;i<3;i++){ if(tm - r[i] < 50) n++; if(r[i] < r[oi]) oi = i; }
    if(n >= 3) return;
    r[oi] = tm;
    if(E.liveSfx > MAX_SFX_VOICES && !PRIORITY[name]) return;
    let p = o.pitch==null ? 1 : +o.pitch || 1;
    let v = o.vol==null ? 1 : Math.max(0, +o.vol || 0);
    if(n){ v *= n===1 ? 0.7 : 0.5; p *= 1 + (Math.random()-0.5)*0.06; }
    const t = ctx.currentTime + 0.004 + (o.delay>0 ? +o.delay : 0) + (n ? Math.random()*0.006 : 0);
    const d = panDest(E, o.pan);
    if(name==='charge') chargeStart(E, d, t, p, 0.12*v);
    else fn(E, d, t, p, v, o);
  }catch(err){ logErr('sfx '+name, err); }
}
function voice(heroId, kind){
  try{
    if(!running() || muted || !heroId) return;
    kind = (kind==='atk' || kind==='hurt' || kind==='ult' || kind==='win') ? kind : 'atk';
    const tm = nowMs(), L = vlast[heroId];
    const gap = kind==='atk' ? 220 : 90;
    if(L && tm - L.t < gap) return;
    const t = ctx.currentTime + 0.004;
    if(L && L.env && tm - L.t < 600) holdAndFade(L.env.gain, t, 0.03);
    const env = renderVoice(E, E.sfx, t+0.02, heroId, kind, 0.55);
    vlast[heroId] = { t: tm, env };
  }catch(err){ logErr('voice', err); }
}
function store(k, v){ try{ window.localStorage.setItem(k, v); }catch(_){} }
function load(k){ try{ return window.localStorage.getItem(k); }catch(_){ return null; } }
function setMuted(b){
  try{
    muted = !!b; store('inu25d_mute', muted ? '1' : '0');
    if(muted) chargeStop();
    applyVolume();
    if(G.bus) G.bus.emit('audioMute', { muted });
  }catch(err){ logErr('setMuted', err); }
}
function setVolume(v){
  try{ v = +v; if(!(v>=0)) return; volume = clamp(v, 0, 1); store('inu25d_vol', String(volume)); applyVolume(); }catch(err){ logErr('setVolume', err); }
}
// ポーズ画面：BGM だけを止めて（すっと下げて）、同じ位置から再開する。効果音（メニューの音）は鳴る
function pause(on){
  try{
    on = !!on; if(on===musicPaused) return; musicPaused = on;
    if(!E) return;
    const t = ctx.currentTime;
    E.music.gain.cancelScheduledValues(t); E.music.gain.setTargetAtTime(on ? 0 : MUSIC_GAIN, t, on ? 0.05 : 0.12);
    if(on) chargeStop();
    else for(const P of E.players) if(!P.stopping && !P.done) P.nextTime = t + 0.05;
  }catch(err){ logErr('pause', err); }
}
function pauseAll(){
  if(hidden) return;
  hidden = true; stopTimer(); chargeStop();
  try{ if(ctx && ctx.state==='running'){ suspendedByUs = true; const pr = ctx.suspend(); if(pr && pr.catch) pr.catch(()=>{}); } }catch(_){}
}
function resumeAll(){
  if(!hidden) return;
  hidden = false;
  try{
    if(ctx && ctx.state!=='running' && ctx.state!=='closed'){ const pr = ctx.resume(); if(pr && pr.then) pr.then(onState, ()=>{}); }
    if(E && E.players.length) startTimer();
    onState();
  }catch(_){}
}

// ---------------------------------------------------------------- バスのイベント → 自動で鳴らす
function panX(x){
  const cm = G.cam; if(x==null || !cm || !cm.halfW) return 0;
  return clamp((x - cm.x)/(cm.halfW*1.2), -1, 1);
}
const isHero = (e)=> !!(e && (e.team===0 || e.kind==='hero'));
let comboRank = null, comboCount = 0;
function comboLevel(c){ return c>=45?5 : c>=28?4 : c>=16?3 : c>=8?2 : c>=2?1 : 0; }
function subscribe(){
  if(!G.bus) return;
  const on = (ev, fn)=> G.bus.on(ev, (d)=>{ try{ fn(d||{}); }catch(err){ logErr('bus.'+ev, err); } });
  on('hit', (d)=>{
    const pan = panX(d.x), pw = d.power||1, toHero = isHero(d.target);
    if(d.blocked){ sfx('block', { pan }); return; }
    if(pw>=2 || d.crit) sfx('hitBig', { pan, vol: pw>=3 ? 1 : 0.72, pitch: toHero ? 0.9 : 1 });
    else sfx('hit', { pan, kind:d.kind, pitch: toHero ? 0.82 : 0.95 + Math.random()*0.1 });
    if(d.crit) sfx('kira', { pan, delay:0.04 });
  });
  on('swing', (d)=>{
    const e = d.ent, hero = isHero(e);
    sfx(d.kind==='slash' ? 'slash' : 'swing', { pan: panX(e && e.x), vol: hero ? 0.8 : 0.5, pitch: (d.power>=2 ? 0.85 : 1)*(hero ? 1 : 0.88) });
  });
  on('shoot', (d)=>{ const e = d.ent; sfx('shoot', { pan: panX(d.x!=null ? d.x : e && e.x), vol: isHero(e) ? 0.8 : 0.55, pitch: d.kind==='note' ? 1.3 : d.kind==='rock' ? 0.7 : 1 }); });
  on('jump', (d)=>{ if(isHero(d.ent)) sfx('jump', { pitch: d.double ? 1.3 : 1 }); else sfx('jump', { vol:0.35, pitch:0.8, pan: panX(d.ent && d.ent.x) }); });
  on('land', (d)=>{
    const e = d.ent; if(!e || !d.hard) return;
    if(e.kind==='boss') sfx('hitBig', { vol:0.55, pitch:0.6, pan: panX(e.x) });
    else sfx('land', { vol: isHero(e) ? 0.8 : 0.45, pan: panX(e.x) });
  });
  on('dodge', (d)=>{ sfx('dodge'); if(d.just) sfx('just'); });
  on('pickup', (d)=>{
    const k = d.kind;
    if(k==='coin') sfx('coin'); else if(k==='gem') sfx('coin', { pitch:1.26 });
    else if(k==='star') sfx('star');
    else if(k==='bone' || k==='cake' || k==='heart') sfx('heal', { pitch: k==='heart' ? 1.12 : 1 });
    else sfx('pop');
  });
  on('ko', (d)=>{ sfx('ko', { pan: panX(d.x!=null ? d.x : d.ent && d.ent.x) }); });
  on('heroKO', (d)=>{ sfx('faint'); if(d.ent && d.ent.type) voice(d.ent.type, 'hurt'); });
  on('revive', ()=>{ sfx('heal', { pitch:1.12 }); sfx('star', { delay:0.2 }); });
  on('levelUp', ()=> sfx('levelup'));
  on('special', (d)=>{ sfx('special'); if(isHero(d.ent) && d.ent.type) voice(d.ent.type, 'atk'); });
  on('ult', (d)=>{ sfx('ult'); const id = d.heroId || (d.ent && d.ent.type); if(id) voice(id, 'ult'); });
  on('hurt', (d)=>{ if(isHero(d.ent) && d.ent.type) voice(d.ent.type, 'hurt'); });
  on('go', ()=> sfx('go'));
  on('bossIntro', ()=> sfx('bossRoar'));
  on('bossPhase', ()=> sfx('bossRoar', { vol:0.8, pitch:1.1 }));
  on('bossDown', ()=>{ sfx('hitBig'); sfx('star', { delay:0.3 }); });
  // 最終ボスのあとは 90_game が bgm('clear') のジングルを鳴らす。中ボス（ステージ7のクロイヌ）だけはここでファンファーレ
  on('midClear', ()=> sfx('clear'));
  on('stageClear', ()=> sfx('star'));
  on('combo', (d)=>{
    const c = d.count|0;
    if(c < comboCount || c <= 1){ comboRank = null; }
    if(d.rank!=null && d.rank!=='' && d.rank!==comboRank && c > comboCount && comboLevel(c) > 0) sfx('rank', { pitch: Math.pow(2, 2*(comboLevel(c)-1)/12) });
    comboRank = d.rank==null ? comboRank : d.rank; comboCount = c;
  });
  on('scene', ()=> chargeStop());
  on('hidden', pauseAll);
  on('visible', resumeAll);
}
function init(){
  if(inited) return; inited = true;
  try{
    muted = load('inu25d_mute')==='1';
    const v = parseFloat(load('inu25d_vol')); if(v>=0 && v<=1) volume = v;
    hidden = typeof document!=='undefined' && !!document.hidden;
    subscribe();
    if(typeof document!=='undefined'){
      document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pauseAll(); else resumeAll(); });
      // 最初のジェスチャーで AudioContext を作る／再開する（iOS の中断からの復帰にも使うので外さない。動いていれば何もしない）
      const g = ()=>{ if(!ctx || ctx.state!=='running') unlock(); };
      for(const ev of ['pointerdown','touchstart','touchend','mousedown','keydown','click']) window.addEventListener(ev, g, { capture:true, passive:true });
    }
    // 楽器の波形はひまなときに先に焼いておく（最初のタップで待たせない）
    const idle = window.requestIdleCallback ? (f)=> window.requestIdleCallback(f, { timeout:1500 }) : (f)=> setTimeout(f, 120);
    const step = (dl)=>{
      try{
        const budget = dl && dl.timeRemaining ? Math.max(4, Math.min(12, dl.timeRemaining())) : 8;
        if(!buildBankStep(budget)) idle(step);
      }catch(err){ logErr('bank', err); }
    };
    idle(step);
  }catch(err){ logErr('init', err); }
}

// ---------------------------------------------------------------- 検証（オフラインで焼いて測る）
const PC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KMAJ = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88], KMIN = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function pearson(a, b){ const n=a.length; let ma=0, mb=0; for(let i=0;i<n;i++){ ma+=a[i]; mb+=b[i]; } ma/=n; mb/=n; let s=0, sa=0, sb=0; for(let i=0;i<n;i++){ const x=a[i]-ma, y=b[i]-mb; s+=x*y; sa+=x*x; sb+=y*y; } return s/Math.sqrt(sa*sb||1); }
function keyFind(h){
  let best = { r:-2 }, bestMaj = -2, bestMin = -2;
  for(let k=0;k<12;k++){
    const rj = [], rn = []; for(let i=0;i<12;i++){ rj.push(KMAJ[(i-k+12)%12]); rn.push(KMIN[(i-k+12)%12]); }
    const a = pearson(h, rj), b = pearson(h, rn);
    if(a > bestMaj) bestMaj = a; if(b > bestMin) bestMin = b;
    if(a > best.r) best = { r:a, key:PC[k], mode:'major' };
    if(b > best.r) best = { r:b, key:PC[k], mode:'minor' };
  }
  return { key: best.key+' '+best.mode, mode: best.mode, r: +best.r.toFixed(3), bestMajorR: +bestMaj.toFixed(3), bestMinorR: +bestMin.toFixed(3) };
}
function histo(list, filter){
  const h = new Array(12).fill(0); let tot = 0;
  for(const n of list){ if(filter && !filter(n)) continue; const w = n.d; h[((Math.round(n.m)%12)+12)%12] += w; tot += w; }
  const pct = {}; for(let i=0;i<12;i++) if(h[i] > 0) pct[PC[i]] = +(100*h[i]/(tot||1)).toFixed(1);
  return { h, pct };
}
function analyze(buf, win){
  const ch = []; for(let i=0;i<buf.numberOfChannels;i++) ch.push(buf.getChannelData(i));
  const n = ch[0].length, W = Math.max(1, Math.floor(buf.sampleRate*(win||0.5)));
  let peak = 0, pre = 0, sum = 0, ws = 0, wc = 0, last = 0; const wins = [];
  const a = ch[0], b = ch[1]||ch[0], c2 = ch[2], d2 = ch[3];
  for(let i=0;i<n;i++){
    const x = a[i], y = b[i], ax = Math.abs(x), ay = Math.abs(y);
    if(ax > peak) peak = ax; if(ay > peak) peak = ay;
    if(ax > 0.001 || ay > 0.001) last = i;
    if(c2){ const p1 = Math.abs(c2[i]), p2 = Math.abs(d2[i]); if(p1 > pre) pre = p1; if(p2 > pre) pre = p2; }
    const e = (x*x + y*y)*0.5; sum += e; ws += e;
    if(++wc === W){ wins.push(Math.sqrt(ws/W)); ws = 0; wc = 0; }
  }
  const rms = Math.sqrt(sum/n);
  return { peak:+peak.toFixed(4), prePeak: c2 ? +pre.toFixed(4) : null, rms:+rms.toFixed(4), rmsDb:+(20*Math.log10(rms||1e-9)).toFixed(1), wins, soundSec:+(last/buf.sampleRate).toFixed(3) };
}
// opts.sfx = [[秒, 効果音名, opts], …] … 曲に効果音を重ねた最悪ケースの計測用（連打制限は通さない＝より厳しい）
async function renderOffline(name, seconds, opts){
  if(!OAC) return { name, error:'no OfflineAudioContext' };
  const song = compileSong(name); if(!song) return { name, error:'unknown song' };
  const t0 = nowMs();
  const loopSec = song.L*song.stepDur;
  seconds = +seconds || Math.min(90, loopSec + (song.loop ? 2 : 1));
  const oc = new OAC(4, Math.ceil(44100*seconds), 44100);
  const E2 = makeEngine(oc, { offline:true, quad:true }); E2.log = [];
  const P = makePlayer(E2, name, 0.02, 0); E2.players.push(P);
  schedulePlayer(P, seconds);
  const extra = (opts && opts.sfx) || [];
  for(const q of extra){
    const o = q[2] || {}, fn = SFX[q[1]]; if(!fn) continue;
    fn(E2, panDest(E2, o.pan), q[0], o.pitch||1, o.vol==null?1:o.vol, o);
  }
  const made = E2.made;
  const buf = await oc.startRendering();
  const A = analyze(buf, 0.5);
  const lead = histo(E2.log, (x)=> x.c==='lead'), all = histo(E2.log, null);
  const winsNoTail = song.loop ? A.wins : A.wins.slice(0, Math.floor(loopSec/0.5));
  return { name, seconds, bpm: song.S.bpm, key: PC[song.S.key%12]+' '+song.S.mode, bars: song.bars, loop: song.loop,
    loopSec:+loopSec.toFixed(2), loopStartSec:+(song.loopStart*song.stepDur).toFixed(2), loops: P.loops,
    peak:A.peak, prePeak:A.prePeak, rms:A.rms, rmsDb:A.rmsDb, soundSec:A.soundSec,
    minWinRms: +Math.min.apply(null, winsNoTail.length ? winsNoTail : [0]).toFixed(4), maxWinRms: +Math.max.apply(null, A.wins.length ? A.wins : [0]).toFixed(4),
    quietWins: winsNoTail.filter((w)=> w < 0.01).length,
    notes: { count: E2.log.length, leadCount: E2.log.filter((x)=> x.c==='lead').length, leadPc: lead.pct, allPc: all.pct, detectedAll: keyFind(all.h), detectedLead: keyFind(lead.h) },
    nodesMade: made, warnings: song.warn, renderMs: Math.round(nowMs()-t0) };
}
async function renderSfxOffline(name, opts){
  if(!OAC) return { name, error:'no OfflineAudioContext' };
  const o = opts || {};
  const secs = o.seconds || 2.5;
  const oc = new OAC(4, Math.ceil(44100*secs), 44100);
  const E2 = makeEngine(oc, { offline:true, quad:true });
  const saved = chargeV; chargeV = null;
  try{
    if(o.voice) renderVoice(E2, E2.sfx, 0.02, o.voice, name, 0.55);
    else if(name==='charge') chargeStart(E2, E2.sfx, 0.02, 1, 0.12, 1.6);
    else if(SFX[name]) SFX[name](E2, E2.sfx, 0.02, o.pitch||1, o.vol==null?1:o.vol, o);
    else return { name, error:'unknown sfx' };
  } finally { chargeV = saved; }
  const buf = await oc.startRendering();
  const A = analyze(buf, 0.05);
  return { name: o.voice ? o.voice+':'+name : name, peak:A.peak, prePeak:A.prePeak, rms:A.rms, soundSec:A.soundSec, nodes:E2.made };
}
function stats(){
  return { ctx: ctx ? ctx.state : (AC ? 'none' : 'unsupported'), time: ctx ? +ctx.currentTime.toFixed(3) : 0,
    current, want, hidden, muted, volume, paused: musicPaused, timer: !!timer,
    players: E ? E.players.map((P)=> ({ name:P.name, pos:P.pos, loops:P.loops, stopping:P.stopping, done:P.done })) : [],
    nTrack: E ? E.nTrack||0 : 0, nEnded: E ? E.nEnded||0 : 0, nDup: E ? E.nDup||0 : 0, dupKinds: E ? E.dupKinds : null,
    live: E ? E.live : 0, liveMusic: E ? E.liveMusic : 0, liveSfx: E ? E.liveSfx : 0, liveNodes: E ? E.liveNodes : 0, made: E ? E.made : 0,
    pumpCalls: pumpStat.n, pumpMsTotal: +pumpStat.ms.toFixed(2), pumpMsMax: +pumpStat.max.toFixed(2),
    bankMs: +bankMs.toFixed(1), bankReady: !!bank, bankMaxJobMs: bankWork ? +bankWork.maxJob.toFixed(1) : null };
}

G.audio = {
  init, unlock, bgm, sfx, voice, setMuted, setVolume, pause,
  get paused(){ return musicPaused; },
  toggleMute(){ setMuted(!muted); return muted; },
  get muted(){ return muted; }, set muted(v){ setMuted(v); },
  get volume(){ return volume; }, set volume(v){ setVolume(v); },
  get current(){ return current; },
  get ready(){ return running(); },
  tracks: Object.keys(SONGS),
  sfxNames: Object.keys(SFX).concat(['charge']),
  renderOffline, renderSfxOffline, stats,
  debug: {
    compile: (n)=>{ const s = compileSong(n); return s ? { name:n, bars:s.bars, steps:s.L, loopSec:+(s.L*s.stepDur).toFixed(2), warn:s.warn } : null; },
    renderVoice: (heroId, kind)=> renderSfxOffline(kind, { voice:heroId }),
    buildBank: ()=>{ buildBank(); return +bankMs.toFixed(1); },
    bankProfile: ()=>{ const W = bankJobs(), out = []; for(const j of W.jobs){ const t = nowMs(); j(); out.push(+(nowMs()-t).toFixed(1)); } return out; },
  },
};
})();


// ===== 80_ui.js =====

// ================================================================ small helpers
function el(tag, cls, parent, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; if(parent) parent.appendChild(e); return e; }
function txt(e, s){ s = String(s); if(e._t!==s){ e._t = s; e.textContent = s; } }
function show(e, on){ const hid = !on; if(e._hid!==hid){ e._hid = hid; e.classList.toggle('x', hid); } }
function setVar(e, k, v, eps){ const o = e['_v'+k]; if(o==null || Math.abs(o-v) > (eps||0.001)){ e['_v'+k] = v; e.style.setProperty(k, String(+v.toFixed(4))); } }
function clipR(e, f){ f = U.clamp(f,0,1); if(e._clip==null || Math.abs(e._clip-f) > 0.0005){ e._clip = f; e.style.clipPath = 'inset(0 '+((1-f)*100).toFixed(2)+'% 0 0 round 999px)'; } }
function sfx(n){ if(G.audio && G.audio.sfx){ try { G.audio.sfx(n); } catch(_){} } }
function call(fn){ if(typeof fn==='function'){ const a = Array.prototype.slice.call(arguments, 1); try { return fn.apply(null, a); } catch(err){ G.logError('ui callback', err); } } return undefined; }
function heroList(){ return (G.heroes && G.heroes.list) || []; }
function heroMeta(id){ const g = G.heroes && G.heroes.get ? G.heroes.get(id) : null; if(g) return g; for(const h of heroList()) if(h.id===id) return h; return { id, name:String(id||'?'), short:String(id||'?'), color:'#ffb070' }; }
function lighten(hex, k){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'')); if(!m) return '#ffe8c8';
  const n = parseInt(m[1],16); let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r = Math.round(r+(255-r)*k); g = Math.round(g+(255-g)*k); b = Math.round(b+(255-b)*k);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
// Kana text has no spaces inside words, so a narrow box breaks it anywhere (「すいしょうど／う」). With word-break:keep-all
// on the box it breaks only at the spaces and at the <wbr> put here where katakana meets hiragana (「ダークワンワン／じょう」).
const KATA = /[゠-ヿ]/, HIRA = /[ぁ-ゟ]/;
function wordWrap(e, s){
  e.textContent = '';
  let run = '', prev = '';
  for(const ch of String(s)){
    const k = KATA.test(ch) ? 'k' : HIRA.test(ch) ? 'h' : '';
    if(run && k && prev && k!==prev){ e.appendChild(document.createTextNode(run)); e.appendChild(document.createElement('wbr')); run = ''; }
    run += ch; if(k) prev = k; else prev = '';
  }
  if(run) e.appendChild(document.createTextNode(run));
}
function initialOf(h){ const s = String(h.short || h.name || h.id || '?'); return Array.from(s)[0] || '?'; }
function soundState(v){ return v!=null ? v!==false : !(G.audio && G.audio.muted); }
function fmtTime(sec){ sec = Math.max(0, Math.round(sec||0)); const m = Math.floor(sec/60), s = sec%60; return (m ? m+'ふん ' : '') + s + 'びょう'; }

// ---- portraits (G.heroes.portrait → PNG dataURL). Generated lazily, one per frame, so a phone never hitches.
const PSIZE = 160;
const pUrl = {};            // key id|expr → url | null (failed)
const pWait = [];           // { key, id, expr, fns:[] }
function portraitKey(id, expr){ return id+'|'+(expr||'normal'); }
function wantPortrait(id, expr, fn){
  if(!(G.heroes && typeof G.heroes.portrait==='function')){ fn(null); return; }
  const key = portraitKey(id, expr);
  if(key in pUrl){ fn(pUrl[key]); return; }
  for(const w of pWait) if(w.key===key){ w.fns.push(fn); return; }
  pWait.push({ key, id, expr:expr||'normal', fns:[fn] });
}
function portraitStep(){
  const w = pWait.shift(); if(!w) return;
  let url = null;
  try { url = G.heroes.portrait(w.id, { size:PSIZE, expr:w.expr }) || null; } catch(err){ G.logError('ui portrait '+w.id, err); }
  pUrl[w.key] = url;
  for(const f of w.fns){ try { f(url); } catch(err){ G.logError('ui portrait cb', err); } }
}
// fill a round frame: portrait image, or a coloured circle with the hero's initial
function fillPortrait(host, h, expr){
  host.style.setProperty('--hc', h.color || '#ffb070'); host.style.setProperty('--hc2', lighten(h.color, 0.7));
  if(host._pid===h.id+'|'+(expr||'')) return;
  host._pid = h.id+'|'+(expr||'');
  host.innerHTML = '';
  const fb = el('div', 'fbk', host); fb.textContent = initialOf(h);
  const want = host._pid;
  wantPortrait(h.id, expr, (url)=>{
    if(host._pid!==want || !url) return;
    host.innerHTML = '';
    const img = el('img', '', host); img.alt = ''; img.draggable = false; img.src = url;
  });
}
// HUD portrait swaps expressions often: keep one <img> and just change src
function setPortraitSrc(img, fb, id, expr){
  const key = portraitKey(id, expr);
  if(img._key===key) return;
  img._key = key;
  wantPortrait(id, expr, (url)=>{
    if(img._key!==key) return;
    if(url){ if(img.src!==url) img.src = url; img.style.display = ''; fb.style.display = 'none'; }
    else if(expr && expr!=='normal'){ img._key = null; setPortraitSrc(img, fb, id, 'normal'); }
    else { img.style.display = 'none'; fb.style.display = ''; }
  });
}

// ================================================================ state
let ready = false, root = null, fbLayer = null, host = null;
let reduced = false, kbMode = false, emPx = 14;
const S = {};                // screens by name: { el, on, data, nav:[], ni, key(e,code), frame(dt), open(data), close() }
const ORDER = ['loading','pause','over','result','ending','stages','select','title'];   // key focus priority (top first)

// A tap / key that arrives right after a screen (or the help panel) appeared was meant for the screen before it:
// a double-tap on 「あそぶ」 must not also press whatever the select screen put under the finger.
// Any press in the first 0.4 s is dropped; a tap on the same spot as the tap that opened the screen is dropped
// for 0.9 s (the second half of a double-tap on a slow phone lands there, a deliberate new tap rarely does).
const OPEN_GUARD_MS = 400, DOUBLE_TAP_MS = 900, DOUBLE_TAP_PX = 48;
let openedAt = -1e9, openX = NaN, openY = NaN;
let uiClock = 0, openedUi = -1e9;                           // seconds of G.ui.frame time (G.step-driven tests advance it too)
const lastDown = { x:NaN, y:NaN, t:-1e9 };
// gamepad menu state (see padFrame): last seen buttons / direction, auto-repeat timer, armed once all is released
const PAD = { c:true, b:true, dx:0, dz:0, rep:0, arm:false };
const PADEV = { repeat:false, preventDefault(){} };
function markOpen(){
  openedAt = performance.now(); openedUi = uiClock; PAD.arm = false;
  const fromTap = openedAt - lastDown.t < 1500;             // opened by a tap (not by the game on its own)
  openX = fromTap ? lastDown.x : NaN; openY = fromTap ? lastDown.y : NaN;
}
// keys / pad: still inside the guard only while BOTH clocks say so (live play: the same; a test that steps frames
// quickly or waits in real time without frames: whichever clock moved lets the press through)
function justOpened(){ return performance.now() - openedAt < OPEN_GUARD_MS && uiClock - openedUi < OPEN_GUARD_MS/1000; }
// real (trusted) clicks only: el.click() from the keyboard / pad routing and from tests is never blocked here
function tapBlocked(e){
  if(!(e && e.isTrusted)) return false;
  const dt = performance.now() - openedAt;
  if(dt < OPEN_GUARD_MS) return true;
  return dt < DOUBLE_TAP_MS && openX===openX && Math.abs(e.clientX - openX) < DOUBLE_TAP_PX && Math.abs(e.clientY - openY) < DOUBLE_TAP_PX;
}

function button(parent, cls, html, onTap, sound){
  const b = el('button', 'cb '+cls, parent, html);
  b.type = 'button'; b.tabIndex = -1;
  b.addEventListener('pointerdown', ()=>{ b.classList.add('pr'); });
  const up = ()=> b.classList.remove('pr');
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
  b.addEventListener('click', (e)=>{ e.preventDefault(); b.blur(); if(tapBlocked(e)) return; if(sound!==false) sfx(sound||'select'); if(onTap) onTap(e); });
  return b;
}
function pressFx(b){ b.classList.add('pr'); setTimeout(()=> b.classList.remove('pr'), 110); }
function paintKF(s){ if(!s.nav) return; s.nav.forEach((b, i)=> b.classList.toggle('kf', kbMode && i===s.ni)); }
function clearKF(){ for(const n in S){ const s = S[n]; if(s.nav) for(const b of s.nav) b.classList.remove('kf'); } }
function navKey(s, c, e){
  const list = (s.nav||[]).filter(b=> !b.classList.contains('x') && b.offsetParent!==null);
  if(!list.length) return false;
  let i = Math.max(0, list.indexOf(s.nav[s.ni]));
  if(c==='ArrowDown'||c==='ArrowRight'||c==='KeyS'||c==='KeyD') i = (i+1)%list.length;
  else if(c==='ArrowUp'||c==='ArrowLeft'||c==='KeyW'||c==='KeyA') i = (i+list.length-1)%list.length;
  else if(c==='Enter'||c==='NumpadEnter'||c==='Space'){ if(!e.repeat){ const b = list[i]; pressFx(b); b.click(); } return true; }
  else return false;
  s.ni = s.nav.indexOf(list[i]); paintKF(s); sfx('select');
  return true;
}
function screen(name, cls, build){
  const s = S[name] = { name, el: el('div', 'scr '+cls+' x', root), on:false, data:{}, nav:[], ni:0 };
  build(s);
  return s;
}
function openScreen(name, data){
  const s = S[name]; if(!s) return;
  s.data = data || {};
  s.on = true; show(s.el, true); markOpen();
  // restart entrance animations
  s.el.querySelectorAll('.pn').forEach(p=>{ p.style.animation = 'none'; void p.offsetWidth; p.style.animation = ''; });
  try { if(s.open) s.open(s.data); } catch(err){ G.logError('ui.open '+name, err); }
  paintKF(s);
}
function closeScreen(name){
  const s = S[name]; if(!s || !s.on) return;
  s.on = false; show(s.el, false);
  try { if(s.close) s.close(); } catch(err){ G.logError('ui.close '+name, err); }
}

// The title's bottom row is むずかしさ | あそぶ | おと・あそびかた. Where it doesn't fit (small phones, and 4:3 tablets
// with their bigger type) the two small buttons become round icons, then move up to the top-right corner.
// Measured rather than guessed from the width (fonts and safe areas vary); only on open and on resize.
function fitTitle(){
  const s = S.title; if(!s || !s.on) return;
  s.el.classList.remove('tq', 'tq2');
  if(root.classList.contains('port')) return;
  const room = s.bot.clientWidth, gap = emPx*0.6*2 + 4;
  if(s.dcol.offsetWidth + s.play.offsetWidth + s.opts.offsetWidth + gap <= room) return;
  s.el.classList.add('tq');
  if(s.dcol.offsetWidth + s.play.offsetWidth + s.opts.offsetWidth + gap <= room) return;
  s.el.classList.add('tq2');
}

// ================================================================ select
function paws(v, intScale){
  if(v==null || isNaN(v)) return 3;
  if(intScale) return U.clamp(Math.round(v), 1, 5);
  return U.clamp(Math.round(3 + (v-1)*8), 1, 5);         // stat multipliers: 0.8→1 … 1.0→3 … 1.25+→5
}
const STAT_ROWS = [ ['hp','たいりょく'], ['atk','ちから'], ['spd','はやさ'], ['jump','ジャンプ'] ];
function buildSelect(s){
  const e = s.el;
  const head = el('div', 'shead', e);
  const back = button(head, 'back k-cream', '<span class="ic">'+SVG.left+'</span><span>もどる</span>', ()=> call(s.data.onBack), false);
  el('div', 'hd', head).textContent = 'なかまを えらんでね！';
  const info = s.info = el('div', 'pn sinfo', e);
  s.nm = el('div', 'snm', info); s.sp = el('div', 'ssp', info); s.ds = el('div', 'sds', info);
  s.rows = STAT_ROWS.map(r=>{
    const row = el('div', 'srow', info); el('span', 'sl', row).textContent = r[1];
    const pw = el('span', 'pws', row); const cells = [];
    for(let i=0;i<5;i++) cells.push(el('i', '', pw, SVG.paw));
    return { key:r[0], cells };
  });
  s.mv = el('div', 'smv', info);
  const bot = el('div', 'sbot', e);
  s.cards = el('div', 'scards', bot);
  s.go = button(bot, 'sgo k-pink', '<span class="ic">'+SVG.paw+'</span><span>このこで</span><span>いく！</span>', ()=> pick(), false);
  s.back = back;
  s.list = []; s.focus = 0; s.cardEls = [];

  function paint(){
    const h = s.list[s.focus]; if(!h) return;
    s.cardEls.forEach((c, i)=> c.classList.toggle('on', i===s.focus));
    info.style.setProperty('--hc', h.color || '#ff8fb8');
    txt(s.nm, h.name || h.short || h.id);
    txt(s.sp, h.species || '');
    txt(s.ds, h.desc || '');
    const st = h.stats || {};
    for(const r of s.rows){ const n = paws(st[r.key], s.intScale); r.cells.forEach((c, i)=> c.classList.toggle('f', i<n)); }
    s.mv.innerHTML = '';
    const sp = h.specialName || (h.specials && h.specials.n), ul = h.ultName;
    if(sp){ const t = el('span', '', s.mv); el('b', '', t).textContent = 'ひっさつ'; t.appendChild(document.createTextNode(sp)); }
    if(ul){ const t = el('span', '', s.mv); el('b', '', t).textContent = 'おうぎ'; t.appendChild(document.createTextNode(ul)); }
    // restart the little pop on the info card
    info.style.animation = 'none'; void info.offsetWidth; info.style.animation = '';
  }
  function setFocus(i, user){
    const n = s.list.length; if(!n) return;
    i = ((i % n) + n) % n;
    if(i===s.focus && !user) { paint(); return; }
    s.focus = i; paint();
    if(user) call(s.data.onFocus, s.list[i].id);
  }
  function pick(){ const h = s.list[s.focus]; if(h) call(s.data.onPick, h.id); }
  s.open = (d)=>{
    s.list = (d.heroes && d.heroes.length ? d.heroes : heroList()).slice();
    s.intScale = s.list.length>0 && s.list.every(h=> h.stats && Object.keys(h.stats).every(k=> Number.isInteger(h.stats[k]) && h.stats[k]>=1 && h.stats[k]<=5));
    s.cards.innerHTML = ''; s.cardEls = [];
    s.list.forEach((h, i)=>{
      const c = el('button', 'card', s.cards); c.type = 'button'; c.tabIndex = -1; c.style.setProperty('--i', i);
      c.style.setProperty('--hc', h.color || '#ffb070');
      const cp = el('div', 'cp', c); fillPortrait(cp, h, 'normal');
      el('div', 'cn', c).textContent = h.short || h.name || h.id;
      c.addEventListener('click', (ev)=>{ ev.preventDefault(); c.blur(); if(tapBlocked(ev)) return; if(i===s.focus) pick(); else setFocus(i, true); });
      s.cardEls.push(c);
    });
    const i = Math.max(0, s.list.findIndex(h=> h.id===d.selected));
    s.focus = i; paint();
  };
  s.key = (e, c)=>{
    if(c==='ArrowLeft'||c==='KeyA'){ setFocus(s.focus-1, true); return true; }
    if(c==='ArrowRight'||c==='KeyD'){ setFocus(s.focus+1, true); return true; }
    if(c==='Enter'||c==='NumpadEnter'||c==='Space'){ if(!e.repeat){ pressFx(s.go); pick(); } return true; }
    if(c==='Escape'||c==='Backspace'){ if(!e.repeat){ pressFx(back); call(s.data.onBack); } return true; }
    return false;
  };
}

// ================================================================ stages (where to start, when there is saved progress)
// G.ui.show('stages', { stages:[{name, kana, locked, cleared}], onPick(index), onBack() }) — shown over the select screen.
// A stop on the path per stage; tap once to choose, tap again (or 「しゅっぱつ」) to go. Locked stops only wiggle.
function buildStages(s){
  s.el.classList.add('dim');
  const pn = el('div', 'pn stp', s.el);
  const head = el('div', 'sthd', pn);
  const back = s.back = button(head, 'back k-cream', '<span class="ic">'+SVG.left+'</span><span>もどる</span>', ()=> call(s.data.onBack), false);
  el('div', 'hd', head).textContent = 'どこから はじめる？';
  const row = el('div', 'strow', pn);
  const go = s.go = button(pn, 'stgo k-pink', '', ()=> pick(), false);
  s.list = []; s.els = []; s.focus = 0;
  const lockSvg = '<svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="11" rx="2.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.8"/></svg>';
  const usable = (i)=> !!s.list[i] && !s.list[i].locked;
  function paint(){
    s.els.forEach((c, i)=> c.classList.toggle('on', i===s.focus));
    go.innerHTML = '<span class="ic">'+SVG.paw+'</span><span>ステージ '+(s.focus+1)+' から しゅっぱつ！</span>';
  }
  function setFocus(i, user){ if(!usable(i) || i===s.focus) return; s.focus = i; paint(); if(user) sfx('select'); }
  function step(d){ const n = s.list.length; for(let k=1;k<n;k++){ const i = s.focus + d*k; if(i<0 || i>=n) break; if(usable(i)){ setFocus(i, true); return; } } }
  function pick(){ if(usable(s.focus)) call(s.data.onPick, s.focus); }
  function nope(c){ sfx('cancel'); c.classList.remove('no'); void c.offsetWidth; c.classList.add('no'); }
  s.open = (d)=>{
    s.list = Array.isArray(d.stages) ? d.stages.slice() : [];
    row.innerHTML = ''; s.els = [];
    s.list.forEach((st, i)=>{
      st = st || {};
      const c = el('button', 'stc' + (st.locked ? ' lock' : st.cleared ? ' clr' : ' nxt'), row); c.type = 'button'; c.tabIndex = -1; c.style.setProperty('--i', i);
      el('span', 'sn', c, st.locked ? '<i>'+lockSvg+'</i>' : String(i+1));
      wordWrap(el('span', 'stn', c), st.kana || st.name || ('ステージ '+(i+1)));
      const ss = el('span', 'sst', c);
      if(st.locked) ss.textContent = 'まだ だよ';
      else if(st.cleared){ el('i', '', ss, SVG.star); el('span', '', ss).textContent = 'クリア'; }
      else ss.textContent = 'つぎは ここ！';
      c.setAttribute('aria-label', 'ステージ '+(i+1)+' '+(st.kana || st.name || ''));
      c.addEventListener('click', (ev)=>{ ev.preventDefault(); c.blur(); if(tapBlocked(ev)) return; if(!usable(i)){ nope(c); return; } if(i===s.focus) pick(); else setFocus(i, true); });
      s.els.push(c);
    });
    // start on the next stage to play (the first open one that isn't cleared), else the last open one
    let f = -1;
    for(let i=0;i<s.list.length;i++){ if(usable(i)){ f = i; if(!s.list[i].cleared) break; } }
    s.focus = Math.max(0, f); paint();
    touchReleaseAll();
  };
  s.key = (e, c)=>{
    if(c==='ArrowLeft'||c==='KeyA'||c==='ArrowUp'||c==='KeyW'){ step(-1); return true; }
    if(c==='ArrowRight'||c==='KeyD'||c==='ArrowDown'||c==='KeyS'){ step(1); return true; }
    if(c==='Enter'||c==='NumpadEnter'||c==='Space'){ if(!e.repeat){ pressFx(go); pick(); } return true; }
    if(c==='Escape'||c==='Backspace'){ if(!e.repeat){ pressFx(back); call(s.data.onBack); } return true; }
    return false;
  };
}

function hudReset(){
  Object.assign(hud, { hpF:-1, chip:1, chipWait:0, hurtT:0, healT:0, sp:-1, ult:-1, full:false, lv:-1, xp:-1, coins:-1, coinShow:0, coinT:9,

  hud.comboEl.style.opacity = '0'; hud.hl.style.transform = '';

function hudFrame(dt){
  const p = G.player, g = G.game || {};
  if(p){
    // portrait (expression follows what is happening)
    if(p.type!==hud.type){ hud.type = p.type; const h = heroMeta(p.type); hud.pfi.style.setProperty('--hc', h.color||'#ffb070'); hud.pfi.style.setProperty('--hc2', lighten(h.color,0.7)); txt(hud.fb, initialOf(h)); hud.img._key = null; hud.expr = ''; }
    const maxHp = Math.max(1, p.maxHp||1), f = U.clamp((p.hp||0)/maxHp, 0, 1);
    if(hud.hpF<0){ hud.hpF = f; hud.chip = f; clipR(hud.hpf, f); clipR(hud.hpc, f); }
    else if(f!==hud.hpF){
      if(f < hud.hpF){ hud.chipWait = 0.42; hud.hurtT = 0.4; } else { hud.chip = Math.max(hud.chip, f); hud.healT = 0.6; clipR(hud.hpc, hud.chip); }
      hud.hpF = f; clipR(hud.hpf, f);
    }
    if(hud.chipWait > 0) hud.chipWait -= dt;
    else if(hud.chip > hud.hpF){ hud.chip = Math.max(hud.hpF, hud.chip - dt*(0.35 + (hud.chip-hud.hpF)*1.5)); clipR(hud.hpc, hud.chip); }
    const cls = f<=0.25 ? 'low' : f<=0.5 ? 'mid' : '';
    if(cls!==hud.hpCls){ hud.hpCls = cls; hud.hpf.className = 'hpf '+cls; hud.heart.classList.toggle('low', cls==='low'); }

  if(combo>=2){

const T = { el:null, wanted:false, visible:false, mode:'auto', saw:false, keyUsed:false, R:56, B:96, inL:10, inB:8, inR:10, probe:null, fade:false, near:false, gx:0, gy:0, cx0:1e9, cy0:1e9,

function ghostPos(){

function stickDown(ev){

  let dx = cx - s.ox, dy = cy - s.oy, d = Math.hypot(dx, dy);

  if(d > follow){ const k = (d-follow)/d; s.ox += dx*k; s.oy += dy*k; dx = cx - s.ox; dy = cy - s.oy; d = follow; }
  const kx = d>0 ? dx/d : 0, ky = d>0 ? dy/d : 0, m = Math.min(1, d/R);
  const a = m < 0.12 ? 0 : (m-0.12)/0.88;                       // 12% dead zone, rescaled so the edge is still 1
  const ti = G.input && G.input.touch;
  if(ti){ ti.x = +(kx*a).toFixed(3); ti.z = +(ky*a).toFixed(3); }  // screen up (dy<0) → z<0 (away from camera)
  const kd = Math.min(d, R);
  T.base.style.transform = 'translate3d('+s.ox.toFixed(1)+'px,'+s.oy.toFixed(1)+'px,0)';
  T.knob.style.transform = 'translate3d('+(kx*kd).toFixed(1)+'px,'+(ky*kd).toFixed(1)+'px,0)';
}
function stickEnd(){
  const s = T.stick; s.id = null;
  const ti = G.input && G.input.touch; if(ti){ ti.x = 0; ti.z = 0; }

}
function btnDown(o, ev){
  if(!T.visible) return;

  ev.stopPropagation();

  try { o.el.setPointerCapture(ev.pointerId); } catch(_){}

}
function btnPress(o, id){
  if(o.ids.indexOf(id)<0) o.ids.push(id);

  if(G.input && G.input.latch) G.input.latch(o.k);

function btnOff(o){ o.ids.length = 0; const ti = G.input && G.input.touch; if(ti) ti[o.k] = false; o.el.classList.remove('on'); }

// Hit test against circles cached in tbGeom() — no layout reads while fingers move.
function btnSlide(id, x, y){
  let cur = null;
  for(const o of T.btns){ if(o.ids.indexOf(id)>=0){ cur = o; break; } }
  if(!cur) return;
  let hit = null;
  for(const o of T.btns){ const dx = x - o.cx, dy = y - o.cy; if(dx*dx + dy*dy <= o.cr*o.cr){ hit = o; break; } }
  if(!hit || hit===cur) return;
  cur.ids.splice(cur.ids.indexOf(id), 1); if(!cur.ids.length) btnOff(cur);
  btnPress(hit, id);
}
function tbGeom(){
  if(!T.visible) return;
  const b = T.el.getBoundingClientRect();
  for(const o of T.btns){ const e = o.el, w = e.offsetWidth; o.cr = w*0.5; o.cx = b.left + e.offsetLeft + w*0.5; o.cy = b.top + e.offsetTop + e.offsetHeight*0.5; }

function touchReleaseAll(){
  if(T.stick.id!==null) stickEnd();

function touchApply(){
  if(!T.el) return;

  const vis = !!T.wanted && (T.mode==='on' || (T.mode!=='off' && auto));
  if(vis!==T.visible){
    T.visible = vis; show(T.el, vis); root.classList.toggle('tcon', vis);
    if(!vis) touchReleaseAll(); else { ghostPos(); tbGeom(); }
  }
}
function touchFrame(){
  touchApply();
  if(!T.visible) return;
  const p = G.player;
  const sp = p ? Math.floor((+p.sp||0) + 1e-6) : 0;
  const sb = T.btns[3];
  if(sp!==T.spN){ T.spN = sp; txt(sb.bn, sp); }
  const dim = sp < 1; if(dim!==T.spDim){ T.spDim = dim; sb.el.classList.toggle('dim', dim); }
  const ub = T.btns[4], u = p ? U.clamp(+p.ult||0, 0, 100) : 0;
  if(Math.abs(u - T.ult) > 0.3){ T.ult = u; setVar(ub.el, '--u', u/100, 0.002); }
  const rdy = u>=100; if(rdy!==T.ready){ T.ready = rdy; ub.el.classList.toggle('ready', rdy); ub.el.classList.toggle('dim', !rdy); }
  // see-through buttons while the hero stands behind the cluster (phones: the camera can put them there)
  // …and the idle stick ring goes faint while the hero stands under it (e.g. at the left edge of a boss arena)
  let fade = false, near = false;
  if(p && p.rig && p.rig.root && G.toScreen){
    const r = p.rig.root.position; G.toScreen(r.x, r.y + (p.height||1.2)*0.5, r.z, _tp);
    fade = _tp.visible && _tp.x > T.cx0 && _tp.y > T.cy0;
    near = _tp.visible && T.stick.id===null && Math.abs(_tp.x - T.gx) < T.R*1.45 && Math.abs(_tp.y - T.gy) < T.R*1.75;
  }
  if(fade!==T.fade){ T.fade = fade; T.el.classList.toggle('see', fade); }

}
const _tp = { x:0, y:0, visible:false };
const touch = {
  show(on){ T.wanted = !!on; if(ready) touchApply(); },
  get mode(){ return T.mode; }, set mode(m){ T.mode = (m==='on'||m==='off') ? m : 'auto'; if(ready) touchApply(); },
  get visible(){ return T.visible; },
  release: touchReleaseAll,
};

// ================================================================ keyboard routing
const GAMEKEYS = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyW','KeyA','KeyS','KeyD','KeyJ','KeyZ','KeyK','Space','KeyL','ShiftLeft','ShiftRight','KeyI','KeyX','KeyU','KeyC']);
function topScreen(){ for(const n of ORDER){ const s = S[n]; if(s && s.on) return s; } return null; }
function isGo(c){ return c==='Enter' || c==='NumpadEnter' || c==='Space' || c==='Escape' || c==='Backspace'; }
// send one menu key to the top-most open screen (keyboard and gamepad share this)
function routeKey(e, c){
  if(!kbMode){ kbMode = true; const s = topScreen(); if(s) paintKF(s); }
  const s = topScreen(); if(!s) return false;
  if(isGo(c) && justOpened()) return true;                 // the press that opened this screen, or a mash right after it
  if(!s.key) return false;
  try { return !!s.key(e, c); } catch(err){ G.logError('ui.key '+s.name, err); return false; }
}
function onKey(e){
  if(!ready) return;
  const c = e.code;
  if(GAMEKEYS.has(c) && (T.saw || !T.keyUsed)){ T.keyUsed = true; T.saw = false; touchApply(); }
  if(routeKey(e, c)) e.preventDefault();
}

// ================================================================ gamepad menus
// G.input.pad is polled by core every tick (A/START → confirm, B → dodge, stick / d-pad → x,z). Menus read it here,
// once per render frame, with their own edges: A/START presses the focused button, B goes back, the stick moves
// the focus (held: repeats). After a screen opens nothing counts until every pad input has been let go, so the
// START that opened the pause menu can't also press 「つづける」.
function padFrame(dt){
  const p = G.input && G.input.pad; if(!p) return;
  const c = !!p.confirm, b = !!p.dodge;
  const ax = Math.abs(p.x||0), az = Math.abs(p.z||0);
  let dx = 0, dz = 0;
  if(ax >= az){ if(ax > 0.5) dx = p.x > 0 ? 1 : -1; } else if(az > 0.5) dz = p.z > 0 ? 1 : -1;
  if(!PAD.arm){ PAD.arm = !c && !b && !dx && !dz; PAD.c = c; PAD.b = b; PAD.dx = dx; PAD.dz = dz; return; }
  const any = topScreen();
  if(any){
    if(c && !PAD.c) routeKey(PADEV, 'Enter');
    else if(b && !PAD.b) routeKey(PADEV, 'Escape');
    if(dx || dz){
      if(dx!==PAD.dx || dz!==PAD.dz){ PAD.rep = 0.42; routeKey(PADEV, padDir(dx, dz)); }
      else if((PAD.rep -= dt) <= 0){ PAD.rep = 0.14; routeKey(PADEV, padDir(dx, dz)); }
    }
  }
  PAD.c = c; PAD.b = b; PAD.dx = dx; PAD.dz = dz;
}
function padDir(dx, dz){ return dx<0 ? 'ArrowLeft' : dx>0 ? 'ArrowRight' : dz<0 ? 'ArrowUp' : 'ArrowDown'; }

// ================================================================ layout
function layout(){
  if(!root) return;
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  T.R = Math.round(Math.min(56, h*0.14, w*0.14));
  T.B = Math.round(Math.min(96, h*0.235, w*0.235));
  root.style.setProperty('--r', T.R+'px'); root.style.setProperty('--b', T.B+'px');
  root.classList.toggle('port', h > w);
  root.classList.toggle('short', h <= 480 && w > h);
  root.classList.toggle('tight', w > h && w < 720);          // narrow landscape phones: compact select GO
  root.classList.toggle('mini', w > h && (w < 620 || h < 340));
  // resolved safe-area paddings (custom properties can't be read back as numbers, so measure a probe)
  if(!T.probe){ T.probe = el('div', '', root); T.probe.style.cssText = 'position:absolute;left:var(--pl);top:var(--pt);right:var(--pr);bottom:var(--pb);visibility:hidden;pointer-events:none'; }
  const pr = T.probe.getBoundingClientRect(); T.inL = pr.left || 10; T.inB = (h - pr.bottom) || 8; T.inR = (w - pr.right) || 10;
  T.cx0 = w - T.inR - T.B*2.15; T.cy0 = h - T.inB - T.B*2.6;          // top-left corner of the button cluster
  emPx = parseFloat(getComputedStyle(root).fontSize) || 14;
  if(T.el){ ghostPos(); tbGeom(); }
  for(const s of fbs) s.vis && (s.w = s.el.offsetWidth || s.w);
  fitTitle(); hintFit();
}

// ================================================================ public API
function init(){
  if(ready) return;
  host = document.getElementById('ui');
  if(!host){ host = document.createElement('div'); host.id = 'ui'; host.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:10'; document.body.appendChild(host); }
  const st = document.createElement('style'); st.id = 'iuStyle'; st.textContent = buildCSS(); document.head.appendChild(st);
  fbLayer = document.createElement('div'); fbLayer.id = 'iuFB'; host.insertBefore(fbLayer, host.firstChild);     // under fx popups
  root = document.createElement('div'); root.id = 'iu'; host.appendChild(root);
  try { const mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)'); if(mq){ reduced = mq.matches; const f = (ev)=>{ reduced = ev.matches; }; mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener && mq.addListener(f); } } catch(_){}
  buildFoeBars(); buildHUD(); buildBoss(); buildGo(); buildHint(); buildTouch(); buildBanner();
  screen('title', 'title', buildTitle);
  screen('select', 'select', buildSelect);
  screen('stages', 'stages', buildStages);
  screen('pause', 'pause', buildPause);
  screen('result', 'result', buildResult);
  screen('over', 'over', buildOver);
  screen('ending', 'ending', buildEnding);
  screen('loading', 'loading', buildLoading);
  window.addEventListener('keydown', onKey);
  window.addEventListener('pointerdown', (e)=>{
    lastDown.x = e.clientX; lastDown.y = e.clientY; lastDown.t = performance.now();
    if(kbMode){ kbMode = false; clearKF(); }
    if(e.pointerType==='touch' || e.pointerType==='pen'){ if(!T.saw || T.keyUsed){ T.saw = true; T.keyUsed = false; touchApply(); } }
  }, true);
  G.bus.on('resize', layout);
  G.bus.on('hidden', touchReleaseAll);
  ready = true;
  layout();
  touchApply();
}
function uiShow(name, data){
  if(!ready) init();
  data = data || {};
  if(name==='hud'){ hud.on = true; hudReset(); show(hud.el, true); if(G.player) hudFrame(0); return; }
  if(!S[name]) return;
  openScreen(name, data);
}
function uiHide(name){
  if(!ready) return;
  if(name==='hud'){ hud.on = false; show(hud.el, false); hideFoeBars(); return; }
  closeScreen(name);
}
function hideAll(){
  if(!ready) return;
  for(const n in S) closeScreen(n);
  uiHide('hud');
  ban.on = false; show(ban.el, false);
  hintOff();
  go(false); bossBar(null);
  touch.show(false);
}
function frame(dt){
  if(!ready) return;
  dt = (dt>0 && dt<0.25) ? dt : 1/60;
  uiClock += dt;
  try { portraitStep(); } catch(err){ G.logError('ui.portrait', err); }
  try { if(hud.on){ hudFrame(dt); foeBarsFrame(dt); } else if(fbAny) hideFoeBars(); } catch(err){ G.logError('ui.hud', err); }
  try { bossFrame(dt); } catch(err){ G.logError('ui.boss', err); }
  try { bannerFrame(dt); hintFrame(dt); } catch(err){ G.logError('ui.banner', err); }
  try { touchFrame(); } catch(err){ G.logError('ui.touch', err); }
  try { padFrame(dt); } catch(err){ G.logError('ui.pad', err); }
  for(const n in S){ const s = S[n]; if(s.on && s.frame){ try { s.frame(dt); } catch(err){ G.logError('ui.frame '+n, err); } } }
}

// ---------------------------------------------------------------- difficulty
const DIFFS = {
  easy:   { name:'やさしい', heroDmg:1.3, foeDmg:0.5, foeHp:0.8,  attackers:1, foeSpeed:0.85, think:1.35, heroHp:1.2, lives:Infinity },
  normal: { name:'ふつう',   heroDmg:1.0, foeDmg:0.8, foeHp:1.0,  attackers:2, foeSpeed:1.0,  think:1.0,  heroHp:1.0, lives:Infinity },
  hard:   { name:'つよい',   heroDmg:0.9, foeDmg:1.2, foeHp:1.25, attackers:3, foeSpeed:1.12, think:0.8,  heroHp:1.0, lives:3 },
};
const RANKS = [ [2,'いいね！','#cfd8e6'], [8,'すごい！','#7dd0ff'], [16,'かっこいい！','#7dff5a'], [28,'さいこう！','#ffd24d'], [45,'でんせつ！','#ff9a3a'], [70,'でんせつ！！','#ff5aa0'] ];

const save = loadSave();
const game = G.game = {
  DIFFS, RANKS,
  diffKey: save.diff && DIFFS[save.diff] ? save.diff : 'normal',
  get diff(){ return DIFFS[this.diffKey]; },
  heroId: save.hero || 'inu',
  stageIndex: 0, unlocked: save.unlocked|0,
  level:1, xp:0, xpNext:60, coins:0,
  combo:0, comboT:0, comboRank:'', comboColor:'#fff', bestCombo:0,
  stageName:'', stageTime:0, revives:0, hurtCount:0, cutinT:0, clearT:0, koT:0,
  lives:3, ultCarry:0, soundOn: save.sound!==false,
  onHeroHit(src, t, dmg){
    this.combo++; this.comboT = 150;
    if(this.combo > this.bestCombo) this.bestCombo = this.combo;
    let rank = '', col = '#fff';
    for(const r of RANKS) if(this.combo >= r[0]){ rank = r[1]; col = r[2]; }
    if(rank && rank!==this.comboRank){ this.comboRank = rank; this.comboColor = col; G.bus.emit('combo', { count:this.combo, rank, rankUp:true, color:col }); }
    else G.bus.emit('combo', { count:this.combo, rank, color:col });
  },
  addXp(n){
    this.xp += n;
    while(this.xp >= this.xpNext){
      this.xp -= this.xpNext; this.level++; this.xpNext = Math.round(60*Math.pow(1.32, this.level-1));
      const p = G.player;
      if(p){
        const oldMax = p.maxHp;
        p.maxHp = Math.round(p.maxHp * 1.08); p.hp = p.maxHp; p.atkMul *= 1.05;
        G.bus.emit('levelUp', { ent:p, level:this.level, hpUp:p.maxHp-oldMax });
      }
    }
  },
};

// decorative heroes for title / select / ending
const deco = [];
function clearDeco(){ for(const e of deco) G.world.remove(e); deco.length = 0; }
function addDeco(id, x, z, anim, face){
  let rig = null;
  try { rig = G.heroes && G.heroes.build ? G.heroes.build(id) : null; } catch(err){ G.logError('deco build', err); }
  if(!rig) return null;
  const e = G.makeEnt({ kind:'deco', type:id, team:4, x, z, face: face==null?1:face, rig, radius:0.4, height:rig.height||1.3 });
  G.setAnim(e, anim||'pose');
  e.animT = Math.floor(Math.random()*60);
  G.world.add(e); deco.push(e);
  return e;
}
function loadBackdrop(i){
  try {
    if(G.stage && G.stage.titleScene && i==null) G.stage.titleScene();
    else if(G.stage && G.stage.load) G.stage.load(i||0);
  } catch(err){ G.logError('backdrop', err); }
}
function backdropUp(){ return !!(G.stage && G.stage.env && G.stage.env.root && G.stage.env.root.parent); }
function unloadStage(){ try { if(G.stage && G.stage.unload) G.stage.unload(); } catch(err){ G.logError('stage.unload', err); } if(typeof ARENA!=='undefined') ARENA.unload(); }

function setSound(on){ game.soundOn = !!on; if(G.audio && G.audio.setMuted) try { G.audio.setMuted(!game.soundOn); } catch(_){} persist(); }

// ---------------------------------------------------------------- scene: select
G.scenes.select = {
  enter(){

// ---------------------------------------------------------------- a run: several stages in a row
// with saved progress, offer the stage map (cleared stages + the next one); otherwise start at stage 1
function chooseStage(){
  const n = stages().length, open = U.clamp(game.unlocked|0, 0, Math.max(0, n-1));
  if(open > 0 && G.ui && G.ui.show && G.ui.hasScreen && G.ui.hasScreen('stages')){
    const list = stages().map((s, i)=> ({ name:s.name, kana:s.kana, locked: i > open, cleared: i < open }));
    uiShow('stages', { stages:list, onPick:(i)=>{ sfx('ok'); uiHide('stages'); startRun(U.clamp(i|0, 0, open)); }, onBack:()=>{ sfx('cancel'); uiHide('stages'); } });
  } else startRun(0);
}
function startRun(start){
  G._arena = false; G._autoplay = false;
  start = start|0;
  // starting later in the adventure: give the hero the level a player would roughly have by then
  game.level = start > 0 ? 1 + start*2 : 1; game.xp = 0; game.xpNext = Math.round(60*Math.pow(1.32, game.level-1));
  game.coins = 0; game.bestCombo = 0; game.ultCarry = 0;
  game.lives = game.diff.lives;
  G.go('play', { stage:start });
}

// ---------------------------------------------------------------- scene: play
const play = G.scenes.play = {
  enter(params){
    G.world.clear(); G.combat.clear(); clearDeco(); uiHideAll();
    G.hitStop = 0; G.paused = false; if(G.fx) G.fx.worldFrozen = false;
    game.stageIndex = params.stage|0;
    game.combo = 0; game.comboT = 0; game.comboRank = ''; game.stageTime = 0; game.revives = 0; game.hurtCount = 0;
    game.cutinT = 0; game.clearT = 0; game.koT = 0; this.cleared = false; this.over = false;
    unloadStage(); ARENA.unload();
    try { S().load(game.stageIndex); } catch(err){ G.logError('stage.load', err); }
    const st = S().info || stages()[game.stageIndex] || { name:'', kana:'' };
    game.stageName = st.kana || st.name || '';
    const p = G.player = G.playerCtl.create(game.heroId, 2.5, 0);
    G.world.add(p);
    if(G.heroes && G.heroes.portrait){ try { for(const ex of ['normal','hurt','happy']) G.heroes.portrait(game.heroId, { size:160, expr:ex }); G.heroes.portrait(game.heroId); } catch(err){ G.logError('portrait prewarm', err); } }
    G.cam.follow(p); G.cam.unlock(); G.cam.zoom = 0; G.cam.snap();
    uiShow('hud', {});
    touch(true);
    banner('ステージ ' + (game.stageIndex+1), game.stageName, 150);
    bgm(st.bgm || ('stage'+(game.stageIndex+1)));
    G.bus.emit('stageStart', { index:game.stageIndex, stage:st });
    G.input.clear();
  },
  exit(){
    ARENA.unload();
    uiHide('hud'); uiHide('pause'); touch(false);
    if(G.ui && G.ui.bossBar) try { G.ui.bossBar(null); } catch(_){}
    if(G.ui && G.ui.go) try { G.ui.go(false); } catch(_){}
    G.combat.clear(); G.world.clear(); G.player = null; G.paused = false;
  },
  pause(on){
    if(on===G.paused) return;
    G.paused = on;
    if(G.fx) G.fx.worldFrozen = !!on;
    if(on){
      G.bus.emit('pause', {});
      uiShow('pause', { soundOn:game.soundOn,
        onResume:()=> this.pause(false),
        onRetry:()=>{ this.pause(false); G.go('play', { stage:game.stageIndex }); },
        onTitle:()=>{ this.pause(false); G.go('title'); },
        onSound:(v)=> setSound(v) });
      if(G.audio && G.audio.pause) G.audio.pause(true);
    } else {
      uiHide('pause');
      if(G.audio && G.audio.pause) G.audio.pause(false);
      G.input.clear();
    }
  },
  tick(){
    const b = G.input.btn;
    if(this.over) return;            // game-over screen owns input; Esc must not resume the world behind it
    if(b.pause.pressed && !this.cleared && !(game.cutinT > 0)){ this.pause(!G.paused); return; }
    if(G.paused) return;
    const p = G.player;

    // ult cut-in: the world holds still while the cut-in plays
    if(p && (game.cutinT > 0 || G.hitStop > 0)) G.playerCtl.queue(p);
    if(game.cutinT > 0){
      game.cutinT--;
      if(p){ p.animT++; if(p.rig && p.rig.update) p.rig.update(p, G.cfg.TICK); }
      if(game.cutinT===0 && p) G.playerCtl.tick(p);
      return;
    }
    if(G.hitStop > 0){ G.hitStop--; return; }

    game.stageTime++;
    if(game.comboT > 0 && --game.comboT===0){ if(game.combo>=8) G.bus.emit('comboEnd', { count:game.combo }); game.combo = 0; game.comboRank = ''; }

    try { S().tick(); } catch(err){ G.logError('stage.tick', err); }
    if(p && G._autoplay) autoDrive(p);
    if(p) G.playerCtl.tick(p);
    const ents = G.world.ents;
    for(let i=0;i<ents.length;i++){
      const e = ents[i];
      if(e.team===1) G.foes.tick(e);
      else if(e.kind==='pickup') G.pickups.tick(e);
    }
    G.combat.tick();
    const bounds = S().bounds ? S().bounds() : null;
    for(let i=0;i<ents.length;i++){
      const e = ents[i];
      if(e.kind==='prop' || e.kind==='deco') continue;
      if(e.flashT>0 && e.team!==1 && e!==p) e.flashT--;
      G.phys(e, (e.team===1 && !e.entered) ? null : bounds);
    }
    separate(ents);
    stepRigs();

    // hero knocked out → cheer up and revive (or lose a life on つよい)
    if(p && p.dead){
      game.koT++;
      if(game.koT===30) banner('がんばれ！', game.lives===Infinity ? '' : 'のこり ' + Math.max(0, game.lives-1), 90);
      if(game.koT >= 100){
        game.koT = 0;
        if(game.lives!==Infinity && !this.cleared){ game.lives--; }
        if(game.lives!==Infinity && game.lives<=0 && !this.cleared){ this.gameOver(); return; }
        p.dead = false; p.hp = p.maxHp; p.inv = 180; p.vy = 0.12; p.onGround = false; p.sp = 3;
        G.setState(p, 'air'); G.setAnim(p, 'jump');
        game.revives++;
        G.bus.emit('revive', { ent:p });
      }
    }
    // stage clear
    if(S().done && !this.cleared){ this.cleared = true; game.clearT = 0; game.victT = 0; this.winGuard(); }
    if(this.cleared){
      game.clearT++;
      if(p) p.inv = Math.max(p.inv, 30);
      const bossStill = G.world.ents.some(e=> e.def && e.def.boss && !e.removed);
      if(!game.victT && ((!bossStill && game.clearT > 30) || game.clearT > 330)) game.victT = game.clearT;
      const v = game.victT ? game.clearT - game.victT : -1;
      if(v===0 && p && !p.dead){ G.combat.cancel(p); G.setState(p, 'victory'); G.setAnim(p, 'victory'); if(G.audio && G.audio.voice) G.audio.voice(p.type, 'win'); }
      if(v===10){ banner('ステージクリア！', game.stageName, 150); bgm('clear'); }
      if(v===170) this.showResult();
    }
  },
  frame: frameCommon,
  // the stage is won: nothing may hurt the hero any more, and the boss's drops fly to the hero
  winGuard(){
    for(const pr of G.combat.projectiles) if(pr.team===1) pr.life = 0;
    G.combat.areas.length = 0;
    const p = G.player; if(p){ p.inv = Math.max(p.inv, 9999); if(p.dead){ p.dead = false; p.hp = Math.max(1, Math.ceil(p.maxHp*0.5)); G.setState(p, 'idle'); G.setAnim(p, 'idle'); } }
  },
  showResult(){
    const idx = game.stageIndex, last = idx >= stages().length-1;
    let stars = 3 - Math.min(2, game.revives) - (game.hurtCount > 14 ? 1 : 0);
    stars = U.clamp(stars, 1, 3);
    game.unlocked = Math.max(game.unlocked, Math.min(stages().length-1, idx+1)); persist();
    const p = G.player; if(p) game.ultCarry = p.ult;
    G.bus.emit('stageClear', { index:idx, stars, time:Math.round(game.stageTime/60), coins:game.coins });
    touch(false);
    uiShow('result', { stageName:game.stageName, stars, time:Math.round(game.stageTime/60), coins:game.coins, bestCombo:game.bestCombo, last,
      onNext:()=>{ sfx('ok'); if(last) G.go('ending'); else G.go('play', { stage: idx+1 }); } });
  },
  gameOver(){
    this.over = true; touch(false);
    if(G.fx) G.fx.worldFrozen = true;
    bgm('over');
    uiShow('over', { onRetry:()=>{ game.lives = game.diff.lives; G.go('play', { stage:game.stageIndex }); }, onTitle:()=> G.go('title') });
    G.paused = true;
  },
};
// test bot: pushes G.input.touch like a (clumsy) kid would
function autoDrive(p){
  const T = G.input.touch;
  for(const k of ['attack','jump','dodge','special','ult']) T[k] = false;
  T.x = 0; T.z = 0;
  if(p.dead || p.state==='victory') return;
  let best = null, bd = 1e9;
  for(const e of G.world.ents){ if(e.team!==1 || e.dead || e.intangible) continue; const d = Math.abs(e.x-p.x) + Math.abs(e.z-p.z)*1.5; if(d<bd){ bd=d; best=e; } }
  const t = G.time.sceneTick;
  if(!best){
    // walk right toward the next wave; pick up things on the way
    T.x = 1; T.z = U.clamp(-p.z*0.5, -1, 1);
    return;
  }
  const dx = best.x - p.x, dz = best.z - p.z;
  const want = best.def && best.def.boss ? 1.4 : 1.0;
  if(Math.abs(dz) > 0.3) T.z = U.clamp(dz*2, -1, 1);
  if(Math.abs(dx) > want + 0.3) T.x = Math.sign(dx);
  else if(Math.abs(dx) < 0.5) T.x = -Math.sign(dx || 1);
  else if(Math.sign(dx)!==p.face) T.x = Math.sign(dx)*0.3;
  const close = Math.abs(dx) < want + 0.5 && Math.abs(dz) < 0.45;
  if(p.ult >= 100 && close){ T.ult = true; G.input.latch('ult'); return; }
  if(close && t % 7 === 0){ T.attack = true; G.input.latch('attack'); }
  if(close && p.sp >= 2 && t % 97 === 0){ T.special = true; G.input.latch('special'); }
  if(best.atk || best.pending){ if(t % 23 === 0){ T.dodge = true; G.input.latch('dodge'); } }
  if(t % 181 === 0){ T.jump = true; G.input.latch('jump'); }
}

// soft body separation so foes don't stack into one blob (heroes get pushed less)
function separate(ents){
  for(let i=0;i<ents.length;i++){
    const a = ents[i]; if(!(a.team===0 || a.team===1) || a.dead || a.intangible || a.y > 0.6) continue;
    for(let j=i+1;j<ents.length;j++){
      const c = ents[j]; if(!(c.team===0 || c.team===1) || c.dead || c.intangible || c.y > 0.6) continue;
      const dz = c.z - a.z; if(Math.abs(dz) > 0.42) continue;
      const bossPair = (a.def && a.def.boss) || (c.def && c.def.boss);
      const dx = c.x - a.x, min = (a.radius + c.radius)*(bossPair ? 1 : 0.8);
      if(Math.abs(dx) >= min) continue;
      if(bossPair && (a.team===0 || c.team===0)){
        const hero = a.team===0 ? a : c, boss = hero===a ? c : a;
        const s = hero.x >= boss.x ? 1 : -1; hero.x = boss.x + s*min; continue;
      }
      const push = (min - Math.abs(dx)) * 0.25 * (dx===0 ? (a.id<c.id?1:-1) : Math.sign(dx));
      const wa = a.team===0 ? 0.25 : (a.def&&a.def.boss ? 0.1 : 1), wc = c.team===0 ? 0.25 : (c.def&&c.def.boss ? 0.1 : 1);
      a.x -= push*wa; c.x += push*wc;
    }
  }
}
G.bus.on('hurt', (d)=>{ if(d.ent===G.player) game.hurtCount++; });
G.bus.on('ko', (d)=>{ const e = d.ent; if(e && e.def && G.player){ game.addXp(Math.round((e.def.xp||10) * (1 + Math.min(1, game.combo/40)))); } });
G.bus.on('bossIntro', (d)=>{
  const boss = d && d.boss;
  if(G.ui && G.ui.bossBar && boss) try { G.ui.bossBar(boss); } catch(_){}
  banner(d.name || 'ボス', d.title || '', 140);
  bgm(d.bgm || (boss && boss.type==='emperor' ? 'final' : 'boss'));
  if(boss){ G.cam.focus(boss.x, 1.4 + (boss.height||2)*0.3, boss.z, 70, 3); G.cam.zoom = boss.height>2.5 ? -2 : -1; }
});
G.bus.on('bossDown', (d)=>{
  if(G.ui && G.ui.bossBar) try { G.ui.bossBar(null); } catch(_){}
  G.cam.zoom = 0;
});
// the stage-7 mid-boss is purified: back to the stage's own music until the final boss
G.bus.on('midClear', ()=>{ if(G.sceneName==='play'){ const st = S().info || {}; bgm(st.bgm || ('stage'+(game.stageIndex+1))); } });
// phone switched apps / tab hidden: pause (kids come back to a pause menu, not a lost fight)
G.bus.on('hidden', ()=>{ if(G.sceneName==='play' && !play.over && !play.cleared && !(game.cutinT>0)) play.pause(true); });

// ---------------------------------------------------------------- scene: ending
G.scenes.ending = {
  enter(){
    G.world.clear(); clearDeco(); uiHideAll(); unloadStage(); loadBackdrop(null);
    const list = heroList();
    list.forEach((h, i)=> addDeco(h.id, (i-(list.length-1)/2)*1.3, 0.5, 'cheer', 1));
    G.cam.followEnt = null; G.cam.zoom = 3; G.cam.tx = 0; G.cam.ty = 1.4; G.cam.tz = 0.2; G.cam.snap();
    bgm('ending');
    uiShow('ending', { heroId:game.heroId, onTitle:()=> G.go('title') });
  },
  exit(){ uiHide('ending'); clearDeco(); },
  tick(){
    stepRigs();
    const t = G.time.sceneTick;
    if(t % 40 === 0 && G.fx && G.fx.burst){ const hw = G.cam.halfW; G.fx.burst('fireworks', U.rand(G.cam.x - hw*0.8, G.cam.x + hw*0.5), G.cam.y + U.rand(1.0, 2.3), -3, { scale:1.3 }); }
  },
  frame: frameCommon,
};

// ---------------------------------------------------------------- debug: model showcase (viewer scene)
const showcase = { ents: [], ground: null };
G.scenes.viewer = {
  enter(){
    G.scene.background = new THREE.Color(0xbfe6ff);
    if(!showcase.ground){
      const g = new THREE.Mesh(new THREE.CircleGeometry(30, 48), G.look.mat('#9fd67a', { rough:0.95, rim:0 }));
      g.rotation.x = -Math.PI/2; g.receiveShadow = true;
      showcase.ground = g;
    }
    G.scene.add(showcase.ground);
  },
  exit(){
    for(const e of showcase.ents) G.world.remove(e);
    showcase.ents.length = 0;
    if(showcase.ground) G.scene.remove(showcase.ground);
  },
  tick(){
    for(const e of showcase.ents){
      e.animT++; e.stateT++;
      if(e.flashT>0) e.flashT--;
      if(e.rig && e.rig.update){ try { e.rig.update(e, G.cfg.TICK); } catch(err){ G.logError('rig.update '+e.type, err); } }
    }
  },
  frame: frameCommon,
};
G.debug = {
  showcase(items, opts){
    opts = opts || {};
    if(G.sceneName!=='viewer') G.go('viewer');
    for(const e of showcase.ents) G.world.remove(e);
    showcase.ents.length = 0;
    const gap = opts.gap || 2.2, n = items.length;
    items.forEach((it, i)=>{
      let rig = null, kind = 'prop', type = String(it);
      try {
        if(typeof it === 'function'){ rig = it(); type = 'custom'+i; }
        else if(G.heroes && G.heroes.get && G.heroes.get(it)){ rig = G.heroes.build(it); kind='hero'; }
        else if(G.foes && G.foes.types && G.foes.types[it]){ rig = G.foes.build(it); kind='foe'; }
      } catch(err){ G.logError('showcase build '+type, err); }
      if(!rig) return;
      const e = G.makeEnt({ kind, type, x:(i-(n-1)/2)*gap, z:opts.z||0, face: opts.face==null?1:opts.face, rig,
        radius: rig.radius || 0.45, height: rig.height || 1.2, hp:10, maxHp:10 });
      if(kind==='foe') e.def = G.foes.types[type];
      G.setAnim(e, opts.anim || 'idle', opts.len || 0, opts.hitAt);
      G.world.add(e);
      showcase.ents.push(e);
    });
    const span = Math.max(1, (n-1)*gap);
    G.cam.followEnt = null; G.cam.unlock();
    G.cam.tx = 0; G.cam.ty = 0.9; G.cam.tz = 0;
    G.cam.zoom = opts.zoom!=null ? opts.zoom : (G.cam.baseDist - Math.max(6, span*1.25+3));
    G.cam.snap();
    return showcase.ents;
  },
  anim(name, len, hitAt){ for(const e of showcase.ents) G.setAnim(e, name, len||0, hitAt); },
  ents: ()=> showcase.ents,
  // jump straight into a stage (tests): G.debug.play('inu', 0)
  play(hero, stage, diff){ G._arena = false; if(hero) game.heroId = hero; if(diff) game.diffKey = diff; game.lives = game.diff.lives; G.go('play', { stage: stage|0 }); return G.player; },
  // flat arena run for testing foes/bosses: G.debug.arena('inu'); G.foes.spawn('wanhei', 8, 0)
  arena(hero, diff){ G._arena = true; if(hero) game.heroId = hero; if(diff) game.diffKey = diff; game.lives = game.diff.lives; G.go('play', { stage:0 }); return G.player; },
  // a simple bot drives the hero (walks to foes, attacks, jumps, uses specials / ult)
  autoplay(on){ G._autoplay = on!==false; if(!G._autoBound){ G._autoBound = true; G.bus.on('scene', ()=>{}); } },
  // press a button for n ticks (tests)
  press(btn, frames){ G.input.touch[btn] = true; G.input.latch(btn); G.step(frames||1); G.input.touch[btn] = false; G.step(1); },
};

// ---------------------------------------------------------------- boot
const MODULE_ORDER = ['look','heroes','foes','stage','combat','pickups','props','fx','audio','ui'];
G.boot = function(){
  const canvas = document.getElementById('game');
  const msg = (t)=>{ const el = document.getElementById('bootmsg'); if(el) el.textContent = t; };
  if(!G.initRenderer(canvas)){
    G.bootError = 'webgl';
    msg('このきかいでは 3D が うごかないみたい…（WebGL がつかえません）');
    return;
  }
  for(const name of MODULE_ORDER){
    const m = G[name];
    if(m && typeof m.init === 'function'){
      try { m.init(); } catch(err){ G.logError('init '+name, err); }
    }
  }
  if(G.audio && G.audio.setMuted) try { G.audio.setMuted(!game.soundOn); } catch(_){}
  G.ready = true;
  const boot = document.getElementById('boot');
  if(boot){ boot.style.transition = 'opacity .35s'; boot.style.opacity = '0'; setTimeout(()=> boot.remove(), 400); }
  if(G.testMode){ G.go('viewer'); G.step(1); return; }
  G.go('title');
  G.start();
};
G.boot();
})();


}
