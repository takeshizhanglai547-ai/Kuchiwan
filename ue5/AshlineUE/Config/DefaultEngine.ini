; =============================================================================
; DefaultEngine.ini — ASHLINE
;
; ここに書いた設定はエディタの「プロジェクト設定」と同じもの。
; エディタ側で変更すると、このファイルが書き換わる（それで正しい）。
; =============================================================================

[/Script/EngineSettings.GameMapsSettings]
; 起動時と再生時に開くレベル。
; ※ このレベルはまだ存在しない。RUNBOOK の手順3で
;    /Game/Maps/L_AshlineArena という名前で作ること。名前が1文字でも違うと
;    「再生を押すと真っ黒」になる。
EditorStartupMap=/Game/Maps/L_AshlineArena.L_AshlineArena
GameDefaultMap=/Game/Maps/L_AshlineArena.L_AshlineArena
; ルールの入れ物。ここを AshlineGameMode 以外にすると Sim が生成されず、
; Pawn が毎フレーム「AshlineGameMode が見つかりません」とログに出す。
GlobalDefaultGameMode=/Script/AshlineUE.AshlineGameMode

[/Script/Engine.PhysicsSettings]
; ASHLINE の当たり判定は AshlineCore が持っていて、UEの物理は使っていない。
; それでも重力を既定のままにしてあるのは、演出用の破片やラグドールを
; 後から足したときに、UEの標準的な見え方から外れないようにするため。
DefaultGravityZ=-980.000000

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
