<script>/* js/hero_casca.js */
'use strict';
/* =====================================================================
 *  hero_casca.js ── キャスカ（鷹の団 千人長）
 *  スピード型。反りのある細身の剣（サーベル）で手数の多い連撃を刻む。
 *  ・空中攻撃が当たると跳ね返って宙返りし、もう一度空中攻撃が出せる（1ジャンプ最大3回）。
 *    3回跳ねた後の4撃目は叩き落としの宙返り斬り。
 *  ・投げナイフは押しっぱなしで連射。撃ち切るとリロード中は無防備（リンと同じ）。
 *  ・覚醒「鷹の舞」: 速さ・攻撃力が上がり、残像を引く。
 *  （AvP の Lt. Linn Kurosawa に相当するスピードキャラ）
 * ===================================================================== */
(function (BK) {
  const U = BK.U, R = BK.rig, D = U.DEG;
  const MAX_BOUNCE = 3;   // 1回のジャンプで跳ね返れる回数
  const FLIP = 16;        // 跳ね返り後の宙返りフレーム数

  // ------------------------------------------------------------ drawing
  function head(c, sp, col, sk, pose, opt) {
    const hc = sk.headC, r = sp.headR, tint = opt && opt.tint;
    // 細い首
    R.limb(c, sk.sho.x, sk.sho.y, U.lerp(sk.neck.x, hc.x, 0.3), U.lerp(sk.neck.y, hc.y, 0.3), 4.6, 4.0, col('skin'), col('line'));
    c.save();
    c.translate(hc.x, hc.y);
    c.rotate((180 - sk.ha) * D);
    // 後ろ髪（うなじまでのショートボブ）
    R.poly(c, [-r * 0.2, -r * 0.9, -r * 1.2, -r * 0.45, -r * 1.24, r * 0.4, -r * 1.02, r * 1.02, -r * 0.7, r * 0.8, -r * 0.45, r * 1.06, -r * 0.12, r * 0.55], col('hair'), col('line'));
    // 顔
    R.circle(c, 0, 0, r, col('skin'), col('line'));
    R.poly(c, [r * 0.1, r * 0.5, r * 0.93, r * 0.2, r * 0.8, r * 0.78, r * 0.28, r * 1.02, -r * 0.2, r * 0.86], col('skin'));
    // 前髪と頭頂
    c.beginPath();
    c.moveTo(r * 1.06, -r * 0.1);
    c.lineTo(r * 1.02, -r * 0.62);
    c.quadraticCurveTo(r * 0.78, -r * 1.38, -r * 0.15, -r * 1.22);
    c.quadraticCurveTo(-r * 1.15, -r * 1.06, -r * 1.22, -r * 0.2);
    c.lineTo(-r * 0.55, r * 0.18);
    c.lineTo(-r * 0.08, r * 0.62);   // もみあげ
    c.lineTo(r * 0.04, -r * 0.18);
    c.lineTo(r * 0.34, -r * 0.4);
    c.lineTo(r * 0.5, -r * 0.1);     // 前髪の房
    c.lineTo(r * 0.66, -r * 0.4);
    c.lineTo(r * 0.88, -r * 0.08);
    c.closePath();
    c.fillStyle = col('hair'); c.fill();
    c.strokeStyle = col('line'); c.lineWidth = 1; c.stroke();
    if (!tint) {
      // 髪のつや
      c.strokeStyle = 'rgba(150,165,200,0.38)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(r * 0.6, -r * 0.98); c.quadraticCurveTo(-r * 0.2, -r * 1.28, -r * 0.85, -r * 0.72); c.stroke();
      // 切れ長の目
      c.fillStyle = '#0c0706'; c.fillRect(r * 0.46, -r * 0.06, r * 0.38, r * 0.17);
      c.fillStyle = '#efe2cf'; c.fillRect(r * 0.68, -r * 0.06, r * 0.13, r * 0.08);
      // 唇
      c.fillStyle = '#4a2418'; c.fillRect(r * 0.7, r * 0.56, r * 0.22, r * 0.1);
    }
    c.restore();
  }
  /** 胴体: 腰から肩への軸に沿って、くびれのある細身の胴＋胸甲 */
  function axisFn(sk) {
    const h = sk.hip, s = sk.sho;
    const ax = s.x - h.x, ay = s.y - h.y, L = Math.hypot(ax, ay) || 1;
    const nx = -ay / L, ny = ax / L; // +n = 前
    return (t, o) => [h.x + ax * t + nx * o, h.y + ay * t + ny * o];
  }
  function torso(c, sp, col, sk, pose, opt) {
    const P = axisFn(sk);
    R.poly(c, [].concat(P(0, 5.6), P(0.36, 4.4), P(0.62, 6.6), P(0.82, 7.6), P(1, 6.8), P(1, -7.4), P(0.72, -6.6), P(0.38, -4.8), P(0, -6.2)), col('body'), col('line'));
    // 胸甲（鷹の団の鋼の胸当て）
    R.poly(c, [].concat(P(0.44, 5.0), P(0.62, 7.3), P(0.8, 8.4), P(0.97, 7.0), P(0.97, -6.9), P(0.7, -6.9), P(0.44, -5.0)), col('armor'), col('line'));
    if (!(opt && opt.tint)) {
      const a1 = P(0.5, 4.0), a2 = P(0.72, 6.6), a3 = P(0.92, 6.0);
      c.strokeStyle = col('armorHi'); c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(a1[0], a1[1]); c.quadraticCurveTo(a2[0], a2[1], a3[0], a3[1]); c.stroke();
      const b1 = P(0.47, -4.6), b2 = P(0.47, 4.8);
      c.strokeStyle = 'rgba(0,0,0,0.35)';
      c.beginPath(); c.moveTo(b1[0], b1[1]); c.lineTo(b2[0], b2[1]); c.stroke();
    }
    // ベルト
    const b1 = P(0.06, -6.2), b2 = P(0.06, 5.6);
    R.limb(c, b1[0], b1[1], b2[0], b2[1], 3.6, 3.6, col('belt'));
  }
  /** 腰の草摺（前脚より手前に描く） */
  function chest(c, sp, col, sk, pose, opt) {
    const P = axisFn(sk);
    R.poly(c, [].concat(P(0.1, 6.8), P(0.1, -6.8), P(-0.2, -8.2), P(-0.28, -1), P(-0.22, 8.6)), col('armorDark'), col('line'));
    if (!(opt && opt.tint)) {
      const a = P(-0.06, -7.2), b = P(-0.06, 7.4);
      c.save(); c.strokeStyle = col('armorHi'); c.globalAlpha *= 0.6; c.lineWidth = 1;
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
      c.restore();
    }
  }
  function arm(c, sp, col, sh, el, hd, back, pose, opt) {
    R.defaultDraw.arm(c, sp, col, sh, el, hd, back);
    // 籠手（前腕の鉄板）
    R.limb(c, U.lerp(el.x, hd.x, 0.25), U.lerp(el.y, hd.y, 0.25), U.lerp(el.x, hd.x, 0.75), U.lerp(el.y, hd.y, 0.75),
      sp.armW * 1.0, sp.armW * 0.86, back ? col('bracerDark') : col('bracer'), col('line'));
    // 手にした投げナイフ
    if (back && pose.knife && !(opt && opt.noWeapon)) {
      const a = Math.atan2(hd.y - el.y, hd.x - el.x);
      c.save(); c.translate(hd.x, hd.y); c.rotate(a);
      R.poly(c, [1, -1.4, 11, 0, 1, 1.4], col('metal'), col('line'), 0.8);
      c.fillStyle = col('grip'); c.fillRect(-3, -1, 4, 2);
      c.restore();
    }
  }
  function leg(c, sp, col, hip, kn, ft, back, pose, opt) {
    R.defaultDraw.leg(c, sp, col, hip, kn, ft, back);
    // 膝当て（すねの向きに沿った小さな板金）
    const a = Math.atan2(ft.y - kn.y, ft.x - kn.x);
    c.save(); c.translate(kn.x, kn.y); c.rotate(a);
    c.beginPath(); c.ellipse(1.5, 0, 4.2, sp.legW * 0.42, 0, 0, Math.PI * 2);
    c.fillStyle = back ? col('bootDark') : col('armorDark'); c.fill();
    c.strokeStyle = col('line'); c.lineWidth = 1; c.stroke();
    c.restore();
  }
  /** 手前の肩当て（上腕の向きに追従する2段の板金） */
  function front(c, sp, col, sk, pose, opt) {
    const s = sk.shF, e = sk.elF;
    c.save(); c.translate(s.x, s.y); c.rotate(Math.atan2(e.y - s.y, e.x - s.x));
    c.strokeStyle = col('line'); c.lineWidth = 1.1;
    c.beginPath(); c.ellipse(1.5, 0, 6.6, 5.3, 0, 0, Math.PI * 2);
    c.fillStyle = col('armor'); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(5.8, 0, 3.4, 4.8, 0, -Math.PI / 2, Math.PI / 2); c.closePath();
    c.fillStyle = col('armorDark'); c.fill(); c.stroke();
    if (!(opt && opt.tint)) {
      c.strokeStyle = col('armorHi'); c.lineWidth = 1;
      c.beginPath(); c.ellipse(1.2, 0, 4.6, 3.4, 0, Math.PI * 0.95, Math.PI * 1.55); c.stroke();
    }
    c.restore();
  }
  /** 短いマント（裾はぼろぼろにしない） */
  function cape(c, sp, col, sk, pose, opt) {
    const t = (opt.t || 0) * 0.15;
    const fl = pose.cape == null ? 0.3 : pose.cape;
    const s = sk.sho, h = sk.hip;
    const len = sp.capeLen || 36;
    const back = 6 + fl * 22;
    const wave = Math.sin(t) * 2.4 * (0.4 + fl);
    const bx = s.x - back + wave, by = s.y + len - fl * 13;
    const fx = h.x - 3 - back * 0.25, fy = s.y + len * 0.9 - fl * 5;
    const mx = U.lerp(bx, fx, 0.5) + wave * 0.4, my = U.lerp(by, fy, 0.5) + 3;
    c.beginPath();
    c.moveTo(s.x + 4, s.y - 2);
    c.quadraticCurveTo(s.x - 9 - fl * 5, s.y + 1, s.x - 6 - back * 0.6, s.y + len * 0.5 + wave * 0.5);
    c.lineTo(bx, by);
    c.quadraticCurveTo(mx, my, fx, fy);
    c.quadraticCurveTo(h.x + 2, h.y - 8, s.x + 3, s.y + 7);
    c.closePath();
    c.fillStyle = col('cape'); c.fill();
    c.strokeStyle = col('line'); c.lineWidth = 1.1; c.stroke();
    if (!opt.tint) {
      // 裾の裏地と縁のリムライト
      c.strokeStyle = col('capeIn'); c.lineWidth = 2;
      c.beginPath(); c.moveTo(bx + 1, by - 1.5); c.quadraticCurveTo(mx, my - 1.5, fx, fy - 1.5); c.stroke();
      c.strokeStyle = 'rgba(170,190,230,0.3)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(s.x - 9 - fl * 5, s.y + 3); c.quadraticCurveTo(s.x - 6 - back * 0.6, s.y + len * 0.5, bx, by); c.stroke();
    }
  }
  /** 反りのある片刃のサーベル（原点=柄を握る手、+x が刃） */
  function sabre(c, sp, col, len, pose, opt) {
    // 柄・柄頭・護拳
    R.poly(c, [-9, -1.6, 0, -1.4, 0, 1.4, -9, 1.6], col('grip'));
    R.circle(c, -9.6, 0, 1.9, col('guard'));
    c.strokeStyle = col('guard'); c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(1, 3.8); c.quadraticCurveTo(-5, 7.2, -9.6, 1.6); c.stroke();
    R.poly(c, [-0.5, -4.2, 2.2, -4.2, 2.2, 4.2, -0.5, 4.2], col('guard'), col('line'));
    // 刃（峰→切っ先→刃）
    c.beginPath();
    c.moveTo(2.2, -1.9);
    c.quadraticCurveTo(len * 0.55, -2.7, len, -6.4);
    c.quadraticCurveTo(len * 0.62, 0.9, 2.2, 2.1);
    c.closePath();
    c.fillStyle = col('metal'); c.fill();
    c.strokeStyle = col('line'); c.lineWidth = 1; c.stroke();
    if (!(opt && opt.tint)) {
      c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 0.8;
      c.beginPath(); c.moveTo(4, -0.7); c.quadraticCurveTo(len * 0.55, -1.4, len - 5, -4.9); c.stroke();
    }
  }

  // ------------------------------------------------------------ helpers
  /** 横回転: face を cos で縮めて「その場で回る」ように見せる（f0〜f1 で turns 回転） */
  function spin(h, f, f0, f1, turns) {
    if (f === f0) h.spinDir = h.face < 0 ? -1 : 1;
    if (f < f0 || !h.spinDir) return;
    if (f >= f1) { h.face = h.spinDir; return; }
    const cs = Math.cos((f - f0) / (f1 - f0) * turns * Math.PI * 2);
    h.face = h.spinDir * (Math.abs(cs) < 0.1 ? (cs < 0 ? -0.1 : 0.1) : cs);
  }
  function endSpin(h) { if (h.spinDir) { h.face = h.spinDir; h.spinDir = 0; } }
  function aerialStart(h) { h.bounceArm = false; h.bounceEnd = 0; h.flipT = 0; }
  /** 空中攻撃ヒット時: 跳ね返って宙返り → もう一度空中攻撃が出せる */
  function bounce(h) {
    if (h.bounceArm || h.z < 6 || (h.bounces || 0) >= MAX_BOUNCE) return;
    h.bounceArm = true;
    h.bounces = (h.bounces || 0) + 1;
    // 跳ね返りは高さに応じて弱める（連打で天井まで昇っていかないように）
    h.vz = U.clamp(4.6 - h.bounces * 0.5 - Math.max(0, h.z - 45) * 0.05, 1.2, 4.6);
    h.vx = h.face * 1.5;
    h.jumpAtkUsed = false;
    h.bounceEnd = 5;
    BK.fx.ring(h.x, h.y, h.z + 4, 16, '#d6e4ff', 10);
  }
  /** 跳ね返り後の空中攻撃を選んで出す */
  function startAerial(h, I) {
    h.jumpAtkUsed = true; h.aBuf = 0;
    if (I.dirX) h.face = I.dirX;
    let m;
    if (I.dirY === 1) m = moves.downAtk;
    else if (h.bounces >= MAX_BOUNCE) m = moves.jumpFin;
    else if (I.dirX) m = moves.jumpAtkF;
    else m = moves.jumpAtk;
    h.startMove(m);
  }
  /** 鷹の羽根（白い羽根がひらひら舞う） */
  function feather(x, y, z, vx, vz) {
    BK.fx.add({
      type: 'custom', x, y, z, vx, vz, g: 0.025, drag: 0.95, life: U.randi(34, 54), rot: U.rand(0, 6), spin: U.rand(-0.18, 0.18),
      draw(c, sx, sy, k, p) {
        c.save();
        c.globalAlpha = Math.min(1, k * 2.2) * 0.9;
        c.translate(sx + Math.sin(p.life * 0.2) * 3, sy); c.rotate(p.rot + p.life * p.spin);
        c.fillStyle = '#eef3ff'; c.beginPath(); c.ellipse(0, 0, 5.2, 1.7, 0, 0, 7); c.fill();
        c.strokeStyle = 'rgba(80,100,140,0.8)'; c.lineWidth = 0.7;
        c.beginPath(); c.moveTo(-6, 0); c.lineTo(5, 0); c.stroke();
        c.restore();
      },
    });
  }

  // ------------------------------------------------------------ moves
  const GRAB = { lean: 8, aF: -25, eF: 95, wAbs: 100, aB: 88, eB: 12, lF: 22, kF: 18, lB: -20, kB: 8 };
  const AIR_UP = { lF: 60, kF: 100, lB: -5, kB: 85, lean: 6, aF: 60, eF: 40, wAbs: 150, aB: -60, eB: 60, cape: 1.2 };
  const AIR_DN = { lF: 34, kF: 50, lB: -20, kB: 36, lean: 4, aF: 50, eF: 42, wAbs: 122, aB: -50, eB: 40, cape: 1.4 };
  // リロード: 片膝をつき、腰のナイフを籠手の鞘へ差し直す（奥の手が胸の前に来るときにナイフが見える）
  const RLD_LO = { lean: 14, head: 14, aF: 30, eF: 12, wAbs: 62, aB: -12, eB: 82, lF: 90, kF: 110, lB: -5, kB: 95, cape: 0.2, knife: 0 };
  const RLD_HI = Object.assign({}, RLD_LO, { aB: 50, eB: 92, head: 20, knife: 1 });
  const TRAIL = '#e6eeff';

  const moves = {
    atk1: { // 袈裟斬り
      dur: 17, cancel: 8, cancelShot: 8, trail: [3, 8], trailCol: TRAIL,
      kf: [[0, {}],
        [3, { aF: 125, eF: 45, wAbs: 205, lean: -2, lF: 14, kF: 12, lB: -20, kB: 12, aB: -40, eB: 60, cape: 0.5 }],
        [6, { aF: 82, eF: 0, wAbs: 58, lean: 18, lF: 34, kF: 30, lB: -26, kB: 6, drop: 2, aB: -50, eB: 30, cape: 0.9 }, 'snap'],
        [9, { aF: 62, eF: 0, wAbs: 30, lean: 18, lF: 34, kF: 30, lB: -26, kB: 6, drop: 2, aB: -50, eB: 30 }], [17, {}]],
      hits: [{ f: [4, 7], x: [8, 70], z: [15, 95], d: 16, dmg: 7, kb: 'light', push: 1.6, stop: 3, sfx: 'slash' }],
      move: [[0, 0], [2, 2.6], [7, 0.6], [9, 0]],
      sfx: [[2, 'swing']],
    },
    atk2: { // 逆袈裟の斬り上げ
      dur: 17, cancel: 8, cancelShot: 8, trail: [3, 8], trailCol: TRAIL,
      kf: [[0, { aF: 62, eF: 0, wAbs: 30, lean: 18, lF: 34, kF: 30, lB: -26, kB: 6, drop: 2, aB: -50, eB: 30 }],
        [3, { aF: 35, eF: 10, wAbs: -35, lean: 14, lF: 30, kF: 30, lB: -24, kB: 8, drop: 2, aB: -50, eB: 30 }],
        [6, { aF: 140, eF: 15, wAbs: 165, lean: -6, lF: 24, kF: 18, lB: -22, kB: 10, aB: -60, eB: 30, cape: 0.9 }, 'snap'],
        [9, { aF: 150, eF: 15, wAbs: 190, lean: -8, lF: 24, kF: 18, lB: -22, kB: 10, aB: -60, eB: 30 }], [17, {}]],
      hits: [{ f: [4, 7], x: [6, 66], z: [20, 118], d: 16, dmg: 7, kb: 'light', push: 1.6, stop: 3, sfx: 'slash' }],
      move: [[0, 0], [2, 2.2], [7, 0.4], [9, 0]],
      sfx: [[2, 'swing']],
    },
    atk3: { // 二段斬り（振り下ろし → 横薙ぎ）
      dur: 26, cancel: 16, cancelShot: 16, trail: [1, 15], trailCol: TRAIL,

      if (h.move === moves.reload && h.canSpecial() && (I.pressed.sp || (I.pressed.atk && I.held.jmp) || (I.pressed.jmp && I.held.atk))) h.doSpecial();
      else if (h.reloading > 0 && !h.move && !h.sub && h.z <= 0 && (h.state === 'idle' || h.state === 'walk' || h.state === 'run')) {
        h.startMove(moves.reload);
        h.mf = Math.max(0, moves.reload.dur - h.reloading);
      }
      // 覚醒中は残像を記録
      if (h.awkT > 0 && BK.frame % 2 === 0) {
        h.ghosts.push({ x: h.x, y: h.y, z: h.z, face: h.face, pose: h.currentPose() });
        if (h.ghosts.length > 8) h.ghosts.shift();
      }
    },
    drawBack(c, h) {
      // 鷹の舞: 残像
      const gs = h.ghosts;
      if (h.awkT <= 0 || !gs || gs.length < 3) return;
      if (!(h.move || h.z > 0 || h.state === 'run' || h.state === 'walk')) return;
      const a0 = c.globalAlpha, sc = h.spec.scale || 1;
      for (let i = 2; i >= 0; i--) {
        const g = gs[gs.length - 2 - i * 2];
        if (!g) continue;
        c.globalAlpha = a0 * (0.34 - i * 0.1);
        c.save();
        c.translate(BK.sx(g.x), BK.sy(g.y, g.z));
        c.scale(g.face * sc, sc);
        R.draw(c, g.pose, h.spec, { t: h.animT, tint: i === 0 ? '#9dbcff' : '#5f80d0' });
        c.restore();
      }
      c.globalAlpha = a0;
    },
    drawFront(c, h) {
      // 旋風剣の風
      if (h.move === moves.special) {
        const f = h.mf, k = Math.min(1, f / 5) * Math.min(1, (moves.special.dur - f) / 8);
        if (k > 0) {
          const sx = BK.sx(h.x), sy = BK.sy(h.y, h.z);
          c.save(); c.lineCap = 'round';
          for (let i = 0; i < 3; i++) {
            const a = f * 0.55 + i * 2.1;
            c.globalAlpha = (0.55 - i * 0.12) * k;
            c.strokeStyle = i === 1 ? '#ffffff' : '#bcd2f2'; c.lineWidth = 3 - i * 0.7;
            c.beginPath(); c.ellipse(sx, sy - 22 - i * 26, 64 - i * 8, 12 - i * 2, 0, a, a + 2.3); c.stroke();
          }
          c.restore();
        }
      }
      // リロード中: 頭上に補充ゲージ
      if (h.reloading > 0 && !h.dead && h.def.shot.reloadAll) {
        const sx = BK.sx(h.x), sy = BK.sy(h.y, h.z) - 104;
        const k = 1 - h.reloading / h.def.shot.reloadAll;
        c.save();
        c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.6)';
        c.beginPath(); c.arc(sx, sy, 6, 0, Math.PI * 2); c.stroke();
        c.strokeStyle = (BK.frame >> 3) % 2 ? '#e8ecf4' : '#9fb0cc';
        c.beginPath(); c.arc(sx, sy, 6, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); c.stroke();
        c.restore();
      }
    },
  });
})(window.BK);

</script>
<script>/* js/hero_skull.js */
'use strict';
/* =====================================================================
 *  hero_skull.js ── 髑髏の騎士（使徒を狩る者）
 *  最も重く、最も遅く、最も打たれ強い重装の騎士。長剣と円盾による重い連撃、
 *  盾での突進、霊気の三日月「光刃」（低速・貫通）。覚醒は画面全体を断つ「空間切断」。
 *  （AvP の Predator Warrior に相当する重量級キャラ）
 * ===================================================================== */
(function (BK) {
  const U = BK.U, R = BK.rig, D = U.DEG;

  // 霊気（光刃・剣の丘・空間切断）の色
  const GLOW = '#e2f1ff', GLOW_MID = 'rgba(176,214,255,0.85)', GLOW_EDGE = 'rgba(110,160,255,0.32)';
  const CUT_DMG = 60;     // 空間切断のダメージ
  const AWK_DUR = 360;    // 空間切断のあとに纏う「鎧気」（スーパーアーマー）の長さ
  const CUT_FADE = 34;    // 断裂が閉じるまでのフレーム数

  // ------------------------------------------------------------ drawing
  // 王冠のような棘の冠: [根元の角度(度, -90=真上), 長さ(headR 比)]
  const CREST = [[-40, 0.42], [-68, 0.68], [-96, 0.84], [-124, 0.78], [-152, 0.58]];
  function head(c, sp, col, sk, pose, opt) {
    const h = sk.headC, r = sp.headR, tint = opt && opt.tint;
    const bone = col('bone'), boneD = col('boneDark'), line = col('line');
    c.save();
    c.translate(h.x, h.y);
    c.rotate((180 - sk.ha) * D);
    // 棘の冠（骨色。頭蓋の後ろに描く）
    for (const [a, len] of CREST) {
      const a0 = (a - 19) * D, a1 = (a + 19) * D, at = (a - 17) * D, rb = r * 0.86, rt = r * (0.98 + len), oy = -r * 0.1;
      R.poly(c, [Math.cos(a0) * rb, Math.sin(a0) * rb + oy, Math.cos(at) * rt, Math.sin(at) * rt + oy, Math.cos(a1) * rb, Math.sin(a1) * rb + oy], bone, line, 0.9);
      if (!tint) R.poly(c, [Math.cos(a - 2 * D) * rb * 1.04, Math.sin(a - 2 * D) * rb * 1.04 + oy, Math.cos(at) * rt * 0.93, Math.sin(at) * rt * 0.93 + oy, Math.cos(a1) * rb, Math.sin(a1) * rb + oy], 'rgba(110,94,70,0.3)');
    }
    // 頭蓋
    R.circle(c, -r * 0.05, -r * 0.08, r, bone, line);
    // 顔（上顎と歯）
    R.poly(c, [r * 0.3, -r * 0.5, r * 1.04, -r * 0.32, r * 1.1, r * 0.2, r * 1.0, r * 0.5, r * 0.96, r * 1.0, r * 0.2, r * 1.1, -r * 0.35, r * 0.62], bone, line);
    if (!tint) {
      // 冠の帯
      c.strokeStyle = boneD; c.lineWidth = 1.6;
      c.beginPath(); c.arc(-r * 0.05, -r * 0.08, r * 0.8, -168 * D, -42 * D); c.stroke();
      // 後頭部の陰
      c.fillStyle = 'rgba(50,36,22,0.32)';
      c.beginPath(); c.arc(-r * 0.05, -r * 0.08, r, 95 * D, 205 * D); c.quadraticCurveTo(-r * 0.3, r * 0.1, -r * 0.2, r * 0.9); c.closePath(); c.fill();
      // 眉弓の張り出し
      c.strokeStyle = 'rgba(255,250,235,0.55)'; c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(r * 0.18, -r * 0.42); c.lineTo(r * 0.98, -r * 0.34); c.stroke();
      // 眼窩（角ばった深い穴）
      R.poly(c, [r * 0.2, -r * 0.3, r * 0.9, -r * 0.34, r * 0.96, r * 0.02, r * 0.66, r * 0.28, r * 0.3, r * 0.14], '#07060a');
      // 鼻腔
      R.poly(c, [r * 1.0, r * 0.14, r * 1.08, r * 0.46, r * 0.84, r * 0.44], '#07060a');
      // 歯
      c.fillStyle = '#1c150f';
      c.fillRect(r * 0.26, r * 0.72, r * 0.72, r * 0.07);
      c.strokeStyle = 'rgba(36,28,20,0.95)'; c.lineWidth = 0.9;
      c.beginPath();
      for (let i = 0; i < 5; i++) { const x = r * (0.36 + i * 0.14); c.moveTo(x, r * 0.58); c.lineTo(x, r * 0.98); }
      c.stroke();
      // 頬骨
      c.strokeStyle = boneD; c.lineWidth = 1;
      c.beginPath(); c.moveTo(r * 0.36, r * 0.34); c.quadraticCurveTo(-r * 0.1, r * 0.2, -r * 0.5, r * 0.42); c.stroke();
      // 眼窩の奥の微かな光（覚醒中は蒼白く燃える）
      const aw = opt.awakened;
      const k = 0.45 + Math.sin(BK.frame * 0.11) * 0.18;
      if (aw) { c.fillStyle = 'rgba(140,190,255,0.4)'; c.beginPath(); c.arc(r * 0.6, -r * 0.04, r * 0.3, 0, 7); c.fill(); }
      c.fillStyle = aw ? `rgba(225,242,255,${0.8 + k * 0.2})` : `rgba(255,196,120,${k + 0.15})`;
      c.beginPath(); c.arc(r * 0.6, -r * 0.04, r * (aw ? 0.15 : 0.1), 0, 7); c.fill();
    }
    c.restore();
  }

  /** 大きな外套: R.capeDraw を使い、静止時でも裾が背後へ広がるようにする */
  function cape(c, sp, col, sk, pose, opt) {
    const fl = pose.cape;
    pose.cape = 0.42 + (fl == null ? 0.3 : fl) * 0.8;
    R.capeDraw(c, sp, col, sk, pose, opt);
    pose.cape = fl;
  }
  /** 胴を t(0=腰,1=肩) / k(前後オフセット) で指す点 */
  function torsoPt(sk, t, k) {
    const h = sk.hip, s = sk.sho;
    const a = Math.atan2(s.y - h.y, s.x - h.x), nx = -Math.sin(a), ny = Math.cos(a);
    return [U.lerp(h.x, s.x, t) + nx * k, U.lerp(h.y, s.y, t) + ny * k];
  }
  function torso(c, sp, col, sk, pose, opt) {
    const wW = sp.waistW / 2, cW = sp.chestW / 2, P = (t, k) => torsoPt(sk, t, k);
    // 胴（漆黒の板金）
    R.poly(c, [...P(0, wW), ...P(1, cW), ...P(1, -cW * 0.9), ...P(0, -wW)], col('body'), col('line'));
    // 胸甲
    R.poly(c, [...P(0.36, wW * 1.03), ...P(0.62, cW * 1.02), ...P(1, cW * 0.98), ...P(1, -cW * 0.25), ...P(0.4, -wW * 0.3)], col('armor'), col('line'));
    if (!opt.tint) {
      c.lineWidth = 1.1;
      c.strokeStyle = col('armorHi');
      c.beginPath(); c.moveTo(...P(0.42, wW * 0.82)); c.lineTo(...P(0.64, cW * 0.84)); c.lineTo(...P(0.95, cW * 0.82)); c.stroke();
      // 腹の小札
      c.strokeStyle = 'rgba(0,0,0,0.55)';
      c.beginPath();
      for (const t of [0.13, 0.25]) { c.moveTo(...P(t, wW)); c.lineTo(...P(t, -wW)); }
      c.stroke();
      c.strokeStyle = 'rgba(120,125,140,0.35)';
      c.beginPath();
      for (const t of [0.16, 0.28]) { c.moveTo(...P(t, wW * 0.95)); c.lineTo(...P(t, 0)); }
      c.stroke();
    }
    // 剣帯
    R.limb(c, ...P(0.02, -wW), ...P(0.02, wW), 4.2, 4.2, col('belt'));
  }
  /** 首当て・草摺（頭と前脚の上に重ねる） */
  function chest(c, sp, col, sk, pose, opt) {
    const wW = sp.waistW / 2, P = (t, k) => torsoPt(sk, t, k);
    // 草摺（腰から垂れる板金）
    R.poly(c, [...P(0.02, -wW * 0.1), ...P(-0.3, -wW * 0.05), ...P(-0.28, -wW * 1.2), ...P(0.02, -wW * 1.02)], col('clothDark'), col('line'));
    R.poly(c, [...P(0.03, wW * 1.06), ...P(-0.34, wW * 1.32), ...P(-0.3, -wW * 0.12), ...P(0.03, -wW * 0.15)], col('armor'), col('line'));
    if (!opt.tint) {
      c.strokeStyle = col('armorHi'); c.lineWidth = 1;
      c.beginPath(); c.moveTo(...P(-0.02, wW * 1.02)); c.lineTo(...P(-0.3, wW * 1.24)); c.stroke();
      c.strokeStyle = 'rgba(0,0,0,0.5)';
      c.beginPath(); c.moveTo(...P(-0.14, wW * 1.15)); c.lineTo(...P(-0.13, -wW * 0.12)); c.stroke();
    }
    // 首当て（喉元の鋼）
    const s = sk.sho, h = sk.hip;
    const a = Math.atan2(s.y - h.y, s.x - h.x), nx = -Math.sin(a), ny = Math.cos(a), ux = Math.cos(a), uy = Math.sin(a);
    const Q = (n, u) => [s.x + nx * n + ux * u, s.y + ny * n + uy * u];
    R.poly(c, [...Q(10, -1.5), ...Q(6.5, 2.5), ...Q(-1, 5.5), ...Q(-8, 5), ...Q(-11.5, -1)], col('armor'), col('line'));
    if (!opt.tint) {
      c.strokeStyle = col('armorHi'); c.lineWidth = 1;
      c.beginPath(); c.moveTo(...Q(6.5, 1.8)); c.lineTo(...Q(-1, 4.6)); c.stroke();
    }
  }
  /** 長剣（原点=柄を握る手、+x 方向に刃） */
  function longsword(c, sp, col, len, pose, opt) {
    R.circle(c, -13.5, 0, 2.5, col('metalDark'), col('line'));                    // 柄頭
    R.poly(c, [-12, -1.7, -1, -1.7, -1, 1.7, -12, 1.7], col('grip'));             // 柄
    R.poly(c, [-1.2, -8.5, 2.2, -7, 2.2, 7, -1.2, 8.5], col('metalDark'), col('line')); // 十字の鍔
    R.poly(c, [2.2, -3.3, len - 10, -2.7, len, 0, len - 10, 2.7, 2.2, 3.3], col('metal'), col('line'));
    if (!opt.tint) {
      c.fillStyle = 'rgba(255,255,255,0.22)'; c.fillRect(4, -2.5, len - 17, 1);
      c.strokeStyle = 'rgba(40,44,58,0.55)'; c.lineWidth = 0.9;
      c.beginPath(); c.moveTo(5, 0.3); c.lineTo(len - 16, 0.3); c.stroke();
      if (opt.awakened) { // 霊気を帯びた刃
        c.strokeStyle = 'rgba(150,200,255,0.55)'; c.lineWidth = 2.2;
        c.beginPath(); c.moveTo(4, -3.6); c.lineTo(len - 10, -3); c.lineTo(len + 1, 0); c.stroke();
      }
    }
  }
  /** 円盾（前腕 el→hd に装着。中心は手元） */
  function shield(c, sp, col, el, hd, opt) {
    const a = Math.atan2(hd.y - el.y, hd.x - el.x);
    const r = sp.shieldR || 13;
    const rx = r * (0.62 + 0.3 * Math.abs(Math.sin(a)));
    c.save();
    c.translate(U.lerp(el.x, hd.x, 0.86), U.lerp(el.y, hd.y, 0.86));
    c.rotate(U.clamp(a, -1.4, 1.4) * 0.2);
    c.beginPath(); c.ellipse(0, 0, rx, r, 0, 0, 7);
    c.fillStyle = col('shield'); c.fill(); c.strokeStyle = col('line'); c.lineWidth = 1.2; c.stroke();
    if (!opt.tint) {
      c.strokeStyle = col('shieldRim'); c.lineWidth = 1.8;
      c.beginPath(); c.ellipse(0, 0, rx - 1.6, r - 1.6, 0, 0, 7); c.stroke();
      c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 1;
      c.beginPath(); c.ellipse(rx * 0.08, 0, rx * 0.56, r * 0.58, 0, 0, 7); c.stroke();
      c.fillStyle = col('shieldRim');
      for (let i = 0; i < 8; i++) { const t = i / 8 * Math.PI * 2; c.fillRect(Math.cos(t) * (rx - 4.2) - 0.65, Math.sin(t) * (r - 4.2) - 0.65, 1.3, 1.3); }
      c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 1.2;
      c.beginPath(); c.ellipse(0, 0, rx - 3.2, r - 3.2, 0, -2.5, -1.3); c.stroke();
    }
    R.circle(c, rx * 0.18, 0, r * 0.23, col('metalDark'), col('line'));        // 中央の突起
    if (!opt.tint) { c.fillStyle = 'rgba(255,255,255,0.4)'; c.beginPath(); c.arc(rx * 0.18 - 1, -1, 1.1, 0, 7); c.fill(); }
    c.restore();
  }
  function arm(c, sp, col, sh, el, hd, back, pose, opt) {
    const up = back ? col('clothDark') : col('sleeve'), lo = back ? col('gloveDark') : col('glove');
    R.limb(c, sh.x, sh.y, el.x, el.y, sp.armW, sp.armW * 0.86, up, col('line'));
    R.limb(c, el.x, el.y, hd.x, hd.y, sp.armW * 0.98, sp.armW * 0.78, lo, col('line'));
    R.circle(c, el.x, el.y, sp.armW * 0.44, back ? col('clothDark') : col('armor'), col('line')); // 肘当て
    R.circle(c, hd.x, hd.y, sp.armW * 0.5, lo, col('line'));
    if (!back && !opt.tint) {
      // 籠手の縁の光
      const a = Math.atan2(hd.y - el.y, hd.x - el.x), nx = -Math.sin(a) * sp.armW * 0.32, ny = Math.cos(a) * sp.armW * 0.32;
      const s = nx < 0 ? -1 : 1;
      c.strokeStyle = col('armorHi'); c.lineWidth = 1;
      c.beginPath(); c.moveTo(el.x + nx * s + (hd.x - el.x) * 0.2, el.y + ny * s + (hd.y - el.y) * 0.2); c.lineTo(el.x + nx * s + (hd.x - el.x) * 0.75, el.y + ny * s + (hd.y - el.y) * 0.75); c.stroke();
    }
    if (back && !(pose && pose.shieldFront)) shield(c, sp, col, el, hd, opt);
  }
  function leg(c, sp, col, hip, kn, ft, back, pose, opt) {
    const th = back ? col('clothDark') : col('cloth'), sh = back ? col('bootDark') : col('boot');
    R.limb(c, hip.x, hip.y, kn.x, kn.y, sp.legW, sp.legW * 0.82, th, col('line'));
    R.limb(c, kn.x, kn.y, ft.x, ft.y, sp.legW * 0.86, sp.legW * 0.7, sh, col('line'));
    // 鉄靴（尖った爪先）
    R.poly(c, [ft.x - 4.5, ft.y - 4, ft.x + 6, ft.y - 3, ft.x + 10.5, ft.y + 1, ft.x + 9, ft.y + 2.2, ft.x - 4.5, ft.y + 2.2], sh, col('line'));
    // 膝当て（尖った板金）
    const kc = back ? col('clothDark') : col('armor');
    R.poly(c, [kn.x - 4.5, kn.y - 3, kn.x + 1, kn.y - 5.5, kn.x + 9, kn.y - 0.5, kn.x + 1.5, kn.y + 4.5, kn.x - 4, kn.y + 3], kc, col('line'));
    if (!back && !(opt && opt.tint)) {
      // 脛当ての縁の光
      const a = Math.atan2(ft.y - kn.y, ft.x - kn.x), ox = -Math.sin(a), oy = Math.cos(a), s = ox < 0 ? -sp.legW * 0.3 : sp.legW * 0.3;
      c.strokeStyle = col('armorHi'); c.lineWidth = 1;
      c.beginPath(); c.moveTo(U.lerp(kn.x, ft.x, 0.25) + ox * s, U.lerp(kn.y, ft.y, 0.25) + oy * s); c.lineTo(U.lerp(kn.x, ft.x, 0.8) + ox * s, U.lerp(kn.y, ft.y, 0.8) + oy * s); c.stroke();
    }
  }
  /** 手前の肩当て（棘つきの二枚板）と、盾を前に構える技の盾 */
  function front(c, sp, col, sk, pose, opt) {
    const s = sk.shF;
    const arm = col('armor'), line = col('line');
    c.save();
    c.translate(s.x - 0.5, s.y + 1);
    c.rotate((180 - sk.ta) * D);
    // 後ろへ流れる棘
    R.poly(c, [-8, 0, -16, -4, -6.5, -4.5], arm, line);
    c.beginPath(); c.ellipse(0, 0.5, 9, 6.5, 0, Math.PI, Math.PI * 2); c.lineTo(8.5, 4.5); c.quadraticCurveTo(0, 7, -8.5, 4.5); c.closePath();
    c.fillStyle = arm; c.fill(); c.strokeStyle = line; c.lineWidth = 1.1; c.stroke();
    c.beginPath(); c.ellipse(0.5, 5, 8, 3.4, 0, 0, Math.PI); c.closePath();
    c.fillStyle = col('clothDark'); c.fill(); c.stroke();
    if (!opt.tint) {
      c.strokeStyle = col('armorHi'); c.lineWidth = 1.1;
      c.beginPath(); c.ellipse(0, 0.5, 7, 4.8, 0, Math.PI * 1.15, Math.PI * 1.8); c.stroke();
    }
    c.restore();
    if (pose && pose.shieldFront) shield(c, sp, col, sk.elB, sk.hdB, opt);
  }

  // ------------------------------------------------------------ effects
  /** 三日月（凸側が進行方向 dir、角は後ろへ流れる） */
  function crescent(c, x, y, dir, hh, th) {
    c.beginPath();
    c.moveTo(x - dir * th * 0.6, y - hh);
    c.quadraticCurveTo(x + dir * th * 1.9, y, x - dir * th * 0.6, y + hh);
    c.quadraticCurveTo(x + dir * th * 0.5, y, x - dir * th * 0.6, y - hh);
    c.closePath();
    c.fill();
  }
  function drawCrescentFx(c, sx, sy, dir, hh, th, alpha, trail) {
    c.globalAlpha = alpha * 0.16; c.fillStyle = '#7fb0ff';
    for (let i = 1; i <= trail; i++) crescent(c, sx - dir * i * 9, sy, dir, hh * (1 - i * 0.08), th);
    c.globalAlpha = alpha; c.fillStyle = GLOW_EDGE;
    crescent(c, sx, sy, dir, hh * 1.1, th * 1.5);
    c.fillStyle = GLOW_MID;
    crescent(c, sx, sy, dir, hh, th);
    c.fillStyle = '#ffffff';
    crescent(c, sx + dir * th * 0.28, sy, dir, hh * 0.84, th * 0.5);

  /** 剣先の座標（ワールド） */

  // ---- 空間切断: 画面を斜めに走る断裂（fx の custom 粒子として最前面に描く）
  function riftGeom(p) {
    const W = BK.W, H = BK.H, d = p.dir;
    const ax = d > 0 ? -30 : W + 30, bx = d > 0 ? W + 30 : -30;
    return { ax, ay: H * 0.14, bx, by: H * 0.9 };
  }
  function drawRift(c, sx, sy, k, p) {
    p.x = BK.cam.x + BK.W / 2; // 画面外判定で消されないよう常に画面中央に置く
    const age = p.max - p.life;
    const q = p.cut ? 1 - p.life / CUT_FADE : 0;
    const a = p.cut ? Math.max(0, 1 - q) : 1;
    const g = riftGeom(p);
    const open = Math.min(1, (age + 1) / 5);
    const ex = U.lerp(g.ax, g.bx, open), ey = U.lerp(g.ay, g.by, open);
    const L = Math.hypot(g.bx - g.ax, g.by - g.ay);
    const nx = -(g.by - g.ay) / L, ny = (g.bx - g.ax) / L;
    let w;
    if (!p.cut) w = 1.6 + Math.min(1, age / 12) * 4.5 + Math.sin(age * 0.7) * 0.6;
    else w = q < 0.18 ? 6 + q / 0.18 * 12 : 18 * (1 - (q - 0.18) / 0.82);
    c.save();
    // 時の止まった世界（自前の暗転。断裂だけは暗転の上に描く）
    const dark = p.cut ? 0.55 * Math.max(0, 1 - q * 1.7) : 0.55;
    if (dark > 0) { c.fillStyle = `rgba(3,5,14,${dark.toFixed(3)})`; c.fillRect(0, 0, BK.W, BK.H); }
    if (w > 0.2 && a > 0) {
      const rnd = U.srand(p.seed + (age >> 1));
      const N = 22, top = [], bot = [], mid = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const x = U.lerp(g.ax, ex, t), y = U.lerp(g.ay, ey, t);
        const T = t * open;
        let hw = w * Math.pow(Math.sin(Math.PI * T), 0.6);
        if (open < 1) hw *= Math.min(1, (1 - t) * 5);
        const j = (rnd() - 0.5) * 2.2;
        top.push(x + nx * (hw + j), y + ny * (hw + j));
        bot.push(x - nx * (hw - j * 0.5), y - ny * (hw - j * 0.5));
        mid.push(x + nx * j * 0.4, y + ny * j * 0.4);
      }
      // 外側の霊光
      c.globalAlpha = a;
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.strokeStyle = 'rgba(120,170,255,0.3)'; c.lineWidth = w * 2.6 + 9;
      c.beginPath(); c.moveTo(mid[0], mid[1]); for (let i = 2; i < mid.length; i += 2) c.lineTo(mid[i], mid[i + 1]); c.stroke();
      c.strokeStyle = 'rgba(200,225,255,0.45)'; c.lineWidth = w * 1.4 + 3;
      c.stroke();
      // 裂け目の内側（虚空）
      c.beginPath(); c.moveTo(top[0], top[1]);
      for (let i = 2; i < top.length; i += 2) c.lineTo(top[i], top[i + 1]);
      for (let i = bot.length - 2; i >= 0; i -= 2) c.lineTo(bot[i], bot[i + 1]);
      c.closePath();
      c.fillStyle = p.cut && q < 0.22 ? '#f4f9ff' : '#030108';
      c.fill();
      c.strokeStyle = '#eef6ff'; c.lineWidth = 1.4; c.stroke();
      // 虚空に瞬く星
      if (!p.cut || q > 0.22) {
        c.fillStyle = 'rgba(210,190,255,0.85)';
        for (let i = 0; i < 9; i++) {
          const t = 0.08 + rnd() * 0.84;
          if (t > open) continue;
          const x = U.lerp(g.ax, g.bx, t), y = U.lerp(g.ay, g.by, t), o = (rnd() - 0.5) * w * 0.9;
          c.fillRect(x + nx * o - 0.6, y + ny * o - 0.6, 1.3, 1.3);
        }
      }
      // 走る切っ先の光
      if (open < 1) {
        c.fillStyle = 'rgba(160,200,255,0.5)'; c.beginPath(); c.arc(ex, ey, 11, 0, 7); c.fill();
        c.fillStyle = '#ffffff'; c.beginPath(); c.arc(ex, ey, 4.5, 0, 7); c.fill();
      }
    }
    c.restore();
  }
  function spawnRift(h) {
    const p = BK.fx.add({ type: 'custom', x: BK.cam.x + BK.W / 2, y: BK.DEPTH / 2, z: 0, life: 120, dir: h.face, seed: U.randi(1, 99999), cut: false, draw: drawRift });

  /** 敵に刻まれる斬線（断裂と平行） */
  function cutMark(a, rift) {
    const g = riftGeom(rift);
    const L = Math.hypot(g.bx - g.ax, g.by - g.ay), ux = (g.bx - g.ax) / L, uy = (g.by - g.ay) / L;
    BK.fx.add({
      type: 'custom', x: a.x, y: a.y, z: a.z + (a.h || 80) * 0.55, life: 16,
      draw(c, sx, sy, k) {
        const l = 34 + (1 - k) * 18;
        c.save(); c.lineCap = 'round';
        c.globalAlpha = k * 0.5; c.strokeStyle = '#8fb8ff'; c.lineWidth = 7;
        c.beginPath(); c.moveTo(sx - ux * l, sy - uy * l); c.lineTo(sx + ux * l, sy + uy * l); c.stroke();
        c.globalAlpha = k; c.strokeStyle = '#ffffff'; c.lineWidth = 2;
        c.stroke();
        c.restore();
      },
    });
  }
  /** 空間ごと断つ: 画面内の敵すべて（ボスも）に大ダメージ */
  function spaceCut(h) {
    const g = BK.game;
    if (!g) return;
    const awk0 = h.awk;
    const x0 = BK.cam.x - 16, x1 = BK.cam.x + BK.W + 16;
    const rift = h._rift;
    const hit = { dmg: CUT_DMG, kb: 'down', push: 5, lift: 7.5, stop: 0, breakArmor: true, sfx: 'none', fx: 'none' };
    for (const a of g.actors.slice()) {
      if (a === h || a.dead || a.remove) continue;
      if (a.team !== 'enemy' && !a.isProp) continue;
      if (a.x < x0 || a.x > x1) continue;
      const dir = U.sign(a.x - h.x || h.face);
      if (a.isProp) { a.takeHit(h, hit, dir); continue; }
      let ok = false;
      if (a.hurtable) ok = a.takeHit(h, hit, dir);
      else if ((a.state === 'down' || a.state === 'getup') && !a.intangible && a.hp > 0) {
        // 倒れている敵も空間ごと断つ
        const dmg = Math.max(1, Math.round(CUT_DMG * (h.dmgMul || 1) * (a.dmgTakenMul || 1)));
        a.hp -= dmg; a.flash = 6;
        h.onDealDamage(dmg, a, hit);
        if (a.hp <= 0) { a.hp = 0; a.die(h, hit, dir); }
        ok = true;
      }
      if (!ok) continue;
      const zm = a.z + (a.h || 80) * 0.55;
      if (rift) cutMark(a, rift);
      BK.fx.add({ type: 'burst', x: a.x, y: a.y, z: zm, life: 8, size: 26, col: '#eef6ff' });
      BK.fx.blood(a.x, a.y, zm, dir, 7, a.bloodCol);
    }
    h.awk = awk0; // 覚醒技そのものではゲージを溜めない
    if (rift) { rift.cut = true; rift.life = Math.min(rift.life, CUT_FADE); rift.max = Math.max(rift.max, CUT_FADE); }
    h._riftT = CUT_FADE + 4;
    BK.fx.flash('#eaf4ff', 12);
    BK.fx.shake(10, 26);
    BK.fx.stop(10);
    BK.audio.sfx('hitHeavy', { pitch: 0.5 });
    BK.audio.sfx('slash', { pitch: 0.6 });
    BK.audio.sfx('explode', { pitch: 1.5, vol: 0.6 });
  }

  BK.registerHero({
    id: 'skull', name: '髑髏の騎士', title: '使徒を狩る者',
    desc: '漆黒の甲冑に髑髏の兜。最も重く、最も打たれ強い。\n長剣の重い連撃と盾打ち、\n霊気の三日月「光刃」で使徒を断つ。',
    stats: { life: 5, power: 4, speed: 2, reach: 4, shot: 3 },
    color: '#d8cfb4',
    maxHp: 190, walk: 1.8, walkY: 1.2, run: 3.8, jumpV: 9.0, jumpVX: 2.4, runJumpVX: 4.2, weight: 1.7, w: 32, h: 102,

      scale: 1.15, thigh: 21, shin: 20, torso: 31, neck: 2, headR: 9.2, upper: 18, fore: 17,
      legW: 12.5, armW: 10, waistW: 18, chestW: 31, shoulderOff: 3, weaponLen: 60, gripDist: 10, capeLen: 72, shieldR: 13,
      colors: {
        bone: '#ddd4bd', boneDark: '#a39a82', skin: '#ddd4bd', hair: '#121114',
        cloth: '#25262d', clothDark: '#17171c', sleeve: '#282930', body: '#22232a', armor: '#343641', armorHi: '#7a7f92',
        belt: '#3a332c', boot: '#212229', bootDark: '#141418', glove: '#2b2c34', gloveDark: '#19191e',
        metal: '#b9bec9', metalDark: '#4d505b', grip: '#221a1c', cape: '#131117',
        shield: '#2b2c35', shieldRim: '#948f7e', line: 'rgba(3,2,5,0.92)',

      },
      grab(h) { return R.merge(h.stance, { lean: 12, aB: 78, eB: 18, aF: 205, eF: 25, wAbs: 240, lF: 24, kF: 20, lB: -20, kB: 6 }); },
      crouch(h) { return R.merge(h.stance, { lF: 50, kF: 80, lB: -10, kB: 70, lean: 16, drop: 3 }); },
    },
    moves,
    shot: {
      name: '光刃', max: 3, regen: 45, cd: 26, auto: false, air: false,
      fire(h) { lightBlade(h); },
      hint: '低速で敵を貫く霊気の三日月',
    },
    awaken: {
      name: '空間切断', type: 'screen', dur: AWK_DUR,
      colors: { metal: '#e4f1ff', armorHi: '#9cb9e6' },
      start(h) {
        spaceCut(h);
        // 断ったあとは霊気の鎧を纏う（しばらく怯まず、被ダメージ減）
        h.awkT = AWK_DUR; h.superArmor = 1; h.dmgTakenMul = 0.7;
      },
      update(h) {
        if (h._riftT > 0) {
          h._riftT--;
          // 粒子が多すぎて断裂が押し出された場合は戻す
          const p = h._rift;
          if (p && p.life > 0 && BK.fx.parts.indexOf(p) < 0) BK.fx.parts.push(p);
          if (h._riftT === 0) h._rift = null;
        }
        if (h.awkT % 5 === 0) BK.fx.add({ type: 'smoke', x: h.x + U.rand(-16, 16), y: h.y, z: U.rand(20, 100), vz: U.rand(0.6, 1.4), life: 26, size: U.rand(4, 8), col: 'rgba(150,190,255,0.22)' });
      },
      end(h) { h.superArmor = 0; h.dmgTakenMul = 1; },
    },
    init(h) { h.downAfter = 5; h.trailCol = '#e4ecf8'; },
    drawBack(c, h) {
      if (h.awkT <= 0) return;
      const sx = BK.sx(h.x), sy = BK.sy(h.y, h.z) - 56;
      const k = 0.6 + Math.sin(BK.frame * 0.2) * 0.2;
      const g = c.createRadialGradient(sx, sy, 6, sx, sy, 72);
      g.addColorStop(0, `rgba(130,180,255,${0.26 * k})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.beginPath(); c.arc(sx, sy, 72, 0, 7); c.fill();
    },
    drawFront(c, h) {
      // 空間切断の溜め: 剣先に霊気の光球
      if (h.move !== moves.awaken || h.mf >= 44 || h.mf < 6) return;
      const t = tipPos(h), sx = BK.sx(t.x), sy = BK.sy(h.y, t.z);
      const r = 3 + Math.min(1, (h.mf - 6) / 34) * 7 + Math.sin(BK.frame * 0.8) * 0.8;
      c.fillStyle = 'rgba(130,180,255,0.3)'; c.beginPath(); c.arc(sx, sy, r * 2.3, 0, 7); c.fill();
      c.fillStyle = 'rgba(210,230,255,0.75)'; c.beginPath(); c.arc(sx, sy, r * 1.3, 0, 7); c.fill();
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(sx, sy, r * 0.7, 0, 7); c.fill();
    },

})(window.BK);

<script>/* js/hero_schierke.js */
'use strict';
/* =====================================================================
 *  hero_schierke.js ── シールケ（魔女の弟子）
 *  体は小さく打たれ弱いが、射撃（魔術）は最強。自動で敵を追う「精霊の火」、
 *  風・雷・火を宿した杖術、溜めで火の精霊（サラマンダー）の火柱、
 *  必殺は「風の結界」、覚醒は画面全体を四大精霊が薙ぎ払う「四大精霊召喚」。
 *  （AvP の Predator Hunter ─ 身軽で肩キャノン主体のキャラ ─ に相当）
 * ===================================================================== */
(function (BK) {
  const U = BK.U, R = BK.rig, D = U.DEG;

  // 魔術の色
  const WIND = ['#c8f7e6', '#ffffff', '#9fe8d0'];
  const ELEC = ['#ffffff', '#cfe0ff', '#8fb4ff'];
  const FIRE = ['#ffd070', '#ff7a1a', '#fff0b0', '#ff5010'];
  const ELEM = ['#c8f7e6', '#cfe0ff', '#d8b890', '#ff9a40']; // 風・雷・地・火
  const GEM = '#a8f7de';

  // ============================================================ drawing
  /** 頭: 顔・後ろ髪・大きなとんがり帽子（シルエットの要） */
  function head(c, sp, col, sk, pose, opt) {
    const h = sk.headC, r = sp.headR, tint = opt && opt.tint;
    c.save();
    c.translate(h.x, h.y);
    c.rotate((180 - sk.ha) * D);
    // 顔
    R.circle(c, 0, 0, r, col('skin'), col('line'));
    // 後頭部の髪
    c.beginPath(); c.arc(-r * 0.05, 0, r + 0.9, Math.PI * 0.42, Math.PI * 1.62); c.closePath();
    c.fillStyle = col('hair'); c.fill();
    // 前髪（つばの下からのぞく）
    R.poly(c, [-r * 0.3, -r * 1.0, r * 1.02, -r * 0.62, r * 0.98, -r * 0.18, r * 0.78, -r * 0.4, r * 0.6, -r * 0.08, r * 0.4, -r * 0.42, r * 0.12, -r * 0.1, -r * 0.2, -r * 0.5], col('hair'));
    if (!tint) {
      // つばの影
      c.fillStyle = 'rgba(20,10,30,0.3)';
      c.beginPath(); c.ellipse(r * 0.35, -r * 0.42, r * 0.85, r * 0.3, 0, 0, Math.PI * 2); c.fill();
      // 大きな瞳
      c.fillStyle = '#1e1224';
      c.beginPath(); c.ellipse(r * 0.52, r * 0.1, r * 0.15, r * 0.22, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#9ff5dc'; c.fillRect(r * 0.5, r * 0.02, 1, 1);
      // 口
      c.strokeStyle = 'rgba(110,50,50,0.8)'; c.lineWidth = 0.8;
      c.beginPath(); c.moveTo(r * 0.58, r * 0.62); c.lineTo(r * 0.8, r * 0.58); c.stroke();
    }
    // ---- 帽子
    const cape = pose.cape == null ? 0.3 : pose.cape;
    const sw = Math.sin((opt.t || 0) * 0.05) * r * 0.1 - cape * r * 0.28; // 先端のなびき
    const by = -r * 0.5;
    // つば（とても広く、後ろが垂れる）
    const bk = -r * 3.2, bkY = by + r * 0.62 + cape * r * 0.1, fr = r * 3.3, frY = by - r * 0.04;
    c.beginPath();
    c.moveTo(bk, bkY);
    c.quadraticCurveTo(-r * 1.7, by - r * 0.52, 0, by - r * 0.5);
    c.quadraticCurveTo(r * 1.9, by - r * 0.5, fr, frY);
    c.quadraticCurveTo(r * 1.8, by + r * 0.52, 0, by + r * 0.36);
    c.quadraticCurveTo(-r * 1.8, by + r * 0.38, bk, bkY);
    c.closePath();
    c.fillStyle = col('hat'); c.fill();
    c.strokeStyle = col('line'); c.lineWidth = 1.1; c.stroke();
    // つばの裏（暗く）
    c.beginPath();
    c.moveTo(fr, frY);
    c.quadraticCurveTo(r * 1.8, by + r * 0.52, 0, by + r * 0.36);
    c.quadraticCurveTo(-r * 1.8, by + r * 0.38, bk, bkY);
    c.quadraticCurveTo(-r * 1.6, by + r * 0.02, 0, by + r * 0.02);
    c.quadraticCurveTo(r * 1.9, by - r * 0.04, fr, frY);
    c.fillStyle = col('hatDark'); c.fill();
    // 山（先が後ろへ折れる）
    const cb = by - r * 0.36;
    c.beginPath();
    c.moveTo(-r * 1.02, cb);
    c.quadraticCurveTo(-r * 0.8, cb - r * 1.3, -r * 0.8 + sw * 0.4, cb - r * 2.15);
    c.quadraticCurveTo(-r * 1.1 + sw * 0.8, cb - r * 2.6, -r * 2.25 + sw, cb - r * 2.45 - sw * 0.2);
    c.quadraticCurveTo(-r * 0.9 + sw * 0.6, cb - r * 3.2, r * 0.12 + sw * 0.3, cb - r * 2.3);
    c.quadraticCurveTo(r * 0.62, cb - r * 1.2, r * 1.02, cb);
    c.closePath();
    c.fillStyle = col('hat'); c.fill(); c.stroke();
    // 帽子の帯
    R.poly(c, [-r * 1.02, cb + 0.5, -r * 0.93, cb - r * 0.44, r * 0.9, cb - r * 0.44, r * 1.02, cb + 0.5], col('band'), col('line'));
    if (!tint) {
      // リムライト
      c.strokeStyle = col('hatHi'); c.lineWidth = 1;
      c.beginPath(); c.moveTo(-r * 0.3, by - r * 0.48); c.quadraticCurveTo(r * 1.9, by - r * 0.46, r * 3.1, by - r * 0.08); c.stroke();
      c.beginPath(); c.moveTo(r * 0.85, cb - r * 0.5); c.quadraticCurveTo(r * 0.55, cb - r * 1.3, r * 0.05 + sw * 0.3, cb - r * 2.25); c.stroke();
    }
    c.restore();
  }

  /** 短い外套 + 腰まで届く長い黒髪（体の後ろ） */
  function capeAndHair(c, sp, col, sk, pose, opt) {
    R.capeDraw(c, sp, col, sk, pose, opt);
    const hc = sk.headC, r = sp.headR, s = sk.sho, hp = sk.hip;
    const fl = pose.cape == null ? 0.3 : pose.cape;
    const t = (opt.t || 0) * 0.12;
    const wv = Math.sin(t) * 1.6 * (0.5 + fl);
    const back = fl * 9;
    const tipX = s.x - 9 - back + wv, tipY = hp.y + 2 - fl * 7;
    c.beginPath();
    c.moveTo(hc.x - r * 0.2, hc.y - r * 0.7);
    c.quadraticCurveTo(hc.x - r * 1.6, hc.y - r * 0.1, s.x - 9 - back * 0.4, s.y + 5);
    c.quadraticCurveTo(s.x - 12 - back * 0.8 + wv, (s.y + hp.y) / 2 + 2, tipX, tipY);
    c.lineTo(tipX + 3, tipY - 4); c.lineTo(tipX + 6, tipY + 1); c.lineTo(tipX + 8, tipY - 5);
    c.quadraticCurveTo(s.x - 3 - back * 0.3, s.y + 8, hc.x + r * 0.1, hc.y + r * 0.4);
    c.closePath();
    c.fillStyle = col('hair'); c.fill();
    c.strokeStyle = col('line'); c.lineWidth = 1.1; c.stroke();
    if (!opt.tint) {
      c.strokeStyle = col('hairHi'); c.lineWidth = 1;
      c.beginPath(); c.moveTo(hc.x - r * 1.0, hc.y + r * 0.2); c.quadraticCurveTo(s.x - 10 - back * 0.6, s.y + 10, tipX + 2, tipY - 6); c.stroke();
    }
  }

  /** 胴: ローブの身頃・白い襟・首飾り */
  function torso(c, sp, col, sk) {
    const h = sk.hip, s = sk.sho;
    const a = Math.atan2(s.y - h.y, s.x - h.x), ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux;
    const wW = sp.waistW / 2, cW = sp.chestW / 2;
    R.poly(c, [h.x + nx * wW, h.y + ny * wW, s.x + nx * cW, s.y + ny * cW, s.x - nx * cW * 0.9, s.y - ny * cW * 0.9, h.x - nx * wW, h.y - ny * wW], col('body'), col('line'));
    // 白い襟（顔まわりを明るくして見やすく）
    R.poly(c, [
      s.x - nx * 3 + ux * 2, s.y - ny * 3 + uy * 2,
      s.x + nx * (cW + 0.5) + ux * 1, s.y + ny * (cW + 0.5) + uy * 1,
      s.x + nx * (cW + 1.5) - ux * 6, s.y + ny * (cW + 1.5) - uy * 6,
      s.x + nx * 3 - ux * 5, s.y + ny * 3 - uy * 5,
      s.x - nx * 1 - ux * 2, s.y - ny * 1 - uy * 2,
    ], col('collar'), col('line'));
    // 首飾り（精霊の護符）
    const px = s.x + nx * cW * 0.62 - ux * 9, py = s.y + ny * cW * 0.62 - uy * 9;
    R.circle(c, px, py, 1.7, col('gold'), col('line'));
  }

  /** ローブの裾（脚の付け根から扇状に広がり、脚をほぼ隠す）+ 腰紐 */
  function chest(c, sp, col, sk, pose, opt) {
    const h = sk.hip, s = sk.sho;
    const a = Math.atan2(s.y - h.y, s.x - h.x), nx = -Math.sin(a), ny = Math.cos(a);
    const wW = sp.waistW / 2 + 0.5;
    let a0 = Math.min(pose.lF, pose.lB) - 15, a1 = Math.max(pose.lF, pose.lB) + 15;
    if (a1 - a0 < 46) { const m = (a0 + a1) / 2; a0 = m - 23; a1 = m + 23; }
    const L = sp.thigh + sp.shin * 0.58;
    const fl = pose.cape == null ? 0.3 : pose.cape;
    const t = (opt.t || 0) * 0.2;
    const N = 7, hem = [];
    for (let i = 0; i <= N; i++) {
      const ang = (a1 + (a0 - a1) * i / N) * D;
      const rr = L * (i % 2 ? 1.04 : 0.98) + Math.sin(t + i * 1.7) * 0.9 * (0.4 + fl);
      hem.push(h.x + Math.sin(ang) * rr, h.y + Math.cos(ang) * rr);
    }
    const pts = [h.x - nx * wW, h.y - ny * wW - 2, h.x + nx * wW, h.y + ny * wW - 2].concat(hem);
    R.poly(c, pts, col('robe'), col('line'));
    // ひだ
    c.strokeStyle = col('robeDark'); c.lineWidth = 1.2;
    c.beginPath();
    for (const q of [2, 5]) { c.moveTo(h.x + (hem[q * 2] - h.x) * 0.35, h.y + (hem[q * 2 + 1] - h.y) * 0.35); c.lineTo(hem[q * 2], hem[q * 2 + 1]); }
    c.stroke();
    // 裾の縁取り
    c.strokeStyle = col('trim'); c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(hem[0], hem[1]);
    for (let i = 2; i < hem.length; i += 2) c.lineTo(hem[i], hem[i + 1]);
    c.stroke();
    // 腰紐
    R.limb(c, h.x - nx * wW, h.y - ny * wW - 1, h.x + nx * wW, h.y + ny * wW - 1, 3.6, 3.6, col('belt'));
    R.circle(c, h.x + nx * wW * 0.55, h.y + ny * wW * 0.55 + 1.5, 1.5, col('gold'));
  }

  /** 脚: 黒いタイツと短いブーツ（大半はローブに隠れる） */
  function leg(c, sp, col, hip, kn, ft, back) {
    const st = back ? col('stockDark') : col('stock');
    const bt = back ? col('bootDark') : col('boot');
    R.limb(c, hip.x, hip.y, kn.x, kn.y, sp.legW, sp.legW * 0.8, st, col('line'));
    R.limb(c, kn.x, kn.y, ft.x, ft.y, sp.legW * 0.78, sp.legW * 0.62, st, col('line'));
    const bx = U.lerp(kn.x, ft.x, 0.5), by = U.lerp(kn.y, ft.y, 0.5);
    R.limb(c, bx, by, ft.x, ft.y, sp.legW * 0.85, sp.legW * 0.72, bt, col('line'));
    R.poly(c, [ft.x - 3, ft.y - 3, ft.x + 5.5, ft.y - 1.5, ft.x + 6.5, ft.y + 1.5, ft.x - 3, ft.y + 1.5], bt, col('line'));
  }

  /** 腕: 袖口の広がった魔女の袖 */
  function arm(c, sp, col, sh, el, hd, back) {
    const cl = back ? col('sleeveDark') : col('sleeve');
    R.circle(c, hd.x, hd.y, sp.armW * 0.48, back ? col('skinDark') : col('skin'), col('line'));
    R.limb(c, sh.x, sh.y, el.x, el.y, sp.armW, sp.armW * 0.9, cl, col('line'));
    const dx = hd.x - el.x, dy = hd.y - el.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    const cx = el.x + dx * 0.78, cy = el.y + dy * 0.78, w0 = sp.armW * 0.45, w1 = sp.armW * 1.0;
    R.poly(c, [el.x + nx * w0 - ux, el.y + ny * w0 - uy, cx + nx * w1 + ux * 1.5, cy + ny * w1 + uy * 1.5,
      cx - nx * w1 - ux * 0.5, cy - ny * w1 - uy * 0.5, el.x - nx * w0 - ux, el.y - ny * w0 - uy], cl, col('line'));
  }

  /** 杖: 節くれだった木の杖。杖頭の枝が光る精霊石を抱く */
  function staff(c, sp, col, len, pose, opt) {
    const tint = opt && opt.tint;
    R.limb(c, -16, 0, len - 4, 0, 3.5, 2.8, col('wood'), col('line'));
    c.fillStyle = col('woodDark');
    c.fillRect(5, -1.8, 1.8, 3.6); c.fillRect(21, -1.6, 1.8, 3.2); c.fillRect(-10, -1.8, 1.8, 3.6);
    const gx = len + 1;
    // 杖頭の枝（2 本の爪 + 渦巻き）
    c.lineCap = 'round';
    for (let pass = 0; pass < 2; pass++) {
      c.strokeStyle = pass ? col('wood') : col('line'); c.lineWidth = pass ? 2.2 : 3.8;
      c.beginPath();
      c.moveTo(len - 6, 0); c.bezierCurveTo(len - 3, -6.5, len + 5, -7.5, len + 7.5, -2.5);
      c.quadraticCurveTo(len + 9.5, 1.5, len + 6.5, 1.2);
      c.moveTo(len - 6, 0); c.bezierCurveTo(len - 3, 6.5, len + 4, 7.5, len + 6, 4);
      c.stroke();
    }
    c.lineCap = 'butt';
    if (!tint) {
      const a0 = c.globalAlpha;
      const g = pose.glow ? 1 : 0.45 + Math.sin((opt.t || 0) * 0.12) * 0.12;
      c.fillStyle = GEM;
      c.globalAlpha = a0 * (0.14 + 0.16 * g); c.beginPath(); c.arc(gx, 0, 7 + g * 5, 0, Math.PI * 2); c.fill();
      c.globalAlpha = a0 * (0.3 + 0.25 * g); c.beginPath(); c.arc(gx, 0, 4.2 + g, 0, Math.PI * 2); c.fill();
      c.globalAlpha = a0;
    }
    R.circle(c, gx, 0, 2.8, col('gem'), col('line'));
    if (!tint) { c.fillStyle = '#ffffff'; c.fillRect(gx - 1.3, -1.5, 1.3, 1.3); }
  }

  // ============================================================ helpers
  /** 技 mv の f フレーム目の杖頭（精霊石）のワールド座標 */
  function tipAt(h, mv, f) {
    const pose = mv ? R.sample(mv.kf, f, h.stance) : h.stance;
    const sk = R.skeleton(pose, h.spec), sc = h.spec.scale || 1;
    const tx = sk.tip.x + sk.wd.x, ty = sk.tip.y + sk.wd.y;
    return { x: h.x + tx * sc * h.face, y: h.y, z: h.z - ty * sc };
  }
  const tipNow = h => tipAt(h, h.move, h.move ? h.mf : 0);

  function windFx(x, y, z, dir, n) {
    for (let i = 0; i < n; i++) {
      const a = U.rand(-1.2, 1.2);
      BK.fx.add({ type: 'line', x, y: y + U.rand(-3, 3), z: z + U.rand(-5, 5), vx: dir * Math.cos(a) * U.rand(2, 5), vz: Math.sin(a) * U.rand(1, 3), life: U.randi(8, 13), col: U.choose(WIND), size: 1.4, drag: 0.88 });
    }
  }
  function elecFx(x, y, z, n) {

      BK.fx.add({ type: 'line', x, y, z, vx: Math.cos(a) * U.rand(2, 5), vz: Math.sin(a) * U.rand(2, 5), life: U.randi(5, 9), col: U.choose(ELEC), size: 1.5, drag: 0.8 });
    }
    BK.fx.add({ type: 'burst', x, y, z, life: 5, size: 11, col: '#e8f0ff' });
  }
  function fireFx(x, y, z, dir, n) {
    for (let i = 0; i < n; i++) {
      BK.fx.add({ type: 'dot', x, y: y + U.rand(-3, 3), z: z + U.rand(-4, 4), vx: dir * U.rand(0.5, 3), vz: U.rand(0.8, 3), g: -0.02, life: U.randi(12, 22), col: U.choose(FIRE), size: U.rand(1.5, 3), drag: 0.93 });
    }
    BK.fx.add({ type: 'burst', x, y, z, life: 6, size: 13, col: '#ffe0a0' });

  /** 杖から前方へ吹き抜ける突風 */
  function gust(h, s) {

    for (let i = 0; i < Math.round(9 * s); i++) {
      BK.fx.add({ type: 'line', x: x + h.face * U.rand(0, 30), y: h.y + U.rand(-8, 8), z: U.rand(8, 96), vx: h.face * U.rand(5, 10), vz: U.rand(-0.6, 0.8), life: U.randi(9, 15), col: U.choose(WIND), size: U.rand(1.2, 2), drag: 0.9 });
    }

    BK.fx.dust(h.x + h.face * 50, h.y, 4, 'rgba(170,200,190,0.35)');
  }

  /** 炎の柱（サラマンダー）: gx,gy は地面の画面座標 */
  const FLAME = [[1, '#b8280c', 0.75], [0.74, '#ff6a14', 0.9], [0.48, '#ffb440', 0.95], [0.24, '#fff2c0', 1]];
  function drawFlame(c, gx, gy, H, W, k, t, seed) {
    if (k <= 0 || H <= 1) return;
    const a0 = c.globalAlpha;
    c.globalAlpha = a0 * 0.35 * k; c.fillStyle = '#ff5a10';
    c.beginPath(); c.ellipse(gx, gy, W * 1.8, W * 0.42, 0, 0, Math.PI * 2); c.fill();
    for (let L = 0; L < FLAME.length; L++) {
      const s = FLAME[L][0], w = W * s, hh = H * (0.5 + s * 0.5);
      c.globalAlpha = a0 * FLAME[L][2] * k; c.fillStyle = FLAME[L][1];
      c.beginPath(); c.moveTo(gx - w, gy);
      for (let i = 1; i <= 4; i++) {
        const q = i / 5;
        c.lineTo(gx - w * (1 - q * 0.7) + Math.sin(t * 0.55 + i * 1.9 + seed + L) * w * 0.3, gy - hh * q);
      }
      c.lineTo(gx + Math.sin(t * 0.4 + seed) * w * 0.45, gy - hh);
      for (let i = 4; i >= 1; i--) {
        const q = i / 5;
        c.lineTo(gx + w * (1 - q * 0.7) + Math.sin(t * 0.6 + i * 2.3 + seed + L) * w * 0.3, gy - hh * q);
      }
      c.lineTo(gx + w, gy); c.closePath(); c.fill();
    }
    c.globalAlpha = a0;
  }

  // ============================================================ 精霊の火（追尾弾）
  function findTarget(p) {
    const g = BK.game;
    if (!g) return null;
    let best = null, bd = 1e9, prop = null, pd = 1e9;
    const x0 = BK.cam.x - 10, x1 = BK.cam.x + BK.W + 10;
    for (const a of g.actors) {
      if (a.team === 'hero' || a.dead || a.remove || !a.hurtable || a.x < x0 || a.x > x1) continue;
      const dx = a.x - p.x, dy = a.y - p.y, dz = a.z + (a.h || 80) * 0.5 - p.z;
      let d = Math.abs(dx) + Math.abs(dy) * 1.6 + Math.abs(dz) * 0.3;
      if (dx * p.face < -10) d += 180; // 後ろの敵は後回し
      if (a.isProp) { if (d < pd) { pd = d; prop = a; } continue; }
      if (a.team !== 'enemy') continue;
      if (d < bd) { bd = d; best = a; }
    }
    return best || prop;
  }
  function validTarget(a) { return a && !a.dead && !a.remove && a.hurtable; }
  function wispTick(p) {
    if (!validTarget(p.target)) p.target = findTarget(p);
    p.spd = Math.min(p.maxSpd, p.spd + 0.22);
    const a = p.target;
    if (a && p.t > 3) {
      const dx = a.x - p.x, dy = a.y - p.y, dz = a.z + (a.h || 80) * 0.5 - p.z;
      const d = Math.hypot(dx, dy, dz) || 1;
      const turn = Math.min(0.34, 0.09 + p.t * 0.006);
      p.vx += (dx / d * p.spd - p.vx) * turn;
      p.vy += (dy / d * p.spd - p.vy) * turn;
      p.vz += (dz / d * p.spd - p.vz) * turn;
    } else {
      p.vx += (p.face * p.spd - p.vx) * 0.08; p.vy *= 0.9; p.vz *= 0.9;
    }
    if (p.z < 10 && p.vz < 0) p.vz *= 0.4;
    p.tr.push(p.x, p.y, p.z);
    if (p.tr.length > 18) p.tr.splice(0, 3);
    if (p.t % 4 === 0) BK.fx.add({ type: 'dot', x: p.x, y: p.y, z: p.z, vx: U.rand(-0.3, 0.3), vz: U.rand(0.2, 0.7), life: U.randi(10, 16), col: U.choose(['#bff4ff', '#7fd8ff']), size: 1.5 });
  }
  function drawWisp(c, sx, sy, p) {
    const tr = p.tr, n = tr.length / 3;
    c.fillStyle = '#7fd8ff';
    for (let i = 0; i < n; i++) {
      const k = (i + 1) / (n + 1);
      c.globalAlpha = k * 0.4;
      c.beginPath(); c.arc(BK.sx(tr[i * 3]), BK.sy(tr[i * 3 + 1], tr[i * 3 + 2]), 1.5 + k * 3.5, 0, Math.PI * 2); c.fill();
    }
    const fl = Math.sin(p.t * 0.8) * 1.2;
    c.globalAlpha = 0.25; c.beginPath(); c.arc(sx, sy, 10 + fl, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.75; c.fillStyle = '#bff0ff'; c.beginPath(); c.arc(sx, sy, 5, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1; c.fillStyle = '#ffffff'; c.beginPath(); c.arc(sx, sy, 2.5, 0, Math.PI * 2); c.fill();
  }
  function spawnWisp(h) {
    const n = h._wispN = ((h._wispN || 0) + 1) % 3;
    const m = tipAt(h, moves.shoot, 2);
    BK.game.addProjectile(new BK.Projectile({
      x: m.x, y: h.y, z: m.z, vx: h.face * 3.4, vy: [0, -1.1, 1.1][n], vz: [1.2, 2.4, 0.2][n], face: h.face,
      w: 12, h: 14, depth: 12, team: 'hero', owner: h, dmg: 6, kb: 'light', push: 1.2, stop: 2, life: 96,
      sfx: 'hit', fx: 'none', noShadow: false, spd: 3.6, maxSpd: 8.2, tr: [], target: null,
      tick: wispTick, drawFn: drawWisp,
      onHit(p, t) {
        const z = p.z;
        BK.fx.add({ type: 'burst', x: p.x, y: t.y, z, life: 7, size: 15, col: '#dff8ff' });
        for (let i = 0; i < 5; i++) BK.fx.add({ type: 'line', x: p.x, y: t.y, z, vx: U.rand(-3, 3) + p.vx * 0.3, vz: U.rand(-2, 3), life: U.randi(6, 10), col: U.choose(['#ffffff', '#9fe8ff']), size: 1.4, drag: 0.85 });
      },
      onExpire(p) { BK.fx.add({ type: 'burst', x: p.x, y: p.y, z: p.z, life: 5, size: 8, col: '#bff0ff' }); },
    }));
    BK.fx.add({ type: 'burst', x: m.x, y: h.y, z: m.z, life: 5, size: 9, col: '#dff8ff' });
    BK.audio.sfx('fire', { pitch: 2.3, vol: 0.45 });
  }

  // ============================================================ 火の精霊（溜め）
  function flamePillar(h) {
    const x = h.x + h.face * 60;
    BK.fx.shake(4, 10); BK.fx.dust(x, h.y, 5, 'rgba(90,50,30,0.5)');
    BK.fx.ring(x, h.y, 2, 46, '#ffb060', 14);
    BK.game.addProjectile(new BK.Projectile({
      x, y: h.y, z: 56, vx: 0, face: h.face, w: 50, h: 112, depth: 20, team: 'hero', owner: h,
      dmg: 4, kb: 'light', push: 0.6, stop: 1, life: 44, pierce: 999, noShadow: true, sfx: 'fire', fx: 'none', seed: U.rand(0, 9),
      tick(p) {
        if (p.t % 8 === 0) p.hit.clear();
        if (p.t >= 38) { p.kb = 'launch'; p.dmg = 10; p.lift = 9; p.push = 1.8; }
        if (p.t % 2 === 0) BK.fx.add({ type: 'dot', x: p.x + U.rand(-16, 16), y: p.y + U.rand(-5, 5), z: U.rand(10, 90), vx: U.rand(-0.4, 0.4), vz: U.rand(1.5, 3.5), life: U.randi(14, 24), col: U.choose(FIRE), size: U.rand(1.2, 2.4) });
      },
      onHit(p, t) { fireFx(t.x, t.y, t.z + 40, p.face, 3); },
      drawFn(c, sx, sy, p) {
        const age = p.t, k = Math.min(1, age / 3) * Math.min(1, p.life / 10);
        drawFlame(c, sx, sy + p.z, 122 * Math.min(1, age / 5) * (0.92 + 0.08 * Math.sin(age * 0.9)), 21, k, age, p.seed);
      },
    }));
  }

  // ============================================================ 風の結界（必殺）
  function deflect(h, r) {
    const g = BK.game;
    if (!g) return;
    for (const p of g.projectiles) {
      if (p.team === 'hero' || p.remove || p.harmless) continue;
      if (Math.abs(p.x - h.x) < r && Math.abs(p.y - h.y) < 40 && p.z < 150) {
        p.remove = true;
        BK.fx.add({ type: 'burst', x: p.x, y: p.y, z: p.z, life: 7, size: 12, col: '#e8fff6' });
        windFx(p.x, p.y, p.z, U.sign(p.x - h.x), 3);
      }
    }
  }
  function drawBarrier(c, h, front) {
    const f = h.mf, dur = moves.special.dur;
    const k = Math.min(1, f / 4) * Math.min(1, (dur - f) / 8);
    if (k <= 0) return;
    const sx = BK.sx(h.x), gy = BK.sy(h.y, 0), sy = BK.sy(h.y, h.z) - 46;
    const rx = 66 + Math.min(1, f / 6) * 30, ry = rx * 0.7;
    const a0 = c.globalAlpha;
    c.save();
    if (!front) {
      c.globalAlpha = a0 * 0.13 * k; c.fillStyle = '#9ff5dc';
      c.beginPath(); c.ellipse(sx, sy, rx, ry, 0, 0, Math.PI * 2); c.fill();
      c.globalAlpha = a0 * 0.55 * k; c.strokeStyle = '#c8f7e6'; c.lineWidth = 1.5;
      c.beginPath(); c.ellipse(sx, gy, rx, rx * 0.22, 0, 0, Math.PI * 2); c.stroke();
    }
    // 回転する風の帯: 手前半分は前面、奥半分は背面に描く
    c.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const st = (BK.frame * (0.32 + i * 0.03) + i * 1.9) % (Math.PI * 2);
      const isFront = Math.sin(st + 0.7) > 0;
      if (isFront !== front) continue;
      const yy = sy + (i - 2) * 15, sc = 1 - Math.abs(i - 2) * 0.14;
      c.globalAlpha = a0 * k * (front ? 0.85 : 0.4);
      c.strokeStyle = i % 2 ? '#ffffff' : '#c8f7e6'; c.lineWidth = front ? 2.4 : 1.6;
      c.beginPath(); c.ellipse(sx, yy, rx * sc, ry * 0.26, (i - 2) * 0.08, st, st + 1.5); c.stroke();
    }
    c.restore();
  }

  // ============================================================ 四大精霊召喚（覚醒）
  function drawMagicCircle(c, C) {
    const age = C.max - C.life, k = Math.min(1, age / 10) * Math.min(1, C.life / 20);
    if (k <= 0) return;
    const r = 30 + Math.min(1, age / 18) * 56;
    const rot = BK.frame * 0.03;
    c.save();
    c.translate(BK.sx(C.x), BK.sy(C.y, 0)); c.scale(1, 0.34);
    const a0 = c.globalAlpha;
    c.globalAlpha = a0 * 0.14 * k; c.fillStyle = '#9ff5dc';
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = a0 * 0.9 * k; c.strokeStyle = '#c8fbe8'; c.lineWidth = 2.4;
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
    c.lineWidth = 1.4;
    c.beginPath(); c.arc(0, 0, r * 0.8, 0, Math.PI * 2); c.stroke();
    c.beginPath(); // 五芒星
    for (let i = 0; i <= 5; i++) {
      const a = rot + i * Math.PI * 4 / 5 - Math.PI / 2;
      if (i) c.lineTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8); else c.moveTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8);
    }
    c.stroke();
    c.beginPath(); // ルーン
    for (let i = 0; i < 20; i++) {
      const a = -rot * 0.7 + i * Math.PI / 10;
      c.moveTo(Math.cos(a) * r * 0.84, Math.sin(a) * r * 0.84); c.lineTo(Math.cos(a + 0.13) * r * 0.96, Math.sin(a + 0.13) * r * 0.96);
    }
    c.stroke();
    // 四方の精霊の印
    for (let i = 0; i < 4; i++) {
      const a = rot * 1.5 + i * Math.PI / 2;
      c.globalAlpha = a0 * k; c.fillStyle = ELEM[i];
      c.beginPath(); c.arc(Math.cos(a) * r, Math.sin(a) * r, 4.5, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }
  function drawOrbs(c, h, front) {
    const k = Math.min(1, h.mf / 14);
    const r = 24 + k * 24, cz = h.z + 48 + k * 12;
    const a0 = c.globalAlpha;
    for (let i = 0; i < 4; i++) {
      const th = BK.frame * 0.09 + i * Math.PI / 2, s = Math.sin(th);
      if ((s > 0) !== front) continue;
      const sx = BK.sx(h.x + Math.cos(th) * r), sy = BK.sy(h.y + s * 10, cz + Math.sin(th * 2 + i) * 6);

<script>/* js/enemies.js */
'use strict';
/* =====================================================================
 *  enemies.js ── 敵キャラクター共通処理 + 基本の雑魚「亡者兵」
 *
 *  BK.registerEnemy(def) で登録。def = {
 *    id, name, hp, w, h, weight, speed, speedY, score, range(近接の間合い),
 *    spec, stance, walkOpt, palettes: {名前: {色...}},     // rig を使う場合
 *    draw(c, e),                                          // rig を使わない場合（自前描画）
 *    moves: { name: { ...Move定義, ai: {min, max, w, cd} } },  // ai: 使用距離(x)と重み・硬直
 *    think(e, game),       // 独自AI（省略時は近接AI）
 *    update(e, game),      // 毎フレームの追加処理
 *    grabbable, downAfter, metal, bloodCol, drop: 'common'|null|'itemId',
 *    boss, poise,          // ボス: 大技でしかダウンしない耐久値
 *    entry: 'walk'|'drop'|'rise'|'jump',
 *    onDie(e, game), onSpawn(e, game),
 *  }
 *  出現: BK.game.spawnEnemy(id, {x, y, side:'L'|'R', entry, palette, delay})
 * ===================================================================== */
(function (BK) {
  const U = BK.U, R = BK.rig, C = BK.combat;

  BK.registerEnemy = function (def) {
    if (def.spec) def.spec = R.makeSpec(def.spec);
    def.stance = R.merge(R.NEUTRAL, def.stance || {});
    BK.enemyTypes[def.id] = def;
    return def;
  };

  class Enemy extends BK.Actor {
    constructor(def, x, y, opt) {
      opt = opt || {};
      const diff = BK.game ? BK.game.diffMul : 1;
      const hp = Math.round(def.hp * (def.boss ? 1 : diff));
      super({
        team: 'enemy', x, y, hp, maxHp: hp, w: def.w || 26, h: def.h || 86, weight: def.weight || 1,
        shadowR: def.shadowR || 16, scoreValue: def.score || 200, bloodCol: def.bloodCol || '#7a0a12', metal: !!def.metal,
        downAfter: def.downAfter || 99, boss: !!def.boss, armor: !!def.armor,
      });
      this.def = def; this.name = def.name;
      if (def.flying) this.flying = true;
      if (def.hover) this.hover = true;
      this.spec = def.spec; this.stance = def.stance;
      this.colors = def.palettes && opt.palette ? Object.assign({}, def.spec.colors, def.palettes[opt.palette]) : null;
      this.grabbable = def.grabbable !== false && !def.boss;
      this.ai = { mode: 'wait', t: 0, cd: U.randi(30, 70), waitDist: U.rand(95, 150), slotY: U.rand(-30, 30), side: 0 };
      this.hasToken = false;
      this.walkPh = U.rand(0, 6);
      this.poise = def.poise || 0;
      this.entry = opt.entry || def.entry || 'walk';
      this.entering = 0;
      this.opt = opt;
      this.getupInvul = 12;
      if (this.entry === 'rise') { this.entering = 44; this.intangible = true; }
      if (this.entry === 'drop') { this.z = 240; this.state = 'air'; }
      if (this.entry === 'jump') { this.z = 0.1; this.vz = 8; this.state = 'air'; }
      if (this.entry === 'walk') this.entering = 1;
    }
    requestToken() {
      if (this.hasToken) return true;
      if (C.tokens < C.maxTokens) { C.tokens++; this.hasToken = true; return true; }
      return false;
    }
    releaseToken() { if (this.hasToken) { C.tokens = Math.max(0, C.tokens - 1); this.hasToken = false; } }

    // -------------------------------------------------------- helpers
    get hero() { return BK.game && BK.game.hero; }
    /** 画面外から歩いて入ってくる途中なら移動して true を返す（独自AI用） */
    walkIn() {
      if (!this.entering) return false;
      const inside = this.x > BK.cam.x + 24 && this.x < BK.cam.x + BK.W - 24;
      if (inside) { this.entering = 0; return false; }
      this.moveToward(U.clamp(this.x, BK.cam.x + 50, BK.cam.x + BK.W - 50), this.y, this.def.speed || 1.2);
      if (this.vx) this.face = U.sign(this.vx);
      return true;
    }
    faceHero() { const h = this.hero; if (h) this.face = U.sign(h.x - this.x); }
    moveToward(tx, ty, spd, spdY) {
      spd = spd == null ? this.def.speed || 1.2 : spd;
      spdY = spdY == null ? this.def.speedY || spd * 0.7 : spdY;
      const ddx = tx - this.x, ddy = ty - this.y;
      this.vx = Math.abs(ddx) > 3 ? U.sign(ddx) * Math.min(spd, Math.abs(ddx)) : 0;
      this.vy = Math.abs(ddy) > 2 ? U.sign(ddy) * Math.min(spdY, Math.abs(ddy)) : 0;
      if (this.vx || this.vy) { this.state = 'walk'; this.walkPh += 0.16 * (spd / 1.2); }
      else this.state = 'idle';
    }
    /** 距離に合う技を重み付きで選ぶ */
    pickMove(adx, ady) {
      const list = [];
      for (const k in this.def.moves) {
        const m = this.def.moves[k];
        if (!m.ai) continue;
        if (adx < (m.ai.min || 0) || adx > (m.ai.max || 60)) continue;
        if (ady > (m.ai.dy || 8)) continue;
        if (m.ai.cond && !m.ai.cond(this)) continue;
        list.push([m.ai.w || 1, m]);
      }
      return list.length ? U.weighted(list) : null;
    }
    attack(m) {
      this.faceHero();
      this.startMove(m);
      this.ai.mode = 'recover';
      this.ai.cd = (m.ai && m.ai.cd) || U.randi(30, 60);
    }
    /** 主人公を掴む（悪霊の張り付き・拷問官の掴みなど）。成功で true */
    grabHero(h, o) {
      if (!h || h.dead || !h.hurtable || h.state === 'grabbed' || h.grabbing || h.z > 30) return false;
      if (h.move) h.endMove();
      h.state = 'grabbed'; h.grabbedBy = this; h.escape = 0; h.vx = 0; h.vy = 0;
      this.grabbing = h;
      this.escapeNeed = (o && o.escapeNeed) || 10;
      BK.audio.sfx('grab');
      return true;
    }
    releaseHero() {
      const h = this.grabbing;
      this.grabbing = null;
      if (h && h.grabbedBy === this) { h.grabbedBy = null; if (h.state === 'grabbed') h.state = 'idle'; }
    }
    /** 掴んでいる主人公に直接ダメージ（のけぞらせない） */
    drainHero(dmg) {
      const h = this.grabbing;
      if (!h || h.dead) return;
      if (BK.god) { h.flash = 4; return; }
      h.hp -= dmg; h.flash = 4;
      if (h.onDamaged) h.onDamaged(dmg, this, {});
      if (h.hp <= 0) { h.hp = 0; this.releaseHero(); h.die(this, { dmg }, this.face); }
    }
    /** 敵弾を撃つ */
    shoot(o) {
      const p = new BK.Projectile(Object.assign({ team: 'enemy', owner: this, x: this.x + this.face * 24, y: this.y, z: this.z + 50, vx: this.face * 5 }, o));
      BK.game.addProjectile(p);
      return p;
    }

    // -------------------------------------------------------- update
    update(game) {
      this.animT++;
      if (this.flash > 0) this.flash--;
      if (this.invul > 0) this.invul--;
      if (this.grabbedBy) { this.state = 'grabbed'; return; }
      if (this.state === 'grabbed') { this.state = 'idle'; }
      if (this.entering > 0 && this.entry === 'rise') {
        this.entering--;
        if (this.entering % 6 === 0) BK.fx.dust(this.x, this.y, 2, 'rgba(70,60,50,0.5)');
        if (this.entering === 0) this.intangible = false;
        return;
      }
      if (this.def.update) this.def.update(this, game);
      if (this.remove) return;
      if (this.updateReactions()) { this.physics(); return; }
      if (this.move) { this.updateMove(); this.physics(); return; }
      if (this.state === 'air') { if (this.def.flying || this.flying) this.state = 'idle'; else { this.physics(); return; } }
      if (this.def.think) this.def.think(this, game);
      else this.thinkMelee(game);
      this.physics();
      // 画面外に逃げすぎない
      if (!this.entering && !this.def.freeRoam) this.x = U.clamp(this.x, BK.cam.x - 50, BK.cam.x + BK.W + 50);
      // 仲間とぴったり重ならないよう、少しずつ離れる（2体が1体に見えるのを防ぐ）
      if (!this.boss && this.z <= 0 && game) for (const o of game.actors) {
        if (o === this || o.team !== 'enemy' || o.dead || o.boss || o.isProp || o.z > 0) continue;
        const ddx = this.x - o.x, ddy = this.y - o.y;
        if (Math.abs(ddx) < 14 && Math.abs(ddy) < 6) {
          const s = (ddx || (this.uid > o.uid ? 1 : -1)) > 0 ? 1 : -1;
          this.x += s * 0.7;
          this.y = U.clamp(this.y + ((ddy || s) > 0 ? 0.35 : -0.35), 0, BK.DEPTH);
        }
      }
    }
    land() { if (this.state === 'air') { this.state = 'idle'; BK.fx.dust(this.x, this.y, 5); BK.audio.sfx('land', { pitch: 0.8 }); } }

    /** 標準の近接AI: 間合いを取りつつ、攻撃権（トークン）を得たら襲いかかる */
    thinkMelee(game) {
      const h = game.hero, ai = this.ai;
      ai.t++;
      if (!h || h.dead) { this.moveToward(this.x + this.face * 10, this.y, 0.4); this.releaseToken(); return; }
      const dx = h.x - this.x, dy = h.y - this.y, adx = Math.abs(dx), ady = Math.abs(dy);
      const side = U.sign(this.x - h.x) || 1;
      // 入場中は画面内まで歩く
      if (this.entering) {
        const inside = this.x > BK.cam.x + 20 && this.x < BK.cam.x + BK.W - 20;
        if (inside) this.entering = 0;
        else { this.moveToward(U.clamp(this.x, BK.cam.x + 40, BK.cam.x + BK.W - 40), this.y, this.def.speed || 1.2); this.face = U.sign(this.vx || dx); return; }
      }
      if (ai.cd > 0) ai.cd--;
      const range = this.def.range || 44;
      if (h.state === 'down' || h.state === 'getup' || h.invul > 60) {
        // 起き上がりを囲むように待機
        if (ai.mode === 'attack') { ai.mode = 'wait'; this.releaseToken(); }
      }
      switch (ai.mode) {
        case 'attack': {
          // 画面外からは攻撃しない: 回り込み先が画面外なら反対側から攻める
          const lo = BK.cam.x + 24, hi = BK.cam.x + BK.W - 24;
          let tx = h.x + side * range * 0.9;
          if (tx < lo || tx > hi) tx = h.x - side * range * 0.9;
          const ty = h.y;
          const inView = this.x > lo && this.x < hi;
          const m = inView ? this.pickMove(adx, ady) : null;
          if (m && ady <= ((m.ai && m.ai.dy) || 8)) { this.attack(m); return; }
          this.moveToward(tx, ty, (this.def.speed || 1.2) * 1.15);
          this.face = U.sign(dx);
          if (ai.t > 200) { ai.mode = 'wait'; ai.t = 0; this.releaseToken(); ai.cd = 40; }
          break;
        }
        case 'recover':
          this.state = 'idle';
          if (ai.cd <= 0) { this.releaseToken(); ai.mode = 'wait'; ai.cd = U.randi(20, 70); ai.t = 0; ai.waitDist = U.rand(85, 150); ai.slotY = U.rand(-34, 34); }
          else if (ai.cd > 10 && U.chance(0.02)) { this.vx = side * 1.5; }
          break;
        default: { // wait
          let tx = h.x + side * ai.waitDist; // 見えない位置では待機しない
          if (tx < BK.cam.x + 24 || tx > BK.cam.x + BK.W - 24) tx = U.clamp(h.x - side * ai.waitDist, BK.cam.x + 24, BK.cam.x + BK.W - 24);
          const ty = U.clamp(h.y + ai.slotY, 4, BK.DEPTH - 4);
          const far = Math.abs(this.x - tx) > 8 || Math.abs(this.y - ty) > 6;

          else { this.vx = 0; this.vy = 0; this.state = 'idle'; }
          this.face = U.sign(dx);
          if (ai.cd <= 0 && this.requestToken()) { ai.mode = 'attack'; ai.t = 0; }
          else if (ai.cd <= 0) ai.cd = U.randi(10, 30);

      if (!h || h.dead) { this.state = 'idle'; return; }

        const inside = this.x > BK.cam.x + 20 && this.x < BK.cam.x + BK.W - 20;
        if (inside) this.entering = 0;
        else { this.moveToward(U.clamp(this.x, BK.cam.x + 40, BK.cam.x + BK.W - 40), this.y); this.face = U.sign(this.vx || 1); return; }
      }
      if (ai.cd > 0) ai.cd--;

      this.moveToward(tx, h.y, (this.def.speed || 1) * 0.9);
      this.face = U.sign(dx);
      if (ai.cd <= 0 && Math.abs(h.y - this.y) < 10 && adx > 60 && o.move) { this.attack(o.move); ai.cd = o.cd || 90; }
      else if (adx < 50 && this.def.moves && this.def.moves.melee && ai.cd <= 0) this.attack(this.def.moves.melee);
    }

    // -------------------------------------------------------- damage
    takeHit(src, h, dir) {
      if (this.boss && this.def.poise) {
        const heavy = h.kb === 'down' || h.kb === 'launch' || h.kb === 'spin';
        if (heavy) {
          this.poise -= h.dmg;
          if (this.poise > 0) h = Object.assign({}, h, { kb: 'heavy', push: (h.push || 3) * 0.4 });

        } else h = Object.assign({}, h, { push: (h.push == null ? 2 : h.push) * 0.4, stun: 8 });
      }
      const ok = super.takeHit(src, h, dir);
      if (ok && src && src.isHero && BK.game) BK.game.lastHitEnemy = this;
      return ok;
    }
    onDie(src) {
      this.releaseToken();
      if (this.def.onDie) this.def.onDie(this, BK.game);
      if (BK.game) BK.game.onEnemyKilled(this, src);
      BK.audio.sfx(this.def.dieSfx || 'growl', { pitch: this.def.diePitch || 1 });
    }

    // -------------------------------------------------------- drawing
    currentPose() {
      const st = this.stance, d = this.def;
      if (this.move) return R.sample(this.move.kf, this.mf, st);
      const rp = this.reactionPose(st);
      if (rp) return rp;
      if (this.state === 'grabbed') return R.merge(st, { lean: -12, head: -15, aF: 40 + Math.sin(this.animT * 0.7) * 20, eF: 50, aB: 30, eB: 40, lF: 10, kF: 10, lB: -10, kB: 10 });
      if (this.state === 'air' || this.z > 0) return R.merge(st, { lF: 40, kF: 70, lB: -10, kB: 60, aF: 120, aB: -60 });
      if (this.state === 'walk') return R.walk(st, this.walkPh, d.walkOpt);
      return R.idle(st, this.animT + this.uid * 13);
    }
    draw(c) {
      if (this.state === 'dead' && this.st > 20 && (this.st >> 2) % 2 && !this.def.customDeath) return; // 点滅して消える
      if (this.def.draw) { this.def.draw(c, this); return; }
      if (this.entry === 'rise' && this.entering > 0) {
        // 地面から這い出る
        const k = this.entering / 44;
        const sy = BK.sy(this.y, 0);

    }
  }
  BK.Enemy = Enemy;

  // ================================================================
  //  亡者兵（基本の雑魚）: 蝕の夜に彷徨う、腐り果てた兵士の亡骸
  // ================================================================

    }

  }

    R.poly(c, [0, -4, 2, -4, 2, 4, 0, 4], col('metalDark'));

  }
  BK.registerEnemy({
    id: 'undead', name: '亡者兵', hp: 34, w: 24, h: 84, weight: 0.95, speed: 1.05, speedY: 0.75, score: 300, range: 46,
    entry: 'walk', drop: 'common', bloodCol: '#3a1a14', dieSfx: 'growl',
    spec: {
      scale: 1, thigh: 21, shin: 21, torso: 28, headR: 7.5, upper: 16, fore: 15, legW: 8, armW: 6.5, waistW: 12, chestW: 18, weaponLen: 38,
      colors: { skin: '#7d8a78', hair: '#222', cloth: '#3c3a33', clothDark: '#2a2924', sleeve: '#4a463c', body: '#4a4538', belt: '#2a2016', boot: '#2e2a24', bootDark: '#201d19', glove: '#6e7a68', gloveDark: '#56604f', armor: '#5a4a3a', metal: '#8a7c6c', metalDark: '#4a4038', grip: '#2a1a10' },
      draw: { head: undeadHead, weapon: rustySword },
    },
    palettes: {
      bone: { skin: '#c8c0a8', glove: '#b8b098', gloveDark: '#908870', armor: '#6a6a70', body: '#3a3a3e' },
      blood: { skin: '#8a5a50', armor: '#6a2020', body: '#4a1a1a', cloth: '#3a1a1a' },
    },
    stance: { lean: 18, head: 10, aF: 30, eF: 40, aB: 20, eB: 30, lF: 14, kF: 16, lB: -12, kB: 14, wAbs: 70 },
    walkOpt: { stride: 18, arm: 8 },
    moves: {
      chop: {
        dur: 44, trail: [18, 23], ai: { min: 20, max: 62, w: 3, cd: 50 },
        kf: [[0, {}], [16, { aF: 170, eF: 20, wAbs: 200, lean: -6, head: -5 }], [21, { aF: 70, eF: 0, wAbs: 70, lean: 26 }, 'snap'], [34, { aF: 60, eF: 0, wAbs: 60, lean: 26 }], [44, {}]],
        hits: [{ f: [19, 22], x: [8, 62], z: [10, 95], d: 14, dmg: 9, kb: 'light', push: 2.5 }],

        kf: [[0, {}], [14, { aF: -20, eF: 60, wAbs: 95, lean: -4, lF: 5, kF: 20, lB: -20, kB: 10 }], [20, { aF: 90, eF: 0, wAbs: 92, lean: 24, lF: 40, kF: 30, lB: -30, kB: 5 }, 'snap'], [34, { aF: 88, eF: 0, wAbs: 90, lean: 24, lF: 40, kF: 30, lB: -30, kB: 5 }], [46, {}]],

<script>/* js/enemies_roster.js */
'use strict';
/* =====================================================================
 *  enemies_roster.js ── 雑魚の一覧（基本の亡者兵 undead は enemies.js の見本）
 *
 *   spirit     悪霊            張り付いて生気を吸う（AvP のフェイスハガー）。レバガチャで振りほどく
 *   soldier    兵士            palette: captain（赤い羽根飾り・手強い）/ jailer（革頭巾と棍棒）
 *                              / knight（聖鉄鎖騎士団）/ kushan（クシャーンの曲刀兵）
 *   crossbow   弩兵            距離を取って弩を撃つ。近づくと蹴り。palette: knight
 *   hound      魔犬            四つ足・自前描画。噛みつき突進・飛びかかり
 *   troll      トロール        巨体・掴めない。叩きつけ（アーマー）・裏拳の薙ぎ払い・踏みつけ
 *   leaper     猿型使徒        跳ね回り、空中から襲いかかる（AvP のエイリアン・ウォリアー）
 *   moth       蛾の妖精もどき  空中を舞い、急降下と鱗粉
 *   inquisitor 拷問官          棘付き棍棒・掴み（締め上げて投げ捨てる）
 *   apostle    異形の使徒      palette: flesh / bone / horn。爪の三連撃・酸の唾・角の突進
 * ===================================================================== */
(function (BK) {
  const U = BK.U, R = BK.rig, D = U.DEG;

  // ================================================================ 共通ヘルパー
  /** 被弾フラッシュ中（白く光らせる） */
  const flashing = e => e.flash > 0 && (e.flash & 2);
  /** パレット名（colors.kind）。被弾フラッシュ中でも形が変わらないよう opt.colors を直接見る */
  const kindOf = (sp, opt) => ((opt && opt.colors) || sp.colors).kind || '';
  /** 主人公を掴める状態か（空中・無敵・ダウン中は不可） */
  const canGrab = h => !!h && !h.dead && h.hurtable && h.state !== 'grabbed' && !h.grabbing && h.z <= 24;
  /** 円のサブパス（直前の点と線で繋がらないように moveTo してから描く） */
  function dot(c, x, y, r) { c.moveTo(x + r, y); c.arc(x, y, r, 0, Math.PI * 2); }
  /** 胴の上の点: t = 0 腰 / 1 肩、k = 前(+) / 後(-) へのずれ */

  }
  /** 頭のローカル座標へ（+x = 顔の向き、-y = 上）。呼び出し側で c.restore() */
  function headSpace(c, sk) { c.save(); c.translate(sk.headC.x, sk.headC.y); c.rotate((180 - sk.ha) * D); }
  /** 飛行型: 目標高度へ寄せる（毎フレーム vz を与えて physics の重力を打ち消す） */
  function hover(e, tz, k) { e.vz = (tz - e.z) * (k || 0.08); }
  /** 空中での減速（physics の摩擦は接地中しか効かない） */
  function drag(e, k) {
    e.vx *= k; e.vy *= k;
    if (Math.abs(e.vx) < 0.04) e.vx = 0;
    if (Math.abs(e.vy) < 0.04) e.vy = 0;
  }
  /** 跳躍の初速: (tx, ty) に着地するように */
  function leapTo(e, tx, ty, vz, maxVx) {
    const t = 2 * vz / BK.GRAV + 1;
    e.z = 0.5; e.vz = vz;

  }
  /** 跳躍技の着地判定: 空中フェーズ（from 以降）で接地したら landF フレームへ飛ばして着地硬直を再生 */
  function landing(e, f, from, landF) {
    if (f > from && f < landF && e.z <= 0 && e.vz <= 0) {

    }
