<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0708">
<title>BERSERK 黒い剣士 ─蝕の夜─</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=UnifrakturMaguntia&display=swap">
<style>
/* BERSERK 黒い剣士 ─蝕の夜─  (fan-made belt action) */
:root {
  --bk-bg: #0b0708;
  --bk-ink: #e9dccb;
  --bk-blood: #b3121b;
  --bk-ember: #e2672b;
  --bk-iron: #8d8479;
  --bk-font-jp: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bk-bg); overflow: hidden; }
body {
  color: var(--bk-ink);
  font-family: var(--bk-font-jp);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overscroll-behavior: none;
}
#bk-root {
  position: fixed; inset: 0;
  background: var(--bk-bg);
  display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
#bk-canvas { display: block; background: #000; touch-action: none; }

/* ── touch controls ── */
#bk-touch { position: fixed; inset: 0; pointer-events: auto; touch-action: none; z-index: 5; }
#bk-touch[hidden] { display: none !important; }
.bk-btn {
  position: absolute;
  width: var(--sz); height: var(--sz);
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 38%, rgba(70, 30, 26, .34), rgba(12, 6, 6, .30) 70%);
  border: 2px solid rgba(190, 120, 90, .45);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset, 0 2px 10px rgba(0,0,0,.5);
  color: rgba(245, 225, 205, .9);
  pointer-events: none; /* hit-testing is done in JS for multi-touch sliding */
  transition: transform .05s, background .05s;
}
.bk-btn b { font-weight: 800; font-size: calc(var(--sz) * .40); line-height: 1; text-shadow: 0 0 6px rgba(0,0,0,.9); }
.bk-btn i { font-style: normal; font-size: calc(var(--sz) * .15); opacity: .75; margin-top: 2px; letter-spacing: .05em; }
.bk-btn.on {
  transform: scale(.92);
  background: radial-gradient(circle at 50% 40%, rgba(200, 40, 30, .8), rgba(60, 8, 8, .75) 72%);
  border-color: rgba(255, 170, 120, .9);
}
#bk-b-atk { --sz: min(82px, 22vh); right: calc(var(--sar) + min(100px, 26vh)); bottom: calc(var(--sab) + min(14px, 3.5vh)); }
#bk-b-jmp { --sz: min(70px, 19vh); right: calc(var(--sar) + min(16px, 4vh)); bottom: calc(var(--sab) + min(68px, 18vh)); }
#bk-b-sht { --sz: min(58px, 15.5vh); right: calc(var(--sar) + min(112px, 29vh)); bottom: calc(var(--sab) + min(112px, 29vh)); }
#bk-b-sp  { --sz: min(52px, 14vh); right: calc(var(--sar) + min(26px, 7vh)); bottom: calc(var(--sab) + min(152px, 40vh)); }
#bk-b-awk { --sz: min(50px, 13.5vh); right: calc(var(--sar) + min(180px, 47vh)); bottom: calc(var(--sab) + min(150px, 39vh)); opacity: .22; }
#bk-b-awk.ready { opacity: 1; border-color: rgba(255, 60, 40, 1); animation: bk-pulse .6s ease-in-out infinite alternate; }
#bk-b-pause { --sz: min(38px, 10vh); right: calc(var(--sar) + 8px); top: calc(var(--sat) + var(--cv-top, 0px) + min(58px, 15vh)); opacity: .7; }
#bk-b-pause b { font-size: calc(var(--sz) * .32); letter-spacing: -.1em; }
.bk-btn.bk-hide { display: none; }
@keyframes bk-pulse { from { box-shadow: 0 0 4px rgba(255, 40, 20, .6); } to { box-shadow: 0 0 22px rgba(255, 40, 20, 1); } }

#bk-stick {
  position: absolute; width: 128px; height: 128px; margin: -64px 0 0 -64px;
  border-radius: 50%;
  border: 2px solid rgba(190, 120, 90, .45);
  background: radial-gradient(circle, rgba(40, 18, 16, .35), rgba(0,0,0,.25));
  pointer-events: none;
}
#bk-stick[hidden] { display: none !important; }
#bk-knob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, rgba(230, 190, 160, .85), rgba(110, 50, 40, .85));
  box-shadow: 0 0 10px rgba(0,0,0,.6);
}

/* ── rotate hint ── */
#bk-rotate {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: rgba(8, 4, 5, .92);
  padding: 16px;
}
#bk-rotate[hidden] { display: none !important; }
.bk-rot-card { text-align: center; max-width: 320px; }
.bk-rot-card p { font-size: 18px; line-height: 1.7; margin: 18px 0; }
.bk-rot-card strong { color: #ff6b4a; }
.bk-rot-icon {
  width: 64px; height: 104px; margin: 0 auto;
  border: 3px solid var(--bk-ink); border-radius: 10px;
  animation: bk-rot 1.6s ease-in-out infinite;
}
@keyframes bk-rot { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
#bk-rot-dismiss {
  font: inherit; font-size: 15px; color: var(--bk-ink);
  background: transparent; border: 1px solid var(--bk-iron); border-radius: 4px;
  padding: 10px 18px; touch-action: manipulation;
}
#bk-rot-dismiss:focus-visible { outline: 2px solid var(--bk-ember); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .bk-rot-icon, #bk-b-awk.ready { animation: none; }
}

</style>
</head>
<body>
<!--@BUILD-BODY-START-->
<div id="bk-root">
  <canvas id="bk-canvas" aria-label="BERSERK ベルトアクションゲーム画面"></canvas>

  <div id="bk-touch" hidden>
    <div id="bk-stick" hidden><div id="bk-knob"></div></div>
    <div class="bk-btn" data-btn="atk" id="bk-b-atk"><b>斬</b><i>攻撃</i></div>
    <div class="bk-btn" data-btn="jmp" id="bk-b-jmp"><b>跳</b><i>ジャンプ</i></div>
    <div class="bk-btn" data-btn="sht" id="bk-b-sht"><b>射</b><i>射撃</i></div>
    <div class="bk-btn bk-sm" data-btn="sp" id="bk-b-sp"><b>必</b><i>必殺</i></div>
    <div class="bk-btn bk-sm bk-awk" data-btn="awk" id="bk-b-awk"><b>狂</b><i>覚醒</i></div>
    <div class="bk-btn bk-xs" data-btn="pause" id="bk-b-pause"><b>&#10074;&#10074;</b></div>
  </div>

  <div id="bk-rotate" hidden>
    <div class="bk-rot-card">
      <div class="bk-rot-icon"></div>
      <p>スマホを<strong>横向き</strong>にして遊んでください</p>
      <button type="button" id="bk-rot-dismiss">このまま遊ぶ</button>
    </div>
  </div>
</div>
<!--@BUILD-BODY-END-->

<!--@BUILD-SCRIPTS-START-->
<script>/* js/core.js */
'use strict';
/* =====================================================================
 *  BERSERK 黒い剣士 ─蝕の夜─   core.js
 *  名前空間 / 定数 / ユーティリティ / 画面スケーリング / 入力 / エフェクト /
 *  シーン管理 / メインループ
 *  すべてのファイルは window.BK にぶら下がる（ES Module 不使用 → file:// でも動く）
 * ===================================================================== */
window.BK = window.BK || {};
(function (BK) {
  // ---------------------------------------------------------------- utils
  const U = BK.U = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    rand: (a, b) => a + Math.random() * (b - a),
    randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    chance: p => Math.random() < p,
    choose: arr => arr[Math.floor(Math.random() * arr.length)],
    sign: v => (v < 0 ? -1 : 1),
    approach: (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t)),
    DEG: Math.PI / 180,
    ease: {
      linear: t => t,
      in: t => t * t,
      out: t => 1 - (1 - t) * (1 - t),
      inOut: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
      back: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
      snap: t => 1 - Math.pow(1 - t, 4),
    },
    /** 重み付き抽選: [[weight, value], ...] */
    weighted(list) {
      let sum = 0; for (const [w] of list) sum += w;
      let r = Math.random() * sum;
      for (const [w, v] of list) { r -= w; if (r <= 0) return v; }
      return list[list.length - 1][1];
    },
    /** シード付き乱数（背景の手続き生成用。毎回同じ形になる） */
    srand(seed) {
      let s = (seed >>> 0) || 1;
      return function () { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; };
    },
    /** 16進色 → rgba 文字列 */
    rgba(hex, a) {
      const h = hex.replace('#', '');
      const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    },
    /** 2色を混ぜる (#rrggbb) */
    mix(c1, c2, t) {
      const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
      const r = Math.round(U.lerp((a >> 16) & 255, (b >> 16) & 255, t));
      const g = Math.round(U.lerp((a >> 8) & 255, (b >> 8) & 255, t));
      const bl = Math.round(U.lerp(a & 255, b & 255, t));
      return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
    },
  };

  // ------------------------------------------------------------ constants
  BK.H = 360;            // 論理解像度の高さ（固定）
  BK.W = 640;            // 論理解像度の幅（端末のアスペクト比で 560〜800 に可変）
  BK.FLOOR_TOP = 212;    // 奥行き y=0 の足元が描かれる画面 Y
  BK.DEPTH = 118;        // ベルトの奥行き（y は 0〜DEPTH）
  BK.GRAV = 0.55;        // 重力（z 方向）
  BK.FONT_JP = "'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif";
  BK.FONT_GOTH = "'UnifrakturMaguntia','Old English Text MT','Times New Roman',serif";
  BK.frame = 0;          // 固定ステップの通し番号

  // 登録テーブル（各ファイルがここへ定義を追加する）
  BK.heroes = BK.heroes || {};        // id -> hero def
  BK.heroOrder = BK.heroOrder || [];  // キャラ選択画面での並び
  BK.enemyTypes = BK.enemyTypes || {};// id -> enemy / boss def
  BK.stages = BK.stages || [];        // index 0..5 -> stage def
  BK.scenes = BK.scenes || {};

  // ---------------------------------------------------------------- canvas
  const cv = document.getElementById('bk-canvas');
  const ctx = cv.getContext('2d', { alpha: false });
  BK.canvas = cv; BK.ctx = ctx;
  BK.renderScale = 1; BK.cssScale = 1;

  // ノッチ等のセーフエリアを除いた幅を測るための要素（キャンバスをセーフエリア内に収める）
  const safeProbe = document.createElement('div');
  safeProbe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;top:0;bottom:0;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px)';
  document.body.appendChild(safeProbe);
  function resize() {
    const vw = safeProbe.getBoundingClientRect().width || window.innerWidth, vh = window.innerHeight;
    const aspect = vw / vh;
    BK.W = Math.round(U.clamp(BK.H * aspect, 560, 800));
    const cssScale = Math.min(vw / BK.W, vh / BK.H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // バッキングストアが大きすぎるとスマホで重いので幅 1600px 程度に抑える
    const rs = Math.min(cssScale * dpr, 1600 / BK.W, BK.qualityCap || 9);
    cv.style.width = Math.round(BK.W * cssScale) + 'px';
    cv.style.height = Math.round(BK.H * cssScale) + 'px';
    cv.width = Math.round(BK.W * rs);
    cv.height = Math.round(BK.H * rs);
    BK.renderScale = cv.width / BK.W;
    BK.cssScale = cssScale;
    BK.needsRender = true; // バッキングストア再確保で絵が消えるため
    document.documentElement.style.setProperty('--cv-top', Math.max(0, (vh - BK.H * cssScale) / 2) + 'px');
    updateRotateHint();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  // 縦持ちヒント
  let rotateDismissed = false;
  const rotEl = document.getElementById('bk-rotate');
  function updateRotateHint() {
    if (!rotEl) return;
    const portrait = window.innerHeight > window.innerWidth * 1.05;
    const show = !!(BK.input && BK.input.touchMode && portrait && !rotateDismissed);
    if (show && rotEl.hidden && BK.scene && BK.scene.onHide) BK.scene.onHide(); // プレイ中なら自動ポーズ
    rotEl.hidden = !show;
  }
  BK.rotateHintShown = () => !!rotEl && !rotEl.hidden;
  BK.updateRotateHint = updateRotateHint;
  const rotBtn = document.getElementById('bk-rot-dismiss');
  if (rotBtn) rotBtn.addEventListener('click', () => { rotateDismissed = true; updateRotateHint(); });

  // ------------------------------------------------------------ save data
  BK.save = {
    get(key, def) {
      try { const v = window.localStorage.getItem('bk_berserk_' + key); return v == null ? def : JSON.parse(v); }
      catch (e) { return def; }
    },
    set(key, val) {
      try { window.localStorage.setItem('bk_berserk_' + key, JSON.stringify(val)); } catch (e) { /* storage unavailable */ }
    },
  };

  // ------------------------------------------------------------------ input
  const BTNS = ['atk', 'jmp', 'sht', 'sp', 'awk', 'start', 'pause', 'up', 'down', 'left', 'right'];
  const I = BK.input = {
    src: { kb: {}, touch: {}, pad: {} },
    held: {}, pressed: {}, released: {},
    _pc: {}, _rc: {},
    ax: 0, ay: 0,          // タッチ / パッドのアナログ値 (-1..1)
    dirX: 0, dirY: 0,      // 8方向に量子化した方向
    prevDirX: 0, prevDirY: 0,
    heldFrames: {},        // ボタンを押し続けているフレーム数
    dashTap: 0,            // このフレームでダッシュ入力（→→ / ←←）が成立したら ±1
    duFrame: -999,         // ↓↑ コマンドが成立したフレーム
    stickFull: 0,          // スティックを端まで倒し続けたフレーム数（オートダッシュ用）
    touchMode: false,
    tap: null,             // メニュー用: 論理座標でのタップ {x,y}
    anyKey: false,
    _xRel: { '1': -999, '-1': -999 }, _xPressAt: { '1': -999, '-1': -999 },
    _downAt: -999,
  };
  for (const b of BTNS) { I.held[b] = false; I.pressed[b] = false; I.released[b] = false; I._pc[b] = 0; I._rc[b] = 0; I.heldFrames[b] = 0; }

  I.press = function (src, b) {
    if (!I.src[src][b]) { I.src[src][b] = true; I._pc[b]++; I.anyKey = true; }
  };
  I.release = function (src, b) {
    if (I.src[src][b]) { I.src[src][b] = false; I._rc[b]++; }
  };
  I.releaseAll = function (src) { for (const b of BTNS) I.release(src, b); if (src !== 'kb') { I.ax = 0; I.ay = 0; } };

  /** 固定ステップの頭で1回呼ぶ */
  I.step = function () {
    pollGamepad();
    for (const b of BTNS) {
      const h = !!(I.src.kb[b] || I.src.touch[b] || I.src.pad[b]);
      I.pressed[b] = I._pc[b] > 0;
      I.released[b] = I._rc[b] > 0 && !h;
      I.held[b] = h || I.pressed[b];  // 1フレーム未満の短いタップも「押された」扱いにする
      I._pc[b] = 0; I._rc[b] = 0;
      I.heldFrames[b] = I.held[b] ? I.heldFrames[b] + 1 : 0;
    }
    // 方向（デジタル入力 + アナログ）
    let dx = (I.held.right ? 1 : 0) - (I.held.left ? 1 : 0);
    let dy = (I.held.down ? 1 : 0) - (I.held.up ? 1 : 0);
    const mag = Math.hypot(I.ax, I.ay);
    if (mag > 0.3) {
      // ヒステリシス: 倒している方向は少し戻しただけでは解除しない（指の震えで誤ダッシュしない）
      const hx = I.dirX !== 0 && Math.sign(I.ax) === I.dirX ? 0.24 : 0.38;
      const hy = I.dirY !== 0 && Math.sign(I.ay) === I.dirY ? 0.28 : 0.42;
      dx = Math.abs(I.ax) > hx ? Math.sign(I.ax) : 0;
      dy = Math.abs(I.ay) > hy ? Math.sign(I.ay) : 0;
    }
    I.prevDirX = I.dirX; I.prevDirY = I.dirY;
    I.dirX = dx; I.dirY = dy;
    const f = BK.frame;
    // ダッシュ（同方向2連打）
    I.dashTap = 0;
    if (I.prevDirX !== 0 && I.dirX !== I.prevDirX) I._xRel[I.prevDirX] = f;
    if (I.dirX !== 0 && I.prevDirX !== I.dirX) {
      if (f - I._xRel[I.dirX] <= 14 && f - I._xPressAt[I.dirX] <= 26) I.dashTap = I.dirX;
      I._xPressAt[I.dirX] = f;
    }
    if (!I.dashTap && I._dashCarry) I.dashTap = I._dashCarry;
    I._dashCarry = 0;
    // オートダッシュ用: スティックを横に倒し切っている時間
    const full = (mag > 0.88 && Math.abs(I.ax) > 0.8) || (I.src.kb.run && dx !== 0);
    I.stickFull = full ? I.stickFull + 1 : 0;
    // ↓↑ コマンド
    if (I.dirY === 1) I._downAt = f;
    if (I.dirY === -1 && I.prevDirY !== -1 && f - I._downAt <= 18) I.duFrame = f;
  };
  I.consumeTap = function () { const t = I.tap; I.tap = null; return t; };
  /** ヒットストップ等でゲームが止まったフレームの押下を、次のフレームへ持ち越す */
  I.defer = function () {
    for (const b of ['atk', 'jmp', 'sht', 'sp', 'awk']) if (I.pressed[b]) I._pc[b]++;
    if (I.dashTap) I._dashCarry = I.dashTap;
  };
  /** メニューでの決定 (攻撃 / ジャンプ / Enter / タップ) */
  I.confirm = function () { return I.pressed.atk || I.pressed.start || I.pressed.jmp; };

  // keyboard
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyZ: 'atk', KeyJ: 'atk', KeyX: 'jmp', KeyK: 'jmp', Space: 'jmp',
    KeyC: 'sht', KeyL: 'sht', KeyV: 'sp', KeyU: 'sp', KeyB: 'awk', KeyI: 'awk',
    Enter: 'start', Escape: 'pause', KeyP: 'pause', ShiftLeft: 'run', ShiftRight: 'run',
  };
  window.addEventListener('keydown', e => {
    const b = KEYMAP[e.code];
    if (e.code === 'KeyM' && !e.repeat) { BK.audio && BK.audio.toggleMute && BK.audio.toggleMute(); }
    if (!b) return;
    e.preventDefault();
    if (b === 'run') { I.src.kb.run = true; return; }
    I.press('kb', b);
    BK.audio && BK.audio.unlock && BK.audio.unlock();
  });
  window.addEventListener('keyup', e => {
    const b = KEYMAP[e.code];
    if (!b) return;
    if (b === 'run') { I.src.kb.run = false; return; }
    I.release('kb', b);
  });
  window.addEventListener('blur', () => { I.releaseAll('kb'); I.releaseAll('touch'); if (BK.scene && BK.scene.onHide) BK.scene.onHide(); });

  // gamepad (standard mapping)
  const PADMAP = { 0: 'jmp', 1: 'sht', 2: 'atk', 3: 'sp', 5: 'awk', 7: 'awk', 9: 'start', 8: 'pause', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
  let padSeen = false;
  function pollGamepad() {
    if (!navigator.getGamepads) return;
    let pads;
    try { pads = navigator.getGamepads(); } catch (e) { return; }
    const p = pads && Array.from(pads).find(x => x && x.connected);
    if (!p) { if (padSeen) { I.releaseAll('pad'); padSeen = false; } return; }
    padSeen = true;
    for (const k in PADMAP) {
      const bt = p.buttons[k];
      if (!bt) continue;
      if (bt.pressed) I.press('pad', PADMAP[k]); else I.release('pad', PADMAP[k]);
    }
    const x = p.axes[0] || 0, y = p.axes[1] || 0;
    if (Math.hypot(x, y) > 0.3) { I.ax = x; I.ay = y; } else if (!touchStick.id && touchStick.id !== 0) { I.ax = 0; I.ay = 0; }
  }

  // ---------------------------------------------------------- touch input
  const touchEl = document.getElementById('bk-touch');
  const stickEl = document.getElementById('bk-stick');
  const knobEl = document.getElementById('bk-knob');
  const btnEls = touchEl ? Array.from(touchEl.querySelectorAll('.bk-btn')) : [];
  const touchStick = { id: null, ox: 0, oy: 0 };
  const ptrBtn = new Map();     // pointerId -> button name
  const STICK_R = 52;

  function markTouch() {
    if (!I.touchMode) { I.touchMode = true; updateRotateHint(); }
  }
  function btnAt(cx, cy) {
    let best = null, bestD = 1e9;
    for (const el of btnEls) {
      if (el.classList.contains('bk-hide') || el.offsetParent === null) continue;
      const r = el.getBoundingClientRect();
      const mx = r.left + r.width / 2, my = r.top + r.height / 2, rad = r.width / 2;
      const d = Math.hypot(cx - mx, cy - my) / rad;
      if (d < 1.35 && d < bestD) { bestD = d; best = el; }
    }
    return best;
  }
  function setBtnPtr(id, el) {
    const prev = ptrBtn.get(id);
    const name = el ? el.dataset.btn : null;
    if (prev === name) return;
    if (prev) {
      // 他の指が同じボタンを押していなければ離す
      let still = false;
      for (const [pid, n] of ptrBtn) if (pid !== id && n === prev) still = true;
      if (!still) { I.release('touch', prev); const pe = document.querySelector(`.bk-btn[data-btn="${prev}"]`); pe && pe.classList.remove('on'); }
    }
    if (name) {
      ptrBtn.set(id, name);
      I.press('touch', name);
      el.classList.add('on');
      if (navigator.vibrate && BK.save.get('vibe', true)) { try { navigator.vibrate(8); } catch (e) { /* ignore */ } }
    } else ptrBtn.delete(id);
  }
  function updateStick(cx, cy) {
    let dx = cx - touchStick.ox, dy = cy - touchStick.oy;
    const d = Math.hypot(dx, dy);
    // 指が大きく離れたらスティック中心を追従させる（フローティング）
    if (d > STICK_R * 1.6) {
      const k = (d - STICK_R * 1.6) / d;
      touchStick.ox += dx * k; touchStick.oy += dy * k;
      stickEl.style.left = touchStick.ox + 'px'; stickEl.style.top = touchStick.oy + 'px';
      dx = cx - touchStick.ox; dy = cy - touchStick.oy;
    }
    const dd = Math.hypot(dx, dy);
    const cl = Math.min(dd, STICK_R);
    const nx = dd > 0 ? dx / dd : 0, ny = dd > 0 ? dy / dd : 0;
    knobEl.style.transform = `translate(${nx * cl}px, ${ny * cl}px)`;
    const m = Math.min(1, dd / STICK_R);
    I.ax = nx * m; I.ay = ny * m;
  }
  if (touchEl) {
    touchEl.addEventListener('pointerdown', e => {
      e.preventDefault();
      markTouch();
      BK.audio && BK.audio.unlock && BK.audio.unlock();
      try { touchEl.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
      const el = btnAt(e.clientX, e.clientY);
      if (el) { setBtnPtr(e.pointerId, el); return; }
      if (e.clientX < window.innerWidth * 0.5 && touchStick.id === null) {
        touchStick.id = e.pointerId; touchStick.ox = e.clientX; touchStick.oy = e.clientY;
        stickEl.hidden = false;
        stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px';
        knobEl.style.transform = 'translate(0px,0px)';
        I.ax = 0; I.ay = 0;
      }
    }, { passive: false });
    touchEl.addEventListener('pointermove', e => {
      e.preventDefault();
      if (e.pointerId === touchStick.id) { updateStick(e.clientX, e.clientY); return; }
      if (ptrBtn.has(e.pointerId)) {
        const el = btnAt(e.clientX, e.clientY);
        if (el && el.dataset.btn !== 'pause') setBtnPtr(e.pointerId, el);
      }
    }, { passive: false });
    const up = e => {
      if (e.pointerId === touchStick.id) {
        touchStick.id = null; stickEl.hidden = true; I.ax = 0; I.ay = 0;
      }

    };
    touchEl.addEventListener('pointerup', up);
    touchEl.addEventListener('pointercancel', up);
    touchEl.addEventListener('lostpointercapture', up);

  /** プレイ中だけタッチ操作UIを出す */
  BK.setTouchUI = function (on) {
    if (!touchEl) return;
    const show = on && I.touchMode;
    if (touchEl.hidden === !show) return;
    touchEl.hidden = !show;
    if (!show) {
      I.releaseAll('touch'); ptrBtn.clear(); touchStick.id = null; if (stickEl) stickEl.hidden = true;
      btnEls.forEach(b => b.classList.remove('on'));
    }
  };
  BK.setAwakenReady = function (ready, visible) {
    const el = document.getElementById('bk-b-awk');
    if (!el) return;
    el.classList.toggle('ready', !!ready);
    el.classList.toggle('bk-hide', visible === false);
  };

  // canvas tap (menus)
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (e.pointerType === 'touch' || e.pointerType === 'pen') markTouch();
    BK.audio && BK.audio.unlock && BK.audio.unlock();
    const r = cv.getBoundingClientRect();
    I.tap = { x: (e.clientX - r.left) / r.width * BK.W, y: (e.clientY - r.top) / r.height * BK.H };
    I.anyKey = true;
  }, { passive: false });
  // タッチの pointerdown をユーザー操作と数えないブラウザがある → 指を離した時にも音声を解錠
  ['pointerup', 'touchend', 'click'].forEach(t => window.addEventListener(t, () => { if (BK.audio && BK.audio.unlock) BK.audio.unlock(); }, { capture: true, passive: true }));
  // iOS のダブルタップ拡大・ピンチ拡大を抑止
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || e.target === cv || touchEl.contains(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) I.touchMode = true;

  // --------------------------------------------------------------- camera
  BK.cam = { x: 0, y: 0, sx: 0, sy: 0 };
  /** ワールド座標 → 画面座標 */
  BK.sx = x => x - BK.cam.x + BK.cam.sx;
  BK.sy = (y, z) => BK.FLOOR_TOP + y - (z || 0) + BK.cam.sy;

  // --------------------------------------------------------------- effects
  const fx = BK.fx = {
    parts: [], texts: [],
    shakeT: 0, shakeMag: 0, flashT: 0, flashMax: 1, flashCol: '#ffffff',
    hitstop: 0, slowmo: 0, darken: 0,
    screenFx: [],  // 暗転より手前に描く画面効果 (c) => {}  ※使い終わったら取り除くこと
    reset() { this.parts.length = 0; this.texts.length = 0; this.shakeT = 0; this.flashT = 0; this.hitstop = 0; this.slowmo = 0; this.darken = 0; this.screenFx.length = 0; },
    add(p) {
      if (this.parts.length > 420) { const i = this.parts.findIndex(q => !q.keep); this.parts.splice(i < 0 ? 0 : i, 1); }
      p.life = p.life || 30; p.max = p.life; p.vx = p.vx || 0; p.vy = p.vy || 0; p.vz = p.vz || 0;
      p.g = p.g == null ? 0 : p.g; p.drag = p.drag == null ? 1 : p.drag; p.z = p.z || 0;
      this.parts.push(p); return p;
    },
    shake(mag, t) { if (mag >= this.shakeMag || this.shakeT <= 0) { this.shakeMag = mag; this.shakeT = t || 10; } },
    flash(col, t) { this.flashCol = col || '#fff'; this.flashT = this.flashMax = t || 6; },
    stop(n) { this.hitstop = Math.max(this.hitstop, n); },
    /** 斬撃ヒットの火花 + 血しぶき */
    hitSpark(x, y, z, dir, power, col) {
      const n = 6 + Math.round(power * 4);
      for (let i = 0; i < n; i++) {
        const a = U.rand(-1.1, 1.1) + (dir < 0 ? Math.PI : 0);
        const s = U.rand(2, 5 + power * 3);
        this.add({ type: 'line', x, y, z, vx: Math.cos(a) * s, vz: Math.sin(a) * s * 0.8 + 1, life: U.randi(8, 14), col: i % 3 === 0 ? '#fff4d0' : '#ffb347', size: U.rand(1.2, 2.2), drag: 0.86 });
      }
      this.add({ type: 'burst', x, y, z, life: 7, size: 14 + power * 10, col: '#fff' });
      this.blood(x, y, z, dir, 4 + Math.round(power * 5), col);
    },
    blood(x, y, z, dir, n, col) {
      col = col || '#9e0d14';
      for (let i = 0; i < n; i++) {
        this.add({ type: 'dot', x, y: y + U.rand(-3, 3), z, vx: dir * U.rand(0.5, 4.5), vz: U.rand(1, 5.5), g: 0.32, life: U.randi(22, 40), col, size: U.rand(1.5, 3.6), drag: 0.97, splat: true });
      }
    },
    dust(x, y, n, col) {
      for (let i = 0; i < (n || 6); i++) {
        this.add({ type: 'smoke', x: x + U.rand(-8, 8), y, z: 2, vx: U.rand(-1.4, 1.4), vz: U.rand(0.2, 1.2), life: U.randi(18, 30), size: U.rand(5, 10), col: col || 'rgba(120,105,95,0.45)', drag: 0.92 });
      }
    },
    ring(x, y, z, r, col, life) { this.add({ type: 'ring', x, y, z, size: r, life: life || 16, col: col || '#fff' }); },
    glow(x, y, z, r, col, life) { this.add({ type: 'glow', x, y, z, size: r, life: life || 12, col: col || '#ff6030' }); },
    ember(x, y, z) { this.add({ type: 'dot', x, y, z, vx: U.rand(-0.6, 0.6), vz: U.rand(0.6, 1.6), life: U.randi(30, 60), col: U.choose(['#ff9a3c', '#ff5a1f', '#ffd27a']), size: U.rand(1, 2) }); },
    text(x, y, z, str, col, size) { this.texts.push({ x, y, z, str, col: col || '#fff', size: size || 14, life: 50, max: 50 }); },
    update() {
      if (this.shakeT > 0) {
        this.shakeT--;
        const m = this.shakeMag * (this.shakeT / 10 + 0.3);
        BK.cam.sx = U.rand(-m, m); BK.cam.sy = U.rand(-m, m) * 0.7;
      } else { BK.cam.sx = 0; BK.cam.sy = 0; }
      if (this.flashT > 0) this.flashT--;
      const ps = this.parts;
      for (let i = ps.length - 1; i >= 0; i--) {
        const p = ps[i];
        p.x += p.vx; p.y += p.vy; p.z += p.vz;
        p.vx *= p.drag; p.vy *= p.drag; p.vz = p.vz * p.drag - p.g;
        if (p.g && p.z < 0) {
          p.z = 0; p.vz = 0; p.vx *= 0.3;
          if (p.splat && !p.landed) { p.landed = true; p.life = Math.min(p.life, 90); p.max = Math.max(p.max, p.life); }
        }
        if (--p.life <= 0) ps.splice(i, 1);
      }
      for (let i = this.texts.length - 1; i >= 0; i--) { const t = this.texts[i]; t.z += 0.5; if (--t.life <= 0) this.texts.splice(i, 1); }
    },
    draw(c) {
      for (const p of this.parts) {
        const sx = BK.sx(p.x), sy = BK.sy(p.y, p.z);
        if (sx < -60 || sx > BK.W + 60) continue;
        const k = p.life / p.max;
        switch (p.type) {
          case 'dot':
            c.globalAlpha = p.landed ? Math.min(1, k * 2) * 0.8 : Math.min(1, k * 1.5);
            c.fillStyle = p.col;
            if (p.landed) { c.beginPath(); c.ellipse(sx, sy, p.size * 1.3, p.size * 0.5, 0, 0, 7); c.fill(); }

            break;
          case 'line':
            c.globalAlpha = k; c.strokeStyle = p.col; c.lineWidth = p.size;
            c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx - p.vx * 2.2, sy + p.vz * 2.2); c.stroke();
            break;
          case 'smoke':
            c.globalAlpha = k * 0.9; c.fillStyle = p.col;
            c.beginPath(); c.arc(sx, sy, p.size * (1.6 - k * 0.6), 0, 7); c.fill();
            break;
          case 'ring':
            c.globalAlpha = k; c.strokeStyle = p.col; c.lineWidth = 3 * k + 1;
            c.beginPath(); c.ellipse(sx, sy, p.size * (1.2 - k), p.size * (1.2 - k) * 0.45, 0, 0, 7); c.stroke();
            break;
          case 'burst': {
            c.globalAlpha = k; c.fillStyle = p.col;
            const r = p.size * (1.2 - k * 0.6);
            c.beginPath();
            for (let i = 0; i < 8; i++) {
              const a = i / 8 * Math.PI * 2 + p.max, rr = i % 2 ? r * 0.35 : r;
              c.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr * 0.8);
            }
            c.closePath(); c.fill();
            break;
          }
          case 'glow': {
            c.globalAlpha = k * 0.85;
            const g = c.createRadialGradient(sx, sy, 0, sx, sy, p.size);
            g.addColorStop(0, p.col); g.addColorStop(1, 'rgba(0,0,0,0)');
            c.fillStyle = g; c.beginPath(); c.arc(sx, sy, p.size, 0, 7); c.fill();
            break;
          }
          case 'custom':
            c.globalAlpha = 1; p.draw(c, sx, sy, k, p);
            break;
        }
      }
      c.globalAlpha = 1;
      for (const t of this.texts) {
        const k = t.life / t.max;
        BK.text(c, t.str, BK.sx(t.x), BK.sy(t.y, t.z), { size: t.size, color: t.col, alpha: Math.min(1, k * 2), stroke: '#000', weight: 800 });
      }
    },
    drawScreen(c) {
      if (this.darken > 0) { c.fillStyle = `rgba(0,0,0,${this.darken})`; c.fillRect(0, 0, BK.W, BK.H); }
      if (this.flashT > 0) {
        c.globalAlpha = (this.flashT / this.flashMax) * 0.75; c.fillStyle = this.flashCol;
        c.fillRect(0, 0, BK.W, BK.H); c.globalAlpha = 1;
      }
    },
  };

  // ----------------------------------------------------------- text helper
  BK.font = (size, weight, fam) => `${weight || 600} ${size}px ${fam || BK.FONT_JP}`;
  /**
   * テキスト描画ヘルパー
   * opt: size, weight, fam, color, align, base, stroke, strokeW, alpha, shadow, maxW
   */
  BK.text = function (c, str, x, y, opt) {
    opt = opt || {};
    c.save();
    c.font = BK.font(opt.size || 14, opt.weight, opt.fam);
    c.textAlign = opt.align || 'center';
    c.textBaseline = opt.base || 'middle';
    if (opt.alpha != null) c.globalAlpha = opt.alpha;

    c.fillText(str, x, y, opt.maxW);
    c.restore();
  };

  // ---------------------------------------------------------------- scenes
  BK.sceneName = '';
  BK.scene = null;
  BK.sceneT = 0;
  BK.setScene = function (name, arg) {
    if (BK.scene && BK.scene.exit) BK.scene.exit();
    BK.sceneName = name;
    BK.scene = BK.scenes[name];
    BK.sceneT = 0;
    if (!BK.scene) throw new Error('unknown scene ' + name);
    if (BK.scene.enter) BK.scene.enter(arg);
  };

  // ------------------------------------------------------------ main loop
  const STEP = 1000 / 60;
  let acc = 0, last = 0, running = false;
  BK.errors = [];
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    if (BK.halt) { last = now; acc = 0; return; } // テスト用: 自動進行を止めて BK.stepOnce() で1フレームずつ進める
    let dt = now - last; last = now;
    // 自動画質: プレイ中に重いフレーム(24ms超)が続いたら内部解像度を2割下げる（最低 1.0）
    if (BK.sceneName === 'play' && !(BK.turbo > 1) && !document.hidden && dt < 250) {
      BK._slow = dt > 24 ? (BK._slow || 0) + 1 : Math.max(0, (BK._slow || 0) - 2);

    }
    if (dt > 250) dt = STEP; // タブ復帰時などの大ジャンプは捨てる
    acc += dt;
    let n = 0;
    if (BK.turbo > 1) acc = STEP * BK.turbo; // テスト用の早送り
    try {
      while (acc >= STEP && n < Math.max(4, BK.turbo || 0)) {
        I.step();
        BK.frame++; BK.sceneT++;
        if (BK.scene && BK.scene.update) BK.scene.update();
        if (BK.audio && BK.audio.tick) BK.audio.tick();

    ctx.setTransform(BK.renderScale, 0, 0, BK.renderScale, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  BK.stepOnce = function (noDraw) {
    I.step();
    BK.frame++; BK.sceneT++;
    if (BK.scene && BK.scene.update) BK.scene.update();
    if (!noDraw) render();
  };
  BK.start = function (firstScene) {
    if (running) return;
    running = true;
    resize();
    BK.setScene(firstScene || 'title');
    requestAnimationFrame(frame);
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      I.releaseAll('kb'); I.releaseAll('touch');
      if (BK.scene && BK.scene.onHide) BK.scene.onHide();
      BK.audio && BK.audio.suspend && BK.audio.suspend();
    } else {
      BK.audio && BK.audio.resume && BK.audio.resume();
    }
  });
  resize();
})(window.BK);

<script>/* js/audio.js */
'use strict';
/* =====================================================================
 *  audio.js  ── WebAudio だけで鳴らす効果音シンセ + ステップシーケンサ BGM
 *  外部音源ファイルは一切使わない（すべてその場で合成）
 *
 *  効果音:  BK.audio.sfx('hit', {vol:1, pitch:1})
 *  BGM   :  BK.audio.playSong('stage1') / BK.audio.stopSong()
 *  曲定義 :  BK.audio.songs[id] = { bpm, steps(1小節の分割数=16), bars, tracks:[{inst, vol, oct(半音単位の移調: 12=1オクターブ), seq:'記法文字列' | array}] }
 *           記法: 1トークン=1ステップ, 空白区切り。 '.'=休符  '-'=前の音を伸ばす  'x'=打楽器ヒット
 *                 音名 'c3' 'd#3' 'eb2'（オクターブ付き）、和音 'c3+eb3+g3'、強弱 'c3!'(強) 'c3?'(弱)
 *           '|' は見やすさのための小節区切り（無視される）
 * ===================================================================== */
(function (BK) {
  const U = BK.U;
  const A = BK.audio = {
    ctx: null, master: null, sfxBus: null, musBus: null, comp: null,
    muted: BK.save.get('muted', false),
    musicVol: 0.42, sfxVol: 0.9,
    songs: {}, song: null, songId: null,
    _noise: null, _lastSfx: {},
  };

  A.unlock = function () {
    try {
      if (!A.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        A.ctx = new AC();
        A.comp = A.ctx.createDynamicsCompressor();
        A.comp.threshold.value = -14; A.comp.knee.value = 10; A.comp.ratio.value = 5;
        A.comp.attack.value = 0.003; A.comp.release.value = 0.2;
        A.master = A.ctx.createGain();
        A.master.gain.value = A.muted ? 0 : 0.8;
        A.sfxBus = A.ctx.createGain(); A.sfxBus.gain.value = A.sfxVol;
        A.musBus = A.ctx.createGain(); A.musBus.gain.value = A.musicVol;
        A.sfxBus.connect(A.comp); A.musBus.connect(A.comp);
        A.comp.connect(A.master); A.master.connect(A.ctx.destination);
        // ノイズバッファ（2秒）
        const len = A.ctx.sampleRate * 2;
        A._noise = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
        const d = A._noise.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        // 簡易リバーブ（インパルス応答を合成）
        A.verb = A.ctx.createConvolver();
        const rl = Math.floor(A.ctx.sampleRate * 2.2);
        const ir = A.ctx.createBuffer(2, rl, A.ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const b = ir.getChannelData(ch);
          for (let i = 0; i < rl; i++) b[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.6);
        }
        A.verb.buffer = ir;
        A.verbSend = A.ctx.createGain(); A.verbSend.gain.value = 0.28;
        A.verbSend.connect(A.verb); A.verb.connect(A.comp);
        if (A._pendingSong) { const s = A._pendingSong; A._pendingSong = null; A.playSong(s); }
      }
      if (A.ctx.state !== 'running' && A.ctx.state !== 'closed') A.ctx.resume(); // iOS の 'interrupted' からも復帰
    } catch (e) { /* audio unsupported */ }
  };
  A.suspend = function () { try { A.ctx && A.ctx.suspend(); } catch (e) { /* ignore */ } };
  A.resume = function () { try { A.ctx && A.ctx.resume(); } catch (e) { /* ignore */ } };
  A.toggleMute = function () {
    A.muted = !A.muted; BK.save.set('muted', A.muted);
    if (A.master) A.master.gain.setTargetAtTime(A.muted ? 0 : 0.8, A.ctx.currentTime, 0.05);
    return A.muted;
  };
  A.ready = () => !!(A.ctx && A.ctx.state === 'running');

  // ------------------------------------------------------------ primitives
  /** オシレーター1発 */
  A.tone = function (o) {
    const c = A.ctx, t = o.t != null ? o.t : c.currentTime;
    const osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, o.f0), t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + (o.slide || o.dur));
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain();
    const at = o.attack || 0.004, dur = o.dur || 0.2, v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + at);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.filter) {
      const f = c.createBiquadFilter();
      f.type = o.filter; f.frequency.value = o.ff || 1200; f.Q.value = o.q || 1;
      if (o.ff1) f.frequency.exponentialRampToValueAtTime(o.ff1, t + dur);
      osc.connect(f); node = f;
    }
    if (o.vib) {
      const l = c.createOscillator(), lg = c.createGain();
      l.frequency.value = o.vib; lg.gain.value = o.vibAmt || 8;
      l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05);
    }
    node.connect(g); g.connect(o.dest || A.sfxBus);
    if (o.verb) g.connect(A.verbSend);
    osc.start(t); osc.stop(t + dur + 0.05);
    return osc;
  };
  /** ノイズ1発（フィルタ付き） */
  A.noise = function (o) {
    const c = A.ctx, t = o.t != null ? o.t : c.currentTime;
    const src = c.createBufferSource();
    src.buffer = A._noise;
    src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const f = c.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.f0 || 1000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + (o.dur || 0.2));
    f.Q.value = o.q || 1;
    const g = c.createGain();
    const at = o.attack || 0.002, dur = o.dur || 0.2, v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + at);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || A.sfxBus);
    if (o.verb) g.connect(A.verbSend);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
  };

  // ---------------------------------------------------------------- SFX
  // 各関数は (p = pitch倍率, v = 音量倍率) を受け取る
  const S = A.sfxDefs = {
    swing(p, v) { A.noise({ filter: 'bandpass', f0: 2600 * p, f1: 500 * p, q: 1.4, dur: 0.14, vol: 0.32 * v }); },
    swingHeavy(p, v) {
      A.noise({ filter: 'bandpass', f0: 1400 * p, f1: 180 * p, q: 1.1, dur: 0.3, vol: 0.45 * v, attack: 0.03 });
      A.tone({ type: 'sine', f0: 110 * p, f1: 50, dur: 0.3, vol: 0.2 * v, attack: 0.03 });
    },
    hit(p, v) {
      A.noise({ filter: 'lowpass', f0: 2600 * p, f1: 300, dur: 0.12, vol: 0.5 * v });
      A.tone({ type: 'sine', f0: 160 * p, f1: 45, dur: 0.14, vol: 0.55 * v });
    },
    hitHeavy(p, v) {
      A.noise({ filter: 'lowpass', f0: 3200 * p, f1: 120, dur: 0.3, vol: 0.7 * v });
      A.tone({ type: 'triangle', f0: 120 * p, f1: 32, dur: 0.34, vol: 0.8 * v });
      A.noise({ filter: 'bandpass', f0: 900 * p, q: 3, dur: 0.12, vol: 0.4 * v });
    },
    slash(p, v) { // 肉を断つ
      A.noise({ filter: 'bandpass', f0: 1800 * p, f1: 700, q: 2, dur: 0.16, vol: 0.5 * v });
      A.tone({ type: 'sine', f0: 140 * p, f1: 50, dur: 0.16, vol: 0.5 * v });
    },
    clang(p, v) {
      [1, 2.76, 5.4, 8.93].forEach((m, i) => A.tone({ type: 'sine', f0: 520 * p * m, dur: 0.5 - i * 0.08, vol: 0.18 * v / (i + 1), verb: true }));
      A.noise({ filter: 'highpass', f0: 3000, dur: 0.06, vol: 0.35 * v });
    },
    shoot(p, v) { // ボウガン
      A.tone({ type: 'triangle', f0: 900 * p, f1: 260, dur: 0.1, vol: 0.35 * v });
      A.noise({ filter: 'highpass', f0: 2500, dur: 0.04, vol: 0.3 * v });
    },
    knife(p, v) { A.noise({ filter: 'bandpass', f0: 4200 * p, f1: 1600, q: 3, dur: 0.1, vol: 0.3 * v }); },
    cannon(p, v) {
      A.noise({ filter: 'lowpass', f0: 1800 * p, f1: 60, dur: 0.9, vol: 0.9 * v, verb: true });
      A.tone({ type: 'sine', f0: 90 * p, f1: 25, dur: 0.7, vol: 0.9 * v });
      A.tone({ type: 'square', f0: 60 * p, f1: 30, dur: 0.25, vol: 0.2 * v, filter: 'lowpass', ff: 400 });
    },
    explode(p, v) {
      A.noise({ filter: 'lowpass', f0: 2400 * p, f1: 80, dur: 0.8, vol: 0.8 * v, verb: true });
      A.tone({ type: 'sine', f0: 70 * p, f1: 28, dur: 0.6, vol: 0.7 * v });
    },
    fire(p, v) { A.noise({ filter: 'bandpass', f0: 600 * p, f1: 1400, q: 0.6, dur: 0.35, vol: 0.35 * v, attack: 0.03 }); },
    magic(p, v) {
      [0, 4, 7, 12].forEach((s, i) => A.tone({ type: 'sine', f0: 660 * p * Math.pow(2, s / 12), dur: 0.35, vol: 0.12 * v, t: A.ctx.currentTime + i * 0.035, verb: true }));
    },
    pickup(p, v) {
      A.tone({ type: 'square', f0: 880 * p, dur: 0.06, vol: 0.12 * v, filter: 'lowpass', ff: 3000 });
      A.tone({ type: 'square', f0: 1320 * p, dur: 0.12, vol: 0.12 * v, t: A.ctx.currentTime + 0.06, filter: 'lowpass', ff: 3000 });
    },
    coin(p, v) {
      A.tone({ type: 'square', f0: 1568 * p, dur: 0.05, vol: 0.1 * v });
      A.tone({ type: 'square', f0: 2093 * p, dur: 0.18, vol: 0.1 * v, t: A.ctx.currentTime + 0.05 });
    },
    heal(p, v) {
      [0, 4, 7, 12, 16].forEach((s, i) => A.tone({ type: 'triangle', f0: 523 * p * Math.pow(2, s / 12), dur: 0.2, vol: 0.16 * v, t: A.ctx.currentTime + i * 0.05, verb: true }));
    },
    jump(p, v) { A.noise({ filter: 'bandpass', f0: 500 * p, f1: 1200, q: 1, dur: 0.12, vol: 0.14 * v }); },
    land(p, v) { A.tone({ type: 'sine', f0: 90 * p, f1: 40, dur: 0.1, vol: 0.3 * v }); A.noise({ filter: 'lowpass', f0: 600, dur: 0.08, vol: 0.15 * v }); },
    thud(p, v) { // 敵が倒れる
      A.tone({ type: 'sine', f0: 80 * p, f1: 35, dur: 0.22, vol: 0.55 * v });
      A.noise({ filter: 'lowpass', f0: 900, f1: 100, dur: 0.25, vol: 0.35 * v });
    },
    hurt(p, v) {
      A.tone({ type: 'sawtooth', f0: 240 * p, f1: 120, dur: 0.2, vol: 0.18 * v, filter: 'bandpass', ff: 800, q: 2 });
      A.noise({ filter: 'lowpass', f0: 1500, f1: 200, dur: 0.12, vol: 0.4 * v });
    },
    growl(p, v) { // 雑魚の断末魔
      A.tone({ type: 'sawtooth', f0: 150 * p, f1: 60, dur: 0.45, vol: 0.2 * v, filter: 'lowpass', ff: 900, vib: 22, vibAmt: 18 });
      A.noise({ filter: 'bandpass', f0: 500 * p, f1: 200, q: 2, dur: 0.4, vol: 0.2 * v });
    },
    roar(p, v) { // ボスの咆哮
      A.tone({ type: 'sawtooth', f0: 110 * p, f1: 55, dur: 1.2, vol: 0.35 * v, filter: 'lowpass', ff: 1200, ff1: 300, vib: 16, vibAmt: 14, verb: true });
      A.tone({ type: 'sawtooth', f0: 82 * p, f1: 40, dur: 1.2, vol: 0.3 * v, filter: 'lowpass', ff: 700, vib: 11, vibAmt: 10 });
      A.noise({ filter: 'bandpass', f0: 700 * p, f1: 250, q: 1.3, dur: 1.1, vol: 0.4 * v, attack: 0.05 });
    },
    spirit(p, v) { // 悪霊のうめき
      A.tone({ type: 'sine', f0: 520 * p, f1: 300, dur: 0.8, vol: 0.12 * v, vib: 6, vibAmt: 30, verb: true, attack: 0.1 });
      A.noise({ filter: 'bandpass', f0: 1400 * p, q: 8, dur: 0.6, vol: 0.12 * v, attack: 0.1 });
    },
    grab(p, v) { A.noise({ filter: 'lowpass', f0: 1200 * p, dur: 0.08, vol: 0.4 * v }); A.tone({ type: 'sine', f0: 200 * p, f1: 120, dur: 0.08, vol: 0.3 * v }); },
    awaken(p, v) {
      A.tone({ type: 'sawtooth', f0: 40 * p, f1: 160, dur: 1.2, vol: 0.4 * v, filter: 'lowpass', ff: 300, ff1: 2400, verb: true, attack: 0.2 });
      A.noise({ filter: 'bandpass', f0: 200, f1: 3000, q: 0.8, dur: 1.2, vol: 0.4 * v, attack: 0.3 });
      S.roar(p * 1.1, v * 0.7);
    },
    select(p, v) { A.tone({ type: 'square', f0: 660 * p, dur: 0.05, vol: 0.08 * v, filter: 'lowpass', ff: 2000 }); },
    confirm(p, v) {
      A.tone({ type: 'sawtooth', f0: 220 * p, dur: 0.5, vol: 0.18 * v, filter: 'lowpass', ff: 2000, ff1: 300, verb: true });
      A.noise({ filter: 'bandpass', f0: 2000 * p, f1: 300, dur: 0.35, vol: 0.3 * v });
      A.tone({ type: 'sine', f0: 110 * p, f1: 55, dur: 0.5, vol: 0.4 * v });
    },
    thunder(p, v) { // 雷鳴
      A.noise({ filter: 'lowpass', f0: 520 * p, f1: 60, dur: 1.0, vol: 0.55 * v, attack: 0.03, rate: 0.5, verb: true });
      A.tone({ type: 'sine', f0: 52 * p, f1: 28, dur: 1.2, vol: 0.35 * v });
    },
    bell(p, v) { // 鐘（ステージ開始など）
      [1, 2.0, 2.76, 4.07, 5.4].forEach((m, i) => A.tone({ type: 'sine', f0: 196 * p * m, dur: 2.2 - i * 0.3, vol: 0.2 * v / (i + 1), verb: true }));
    },
  };

  /** 効果音を鳴らす。同名連打は間引く */
  A.sfx = function (name, opt) {
    if (!A.ctx || A.ctx.state !== 'running' || A.muted) return;
    const fn = S[name];
    if (!fn) return;
    opt = opt || {};
    const now = A.ctx.currentTime, key = opt.pitch ? name + '@' + opt.pitch : name; // 音程違いの重ね鳴らしは間引かない
    if (A._lastSfx[key] && now - A._lastSfx[key] < 0.025) return;
    A._lastSfx[key] = now;
    try { fn((opt.pitch || 1) * U.rand(0.96, 1.04), opt.vol == null ? 1 : opt.vol); } catch (e) { /* ignore */ }
  };

  // ------------------------------------------------------------ music
  const NOTE = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
  function noteToMidi(tok) {
    const m = /^([a-g])([#b]?)(-?\d)$/.exec(tok);
    if (!m) return null;
    let n = NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 12 * (parseInt(m[3], 10) + 1) + n;
  }
  A.midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
  /** 記法文字列 → ステップ配列 */
  A.parseSeq = function (str) {
    const out = [];
    for (let tok of str.replace(/\|/g, ' ').split(/\s+/)) {
      if (!tok) continue;
      if (tok === '.') { out.push(null); continue; }
      if (tok === '-') { out.push('-'); continue; }
      let vel = 1;
      if (tok.endsWith('!')) { vel = 1.35; tok = tok.slice(0, -1); }
      else if (tok.endsWith('?')) { vel = 0.55; tok = tok.slice(0, -1); }
      if (tok === 'x') { out.push({ n: [0], v: vel }); continue; }
      const ns = tok.split('+').map(noteToMidi).filter(n => n != null);
      out.push(ns.length ? { n: ns, v: vel } : null);
    }
    return out;
  };

  // 楽器: (t, midi, dur(sec), vel, dest)
  const INST = A.inst = {
    kick(t, n, d, v, o) {
      A.tone({ t, type: 'sine', f0: 150, f1: 42, slide: 0.12, dur: 0.35, vol: 0.9 * v, dest: o });
      A.noise({ t, filter: 'lowpass', f0: 1200, dur: 0.03, vol: 0.25 * v, dest: o });
    },
    taiko(t, n, d, v, o) {
      A.tone({ t, type: 'sine', f0: 110, f1: 55, slide: 0.2, dur: 0.6, vol: 0.9 * v, dest: o, verb: true });
      A.noise({ t, filter: 'lowpass', f0: 700, f1: 200, dur: 0.25, vol: 0.4 * v, dest: o });
    },
    snare(t, n, d, v, o) {
      A.noise({ t, filter: 'bandpass', f0: 1800, q: 0.7, dur: 0.18, vol: 0.45 * v, dest: o, verb: true });
      A.tone({ t, type: 'triangle', f0: 220, f1: 150, dur: 0.1, vol: 0.25 * v, dest: o });
    },
    hat(t, n, d, v, o) { A.noise({ t, filter: 'highpass', f0: 7000, dur: 0.045, vol: 0.14 * v, dest: o }); },
    ohat(t, n, d, v, o) { A.noise({ t, filter: 'highpass', f0: 6000, dur: 0.22, vol: 0.12 * v, dest: o }); },
    crash(t, n, d, v, o) { A.noise({ t, filter: 'highpass', f0: 3500, dur: 1.4, vol: 0.2 * v, dest: o, verb: true }); },
    anvil(t, n, d, v, o) { // 金床（鍛冶屋の打撃音）
      [1, 2.76, 5.4].forEach((m, i) => A.tone({ t, type: 'sine', f0: 880 * m, dur: 0.4 - i * 0.1, vol: 0.14 * v / (i + 1), dest: o, verb: true }));
    },
    bass(t, n, d, v, o) {
      const f = A.midiHz(n);
      A.tone({ t, type: 'sawtooth', f0: f, dur: Math.max(0.12, d), vol: 0.34 * v, filter: 'lowpass', ff: 520, q: 4, dest: o });
      A.tone({ t, type: 'sine', f0: f / 2, dur: Math.max(0.12, d), vol: 0.3 * v, dest: o });
    },
    dist(t, n, d, v, o) { // 歪んだギター風パワーコード
      const f = A.midiHz(n);
      [1, 1.5, 2].forEach((m, i) => {
        A.tone({ t, type: 'square', f0: f * m, dur: Math.max(0.1, d), vol: 0.09 * v, detune: i ? 6 : -6, filter: 'lowpass', ff: 1800, q: 2, dest: o });
      });
    },
    pad(t, n, d, v, o) {
      const f = A.midiHz(n);
      [-9, 0, 9].forEach(dt => A.tone({ t, type: 'sawtooth', f0: f, detune: dt, attack: Math.min(0.4, d * 0.4), dur: d + 0.25, vol: 0.06 * v, filter: 'lowpass', ff: 1100, dest: o, verb: true }));
    },
    choir(t, n, d, v, o) { // 「アー」という声のような合唱パッド
      const c = A.ctx, f = A.midiHz(n);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.11 * v, t + Math.min(0.35, d * 0.5));
      g.gain.setValueAtTime(0.11 * v, t + d);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.5);
      const f1 = c.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 800; f1.Q.value = 6;
      const f2 = c.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1150; f2.Q.value = 7;
      const mix = c.createGain(); mix.gain.value = 2.2;
      [-7, 0, 7].forEach(dt => {
        const os = c.createOscillator(); os.type = 'sawtooth'; os.frequency.value = f; os.detune.value = dt;
        const lf = c.createOscillator(), lg = c.createGain(); lf.frequency.value = 5 + Math.random(); lg.gain.value = 3;
        lf.connect(lg); lg.connect(os.detune);
        os.connect(f1); os.connect(f2);
        os.start(t); os.stop(t + d + 0.6); lf.start(t); lf.stop(t + d + 0.6);
      });
      f1.connect(mix); f2.connect(mix); mix.connect(g); g.connect(o); g.connect(A.verbSend);
    },
    lead(t, n, d, v, o) {
      const f = A.midiHz(n);
      A.tone({ t, type: 'sawtooth', f0: f, dur: d + 0.08, vol: 0.1 * v, filter: 'lowpass', ff: 2600, vib: 5.5, vibAmt: 4, dest: o, verb: true, attack: 0.02 });
      A.tone({ t, type: 'square', f0: f, detune: 7, dur: d + 0.08, vol: 0.05 * v, filter: 'lowpass', ff: 2000, dest: o });
    },
    strings(t, n, d, v, o) {
      const f = A.midiHz(n);
      [-6, 6].forEach(dt => A.tone({ t, type: 'sawtooth', f0: f, detune: dt, attack: 0.08, dur: d + 0.2, vol: 0.07 * v, filter: 'lowpass', ff: 2400, vib: 5, vibAmt: 3, dest: o, verb: true }));
    },
    pluck(t, n, d, v, o) { // リュート / ハープ風
      const f = A.midiHz(n);
      A.tone({ t, type: 'triangle', f0: f, dur: 0.6, vol: 0.2 * v, dest: o, verb: true });
      A.tone({ t, type: 'sawtooth', f0: f, dur: 0.25, vol: 0.06 * v, filter: 'lowpass', ff: 3000, ff1: 400, dest: o });
    },
    bell(t, n, d, v, o) {
      const f = A.midiHz(n);
      [1, 2.4, 3.9].forEach((m, i) => A.tone({ t, type: 'sine', f0: f * m, dur: 1.6 - i * 0.4, vol: 0.1 * v / (i + 1), dest: o, verb: true }));
    },
    organ(t, n, d, v, o) {
      const f = A.midiHz(n);
      [1, 2, 3, 4].forEach((m, i) => A.tone({ t, type: 'sine', f0: f * m, dur: d + 0.1, attack: 0.02, vol: 0.06 * v / (i + 1), dest: o, verb: true }));
    },
  };

  A.playSong = function (id, opt) {
    if (A.songId === id && A.song) return;
    const def = A.songs[id];
    A.stopSong();
    if (!def) return;
    if (!A.ctx) { A._pendingSong = id; return; }
    // 曲データを前処理
    const steps = (def.steps || 16) * (def.bars || 1);
    const tracks = def.tracks.map(tr => {
      let seq = typeof tr.seq === 'string' ? A.parseSeq(tr.seq) : tr.seq;
      return { inst: INST[tr.inst], vol: tr.vol == null ? 1 : tr.vol, seq, oct: tr.oct || 0, len: seq.length };
    });
    const bus = A.ctx.createGain(); bus.gain.value = 0.0001; bus.connect(A.musBus);
    bus.gain.exponentialRampToValueAtTime(1, A.ctx.currentTime + (opt && opt.fade || 0.3));
    A.song = { def, tracks, steps, step: 0, next: A.ctx.currentTime + 0.08, dt: 60 / def.bpm / ((def.steps || 16) / 4), bus, once: !!def.once, done: false };
    A.songId = id;
  };
  A.stopSong = function (fade) {
    if (A.song && A.ctx) {
      const b = A.song.bus, t = A.ctx.currentTime;
      try { b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value, t); b.gain.exponentialRampToValueAtTime(0.0001, t + (fade || 0.25)); } catch (e) { /* ignore */ }
      setTimeout(() => { try { b.disconnect(); } catch (e) { /* ignore */ } }, ((fade || 0.25) + 0.3) * 1000);
    }
    A.song = null; A.songId = null; A._pendingSong = null;
  };
  /** 毎フレーム呼ばれる先読みスケジューラ */
  A.tick = function () {
    const s = A.song;
    if (!s || !A.ctx || A.ctx.state !== 'running' || s.done) return;
    const horizon = A.ctx.currentTime + 0.14;
    if (s.next < A.ctx.currentTime - 0.3) s.next = A.ctx.currentTime + 0.02; // 復帰時の遅延を吸収
    while (s.next < horizon) {
      if (!A.muted) for (const tr of s.tracks) { // ミュート中は音を作らず、曲の位置だけ進める
        if (!tr.inst || !tr.len) continue;
        const ev = tr.seq[s.step % tr.len];
        if (!ev || ev === '-') continue;
        // 音の長さ = 続く '-' の数
        let len = 1;
        while (s.step + len < s.steps && tr.seq[(s.step + len) % tr.len] === '-' && len < tr.len) len++;
        const dur = len * s.dt;
        for (const n of ev.n) {
          try { tr.inst(s.next, n + tr.oct, dur * 0.95, ev.v * tr.vol, s.bus); } catch (e) { /* ignore */ }
        }
      }
      s.step++;
      s.next += s.dt;
      if (s.step >= s.steps) {
        if (s.once) { s.done = true; break; }
        s.step = s.def.loopFrom ? s.def.loopFrom * (s.def.steps || 16) : 0;
      }
    }
  };

  // 仮の曲（audio_music.js で上書きされる）
  A.songs.placeholder = {
    bpm: 120, steps: 16, bars: 1,
    tracks: [
      { inst: 'kick', seq: 'x . . . x . . . x . . . x . . .' },
      { inst: 'bass', seq: 'a1 - - - . . . . f1 - - - . . . .' },
    ],
  };
})(window.BK);

</script>
<script>/* js/audio_music.js */
'use strict';
/* =====================================================================
