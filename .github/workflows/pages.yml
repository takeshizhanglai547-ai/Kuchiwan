name: Deploy to GitHub Pages

# 公開サイトは main だけが更新する。
# 開発ブランチをここに足すと、そのブランチの内容でサイト全体（path: ".") が
# 置き換わり、main にある他のゲームが 404 になる。実際に 2026-08-08 に
# beltaction.html が消える事故が起きた。プレビューが要る場合は
# 別リポジトリか、artifact のダウンロードで確認すること。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
