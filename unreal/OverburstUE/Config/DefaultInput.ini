; ============================================================================
;  OVERBURST — input configuration.
;
;  THE BINDINGS ARE NOT IN THIS FILE.
;
;  Controls use Enhanced Input, so the mapping lives in an
;  UInputMappingContext (IMC_Overburst) with one UInputAction per verb. Because
;  this project must open in a clean engine install with NOTHING to import,
;  that context is BUILT IN C++ at runtime by UObInputConfig::CreateDefault()
;  rather than shipped as .uasset files that no one here can author. See
;  Source/OverburstUE/Public/ObInputConfig.h for the actual key list.
;
;  A designer who wants to rebind can create real IMC/IA assets in the editor
;  and assign them on the AObMechPawn (or on a UObInputConfig data asset); the
;  C++ defaults are only used when those slots are empty.
;
;  What IS here is the plumbing that makes Enhanced Input the active system and
;  the mouse behave like a mech cockpit rather than a desktop cursor.
; ============================================================================

[/Script/Engine.InputSettings]
; Enhanced Input. Without these two lines the EnhancedInputComponent is never
; created and every binding silently does nothing.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; Pointer capture. The web build uses pointer lock; this is the equivalent.
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bDefaultViewportMouseLock=True
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True

; RAW mouse delta, unsmoothed and unaccelerated.
;
; This matters more than it looks. ob::MechMover applies cfg::Cam::Sens to the
; look delta ITSELF - aim is gameplay maths and lives in ObCore, so the host
; must hand it device counts, not a pre-cooked turn rate. Engine-side smoothing
; would put a second, untested filter in front of a solver whose feel was tuned
; against raw counts.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bEnableFOVScaling=False

; Legacy axis/action mappings are intentionally absent. Anything added here
; would bypass Enhanced Input and, worse, bypass ObCore's aim handling.

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
; Off: this project registers its context explicitly through the local player
; subsystem in AObMechPawn::PawnClientRestart, so an auto-registered default
; context would be a second, invisible source of bindings.
bEnableDefaultMappingContexts=False
bSendTriggeredEventsWhenInputIsFlushed=False
