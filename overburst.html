* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

#gl { display: block; width: 100vw; height: 100vh; }
#ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

.hidden { display: none !important; }

  pointer-events: auto; padding: 14px 46px; background: transparent;

}

#combat-hud { position: absolute; inset: 0; }
#ap-bar, #en-bar { position: absolute; left: 40px; width: 420px; height: 12px; border: 1px solid #2a4a52; }
#ap-bar { bottom: 74px; }
#en-bar { bottom: 54px; height: 7px; }
#ap-bar i, #en-bar i { display: block; height: 100%; background: #5ff4ff; }
#reticle {
  position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
  margin: -13px 0 0 -13px; border: 1px solid #5ff4ff; border-radius: 50%;
}
#result-text { font-size: 56px; letter-spacing: .2em; }
